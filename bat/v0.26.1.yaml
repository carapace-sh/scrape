# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: bat
description: A cat(1) clone with wings.
flags:
  --acknowledgements: Show acknowledgements.
  --binary=:
    description: 'How to treat binary content. (default: no-printing)'
    default: no-printing
  --cache-dir&: Show bat's cache directory.
  -S, --chop-long-lines: Truncate all lines longer than screen width. Alias for '--wrap=never'.
  --color=:
    description: When to use colors (*auto*, never, always).
    default: auto
  --completion=: 'Show shell completion for a certain shell. [possible values: bash, fish, zsh, ps1]'
  --config-dir&: Show bat's configuration directory.
  --config-file&: Show path to the configuration file.
  --decorations=:
    description: When to show the decorations (*auto*, never, always).
    default: auto
  --diagnostic: Show diagnostic information for bug reports.
  --diagnostics&: Show diagnostic information for bug reports.
  -d, --diff: Only show lines that have been added/removed/modified.
  --diff-context=: ''
  --file-name=*: Specify the name to display for a file.
  -f, --force-colorization: ''
  --generate-config-file&: Generates a default configuration file.
  -h, --help: Print help (see more with '--help')
  -H, --highlight-line=*: Highlight lines N through M.
  --ignored-suffix=*: |-
    Ignore extension. For example:
      'bat --ignored-suffix ".dev" my_file.json.dev' will use JSON syntax, and ignore '.dev'
  --italic-text=:
    description: Use italics in output (always, *never*)
    default: never
  -l, --language=: Set the language for syntax highlighting.
  -r, --line-range=*: Only print the lines from N to M.
  -L, --list-languages: Display all supported languages.
  --list-themes: Display all supported highlighting themes.
  -m, --map-syntax=*: Use the specified syntax for files matching the glob pattern ('*.cpp:C++').
  --no-config&: Do not use the configuration file
  --no-custom-assets&: Do not load custom assets
  -P, --no-paging&: Alias for '--paging=never'
  --no-pager&: Alias for '--paging=never'
  --nonprintable-notation=:
    description: Set notation for non-printable characters.
    default: unicode
  -n, --number: Show line numbers (alias for '--style=numbers').
  --pager=: Determine which pager to use.
  --paging=:
    description: Specify when to use the pager, or use `-P` to disable (*auto*, never, always).
    default: auto
  -p, --plain*: Show plain style (alias for '--style=plain').
  --set-terminal-title: Sets terminal title to filenames when using a pager.
  -A, --show-all: Show non-printable characters (space, tab, newline, ..).
  --show-nonprintable&: Show non-printable characters (space, tab, newline, ..).
  -s, --squeeze-blank: Squeeze consecutive empty lines.
  --squeeze-limit=: ''
  --strip-ansi=:
    description: Strip colors from the input (auto, always, *never*)
    default: never
  --style=*: Comma-separated list of style elements to display (*default*, auto, full, plain, changes, header, header-filename, header-filesize, grid, rule, numbers, snip).
  --tabs=: Set the tab width to T spaces.
  --terminal-width=: 'Explicitly set the width of the terminal instead of determining it automatically. If prefixed with ''+'' or ''-'', the value will be treated as an offset to the actual terminal width. See also: ''--wrap''.'
  --theme=: Set the color theme for syntax highlighting.
  --theme-dark=: Sets the color theme for syntax highlighting used for dark backgrounds.
  --theme-light=: Sets the color theme for syntax highlighting used for light backgrounds.
  -u, --unbuffered: ''
  -V, --version: Print version
  --wrap=:
    description: Specify the text-wrapping mode (*auto*, never, character).
    default: auto
completion:
  flag:
    binary:
    - no-printing
    - as-text
    color:
    - auto
    - never
    - always
    completion:
    - bash
    - fish
    - ps1
    - zsh
    decorations:
    - auto
    - never
    - always
    file-name:
    - $files
    italic-text:
    - always
    - never
    nonprintable-notation:
    - unicode
    - caret
    paging:
    - auto
    - never
    - always
    strip-ansi:
    - auto
    - always
    - never
    wrap:
    - auto
    - never
    - character
  positionalany:
  - $files
documentation:
  command: A cat(1) clone with syntax highlighting and Git integration.
  flag:
    binary: |-
      How to treat binary content. (default: no-printing)

      Possible values:
        * no-printing: do not print any binary content
        * as-text: treat binary content as normal text
    color: |-
      Specify when to use colored output. The automatic mode only enables colors if an interactive terminal is detected - colors are automatically disabled if the output goes to a pipe.
      Possible values: *auto*, never, always.
    decorations: 'Specify when to use the decorations that have been specified via ''--style''. The automatic mode only enables decorations if an interactive terminal is detected. The always mode will show decorations even when piping output. Possible values: *auto*, never, always.'
    diff: Only show lines that have been added/removed/modified with respect to the Git index. Use --diff-context=N to control how much context you want to see.
    diff-context: Include N lines of context around added/removed/modified lines when using '--diff'.
    file-name: Specify the name to display for a file. Useful when piping data to bat from STDIN when bat does not otherwise know the filename. Note that the provided file name is also used for syntax detection.
    force-colorization: Alias for '--decorations=always --color=always'. This is useful if the output of bat is piped to another program, but you want to keep the colorization/decorations.
    help: Print help (see a summary with '-h')
    highlight-line: |-
      Highlight the specified line ranges with a different background color For example:
        '--highlight-line 40' highlights line 40
        '--highlight-line 30:40' highlights lines 30 to 40
        '--highlight-line :40' highlights lines 1 to 40
        '--highlight-line 40:' highlights lines 40 to the end of the file
        '--highlight-line 30:+10' highlights lines 30 to 40
    italic-text: 'Specify when to use ANSI sequences for italic text in the output. Possible values: always, *never*.'
    language: Explicitly set the language for syntax highlighting. The language can be specified as a name (like 'C++' or 'LaTeX') or possible file extension (like 'cpp', 'hpp' or 'md'). Use '--list-languages' to show all supported language names and file extensions.
    line-range: |-
      Only print the specified range of lines for each file. For example:
        '--line-range 30:40' prints lines 30 to 40
        '--line-range :40' prints lines 1 to 40
        '--line-range 40:' prints lines 40 to the end of the file
        '--line-range 40' only prints line 40
        '--line-range -10:' prints the last 10 lines
        '--line-range 30:+10' prints lines 30 to 40
        '--line-range 35::5' prints lines 30 to 40 (line 35 with 5 lines of context)
        '--line-range 30:40:2' prints lines 28 to 42 (range 30-40 with 2 lines of context)
    list-languages: Display a list of supported languages for syntax highlighting.
    list-themes: Display a list of supported themes for syntax highlighting.
    map-syntax: Map a glob pattern to an existing syntax name. The glob pattern is matched on the full path and the filename. For example, to highlight *.build files with the Python syntax, use -m '*.build:Python'. To highlight files named '.myignore' with the Git Ignore syntax, use -m '.myignore:Git Ignore'. Note that the right-hand side is the *name* of the syntax, not a file extension.
    nonprintable-notation: |-
      Set notation for non-printable characters.

      Possible values:
        * unicode (␇, ␊, ␀, ..)
        * caret   (^G, ^J, ^@, ..)
    number: Only show line numbers, no other decorations. This is an alias for '--style=numbers'
    pager: 'Determine which pager is used. This option will override the PAGER and BAT_PAGER environment variables. The default pager is ''less''. If you provide ''--pager=builtin'', use the built-in ''minus'' pager. To control when the pager is used, see the ''--paging'' option. Example: ''--pager "less -RF"''.'
    paging: 'Specify when to use the pager. To disable the pager, use ''--paging=never'' or its alias,''-P''. To disable the pager permanently, set BAT_PAGING to ''never''. To control which pager is used, see the ''--pager'' option. Possible values: *auto*, never, always.'
    plain: Only show plain style, no decorations. This is an alias for '--style=plain'. When '-p' is used twice ('-pp'), it also disables automatic paging (alias for '--style=plain --paging=never').
    show-all: Show non-printable characters like space, tab or newline. This option can also be used to print binary files. Use '--tabs' to control the width of the tab-placeholders.
    squeeze-blank: Squeeze consecutive empty lines into a single empty line.
    squeeze-limit: Set the maximum number of consecutive empty lines to be printed.
    strip-ansi: 'Specify when to strip ANSI escape sequences from the input. The automatic mode will remove escape sequences unless the syntax highlighting language is plain text. Possible values: auto, always, *never*.'
    style: |-
      Configure which elements (line numbers, file headers, grid borders, Git modifications, ..) to display in addition to the file contents. The argument is a comma-separated list of components to display (e.g. 'numbers,changes,grid') or a pre-defined style ('full'). To set a default style, add the '--style=".."' option to the configuration file or export the BAT_STYLE environment variable (e.g.: export BAT_STYLE="..").

      When styles are specified in multiple places, the "nearest" set of styles take precedence. The command-line arguments are the highest priority, followed by the BAT_STYLE environment variable, and then the configuration file. If any set of styles consists entirely of components prefixed with "+" or "-", it will modify the previous set of styles instead of replacing them.

      By default, the following components are enabled:
        changes, grid, header-filename, numbers, snip

      Possible values:

        * default: enables recommended style components (default).
        * full: enables all available components.
        * auto: same as 'default', unless the output is piped.
        * plain: disables all available components.
        * changes: show Git modification markers.
        * header: alias for 'header-filename'.
        * header-filename: show filenames before the content.
        * header-filesize: show file sizes before the content.
        * grid: vertical/horizontal lines to separate side bar
                and the header from the content.
        * rule: horizontal lines to delimit files.
        * numbers: show line numbers in the side bar.
        * snip: draw separation lines between distinct line ranges.
    tabs: Set the tab width to T spaces. Use a width of 0 to pass tabs through directly
    theme: |-
      Set the theme for syntax highlighting. Use '--list-themes' to see all available themes. To set a default theme, add the '--theme="..."' option to the configuration file or export the BAT_THEME environment variable (e.g.: export BAT_THEME="...").

      Special values:

        * auto: Picks a dark or light theme depending on the terminal's colors (default).
                Use '--theme-light' and '--theme-dark' to customize the selected theme.
          * auto:always: Detect the terminal's colors even when the output is redirected.
          * auto:system: Detect the color scheme from the system-wide preference (macOS only).
        * dark: Use the dark theme specified by '--theme-dark'.
        * light: Use the light theme specified by '--theme-light'.
    theme-dark: Sets the theme name for syntax highlighting used when the terminal uses a dark background. Use '--list-themes' to see all available themes. To set a default theme, add the '--theme-dark="..." option to the configuration file or export the BAT_THEME_DARK environment variable (e.g. export BAT_THEME_DARK="...").
    theme-light: Sets the theme name for syntax highlighting used when the terminal uses a light background. Use '--list-themes' to see all available themes. To set a default theme, add the '--theme-light="..." option to the configuration file or export the BAT_THEME_LIGHT environment variable (e.g. export BAT_THEME_LIGHT="...").
    unbuffered: This option exists for POSIX-compliance reasons ('u' is for 'unbuffered'). The output is always unbuffered - this option is simply ignored.
    wrap: Specify the text-wrapping mode (*auto*, never, character). The '--terminal-width' option can be used in addition to control the output width.
