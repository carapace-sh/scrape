# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: nfpm
description: Packages apps on RPM, Deb, APK, Arch Linux, ipk, and MSIX formats based on a YAML configuration file
commands:
    - name: completion
      description: Generate the autocompletion script for the specified shell
      commands:
        - name: bash
          description: Generate the autocompletion script for bash
          flags:
            --no-descriptions: disable completion descriptions
        - name: fish
          description: Generate the autocompletion script for fish
          flags:
            --no-descriptions: disable completion descriptions
        - name: powershell
          description: Generate the autocompletion script for powershell
          flags:
            --no-descriptions: disable completion descriptions
        - name: zsh
          description: Generate the autocompletion script for zsh
          flags:
            --no-descriptions: disable completion descriptions
    - name: docs
      description: Generates nFPM's command line docs
      hidden: true
    - name: help [command]
      description: Help about any command
    - name: init
      aliases:
        - i
      description: Creates a sample nfpm.yaml configuration file
      flags:
        -f, --config=: path to the to-be-created config file
    - name: jsonschema
      aliases:
        - schema
      description: Outputs nFPM's JSON schema
      flags:
        -o, --output=: where to save the json schema
    - name: man
      description: Generates manpages
      hidden: true
    - name: package
      aliases:
        - pkg
        - p
      description: Creates a package based on the given config file and flags
      flags:
        -f, --config=: config file to be used
        -p, --packager=: which packager implementation to use [apk|archlinux|deb|ipk|msix|rpm|srpm]
        -t, --target=: where to save the generated package (filename, folder or empty for current folder)
