# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: nfpm
description: Packages apps on RPM, Deb, APK, Arch Linux, ipk, and MSIX formats based on a YAML configuration file
commands:
  - name: completion
    description: Generate the autocompletion script for the specified shell
    commands:
      - name: bash
        description: Generate the autocompletion script for bash
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the bash shell.

            This script depends on the 'bash-completion' package.
            If it is not installed already, you can install it via your OS's package manager.

            To load completions in your current shell session:

            	source <(nfpm completion bash)

            To load completions for every new session, execute once:

            #### Linux:

            	nfpm completion bash > /etc/bash_completion.d/nfpm

            #### macOS:

            	nfpm completion bash > $(brew --prefix)/etc/bash_completion.d/nfpm

            You will need to start a new shell for this setup to take effect.
      - name: fish
        description: Generate the autocompletion script for fish
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the fish shell.

            To load completions in your current shell session:

            	nfpm completion fish | source

            To load completions for every new session, execute once:

            	nfpm completion fish > ~/.config/fish/completions/nfpm.fish

            You will need to start a new shell for this setup to take effect.
      - name: powershell
        description: Generate the autocompletion script for powershell
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for powershell.

            To load completions in your current shell session:

            	nfpm completion powershell | Out-String | Invoke-Expression

            To load completions for every new session, add the output of the above command
            to your powershell profile.
      - name: zsh
        description: Generate the autocompletion script for zsh
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the zsh shell.

            If shell completion is not already enabled in your environment you will need
            to enable it.  You can execute the following once:

            	echo "autoload -U compinit; compinit" >> ~/.zshrc

            To load completions in your current shell session:

            	source <(nfpm completion zsh)

            To load completions for every new session, execute once:

            #### Linux:

            	nfpm completion zsh > "${fpath[1]}/_nfpm"

            #### macOS:

            	nfpm completion zsh > $(brew --prefix)/share/zsh/site-functions/_nfpm

            You will need to start a new shell for this setup to take effect.
    documentation:
      command: |
        Generate the autocompletion script for nfpm for the specified shell.
        See each sub-command's help for details on how to use the generated script.
  - name: docs
    description: Generates nFPM's command line docs
    hidden: true
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type nfpm help [path to command] for full details.
  - name: init
    aliases:
      - i
    description: Creates a sample nfpm.yaml configuration file
    flags:
      -f, --config=:
        description: path to the to-be-created config file
        default: nfpm.yaml
  - name: jsonschema
    aliases:
      - schema
    description: Outputs nFPM's JSON schema
    flags:
      -o, --output=:
        description: where to save the json schema
        default: '-'
  - name: man
    description: Generates manpages
    hidden: true
  - name: package
    aliases:
      - pkg
      - p
    description: Creates a package based on the given config file and flags
    flags:
      -f, --config=:
        description: config file to be used
        default: nfpm.yaml
      -p, --packager=: which packager implementation to use [apk|archlinux|deb|ipk|msix|rpm|srpm]
      -t, --target=: where to save the generated package (filename, folder or empty for current folder)
documentation:
  command: nFPM is a simple and 0-dependencies apk, arch, deb, ipk, msix, and rpm packager written in Go.
