  - name: deploy-key <command>
    description: Manage deploy keys.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: add [key-file]
        description: Add a deploy key to a GitLab project.
        flags:
          -c, --can-push: If true, deploy keys can be used for pushing code to the repository.
          -e, --expires-at=: 'The expiration date of the deploy key, using the ISO-8601 format: YYYY-MM-DDTHH:MM:SSZ.'
          -t, --title=!: New deploy key's title.
        documentation:
          command: |
            Creates a new deploy key.

            Requires the '--title' flag.
      - name: delete <key-id>
        description: Deletes a single deploy key specified by the ID.
        documentation:
          command: |
            Pass the ID of the key to delete as an argument. Find key IDs by
            running `glab deploy-key list --show-id`. Use `--repo` to target a
            project other than the current one.

            This action is permanent and cannot be undone.
      - name: get <key-id>
        description: Returns a single deploy key specified by the ID.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Pass the ID of the key to return as an argument. Find key IDs by
            running `glab deploy-key list --show-id`. Use `--repo` to target a
            project other than the current one.

            By default, the command prints the key's title, public key, push access,
            and creation date. Use `--output json` to return the full key object.
      - name: list
        description: Get a list of deploy keys for the current project.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --show-id: Shows IDs of deploy keys.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            Each row shows the key's title, key, push access, and creation date.
            Pass `--show-id` to also display the key ID, which the `get` and `delete`
            commands accept as an argument. Use `--repo` to target a project other than
            the current one.
    documentation:
      command: |
        Add, list, get, and delete the deploy keys for a project.

        Deploy keys grant access to a repository over SSH without being tied to a
        user account, and are commonly used by CI/CD jobs and external systems.
        These commands operate on the current project. Use `--repo` to target
        another project.
  - name: duo [command]
    description: Work with GitLab Duo.
    commands:
      - name: ask <prompt>
        description: Generate Git commands from natural language.
        hidden: true
        flags:
          --git:
            description: Ask a question about Git.
            default: "true"
        documentation:
          command: |
            Generate Git commands from natural language using AI assistance.

            Describe what you want to do in plain language, and GitLab Duo suggests
            the appropriate Git commands. You receive both the commands and an explanation.

            After you receive the suggested commands, you can run them directly from
            the CLI. You must confirm each command before it runs.

            Use this command to:

            - Retrieve forgotten Git commands.
            - Learn how to accomplish specific Git operations.
            - Get guidance on complex Git workflows.
            - Reduce context switching during development.
      - name: cli [command]
        description: Run the GitLab Duo CLI.
        flags:
          --install: Install the GitLab Duo CLI binary without running it.
          --update: Check for and install updates to the binary. Same as the update command.
          -y, --yes: Skip confirmation prompts.
        commands:
          - name: update
            description: Update the GitLab Duo CLI binary to the latest compatible version.
            flags:
              -y, --yes: Skip the download prompt when the binary is not installed.
            documentation:
              command: |
                Checks for a newer GitLab Duo CLI version and installs it. If the binary is not installed yet, `glab` downloads the latest compatible version.

                Updates stay within the major version this version of `glab` supports. When a newer major version exists, update `glab` first.

                Updates do not apply when you use a custom binary set with `GLAB_DUO_CLI_BINARY_PATH` or the `duo_cli_binary_path` configuration key.

                `glab duo cli --update` does the same thing.
        documentation:
          command: |
            Run the GitLab Duo CLI (`duo`) through `glab`.

            The GitLab Duo CLI brings the GitLab Duo Agent Platform to your terminal. Ask GitLab Duo questions about your codebase and use it to autonomously perform actions on your behalf.

            The GitLab Duo CLI runs in two modes:

            - Interactive (default): `glab duo cli` opens a session for multiple prompts, with build and plan modes.
            - Headless: `glab duo cli run --goal "<prompt>"` runs a single prompt and exits. For use in runners, scripts, and automated workflows.

            When you use the GitLab Duo CLI through `glab`, `glab` handles authentication for you. You authenticate only once.

            Prerequisites:

            - Use GitLab 19.2 or later.
            - Run `glab auth login` to authenticate.
            - Meet the prerequisites for GitLab Duo Agent Platform.
            - Set a default GitLab Duo namespace, or run the command in a project that has GitLab Duo access.
            - For GitLab Self-Managed and GitLab Dedicated on 19.2 or later, turn on GitLab Duo CLI access. It is on by default.

            If you are on GitLab 18.11 to 19.1, you can use the GitLab Duo CLI by turning on beta and experimental features.

            Configuration options:

            - `duo_cli_auto_run`: Skip the run confirmation prompt.
            - `duo_cli_auto_download`: Skip the download confirmation prompt.

            Except for the `update` command, `glab` passes all other arguments and flags through to the GitLab Duo CLI binary. To see the GitLab Duo CLI commands and flags, run `glab duo cli help`.

            For more information, see the GitLab Duo CLI documentation.
    documentation:
      command: |
        Use the GitLab Duo Agent Platform in your terminal. Ask GitLab Duo questions about your codebase and use it to autonomously perform actions on your behalf.

        `glab duo cli` installs and runs the GitLab Duo CLI (`duo`) binary. `glab` handles authentication, so you sign in only once with `glab auth login`.

        The GitLab Duo CLI requires GitLab 19.2 or later, or GitLab 18.11 to 19.1 with beta and experimental features turned on. For all prerequisites and usage, see `glab duo cli --help`.
  - name: govern <command>
    description: Manage AI agent governance. (EXPERIMENTAL)
    commands:
      - name: audit <command>
        description: Manage AI agent audit events and sessions. (EXPERIMENTAL)
        commands:
          - name: sync
            description: Sync agent session data to GitLab. (EXPERIMENTAL)
            flags:
              --all: Sync all sessions recorded by the hooks. Used by the fallback periodic sync.
              --complete: Mark the session as completed. Used by the SessionEnd hook.
              --silent: Suppress all output. Used when invoked from hooks.
            persistentflags:
              -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
            exclusiveflags:
              - - all
                - repo
              - - all
                - complete
            documentation:
              command: |
                Read new entries from the local agent transcript since the last sync and POST them to GitLab as audit events.

                The audit events contain the prompts you type, each tool call with its arguments (such as commands, file paths, and edits, replaced with a marker when over 8 KB), each tool call's outcome, duration, and error message, and the model and token usage of each response. Tool output and the text of responses are not sent. A session that has never synced and has had no activity in the last 89 days is not uploaded, because GitLab does not accept events that old.

                Some agents record less:

                - OpenCode: prompts and responses are not sent, and a tool call's outcome is sent only if the call had finished when it was first synced.
                - Codex: a tool call's outcome is "completed", because Codex does not record whether it succeeded.
                - Cursor: only prompts and tool calls are sent, timed by the transcript's last modification, because Cursor records no results, token usage, or timestamps. A Cursor session is not synced if the files its tool calls read or write are outside the workspace glab finds, or if several directories match the workspace's name and those files don't show which, so that it is not uploaded to the wrong project.

                If a GitLab instance does not accept an agent's sessions yet, they are not uploaded, then or after the instance is upgraded. Sessions from after the upgrade are.

                Called by the Stop hook after every agent turn. Also used by the SessionEnd hook (with `--complete`) to mark the session as complete. The hooks also record the session's project, host, and transcript location so that `--all` can sync it later.

                Project is resolved from the Git remote of the current directory, or overridden with `-R/--repo`.

                With `--all`, syncs every session the hooks have recorded, each to the project and host it was recorded with. Sessions inactive for 24 hours are marked completed. Claude Code sessions are skipped while the glab Stop hook is missing from `~/.claude/settings.json`, so removing the hooks pauses them. The fallback periodic sync installed by `glab govern setup` runs this, and `glab govern doctor` shows the result of its last run.

                Supports Claude Code and OpenCode sessions recorded by hooks. OpenCode sessions are read with `opencode export`. With `--all`, it also finds and syncs the sessions of agents enabled with `glab govern setup --agents` (Codex and Cursor) by scanning their transcripts, for repositories on GitLab hosts glab is logged in to.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
        documentation:
          command: |
            Manage audit events and sessions for external AI agents.
            Sync session data from local agent transcripts to GitLab.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: doctor
        description: Diagnose AI agent governance configuration, authentication, and hook setup. (EXPERIMENTAL)
        documentation:
          command: |
            Check that AI agent governance is correctly configured on this machine.

            Verifies:

            - Authentication: glab is authenticated with a valid token
            - glab in PATH: the binary is findable so hooks will work
            - Claude Code hooks: Stop and SessionEnd hooks are installed
            - API connectivity: can reach the GitLab API
            - Fallback periodic sync: whether the scheduled job is installed and loaded, whether the glab binary it runs still exists, and the result of its last run

            Outputs a clear remediation command for any check that fails.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: setup
        description: Configure this machine to record AI agent sessions. (EXPERIMENTAL)
        flags:
          --agents=*: 'Also sync sessions from these agents, found by the fallback periodic sync without hooks: codex, cursor. Replaces the agents enabled by an earlier run. Multiple agents can be comma-separated or specified by repeating the flag.'
          --no-fallback-sync: Install only the hooks, without the fallback periodic sync job.
          --uninstall: Remove the fallback periodic sync job and stop syncing Codex and Cursor sessions. The hooks are left in place.
          -y, --yes: Skip confirmation prompt.
        exclusiveflags:
          - - agents
            - no-fallback-sync
          - - agents
            - uninstall
          - - no-fallback-sync
            - uninstall
        documentation:
          command: |
            Configure the current machine for AI agent governance session capture.

            Installs the following:

            - Stop hook in `~/.claude/settings.json`, which syncs the session after every agent turn.
            - SessionEnd hook in `~/.claude/settings.json`, which syncs the session and marks it completed.
            - Fallback periodic sync: a launchd agent (`~/Library/LaunchAgents/com.gitlab.glab-govern-audit-sync.plist`) on macOS, or a systemd user timer (`~/.config/systemd/user/glab-govern-audit-sync.timer`) on Linux.

            The fallback periodic sync runs `glab govern audit sync --all` every 30 minutes, and on Linux also 5 minutes after boot, until you remove it. It uploads anything the hooks missed for sessions they have already recorded (see `glab govern audit sync --help` for what is uploaded), using your stored glab credentials and the glab configuration directory in use when you run setup. Each session goes to the project and host of the Git repository the agent ran in. It also marks sessions completed once they have been idle for 24 hours. It pauses Claude Code sessions while the hooks are not installed. Pass `--no-fallback-sync` to install only the hooks. The fallback periodic sync is not available on Windows.

            Pass `--agents codex,cursor` to also sync Codex and Cursor sessions. glab installs no hooks for those agents: the fallback periodic sync finds their sessions by scanning their transcripts in `~/.codex/sessions` and `~/.cursor/projects`, including sessions from before you enabled them, and uploads those from repositories on GitLab hosts you are logged in to with glab. Their sessions are marked completed once they have been idle for 24 hours. Run setup again with a different `--agents` list to change which agents are synced, or with `--agents ""` to stop. Every setup prompt names the agents that are synced, and `--uninstall` also stops syncing them.

            Safe to run multiple times: existing hooks are not duplicated, and an existing fallback periodic sync job is replaced. Run `glab govern doctor` afterwards to verify the setup.

            Run `glab govern setup --uninstall` to remove the fallback periodic sync job. To remove the hooks, delete the `glab govern audit sync` entries from `~/.claude/settings.json`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Manage AI agent governance for external agents running against GitLab projects. Configure hooks and diagnose setup issues.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: gpg-key <command>
    description: Manage GPG keys registered with your GitLab account.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: add [key-file]
        description: Add a GPG key to your GitLab account.
        documentation:
          command: |
            Creates a new GPG key owned by the currently authenticated user.
      - name: delete <key-id>
        description: Deletes a single GPG key specified by the ID.
        documentation:
          command: |
            Pass the ID of the key to delete as an argument. Find key IDs by
            running `glab gpg-key list --show-id`.

            This action is permanent and cannot be undone.
      - name: get <key-id>
        description: Returns a single GPG key specified by the ID.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Pass the ID of the key to return as an argument. Find key IDs by
            running `glab gpg-key list --show-id`.

            By default, the command prints the key's ID, public key, and creation date.
            Use `--output json` to return the full key object.
      - name: list
        description: Get a list of GPG keys for the currently authenticated user.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --show-id: Shows IDs of GPG keys.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Each row shows the key and its creation date. Pass `--show-id` to
