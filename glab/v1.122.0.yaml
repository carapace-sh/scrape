# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: glab <command> <subcommand> [flags]
description: A GitLab CLI tool.
flags:
  -v, --version: Show glab version information.
persistentflags:
  -R, --repo=&: Select another repository. Can use either `OWNER/REPO` or `GROUP/NAMESPACE/REPO` format. Also accepts full URL or Git URL.
  -h, --help: Show help for this command.
commands:
  - name: alias [command] [flags]
    description: Create, list, and delete aliases.
    commands:
      - name: delete <alias name> [flags]
        description: Delete an alias.
        documentation:
          command: |
            Delete an alias by name. The deletion is permanent. To restore the
            alias, run `glab alias set` with the original expansion.
      - name: list [flags]
        description: List aliases.
        documentation:
          command: |
            List all configured aliases and their expansions. Results are sorted
            alphabetically by alias name.
      - name: set <alias name> '<command>' [flags]
        description: Set an alias for a longer command.
        flags:
          -s, --shell: Declare an alias to be passed through a shell interpreter.
        documentation:
          command: |
            Declare a word as an alias for a longer command.

            Use quotation marks when you define a command, as shown in the examples.

            Your expansion can include arguments and flags. If your expansion
            includes positional placeholders such as `$1` or `$2`, any extra
            arguments that follow the invocation of the alias are inserted into
            those placeholders.

            To run an alias through `sh`, a shell converter, specify the
            `--shell` flag. With shell conversion, you can compose commands
            with `|` or redirect with `>`. Shell aliases have these caveats:

            - Extra arguments that follow the alias are not passed to the expansion.
              To accept arguments, use `$1`, `$2`, and so on.
            - To accept all arguments, use `$@`.

            On Windows, shell aliases run through `sh` as installed by Git for
            Windows. If you installed Git in another way on Windows, shell aliases
            might not work.
    documentation:
      command: |
        Aliases are shortcuts for longer glab commands. Use aliases to save
        keystrokes for commands you run often, or to compose shell pipelines
        around glab commands.
  - name: api <endpoint>
    description: Make an authenticated request to the GitLab API.
    flags:
      --form=*: Add a multipart form field. To upload a file, prefix the value with @ followed by the file path. To read from standard input, use @- (at most once). Using this flag changes the default HTTP method to POST.
      --hostname=: The GitLab hostname for the request. Defaults to gitlab.com, or the authenticated host in the current Git directory.
      --input=: The file to use as the body for the HTTP request.
      --output=:
        description: 'Format output as: json, ndjson.'
        default: json
      --paginate: Make additional HTTP requests to fetch all pages of results.
      --placeholder=*: Define a custom placeholder in <name>=<value> format, expanded from :<name>. Repeat the flag to define more than one.
      --silent: Do not print the response body.
      -F, --field=*: Add a parameter of inferred type. Using this flag changes the default HTTP method to POST.
      -H, --header=*: Add an additional HTTP request header.
      -X, --method=:
        description: The HTTP method for the request.
        default: GET
      -f, --raw-field=*: Add a string parameter.
      -i, --include: Include HTTP response headers in the output.
    exclusiveflags:
      - - field
        - form
      - - form
        - raw-field
      - - form
        - input
      - - input
        - paginate
    documentation:
      command: |
        Makes an authenticated HTTP request to the GitLab API, and prints the response.
        Specify either a path to a GitLab API v4 endpoint, or `graphql` to access the
        GitLab GraphQL API.

        For more information, see:

        - GitLab REST API documentation
        - GitLab GraphQL documentation

        If the current directory is a Git directory, this command uses the GitLab
        authenticated host in the current directory. Otherwise, `gitlab.com` is used.
        To override the GitLab hostname, use `--hostname`.

        When used in the endpoint argument, these placeholder values are replaced
        with values from the repository of the current directory:

        - `:branch`
        - `:fullpath`
        - `:group`
        - `:id`
        - `:namespace`
        - `:repo`
        - `:user`
        - `:username`

        To define your own placeholder, pass `--placeholder <name>=<value>` and use `:<name>` in the endpoint or in `--field` values. In the endpoint, the value is encoded as a single path segment. In `--field` values, it is sent unchanged. To put a value in a query string, pass it as a field instead: `-X GET -F <key>=:<name>`. A custom placeholder cannot reuse the name of a built-in placeholder.

        The default HTTP request method is `GET` when no parameters are added,
        and `POST` otherwise. To override the method, use `--method`.

        Pass one or more `--raw-field` values in `key=value` format to add
        JSON-encoded string parameters to the `POST` body.

        The `--field` flag behaves like `--raw-field` but converts values
        based on their format:

        - Literal values `true`, `false`, `null`, and integer numbers are converted to
          the matching JSON types.
        - Values starting with `[` or `{` are parsed as JSON arrays or objects
          (e.g. `-F 'topics=["my-topic","GitLab"]'`). Invalid JSON returns an error.
          The value must start with the bracket or brace: a leading space, as in
          `-F 'topics= ["a"]'`, is part of the value, so it is sent as a string.
        - Placeholder values `:namespace`, `:repo`, and `:branch` are populated with values
          from the repository of the current directory, including inside JSON
          arrays and objects (e.g. `-F 'input={"projectPath":":fullpath"}'`).
        - If the value starts with `@`, the rest of the value is interpreted as a
          filename to read the value from. Pass `-` to read from standard input.

        `--raw-field` does not parse JSON arrays or objects; those values are
        sent as strings. To pass a JSON body literally, use `--input`.

        A bracketed `--raw-field` value such as `-f 'scopes=[api,read_api]'` is sent as
        the literal string `"[api,read_api]"`. Earlier versions converted that shape
        into an array on request bodies, which `--raw-field` never documented. Use
        `-F 'scopes=["api","read_api"]'` for an array.

        Field names are never parsed. A bracketed name is only meaningful where the
        fields become URL query parameters. That means `GET` and `DELETE` requests,
        and any request where `--input` supplies the body. There the name is used
        literally and percent-encoded, so `-f 'position[base_sha]=abc'` arrives as
        the nested parameter it describes.

        A name ending in `[]` collects values instead of holding one, which is how
        the API reads an array. Repeating the name sends every value, in the order
        the flags were given: `-X GET -f 'ids[]=1' -f 'ids[]=2'` sends both.
        Because every value is sent, `--field` does not override `--raw-field` of
        the same name, as it does for other names.

        Any other name holds a single value. Among values from the same flag, the
        last one wins. When both flags name it, the `--field` value wins, whichever
        order the two were given in.

        The `-F 'ids=[1,2]'` spelling emits `ids[]` as well. Spelling one query
        parameter both ways is therefore an error. Passing `-f 'ids[]=1'` with
        `-F 'ids=[2,3]'` is rejected, because nothing says which order the three
        values belong in.

        In a JSON request body a field name containing a bracket is an error. Such
        a name would be sent as a single literal key, which the API ignores. The
        request would succeed without doing what the name asked. Pass the value as
        JSON instead, as in `-F 'position={"base_sha":"abc"}'` or `-F 'ids=[1,2]'`.
        Or use `--input`.

        With no `--method`, adding any field makes the request a `POST`. Sending
        bracketed names as query parameters therefore needs an explicit
        `--method GET`. `--form` is unaffected: its part names are always literal.

        For GraphQL requests, all fields other than `query` and `operationName` are
        interpreted as GraphQL variables. The bracket rule applies to them
        unchanged: where the request sends a JSON body, a bracketed variable name
        is an error.

        To send data as `multipart/form-data` instead of JSON, use `--form`. This is
        required for API endpoints that accept file uploads, such as wiki attachments.
        Pass one or more `--form` values in `key=value` format. To upload a file,
        prefix the value with `@` followed by the file path. Pass `-` to read from
        standard input. Do not combine `--form` with `--field`, `--raw-field`, or `--input`.

        To pass a raw request body, use `--input` with a file path. Pass `-` to
        read from standard input. In this mode, parameters specified with `--field`
        flags are serialized into URL query parameters.

        In `--paginate` mode, all pages of results are requested sequentially until
        no more pages of results remain. For GraphQL requests:

        - The original query must accept an `$endCursor: String` variable.
        - The query must fetch the `pageInfo{ hasNextPage, endCursor }` set of fields from a collection.

        The `--output` flag controls the output format:

        - `json` (default): Pretty-printed JSON. Arrays are output as a single JSON array.
        - `ndjson`: Newline-delimited JSON, also known as JSON Lines. Each array element
          or object is output on a separate line. This format is more memory-efficient for
          large datasets and works well with tools like `jq`.

        For ndjson format specifications, see the
        ndjson spec and JSON Lines.
  - name: artifact-registry <command>
    aliases:
      - ar
    description: Authenticate with GitLab Artifact Registry. (EXPERIMENTAL)
    commands:
      - name: get-token
        description: Get a short-lived access token for the GitLab Artifact Registry. (EXPERIMENTAL)
        flags:
          --duration=:
            description: How long the token should remain valid. Must be between 1s and 12h0m0s.
            default: 15m0s
          --hostname=: GitLab hostname to request the token from. Defaults to the configured GitLab instance.
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Exchange a GitLab credential for a short-lived access token scoped to the
            GitLab Artifact Registry. The command prints the bare token to stdout,
            so a shell can capture it directly, for example to feed `docker login`.

            Prerequisites:

            - A GitLab Enterprise Edition (EE) instance on GitLab 19.1 or later.
            - Token exchange enabled on the instance (the
              `gate_token_exchange_endpoint` feature flag).

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: login
        description: Authenticate a package manager against the GitLab Artifact Registry. (EXPERIMENTAL)
        flags:
          --docker: Configure Docker to authenticate against the registry. Writes to $DOCKER_CONFIG, or ~/.docker when it is unset.
          --duration=:
            description: How long the exchanged token should remain valid. Ignored for --docker.
            default: 15m0s
          --gradle: Configure Gradle to authenticate against the registry. Writes to ~/.gradle/gradle.properties.
          --hostname=: GitLab hostname to request the token from. Defaults to the configured GitLab instance.
          --maven: Configure Maven to authenticate against the registry. Writes to ~/.m2/settings.xml.
          --npm: Configure npm to authenticate against the registry. Writes to ~/.npmrc.
          --registry-alias=: Alias/ID to register the registry under (Maven/Gradle only). Defaults to a name derived from --registry.
          --registry=!: Registry to authenticate against. For --docker, a bare hostname; for others, typically a URL.
          --sbt: Configure sbt to authenticate against the registry. Writes to ~/.sbt/1.0/credentials.sbt.
        exclusiveflags:
          - - docker
            - gradle
            - maven
            - npm
            - sbt
        documentation:
          command: |
            Configure a package manager to authenticate against the GitLab Artifact
            Registry, using a short-lived access token exchanged from your GitLab
            session.

            Use the flag for your package manager:

            - `--docker`: registers `glab` as a Docker credential
              helper for the registry.
            - `--maven`: writes a `<server>` block in
              `~/.m2/settings.xml`, keyed by `--registry-alias`.
              Reference it from a `<repository>` carrying the same
              `<id>`.
            - `--gradle`: writes `{alias}Url`,
              `{alias}Username`, and `{alias}Password` in
              `~/.gradle/gradle.properties`, where `{alias}` is
              `--registry-alias`.
            - `--npm`: writes a `//{host}{path}/:_authToken` entry
              in `~/.npmrc`. You still need to point npm at the registry, with a
              `registry=` or `@scope:registry=` line.
            - `--sbt`: writes a `credentials +=` line in
              `~/.sbt/1.0/credentials.sbt`, which assumes a stock sbt 1.x.
              An sbt that moved its global base, with
              `-Dsbt.global.base` or a newer default, does not read that
              file.

            Token lifetime:

            - `--docker` exchanges a fresh token on every pull or push,
              so `--duration` does not apply.
            - Every other flag writes one token, and nothing refreshes it. Run
              the command again before `--duration` elapses. The default
              is 15 minutes and the maximum is 12 hours.

            Credential resolution:

            - Docker runs the credential helper as its own subprocess, which
              reads your credentials from the configuration file and ignores
              `GITLAB_TOKEN`. This command verifies the login the same
              way, so run `glab auth login` first if no token is stored
              for the host.
            - Every other flag does read `GITLAB_TOKEN`. `glab`
              writes the token into each file itself, so the tool can read it
              without fetching credentials itself.

            Registry and alias selection:

            - Use `--registry` only for a registry the Artifact Registry
              actually backs. If you name a container registry here, it receives the
              wrong token and the error only surfaces on the next pull.
            - `--registry-alias` applies to `--maven` and
              `--gradle` only, because `--npm` and
              `--sbt` key their entries on `--registry` itself.
              For `--gradle`, use an alias that is a valid identifier
              in your build script: the default is derived from the registry
              host and contains hyphens, which Groovy cannot interpolate as
              `${...}`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: status
        description: Check your access to the GitLab Artifact Registry. (EXPERIMENTAL)
        flags:
          --hostname=: GitLab hostname to check. Defaults to the configured GitLab instance.
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Exchange a GitLab credential for a short-lived Artifact Registry access
            token, then print the token's issuer, subject, audience, and expiry so
            you can confirm which identity and instance you are authenticated as. No
            credentials are written to disk.

            Prerequisites:

            - A GitLab Enterprise Edition (EE) instance on GitLab 19.1 or later.
            - Token exchange enabled on the instance (the
              `gate_token_exchange_endpoint` feature flag).

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Exchange a GitLab credential for a short-lived Artifact Registry access
        token, either to check your access, to hand the token to a caller, or to
        configure a package manager to authenticate against the registry.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: attestation <command> [flags]
    description: Manage software attestations. (EXPERIMENTAL)
    commands:
      - name: verify <project-id> <artifact-path>
        description: Verify the provenance of a specific artifact or file. (EXPERIMENTAL)
        documentation:
          command: |
            Verify the provenance of an artifact built by a GitLab CI/CD pipeline.
            This command checks the artifact's signed attestation against the expected
            GitLab project and pipeline.

            This command requires the cosign binary. To install it, see
            Cosign installation.

            This command works only on GitLab.com.

            For more information about attestations, see:

            - Attestations API
            - SLSA provenance specification
            - SLSA software attestations

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Manage software attestations for artifacts built in GitLab CI/CD pipelines.
        An attestation is a signed statement about an artifact, such as a provenance
        statement that records how the artifact was built.

        Use this command to verify that an artifact was built by the expected
        GitLab project and pipeline.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: auth <command>
    description: Manage authentication for glab.
    commands:
      - name: configure-docker
        description: Register glab as a Docker credential helper.
        documentation:
          command: |
            Configures Docker to use glab for authentication with GitLab
            container registries. This command runs only on Linux and macOS.

            After you run this command, Docker uses glab to obtain credentials
            when it pulls from or pushes to a GitLab container registry.

            Docker looks for the credential helper script by name on your `PATH`. By default, glab installs the script next to the glab binary. If that directory is not writable, glab falls back to `~/.local/bin`, then to any other writable directory on your `PATH`. If the script lands in a directory that is not on your `PATH`, glab tells you which directory to add.
      - name: credential-helper [flags]
        description: Implements a generic credential helper.
        hidden: true
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
      - name: docker-helper
        description: A Docker credential helper for GitLab container and artifact registries.
        documentation:
          command: |
            Responds to Docker credential helper requests for GitLab container
            registries and Artifact Registries. Docker invokes this command
            automatically.
      - name: dpop-gen
        description: Generate a DPoP (demonstrating-proof-of-possession) proof JWT. (EXPERIMENTAL)
        flags:
          --hostname=:
            description: The hostname of the GitLab instance to authenticate with.
            default: gitlab.com
          --pat=: Personal access token (PAT) to generate a DPoP proof for. Defaults to the token set with 'glab auth login'.
          -p, --private-key=!: Location of the private SSH key on the local system.
        documentation:
          command: |
            Generates a demonstrating-proof-of-possession (DPoP) proof JSON Web Token (JWT).
            DPoP cryptographically binds personal access tokens to their owners.

            Use the JWT with a personal access token (PAT) to authenticate to the GitLab API.
            glab signs the JWT with your SSH private key. The JWT remains valid for five
            minutes. After it expires, generate another one.

            Prerequisites:

            - An SSH key pair in RSA, ed25519, or ECDSA format.
            - Enabled DPoP for your account.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: git-credential
        description: Implements Git credential helper manager.
        hidden: true
      - name: login
        description: Authenticate with a GitLab instance.
        flags:
          --container-registry-domains=: Container registry and image dependency proxy domains, comma-separated.
          --device: Use the OAuth 2.0 device authorization flow. Useful for headless environments where a local browser is not available. Requires GitLab 17.9 or later.
          --hostname=: The hostname of the GitLab instance to authenticate with. When omitted, glab prompts in interactive mode, or uses the host resolved from your Git remotes, GITLAB_HOST, and your configuration.
          --insecure-storage: Store the token as plaintext in the configuration file instead of the operating system's keyring.
          --ssh-hostname=: SSH hostname for instances with a different SSH endpoint. A port is not required; Git uses the port from the remote URL. Also skips the SSH hostname prompt in interactive mode.
          --stdin: Read the token from standard input.
          --use-keyring&: Store the token in your operating system's keyring.
          --web: Skip the login type prompt and use web/OAuth login.
          -a, --api-host=: Hostname for the API endpoint, if different from --hostname. Accepts a hostname or hostname:port. Also skips the API hostname prompt in interactive mode.
          -g, --git-protocol=: 'Git protocol. Options: ssh, https, http.'
          -j, --job-token=: CI job token.
          -p, --api-protocol=: 'API protocol. Options: https, http.'
          -t, --token=: Your GitLab access token.
        exclusiveflags:
          - - device
            - job-token
            - stdin
            - token
            - web
          - - insecure-storage
            - use-keyring
        documentation:
          command: |
            Authenticates with a GitLab instance.

            By default, glab stores your credentials in your operating system's
            keyring (macOS Keychain, Windows Credential Manager, or the Secret
            Service on Linux) when one is available. If no keyring is available,
            or if you pass `--insecure-storage`, glab stores them in the global
            configuration file (default `~/.config/glab-cli/config.yml`) as
            plaintext instead. After authentication, all glab commands use the
            stored credentials.

            If you previously signed in and your credentials are stored as
            plaintext in the configuration file, run `glab auth login` again to
            move them into the keyring.

            In CI (when `GITLAB_CI` or `CI` is set), glab stores credentials in the
            configuration file rather than the keyring. Credentials in CI are
            usually supplied through environment variables, and an OS keyring is
            often unavailable there.

            If `GITLAB_TOKEN`, `GITLAB_ACCESS_TOKEN`, or `OAUTH_TOKEN` are set,
            they take precedence over the stored credentials. When CI auto-login is
            enabled, these variables also override `CI_JOB_TOKEN`.

            To pass a token on standard input, use `--stdin`.

            In interactive mode, glab detects GitLab instances from your Git remotes
            and lists them as options, so you do not have to type the hostname manually.

            When you omit `--hostname` in a non-interactive run, glab authenticates
            with the first of these that applies:

            - The host of the base repository, if you're in a Git repository with a GitLab remote.
            - The `GITLAB_HOST` environment variable, if it's set.
            - The `host` key in your configuration file, if it's set.
            - `gitlab.com`, if none of the above apply.
      - name: logout
        description: Log out from a GitLab instance.
        flags:
          --hostname=!: The hostname of the GitLab instance.
        documentation:
          command: |
            Logs out from a GitLab instance. The credentials for the specified instance
            are removed from the global configuration file (default
            `~/.config/glab-cli/config.yml`) and from the operating system's keyring,
            if a token was stored there.
      - name: status
        description: View authentication status.
        flags:
          --hostname=: Check the authentication status of a specific instance.
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -a, --all: Check the authentication status of all configured instances.
          -t, --show-token: Display the authentication token.
        exclusiveflags:
          - - all
            - hostname
        documentation:
          command: |
            Verifies and displays information about your authentication state.

            By default, this command checks the authentication state of the GitLab instance
            determined by your current context (`git remote`, `GITLAB_HOST` environment variable,
            or configuration). To check all configured instances, use `--all`.
            To check a specific instance, use `--hostname`.
    documentation:
      command: |
        Manages authentication for glab against one or more GitLab instances. Use
        these commands to log in, log out, check your authentication status,
        and configure glab as a credential helper for Git and Docker.

        glab can authenticate with a personal access token, an OAuth token from
        a web flow, or a CI job token when running in a GitLab CI/CD job.
  - name: changelog <command> [flags]
    description: Generate changelogs from your project's commit history.
    commands:
      - name: generate [flags]
        description: Generate a changelog for the current project.
        flags:
          --config-file=: Path to the changelog configuration file in the project's Git repository. Defaults to '.gitlab/changelog_config.yml'.
          --date=: Date and time of the release, in ISO 8601 format (2016-03-11T03:45:40Z). Defaults to the current time.
          --from=: Start of the range of commits to use when generating the changelog, as a SHA. This commit is not included in the range.
          --to=: End of the range of commits to use when generating the changelog, as a SHA. This commit is included in the range. Defaults to the HEAD of the project's default branch.
          --trailer=: The Git trailer to use to include commits. Defaults to 'Changelog'.
          -v, --version=: Version to generate the changelog for. Must follow semantic versioning. Defaults to the version detected by 'git describe'.
        documentation:
          command: |
            Generates a changelog from the commits in your project's Git
            repository. If you do not pass `--version`, glab determines
            the version by running `git describe` against your local tags.

            By default, GitLab reads the changelog configuration from
            `.gitlab/changelog_config.yml` in the project. To use a
            different file, pass `--config-file`.

            To limit the range of commits, use `--from` and `--to`.
            glab excludes the `--from` commit from the range and includes
            the `--to` commit. The `--to` commit defaults to
            `HEAD` of the project's default branch.
    documentation:
      command: |
        Generate changelogs from commits in your project's Git repository.
        Changelog entries are built from commits that include a configured Git
        trailer, such as 'Changelog'.

        For more information about how GitLab generates changelogs, see
        Changelogs.
  - name: check-update
    aliases:
      - update
    description: Check for the latest glab version.
    documentation:
      command: |
        Checks for the latest version of glab available on GitLab.com.

        When you run this command explicitly, glab always checks for updates,
        even if the previous check was less than 24 hours ago.

        When glab runs this check automatically after other commands, it
        checks for updates at most once every 24 hours.

        When you run this command, glab also reports updates for the GitLab Duo CLI and GitLab Orbit CLI binaries, if they are installed.

        To turn off the automatic update check, run
        `glab config set check_update false`. To turn it back on,
        run `glab config set check_update true`.
  - name: ci <command> [flags]
    aliases:
      - pipe
      - pipeline
    description: Work with GitLab CI/CD pipelines and jobs.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: cancel <command>
        description: Cancel a running pipeline or job.
        commands:
          - name: job <id> [<id>...] [flags]
            description: Cancel CI/CD jobs.
            flags:
              --dry-run: Show which jobs would be canceled, without canceling them.
              -f, --force: Force-cancel the job, even if it runs in a protected environment.
            exclusiveflags:
              - - dry-run
                - force
            documentation:
              command: |
                Cancels one or more running CI/CD jobs by ID. You can pass multiple
                job IDs as separate arguments, in a comma-separated list, or in a
                quoted space-separated list.

                To preview which jobs would be canceled without making changes, use
                `--dry-run`.

                Use `--force` to cancel jobs that are in a protected environment.
          - name: pipeline <id> [<id>...] [flags]
            description: Cancel CI/CD pipelines.
            flags:
              --dry-run: Show which pipelines would be canceled, without canceling them.
            documentation:
              command: |
                Cancels one or more running CI/CD pipelines by ID. You can pass
                multiple pipeline IDs as separate arguments, in a comma-separated
                list, or in a quoted space-separated list.

                To preview which pipelines would be canceled without making changes,
                use `--dry-run`.
        documentation:
          command: |
            Cancel one or more running CI/CD pipelines or jobs.

            Use the `pipeline` subcommand to cancel pipelines, or the `job`
            subcommand to cancel individual jobs.
      - name: config <command> [flags]
        description: View and inspect GitLab CI/CD configuration.
        commands:
          - name: compile [<path>]
            description: View the merged CI/CD configuration.
            documentation:
              command: |
                Compiles your CI/CD configuration and prints the fully merged YAML
                to standard output.

                All `include` directives are resolved,
                and any extended jobs are flattened into their final form.

                By default, glab compiles the `.gitlab-ci.yml` file in the
                current directory. To compile a different file, pass its path as an
                argument.

                You must run this command from a GitLab project repository.
        documentation:
          command: |
            View and inspect the CI/CD configuration for your GitLab project.

            Use the `compile` subcommand to view the fully merged
            `.gitlab-ci.yml` file, including all `include` directives resolved
            to their final form.
      - name: delete <id> [flags]
        description: Delete CI/CD pipelines.
        flags:
          --dry-run: Simulate process, but do not delete anything.
          --older-than=: 'Filter pipelines older than the given duration. Valid units: h, m, s, ms, us, ns.'
          --page=: Page number.
          --paginate: Make additional HTTP requests to fetch all pages of pipelines. Respects '--per-page'.
          --per-page=: Number of items to list per page.
          --source=: 'Filter pipelines by source: api, chat, external, external_pull_request_event, merge_request_event, ondemand_dast_scan, ondemand_dast_validation, parent_pipeline, pipeline, push, schedule, security_orchestration_policy, trigger, web, webide.'
          -s, --status=: 'Delete pipelines by status: running, pending, success, failed, canceled, skipped, created, manual.'
        documentation:
          command: |
            You can delete by ID, or filter by status, source, or age. Use `--dry-run` to preview
            the pipelines that would be deleted.
      - name: get [flags]
        aliases:
          - stats
        description: Get the details of a CI/CD pipeline.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --merge-request=: Show the pipeline for the given merge request <iid>.
          --with-variables: Show variables in pipeline. Requires the Maintainer role.
          -F, --output=:
            description: 'Format output. Options: text, json.'
            default: text
          -b, --branch=: Get the pipeline for a branch. Defaults to the current branch.
          -d, --with-job-details: Show extended job information.
          -o, --output-format=&:
            description: Use output.
            default: text
          -p, --pipeline-id=: Get the pipeline with the given <id>.
          -s, --status=: Show only jobs in the given state. Passed through to the API's scope parameter.
        exclusiveflags:
          - - branch
            - merge-request
          - - merge-request
            - pipeline-id
        documentation:
          command: |
            Defaults to the current branch. Use `--pipeline-id` to specify a pipeline
            instead of fetching the latest for a branch.

            Use `--merge-request` to target the head pipeline of a specific merge
            request by IID. This differs from `--branch` when the MR's head pipeline
            diverges from the latest pipeline on its source branch — for example, forks or
            detached pipelines.

            Use `--status` to filter jobs by state (passed through to the API's
            `scope` parameter).

            Use `--output json` to get the pipeline details as JSON.
      - name: lint
        description: Check if your `.gitlab-ci.yml` file is valid.
        flags:
          --dry-run: Run pipeline creation simulation.
          --include-jobs: Include the list of jobs that would exist in a static check or pipeline simulation.
          --ref=: When '--dry-run' is true, sets the branch or tag context for validating the CI/CD YAML configuration.
        documentation:
          command: |
            Defaults to the `.gitlab-ci.yml` file in the current directory.
            You can also pass a URL to validate a remote file. Use `--dry-run`
            to simulate pipeline creation, and `--ref` to set the branch or
            tag context for the simulation.
      - name: list [flags]
        description: List CI/CD pipelines.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --orderBy=&:
            description: 'Deprecated: use --order instead.'
            default: id
          --scope=: 'Return only pipelines with the given scope. Options: running, pending, finished, branches, tags.'
          --sha=: Return only pipelines with the given SHA.
          --sort=:
            description: 'Sort direction for ''--order'': asc or desc.'
            default: desc
          --source=: 'Return only pipelines triggered by the given source. For the full list, see https://docs.gitlab.com/ci/jobs/job_rules/#ci_pipeline_source-predefined-variable. Commonly used options: merge_request_event, parent_pipeline, pipeline, push, trigger.'
          -F, --output=:
            description: 'Format output. Options: text, json.'
            default: text
          -P, --per-page=: Number of items to list per page. Defaults to the GitLab API default (20).
          -a, --updated-after=: Return only pipelines updated after the specified date. Expected in ISO 8601 format (2019-03-15T08:00:00Z).
          -b, --updated-before=: Return only pipelines updated before the specified date. Expected in ISO 8601 format (2019-03-15T08:00:00Z).
          -n, --name=: Return only pipelines with the given name.
          -o, --order=:
            description: 'Order pipelines by this field. Options: id, status, ref, updated_at, user_id.'
            default: id
          -p, --page=:
            description: Page number.
            default: "1"
          -r, --ref=: Return only pipelines for the given ref.
          -s, --status=: 'Filter pipelines by status. Options: running, pending, success, failed, canceled, skipped, created, manual, waiting_for_resource, preparing, scheduled.'
          -u, --username=: Return only pipelines triggered by the given username.
          -y, --yaml-errors: Return only pipelines with invalid configurations.
        documentation:
          command: |
            Defaults to the current project. Use `--status` to filter pipelines by status.
      - name: retry [<job-id | job-name>]
        description: Retry a CI/CD job.
        flags:
          -b, --branch=: The branch to search for the job. Defaults to the current branch.
          -p, --pipeline-id=: The pipeline ID to search for the job.
        documentation:
          command: |
            Without a job argument, you can select one interactively.
      - name: run [flags]
        aliases:
          - create
        description: Create a new CI/CD pipeline.
        flags:
          --mr: Run merge request pipeline instead of branch pipeline.
          --variables-env=*: Pass variables to the pipeline in the format <key>:<value>. Cannot be used for MR pipelines.
          --variables-file=*: Pass file contents as a file variable to the pipeline in the format <key>:<filename>. Cannot be used for MR pipelines.
          --variables=*: Pass variables to the pipeline in the format <key>:<value>. Cannot be used for MR pipelines.
          -b, --branch=: Create pipeline on branch or reference <string>.
          -f, --variables-from=: JSON file with variables for pipeline execution. Expects array of hashes, each with at least 'key' and 'value'. Cannot be used for MR pipelines.
          -i, --input=*: Pass inputs to pipeline in format '<key>:<value>'. Cannot be used for merge request pipelines. See documentation for examples.
          -w, --web: Open pipeline in a browser. Uses default browser, or browser specified in BROWSER environment variable.
        exclusiveflags:
          - - input
            - mr
          - - mr
            - variables
          - - mr
            - variables-env
          - - mr
            - variables-file
          - - mr
            - variables-from
        documentation:
          command: |
            Use `--branch` to specify a branch or reference. Defaults to the current branch.

            The variable flags (`--variables`, `--variables-env`,
            `--variables-file`, `--variables-from`) cannot be used with
            `--mr`. If both are used, the command fails.

            Specify one or more pipeline inputs using the `-i` or `--input` flag for each
            input. Each input flag uses the format `key:value`.

            The values are typed and will default to `string` unless a type is explicitly
            specified. To specify a type, use the `type(value)` syntax. For example,
            `key:string(value)` will pass the string `value` as the input.

            Valid types are:

            - `string`: A string value. This is the default type. For example, `key:string(value)`.
            - `int`: An integer value. For example, `key:int(42)`.
            - `float`: A floating-point value. For example, `key:float(3.14)`.
            - `bool`: A boolean value. For example, `key:bool(true)`.
            - `array`: An array of strings. For example, `key:array(foo,bar)`.

            An array of strings can be specified with a trailing comma. For example,
            `key:array(foo,bar,)` will pass the array `[foo, bar]`. `array()` specifies an
            empty array. To pass an array with the empty string, use `array(,)`.

            Value arguments containing parentheses should be escaped from the shell with
            quotes. For example, `--input key:array(foo,bar)` should be written as
            `--input 'key:array(foo,bar)'`.
      - name: run-trig [flags]
        description: Run a CI/CD pipeline trigger.
        flags:
          --variables=*: Pass variables to pipeline in the format <key>:<value>. Multiple variables can be comma-separated or specified by repeating the flag.
          -b, --branch=: Create pipeline on branch or reference <string>.
          -i, --input=*: Pass inputs to pipeline in format '<key>:<value>'. Cannot be used for merge request pipelines. See documentation for examples.
          -t, --token=: Pipeline trigger token. Can be omitted only if the 'CI_JOB_TOKEN' environment variable is set.
        documentation:
          command: |
            Use `--token` to provide a pipeline trigger token. If omitted, the
            `CI_JOB_TOKEN` environment variable must be set.

            Use `--branch` to specify a branch or reference. Defaults to the current branch.

            Specify one or more pipeline inputs using the `-i` or `--input` flag for each
            input. Each input flag uses the format `key:value`.

            The values are typed and will default to `string` unless a type is explicitly
            specified. To specify a type, use the `type(value)` syntax. For example,
            `key:string(value)` will pass the string `value` as the input.

            Valid types are:

            - `string`: A string value. This is the default type. For example, `key:string(value)`.
            - `int`: An integer value. For example, `key:int(42)`.
            - `float`: A floating-point value. For example, `key:float(3.14)`.
            - `bool`: A boolean value. For example, `key:bool(true)`.
            - `array`: An array of strings. For example, `key:array(foo,bar)`.

            An array of strings can be specified with a trailing comma. For example,
            `key:array(foo,bar,)` will pass the array `[foo, bar]`. `array()` specifies an
            empty array. To pass an array with the empty string, use `array(,)`.

            Value arguments containing parentheses should be escaped from the shell with
            quotes. For example, `--input key:array(foo,bar)` should be written as
            `--input 'key:array(foo,bar)'`.
      - name: status [flags]
        aliases:
          - stats
        description: View CI/CD pipeline status.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json. Note: JSON output is not compatible with --live, --wait, or --compact flags.'
            default: text
          -b, --branch=: Check pipeline status for a branch. Defaults to the current branch.
          -c, --compact: Show status in compact format.
          -l, --live: Show status in real time until the pipeline ends.
          -w, --wait: Wait to return until the pipeline is finished, and provide output without a prompt.
        documentation:
          command: |
            Defaults to the current branch.

            Use `--live` for real-time updates. Use `--compact` for a condensed view.
      - name: trace [<job-id>|<job-name>] [flags]
        description: Trace a CI/CD job log in real time.
        flags:
          -b, --branch=: The branch to search for the job. Defaults to the current branch.
          -p, --pipeline-id=: The pipeline ID to search for the job.
        documentation:
          command: |
            Streams the job log to the terminal. The output updates in real time
            while the job runs. Without a job argument, you can select one
            interactively.
      - name: trigger [<job-id | job-name>]
        description: Trigger a manual CI/CD job.
        flags:
          -b, --branch=: The branch to search for the job. Defaults to the current branch.
          -p, --pipeline-id=: The pipeline ID to search for the job.
        documentation:
          command: |
            Without a job argument, you can select one interactively.
            You can trigger only jobs with manual status.
      - name: view [<branch | tag>]
        description: View, run, retry, and cancel CI/CD pipeline jobs.
        flags:
          -b, --branch=: Check pipeline status for a branch or tag. Defaults to the current branch.
          -p, --pipelineid=: Check pipeline status for a specific pipeline ID.
          -w, --web: Open pipeline in a browser. Uses the default browser, or the browser specified in the BROWSER environment variable.
        exclusiveflags:
          - - branch
            - pipelineid
        documentation:
          command: |
            Supports viewing, running, tracing, and canceling jobs.

            Use arrow keys to navigate jobs and logs.

            - `Enter` to toggle through a job's logs / traces, or display a child pipeline.
              Trigger jobs are marked with a `»`.
            - `Esc` or `q` to close the logs or trace, or return to the parent pipeline.
            - `Ctrl+R`, `Ctrl+P` to run, retry, or play a job. Use `Tab` or arrow keys to
              navigate the modal, and `Enter` to confirm.
            - `Ctrl+D` to cancel a job. If the selected job isn't running or pending,
              quits the CI/CD view.
            - `Ctrl+S` to show the full name of the selected job.
            - `Ctrl+Q` to quit the CI/CD view.
            - `Ctrl+Space` to suspend application and view the logs. Similar to `glab ci trace`.
            - Supports `vi` style bindings and arrow keys for navigating jobs and logs.

            Job names too long for their box scroll while the job is selected.
    documentation:
      command: |
        Manages CI/CD pipelines and jobs in your GitLab project.

        Use these commands to manage CI/CD pipelines and jobs. You can also
        lint and compile CI/CD configuration files.

        The `pipe` and `pipeline` aliases are deprecated. Use `ci` instead.
  - name: cluster <command> [flags]
    description: Manage GitLab Agents for Kubernetes and their clusters.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: agent <command> [flags]
        description: Manage GitLab Agents for Kubernetes.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        commands:
          - name: bootstrap <agent-name> [flags]
            aliases:
              - bs
            description: Bootstrap a GitLab Agent for Kubernetes in a project.
            flags:
              --commit-author-email=:
                description: The Git commit author email to use. Conflicts with '--use-api-commit-author'.
                default: noreply@glab.gitlab.com
              --commit-author-name=:
                description: The Git commit author name to use. Conflicts with '--use-api-commit-author'.
                default: glab
              --create-environment:
                description: Create an environment for the GitLab Agent.
                default: "true"
              --create-flux-environment:
                description: Create an environment for FluxCD. Affects only the environment creation, not the use of Flux itself. Flux is always required for the bootstrap process.
                default: "true"
              --environment-flux-resource-path=:
                description: Flux resource path of the environment for the GitLab Agent.
                default: helm.toolkit.fluxcd.io/v2beta1/namespaces/<helm-release-namespace>/helmreleases/<helm-release-name>
              --environment-name=:
                description: Name of the environment for the GitLab Agent.
                default: <helm-release-namespace>/<helm-release-name>
              --environment-namespace=:
                description: Kubernetes namespace of the environment for the GitLab Agent.
                default: <helm-release-namespace>
              --flux-environment-flux-resource-path=:
                description: Flux resource path of the environment for FluxCD.
                default: kustomize.toolkit.fluxcd.io/v1/namespaces/flux-system/kustomizations/flux-system
              --flux-environment-name=:
                description: Name of the environment for FluxCD.
                default: <flux-source-namespace>/<flux-source-name>
              --flux-environment-namespace=:
                description: Kubernetes namespace of the environment for FluxCD.
                default: <flux-source-namespace>
              --flux-source-name=:
                description: Flux source name.
                default: flux-system
              --flux-source-namespace=:
                description: Flux source namespace.
                default: flux-system
              --flux-source-type=:
                description: Source type of the flux-system, like Git, OCI, or Helm.
                default: git
              --gitlab-agent-token-secret-name=:
                description: Name of the Secret where the token for the GitLab Agent is stored. The helm-release-target-namespace is implied for the namespace of the Secret.
                default: gitlab-agent-token
              --helm-release-filepath=:
                description: File path within the GitLab Agent project to commit the Flux HelmRelease to.
                default: gitlab-agent-helm-release.yaml
              --helm-release-name=:
                description: Name of the Flux HelmRelease manifest.
                default: gitlab-agent
              --helm-release-namespace=:
                description: Namespace of the Flux HelmRelease manifest.
                default: flux-system
              --helm-release-target-namespace=:
                description: Namespace of the GitLab Agent deployment.
                default: gitlab-agent
              --helm-release-values-from=*: 'Kubernetes object reference that contains the values.yaml data key in the format ''<kind>/<name>'', where ''kind'' must be one of: (Secret, ConfigMap). Multiple references can be comma-separated or specified by repeating the flag.'
              --helm-release-values=*: Local path to values.yaml files. Multiple files can be comma-separated or specified by repeating the flag.
              --helm-repository-address=:
                description: Address of the HelmRepository.
                default: https://charts.gitlab.io
              --helm-repository-filepath=:
                description: File path within the GitLab Agent project to commit the Flux HelmRepository to.
                default: gitlab-helm-repository.yaml
              --helm-repository-name=:
                description: Name of the Flux HelmRepository manifest.
                default: gitlab
              --helm-repository-namespace=:
                description: Namespace of the Flux HelmRepository manifest.
                default: flux-system
              --no-reconcile: Do not trigger Flux reconciliation for GitLab Agent for Kubernetes Flux resource.
              --use-api-commit-author: When creating Git commits use the user from the authenticated API request. Conflicts with '--commit-author-name' and '--commit-author-email'.
              -b, --manifest-branch=: Branch to commit the Flux Manifests to. Defaults to the project default branch.
              -p, --manifest-path=: Location of directory in Git repository for storing the GitLab Agent for Kubernetes Helm resources.
            exclusiveflags:
              - - commit-author-email
                - use-api-commit-author
              - - commit-author-name
                - use-api-commit-author
            documentation:
              command: |
                Bootstrap a GitLab Agent for Kubernetes (agentk) in a project.

                The first argument must be the name of the agent.

                It requires the `kubectl` and `flux` commands to be accessible via `$PATH`.

                This command consists of multiple idempotent steps:

                1. Register the agent with the project.
                2. Configure the agent.
                3. Configure an environment with dashboard for the agent.
                4. Configure an environment with dashboard for FluxCD (if `--create-flux-environment`).
                5. Create a token for the agent.
                   - If the agent has reached the maximum amount of tokens,
                     the one that has not been used the longest is revoked
                     and a new one is created.
                   - If the agent has not reached the maximum amount of tokens,
                     a new one is created.
                6. Push the Kubernetes Secret that contains the token to the cluster.
                7. Create Flux HelmRepository and HelmRelease resources.
                8. Commit and Push the created Flux Helm resources to the manifest path.
                9. Trigger Flux reconciliation of GitLab Agent HelmRelease (unless `--no-reconcile`).
          - name: check-manifest-usage [flags]
            aliases:
              - check_manifest_usage
            description: Find agents using deprecated GitOps manifest settings. (EXPERIMENTAL)
            flags:
              -A, --agent-per-page=:
                description: Number of agents to list per page.
                default: "30"
              -P, --per-page=:
                description: Number of projects to list per page.
                default: "30"
              -a, --agent-page=:
                description: Page number for agents.
                default: "1"
              -g, --group=!: Group ID to check.
              -p, --page=:
                description: Page number for projects.
                default: "1"
              -r, --recursive: Recursively check subgroups.
            documentation:
              command: |
                Searches a group and its descendant projects for registered agents whose
                configuration files include the deprecated `gitops.manifest_projects` setting.

                The output is tab-separated and can be redirected to a TSV file.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: get-token [flags]
            description: Create a personal access token for a GitLab Agent for Kubernetes.
            flags:
              --check-revoked: Check if a cached token is revoked. This requires an API call to GitLab which adds latency every time a cached token is accessed.
              --jq=: Filter JSON output with a jq expression.
              --token-expiry-duration=:
                description: Duration for how long the generated tokens should be valid for. Minimum is 1 day and the effective expiry is always at the end of the day, the time is ignored.
                default: 24h0m0s
              -a, --agent=!: The numerical Agent ID to connect to.
              -c, --cache-mode=:
                description: 'Mode to use for caching the token. Allowed values: keyring-filesystem-fallback, force-keyring, force-filesystem, no.'
                default: force-keyring
            documentation:
              command: |
                The token has the `k8s_proxy` scope and is valid until the end of the current day.

                You might receive an email from your GitLab instance that a new personal
                access token has been created.
          - name: list [flags]
            aliases:
              - ls
            description: List GitLab Agents for Kubernetes in a project.
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -P, --per-page=:
                description: Number of items to list per page.
                default: "30"
              -p, --page=:
                description: Page number.
                default: "1"
            documentation:
              command: |
                Defaults to the current project. Use `--output json` for JSON output.
          - name: token <command> [flags]
            description: Manage GitLab Agents for Kubernetes tokens.
            commands:
              - name: list <agent-id> [flags]
                description: List tokens for a GitLab Agent for Kubernetes.
                flags:
                  --jq=: Filter JSON output with a jq expression.
                  -F, --output=:
                    description: 'Format output as: text, json.'
                    default: text
                documentation:
                  command: |
                    Lists all tokens for the specified agent. Requires the numeric agent ID.
              - name: revoke <agent-id> <token-id>
                description: Revoke an agent token.
                documentation:
                  command: |
                    Revokes the specified token for a GitLab Agent for Kubernetes.
                    Requires the numeric agent ID and token ID.
            documentation:
              command: |
                Each agent supports a maximum of two active tokens at a time.
          - name: token-cache <command> [flags]
            description: Manage cached GitLab Agent tokens.
            commands:
              - name: clear [flags]
                description: Clear cached GitLab Agent tokens.
                flags:
                  --agent=*: Clear tokens for specific agent IDs only.
                  --filesystem:
                    description: Clear tokens from filesystem cache.
                    default: "true"
                  --keyring:
                    description: Clear tokens from keyring cache.
                    default: "true"
                  --revoke:
                    description: Revoke tokens on GitLab server before clearing cache.
                    default: "true"
                persistentflags:
                  -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
                documentation:
                  command: |
                    By default, clears tokens from both keyring and filesystem cache
                    and revokes them on the GitLab server. Use `--revoke=false` to skip revocation.
              - name: list [flags]
                description: List cached GitLab Agent tokens.
                flags:
                  --agent=*: Filter by specific agent IDs.
                  --filesystem:
                    description: Include tokens from filesystem cache.
                    default: "true"
                  --keyring:
                    description: Include tokens from keyring cache.
                    default: "true"
                persistentflags:
                  -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
                documentation:
                  command: |
                    By default, shows tokens from both keyring and filesystem cache.
                    Use `--keyring=false` or `--filesystem=false` to filter by cache type.
            documentation:
              command: |
                Tokens created by `glab cluster agent get-token` are cached locally
                in the system keyring and filesystem to avoid creating new tokens
                for each kubectl operation.

                The GitLab CLI caches agent tokens in two locations:

                - Keyring: Uses the system keyring (Windows Credential Manager, macOS Keychain, Linux Secret Service).
                - Filesystem: Stores tokens in the user's cache directory as encrypted files.

                The cache improves performance by avoiding the need to create new tokens for each kubectl operation when using `glab cluster agent update-kubeconfig`.

                Cached tokens are stored using a key format that includes:

                - Base64-encoded GitLab instance URL
                - Agent ID

                This ensures tokens are properly isolated by GitLab instance and agent.
          - name: update-kubeconfig [flags]
            description: Update your kubeconfig for use with a GitLab Agent for Kubernetes.
            flags:
              --check-revoked: Check if a cached token is revoked. Requires an API call to GitLab, which adds latency every time a cached token is accessed.
              --kubeconfig=: Use a particular kubeconfig file.
              --token-expiry-duration=:
                description: Duration for generated token's validity. Minimum is 1 day. Expires at end of day, and ignores time.
                default: 24h0m0s
              -a, --agent=!: The numeric agent ID to create the kubeconfig entry for.
              -c, --cache-mode=:
                description: 'Mode to use for caching the token. Allowed values: keyring-filesystem-fallback, force-keyring, force-filesystem, no.'
                default: force-keyring
              -u, --use-context: Use as default context.
            documentation:
              command: |
                Configures `kubectl` to authenticate through the GitLab Agent for Kubernetes
                using an exec credential plugin.

                - Use `--agent` to specify the agent by its numeric ID.
                - Use `--use-context` to set the agent as the default `kubectl` context.
                - Use `--token-expiry-duration` to control how long the generated token is valid.
                - Use `--cache-mode` to control how generated tokens are cached.
        documentation:
          command: |
            Register new agents, configure existing ones, manage their tokens and kubeconfig
            entries, and check configuration files for deprecated settings.
      - name: graph [flags]
        description: Query the Kubernetes object graph using the GitLab Agent for Kubernetes. (EXPERIMENTAL)
        flags:
          --apps: Watch deployments, replicasets, daemonsets, and statefulsets in the apps/v1 group.
          --batch: Watch jobs and cronjobs in the batch/v1 group.
          --cluster-rbac: Watch clusterroles and clusterrolebindings in the rbac.authorization.k8s.io/v1 group.
          --core: Watch pods, secrets, configmaps, and serviceaccounts in the core/v1 group.
          --crd: Watch customresourcedefinitions in the apiextensions.k8s.io/v1 group.
          --ignore-arc-direction: Ignore arc direction when evaluating root connectivity. Requires GitLab and agent version 18.3 or later.
          --listen-addr=:
            description: Address to listen on.
            default: localhost:0
          --listen-net=:
            description: Network on which to listen for connections.
            default: tcp
          --log-watch-request: Log watch request to stdout. Helpful for debugging.
          --ns-expression=: CEL expression to select namespaces. Evaluated before a namespace is watched and on any updates for the namespace object.
          --ns-field-selector=: Field selector to select namespaces.
          --ns-label-selector=: Label selector to select namespaces.
          --rbac: Watch roles and rolebindings in the rbac.authorization.k8s.io/v1 group.
          --root-expression=*: CEL expression to select root objects. Requires GitLab and agent version 18.3 or later.
          --stdin: Read watch request from standard input.
          -a, --agent=!: The numeric agent ID to connect to.
          -n, --namespace=*: Namespaces to watch. If not specified, all namespaces are watched with label and field selectors filtering.
          -r, --resource=*: Resources to watch. You can see the list of resources your cluster supports by running 'kubectl api-resources'.
        exclusiveflags:
          - - apps
            - stdin
          - - batch
            - stdin
          - - cluster-rbac
            - stdin
          - - core
            - stdin
          - - crd
            - stdin
          - - namespace
            - stdin
          - - ns-expression
            - stdin
          - - ns-field-selector
            - stdin
          - - ns-label-selector
            - stdin
          - - rbac
            - stdin
          - - resource
            - stdin
          - - root-expression
            - stdin
        documentation:
          command: |
            This command starts a web server that shows a live view of the Kubernetes object graph in a browser.
            It uses the GitLab Agent for Kubernetes running in the cluster.
            It requires:

            - Version 18.1 or later of GitLab and the GitLab Agent.
            - At least the Developer role in the agent project.
            - This command requires a personal access token or project access token
              for authentication. The token must have the `read_api` and `k8s_proxy` scopes.

            Leave feedback in issue 7900.

            ### Resource filtering

            To filter resources, namespaces, and select root objects, use
            Common Expression Language (CEL).

            `object_selector_expression`: Filters objects. The expression must return a boolean. These variables are available:

            - `obj`: The Kubernetes object being evaluated.
            - `group`: The group of the object.
            - `version`: The version of the object.
            - `resource`: The resource name of the object, like `pods` for the `Pod` kind.
            - `namespace`: The namespace of the object.
            - `name`: The name of the object.
            - `labels`: The labels of the object.
            - `annotations`: The annotations of the object.

            `resource_selector_expression`: Filters Kubernetes discovery information to include or exclude resources
            from the watch request. The expression must return a boolean. These variables are available:

            - `group`: The group of the object.
            - `version`: The version of the object.
            - `resource`: The resource name of the object, like `pods` for the `Pod` kind.
            - `namespaced`: The scope of group, version, and resource. Can be `bool`, `true`, or `false`.

            To select root objects, use the `--root-expression` flag. When set, only objects that are directly
            or transitively reachable from root objects are shown. This flag uses the same variables
            as `object_selector_expression`, and must return a boolean. Multiple values are joined with `OR`
            statements. If any match, the object is used as root.

            For more information about using label selectors
            and field selectors to select namespaces, see the Kubernetes documentation.

            ### Advanced usage

            Apart from high-level ways to construct the query, this command enables
            you to construct and send the query using all underlying API features.
            To understand what is possible, and how to do it, see the
            technical design doc

            The user should have permission to access the agent project.
            For more information, see Grant users Kubernetes access.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Agents connect your cluster to GitLab, enabling pull-based deployments
        and secure access to the Kubernetes API.
  - name: completion
    description: Generate shell completion scripts.
    flags:
      --no-desc: Do not include shell completion description.
      -s, --shell=:
        description: 'Shell type: bash, zsh, fish, powershell.'
        default: bash
    documentation:
      command: |
        This command outputs code meant to be saved to a file, or immediately
        evaluated by an interactive shell. To load completions:

        ### Bash

        To load completions in your current shell session:

        ```shell
        source <(glab completion -s bash)
        ```

        To load completions for every new session, run this command one time:

        #### Linux

        ```shell
        glab completion -s bash > /etc/bash_completion.d/glab
        ```

        #### macOS

        ```shell
        glab completion -s bash > /usr/local/etc/bash_completion.d/glab
        ```

        ### Zsh

        If shell completion is not already enabled in your environment you must
        enable it. Run this command one time:

        ```shell
        echo "autoload -U compinit; compinit" >> ~/.zshrc
        ```

        To load completions in your current shell session:

        ```shell
        source <(glab completion -s zsh); compdef _glab glab
        ```

        To load completions for every new session, run this command one time:

        #### Linux

        ```shell
        glab completion -s zsh > "${fpath[1]}/_glab"
        ```

        #### macOS

        For older versions of macOS, you might need this command:

        ```shell
        glab completion -s zsh > /usr/local/share/zsh/site-functions/_glab
        ```

        The Homebrew version of glab should install completions automatically.

        ### fish

        To load completions in your current shell session:

        ```shell
        glab completion -s fish | source
        ```

        To load completions for every new session, run this command one time:

        ```shell
        glab completion -s fish > ~/.config/fish/completions/glab.fish
        ```

        ### PowerShell

        To load completions in your current shell session:

        ```shell
        glab completion -s powershell | Out-String | Invoke-Expression
        ```

        To load completions for every new session, add the output of the above command
        to your PowerShell profile.

        When installing glab through a package manager, however, you might not need
        more shell configuration to support completions.
        For Homebrew, see brew shell completion
  - name: config [flags]
    aliases:
      - conf
    description: Manage glab settings.
    flags:
      -g, --global: Use global config file.
    commands:
      - name: edit
        description: Opens the glab configuration file.
        flags:
          -l, --local: Open '.git/glab-cli/config.yml' file instead of the global '~/.config/glab-cli/config.yml' file.
        documentation:
          command: |
            The command uses the following order when choosing the editor to use:

            1. `glab_editor` field in the configuration file.
            1. `VISUAL` environment variable.
            1. `EDITOR` environment variable.
      - name: get <key>
        description: Prints the value of a given configuration key.
        flags:
          --host=: Get per-host setting.
          -g, --global: Read from global config file (~/.config/glab-cli/config.yml). (default checks 'Environment variables → Local → Global')
        documentation:
          command: |
            By default, the lookup order is: environment variables, then the local
            repository configuration, then the global configuration. Use `--global` to
            read only from the global configuration file, or `--host` to read a
            per-host setting.

            If the key is not set, nothing is printed.
      - name: path
        description: Print the location of the global configuration file.
        flags:
          --dir: Print the configuration directory instead of the configuration file.
        documentation:
          command: |
            Print where `glab` reads and writes its global configuration. The location depends on the platform and whether a legacy configuration directory exists, so use this command instead of hard-coding a path.

            The command prints the path even if the file does not exist yet, so it is safe to run before the first `glab auth login`.

            Use `--dir` to print the parent directory. Grant write access to that directory rather than to `config.yml` alone, because `glab` writes a temporary file in that directory first and then replaces `config.yml` with it.

            Repository-local settings live in the repository's `.git/glab-cli/config.yml` and this command does not report them.

            If no user configuration file exists, `glab` falls back to a read-only system-wide one. This command always reports the user location.
      - name: set <key> <value>
        description: Updates configuration with the value of a given key.
        flags:
          --host=: Set per-host setting.
          -g, --global: Write to global '~/.config/glab-cli/config.yml' file rather than the repository's '.git/glab-cli/config.yml' file.
        documentation:
          command: |
            Use `glab config set --global` to write to the global configuration.
            Specifying the `--host` flag also saves to the global configuration file.
    documentation:
      command: |
        Manage key/value strings.

        Current respected settings:

        - `api_host`: Configure host for API endpoint. Defaults to the host itself. Also accepted as: `gitlab_api_host`. Scoped per host; set it with `--host`. Environment variable: `GITLAB_API_HOST`.
        - `api_protocol`: What protocol to use to access the API endpoint. Supported values: `http`, `https`. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_API_PROTOCOL`, `API_PROTOCOL`.
        - `artifact_registry_domains`: The domains of associated Artifact Registries. These are used to configure the Docker credential helper. Only list a domain here if it is actually backed by GitLab Artifact Registry: the credential helper tries this key first, and a successful token exchange is used as-is, with no fallback to container_registry_domains. A container-registry domain listed here by mistake gets an artifact-registry token the registry rejects, and `docker pull` hard-fails. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_ARTIFACT_REGISTRY_DOMAINS`, `ARTIFACT_REGISTRY_DOMAINS`.
        - `branch_prefix`: Prefix used by `glab stack` when naming generated branches. Defaults to the current user's username (from `os/user.Current`), falling back to `glab-stack` if unavailable. Environment variables, first one set wins: `GLAB_BRANCH_PREFIX`, `BRANCH_PREFIX`.
        - `browser`: What browser glab should run when opening links. This global config cannot be overridden by hostname. Environment variables, first one set wins: `GLAB_BROWSER`, `BROWSER`.
        - `ca_cert`: Path to a CA certificate (PEM) used to verify the GitLab server's TLS certificate. Useful for self-signed or private certificate authorities. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_CA_CERT`, `CA_CERT`.
        - `check_update`: Allow glab to automatically check for updates and notify you when there are new updates. Setting the environment variable to true also forces a check, bypassing the once-a-day interval. Environment variables, first one set wins: `GLAB_CHECK_UPDATE`, `CHECK_UPDATE`.
        - `client_cert`: Path to a client certificate (PEM) used for mutual TLS authentication. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_CLIENT_CERT`, `CLIENT_CERT`.
        - `client_id`: OAuth application client ID. Required when authenticating with OAuth against a self-managed GitLab instance. Scoped per host; set it with `--host`. Environment variable: `GITLAB_CLIENT_ID`.
        - `client_key`: Path to the private key (PEM) that matches client_cert. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_CLIENT_KEY`, `CLIENT_KEY`.
        - `container_registry_domains`: The domains of associated container registries. These are used to configure the Docker credential helper. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_CONTAINER_REGISTRY_DOMAINS`, `CONTAINER_REGISTRY_DOMAINS`.
        - `custom_headers`: Custom HTTP headers to add to all HTTP requests made by glab. Each header must use exactly one of value, valueFromEnv, or valueFromCommand. A command must print the complete header value on one line. glab runs it once for each process. Scoped per host; set it with `--host`.
        - `debug`: Output more logging information, including underlying Git commands, expanded aliases, and DNS error details. Environment variable: `GLAB_DEBUG`.
        - `display_hyperlinks`: Whether or not to display hyperlinks in terminal output. Defaults to true (enabled for TTYs). Set to false to disable. Force hyperlinks in non-TTY environments by setting FORCE_HYPERLINKS=1. Environment variables, first one set wins: `GLAB_DISPLAY_HYPERLINKS`, `DISPLAY_HYPERLINKS`.
        - `duo_cli_auto_download`: Automatically download Duo CLI binary without prompting (true/false). Environment variables, first one set wins: `GLAB_DUO_CLI_AUTO_DOWNLOAD`, `DUO_CLI_AUTO_DOWNLOAD`.
        - `duo_cli_auto_run`: Automatically run GitLab Duo CLI without prompting (true/false). Set to true to skip the confirmation prompt. Environment variables, first one set wins: `GLAB_DUO_CLI_AUTO_RUN`, `DUO_CLI_AUTO_RUN`.
        - `editor`: What editor glab should run when creating issues, merge requests, etc. This global config cannot be overridden by hostname. Also accepted as: `visual`, `glab_editor`. Environment variables, first one set wins: `GLAB_EDITOR`, `VISUAL`, `EDITOR`.
        - `git_protocol`: What protocol to use when performing Git operations. Supported values: `ssh`, `https`. Environment variables, first one set wins: `GLAB_GIT_PROTOCOL`, `GIT_PROTOCOL`.
        - `glab_pager`: Your desired pager command to use, such as `less -R`. Takes precedence over the PAGER environment variable. GLAB_PAGER takes precedence over both. Environment variable: `GLAB_PAGER`.
        - `glamour_style`: Set your desired Markdown renderer style. Available options are [dark, light, notty]. To set a custom style, refer to https://github.com/charmbracelet/glamour#styles. Environment variables, first one set wins: `GLAB_GLAMOUR_STYLE`, `GLAMOUR_STYLE`.
        - `host`: Default GitLab hostname to use. Also accepted as: `gitlab_host`, `gitlab_uri`, `gl_host`. Environment variables, first one set wins: `GITLAB_HOST`, `GITLAB_URI`, `GL_HOST`.
        - `job_token`: CI job token used for Job-Token authentication. Typically populated automatically from CI_JOB_TOKEN when CI auto-login is enabled. Scoped per host; set it with `--host`.
        - `no_prompt`: Set to true (1) to disable prompts, or false (0) to enable them. Also accepted as: `prompt_disabled`. Environment variables, first one set wins: `GLAB_NO_PROMPT`, `NO_PROMPT`, `PROMPT_DISABLED`.
        - `notify_skill_updates`: Show a notice when an installed agent skill (bundled or remote) has updates available. Environment variable: `GLAB_NOTIFY_SKILL_UPDATES`.
        - `orbit_cli_auto_download`: Automatically download the GitLab Orbit CLI binary without prompting (true/false). Environment variables, first one set wins: `GLAB_ORBIT_CLI_AUTO_DOWNLOAD`, `ORBIT_CLI_AUTO_DOWNLOAD`.
        - `orbit_cli_auto_run`: Automatically run the GitLab Orbit CLI without prompting (true/false). Set to true to skip the confirmation prompt. Environment variables, first one set wins: `GLAB_ORBIT_CLI_AUTO_RUN`, `ORBIT_CLI_AUTO_RUN`.
        - `proxy`: Custom proxy for this host. Overrides environment proxy settings when set. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_PROXY`, `PROXY`.
        - `remote_alias`: Name of the `git remote` that points at the GitLab repository. Used to resolve which remote to operate against when multiple are configured. Also accepted as: `git_remote_url_var`, `git_remote_alias`, `remote_nickname`, `git_remote_nickname`. Environment variables, first one set wins: `GLAB_REMOTE_ALIAS`, `GIT_REMOTE_URL_VAR`, `GIT_REMOTE_ALIAS`, `REMOTE_ALIAS`, `REMOTE_NICKNAME`, `GIT_REMOTE_NICKNAME`.
        - `show_whats_new`: Show a one-time post-upgrade banner pointing at `glab whatsnew` when a new version is detected. Environment variable: `GLAB_SHOW_WHATS_NEW`.
        - `skip_tls_verify`: Skip TLS certificate verification when talking to this host (true/false). Empty is treated as false. Use only for development; do not enable in production. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_SKIP_TLS_VERIFY`, `SKIP_TLS_VERIFY`.
        - `ssh_host`: Alternate hostname for SSH Git operations (e.g., `ssh.example.com` or `git.example.com`). Use this when SSH uses a different hostname than HTTP/API operations. Only affects SSH cloning and Git operations. Also accepted as: `gitlab_ssh_host`. Scoped per host; set it with `--host`. Environment variable: `GITLAB_SSH_HOST`.
        - `subfolder`: Subfolder where GitLab is installed (e.g., `gitlab` for https://example.com/gitlab/). Use this when GitLab is hosted at a subfolder rather than domain root. Supports nested paths (e.g., `apps/gitlab` for https://example.com/apps/gitlab/). Slashes are automatically trimmed, so `gitlab`, `/gitlab`, and `gitlab/` are equivalent. Only applies to HTTP/HTTPS operations (API and Git clone). Also accepted as: `gitlab_subfolder`. Scoped per host; set it with `--host`. Environment variable: `GITLAB_SUBFOLDER`.
        - `telemetry`: Set to false (0) to disable sending usage data to your GitLab instance or true (1) to enable. See https://docs.gitlab.com/administration/settings/usage_statistics/ for more information. Environment variable: `GLAB_SEND_TELEMETRY`.
        - `token`: Your GitLab access token. To get one, read https://docs.gitlab.com/user/profile/personal_access_tokens/. Also accepted as: `gitlab_token`, `oauth_token`. Scoped per host; set it with `--host`. Environment variables, first one set wins: `GITLAB_TOKEN`, `GITLAB_ACCESS_TOKEN`, `OAUTH_TOKEN`.
        - `use_keyring`: Store the host's credentials in the operating system's keyring (true/false). Set automatically by `glab auth login`, which defaults to `true` when a keyring backend is available. Empty is treated as false (plaintext file storage). Scoped per host; set it with `--host`. Environment variables, first one set wins: `GLAB_USE_KEYRING`, `USE_KEYRING`.

        Configuration file locations follow the XDG Base Directory specification.
        For the full search order and platform-specific paths, see configuration.
  - name: container-registry <command> [flags]
    aliases:
      - cr
    description: Work with GitLab container registries.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: repository <command> [flags]
        description: Manage container registry repositories.
        commands:
          - name: delete <repository-id> [flags]
            aliases:
              - del
            description: Delete a container registry repository.
            flags:
              -y, --yes: Skip the confirmation prompt.
            documentation:
              command: |
                This action permanently deletes the repository and all images and tags
                published to it.
          - name: list [flags]
            aliases:
              - ls
            description: List container registry repositories.
            flags:
              --include-tag-details: Fetch digest, size, and creation time for included tags. Makes one API call per tag. Project JSON output only. Implies --include-tags.
              --include-tags: Include tags in the response. Project repositories only.
              --include-tags-count:
                description: Include the number of tags in the response. Project repositories only.
                default: "true"
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -P, --per-page=:
                description: Number of items to list per page.
                default: "30"
              -p, --page=:
                description: Page number.
                default: "1"
            persistentflags:
              -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
              -g, --group=: List container registry repositories for a group.
            documentation:
              command: |
                By default, repositories are listed for the current project. Use `--repo`
                to target another project, or `--group` to list repositories for a group.
          - name: view <repository-id> [flags]
            aliases:
              - show
            description: View a container registry repository.
            flags:
              --include-tags: Include tags in the response.
              --include-tags-count:
                description: Include the number of tags in the response.
                default: "true"
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
            documentation:
              command: |
                Returns the container registry repository's details. Use `--include-tags` to include its
                tags in the output.
        documentation:
          command: |
            List, view, and delete GitLab container registry repositories.
      - name: tag <command> [flags]
        aliases:
          - tags
        description: Manage container registry tags.
        commands:
          - name: delete <repository-id> [<tag-name>] [flags]
            aliases:
              - del
            description: Delete container registry tags.
            flags:
              --keep-n=: Keep the latest N matching tags. Bulk deletion only; scheduled asynchronously.
              --name-regex-delete=: Regular expression for tag names to delete. Bulk deletion only; scheduled asynchronously.
              --name-regex-keep=: Regular expression for tag names to keep. Bulk deletion only; scheduled asynchronously.
              --older-than=: Delete tags older than the given duration, such as 7d or 1month. Bulk deletion only; scheduled asynchronously.
              -y, --yes: Skip the confirmation prompt.
            documentation:
              command: |
                Delete one container registry tag by name, or delete matching tags in
                bulk by filter.

                Deleting a single tag is synchronous. Bulk deletion is scheduled
                asynchronously by GitLab; matching tags may remain visible until the
                background deletion job has completed.

                To bulk delete tags, omit <tag-name> and provide at least one bulk
                deletion flag: --name-regex-delete, --name-regex-keep, --keep-n, or
                --older-than.

                The repository ID must belong to the selected project. Use -R/--repo
                to specify the owning project when running this command outside that
                project's Git checkout.
          - name: list <repository-id> [flags]
            aliases:
              - ls
            description: List container registry repository tags.
            flags:
              --details: Fetch digest, size, and creation time for each tag. Makes one API call per tag.
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -P, --per-page=:
                description: Number of items to list per page.
                default: "30"
              -p, --page=:
                description: Page number.
                default: "1"
            documentation:
              command: |
                The repository ID must belong to the selected project. Use -R/--repo
                to specify the owning project when running this command outside that
                project's Git checkout.
          - name: view <repository-id> <tag-name> [flags]
            aliases:
              - show
            description: View a container registry tag.
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
            documentation:
              command: |
                The repository ID must belong to the selected project. Use -R/--repo
                to specify the owning project when running this command outside that
                project's Git checkout.
        documentation:
          command: |
            List, view, and delete GitLab container registry tags.
    documentation:
      command: |
        List and manage GitLab container registry repositories and tags.
  - name: dependency-firewall <command>
    aliases:
      - df
    description: Configure and monitor GitLab Dependency Firewall for local package managers. (EXPERIMENTAL)
    commands:
      - name: bundle <bundle args>
        description: Run Bundler through the GitLab Dependency Firewall. (EXPERIMENTAL)
        documentation:
          command: |
            Run the Bundler binary (`bundle`) through the GitLab Dependency Firewall. The command checks each package download and upload against the policy for the current project, refuses blocked packages, and summarizes the results after the run.

            The command uses your package manager's registry or index configuration, and does not modify it.

            All arguments are forwarded to `bundle` verbatim.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: ci-summary
        description: Summarize Dependency Firewall activity from the CI log. (EXPERIMENTAL)
        documentation:
          command: |
            Read `.gitlab/df/ci-log.json` and print blocked and flagged packages
            recorded during a `glab dependency-firewall` run.

            The log is read from the current working directory. Run this command from
            the same directory as the `glab dependency-firewall` run that wrote the
            log, otherwise no activity is reported.

            | Exit code | Meaning |
            |-----------|---------|
            | `0` | No blocked entries in the log (allow-only or warnings). |
            | `1` | The log could not be read. |
            | `3` | At least one entry in the log is blocked. |

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: gem <gem args>
        description: Run gem through the GitLab Dependency Firewall. (EXPERIMENTAL)
        documentation:
          command: |
            Run the gem binary through the GitLab Dependency Firewall. The command checks each package download and upload against the policy for the current project, refuses blocked packages, and summarizes the results after the run.

            The command uses your configured sources, and does not modify `~/.gemrc` or your sources.

            All arguments are forwarded to `gem` verbatim.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
