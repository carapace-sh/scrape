        GitLab uses GPG keys to verify the signatures on signed commits and tags.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type glab help [path to command] for full details.
  - name: incident [command] [flags]
    description: Work with GitLab incidents.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: close [<id> | <url>] [flags]
        aliases:
          - resolve
        description: Close an incident.
        documentation:
          command: |
            You can use a full GitLab URL instead of an ID.
      - name: list [flags]
        aliases:
          - ls
        description: List project incidents.
        flags:
          --author=: Filter incident by author <username>.
          --in=:
            description: 'Search in: title, description.'
            default: title,description
          --jq=: Filter JSON output with a jq expression.
          --not-assignee=: Filter incident by not being assigned to <username>.
          --not-author=: Filter incident by not being by author(s) <username>.
          --not-label=*: Filter incident by lack of label <name>. Multiple labels can be comma-separated or specified by repeating the flag.
          --order=:
            description: 'Order incident by <field>. Order options: created_at, updated_at, priority, due_date, relative_position, label_priority, milestone_due, popularity, weight.'
            default: created_at
          --search=: Search <string> in the fields defined by '--in'.
          -A, --all: Get all incidents.
          -C, --confidential: Filter by confidential incidents.
          -F, --output-format=:
            description: 'Options: ''details'', ''ids'', ''urls''.'
            default: details
          -M, --mine&: Filter only incidents assigned to me.
          -O, --output=:
            description: 'Options: ''text'' or ''json''.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -a, --assignee=: Filter incident by assignee <username>.
          -c, --closed: Get only closed incidents.
          -e, --epic=: List issues belonging to a given epic (requires --group, no pagination support).
          -l, --label=*: Filter incident by label <name>. Multiple labels can be comma-separated or specified by repeating the flag.
          -m, --milestone=: Filter incident by milestone <id>.
          -o, --opened&: Get only open incidents.
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --sort=:
            description: 'Sort direction for --order field: asc or desc.'
            default: desc
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          -g, --group=: Select a group or subgroup. Ignored if a repo argument is set.
        exclusiveflags:
          - - output
            - output-format
        documentation:
          command: |
            Defaults to open items. Use `--group` to list for a group
            instead of the current project.
      - name: note <incident-id>
        aliases:
          - comment
        description: Comment on an incident in GitLab.
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the comment. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          -m, --message=: Message text.
        documentation:
          command: |
            Opens an editor for the comment if you don't use `--message`.

            `--attach` uploads a file and references it at the end of the comment. Repeat the flag for more than one file, or pass `-` to read the file from standard input. An attachment is content on its own, so a comment with only `--attach` skips the editor.

            The `--attach` flag is an experiment. It might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: reopen [<id> | <url>] [flags]
        aliases:
          - open
        description: Reopen a resolved incident.
        documentation:
          command: |
            You can use a full GitLab URL instead of an ID.
      - name: subscribe <id>
        aliases:
          - sub
        description: Subscribe to an incident.
        documentation:
          command: |
            You receive notifications when the incident is updated, commented on,
            or has its state changed.
      - name: unsubscribe <id>
        aliases:
          - unsub
        description: Unsubscribe from an incident.
        documentation:
          command: |
            You no longer receive notifications about updates to the incident.
      - name: view <id>
        aliases:
          - show
        description: Display the title, body, and other information about an incident.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -c, --comments: Show incident comments and activities.
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --system-logs: Show system activities and logs.
          -w, --web: Open incident in a browser. Uses the default browser, or the browser specified in the $BROWSER variable.
        documentation:
          command: |
            You can use a full GitLab URL instead of an ID. Use `--web`
            to open in a browser.
    documentation:
      command: |
        Incidents track service disruptions and their resolution. List and
        view incidents, comment on them, and subscribe, close, or reopen
        them.

        Use `--repo` to target a project other than the current one.
  - name: issue [command] [flags]
    description: Work with GitLab issues.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: board [command] [flags]
        description: Work with GitLab issue boards in the given project.
        persistentflags:
          -R, --repo=: Select another repository using the OWNER/REPO format or the project ID. Supports group namespaces.
        commands:
          - name: create [flags]
            aliases:
              - new
            description: Create a project issue board.
            flags:
              -n, --name=: The name of the new board.
            documentation:
              command: |
                Creates a new issue board in the project. If you don't provide a
                name, you're prompted for one.
          - name: view [flags]
            description: View project issue board.
            flags:
              --paginate: Make additional HTTP requests to retrieve all board issues.
              -a, --assignee=: Filter board issues by assignee username.
              -l, --labels=*: Filter board issues by labels. Multiple labels can be comma-separated or specified by repeating the flag.
              -m, --milestone=: Filter board issues by milestone.
            documentation:
              command: |
                Opens an interactive view of the project's issue boards in your
                terminal, where you can browse issues by list.
        documentation:
          command: |
            Issue boards organize issues into lists, similar to a kanban board,
            so you can track work as it moves between stages. Create a board, or
            view one interactively in the terminal.
      - name: close [<id> | <url>] [flags]
        description: Close an issue.
        documentation:
          command: |
            You can use a full GitLab URL instead of an ID.
      - name: create [flags]
        aliases:
          - new
        description: Create an issue.
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the description. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          --description-file=: Read the issue description from a file. Use "-" to read from standard input.
          --due-date=: A date in 'YYYY-MM-DD' format.
          --epic=: ID of the epic to add the issue to.
          --link-type=:
            description: Type for the issue link.
            default: relates_to
          --linked-issues=*: The IIDs of issues that this issue links to. Multiple IIDs can be comma-separated or specified by repeating the flag.
          --linked-mr=: The IID of a merge request in which to resolve all issues.
          --no-editor: Don't open editor to enter a description. If set to true, uses prompt.
          --recover: Save the options to a file if the issue fails to be created. If the file exists, the options will be loaded from the recovery file. (EXPERIMENTAL)
          --template=: Name of a template in '.gitlab/issue_templates/' to pre-populate the description. The '.md' extension is optional. Templates are loaded from the local repository only.
          --web: Continue issue creation with web interface.
          -a, --assignee=*: Assign issue to people by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          -c, --confidential: Set an issue to be confidential.
          -d, --description=: Issue description. Set to "-" to open an editor.
          -e, --time-estimate=: Set time estimate for the issue.
          -l, --label=*: Add label by name. Multiple labels can be comma-separated or specified by repeating the flag.
          -m, --milestone=: The global ID or title of a milestone to assign.
          -s, --time-spent=: Set time spent for the issue.
          -t, --title=: Issue title.
          -w, --weight=: Issue weight. Valid values are greater than or equal to 0.
          -y, --yes: Don't prompt for confirmation to submit the issue.
        exclusiveflags:
          - - description
            - description-file
          - - description
            - template
          - - description-file
            - template
        documentation:
          command: |
            Opens an editor to draft the issue unless you pass a title and
            description. Use `--web` to create the issue in your browser, or
            `--template` to start from an issue template.

            `--attach` uploads a file and references it at the end of the description. Repeat the flag for more than one file, or pass `-` to read the file from standard input. An attachment satisfies the description requirement, so `--title` with `--attach` completes without prompting.

            The `--attach` flag is an experiment. It might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.

            The `--recover` flag is an experiment: it might be unstable or
            removed at any time, and is not ready for production use. For more
            information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: delete <id>
        aliases:
          - del
        description: Delete an issue.
        documentation:
          command: |
            Permanently deletes the issue. You can pass an issue ID or a full
            issue URL.
      - name: list [flags]
        aliases:
          - ls
        description: List project issues.
        flags:
          --author=: Filter issue by author <username>.
          --in=:
            description: 'Search in: title, description.'
            default: title,description
          --jq=: Filter JSON output with a jq expression.
          --not-assignee=: Filter issue by not being assigned to <username>.
          --not-author=: Filter issue by not being by author(s) <username>.
          --not-label=*: Filter issue by lack of label <name>. Multiple labels can be comma-separated or specified by repeating the flag.
          --order=:
            description: 'Order issue by <field>. Order options: created_at, updated_at, priority, due_date, relative_position, label_priority, milestone_due, popularity, weight.'
            default: created_at
          --search=: Search <string> in the fields defined by '--in'.
          -A, --all: Get all issues.
          -C, --confidential: Filter by confidential issues.
          -F, --output-format=:
            description: 'Options: ''details'', ''ids'', ''urls''.'
            default: details
          -M, --mine&: Filter only issues assigned to me.
          -O, --output=:
            description: 'Options: ''text'' or ''json''.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -a, --assignee=: Filter issue by assignee <username>.
          -c, --closed: Get only closed issues.
          -e, --epic=: List issues belonging to a given epic (requires --group, no pagination support).
          -i, --iteration=: Filter issue by iteration <id>.
          -l, --label=*: Filter issue by label <name>. Multiple labels can be comma-separated or specified by repeating the flag.
          -m, --milestone=: Filter issue by milestone <id>.
          -o, --opened&: Get only open issues.
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --sort=:
            description: 'Sort direction for --order field: asc or desc.'
            default: desc
          -t, --issue-type=: 'Filter issue by its type. Options: issue, incident, test_case.'
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          -g, --group=: Select a group or subgroup. Ignored if a repo argument is set.
        exclusiveflags:
          - - output
            - output-format
        documentation:
          command: |
            Defaults to open items. Use `--group` to list for a group
            instead of the current project.
      - name: note <issue-id>
        aliases:
          - comment
        description: Comment on an issue in GitLab.
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the comment. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          -m, --message=: Message text.
        documentation:
          command: |
            Opens an editor for the comment if you don't use `--message`.

            `--attach` uploads a file and references it at the end of the comment. Repeat the flag for more than one file, or pass `-` to read the file from standard input. An attachment is content on its own, so a comment with only `--attach` skips the editor.

            The `--attach` flag is an experiment. It might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: reopen [<id> | <url>] [flags]
        aliases:
          - open
        description: Reopen a closed issue.
        documentation:
          command: |
            You can use a full GitLab URL instead of an ID.
      - name: subscribe <id>
        aliases:
          - sub
        description: Subscribe to an issue.
        documentation:
          command: |
            You receive notifications when the issue is updated, commented on,
            or has its state changed.
      - name: unsubscribe <id>
        aliases:
          - unsub
        description: Unsubscribe from an issue.
        documentation:
          command: |
            You no longer receive notifications about updates to the issue.
      - name: update <id>
        description: Update issue.
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the description. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          --description-file=: Read the issue description from a file. Use "-" to read from standard input.
          --due-date=: A date in 'YYYY-MM-DD' format.
          --lock-discussion: Lock discussion on issue.
          --unassign: Unassign all users.
          --unlock-discussion: Unlock discussion on issue.
          -a, --assignee=*: Assign users by username. Prefix with '!' or '-' to remove from existing assignees, or '+' to add new. Otherwise, replace existing assignees with these users. Multiple usernames can be comma-separated or specified by repeating the flag.
          -c, --confidential: Make issue confidential.
          -d, --description=: Issue description. Set to "-" to open an editor.
          -l, --label=*: Add labels.
          -m, --milestone=: Title of the milestone to assign Set to "" or 0 to unassign.
          -p, --public: Make issue public.
          -t, --title=: Title of issue.
          -u, --unlabel=*: Remove labels.
          -w, --weight=: Set weight of the issue.
        exclusiveflags:
          - - description
            - description-file
        documentation:
          command: |
            Change an issue's labels, assignees, milestone, title, or
            description. Use `--label` and `--unlabel` to add or remove
            labels.

            `--attach` uploads a file and references it at the end of the description. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Without `--description` the references are added to the description the issue already has, instead of replacing it.

            The `--attach` flag is an experiment. It might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: view <id>
        aliases:
          - show
        description: Display the title, body, and other information about an issue.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -c, --comments: Show issue comments and activities.
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --system-logs: Show system activities and logs.
          -w, --web: Open issue in a browser. Uses the default browser, or the browser specified in the $BROWSER variable.
        documentation:
          command: |
            You can use a full GitLab URL instead of an ID. Use `--web`
            to open in a browser.
    documentation:
      command: |
        Open issues, list and view them, and manage their lifecycle: assign,
        label, comment, close, reopen, and more. Work with issue boards under
        `issue board`.

        Use `--repo` to target a project other than the current one.
  - name: iteration <command> [flags]
    description: Retrieve iteration information.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: list [flags]
        aliases:
          - ls
        description: List project iterations.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -g, --group=: List iterations for a group.
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            By default, lists the iterations for the current project. Use
            `--group` to list a group's iterations instead, or `--repo` to
            target a project other than the current one.
    documentation:
      command: |
        Iterations are time-boxed periods, similar to sprints, that group
        issues and merge requests in a project or group.

        List the iterations for the current project, or use the `--group`
        flag to list a group's iterations instead.
  - name: job <command> [flags]
    description: Work with GitLab CI/CD jobs.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: artifact <refName> <jobName> [flags]
        aliases:
          - push
        description: Download all artifacts from the most recent pipeline.
        flags:
          -l, --list-paths: Print the paths of downloaded artifacts.
          -p, --path=:
            description: Path to download the artifact files.
            default: ./
        documentation:
          command: |
            Downloads all artifacts from the most recent successful pipeline.

            `<refName>` is a branch name, tag, or merge request reference. For a branch
            or tag, use the name directly. For a merge request pipeline, replace `<iid>`
            with the merge request IID and use the format that matches the pipeline type:

            - `refs/merge-requests/<iid>/head`: Pipeline on the latest commit of the source branch.
            - `refs/merge-requests/<iid>/merge`: Pipeline on the merged result (pipelines for merged results).
    documentation:
      command: |
        Inspect CI/CD jobs from a pipeline. Download the artifacts a job
        produced with `job artifact`.

        Use `--repo` to target a project other than the current one.
  - name: label <command> [flags]
    description: Manage project and group labels.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create [flags]
        aliases:
          - new
        description: Create a label in a project.
        flags:
          -c, --color=:
            description: Color of the label, in plain or HEX code.
            default: '#428BCA'
          -d, --description=: Label description.
          -n, --name=!: Name of the label.
          -p, --priority=: Label priority.
        documentation:
          command: |
            Use the flags to set the label name, color, description, and priority.
            The `--name` flag is required; `--color` defaults to
            `#428BCA` if not specified.

            By default, the label is created in the current repository. Use
            `--repo` to target another project.
      - name: delete <name> [flags]
        description: Delete a label from a project.
        documentation:
          command: |
            Delete a label from a project by name. The label is removed from
            the project; it is not removed from issues, merge requests, or
            epics that already use it.

            By default, the label is deleted from the current repository. Use
            `--repo` to target another project.
      - name: edit [flags]
        description: Edit a label in a project.
        flags:
          -c, --color=: The color of the label given in 6-digit hex notation with leading ‘#’ sign.
          -d, --description=: Label description.
          -l, --label-id=!: The label ID we are updating.
          -n, --new-name=: The new name of the label.
          -p, --priority=: Label priority.
        documentation:
          command: |
            Edit an existing label in a project. The `--label-id` flag is required
            to identify the label to update. At least one of `--new-name` or
            `--color` must be provided; `--description` and `--priority` are optional.

            By default, the label is edited in the current repository. Use
            `--repo` to target another project.
      - name: get <label-id>
        description: Get information about a single label by ID.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Get information about a single label in a project, identified by
            its numeric ID. Use the JSON output to integrate with other tools
            or scripts.

            By default, the label is looked up in the current repository. Use
            `--repo` to target another project.
      - name: list [flags]
        aliases:
          - ls
        description: List labels in a project or group.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -g, --group=: List labels for a group.
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            By default, labels are listed for the current repository. Use
            `--group` to list labels for a group or subgroup, or
            `--repo` to target another project.

            Use `--output json` to format the result as JSON for use with other tools.
    documentation:
      command: |
        Manage labels on projects and groups. Labels are used to categorize
        and filter issues, merge requests, and epics. Use the subcommands to
        create, list, edit, delete, or look up labels in the current repository
        or in another project or group.
  - name: mcp <command>
    description: Work with a Model Context Protocol (MCP) server. (EXPERIMENTAL)
    commands:
      - name: serve
        description: Start a MCP server with stdio transport. (EXPERIMENTAL)
        documentation:
          command: |
            Start a Model Context Protocol server to expose GitLab features
            as tools for AI assistants like Claude Code.

            The server uses stdio (standard input and output) transport for
            communication, and provides tools to:

            - Manage issues (list, create, update, close, add notes)
            - Manage merge requests (list, create, update, merge, add notes)
            - Manage projects (list, get details)
            - Manage CI/CD pipelines and jobs

            To configure this server in Claude Code, add this code to your
            MCP settings:

            ```json
            {
              "mcpServers": {
                "glab": {
                  "type": "stdio",
                  "command": "glab",
                  "args": ["mcp", "serve"]
                }
              }
            }
            ```

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Manage Model Context Protocol server features for GitLab integration.

        The MCP server exposes GitLab features as tools for use by
        AI assistants (like Claude Code) to interact with GitLab projects, issues,
        merge requests, pipelines, and other resources.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: milestone <command>
    description: Manage group or project milestones.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create [flags]
        description: Create a milestone in a project or group.
        flags:
          --description=: Description of the milestone.
          --due-date=: Due date for the milestone. Expected in ISO 8601 format (2025-04-15T08:00:00Z).
          --group=: The ID or URL-encoded path of the group.
          --project=: The ID or URL-encoded path of the project.
          --start-date=: Start date for the milestone. Expected in ISO 8601 format (2025-04-15T08:00:00Z).
          --title=!: Title of the milestone.
        documentation:
          command: |
            The `--title` flag is required.
            Optionally provide a description, due date, and start date.

            By default, the milestone is created in the current project. Use
            `--project` to target a different project, or `--group` to create a
            group-level milestone. `--project` and `--group` are mutually exclusive.
      - name: delete <id> [flags]
        description: Delete a milestone from a project or group.
        flags:
          --group=: The ID or URL-encoded path of the group.
          --project=: The ID or URL-encoded path of the project.
        documentation:
          command: |
            Delete a milestone, identified by its numeric ID, from a project or
            group. The milestone is removed; issues, merge requests, and epics
            that referenced it are no longer associated with it.

            By default, the milestone is deleted from the current project. Use
            `--project` to target a different project, or `--group` to delete a
            group-level milestone. `--project` and `--group` are mutually exclusive.
      - name: edit <id> [flags]
        description: Edit a milestone in a project or group.
        flags:
          --description=: Description of the milestone.
          --due-date=: Due date for the milestone. Expected in ISO 8601 format (2025-04-15T08:00:00Z).
          --group=: The ID or URL-encoded path of the group.
          --project=: The ID or URL-encoded path of the project.
          --start-date=: Start date for the milestone. Expected in ISO 8601 format (2025-04-15T08:00:00Z).
          --state=: State of the milestone. Can be 'activate' or 'close'.
          --title=: Title of the milestone.
        documentation:
          command: |
            Edit a milestone, identified by its numeric ID, in a project or group.
            Use the flags to update the title, description, due date, start date,
            or state. Only the fields you specify are updated.

            By default, the milestone is edited in the current project. Use
            `--project` to target a different project, or `--group` to edit a
            group-level milestone. `--project` and `--group` are mutually exclusive.
      - name: get [<id>] [flags]
        description: Get a milestone by ID in a project or group.
        flags:
          --group=: The ID or URL-encoded path of the group.
          --jq=: Filter JSON output with a jq expression.
          --project=: The ID or URL-encoded path of the project.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Get information about a single milestone in a project or group,
            identified by its numeric ID. Use `--output json` to format the result
            as JSON for use with other tools.

            By default, the milestone is looked up in the current project. Use
            `--project` to target a different project, or `--group` to look up a
            group-level milestone. `--project` and `--group` are mutually exclusive.
      - name: list [flags]
        description: List milestones in a project or group.
        flags:
          --group=: The ID or URL-encoded path of the group.
          --include-ancestors: Include milestones from all parent groups.
          --jq=: Filter JSON output with a jq expression.
          --project=: The ID or URL-encoded path of the project.
          --search=: Return only milestones with a title or description matching the provided string.
          --show-id: Show IDs in table output.
          --state=: Return only 'active' or 'closed' milestones.
          --title=: Return only the milestones having the given title.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            Filter by state with `--state` (`active` or `closed`), by title with `--title`,
            or by free-text search with `--search`. For group milestones, use
            `--include-ancestors` to also include milestones from ancestor groups.

            By default, milestones are listed for the current project. Use
            `--project` to target a different project, or `--group` to list
            group-level milestones. `--project` and `--group` are mutually exclusive.

            Use `--output json` to format the result as JSON for use with other tools.
    documentation:
      command: |
        Milestones group issues, merge requests, and epics around a shared
        goal or release. Use the subcommands to create, list, edit, delete,
        or look up milestones in the current project, in another project, or
        in a group.
  - name: mr <command> [flags]
    description: Create, view, and manage merge requests.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: approve [<id | branch>]
        description: Approve merge requests.
        flags:
          -s, --sha=: SHA, which must match the SHA of the HEAD commit of the merge request.
        documentation:
          command: |
            Defaults to the currently checked-out branch.
      - name: approvers [<id> | <branch>] [flags]
        description: List eligible approvers for merge requests in any state.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Lists users and groups eligible to approve, based on the approval
            rules configured for the project.
      - name: checkout [<id> | <branch> | <url>]
        description: Check out an open merge request.
        flags:
          -b, --branch=: Check out merge request with name <branch>.
          -f, --force: Reset local branch to remote when they have diverged. Refuses if working tree has changes that would be lost.
          -t, --track&:
            description: Set checked out branch to track the remote branch.
            default: "true"
          -u, --set-upstream-to=: Set tracking of checked-out branch to [REMOTE/]BRANCH.
        documentation:
          command: |
            Defaults to the currently checked-out branch. Use `--branch` to
            override the local branch name used for the checkout.
      - name: close [<id> | <branch>]
        description: Close a merge request.
        documentation:
          command: |
            Defaults to the currently checked-out branch. You can close
            multiple merge requests by passing multiple IDs or branch names.
      - name: create
        aliases:
          - new
        description: Create a new merge request.
        flags:
          --allow-collaboration: Allow commits from other members. Set to true/false to override project defaults, or omit to use project settings.
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the description. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          --auto-merge: Set the merge request to merge when all merge checks pass.
          --copy-issue-labels: Copy labels from issue to the merge request. Used with --related-issue.
          --create-source-branch: Create a source branch if it does not exist.
          --description-file=: Read the merge request description from a file. Use "-" to read from standard input.
          --draft: Mark merge request as a draft.
          --fill-commit-body: Fill description with each commit body when multiple commits. Can only be used with --fill.
          --no-editor: Don't open editor to enter a description. If true, uses prompt. Defaults to false.
          --push: Push committed changes after creating merge request. Make sure you have committed changes.
          --recover: Save the options to a file if the merge request creation fails. If the file exists, the options are loaded from the recovery file. (EXPERIMENTAL)
          --remove-source-branch: Remove source branch on merge. Set to true/false to override project defaults, or omit to use project settings.
          --reviewer=*: Request review from users by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          --signoff: Append a DCO signoff to the merge request description.
          --squash-before-merge: Squash commits into a single commit when merging. Set to true/false to override project defaults, or omit to use project settings.
          --target-project=&: Add target project by id, OWNER/REPO, or GROUP/NAMESPACE/REPO.
          --template=: Name of a template in '.gitlab/merge_request_templates/' to pre-populate the description. The '.md' extension is optional. Templates are loaded from the local repository only.
          --wip: Mark merge request as a draft. Alternative to --draft.
          -H, --head=: Select another head repository using the `OWNER/REPO` or `GROUP/NAMESPACE/REPO` format, the project ID, or the full URL.
          -a, --assignee=*: Assign merge request to people by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          -b, --target-branch=: The target or base branch into which you want your code merged into.
          -d, --description=: Supply a description for the merge request. Set to "-" to open an editor.
          -f, --fill: Do not prompt for title or description, and just use commit info. Sets `push` to `true`, and pushes the branch.
          -i, --related-issue=: Create a merge request for an issue. If --title is not provided, uses the issue title.
          -l, --label=*: Add label by name. Multiple labels can be comma-separated or specified by repeating the flag.
          -m, --milestone=: The global ID or title of a milestone to assign.
          -s, --source-branch=: Create a merge request from this branch. Default is the current branch.
          -t, --title=: Supply a title for the merge request.
          -w, --web: Continue merge request creation in a browser.
          -y, --yes: Skip submission confirmation prompt. Use --fill to skip all optional prompts.
        exclusiveflags:
          - - description
            - description-file
          - - description
            - template
          - - description-file
            - template
          - - fill
            - template
          - - related-issue
            - template
        documentation:
          command: |
            Defaults to the current branch as the source branch. Use `--fill`
            to automatically fill the title and description from the commit history. Use
            `--draft` to create a draft merge request.

            `--attach` uploads a file and references it at the end of the description. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Files upload to the target project, so the references resolve even for a merge request from a fork.

            The `--attach` flag is an experiment. It might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.

            The `--recover` flag is an experiment: it might be unstable or
            removed at any time, and is not ready for production use. For more
            information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: delete [<id> | <branch>]
        aliases:
          - del
        description: Delete a merge request.
        documentation:
          command: |
            You can delete multiple merge requests by passing multiple IDs
            or branch names.
      - name: diff [<id> | <branch>]
        description: View changes in a merge request.
        flags:
          --color=:
            description: 'Use color in diff output: always, never, auto.'
            default: auto
          --raw: Use raw diff format that can be piped to commands.
        documentation:
          command: |
            Defaults to the currently checked-out branch. Use `--color=never`
            to disable color output.

            For automated scripts or patch tools, use `--raw` for an unmodified Git patch.
      - name: issues [<id> | <branch>]
        aliases:
          - issue
        description: Get issues that close when a merge request is merged.
        documentation:
          command: |
            Lists issues linked to the merge request through closing patterns
            in the description or commits.
      - name: list [flags]
        aliases:
          - ls
        description: List merge requests.
        flags:
          --author=: Filter merge request by author <username>.
          --created-after=: Filter merge requests created after a certain date (ISO 8601 format).
          --created-before=: Filter merge requests created before a certain date (ISO 8601 format).
          --deployed-after=: Filter merge requests deployed after a certain date (ISO 8601 format).
          --deployed-before=: Filter merge requests deployed before a certain date (ISO 8601 format).
          --environment=: Filter merge requests deployed to the given environment <name>.
          --jq=: Filter JSON output with a jq expression.
          --mine&: Get only merge requests assigned to me.
          --not-draft: Filter by non-draft merge requests.
          --not-label=*: Filter merge requests by not having label <name>. Multiple labels can be comma-separated or specified by repeating the flag.
          --search=: Filter by <string> in title and description.
          -A, --all: Get all merge requests.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -M, --merged: Get only merged merge requests.
          -O, --opened&: Get only open merge requests.
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -S, --sort=: 'Sort direction for --order field: asc or desc.'
          -a, --assignee=*: Get only merge requests assigned to users. Multiple users can be comma-separated or specified by repeating the flag.
          -c, --closed: Get only closed merge requests.
          -d, --draft: Filter by draft merge requests.
          -l, --label=*: Filter merge request by label <name>. Multiple labels can be comma-separated or specified by repeating the flag.
          -m, --milestone=: Filter merge request by milestone <id>.
          -o, --order=: 'Order merge requests by <field>. Order options: created_at, updated_at, merged_at, title, priority, label_priority, milestone_due, and popularity.'
          -p, --page=:
            description: Page number.
            default: "1"
          -r, --reviewer=*: Get only merge requests with users as reviewer. Multiple users can be comma-separated or specified by repeating the flag.
          -s, --source-branch=: Filter by source branch <name>.
          -t, --target-branch=: Filter by target branch <name>.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          -g, --group=: Select a group/subgroup. This option is ignored if a repo argument is set.
        exclusiveflags:
          - - closed
            - merged
          - - draft
            - not-draft
          - - label
            - not-label
        documentation:
          command: |
            Defaults to open merge requests. Use `--all` to include closed
            and merged requests. Use `--group` to list for a group instead
            of the current project.
      - name: merge [<id | branch>]
        aliases:
          - accept
        description: Merge or accept a merge request.
        flags:
          --auto-merge:
            description: Set auto-merge.
            default: "true"
          --sha=: Merge only if the HEAD of the source branch matches this SHA. Use to ensure that only reviewed commits are merged.
          --squash-message=: Custom squash commit message.
          --when-pipeline-succeeds&:
            description: Merge only when pipeline succeeds
            default: "true"
          -d, --remove-source-branch: Remove source branch on merge.
          -m, --message=: Custom merge commit message.
          -r, --rebase: Rebase the commits onto the base branch.
          -s, --squash: Squash commits on merge.
          -y, --yes: Skip submission confirmation prompt.
        exclusiveflags:
          - - rebase
            - squash
        documentation:
          command: |
            Defaults to the currently checked-out branch. When a pipeline is running,
            auto-merge is enabled by default. Pass `--auto-merge=false` to
            merge immediately. Use `--squash` or `--rebase` to control
            the merge strategy, or `--remove-source-branch` to delete the
            source branch after merging.
      - name: note [<id> | <branch>]
        aliases:
          - comment
        description: Manage comments and discussions on a merge request.
        flags:
          --resolve=&: Resolve the discussion containing the specified note ID.
          --unique&: Do not create a comment if a comment with the same body already exists.
          --unresolve=&: Unresolve the discussion containing the specified note ID.
          -m, --message=&: Comment or note message.
        exclusiveflags:
          - - message
            - resolve
          - - message
            - unresolve
          - - resolve
            - unresolve
        commands:
          - name: create [<id> | <branch>]
            description: Create a comment or discussion on a merge request. (EXPERIMENTAL)
            flags:
              --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the comment. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
              --file=: File path for a diff comment, like <path/to/file>. Targets the latest merge request diff version.
              --internal: Create the note as an internal note, visible only to project members.
              --line=: Line in the new version. A single line number, like 42, or a range, like 10:15.
              --old-line=: Line in the old version, for commenting on a removed line.
              --reply=: Reply to an existing discussion. Accepts a full discussion ID or a unique prefix of at least 8 characters.
              --resolvable:
                description: Create the note as a resolvable discussion thread. Set to false to create a non-resolvable note.
                default: "true"
              --unique: Don't create a note if a note with the same body already exists. Reads all merge request comments first.
              -m, --message=: Comment or note message.
            exclusiveflags:
              - - attach
                - unique
              - - file
                - reply
              - - file
                - unique
              - - file
                - internal
              - - line
                - old-line
              - - reply
                - unique
            documentation:
              command: |
                Add a comment to a merge request. By default, the command creates the comment
                as a new discussion thread.

                Use `--resolvable=false` to create a non-resolvable note instead.
                Non-resolvable notes do not block merging when the project requires
                **All threads must be resolved**. Use this option for automation or status
                updates that do not need a human to resolve them.

                Use `--internal` to create an internal note, which only project members can view. A reply to an internal thread is itself internal. When combined with `--reply`, `--internal` checks the target thread's visibility and fails if the thread is public. Replying to an internal thread without `--internal` still produces an internal reply.

                Use `--reply` to add a note to an existing discussion thread instead of
                starting a new one. The value can be a full discussion ID or a unique
                prefix of at least 8 characters. Find discussion IDs with
                `glab mr note list`. Human-readable output uses
                eight characters before the ellipsis, for example
                `[discussion: abc12345…]`; pass
                only those characters, for example `--reply abc12345`. To get a
                full ID, use the `id` field of each discussion object:
                `glab mr note list -F json | jq -r '.[].id'`.

                Use `--file` to place a diff comment on a specific file in the latest
                merge request diff version. Combine with `--line` (new side) or
                `--old-line` (old/removed side) to target a specific line. Omit
                both flags for a file-level comment.

                To add the comment to a pending review instead of publishing it immediately, use `glab mr note draft create`.

                The flag rules are:

                - `--line` and `--old-line` require `--file`, and
                cannot be used together.
                - `--file`, `--reply`, and `--unique` are mutually
                exclusive.
                - `--resolvable=false` cannot be combined with `--reply`
                or `--file` (and by extension `--line` or
                `--old-line`).
                - `--internal` cannot be combined with `--file`
                (and by extension `--line` or
                `--old-line`), nor with `--resolvable=true` unless
                `--reply` is also given.
                - `--attach` and `--unique` are mutually exclusive,
                because every upload gets a fresh URL and so an attached comment can
                never match an existing one.

                `--attach` uploads a file and references it at the end of the comment. Repeat the flag for more than one file, or pass `-` to read the file from standard input. An attachment is content on its own, so a comment with only `--attach` neither prompts nor reads a body from stdin.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: delete [<id> | <branch>] <note-id>
            description: Delete a note from a merge request. (EXPERIMENTAL)
            flags:
              -y, --yes: Skip confirmation prompt.
            documentation:
              command: |
                Permanently delete a note from a merge request.

                `<note-id>` is a numeric note ID, not a hex discussion ID.
                You can find note IDs with:

                - `glab mr note list -F json` (the `.id` field)
                - Note URLs: `.../merge_requests/1#note_12345`

                Deletion is permanent and cannot be undone. Unless you pass `--yes`,
                the command prompts you to confirm.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: draft <command> [flags]
            description: Manage your pending review comments on a merge request. (EXPERIMENTAL)
            commands:
              - name: create [<id> | <branch>]
                description: Add a pending review comment to a merge request. (EXPERIMENTAL)
                flags:
                  --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the comment. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
                  --file=: File path for a diff comment, like <path/to/file>. Targets the latest merge request diff version.
                  --line=: Line in the new version. A single line number, like 42, or a range, like 10:15.
                  --old-line=: Line in the old version, for commenting on a removed line.
                  --reply=: Reply to an existing discussion. Accepts a full discussion ID or a unique prefix of at least 8 characters.
                  -m, --message=: Comment message. If omitted, opens an editor or reads from stdin.
                exclusiveflags:
                  - - file
                    - reply
                  - - line
                    - old-line
                documentation:
                  command: |
                    Add a comment to your pending review. The comment stays visible only to you until you publish the review with `glab mr note draft publish` or submit it from the merge request page.

                    On success, the command prints the ID of the pending comment. Pass that ID to `glab mr note draft update` or `glab mr note draft delete`.

                    Use `--file` to place the comment on a specific file in the latest merge request diff version. Combine with `--line` (new side) or `--old-line` (old/removed side) to target a specific line. Omit both flags for a file-level comment.

                    Use `--reply` to reply to an existing discussion thread. The value can be a full discussion ID or a unique prefix of at least 8 characters. Find discussion IDs with `glab mr note list`.

                    The flag rules are:

                    - `--line` and `--old-line` require `--file`, and cannot be used together.
                    - `--file` and `--reply` are mutually exclusive.

                    `--attach` uploads a file and references it at the end of the comment. Repeat the flag for more than one file, or pass `-` to read the file from standard input. The upload happens immediately, even though the comment stays pending. An attachment is content on its own, so a comment with only `--attach` neither prompts nor reads a body from stdin.

                    This feature is an experiment and is not ready for production use.
                    It might be unstable or removed at any time.
                    For more information, see
                    https://docs.gitlab.com/policy/development_stages_support/.
              - name: delete [<id> | <branch>] <draft-note-id>
                description: Delete one of your pending review comments from a merge request. (EXPERIMENTAL)
                flags:
                  -y, --yes: Skip confirmation prompt.
                documentation:
                  command: |
                    Discard a pending review comment before you publish the review. `<draft-note-id>` is the ID printed by `glab mr note draft create` or listed by `glab mr note draft list`.

                    Deletion is permanent and cannot be undone. Unless you pass `--yes`, the command shows the comment and prompts you to confirm. When not running interactively, `--yes` is required.

                    This feature is an experiment and is not ready for production use.
                    It might be unstable or removed at any time.
                    For more information, see
                    https://docs.gitlab.com/policy/development_stages_support/.
              - name: list [<id> | <branch>]
                description: List your pending review comments on a merge request. (EXPERIMENTAL)
                flags:
                  --file=: Show only pending diff comments on this file path.
                  --jq=: Filter JSON output with a jq expression.
                  -F, --output=:
                    description: 'Format output as: text, json.'
                    default: text
                documentation:
                  command: |
                    Human-readable output shows the ID of each pending comment, the file and line it targets, and the discussion it replies to. Pass the ID to `glab mr note draft update` or `glab mr note draft delete`.

                    JSON output returns the pending comment objects as the API reports them.

                    This feature is an experiment and is not ready for production use.
                    It might be unstable or removed at any time.
                    For more information, see
                    https://docs.gitlab.com/policy/development_stages_support/.
              - name: publish [<id> | <branch>]
                description: Publish all your pending review comments on a merge request. (EXPERIMENTAL)
                flags:
                  --internal: Mark the summary note as internal. Requires --message.
                  --reviewer-state=: 'Set the review state after publishing: requested_changes, reviewed. Does not record a formal approval.'
                  -m, --message=: Summary note to add to the merge request when publishing.
                  -y, --yes: Skip confirmation prompt.
                documentation:
                  command: |
                    Publish every pending review comment you created on a merge request, as when you submit a review from the merge request page. Only your own pending comments are published; other reviewers' pending comments are unaffected. Check what is pending with `glab mr note draft list` first.

                    Use `--message` to add a summary note to the merge request when publishing, and `--internal` to restrict that summary to project members with at least the Reporter role.

                    Use `--reviewer-state` to set your review state on the merge request. Neither state records a formal approval; use `glab mr approve` to approve. If you are the merge request author, GitLab ignores this flag unless you are also listed as one of the reviewers.

                    Unless you pass `--yes`, the command shows the number of pending comments and prompts you to confirm. When not running interactively, `--yes` is required. If there are no pending comments, the command exits with an error.

                    This feature is an experiment and is not ready for production use.
                    It might be unstable or removed at any time.
                    For more information, see
                    https://docs.gitlab.com/policy/development_stages_support/.
              - name: update [<id> | <branch>] <draft-note-id>
                description: Update the body of one of your pending review comments. (EXPERIMENTAL)
                flags:
                  --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the comment. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
                  -m, --message=: New comment body. If omitted, opens an editor or reads from stdin.
                documentation:
                  command: |
                    Replace the body of a pending review comment before you publish the review. `<draft-note-id>` is the ID printed by `glab mr note draft create` or listed by `glab mr note draft list`.

                    You can change only the body. A pending diff comment stays on the same file and lines. Pending comments on images cannot be updated from the command line, because their position cannot be preserved.

                    `--attach` uploads a file and references it at the end of the comment. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Without `--message` the references are added to the body the comment already has, instead of replacing it.

                    This feature is an experiment and is not ready for production use.
                    It might be unstable or removed at any time.
                    For more information, see
                    https://docs.gitlab.com/policy/development_stages_support/.
            documentation:
              command: |
                Pending review comments, also called draft notes, are visible only to you until you publish your review. Use these commands to add comments to a review, check and edit them, and then publish them all at once.

                Each command acts only on your own pending comments. Other reviewers' pending comments are never listed, changed, or published.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: list [<id> | <branch>]
            description: List merge request discussions. (EXPERIMENTAL)
            flags:
              --file=: Show only diff notes on this file path.
              --jq=: Filter JSON output with a jq expression.
              --state=:
                description: 'Resolution state: all, resolved, unresolved.'
                default: all
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -t, --type=:
                description: 'Note type: all, general, diff, system.'
                default: all
            documentation:
              command: |
                Fetches and displays merge request discussions.

                Human-readable output shows an eight-character prefix for each non-system
                discussion. Use the characters before the ellipsis with
                `glab mr note create --reply`. JSON output preserves the full discussion ID in the `id` field of each discussion object. Extract it with:
                `glab mr note list -F json | jq -r '.[].id'`.

                Supports filtering by note type, resolution state, and file path.
                Supports JSON output for scripting.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: reopen [<id> | <branch>] <discussion-id>
            description: Reopen a discussion on a merge request. (EXPERIMENTAL)
            documentation:
              command: |
                Reopen a discussion on a merge request.

                The identifier can be one of the following:

                - Discussion ID: full 40-character hex string or an 8+ character prefix
                - Note ID: integer note ID (looks up the parent discussion automatically)

                If a prefix matches multiple discussions, an error is returned with the ambiguous matches.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: resolve [<id> | <branch>] <discussion-id>
            description: Resolve a discussion on a merge request. (EXPERIMENTAL)
            documentation:
              command: |
                Resolve a discussion on a merge request.

                The identifier can be one of the following:

                - Discussion ID: full 40-character hex string or an 8+ character prefix
                - Note ID: integer note ID (looks up the parent discussion automatically)

                If a prefix matches multiple discussions, an error is returned with the ambiguous matches.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: update [<id> | <branch>] <note-id>
            description: Update the body of a note on a merge request. (EXPERIMENTAL)
            flags:
              --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the note. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
              -m, --message=: New note body. If omitted, opens an editor or reads from stdin.
            documentation:
              command: |
                Replace the body of an existing note on a merge request.

                `<note-id>` is a numeric note ID, not a hex discussion ID.
                You can find note IDs with:

                - `glab mr note list -F json` (the `.id` field)
                - Note URLs: `.../merge_requests/1#note_12345`

                You can change only the note body. You cannot move the position of diff notes.

                `--attach` uploads a file and references it at the end of the note. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Without `--message` the references are added to the body the note already has, instead of replacing it.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
        documentation:
          command: |
            Creates a comment by default. Use `--resolve` or
            `--unresolve` to manage existing discussion threads.
      - name: rebase [<id> | <branch>] [flags]
        description: Rebase the source branch of a merge request against its target branch.
        flags:
          --skip-ci: Rebase merge request while skipping CI/CD pipeline.
        documentation:
          command: |
            If you don't have permission to push to the merge request's source branch, you'll get a 403 Forbidden response.
      - name: reopen [<id>... | <branch>...]
        aliases:
          - open
        description: Reopen a merge request.
        documentation:
          command: |
            You can reopen multiple merge requests by passing multiple IDs
            or branch names.
      - name: revoke [<id> | <branch>]
        aliases:
          - unapprove
        description: Revoke approval on a merge request.
        documentation:
          command: |
            Defaults to the currently checked-out branch.
      - name: subscribe [<id> | <branch>]
        aliases:
          - sub
        description: Subscribe to a merge request.
        documentation:
          command: |
            You receive notifications for updates when subscribed.
      - name: todo [<id> | <branch>]
        aliases:
          - add-todo
        description: Add a to-do item to a merge request.
        documentation:
          command: |
            Adding a to-do item flags the merge request for follow-up in your To-Do List.
      - name: unsubscribe [<id> | <branch>]
        aliases:
          - unsub
        description: Unsubscribe from a merge request.
        documentation:
          command: |
            You no longer receive notifications after unsubscribing.
      - name: update [<id> | <branch>]
        description: Update a merge request.
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the description. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          --description-file=: Read the merge request description from a file. Use "-" to read from standard input.
          --draft: Mark merge request as a draft.
          --fill-commit-body: Fill body with each commit body when multiple commits. Can only be used with --fill.
          --lock-discussion: Lock discussion on merge request.
          --remove-source-branch: Toggles the removal of the source branch on merge.
          --reviewer=*: Request review from users by their usernames. Prefix with '!' or '-' to remove from existing reviewers, '+' to add. Otherwise, replace existing reviewers with given users. Multiple usernames can be comma-separated or specified by repeating the flag.
          --squash-before-merge: Toggles the option to squash commits into a single commit when merging.
          --target-branch=: Set target branch.
          --unassign: Unassign all users.
          --unlock-discussion: Unlock discussion on merge request.
          --wip: Mark merge request as a work in progress. Alternative to --draft.
          -a, --assignee=*: Assign users via username. Prefix with '!' or '-' to remove from existing assignees, '+' to add. Otherwise, replace existing assignees with given users. Multiple usernames can be comma-separated or specified by repeating the flag.
          -d, --description=: Merge request description. Set to "-" to open an editor.
          -f, --fill: Do not prompt for title or body, and just use commit info.
          -l, --label=*: Add labels.
          -m, --milestone=: Title of the milestone to assign. Set to "" or 0 to unassign.
          -r, --ready: Mark merge request as ready to be reviewed and merged.
          -t, --title=: Title of merge request.
          -u, --unlabel=*: Remove labels.
          -y, --yes: Skip confirmation prompt.
        exclusiveflags:
          - - description
            - description-file
        documentation:
          command: |
            Defaults to the currently checked-out branch. Use `--fill` to
            automatically fill the title and description from the commit history.

            `--attach` uploads a file and references it at the end of the description. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Without `--description` the references are added to the description the merge request already has, instead of replacing it.

            The `--attach` flag is an experiment. It might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: view [<id | branch>]
        aliases:
          - show
        description: Display the title, body, and other information about a merge request.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --resolved: Show only resolved discussions (implies --comments).
          --unresolved: Show only unresolved discussions (implies --comments).
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -c, --comments: Show merge request comments and activities.
          -p, --page=: Page number.
          -s, --system-logs: Show system activities and logs.
          -w, --web: Open merge request in a browser. Uses default browser or browser specified in BROWSER variable.
        documentation:
          command: |
            You can use a branch name or ID. Use `--web` to open in a browser.
    documentation:
      command: |
        Open a merge request from your current branch, list and view existing
        merge requests, and manage them: approve, merge, rebase, comment, and
        more.

        Use `--repo` to target a project other than the current one.
  - name: opentofu <command> [flags]
    aliases:
      - terraform
      - tf
    description: Work with the OpenTofu or Terraform integration.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: init <state> [flags]
        description: Initialize OpenTofu or Terraform.
        flags:
          -b, --binary=:
            description: Name or path of the OpenTofu or Terraform binary to use for the initialization.
            default: tofu
          -d, --directory=:
            description: Directory of the OpenTofu or Terraform project to initialize.
            default: .
        documentation:
          command: |
            Configures the GitLab HTTP backend for OpenTofu or Terraform state
            and runs `tofu init`. You must run this command from a GitLab
            project repository.
      - name: state <command> [flags]
        description: Work with the OpenTofu or Terraform states.
        commands:
          - name: delete <state> [<serial>] [flags]
            description: Delete a state or a specific version of a state.
            flags:
              -f, --force: Force delete the state without prompting.
            documentation:
              command: |
                Prompts for confirmation before deletion. Use `--force` to skip
                the confirmation prompt.
          - name: download <state> [<serial>]
            description: Download the given state and output as JSON to stdout.
            documentation:
              command: |
                Downloads the latest serial version if no serial is specified.
          - name: list
            description: List states.
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
            documentation:
              command: |
                Lists the OpenTofu or Terraform states in the current project,
                including each state's latest version serial and lock status.
          - name: lock <state>
            description: Lock the given state.
            documentation:
              command: |
                Locking a state prevents others from modifying it until it is
                unlocked, which avoids concurrent writes that could corrupt the
                state.
          - name: unlock <state>
            description: Unlock the given state.
            documentation:
              command: |
                Unlocking a state releases a lock held on it, so others can modify
                the state again.
        documentation:
          command: |
            List the states in the current project, lock or unlock a state to
            control concurrent access, download a state as JSON, or delete a
            state or one of its versions.
    documentation:
      command: |
        Manage OpenTofu and Terraform state stored in the GitLab-managed
        state backend.

        Initialize a working directory against a GitLab-managed state, and
        list, lock, unlock, download, or delete states.
  - name: orbit [<command>] [flags]
    description: Run the GitLab Orbit CLI. (EXPERIMENTAL)
    flags:
      --install: Install the Orbit binary without running it.
      --update: Check for and install updates to the binary. Same as the update command.
      -h, --help: Show the Orbit binary's help, or this text until the binary is installed.
      -y, --yes: Skip confirmation prompts.
    commands:
      - name: update
        description: Update the GitLab Orbit CLI binary to the latest version. (EXPERIMENTAL)
        flags:
          -y, --yes: Skip the download prompt when the binary is not installed.
        documentation:
          command: |
            Checks for a newer GitLab Orbit CLI version and installs it. If the binary is not installed yet, `glab` downloads the latest version.

            Updates do not apply when you use a custom binary set with `GLAB_ORBIT_CLI_BINARY_PATH` or the `orbit_cli_binary_path` configuration key.

            `glab orbit --update` does the same thing.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Run the GitLab Orbit CLI through glab.

        Every command and flag, including `--help`, is forwarded verbatim to the managed Orbit binary. glab downloads, verifies, and updates that binary for you on first use. Until the binary is installed, `--help` shows this text instead. glab passes your resolved GitLab credential to the binary on every invocation, so remote commands such as `glab orbit query` need no separate login.

        glab handles only the `update` command and the `--install`, `--update`, and `--yes` flags itself. Run `glab help orbit` to see them.

        Prerequisites:

        - Run `glab auth login` to authenticate.
        - Orbit must be enabled for your namespace (the `knowledge_graph` feature flag).

        Configuration options:

        - `orbit_cli_auto_run`: Skip the run confirmation prompt.
        - `orbit_cli_auto_download`: Skip the download confirmation prompt.

        For more information, see the Orbit documentation.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: packages <command> [flags]
    description: Manage packages in the GitLab package registry.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: delete <id>
        aliases:
          - rm
        description: Delete a package from a project's package registry.
        flags:
          -y, --yes: Skip the confirmation prompt.
        documentation:
          command: |
            Packages are identified by their numeric ID. Use `glab packages list`
            to find the ID.

            The command asks for confirmation before deleting; use `-y` to skip
            the prompt in scripts.

            By default, the package is removed from the current project. Use `--repo`
            to target another project.
      - name: download --name <package> --version <version> --filename <file> [flags]
        aliases:
          - dl
        description: Download a file from a project's package registry.
        flags:
          --filename=!: Name of the file within the package to download.
          --force: Overwrite the target file if it already exists.
          --no-verify: 'Do not verify the checksum of the downloaded file. Warning: when enabled, this setting allows the download of files that are corrupt or tampered with.'
          --version=!: Version of the package.
          -n, --name=!: Name of the package.
          -p, --path=: Directory to save the file in (keeps its original name) or a full file path to rename it. Defaults to the original name in the current directory.
        documentation:
          command: |
            Download a generic package file, identified by its package name, version,
            and file name.

            Use `--path` to choose where the file is saved. If it names a directory
            (it ends with a separator or already exists as one), the file is saved
            there under its original name. Otherwise it is saved as that exact path,
            letting you rename the file. By default the file is saved in the current
            directory under its original name.

            By default, the downloaded file is verified against the checksum stored in
            the registry. This requires extra API calls to look up the file's metadata.
            Use `--no-verify` to skip verification. This can allow corrupted or
            tampered files; use with caution.

            If the target file already exists, the download fails. Use `--force` to
            overwrite it.

            By default, files are downloaded from the current project. Use `--repo`
            to target another project.
      - name: list [flags]
        aliases:
          - ls
        description: List packages in a project's package registry.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --package-type=: 'Filter packages by type. One of: composer, conan, debian, generic, golang, helm, maven, npm, nuget, pypi, terraform_module.'
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -n, --name=: Filter packages by name (substring match).
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            Packages of all types (generic, npm, maven, etc.) are returned. Use
            `--package-type` to filter by type and `--name` to filter by name. Use
            `--page` and `--per-page` to paginate the result.

            By default, packages are listed for the current project. Use `--repo`
            to target another project.
      - name: upload <file> --name <package> --version <version> [flags]
        aliases:
          - ul
        description: Upload a file to a project's package registry.
        flags:
          --filename=: Name to store the file under. Defaults to the local file name.
          -n, --name=!: Name of the package.
          -v, --version=!: Version of the package.
        documentation:
          command: |
            Uploaded files are stored as generic packages: arbitrary files identified
            by a package name, version, and file name.

            The file is stored under the given package name and version. By default
            it keeps its original file name; use `--filename` to store it under a
            different name.

            By default, the file is uploaded to the current project. Use `--repo`
            to target another project.
    documentation:
      command: |
        Upload, download, list, and delete packages in a project's package
        registry, using your existing `glab` authentication.

        `list` and `delete` operate on packages of any type. `upload` and `download`
        are limited to generic packages, which let you store and retrieve
        arbitrary files identified by a package name, version, and file name.
  - name: release <command> [flags]
    description: Manage GitLab releases.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create <tag> [<files>...]
        description: Create a new GitLab release, or update an existing one.
        flags:
          --experimental-notes-text-or-file=&: (EXPERIMENTAL) Value to use as release notes. If a file exists with this value as path, its content will be used. Otherwise, the value itself will be used as text.
          --no-close-milestone: Prevent closing milestones after creating the release.
          --no-update: Prevent updating the existing release.
          --package-name=:
            description: The package name, when uploading assets to the generic package release with --use-package-registry.
            default: release-assets
          --publish-to-catalog: (EXPERIMENTAL) Publish the release to the GitLab CI/CD catalog.
          --use-package-registry: Upload release assets to the generic package registry of the project. Overrides the GITLAB_RELEASE_ASSETS_USE_PACKAGE_REGISTRY environment variable.
          -D, --released-at=: ISO 8601 datetime when the release was ready. Defaults to the current datetime.
          -F, --notes-file=: Read release notes 'file'. To read from stdin, use '-'.
          -N, --notes=: The release notes or description. Accepts Markdown.
          -T, --tag-message=: Message to use if creating a new annotated tag.
          -a, --assets-links=: JSON string representation of assets links. See Examples for usage.
          -m, --milestone=*: The title of each milestone the release is associated with. Multiple milestones can be comma-separated or specified by repeating the flag.
          -n, --name=: The release name or title.
          -r, --ref=: If the specified tag doesn't exist, create a release from the ref and tag it with the specified tag name. Accepts a commit SHA, tag name, or branch name.
        exclusiveflags:
          - - experimental-notes-text-or-file
            - notes
          - - experimental-notes-text-or-file
            - notes-file
        documentation:
          command: |
            Create a new GitLab release for a repository, or
            update an existing one. Requires at least the Developer role.

            An existing release is updated with the new information you provide.

            To create a release from an annotated Git tag:

            1. Create the tag locally with Git, and push the tag to GitLab.
            2. Run this command.
            3. If the Git tag you specify doesn't exist, the command creates a
               release from the latest state of the default branch, and tags it
               with the tag name you specify.

               To override this behavior, use `--ref`. The `ref`
               can be a commit SHA, another tag name, or a branch name.
            4. Optional. To fetch the new tag locally after the release, run
               `git fetch --tags origin`.

            Authentication in CI/CD:

            - Recommended: Use `CI_JOB_TOKEN` and turn on CI auto-login by
              setting `GLAB_ENABLE_CI_AUTOLOGIN=true`. glab sends
              `CI_JOB_TOKEN` in the `JOB-TOKEN` header, which the Releases
              API accepts.
            - Alternative: Use `GITLAB_TOKEN` set to a project or group access token with the
              `api` scope.
            - Do not set `GITLAB_TOKEN=$CI_JOB_TOKEN` because the Releases API will
              return a `404 Not Found`. `GITLAB_TOKEN` is sent as a personal access token in
              the `PRIVATE-TOKEN` header, which the Releases API does not accept.

            The `--publish-to-catalog` flag is an experiment: it might be
            unstable or removed at any time, and is not ready for production use.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: delete <tag>
        description: Delete a GitLab release.
        flags:
          -t, --with-tag: Delete the associated tag.
          -y, --yes: Skip the confirmation prompt.
        documentation:
          command: |
            Delete release assets to GitLab release. Requires the Maintainer role or higher.

            Deleting a release does not delete the associated tag, unless you specify `--with-tag`.
      - name: download [<tag>]
        description: Download asset files from a GitLab release.
        flags:
          -D, --dir=:
            description: Directory to download the release assets to.
            default: .
          -n, --asset-name=*: Download only assets that match the name or a glob pattern.
        documentation:
          command: |
            Download asset files from a GitLab release.

            If no tag is specified, downloads assets from the latest release.
            To specify a file name to download from the release assets, use `--asset-name`.
            `--asset-name` flag accepts glob patterns.
      - name: list [flags]
        aliases:
          - ls
        description: List releases in a repository.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
          -t, --tag=&: Filter releases by tag <name>.
        documentation:
          command: |
            By default, lists the releases for the current project, most recent
            first. Use `--repo` to target a different project, or `-F json` for
            machine-readable output.
      - name: upload <tag> [<files>...]
        description: Upload release asset files or links to a GitLab release.
        flags:
          --package-name=:
            description: The package name to use when uploading the assets to the generic package release with --use-package-registry.
            default: release-assets
          --use-package-registry: Upload release assets to the generic package registry of the project. Alternatively to this flag you may also set the GITLAB_RELEASE_ASSETS_USE_PACKAGE_REGISTRY environment variable to either the value true or 1. The flag takes precedence over this environment variable.
          -a, --assets-links=: '`JSON` string representation of assets links, like: `--assets-links=''[{"name": "Asset1", "url":"https://<domain>/some/location/1", "link_type": "other", "direct_asset_path": "path/to/file"}]''`.'
        documentation:
          command: |
            Upload release assets to a GitLab release.

            Define the display name by appending '#' after the filename.
            The link type comes after the display name, like this: 'myfile.tar.gz#My display name#package'
      - name: view [<tag>]
        description: View information about a GitLab release.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -w, --web: Open the release in the browser.
        documentation:
          command: |
            View information about a GitLab release.

            Without an explicit tag name argument, shows the latest release in the project.
    documentation:
      command: |
        A release bundles a Git tag with release notes and downloadable
        assets, such as binaries or source archives.

        Create and update releases, list and view them, upload assets, and
        download or delete releases. Use `--repo` to target a project other
        than the current one.
  - name: repo <command> [flags]
    aliases:
      - project
    description: Work with GitLab repositories and projects.
    commands:
      - name: archive [<repo>] [<dir>] [flags]
        description: Get an archive of the repository.
        flags:
          -f, --format=:
            description: 'Optional. Specify format if you want a downloaded archive: tar.gz, tar.bz2, tbz, tbz2, tb2, bz2, tar, zip.'
            default: zip
          -s, --sha=: The commit SHA to download. A tag, branch reference, or SHA can be used. Defaults to the tip of the default branch if not specified.
        documentation:
          command: |
            Without a repository argument, archives the current repository.
            The repository accepts these shorthand references:

            - repo
            - namespace/repo
            - namespace/group/repo

            The second argument sets the directory to download the archive into.
      - name: clone [<repo> | -g <group>] [<dir>] [flags] [-- <gitflags>...]
        description: Clone a GitLab repository or project.
        flags:
          --active: Limit by project status. When true, returns active projects. When false, returns projects that are archived or marked for deletion. Used with the --group flag.
          --page=:
            description: Page number.
            default: "1"
          --paginate: Make additional HTTP requests to fetch all pages of projects before cloning. Respects --per-page.
          --per-page=:
            description: Number of items to list per page.
            default: "30"
          --wiki: Clone the project's wiki repository.
          -G, --include-subgroups:
            description: Include projects in subgroups of this group. Default is true. Used with the --group flag.
            default: "true"
          -I, --with-issues-enabled: Limit by projects with the issues feature enabled. Default is false. Used with the --group flag.
          -M, --with-mr-enabled: Limit by projects with the merge request feature enabled. Default is false. Used with the --group flag.
          -S, --with-shared:
            description: Include projects shared to this group. Default is true. Used with the --group flag.
            default: "true"
          -a, --archived: Limit by archived status. Use with '-a=false' to exclude archived repositories. Used with the --group flag.
          -g, --group=: Specify the group to clone repositories from.
          -m, --mine: Limit by projects in the group owned by the current authenticated user. Used with the --group flag.
          -p, --preserve-namespace: Clone the repository in a subdirectory based on namespace.
          -v, --visibility=: 'Limit by visibility: public, internal, private. Used with the --group flag.'
        exclusiveflags:
          - - group
            - wiki
        documentation:
          command: |
            Clone a GitLab repository to your local machine. Specify the
            repository by name, namespace/repo path, full URL, or project ID.

            The command uses your configured protocol (SSH or HTTPS).

            To pass Git clone flags, add them after `--`. For example:
            `glab repo clone <repo> -- --branch <branch-name>`

            When you clone a fork you own, the command adds an `upstream`
            remote that points to the parent project.

            Use `--wiki` to clone the wiki repository associated with a project.
      - name: contributors
        aliases:
          - users
        description: Get repository contributors list.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -o, --order=:
            description: Return contributors ordered by name, email, or commits (orders by commit date) fields.
            default: commits
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --sort=: 'Sort direction for --order field: asc or desc.'
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        documentation:
          command: |
            Lists the users who have contributed commits to the repository, with
            each contributor's commit count. Use `--repo` to target a different
            repository.
      - name: create [path] [flags]
        description: Create a new GitLab project/repository.
        flags:
          --defaultBranch=: Branch name for the new project, overriding both the GitLab instance default and your local git configuration.
          --internal: 'Make project internal: visible to any authenticated user. Default.'
          --readme: Initialize project with `README.md`. The repository is cloned locally after creation to ensure the local branch matches the remote.
          --remoteName=:
            description: Remote name for the Git repository you're in. Defaults to `origin` if not provided.
            default: origin
          -P, --public: 'Make project public: visible without any authentication.'
          -d, --description=: Description of the new project. Set to "-" to open an editor.
          -g, --group=: Namespace or group for the new project. Defaults to the current user's namespace.
          -n, --name=: Name of the new project.
          -p, --private: 'Make project private: visible only to project members.'
          -s, --skipGitInit: Skip local repository setup (skips both 'git init' and cloning).
          -t, --tag=*: The list of tags for the project.
        documentation:
          command: |
            Creates the new project with your first configured host in your `glab`
            configuration. The host defaults to `GitLab.com` if not set. To set a host,
            provide either:

            - A `GITLAB_HOST` environment variable.
            - A full URL for the project.
      - name: delete [[<NAMESPACE>/]<NAME>]
        description: Delete an existing project on GitLab.
        flags:
          -y, --yes: Skip the confirmation prompt and immediately delete the project.
        documentation:
          command: |
            Delete an existing project on GitLab.

            Without an argument, targets the project for the current repository.

            This permanently deletes the entire project, including:

            - The Git repository.
            - Issues and merge requests.
            - Wiki pages.
            - CI/CD pipelines and job artifacts.
            - Other project content and settings.

            This action cannot be undone.
      - name: fork [<repo>]
        description: Fork a GitLab repository.
        flags:
          --remote: 'Add a remote for the fork. Options: true, false.'
          -c, --clone: 'Clone the fork. Options: true, false.'
          -n, --name=: The name assigned to the new project after forking.
          -p, --path=: The path assigned to the new project after forking.
        documentation:
          command: |
            Defaults to the current repository if no repository is specified.
            Use `--clone` and `--remote` to skip the interactive prompts.
      - name: list
        aliases:
          - ls
        description: Get list of repositories.
        flags:
          --archived: Limit by archived status. Use 'false' to exclude archived repositories. Used with the '--group' flag.
          --jq=: Filter JSON output with a jq expression.
          --member: List only projects of which you are a member.
          --starred: List only starred projects.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -G, --include-subgroups: Include projects in subgroups of this group. Default is false. Used with the '--group' flag.
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -a, --all: List all projects on the instance. Removes the ownership filter. Results are still paginated. Use --page to navigate.
          -g, --group=: Return repositories in only the given group.
          -m, --mine: List only projects you own. Default if no filters are provided.
          -o, --order=:
            description: Return repositories ordered by id, name, path, created_at, updated_at, similarity, star_count, last_activity_at.
            default: last_activity_at
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --sort=: 'Sort direction for --order field: asc or desc.'
          -u, --user=: List user projects.
        exclusiveflags:
          - - group
            - user
        documentation:
          command: |
            By default, lists the projects you own. Use `--all` to list every
            project on the instance, `--group` to scope to one group, or
            `--user` to list another user's projects.
      - name: members <command> [flags]
        description: Manage project members.
        commands:
          - name: add [flags]
            description: Add a member to the project.
            flags:
              --role-id=: ID of a custom role defined in the project or group.
              --username=: Username instead of user-id.
              -e, --expires-at=: Expiration date for the membership (YYYY-MM-DD)
              -r, --role=:
                description: Role for the user (guest, reporter, developer, maintainer, owner)
                default: developer
              -u, --user-id=: User ID instead of username.
            persistentflags:
              -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
            exclusiveflags:
              - - role
                - role-id
              - - user-id
                - username
            documentation:
              command: |
                Add a member to the project with the specified role.

                Roles:

                - guest (10): Can view the project.
                - reporter (20): Can view and create issues.
                - developer (30): Can push to non-protected branches.
                - maintainer (40): Can manage the project.
                - owner (50): Full access to the project.

                For custom roles, use `--role-id` with the ID of a custom role defined in the project or group.
                If the custom role does not exist, an error is returned.
          - name: remove [flags]
            description: Remove a member from the project.
            flags:
              --username=: Username instead of user-id.
              -u, --user-id=: User ID instead of username.
            persistentflags:
              -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
            exclusiveflags:
              - - user-id
                - username
            documentation:
              command: |
                Remove a member from the project.
        documentation:
          command: |
            Add or remove members from a GitLab project.
      - name: mirror [<id | url | path>] [flags]
        description: Configure mirroring on an existing project to sync with a remote repository.
        flags:
          --allow-divergence: Determines if divergent refs are skipped.
          --direction=!:
            description: 'Mirror direction. Options: pull, push.'
            default: pull
          --enabled:
            description: Determines if the mirror is enabled.
            default: "true"
          --protected-branches-only: Determines if only protected branches are mirrored.
          --url=!: The target URL to which the repository is mirrored.
        documentation:
          command: |
            Configure repository mirroring for an existing GitLab project.

            The GitLab project must already exist. This command configures mirroring
            on existing projects but does not create new projects.

            Mirror types:

            - Pull mirror: Syncs changes from an external repository to your GitLab project. The external repository is the source of truth. Use pull mirrors to sync from GitHub, Bitbucket, or other GitLab instances.
            - Push mirror: Syncs changes from your GitLab project to an external repository. Your GitLab project is the source of truth. Use push mirrors to sync to GitHub, Bitbucket, or other GitLab instances.

            Authentication:

            - For pull mirrors from private repositories, embed credentials in the URL: `https://username:token@gitlab.example.com/org/repo`
            - For push mirrors to private repositories, configure credentials in the GitLab UI or use SSH URLs with deploy keys.
      - name: prune [flags]
        description: Delete local Git branches whose merge request has been merged.
        flags:
          --dry-run: Preview branches that would be deleted without deleting them.
          --merged: Use 'git branch --merged' instead of querying GitLab. Detects fast-forward merges only.
          -e, --exclude=*: Branch name or glob pattern to exclude. Comma-separated or repeated.
          -y, --yes: Skip the confirmation prompt.
        documentation:
          command: |
            Delete local Git branches whose merge request has been merged on GitLab.

            By default, the command queries GitLab for each local branch and only
            deletes branches that have at least one merged merge request and no
            merge requests still open from the same source branch.

            Protected branches, the default branch, and the currently checked-out
            branch are never deleted.

            This command only affects your local Git repository. Remote branches
            on GitLab are not touched.

            Use --merged to skip the per-branch merge request lookup and instead
            rely on `git branch --merged` to decide which branches to delete.
            The default branch and protected branches are still fetched from
            GitLab in this mode. Falling back to Git is faster, but only detects
            fast-forward merges — squash and rebase merges look like distinct
            commits to Git and will not be reported as merged.
      - name: publish <command> [flags]
        description: Publishes resources in the project.
        commands:
          - name: catalog <tag-name>
            description: '[EXPERIMENTAL] Publishes CI/CD components to the catalog.'
            documentation:
              command: |
                [EXPERIMENTAL] Publishes CI/CD components in the project to the CI/CD catalog using the provided tag name.

                Requires the feature flag `ci_release_cli_catalog_publish_option` to be enabled
                for this project in your GitLab instance.

                Requires the same user as the release author.

                - It retrieves components from the current repository by searching for
                  `yml` files within the "templates" directory and its subdirectories.
                - It fails if the feature flag `ci_release_cli_catalog_publish_option`
                  is not enabled for this project in your GitLab instance.

                Components can be defined:

                - In single files ending in `.yml` for each component, like `templates/secret-detection.yml`.
                - In subdirectories containing `template.yml` files as entry points,
                  for components that bundle together multiple related files. For example,
                  `templates/secret-detection/template.yml`.
        documentation:
          command: |
            Publishes resources in the project.

            Currently only supports publishing CI/CD components to the catalog.
      - name: remote <subcommand>
        description: Manage Git remotes for a GitLab project.
        commands:
          - name: add <namespace/project>
            description: Add a Git remote for a GitLab project.
            flags:
              -n, --name=: 'Name for the remote (default: first path component)'
              -p, --protocol=: 'Git protocol: ssh, https (default: git_protocol config)'
            documentation:
              command: |
                Add a Git remote for a GitLab project using a project reference.

                The remote name defaults to the first path component (the namespace),
                so the remote identifies where the repository lives.
        documentation:
          command: |
            Manage Git remotes for GitLab projects using project references instead of full URLs.
      - name: search [flags]
        aliases:
          - find
          - lookup
        description: Search for GitLab repositories and projects by name.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --search=!: A string contained in the project name.
        documentation:
          command: |
            Searches every project visible to you for a string in the project
            name. Provide the query with `--search`, and use `-F json` for
            machine-readable output.
      - name: transfer [repo] [flags]
        description: Transfer a repository to a new namespace.
        flags:
          -t, --target-namespace=!: The namespace where your project should be transferred to.
          -y, --yes: 'Warning: Skip confirmation prompt and force transfer operation. Transfer cannot be undone.'
        documentation:
          command: |
            Moves a project to a different group or user namespace. Specify the
            destination with `--target-namespace`. You must have permission to
            create projects in the target namespace.
      - name: update [path] [flags]
        description: Update an existing GitLab project or repository.
        flags:
          --archive: Whether the project should be archived.
          --defaultBranch=: New default branch for the project.
          -d, --description=: New description for the project.
        documentation:
          command: |
            Change project settings such as the description or default branch, or
            archive and unarchive the project with `--archive`.
      - name: view [repository] [flags]
        description: View a project or repository.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -b, --branch=: View a specific branch of the repository.
          -w, --web: Open a project in the browser.
        documentation:
          command: |
            Display the description and README of a project, or open it in the browser.
    documentation:
      command: |
        Create, clone, fork, view, and manage GitLab projects. List and
        search for projects, and configure project settings such as
        mirroring and members.
  - name: runner <command> [flags]
    description: Manage GitLab CI/CD runners.
    commands:
      - name: assign <runner-id> [flags]
        description: Assign a runner to a project.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        documentation:
          command: |
            Assigns a runner to a project.

            Requires the Maintainer or Owner role for the project.
      - name: delete <runner-id>
        description: Delete a runner.
        flags:
          -f, --force: Skip confirmation prompt.
        documentation:
          command: |
            Permanently deletes a runner from the GitLab instance.

            Prerequisites:

            - Maintainer or Owner role for project runners.
            - Owner role for group runners.
            - Administrator access for instance runners.
      - name: jobs <runner-id> [flags]
        description: List jobs processed by a runner.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --order-by=:
            description: 'Order jobs by: id.'
            default: id
          --sort=:
            description: 'Sort order: asc or desc.'
            default: desc
          --status=: 'Filter jobs by status: running, success, failed, canceled.'
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        documentation:
          command: |
            Lists jobs processed by the specified runner, including jobs that are currently running.

            Requires the Maintainer or Owner role for the project.
      - name: list [flags]
        aliases:
          - ls
        description: List runners.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -g, --group=: List runners for a group. Ignored if -R/--repo is set.
          -i, --instance: List all runners available to the user (instance scope).
          -p, --page=:
            description: Page number.
            default: "1"
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - group
            - instance
            - repo
        documentation:
          command: |
            List runners for a project (default), group, or instance.

            Instance scope requires administrator access.
      - name: managers <runner-id> [flags]
        description: List runner managers.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        documentation:
          command: |
            Lists the managers of a runner.
      - name: unassign <runner-id> [flags]
        description: Unassign a runner from a project.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        documentation:
          command: |
            Unassign a runner from a project.
            You cannot unassign a runner from the owner project.
            Use `glab runner delete` instead.

            Requires the Maintainer or Owner role for the project.
      - name: update <runner-id>
        description: Update a runner.
        flags:
          --pause: Pause the runner.
          --unpause: Resume a paused runner.
        exclusiveflags:
          - - pause
            - unpause
        documentation:
          command: |
            Updates settings for a GitLab CI/CD runner.

            Use flags to update the runner configuration, such as the pause state.

            Prerequisites:

            - Maintainer or Owner role for project runners.
            - Owner role for group runners.
            - Administrator access for instance runners.
    documentation:
      command: |
        Manages GitLab CI/CD runners for projects, groups, or the entire instance.
  - name: runner-controller <command> [flags]
    aliases:
      - rc
    description: Manage runner controllers. (EXPERIMENTAL)
    commands:
      - name: create [flags]
        description: Create a runner controller. (EXPERIMENTAL)
        flags:
          --jq=: Filter JSON output with a jq expression.
          --state=: 'State of the runner controller: disabled, enabled, dry_run.'
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -d, --description=: Description of the runner controller.
        documentation:
          command: |
            You must have administrator access. The runner controller can be
            created in a disabled state for testing before you enable the runner controller.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: delete <id> [flags]
        description: Delete a runner controller. (EXPERIMENTAL)
        flags:
          -f, --force: Skip confirmation prompt.
        documentation:
          command: |
            Prompts for confirmation before deletion. Use `--force` to skip the
            confirmation prompt in non-interactive contexts.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: get <controller-id> [flags]
        description: Get details of a runner controller. (EXPERIMENTAL)
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
        documentation:
          command: |
            Retrieves details of a single runner controller, including its
            connection status. This is an administrator-only feature.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: list [flags]
        description: List runner controllers. (EXPERIMENTAL)
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            You must have administrator access.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: scope <command> [flags]
        description: Manage runner controller scopes. (EXPERIMENTAL)
        commands:
          - name: create <controller-id> [flags]
            description: Create a scope for a runner controller. (EXPERIMENTAL)
            flags:
              --instance: Add an instance-level scope.
              --jq=: Filter JSON output with a jq expression.
              --runner=*: Add a runner-level scope for the specified runner ID. Multiple IDs can be comma-separated or specified by repeating the flag.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
            exclusiveflags:
              - - instance
                - runner
            documentation:
              command: |
                Creates a scope for a runner controller. This is an administrator-only feature.

                Use one of the following flags to specify the scope type:

                - --instance: Add an instance-level scope, allowing the runner controller
                  to evaluate jobs for all runners in the GitLab instance.
                - --runner <id>: Add a runner-level scope, allowing the runner controller
                  to evaluate jobs for a specific instance-level runner. Multiple IDs can
                  be comma-separated or specified by repeating the flag.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: delete <controller-id> [flags]
            description: Delete a scope from a runner controller. (EXPERIMENTAL)
            flags:
              --instance: Remove an instance-level scope.
              --runner=*: Remove a runner-level scope for the specified runner ID. Multiple IDs can be comma-separated or specified by repeating the flag.
              -f, --force: Skip confirmation prompt.
            exclusiveflags:
              - - instance
                - runner
            documentation:
              command: |
                Deletes a scope from a runner controller. This is an administrator-only feature.

                Use one of the following flags to specify the scope type:

                - --instance: Remove an instance-level scope from the runner controller.
                - --runner <id>: Remove a runner-level scope for a specific runner. Multiple IDs
                  can be comma-separated or specified by repeating the flag.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: list <controller-id> [flags]
            description: List scopes for a runner controller. (EXPERIMENTAL)
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
            documentation:
              command: |
                Scopes can be for the instance (applies to all runners) or runner-level
                (applies to specific runners).

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
        documentation:
          command: |
            Manages runner controller scopes. This is an administrator-only feature.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: token <command> [flags]
        description: Manage runner controller tokens. (EXPERIMENTAL)
        commands:
          - name: create <controller-id> [flags]
            description: Create a token for a runner controller. (EXPERIMENTAL)
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -d, --description=: Description of the token.
            documentation:
              command: |
                Store the token value securely before closing the terminal. You cannot
                retrieve the token again.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: list <controller-id> [flags]
            description: List tokens for a runner controller. (EXPERIMENTAL)
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -P, --per-page=:
                description: Number of items per page.
                default: "30"
              -p, --page=:
                description: Page number.
                default: "1"
            documentation:
              command: |
                Lists tokens for the given runner controller. Token values are not shown.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: revoke <controller-id> <token-id> [flags]
            description: Revoke a token from a runner controller. (EXPERIMENTAL)
            flags:
              -f, --force: Skip confirmation prompt.
            documentation:
              command: |
                Revokes a token immediately. Prompts for confirmation before revocation.
                Use `--force` to skip the confirmation prompt in non-interactive contexts.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: rotate <controller-id> <token-id> [flags]
            description: Rotate a token for a runner controller. (EXPERIMENTAL)
            flags:
              --jq=: Filter JSON output with a jq expression.
              -F, --output=:
                description: 'Format output as: text, json.'
                default: text
              -f, --force: Skip confirmation prompt.
            documentation:
              command: |
                Replaces the current token with a new one. Store the new token value
                securely before closing the terminal. You cannot retrieve the token
                again. Prompts for confirmation before rotation. Use `--force`
                to skip the confirmation prompt in non-interactive contexts.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
        documentation:
          command: |
            Manages runner controller tokens. This is an administrator-only feature.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: update <id> [flags]
        description: Update a runner controller. (EXPERIMENTAL)
        flags:
          --jq=: Filter JSON output with a jq expression.
          --state=: 'State of the runner controller: disabled, enabled, dry_run.'
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -d, --description=: Description of the runner controller.
        documentation:
          command: |
            You must specify at least one of `--description` or `--state`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Manages runner controllers. This is an administrator-only feature.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: schedule <command> [flags]
    aliases:
      - sched
      - skd
    description: Work with GitLab CI/CD schedules.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create [flags]
        description: Create a new pipeline schedule.
        flags:
          --active:
            description: Whether or not the schedule is active.
            default: "true"
          --cron=!: Cron interval pattern.
          --cronTimeZone=:
            description: Cron timezone.
            default: UTC
          --description=!: Description of the schedule.
          --ref=!: Target branch or tag.
          --variable=*: Pass variables to schedule in the format <key>:<value>. Repeat flag for multiple variables.
        documentation:
          command: |
            Create a new CI/CD pipeline schedule. The `--cron`, `--description`, and `--ref` flags
            are required:

            - `--cron` sets the schedule's recurrence in cron syntax.
            - `--ref` sets the branch or tag the pipeline runs against.
            - `--description` provides a human-readable label.

            Use `--variable` to add pipeline variables in `key:value` format.
            Pass `--variable` multiple times to add several variables.

            By default, the schedule is created in the current project. Use
            `--repo` to target another project.
      - name: delete <id> [flags]
        description: Delete a pipeline schedule by ID.
        documentation:
          command: |
            Delete a CI/CD pipeline schedule, identified by its numeric ID. The
            schedule is removed from the project; pipelines previously triggered
            by it are not affected.

            By default, the schedule is deleted from the current project. Use
            `--repo` to target another project.
      - name: list [flags]
        description: List pipeline schedules in a project.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            List CI/CD pipeline schedules in a project. By default, schedules
            are listed for the current project. Use `--repo` to target another
            project.

            Use `--output json` to format the result as JSON for use with other
            tools.
      - name: run <id>
        description: Trigger a pipeline schedule to run immediately.
        documentation:
          command: |
            Trigger a CI/CD pipeline schedule, identified by its numeric ID, to
            run immediately. The schedule's normal recurrence is not affected;
            this is a one-time, on-demand run in addition to the configured cron.

            By default, the schedule is run in the current project. Use `--repo`
            to target another project.
      - name: update <id> [flags]
        description: Update a pipeline schedule.
        flags:
          --active:
            description: Whether or not the schedule is active.
            default: to not change
          --create-variable=*: Pass new variables to schedule in format <key>:<value>.
          --cron=: Cron interval pattern.
          --cronTimeZone=: Cron timezone.
          --delete-variable=*: Pass variables you want to delete from schedule in format <key>.
          --description=: Description of the schedule.
          --ref=: Target branch or tag.
          --update-variable=*: Pass updated variables to schedule in format <key>:<value>.
        documentation:
          command: |
            Update a CI/CD pipeline schedule, identified by its numeric ID. Use
            the flags to change the cron expression, description, ref, time zone,
            or active state. Only the fields you specify are updated.

            To change pipeline variables, use `--create-variable`, `--update-variable`,
            and `--delete-variable`. The `create` and `update` flags take
            `key:value` pairs; `delete` takes a key. Pass each flag multiple times
            to change several variables.

            By default, the schedule is updated in the current project. Use
            `--repo` to target another project.
    documentation:
      command: |
        Manage GitLab CI/CD pipeline schedules. Use the subcommands to
        create, list, update, delete, or trigger schedules in the current
        project, or use `--repo` to target another project.
  - name: search <command> [flags]
    description: Search for code and resources in a GitLab project. (BETA)
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: semantic [flags]
        description: Search project code using natural language.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --knn=: Nearest neighbours to retrieve (1–100). Defaults to 64 server-side.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -d, --directory-path=: Restrict search to files under this path (e.g. app/services/).
          -l, --limit=: Maximum number of results (1–100). Defaults to 20 server-side.
          -q, --query=!: Natural language search query.
        documentation:
          command: |
            Search project code using natural language (semantic similarity).

            Requires the project to have semantic code search enabled via GitLab Duo.

            This feature is in beta and might not be ready for production use.
            It might be unstable and breaking changes can occur outside of major releases.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Search a GitLab project for code and other resources. The
        `semantic` subcommand runs an AI-powered semantic code search.

        Use `--repo` to target a project other than the current one.

        This feature is in beta and might not be ready for production use.
        It might be unstable and breaking changes can occur outside of major releases.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: securefile <command> [flags]
    description: Manage secure files for a project.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create <name> <path>
        aliases:
          - upload
        description: Upload a new secure file to a project.
        documentation:
          command: |
            Provide the name to store the file under, followed by the local path
            to the file to upload.

            Secure files are stored outside the project's repository and not in
            version control. Both plain text and binary files are supported, up
            to a maximum size of 5 MB.

            By default, the file is uploaded to the current project. Use `--repo`
            to target another project.
      - name: download [<id> | --id <id> | --name <name>] [flags]
        description: Download one or more secure files from a project.
        flags:
          --all: Download all of a project's secure files. Files are downloaded with their original name and file extension.
          --force-download: 'Force download file(s) even if checksum verification fails. Warning: when enabled, this setting allows the download of files that are corrupt or tampered with.'
          --id=: ID of the secure file to download.
          --name=: Name of the secure file to download. Saves the file with this name, or to the path specified by --path.
          --no-verify: 'Do not verify the checksum of the downloaded file(s). Warning: when enabled, this setting allows the download of files that are corrupt or tampered with.'
          --output-dir=:
            description: Output directory for files downloaded with --all.
            default: .
          -p, --path=:
            description: Path to download the secure file to, including filename and extension.
            default: ./downloaded.tmp
        exclusiveflags:
          - - all
            - path
          - - all
            - id
            - name
          - - force-download
            - no-verify
          - - output-dir
            - path
        documentation:
          command: |
            To download a single file, identify it by its numeric ID (as a positional
            argument or with `--id`) or by its name with `--name`. To download every
            secure file in the project, use `--all`.

            Use `--path` to save a single download to a specific filename, or
            `--output-dir` to choose the destination directory when downloading
            multiple files.

            By default, downloaded files are verified against their checksum.
            Use `--no-verify` to skip verification, or `--force-download` to keep
            files even when verification fails. Both options can allow corrupted
            or tampered files; use with caution.

            By default, files are downloaded from the current project. Use
            `--repo` to target another project.
      - name: get <id>
        aliases:
          - show
        description: Get details of a secure file by ID.
        flags:
          --jq=: Filter JSON output with a jq expression.
        documentation:
          command: |
            Get details of a single secure file in a project, identified by its
            numeric ID. The response includes the file's name, checksum, and
            associated metadata.

            This command requires GitLab 18.0 or later.

            By default, the file is looked up in the current project. Use
            `--repo` to target another project.
      - name: list [flags]
        aliases:
          - ls
        description: List secure files in a project.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            List the secure files configured for a project. Use `--page` and
            `--per-page` to paginate the result.

            By default, files are listed for the current project. Use `--repo`
            to target another project.
      - name: remove [<id> | --id <id> | --name <name>] [flags]
        aliases:
          - rm
          - delete
        description: Remove a secure file from a project.
        flags:
          --id=: ID of the secure file to remove.
          --name=: Name of the secure file to remove.
          -y, --yes: Skip the confirmation prompt.
        exclusiveflags:
          - - id
            - name
        documentation:
          command: |
            Remove a secure file from a project, identified by its numeric ID.
            The command asks for confirmation before deleting; use `-y` to skip
            the prompt in scripts.

            By default, the file is removed from the current project. Use `--repo`
            to target another project.
      - name: update <name> <path>
        aliases:
          - overwrite
        description: Update a secure file in a project.
        flags:
          -y, --yes: Skip the confirmation prompt.
        documentation:
          command: |
            Update a secure file in a project, identified by its name.
            The command asks for confirmation before updating; use `-y` to skip
            the prompt in scripts.

            By default, the file is updated in the current project. Use `--repo`
            to target another project.

            If the file content is unchanged, no update is performed.

            Updating a secure file changes its ID. When you download the file afterward, reference it by `--name` instead of `--id`.
    documentation:
      command: |
        Store up to 100 files for secure use in CI/CD pipelines. Secure files are
        stored outside of your project's repository, not in version control.
        It is safe to store sensitive information in these files. Both plain text
        and binary files are supported, but they must be smaller than 5 MB.
  - name: security <command> [flags]
    description: Manage GitLab security scan profiles for a project. (EXPERIMENTAL)
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: config <command> [flags]
        description: Configure security scan profiles for a project. (EXPERIMENTAL)
        commands:
          - name: disable <profile> [flags]
            description: Disable a security scan profile for a project. (EXPERIMENTAL)
            documentation:
              command: |
                Detach a security scan profile from a project.

                Prerequisites:

                - At least the Maintainer role or the Security Manager role for the project.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: enable <profile> [flags]
            description: Enable a security scan profile for a project. (EXPERIMENTAL)
            documentation:
              command: |
                Attach a security scan profile to a project.

                Prerequisites:

                - At least the Maintainer role or the Security Manager role for the project.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
          - name: status <profile> [flags]
            description: Show the status of a security scan profile for a project. (EXPERIMENTAL)
            documentation:
              command: |
                Show whether a security scan profile is attached to a project and its
                current scan status.

                This feature is an experiment and is not ready for production use.
                It might be unstable or removed at any time.
                For more information, see
                https://docs.gitlab.com/policy/development_stages_support/.
        documentation:
          command: |
            Enable, disable, or inspect security scan profiles for a project.

            A profile bundles a set of security scans, such as SAST, secret
            detection, dependency scanning, or container scanning, or post-scan
            processing on given scans, like dependency scanning auto remediation.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Use these commands to enable, disable, or inspect the security scans
        attached to a project.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: skills <command>
    description: Manage glab agent skills. (EXPERIMENTAL)
    commands:
      - name: get <name> [<path>]
        description: Print a bundled agent skill file. (EXPERIMENTAL)
        documentation:
          command: |
            Print a file from an agent skill bundled with this glab binary without installing it.

            The path is relative to the skill root and defaults to `SKILL.md`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: install [name]
        description: Install glab's bundled agent skills. (EXPERIMENTAL)
        flags:
          --path=: Install skills to the directory at <path>.
          -f, --force: Overwrite existing skill files.
          -g, --global: Install skills at user scope (~/.agents/skills/).
        exclusiveflags:
          - - global
            - path
        documentation:
          command: |
            Install bundled `SKILL.md` files to `.agents/skills/`, the
            cross-agent standard defined by the Agent Skills specification. This works
            with GitLab Duo Agent Platform, Claude Code, Codex, Gemini CLI, and any
            other compliant agent.

            By default, only the core `glab` skill is installed. Pass a positional
            `name` argument to install a specific bundled skill instead. Run
            `glab skills list` to see what is available.

            Install scope:

            - By default, skills are installed for the current project, in `.agents/skills/`
              at the root of the current Git repository.
            - Use `--global` to install skills for the current user, in
              `~/.agents/skills/`.
            - Use `--path` to install skills to a custom directory. The path is resolved
              relative to the current working directory, not the repository root.

            To overwrite an existing skill file, use `--force`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: list
        description: List the available bundled agent skills. (EXPERIMENTAL)
        documentation:
          command: |
            List the agent skills bundled with glab. Use the name of a skill with
            'glab skills install <name>' to install just that one.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: update [name]
        description: Update installed agent skills to the current shipped version. (EXPERIMENTAL)
        flags:
          --all: Update every installed skill.
        documentation:
          command: |
            Re-fetch installed agent skills from their source (bundled in this
            glab binary, or the curated remote registry) and overwrite the on-disk
            copy if it differs.

            By default, updates only the named skill in every well-known location
            it is installed (the current project's '.agents/skills/' and the
            user-scope '~/.agents/skills/'). Use --all to update every installed
            skill in those locations.

            Skills whose on-disk content already matches the source are left alone.
            Skills installed via 'glab skills install --path' are not considered —
            update only knows about the two well-known locations.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Install the bundled glab agent skills so that AI agents can discover
        and use glab effectively.

        Skills follow the Agent Skills specification and work with
        any compatible agent, including GitLab Duo Agent Platform, Claude Code, Codex,
        and Gemini CLI.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: snippet <command> [flags]
    description: Create snippets.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create -t <title> <file1> [<file2>...] [flags]
        aliases:
          - new
        description: Create a new snippet.
        flags:
          -d, --description=: Description of the snippet. Set to "-" to open an editor.
          -f, --filename=: Filename of the snippet in GitLab.
          -p, --personal: Create a personal snippet.
          -t, --title=: (required) Title of the snippet.
          -v, --visibility=:
            description: 'Limit by visibility: ''public'', ''internal'', or ''private''.'
            default: private
        documentation:
          command: |
            Provide one or more file paths to upload, or pass `--filename` and
            pipe content from standard input.

            Snippets are created in the current project by default. Use
            `--personal` to create the snippet in your personal account instead,
            and `--visibility` to control who can see it.
    documentation:
      command: |
        Snippets store and share small pieces of code or text. A snippet can
        belong to a project, or to your personal account when you pass
        `--personal`.

        To view and edit existing snippets, use the GitLab UI or `glab api` with the Project snippets API or personal Snippets API.
  - name: ssh-key <command>
    description: Manage SSH keys registered with your GitLab account.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: add [key-file]
        description: Add an SSH key to your GitLab account.
        flags:
          -e, --expires-at=: 'The expiration date of the SSH key. Uses ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ.'
          -t, --title=!: New SSH key's title.
          -u, --usage-type=:
            description: 'Usage scope for the key. Possible values: ''auth'', ''signing'' or ''auth_and_signing''. Default value: ''auth_and_signing''.'
            default: auth_and_signing
        documentation:
          command: |
            Creates a new SSH key owned by the currently authenticated user.

            Requires the '--title' flag.
      - name: delete [<key-id>]
        description: Deletes a single SSH key specified by the ID.
        flags:
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            Pass the key ID as an argument, or run the command without arguments
            to select a key interactively. Find key IDs by running `glab ssh-key list --show-id`.

            This action is permanent and cannot be undone.
      - name: get [<key-id>]
        description: Returns a single SSH key specified by the ID.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            Pass the key ID as an argument, or run the command without arguments
            to select a key interactively. Find key IDs by running `glab ssh-key list --show-id`.

            By default, the command prints the public key. Use `--output json` to return
            the full key object.
      - name: list
        description: Get a list of SSH keys for the currently authenticated user.
        flags:
          --jq=: Filter JSON output with a jq expression.
          --show-id: Shows IDs of SSH keys.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            Each row shows the key's title, key, usage type, and creation date.
            Pass `--show-id` to also display the key ID, which the `get` and `delete`
            commands accept as an argument.
    documentation:
      command: |
        Add, list, get, and delete the SSH keys associated with your account.

        GitLab uses SSH keys to authenticate Git operations over SSH, and,
        depending on each key's usage type, to verify signed commits.
  - name: stack <command> [flags]
    aliases:
      - stacks
    description: Create, manage, and work with stacked diffs. (EXPERIMENTAL)
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: amend
        description: Save your changes to an existing diff. (EXPERIMENTAL)
        flags:
          --no-verify: Bypass the pre-commit and commit-msg hooks of git-commit(1).
          --reword: Only update the commit message without staging any files.
          -a, --all: Automatically stage modified and deleted tracked files.
          -d, --description=: A description of the change.
          -m, --message=: Alias for the description flag.
        exclusiveflags:
          - - all
            - reword
          - - description
            - message
        documentation:
          command: |
            Adds your changes to the diff you have checked out. Its merge request updates the next time you run `glab stack sync`, which also rebases the diffs after it.

            To create a new diff from your changes instead, use `glab stack save`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: create
        aliases:
          - new
        description: Create a new stack. (EXPERIMENTAL)
        documentation:
          command: |
            The stack starts empty, and the other `glab stack` commands act on it until you switch. The branch you have checked out becomes its base branch, which the first merge request targets, so push it to the remote before you run `glab stack sync`. To add diffs, use `glab stack save`.

            This command adds metadata to your `./.git/stacked` directory.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: delete [<stack-name>]
        description: Delete a stack. (EXPERIMENTAL)
        flags:
          -y, --yes: Skip the confirmation prompt.
        documentation:
          command: |
            Removes the stack's local metadata from the `.git/stacked` directory.
            Use this command to clean up stacks for merged or abandoned merge requests.
            Branches, commits, and merge requests are not affected.

            If you do not provide a stack name, the command shows a list of stacks for you to choose from.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: first
        description: Move to the first diff in the stack. (EXPERIMENTAL)
        documentation:
          command: |
            Checks out the branch of the first diff in the stack.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: infer <revision-range>
        description: Add diffs to a stack based on a range of commits. (EXPERIMENTAL)
        flags:
          -n, --name=: Name for the new stack (used when creating a stack)
        documentation:
          command: |
            Opens an editor with the commits in the range for you to choose from.

            When you save and close the file, the command creates one diff for each commit listed in the file and appends them to the stack. If there's no stack to add them to, the command creates one first.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: last
        description: Move to the last diff in the stack. (EXPERIMENTAL)
        documentation:
          command: |
            Checks out the branch of the last diff in the stack.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: list
        aliases:
          - ls
        description: List all diffs in the stack. (EXPERIMENTAL)
        documentation:
          command: |
            Shows the branch and description of each diff. To check out a different diff, use `glab stack move`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: move
        description: Move to a specific diff in the stack. (EXPERIMENTAL)
        documentation:
          command: |
            Shows a list of the diffs in the stack, and checks out the branch of the diff you select.

            To work on a different stack, run `glab stack switch` first.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: next
        description: Move to the next diff in the stack. (EXPERIMENTAL)
        documentation:
          command: |
            Checks out the branch of the next diff in the stack.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: prev
        description: Move to the previous diff in the stack. (EXPERIMENTAL)
        documentation:
          command: |
            Checks out the branch of the previous diff in the stack.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: reorder
        description: Reorder a stack of diffs. (EXPERIMENTAL)
        flags:
          --abort: Abort a reorder and restore original branch state.
          --continue: Continue a reorder after resolving conflicts.
        exclusiveflags:
          - - abort
            - continue
        documentation:
          command: |
            Opens an editor with one diff per line, so you can rearrange them.

            When you save and close the file, each diff's branch is rebased onto the branch of the diff now before it, and each moved diff's merge request is retargeted to match. The rebased branches are not pushed automatically, so run `glab stack sync` to force-push them and replace the old commits on GitLab.

            If a rebase hits a conflict, resolve it, run `git rebase --continue`, and then run `glab stack reorder --continue`. To restore the original order instead, run `glab stack reorder --abort`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: save
        description: Save your changes as a new diff. (EXPERIMENTAL)
        flags:
          --no-verify: Bypass the pre-commit and commit-msg hooks of git-commit(1).
          -a, --all: Automatically stage modified and deleted tracked files.
          -d, --description=: Description of the change.
          -m, --message=: Alias for the description flag.
        documentation:
          command: |
            Adds a new diff to the end of the stack. It becomes a new merge request the next time you run `glab stack sync`.

            To add your changes to the diff you have checked out instead, use `glab stack amend`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: switch [stack-name]
        description: Switch between stacks. (EXPERIMENTAL)
        documentation:
          command: |
            If you do not provide a stack name, the command shows a list of stacks for you to choose from.

            After you switch, use `glab stack move` to check out a diff in the new stack.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: sync
        description: Push the stack to GitLab, and create or update its merge requests. (EXPERIMENTAL)
        flags:
          --no-verify: Bypass the pre-push hook. (See githooks(5) for more information.)
          --reviewer=*: Request review from users by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          --skip-mr-creation: Skip creating merge requests for branches that don't have one yet.
          --skip-push: Rebase the stack locally without pushing branches or creating merge requests. Still fetches from the remote and calls the GitLab API.
          --update-base: Rebase the stack onto the latest version of the base branch.
          -a, --assignee=*: Assign merge request to people by their `usernames`. Multiple usernames can be comma-separated or specified by repeating the flag.
          -l, --label=*: Add label by `name`. Multiple labels can be comma-separated or specified by repeating the flag.
        documentation:
          command: |
            Updates GitLab to match your local stack:

            - Creates a merge request for each diff without one, unless `--skip-mr-creation` or `--skip-push` is set. Each merge request targets the branch of the previous diff, or the base branch for the first diff.
            - Pulls changes made on GitLab, such as applied suggestions, into any diff whose branch is behind its remote.
            - If you amended a diff since the last sync, rebases the diffs after it. Then, unless `--skip-push` is set, force-pushes the stack's branches.
            - Removes diffs with merged merge requests and deletes their local branches. Keeps diffs with closed merge requests.
            - If you're working in a fork, asks whether to push to the fork or the upstream repository.
            - With `--update-base`, rebases the stack onto the latest version of the base branch. Then, unless `--skip-push` is set, force-pushes the stack's branches.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        A stack is a series of small, dependent merge requests that together deliver a feature. Reviewers can review and merge earlier changes while you keep building on top of them.

        Locally, each diff in the stack is one commit on its own branch, built on the branch of the previous diff. When you run `glab stack sync`, each diff becomes a merge request that targets the branch of the previous diff. The first diff targets the base branch.

        The `glab stack` commands act on the stack you last created or switched to, regardless of which branch you have checked out.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
  - name: todo <command> [flags]
    description: Manage your to-do list.
    commands:
      - name: done [<id>] [flags]
        description: Mark a to-do item as done.
        flags:
          --all: Mark all pending to-do items as done.
        documentation:
          command: |
            Pass a to-do item's ID to mark that single item as done, or use
            `--all` to mark every pending item as done at once.

            Find item IDs with `glab todo list`.
      - name: list [flags]
        aliases:
          - ls
        description: List your to-do items.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -a, --action=: 'Filter by action: assigned, mentioned, build_failed, marked, approval_required, directly_addressed.'
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --state=:
            description: 'Filter by state: pending, done, all.'
            default: pending
          -t, --type=: 'Filter by target type: Issue, MergeRequest.'
        documentation:
          command: |
            By default, lists your pending to-do items. Use `--state` to
            show done or all items instead.

            Narrow the results with `--action` to filter by why an item was
            created, or `--type` to filter by its target type.
    documentation:
      command: |
        Your to-do list collects the items that need your attention, such as
        issues and merge requests where you were assigned, mentioned, or
        asked to review.

        List pending items, then mark them as done individually or all at once.
  - name: token
    aliases:
      - token
    description: Manage personal, project, or group tokens.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: create <name>
        aliases:
          - create
          - new
        description: Creates user, group, or project access tokens.
        flags:
          --description=: Sets the token's description.
          --jq=: Filter JSON output with a jq expression.
          -A, --access-level=:
            description: 'Access level of the token: one of ''guest'', ''reporter'', ''developer'', ''maintainer'', ''owner''.'
            default: "no"
          -D, --duration=:
            description: 'Sets the token lifetime in days. Accepts: days (30d), weeks (4w), or hours in multiples of 24 (24h, 168h, 720h). Maximum: 365d. The token expires at midnight UTC on the calculated date.'
            default: 30d
          -E, --expires-at=:
            description: Sets the token's expiration date and time, in YYYY-MM-DD format. If not specified, --duration is used.
            default: "0001-01-01"
          -F, --output=:
            description: Format output as 'text' for the token value, 'json' for the actual API token structure.
            default: text
          -S, --scope=*:
            description: Scopes for the token. Multiple scopes can be comma-separated or specified by repeating the flag. For a list, see https://docs.gitlab.com/security/tokens/access_token_scopes/.
            default: '[read_repository]'
          -U, --user=: Create a personal access token. For the current user, use @me.
          -g, --group=: Create a group access token. Ignored if a user or repository argument is set.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - duration
            - expires-at
          - - group
            - user
        documentation:
          command: |
            Creates a new access token for a user, group, or project. Defaults to a
            project access token, unless user or group name is specified.

            The expiration date of the token is calculated by adding the duration
            (default: 30 days) to the current date, with expiration occurring at midnight
            UTC on the calculated date. You can specify a different duration using days (d),
            weeks (w), or hours (h), or provide an explicit end date.

            The name of the token must be unique. The token is printed to stdout.

            Administrators can create full-featured personal access tokens for themselves and for other users.

            Non-administrators can create personal access tokens only for
            themselves (@me). These tokens must use the scope 'k8s_proxy'. For more
            information, see the GitLab documentation for the
            User tokens API.
      - name: list
        aliases:
          - ls
        description: List user, group, or project access tokens.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json. text provides a readable table, json outputs the tokens with metadata.'
            default: text
          -U, --user=: List personal access tokens. Use @me for the current user.
          -a, --active: List only the active tokens.
          -g, --group=: List group access tokens. Ignored if a user or repository argument is set.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - group
            - user
        documentation:
          command: |
            List all tokens for a user, group, or project.

            The output contains the token's meta information, not the actual token value. The output format
            can be "JSON" or "text". The access level property is printed in human-readable form in the text
            output, but displays the integer value in JSON.

            Administrators can list tokens of other users.
      - name: revoke <token-name|token-id>
        aliases:
          - revoke
          - rm
        description: Revoke user, group, or project access tokens.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json. ''text'' provides the name and ID of the revoked token; ''json'' outputs the token with metadata.'
            default: text
          -U, --user=: Revoke personal access token. Use @me for the current user.
          -g, --group=: Revoke group access token. Ignored if a user or repository argument is set.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - group
            - user
        documentation:
          command: |
            Revoke a user, group or project access token. If multiple tokens with the same name exist, you can specify
            the ID of the token.

            The output format can be either "JSON" or "text". The JSON output will show the meta information of the
            revoked token. The normal text output is a description of the revoked token name and ID.

            Administrators can revoke personal access tokens belonging to other users.
      - name: rotate <token-name|token-id>
        aliases:
          - rot
        description: Rotate user, group, or project access tokens.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -D, --duration=:
            description: 'Sets the token lifetime in days. Accepts: days (30d), weeks (4w), or hours in multiples of 24 (24h, 168h, 720h). Maximum: 365d. The token expires at 00:00 UTC on the calculated date.'
            default: 30d
          -E, --expires-at=:
            description: Sets the token's expiration date and time, in YYYY-MM-DD format. If not specified, --duration is used.
            default: "0001-01-01"
          -F, --output=:
            description: 'Format output as: text, json. ''text'' provides the new token value; ''json'' outputs the token with metadata.'
            default: text
          -U, --user=: Rotate personal access token. Use @me for the current user.
          -g, --group=: Rotate group access token. Ignored if a user or repository argument is set.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - duration
            - expires-at
        documentation:
          command: |
            Rotating a token revokes the existing token and creates a new one
            with a new secret value and expiration date.
            The old token stops working immediately, so you must update any client that uses
            it with the new value that this command returns.

            If multiple tokens share the same name, specify the token ID to select the correct one.

            The token expires at 00:00 UTC on a date calculated by adding the duration to today's date.
            The default duration is 30 days. You can specify a different duration in days (`d`),
            weeks (`w`), or hours (`h`).
            The `--duration` and `--expires-at` flags are mutually exclusive.

            Administrators can rotate personal access tokens that belong to other users.
    documentation:
      command: |
        Create, list, revoke, and rotate access tokens for your user
        account, a project, or a group.
  - name: user <command> [flags]
    description: Interact with a GitLab user account.
    commands:
      - name: events
        description: View user events.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: ''text'', ''json''.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "30"
          -a, --all: Get events from all projects.
          -p, --page=:
            description: Page number.
            default: "1"
        documentation:
          command: |
            By default, lists events for the current project. Use `--all` to
            include events from every project you can access.
    documentation:
      command: |
        Look up information about GitLab users, such as the events a user has
        generated.
  - name: variable
    aliases:
      - var
    description: Manage variables for a GitLab project or group.
    persistentflags:
      -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
    commands:
      - name: delete <key>
        aliases:
          - remove
        description: Delete a variable for a project or group.
        flags:
          -g, --group=: Delete variable from a group.
          -s, --scope=:
            description: 'The ''environment_scope'' of the variable. Options: all (*), or specific environments.'
            default: '*'
        documentation:
          command: |
            Deletes a variable by key. Use `--scope` to target a
            variable in a specific environment, or `--group` to delete a group
            variable instead.
      - name: export
        aliases:
          - ex
        description: Export variables from a project or group.
        flags:
          --format=&:
            description: 'Format of output: json, export, env.'
            default: json
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: json, export, env.'
            default: json
          -P, --per-page=:
            description: Number of items to list per page.
            default: "100"
          -p, --page=:
            description: Page number.
            default: "1"
          -s, --scope=:
            description: 'The environment_scope of the variables. Values: ''*'' (default), or specific environments.'
            default: '*'
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          -g, --group=: Select a group or subgroup. Ignored if a repository argument is set.
        documentation:
          command: |
            Defaults to the current project. Use `--group` to export
            variables for a group. Use `--output` to set the format:
            `json` (default), `env` (KEY=VALUE pairs), or
            `export` (shell export statements).
      - name: get <key>
        description: Get a variable for a project or group.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -g, --group=: Get variable for a group.
          -s, --scope=:
            description: 'The environment_scope of the variable. Values: all (*), or specific environments.'
            default: '*'
        documentation:
          command: |
            Prints the value of a single variable by key. Use `--scope` to
            select a variable in a specific environment, or `--group` to read a
            group variable instead.
      - name: import
        aliases:
          - im
        description: Import variables from a JSON file or standard input.
        flags:
          --skip-existing: Skip variables that already exist instead of failing.
          -i, --input-file=: Read the variables JSON from this file instead of standard input.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          -g, --group=: Select a group or subgroup. Ignored if a repository argument is set.
        documentation:
          command: |
            The inverse of `glab variable export`. Reads a JSON array of
            variable objects, in the same shape `export --output json` emits.

            The command:

            - Reads from standard input, or from a file with `--input-file`.
            - Imports into the current project by default. Use `--group` to
              import into a group instead.
            - Stops with an error if a variable already exists. Pass
              `--skip-existing` to skip those and continue.

            Hidden variables' values aren't included in `export` output,
            so re-importing one is skipped with a warning. Set its value again
            with `glab variable set --hidden`.
      - name: list
        aliases:
          - ls
        description: List variables for a project or group.
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page.
            default: "20"
          -i, --instance: Display instance variables.
          -p, --page=:
            description: Page number.
            default: "1"
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
          -g, --group=: Select a group or subgroup. Ignored if a repository argument is set.
        documentation:
          command: |
            Defaults to the current project. Use `--group` to list variables
            for a group, or `--instance` to list instance variables.
      - name: set <key> <value>
        aliases:
          - new
          - create
        description: Create a new variable for a project or group.
        flags:
          --hidden: Whether the variable is hidden.
          -d, --description=: Set description of a variable.
          -g, --group=: Set variable for a group.
          -m, --masked: Whether the variable is masked.
          -p, --protected: Whether the variable is protected.
          -r, --raw: Whether the variable is treated as a raw string.
          -s, --scope=:
            description: 'The environment_scope of the variable. Values: all (*), or specific environments.'
            default: '*'
          -t, --type=:
            description: 'The type of a variable: env_var, file.'
            default: env_var
          -v, --value=: The value of a variable.
        documentation:
          command: |
            You can pass the variable value from standard input. Use `--group`
            to set a variable for a group instead of the current project.
      - name: update <key> <value>
        description: Update an existing variable for a project or group.
        flags:
          -d, --description=: Set description of a variable.
          -g, --group=: Set variable for a group.
          -m, --masked: Whether the variable is masked.
          -p, --protected: Whether the variable is protected.
          -r, --raw: Whether the variable is treated as a raw string.
          -s, --scope=:
            description: 'The environment_scope of the variable. Values: all (*), or specific environments.'
            default: '*'
          -t, --type=:
            description: 'The type of a variable: env_var, file.'
            default: env_var
          -v, --value=: The value of a variable.
        documentation:
          command: |
            You can pass the variable value from standard input. Use `--group`
            to update a variable for a group instead of the current project.
            The `--scope` flag does not apply to group variables.
    documentation:
      command: |
        Variables store configuration and secrets used by CI/CD pipelines.

        Each subcommand acts on the current project by default. Use
        `--group` to manage a group's variables instead.
  - name: version
    aliases:
      - v
    description: Show version information for glab.
    documentation:
      command: |
        Prints the installed glab version and the commit it was built from.
        Include this information when reporting a bug.
  - name: whatsnew [version]
    description: Show release notes for new versions of glab.
    flags:
      --latest: Show release notes for the latest published release only.
      --since=: Show release notes for every release newer than this version.
    exclusiveflags:
      - - latest
        - since
    documentation:
      command: |
        With no arguments, shows release notes for every glab release
        published since the last time you ran 'whatsnew' or saw the
        post-upgrade banner — capped at the most recent 10 releases.

        Pass a version argument to view notes for a specific release,
        or use --since to set an explicit baseline.
  - name: work-items <command> [flags]
    description: Manage work items. (EXPERIMENTAL)
    commands:
      - name: create [flags]
        description: Create work items in a project or group. (EXPERIMENTAL)
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the description. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          --description-file=: Read the work item description from a file. Use "-" to read from standard input.
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -T, --type=!: Type of work item (epic, incident, issue, key_result, objective, requirement, task, test_case, ticket).
          -c, --confidential: Mark work item confidential.
          -d, --description=: Description of the work item. Set to "-" to open an editor.
          -g, --group=: Create work items for a group or subgroup.
          -t, --title=: Add a title for the work item.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - attach
            - group
          - - description
            - description-file
          - - group
            - repo
        documentation:
          command: |
            Use `--type` to specify the kind of work item to create.
            The command uses your repository context to detect scope automatically.

            `--attach` uploads a file and references it at the end of the description. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Uploads are project-scoped, so `--attach` cannot be combined with `--group`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: delete <iid>
        description: Delete a work item in a project or group. (EXPERIMENTAL)
        flags:
          --jq=: Filter JSON output with a jq expression.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -g, --group=: Delete a work items from a group or subgroup.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - group
            - repo
        documentation:
          command: |
            Delete a work item by its internal ID (IID). This action cannot be undone.

            The command behavior depends on context:

            - By default, deletes from the current repository's project.
            - With `--group`, deletes from the specified group.
            - With `--repo`, deletes from the specified project.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: list [flags]
        aliases:
          - ls
        description: List work items in a project or group. (EXPERIMENTAL)
        flags:
          --after=: Fetch items after this cursor (for pagination)
          --jq=: Filter JSON output with a jq expression.
          --state=:
            description: 'Filter by state: opened, closed, all.'
            default: opened
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -P, --per-page=:
            description: Number of items to list per page (max 100)
            default: "20"
          -g, --group=: List work items for a group or subgroup.
          -t, --type=*: Filter by work item type (epic, issue, task, etc.) Multiple types can be comma-separated or specified by repeating the flag.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        documentation:
          command: |
            List work items in a project or group.

            Automatically detects scope from repository context. Use --group flag
            for group-level work items or -R to specify a different project.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
      - name: update <iid> [flags]
        description: Update work items in a project or group. (EXPERIMENTAL)
        flags:
          --attach=*: (EXPERIMENTAL) Upload a file and reference it at the end of the description. Use "-" to read the file from standard input. Repeat the flag to attach multiple files.
          --description-file=: Read the work item description from a file. Use "-" to read from standard input.
          --duedate=: Update the due date for the work item.
          --jq=: Filter JSON output with a jq expression.
          --startdate=: Update the start date for the work item.
          -F, --output=:
            description: 'Format output as: text, json.'
            default: text
          -a, --assignee=*: Update the work item assignee with the supplied GitLab usernames.
          -d, --description=: Update the description for the work item.
          -g, --group=: Update work items for a group or subgroup.
          -m, --milestone=: Update the work item milestone with the title or ID.
          -t, --title=: Update the title for the work item.
          -w, --weight=: Update the weight value for the work item.
        persistentflags:
          -R, --repo=: Select another repository. You can use either OWNER/REPO or GROUP/NAMESPACE/REPO. The full URL or Git URL is also accepted.
        exclusiveflags:
          - - attach
            - group
          - - description
            - description-file
          - - group
            - repo
        documentation:
          command: |
            The command uses your repository context to detect scope automatically.

            Use `--group` to target a group or subgroup. `--group` and `--repo` are mutually exclusive.

            `--attach` uploads a file and references it at the end of the description. Repeat the flag for more than one file, or pass `-` to read the file from standard input. Without `--description` the references are added to the description the work item already has, instead of replacing it. Uploads are project-scoped, so `--attach` cannot be combined with `--group`.

            This feature is an experiment and is not ready for production use.
            It might be unstable or removed at any time.
            For more information, see
            https://docs.gitlab.com/policy/development_stages_support/.
    documentation:
      command: |
        Work with GitLab work items.

        Work items are the unified GitLab system for planning and tracking work, supporting
        various types including epics, issues, tasks, incidents, and test cases. Work items
        can be organized hierarchically to break down complex work into manageable pieces.

        This feature is an experiment and is not ready for production use.
        It might be unstable or removed at any time.
        For more information, see
        https://docs.gitlab.com/policy/development_stages_support/.
documentation:
  command: GLab is an open source GitLab CLI tool that brings GitLab to your command line.
