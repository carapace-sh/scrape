# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: glow [SOURCE|DIR]
description: Render markdown on the CLI, with pizzazz!
flags:
    -a, --all: show system files and directories (TUI-mode only)
    -l, --line-numbers: show line numbers (TUI-mode only)
    -m, --mouse&: enable mouse wheel (TUI-mode only)
    -n, --preserve-new-lines: preserve newlines in the output
    -p, --pager: display with pager
    -s, --style=: style name or JSON path
    -t, --tui: display with tui
    -w, --width=: word-wrap at width (set to 0 to disable)
persistentflags:
    --config=: config file (default )
commands:
    - name: completion
      description: Generate the autocompletion script for the specified shell
      commands:
        - name: bash
          description: Generate the autocompletion script for bash
          flags:
            --no-descriptions: disable completion descriptions
        - name: fish
          description: Generate the autocompletion script for fish
          flags:
            --no-descriptions: disable completion descriptions
        - name: powershell
          description: Generate the autocompletion script for powershell
          flags:
            --no-descriptions: disable completion descriptions
        - name: zsh
          description: Generate the autocompletion script for zsh
          flags:
            --no-descriptions: disable completion descriptions
    - name: config
      description: Edit the glow config file
    - name: help [command]
      description: Help about any command
    - name: man
      description: Generates manpages
      hidden: true
