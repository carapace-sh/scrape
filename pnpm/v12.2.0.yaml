# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: pnpm
description: Experimental package manager for node.js
flags:
  -h, --help: Print help (see more with '--help')
  --if-present&: Don't fail when the named script is undefined
  -v, --version: Print the pnpm version
persistentflags:
  --aggregate-output: Hold each script's streamed output until the script exits, then print it as one block
  --bail&: Stop a recursive command after the first failure
  --changed-files-ignore-pattern=*: Glob patterns of changed files that the `[since]` `--filter` selector should ignore
  --color?: Force colored output
  -C, --dir=:
    description: Set working directory. Accepted anywhere on the command line, before or after the subcommand, like every other rc-option
    default: .
  --prefix=&:
    description: Set working directory. Accepted anywhere on the command line, before or after the subcommand, like every other rc-option
    default: .
  --fail-if-no-match: Exit with code 1 when the `--filter` / `--filter-prod` selectors match no workspace project
  -F, --filter=*: Select which workspace projects to run on. Repeat to add more. Each selector can be a name pattern (`@scope/*`), a path (`./pkg`), a dependency query (`foo...`), an exclusion (`!bar`), a directory (`{dir}`), or a changed-since query (`[since]`)
  --filter-prod=*: Like `--filter`, but follow only production dependencies when selecting projects
  --http-proxy=: Proxy for HTTP registry and tarball requests
  --https-proxy=: Proxy for HTTPS registry and tarball requests
  --ignore-workspace: Run as if the project were standalone, ignoring any `pnpm-workspace.yaml` above it
  --include-workspace-root: Also run a recursive command on the root workspace project, which `run` / `exec` / `add` / `test` otherwise leave out
  --loglevel=: 'What level of logs to print. Mirrors pnpm''s universal `--loglevel` option: `silent` selects the silent reporter over any `--reporter` choice; the other levels cap the default reporter''s output'
  --no-bail&: 'Recursive only: keep going after a project fails'
  --no-color&: Disable colored output
  --no-include-workspace-root: 'Leave the root workspace project out of a recursive command, overriding an `includeWorkspaceRoot: true` setting'
  --no-proxy=: Hosts that bypass configured proxies
  --no-reporter-hide-prefix&: 'Prefix the streamed output of running scripts with the project it came from, overriding a `reporterHidePrefix: true` setting'
  --no-reverse&: Process recursive workspace projects in their normal order
  --no-sort: Run recursive workspace projects in workspace order
  --npmrc-auth-file=: Path to an `.npmrc` to read auth settings from, overriding the default `~/.npmrc`
  --userconfig=: Path to an `.npmrc` to read auth settings from, overriding the default `~/.npmrc`
  --parallel: Run scripts in every selected workspace project concurrently, disregarding topological sorting
  -r, --recursive: Run the command for every project in the workspace instead of only the project in `--dir`
  --registry=: 'Base URL of the npm registry to resolve and fetch packages from. Universal rc-option: accepted on every command and layered onto the config like `--config.registry=<url>`. Commands that expose their own `--registry` still read the same value'
  --report-summary&: 'Recursive only: write a `pnpm-exec-summary.json` execution report'
  --reporter=:
    description: Reporter output format
    default: default
  --reporter-hide-prefix&: Omit the project prefix from the streamed output of running scripts. A `run` / `exec` option pnpm accepts anywhere on the command line, like the recursive-run flags above
  --resume-from&=: 'Recursive only: resume execution from the given package'
  --reverse: Process recursive workspace projects in reverse order
  --sort: Keep recursive workspace projects sorted topologically
  --state-dir=: Directory in which pnpm persists machine-local state
  --store-dir=: Directory in which the package store is created. Relative paths are resolved from the workspace root, or from `--dir` outside a workspace
  --store=&: Directory in which the package store is created. Relative paths are resolved from the workspace root, or from `--dir` outside a workspace
  --stream: Stream a recursive command's script output as it arrives, one prefixed line at a time
  --test-pattern=*: Glob patterns naming test files, used by the `[since]` `--filter` selector to decide which changes count
  --use-stderr: Divert the reporter's output to stderr, leaving stdout for the command's own result
  --workspace-concurrency=: Maximum number of workspace projects to process in parallel
  --workspace-packages=*: Glob patterns selecting the workspace's projects, overriding the `packages` field of `pnpm-workspace.yaml`. Repeat to add more
  -w, --workspace-root: Run the command on the root workspace project
  -y, --yes: Automatically answer yes to prompts
completion:
  flag:
    dir:
    - $files
    prefix:
    - $files
    loglevel:
    - silent
    - error
    - warn
    - info
    - debug
    npmrc-auth-file:
    - $files
    userconfig:
    - $files
    reporter:
    - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
    - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
    - "ndjson\tNewline-delimited JSON on stderr"
    - "silent\tNo progress output"
    state-dir:
    - $files
    store-dir:
    - $files
    store:
    - $files
documentation:
  flag:
    help: Print help (see a summary with '-h')
commands:
- name: access
  description: Manage package access and visibility on the registry
  flags:
    -h, --help: Print help (see more with '--help')
    --json: Output results in JSON format
    --otp=: One-time password for registries that require two-factor authentication
    --registry=: The base URL of the npm registry
  completion:
    flag:
      dir:
      - $files
      prefix:
      - $files
      loglevel:
      - silent
      - error
      - warn
      - info
      - debug
      npmrc-auth-file:
      - $files
      userconfig:
      - $files
      reporter:
      - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
      - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
      - "ndjson\tNewline-delimited JSON on stderr"
      - "silent\tNo progress output"
      state-dir:
      - $files
      store-dir:
      - $files
      store:
      - $files
- name: init
  description: Initialize a package.json
  flags:
    -h, --help: Print help (see more with '--help')
    --init-package-manager: Pin the latest pnpm version in package.json, through "devEngines.packageManager" and "packageManager", and auto-download pnpm when it is missing
    --init-type=: Set the module system for the package. Defaults to "module"
    --no-init-package-manager: Scaffold the manifest without a pnpm version pin
  completion:
    flag:
      dir:
      - $files
      prefix:
      - $files
      init-type:
      - commonjs
      - module
      loglevel:
      - silent
      - error
      - warn
      - info
      - debug
      npmrc-auth-file:
      - $files
      userconfig:
      - $files
      reporter:
      - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
      - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
      - "ndjson\tNewline-delimited JSON on stderr"
      - "silent\tNo progress output"
      state-dir:
      - $files
      store-dir:
      - $files
      store:
      - $files
- name: recursive
  aliases:
  - multi
  - m
  description: Concurrently runs a command in all subdirectory projects
  flags:
    -h, --help: Print help (see more with '--help')
  completion:
    flag:
      dir:
      - $files
      prefix:
      - $files
      loglevel:
      - silent
      - error
      - warn
      - info
      - debug
      npmrc-auth-file:
      - $files
      userconfig:
      - $files
      reporter:
      - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
      - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
      - "ndjson\tNewline-delimited JSON on stderr"
      - "silent\tNo progress output"
      state-dir:
      - $files
      store-dir:
      - $files
      store:
      - $files
- name: add
  description: Add a package
  flags:
    --allow-build=*: Package names allowed to run lifecycle (build) scripts during this install, appended to `allowBuilds`. May be repeated
    --config: Add the package as a configuration dependency
    --cpu=*:
      description: CPU architectures whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      nargs: -1
    --force: 'Reinstall every package the lockfile names: relink packages an earlier install already materialized, and install optional dependencies whose `cpu` / `os` / `libc` / `engines` don''t match the host instead of skipping them'
    -g, --global: Install the package globally, linking its bins into the global bin directory
    -h, --help: Print help (see more with '--help')
    --ignore-pnpmfile: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
    --ignore-scripts: Don't run lifecycle scripts of the added package or its dependencies
    --ignore-workspace-root-check: Permit adding dependencies to a multi-package workspace root without `-w`
    --libc=*:
      description: libc families whose platform-specific optional dependencies should be installed (`glibc`, `musl`). Repeat or comma-separate for multiple values
      nargs: -1
    --lockfile-dir=: The directory in which `pnpm-lock.yaml` is created. Several projects may share a single lockfile
    --lockfile-only: Dependencies are not downloaded. Only `pnpm-lock.yaml` is updated
    --no-ignore-scripts: Force-enable lifecycle scripts for this invocation
    --no-ignore-workspace-root-check&: Keep the workspace-root safety check enabled
    --no-optional: Exclude optionalDependencies while materializing the updated project
    --no-save-peer: 'Don''t add the packages to peerDependencies, overriding a `savePeer: true` setting'
    --optional: Include optionalDependencies while materializing the updated project
    --os=*:
      description: Operating systems whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      nargs: -1
    --save-catalog: Save the new dependency to the default catalog. Shorthand for `--save-catalog-name=default`
    --save-catalog-name=: Save the new dependency to the named catalog `<name>`
    -D, --save-dev: Install the specified packages as devDependencies
    -E, --save-exact: Saved dependencies will be configured with an exact version rather than using the default semver range operator
    -O, --save-optional: Install the specified packages as optionalDependencies
    --save-peer: Using --save-peer will add one or more packages to peerDependencies and install them as dev dependencies
    --save-prefix=: 'The prefix of the saved version range: `^` (default), `~`, `=` for an explicit exact pin, or empty for a bare exact version'
    -P, --save-prod: Install the specified packages as regular dependencies
  completion:
    flag:
      dir:
      - $files
      prefix:
      - $files
      lockfile-dir:
      - $files
      loglevel:
      - silent
      - error
      - warn
      - info
      - debug
      npmrc-auth-file:
      - $files
      userconfig:
      - $files
      reporter:
      - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
      - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
      - "ndjson\tNewline-delimited JSON on stderr"
      - "silent\tNo progress output"
      state-dir:
      - $files
      store-dir:
      - $files
      store:
      - $files
- name: install
  aliases:
  - i
  description: Install packages
  flags:
    --cpu=*:
      description: CPU architectures whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      nargs: -1
    -D, --dev: Install only devDependencies. Regular dependencies are skipped, and removed if already installed, regardless of `NODE_ENV`
    --dry-run: Show what an install would change without writing anything to disk
    --fetch-min-speed-ki-bps=: Warn when a tarball download's average speed is below this many KiB/s
    --fetch-timeout=: Per-request network timeout, in milliseconds
    --fetch-warn-timeout-ms=: Warn when a registry metadata request takes longer than this many milliseconds
    --fix-lockfile: Repair broken lockfile entries by re-resolving their metadata while preserving compatible locked versions
    --force: 'Reinstall every package the lockfile names: relink packages an earlier install already materialized, and install optional dependencies whose `cpu` / `os` / `libc` / `engines` don''t match the host instead of skipping them'
    --frozen-lockfile: Don't generate a lockfile, and fail if an update to it is needed. This setting is enabled by default in CI when a lockfile is present
    --frozen-store: Open the store read-only and skip all store writes. For installing against a store on a read-only filesystem (e.g. a Nix store); pair with `--offline --frozen-lockfile`
    -h, --help: Print help (see more with '--help')
    --ignore-manifest-check: Skip the check that `pnpm-lock.yaml` is up to date with `package.json` under `--frozen-lockfile`. For callers that just wrote the lockfile themselves and know the manifest is about to catch up
    --ignore-pnpmfile: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
    --ignore-scripts: Don't run lifecycle scripts of the project or its dependencies. Packages are still installed; only their build scripts are skipped, and the install won't fail because of it
    --libc=*:
      description: libc families whose platform-specific optional dependencies should be installed (`glibc`, `musl`). Repeat or comma-separate for multiple values
      nargs: -1
    --lockfile-dir=: The directory in which `pnpm-lock.yaml` is created. Several projects may share a single lockfile
    --lockfile-only: Only update `pnpm-lock.yaml`. Don't download packages or write `node_modules`
    --merge-git-branch-lockfiles: Fold every per-branch lockfile (`pnpm-lock.<branch>.yaml`, written under the `gitBranchLockfile` setting) into `pnpm-lock.yaml` and delete them
    --merge-git-branch-lockfiles-branch-pattern=*: Glob patterns naming the branches that merge the per-branch lockfiles, so a mainline branch does not have to pass `--merge-git-branch-lockfiles` by hand
    --network-concurrency=: Maximum number of concurrent network requests during install
    --no-frozen-lockfile: 'Allow the lockfile to be updated, overriding a `frozenLockfile: true` setting'
    --no-frozen-store: Allow store writes even when the configuration enables the read-only store
    --no-ignore-scripts: Run lifecycle scripts even when the configuration disables them
    --no-offline: Allow network fetches even when the configuration enables offline mode
    --no-optional: Don't install optionalDependencies
    --no-prefer-frozen-lockfile: Always re-resolve against the registry instead of preferring the existing lockfile
    --no-prefer-offline: Don't prefer cached packages even when the configuration enables it
    --no-runtime: Don't install runtime dependencies (`node`, `deno`, `bun`). Their archives aren't fetched and their bins aren't linked; the rest of the install proceeds normally
    --no-trust-lockfile: Verify the lockfile against supply-chain policies even when the configuration trusts it
    --node-linker=: 'Which node linker to use: `isolated` (the default, a symlinked store), `hoisted` (a flat `node_modules`), or `pnp` (Plug''n''Play). Overrides the configured value'
    --offline: Fail on a cache miss instead of fetching from the registry, using only packages already in the store
    --optional: Include optionalDependencies even when the configured default excludes them
    --os=*:
      description: Operating systems whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      nargs: -1
    --pnpr-server=: URL of a pnpr server to offload resolution and file fetching to. `node_modules` is still linked locally from the server-produced lockfile
    --prefer-frozen-lockfile: Prefer the existing lockfile over re-resolving, even when the manifest may have changed
    --prefer-offline: Prefer packages already in the cache over the network, even past their freshness window
    -P, --prod: Install only production dependencies. devDependencies are skipped, and removed if already installed. Takes precedence over `NODE_ENV`
    --production: Install only production dependencies. devDependencies are skipped, and removed if already installed. Takes precedence over `NODE_ENV`
    --trust-lockfile: Skip verifying the lockfile against supply-chain policies
    --update-checksums: Refresh the integrity checksums in `pnpm-lock.yaml` from the registry. Cannot be combined with `--frozen-lockfile`
    --user-agent=: '`User-Agent` header to send on registry requests'
    --verify-deps-before-run-install&: Run the install already requested by `verifyDepsBeforeRun` without independently short-circuiting it as up to date
  completion:
    flag:
      dir:
      - $files
      prefix:
      - $files
      lockfile-dir:
      - $files
      loglevel:
      - silent
      - error
      - warn
      - info
      - debug
      node-linker:
      - isolated
      - hoisted
      - pnp
      npmrc-auth-file:
      - $files
      userconfig:
      - $files
      reporter:
      - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
      - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
      - "ndjson\tNewline-delimited JSON on stderr"
      - "silent\tNo progress output"
      state-dir:
      - $files
      store-dir:
      - $files
      store:
      - $files
- name: install-test
  aliases:
  - it
  description: Runs a `pnpm install` followed immediately by a `pnpm test`. It takes exactly the same arguments as `pnpm install`
  flags:
    --cpu=*:
