- name: update
  aliases:
  - up
  - upgrade
  description: Update packages to their newest version based on the specified range
  flags:
    --changeset: Generate a changeset file declaring a patch bump for every workspace package whose production dependencies were changed by the update
    --cpu=*:
      description: CPU architectures whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      nargs: -1
    --depth=: How deep to inspect dependencies. `0` means top-level dependencies only. Defaults to unlimited
    -D, --dev: Update packages only in "devDependencies"
    -g, --global: Update globally installed packages
    -h, --help: Print help (see more with '--help')
    --ignore-pnpmfile: Disable pnpm hooks defined in `.pnpmfile.cjs`, including the pnpmfiles of config dependencies
    --include-github-actions: Also update GitHub Actions dependencies in workflow and action files
    -i, --interactive: Show outdated dependencies and select which ones to update
    -L, --latest: 'Ignore version ranges in package.json: bump the matched packages to their latest version and rewrite the manifest ranges'
    --libc=*:
      description: libc families whose platform-specific optional dependencies should be installed (`glibc`, `musl`). Repeat or comma-separate for multiple values
      nargs: -1
    --lockfile-dir=: The directory in which `pnpm-lock.yaml` is created. Several projects may share a single lockfile
    --lockfile-only: Dependencies are not downloaded; only `pnpm-lock.yaml` is updated
    --no-changeset: Do not generate a changeset, even when `updateConfig.changeset` enables changeset generation by default
    --no-optional: Don't update packages in "optionalDependencies"
    --no-save: Do not write the updated ranges back to package.json. The lockfile is still updated (the `--no-save` flag)
    --optional: Update packages only in "optionalDependencies"
    --os=*:
      description: Operating systems whose platform-specific optional dependencies should be installed. Repeat or comma-separate for multiple values
      nargs: -1
    --patches: Refresh registry revisions without changing package versions
    --pnpr-server=: URL of a pnpr server to offload revision refresh resolution to
    -P, --prod: Update packages only in "dependencies" and "optionalDependencies"
    --production: Update packages only in "dependencies" and "optionalDependencies"
    -E, --save-exact: Write the resolved version without a range operator when rewriting the manifest under `--latest`
    --workspace: Tries to link all packages from the workspace, updating versions to match the workspace packages
  completion:
    flag:
      dir:
      - $files
      prefix:
      - $files
      lockfile-dir:
      - $files
      loglevel:
      - silent
      - error
      - warn
      - info
      - debug
      npmrc-auth-file:
      - $files
      userconfig:
      - $files
      reporter:
      - "default\tRich visual output: a progress line, a packages diff, lifecycle output, and a `Done in ...` summary. The default; renders in place on a terminal and falls back to `append-only` output when stdout is not a terminal"
      - "append-only\tLike `default` but forces the append-only rendering even on a TTY — one line per update, no cursor movement"
      - "ndjson\tNewline-delimited JSON on stderr"
      - "silent\tNo progress output"
      state-dir:
