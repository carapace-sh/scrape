    - name: update
      description: update working directory (or switch revisions)
      flags:
        -C, --clean: discard uncommitted changes (no backup)
        -c, --check: require clean working directory
        -d, --date=: tipmost revision matching date
        -m, --merge: merge uncommitted changes
        -r, --rev=: revision
        -t, --tool=: specify merge tool
      documentation:
        flag:
