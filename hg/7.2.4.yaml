# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: hg
flags:
    --color=: when to colorize (boolean, always, auto, never, or debug)
    --config-file=:
        description: load config file to set/override config options
        nargs: -1
    --config=:
        description: set/override config option (use 'section.name=value')
        nargs: -1
    --cwd=: change working directory
    --debug: enable debugging output
    --debugger: start debugger
    --encoding=: set the charset encoding
    --encodingmode=: set the charset encoding mode
    --hidden: consider hidden changesets
    --pager=: when to paginate (boolean, always, auto, or never)
    --profile: print command execution profile
    --time: time how long the command takes
    --traceback: always print a traceback on exception
    --version: output version information and exit
    -R, --repository=: repository root directory or name of overlay bundle file
    -h, --help: display help and exit
    -q, --quiet: suppress output
    -v, --verbose: enable additional output
    -y, --noninteractive: do not prompt, automatically pick the first choice for all prompts
commands:
    - name: ""
      description: Mercurial distributed SCM
      flags:
        --color=: when to colorize (boolean, always, auto, never, or debug)
        --config-file=:
            description: load config file to set/override config options
            nargs: -1
        --config=:
            description: set/override config option (use 'section.name=value')
            nargs: -1
        --cwd=: change working directory
        --debug: enable debugging output
        --debugger: start debugger
        --encoding=: set the charset encoding
        --encodingmode=: set the charset encoding mode
        --hidden: consider hidden changesets
        --pager=: when to paginate (boolean, always, auto, or never)
        --profile: print command execution profile
        --time: time how long the command takes
        --traceback: always print a traceback on exception
        --version: output version information and exit
        -R, --repository=: repository root directory or name of overlay bundle file
        -h, --help: display help and exit
        -q, --quiet: suppress output
        -v, --verbose: enable additional output
        -y, --noninteractive: do not prompt, automatically pick the first choice for all prompts
      documentation:
        flag:
            color: when to colorize (boolean, always, auto, never, or debug)
            config: set/override config option (use 'section.name=value')
            config-file: load config file to set/override config options
            cwd: change working directory
            debug: enable debugging output
            debugger: start debugger
            encoding: set the charset encoding
            encodingmode: set the charset encoding mode
            help: display help and exit
            hidden: consider hidden changesets
            noninteractive: do not prompt, automatically pick the first choice for all prompts
            pager: when to paginate (boolean, always, auto, or never)
            profile: print command execution profile
            quiet: suppress output
            repository: repository root directory or name of overlay bundle file
            time: time how long the command takes
            traceback: always print a traceback on exception
            verbose: enable additional output
            version: output version information and exit
    - name: abort
      description: abort an unfinished operation (EXPERIMENTAL)
      flags:
        -n, --dry-run: do not perform actions, just print output
      documentation:
        flag:
            dry-run: do not perform actions, just print output
    - name: add
      description: add the specified files on the next commit
      flags:
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -S, --subrepos: recurse into subrepositories
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -n, --dry-run: do not perform actions, just print output
      documentation:
        flag:
            dry-run: do not perform actions, just print output
            exclude: exclude names matching the given patterns
            include: include names matching the given patterns
            subrepos: recurse into subrepositories
    - name: addremove
      description: add all new files, delete all missing files
      flags:
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -S, --subrepos: recurse into subrepositories
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -n, --dry-run: do not perform actions, just print output
        -s, --similarity=: guess renamed files by similarity (0<=s<=100)
      documentation:
        flag:
            dry-run: do not perform actions, just print output
            exclude: exclude names matching the given patterns
            include: include names matching the given patterns
            similarity: guess renamed files by similarity (0<=s<=100)
            subrepos: recurse into subrepositories
    - name: annotate
      description: show changeset information by line for each file
      flags:
        --follow: follow copies/renames and list the filename (DEPRECATED)
        --no-follow: don't follow copies and renames
        --skip=:
            description: revset to not display (EXPERIMENTAL)
            nargs: -1
        -B, --ignore-blank-lines: ignore changes whose lines are all blank
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -L, --line-range=:
            description: follow line range of specified file (EXPERIMENTAL)
            nargs: -1
        -T, --template=: display with template
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -Z, --ignore-space-at-eol: ignore changes in whitespace at EOL
        -a, --text: treat all files as text
        -b, --ignore-space-change: ignore changes in the amount of white space
        -c, --changeset: list the changeset
        -d, --date: list the date (short with -q)
        -f, --file: list the filename
        -l, --line-number: show line number at the first appearance
        -n, --number: list the revision number (default)
        -r, --rev=: annotate the specified revision
        -u, --user: list the author (long with -v)
        -w, --ignore-all-space: ignore white space when comparing lines
      documentation:
        flag:
            changeset: list the changeset
            date: list the date (short with -q)
            exclude: exclude names matching the given patterns
            file: list the filename
            follow: follow copies/renames and list the filename (DEPRECATED)
            ignore-all-space: ignore white space when comparing lines
            ignore-blank-lines: ignore changes whose lines are all blank
            ignore-space-at-eol: ignore changes in whitespace at EOL
            ignore-space-change: ignore changes in the amount of white space
            include: include names matching the given patterns
            line-number: show line number at the first appearance
            line-range: follow line range of specified file (EXPERIMENTAL)
            no-follow: don't follow copies and renames
            number: list the revision number (default)
            rev: annotate the specified revision
            skip: revset to not display (EXPERIMENTAL)
            template: display with template
            text: treat all files as text
            user: list the author (long with -v)
    - name: archive
      description: create an unversioned archive of a repository revision
      flags:
        --no-decode: do not pass files through decoders
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -S, --subrepos: recurse into subrepositories
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -p, --prefix=: directory prefix for files in archive
        -r, --rev=: revision to distribute
        -t, --type=: type of distribution to create
      documentation:
        flag:
            exclude: exclude names matching the given patterns
            include: include names matching the given patterns
            no-decode: do not pass files through decoders
            prefix: directory prefix for files in archive
            rev: revision to distribute
            subrepos: recurse into subrepositories
            type: type of distribution to create
    - name: backout
      description: reverse effect of earlier changeset
      flags:
        --commit: commit if no conflicts were encountered (DEPRECATED)
        --merge: merge with old dirstate parent after backout
        --no-commit: do not commit
        --parent=: parent to choose when backing out merge (DEPRECATED)
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -d, --date=: record the specified date as commit date
        -e, --edit: invoke editor on commit messages
        -l, --logfile=: read commit message from file
        -m, --message=: use text as commit message
        -r, --rev=: revision to backout
        -t, --tool=: specify merge tool
        -u, --user=: record the specified user as committer
      documentation:
        flag:
            commit: commit if no conflicts were encountered (DEPRECATED)
            date: record the specified date as commit date
            edit: invoke editor on commit messages
            exclude: exclude names matching the given patterns
            include: include names matching the given patterns
            logfile: read commit message from file
            merge: merge with old dirstate parent after backout
            message: use text as commit message
            no-commit: do not commit
            parent: parent to choose when backing out merge (DEPRECATED)
            rev: revision to backout
            tool: specify merge tool
            user: record the specified user as committer
    - name: bisect
      description: subdivision search of changesets
      flags:
        -U, --noupdate: do not update to target
        -b, --bad: mark changeset bad
        -c, --command=: use command to check changeset state
        -e, --extend: extend the bisect range
        -g, --good: mark changeset good
        -r, --reset: reset bisect state
        -s, --skip: skip testing changeset
      documentation:
        flag:
            bad: mark changeset bad
            command: use command to check changeset state
            extend: extend the bisect range
            good: mark changeset good
            noupdate: do not update to target
            reset: reset bisect state
            skip: skip testing changeset
    - name: bookmarks
      description: hg bookmarks [OPTIONS]... [NAME]...
      flags:
        -T, --template=: display with template
        -d, --delete: delete a given bookmark
        -f, --force: force
        -i, --inactive: mark a bookmark inactive
        -l, --list: list existing bookmarks
        -m, --rename=: rename a given bookmark
        -r, --rev=: revision for bookmark action
      documentation:
        flag:
            delete: delete a given bookmark
            force: force
            inactive: mark a bookmark inactive
            list: list existing bookmarks
            rename: rename a given bookmark
            rev: revision for bookmark action
            template: display with template
    - name: branch
      description: set or show the current branch name
      flags:
        -C, --clean: reset branch name to parent branch name
        -f, --force: set branch name even if it shadows an existing branch
        -r, --rev=:
            description: change branches of the given revs (EXPERIMENTAL)
            nargs: -1
      documentation:
        flag:
            clean: reset branch name to parent branch name
            force: set branch name even if it shadows an existing branch
            rev: change branches of the given revs (EXPERIMENTAL)
    - name: branches
      description: list repository named branches
      flags:
        -T, --template=: display with template
        -a, --active: show only branches that have unmerged heads (DEPRECATED)
        -c, --closed: show normal and closed branches
        -r, --rev=:
            description: show branch name(s) of the given rev
            nargs: -1
      documentation:
        flag:
            active: show only branches that have unmerged heads (DEPRECATED)
            closed: show normal and closed branches
            rev: show branch name(s) of the given rev
            template: display with template
    - name: bundle
      description: create a bundle file
      flags:
        --base=:
            description: a base changeset assumed to be available at the destination
            nargs: -1
        --exact: compute the base from the revision specified
        --insecure: do not verify server certificate (ignoring web.cacerts config)
        --remotecmd=: specify hg command to run on the remote side
        -a, --all: bundle all changesets in the repository
        -b, --branch=:
            description: a specific branch you would like to bundle
            nargs: -1
        -e, --ssh=: specify ssh command to use
        -f, --force: run even when the destination is unrelated
        -r, --rev=:
            description: a changeset intended to be added to the destination
            nargs: -1
        -t, --type=: bundle compression type to use
      documentation:
        flag:
            all: bundle all changesets in the repository
            base: a base changeset assumed to be available at the destination
            branch: a specific branch you would like to bundle
            exact: compute the base from the revision specified
            force: run even when the destination is unrelated
            insecure: do not verify server certificate (ignoring web.cacerts config)
            remotecmd: specify hg command to run on the remote side
            rev: a changeset intended to be added to the destination
            ssh: specify ssh command to use
            type: bundle compression type to use
    - name: cat
      description: output the current or given revision of files
      flags:
        --decode: apply any matching decode filter
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -T, --template=: display with template
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -o, --output=: print output to file with formatted name
        -r, --rev=: print the given revision
      documentation:
        flag:
            decode: apply any matching decode filter
            exclude: exclude names matching the given patterns
            include: include names matching the given patterns
            output: print output to file with formatted name
            rev: print the given revision
            template: display with template
    - name: clone
      description: make a copy of an existing repository
      flags:
        --insecure: do not verify server certificate (ignoring web.cacerts config)
        --pull: use pull protocol to copy metadata
        --remotecmd=: specify hg command to run on the remote side
        --stream: clone with minimal data processing
        --uncompressed: an alias to --stream (DEPRECATED)
        -U, --noupdate: the clone will include an empty working directory (only a repository)
        -b, --branch=:
            description: do not clone everything, but include this branch's changesets and their ancestors
            nargs: -1
        -e, --ssh=: specify ssh command to use
        -r, --rev=:
            description: do not clone everything, but include this changeset and its ancestors
            nargs: -1
        -u, --updaterev=: revision, tag, or branch to check out
      documentation:
        flag:
            branch: do not clone everything, but include this branch's changesets and their ancestors
            insecure: do not verify server certificate (ignoring web.cacerts config)
            noupdate: the clone will include an empty working directory (only a repository)
            pull: use pull protocol to copy metadata
            remotecmd: specify hg command to run on the remote side
            rev: do not clone everything, but include this changeset and its ancestors
            ssh: specify ssh command to use
            stream: clone with minimal data processing
            uncompressed: an alias to --stream (DEPRECATED)
            updaterev: revision, tag, or branch to check out
    - name: commit
      description: commit the specified files or all outstanding changes
      flags:
        --amend: amend the parent of the working directory
        --close-branch: mark a branch head as closed
        --draft: use the draft phase for committing
        --force-close-branch: forcibly close branch from a non-head changeset (ADVANCED)
        -A, --addremove: mark new/missing files as added/removed before committing
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -S, --subrepos: recurse into subrepositories
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -d, --date=: record the specified date as commit date
        -e, --edit: invoke editor on commit messages
        -i, --interactive: use interactive mode
        -l, --logfile=: read commit message from file
        -m, --message=: use text as commit message
        -s, --secret: use the secret phase for committing
        -u, --user=: record the specified user as committer
      documentation:
        flag:
            addremove: mark new/missing files as added/removed before committing
            amend: amend the parent of the working directory
            close-branch: mark a branch head as closed
            date: record the specified date as commit date
            draft: use the draft phase for committing
            edit: invoke editor on commit messages
            exclude: exclude names matching the given patterns
            force-close-branch: forcibly close branch from a non-head changeset (ADVANCED)
            include: include names matching the given patterns
            interactive: use interactive mode
            logfile: read commit message from file
            message: use text as commit message
            secret: use the secret phase for committing
            subrepos: recurse into subrepositories
            user: record the specified user as committer
    - name: config
      description: show combined config settings from all hgrc files
      flags:
        --exp-all-known: show all known config option (EXPERIMENTAL)
        --non-shared: edit non shared config
        --shared: edit shared source repository config
        --source: show source of configuration value
        -T, --template=: display with template
        -e, --edit: edit user config
        -g, --global: edit global config
        -l, --local: edit repository config
        -u, --untrusted: show untrusted configuration options
      documentation:
        flag:
            edit: edit user config
            exp-all-known: show all known config option (EXPERIMENTAL)
            global: edit global config
            local: edit repository config
            non-shared: edit non shared config
            shared: edit shared source repository config
            source: show source of configuration value
            template: display with template
            untrusted: show untrusted configuration options
    - name: continue
      description: resumes an interrupted operation (EXPERIMENTAL)
      flags:
        -n, --dry-run: do not perform actions, just print output
      documentation:
        flag:
            dry-run: do not perform actions, just print output
    - name: copy
      description: mark files as copied for the next commit
      flags:
        --at-rev=: (un)mark copies in the given revision (EXPERIMENTAL)
        --forget: unmark a destination file as copied
        -A, --after: record a copy that has already occurred
        -I, --include=:
            description: include names matching the given patterns
            nargs: -1
        -X, --exclude=:
            description: exclude names matching the given patterns
            nargs: -1
        -f, --force: forcibly copy over an existing managed file
        -n, --dry-run: do not perform actions, just print output
      documentation:
        flag:
            after: record a copy that has already occurred
            at-rev: (un)mark copies in the given revision (EXPERIMENTAL)
            dry-run: do not perform actions, just print output
            exclude: exclude names matching the given patterns
            force: forcibly copy over an existing managed file
            forget: unmark a destination file as copied
            include: include names matching the given patterns
