documentation:
    flag:
        color: when to colorize (boolean, always, auto, never, or debug)
        config: set/override config option (use 'section.name=value')
        config-file: load config file to set/override config options
        cwd: change working directory
        debug: enable debugging output
        debugger: start debugger
        encoding: set the charset encoding
        encodingmode: set the charset encoding mode
        help: display help and exit
        hidden: consider hidden changesets
        noninteractive: do not prompt, automatically pick the first choice for all prompts
        pager: when to paginate (boolean, always, auto, or never)
        profile: print command execution profile
        quiet: suppress output
        repository: repository root directory or name of overlay bundle file
        time: time how long the command takes
        traceback: always print a traceback on exception
        verbose: enable additional output
        version: output version information and exit
