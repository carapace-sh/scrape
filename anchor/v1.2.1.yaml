  flags:
    -h, --help: Print help
  commands:
  - name: close
    description: '[DEPRECATED] Close the legacy IDL account and recover rent'
    flags:
      -h, --help: Print help
      --idl-address=: The IDL account to close. If none is given, the IDL account derived from program_id is used
      --print-only: Print the instruction in base64 without executing it. Useful for multisig execution when the local wallet keypair is not available
      --priority-fee=: ''
  - name: write-buffer
    description: '[DEPRECATED] Write an IDL into a legacy buffer account. Use with set-buffer to upgrade'
    flags:
      -f, --filepath!=: ''
      -h, --help: Print help
      --priority-fee=: ''
  - name: set-buffer
    description: '[DEPRECATED] Set a new IDL buffer for the program'
    flags:
      -b, --buffer!=: Address of the buffer account to set as the IDL on the program
      -h, --help: Print help
      --print-only: Print the instruction in base64 without executing it
      --priority-fee=: ''
  - name: set-authority
    description: '[DEPRECATED] Set a new authority on the legacy IDL account'
    flags:
      -h, --help: Print help
      -n, --new-authority!=: New authority of the IDL account
      --print-only: Print the instruction in base64 without executing it
      --priority-fee=: ''
      -p, --program-id!=: Program to change the IDL authority
  - name: erase-authority
    description: '[DEPRECATED] Remove the ability to modify the legacy IDL account'
    flags:
      -h, --help: Print help
      --priority-fee=: ''
      -p, --program-id!=: ''
  - name: authority
    description: '[DEPRECATED] Output the authority for the legacy IDL account'
    flags:
      -h, --help: Print help
  - name: init
    description: '[DEPRECATED] Initialize the legacy on-chain IDL account for the first time'
    flags:
      -f, --filepath!=: ''
      -h, --help: Print help
