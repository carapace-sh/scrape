# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: kind
description: kind is a tool for managing local Kubernetes clusters
persistentflags:
  -q, --quiet: silence all stderr output
  -v, --verbosity=: info log verbosity, higher value produces more output
commands:
  - name: build
    description: Build one of [node-image]
    commands:
      - name: node-image [kubernetes-source]
        description: Build the node image
        flags:
          --arch=: architecture to build for, defaults to the host architecture
          --base-image=:
            description: name:tag of the base image to use for the build
            default: docker.io/kindest/base:v20260820-69b56db7
          --image=:
            description: name:tag of the resulting image to be built
            default: kindest/node:latest
          --type=: optionally specify one of 'url', 'file', 'release', 'ci' or 'source' as the type of build
        documentation:
          command: |-
            Build the node image which contains Kubernetes build artifacts and other kind requirements.
            By default, this will build from a local Kubernetes source directory (auto-detected if omitted).

            You can also build from:
            - A local Kubernetes source directory path (e.g., /path/to/kubernetes/source)
            - A local Kubernetes release tarball path (e.g., /path/to/kubernetes-server-linux-amd64.tar.gz)
            - A URL to a Kubernetes release tarball (e.g., https://dl.k8s.io/v1.30.0/kubernetes-server-linux-amd64.tar.gz)
            - A release version (e.g., v1.36.1)
            - A Kubernetes CI build version marker prefixed with 'ci/' (e.g., ci/latest, ci/latest-1.36)
    documentation:
      command: Build one of [node-image]
  - name: completion
    description: Output shell completion code for the specified shell (bash, zsh or fish)
    commands:
      - name: bash
        description: Output shell completions for bash
      - name: fish
        description: Output shell completions for fish
      - name: powershell
        description: Output shell completions for powershell
      - name: zsh
        description: Output shell completions for zsh
    documentation:
      command: |2

        Outputs kind shell completion for the given shell (bash, fish, powershell, or zsh)
        This depends on the bash-completion binary.  Example installation instructions:
        # for bash users
        	$ kind completion bash > ~/.kind-completion
        	$ source ~/.kind-completion

        # for zsh users
        	% kind completion zsh > /usr/local/share/zsh/site-functions/_kind
        	% autoload -U compinit && compinit
        # or if zsh-completion is installed via homebrew
            % kind completion zsh > "${fpath[1]}/_kind"
        # or if you use oh-my-zsh (needs zsh-completions plugin)
        	% mkdir $ZSH/completions/
        	% kind completion zsh > $ZSH/completions/_kind

        # for fish users
        	% kind completion fish > ~/.config/fish/completions/kind.fish

        # for powershell users
        	PS> kind completion powershell | Out-String | Invoke-Expression

        Additionally, you may want to output the completion to a file and source in your .bashrc
        Note for zsh users: [1] zsh completions are only supported in versions of zsh >= 5.2
  - name: create
    description: Creates one of [cluster]
    commands:
      - name: cluster
        description: Creates a local Kubernetes cluster
        flags:
          --config=: path to a kind config file
          --image=: node docker image to use for booting the cluster
          --kubeconfig=: sets kubeconfig path instead of $KUBECONFIG or $HOME/.kube/config
          --retain: retain nodes for debugging when cluster creation fails
          --wait=: The length of time to wait for control plane node to be ready (default 0s). Non-zero values should contain a corresponding time unit (e.g. 1s, 2m, 3h).
          -n, --name=: cluster name, overrides KIND_CLUSTER_NAME, config (default kind)
        documentation:
          command: Creates a local Kubernetes cluster using Docker container 'nodes'
    documentation:
      command: Creates one of local Kubernetes cluster (cluster)
  - name: delete
    description: Deletes one of [cluster]
    commands:
      - name: cluster
        description: Deletes a cluster
        flags:
          --kubeconfig=: sets kubeconfig path instead of $KUBECONFIG or $HOME/.kube/config
          -n, --name=:
            description: the cluster name
            default: kind
        documentation:
          command: |
            Deletes a Kind cluster from the system.

            This is an idempotent operation, meaning it may be called multiple times without
            failing (like "rm -f"). If the cluster resources exist they will be deleted, and
            if the cluster is already gone it will just return success.

            Errors will only occur if the cluster resources exist and are not able to be deleted.
      - name: clusters
        description: Deletes one or more clusters
        flags:
          --kubeconfig=: sets kubeconfig path instead of $KUBECONFIG or $HOME/.kube/config
          -A, --all: delete all clusters
        documentation:
          command: |
            Deletes one or more Kind clusters from the system.

            This is an idempotent operation, meaning it may be called multiple times without
            failing (like "rm -f"). If the cluster resources exist they will be deleted, and
            if the cluster is already gone it will just return success.

            Errors will only occur if the cluster resources exist and are not able to be deleted.
    documentation:
      command: Deletes one of [cluster]
  - name: export
    description: Exports one of [kubeconfig, logs]
    commands:
      - name: kubeconfig
        description: Exports cluster kubeconfig
        flags:
          --internal: use internal address instead of external
          --kubeconfig=: sets kubeconfig path instead of $KUBECONFIG or $HOME/.kube/config
          -n, --name=:
            description: the cluster context name
            default: kind
        documentation:
          command: Exports cluster kubeconfig
      - name: logs [output-dir]
        description: Exports logs to a tempdir or [output-dir] if specified
        flags:
          -n, --name=:
            description: the cluster context name
            default: kind
        documentation:
          command: Exports logs to a tempdir or [output-dir] if specified
    documentation:
      command: Exports one of [kubeconfig, logs]
  - name: get
    description: Gets one of [clusters, nodes, kubeconfig]
    commands:
      - name: clusters
        description: Lists existing kind clusters by their name
        documentation:
          command: Lists existing kind clusters by their name
      - name: kubeconfig
        description: Prints cluster kubeconfig
        flags:
          --internal: use internal address instead of external
          -n, --name=:
            description: the cluster context name
            default: kind
        documentation:
          command: Prints cluster kubeconfig
      - name: nodes
        description: Lists existing kind nodes by their name
        flags:
          -A, --all-clusters: If present, list all the available nodes across all cluster contexts. Current context is ignored even if specified with --name.
          -n, --name=:
            description: the cluster context name
            default: kind
        documentation:
          command: Lists existing kind nodes by their name
    documentation:
      command: Gets one of [clusters, nodes, kubeconfig]
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type kind help [path to command] for full details.
  - name: load
    description: Loads images into nodes
    commands:
      - name: docker-image <IMAGE> [IMAGE...]
        description: Loads docker images from host into nodes
        flags:
          --nodes=*: comma separated list of nodes to load images into
          -n, --name=:
            description: the cluster context name
            default: kind
        documentation:
          command: Loads docker images from host into all or specified nodes by name
      - name: image-archive <IMAGE.tar>
        description: Loads docker image from archive into nodes
        flags:
          --nodes=*: comma separated list of nodes to load images into
          -n, --name=:
            description: the cluster context name
            default: kind
        documentation:
          command: Loads docker image from archive into all or specified nodes by name
    documentation:
      command: Loads images into node from an archive or image on host
  - name: version
    description: Prints the kind CLI version
    documentation:
      command: Prints the kind CLI version
documentation:
  command: kind creates and manages local Kubernetes clusters using Docker container 'nodes'
