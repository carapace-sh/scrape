# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: crush
description: A terminal-first AI assistant for software development
flags:
  -C, --continue: Continue the most recent session
  -h, --help: Help
  -s, --session=: Continue a previous session by ID
  -y, --yolo: Automatically accept all permissions (dangerous mode)
persistentflags:
  --channels=*&: MCP servers to enable as channels (repeatable), e.g. --channels server:webhook
  -D, --data-dir=: Custom crush data directory
  -H, --host=:
    description: Connect to a specific crush server host (for advanced users)
    default: unix:///tmp/crush-0.sock
  -c, --cwd=: Current working directory
  -d, --debug: Debug
exclusiveflags:
  - - continue
    - session
commands:
  - name: completion
    description: Generate the autocompletion script for the specified shell
    commands:
      - name: bash
        description: Generate the autocompletion script for bash
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the bash shell.

            This script depends on the 'bash-completion' package.
            If it is not installed already, you can install it via your OS's package manager.

            To load completions in your current shell session:

            	source <(crush completion bash)

            To load completions for every new session, execute once:

            #### Linux:

            	crush completion bash > /etc/bash_completion.d/crush

            #### macOS:

            	crush completion bash > $(brew --prefix)/etc/bash_completion.d/crush

            You will need to start a new shell for this setup to take effect.
      - name: fish
        description: Generate the autocompletion script for fish
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the fish shell.

            To load completions in your current shell session:

            	crush completion fish | source

            To load completions for every new session, execute once:

            	crush completion fish > ~/.config/fish/completions/crush.fish

            You will need to start a new shell for this setup to take effect.
      - name: powershell
        description: Generate the autocompletion script for powershell
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for powershell.

            To load completions in your current shell session:

            	crush completion powershell | Out-String | Invoke-Expression

            To load completions for every new session, add the output of the above command
            to your powershell profile.
      - name: zsh
        description: Generate the autocompletion script for zsh
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the zsh shell.

            If shell completion is not already enabled in your environment you will need
            to enable it.  You can execute the following once:

            	echo "autoload -U compinit; compinit" >> ~/.zshrc

            To load completions in your current shell session:

            	source <(crush completion zsh)

            To load completions for every new session, execute once:

            #### Linux:

            	crush completion zsh > "${fpath[1]}/_crush"

            #### macOS:

            	crush completion zsh > $(brew --prefix)/share/zsh/site-functions/_crush

            You will need to start a new shell for this setup to take effect.
    documentation:
      command: |
        Generate the autocompletion script for crush for the specified shell.
        See each sub-command's help for details on how to use the generated script.
  - name: dirs
    description: Show config and data directories
    documentation:
      command: |-
        Show where Crush stores its configuration and data,
        including any project-level config files discovered
        from the current directory up to the project root.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type crush help [path to command] for full details.
  - name: login [platform]
    aliases:
      - auth
    description: Login Crush to a platform
    flags:
      -f, --force: Force re-authentication even if already logged in
    documentation:
      command: |-
        Login Crush to a specified platform.
        The platform should be provided as an argument.
        Available platforms are: hyper, copilot, openai.
  - name: logout [platform]
    aliases:
      - signout
    description: Logout Crush from a platform
    flags:
      -f, --force: Skip logout confirmation prompt
    documentation:
      command: |-
        Logout Crush from a specified platform, removing stored credentials.
        The platform should be provided as an argument.
        If no argument is given, a list of logged-in platforms will be shown.
        Available platforms are: hyper, copilot, openai.
  - name: logs
    description: View crush logs
    flags:
      -f, --follow: Follow log output
      -t, --tail=:
        description: 'Show only the last N lines default: 1000 for performance'
        default: "1000"
    documentation:
      command: View the logs generated by Crush. This command allows you to see the log output for debugging and monitoring.
  - name: man
    description: Generates manpages
    hidden: true
  - name: models
    description: List all available models from known providers
    documentation:
      command: List all available models from known providers. Shows provider name and model IDs. Unconfigured providers are marked with (not configured).
  - name: projects
    description: List project directories
    flags:
      --json: Output as JSON
    documentation:
      command: List directories where Crush project data is known to exist
  - name: run [prompt...]
    aliases:
      - r
    description: Run a single non-interactive prompt
    flags:
      --reasoning-effort=: Reasoning effort for the model (e.g. low, medium, high). Levels depend on the model; unsupported values are rejected with the accepted values listed
      --small-model=: Small model to use. If not provided, uses the default small model for the provider
      -C, --continue: Continue the most recent session
      -m, --model=: Model to use. Accepts 'model' or 'provider/model' to disambiguate models with the same name across providers
      -q, --quiet: Hide spinner
      -s, --session=: Continue a previous session by ID
      -v, --verbose: Show logs
    exclusiveflags:
      - - continue
        - session
    documentation:
      command: |-
        Run a single prompt in non-interactive mode and exit.
        The prompt can be provided as arguments or piped from stdin.
  - name: schema
    description: Generate JSON schema for configuration
    hidden: true
    documentation:
      command: Generate JSON schema for the crush configuration file
  - name: server
    description: Start the Crush server
    flags:
      -H, --host=:
        description: Server host (TCP or Unix socket)
        default: unix:///tmp/crush-0.sock
  - name: session
    aliases:
      - sessions
      - s
    description: Manage sessions
    commands:
      - name: delete <id>
        aliases:
          - rm
        description: Delete a session
        flags:
          --json: output in JSON format
        documentation:
          command: Delete a session by ID. Use --json for machine-readable output. ID can be a UUID, full hash, or hash prefix.
      - name: last
        description: Show most recent session
        flags:
          --json: output in JSON format
        documentation:
          command: Show the last updated session. Use --json for machine-readable output.
      - name: list
        aliases:
          - ls
        description: List all sessions
        flags:
          --json: output in JSON format
        documentation:
          command: List all sessions. Use --json for machine-readable output.
      - name: rename <id> <title>
        description: Rename a session
        flags:
          --json: output in JSON format
        documentation:
          command: Rename a session by ID. Use --json for machine-readable output. ID can be a UUID, full hash, or hash prefix.
      - name: show <id>
        description: Show session details
        flags:
          --json: output in JSON format
        documentation:
          command: Show session details. Use --json for machine-readable output. ID can be a UUID, full hash, or hash prefix.
    documentation:
      command: Manage Crush sessions. Agents can use --json for machine-readable output.
  - name: stats
    description: Show usage statistics
    flags:
      --all: Aggregate stats from all known projects (from projects.json)
      --crawl-dir=: Crawl a directory recursively for all crush projects and aggregate stats
    documentation:
      command: Generate and display usage statistics including token usage, costs, and activity patterns
  - name: update-providers [path-or-url]
    description: Update providers
    flags:
      --source=:
        description: Provider source to update (catwalk or hyper)
        default: catwalk
    documentation:
      command: Update provider information from a specified local path or remote URL.
documentation:
  command: A glamorous, terminal-first AI assistant for software development and adjacent tasks
