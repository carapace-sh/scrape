    - name: login
      aliases:
        - |-
          NOTES:
            The proxy address format is host:https_port,ssh_proxy_port

            Passwordless only works in local auth
            --auth=passwordless flag can be omitted if your cluster configuration set the connector_name: passwordless option.

          EXAMPLES:
            Use ports 8080 and 8023 for https and SSH proxy:
            $ tsh --proxy=host.example.com:8080,8023 login

            Use port 8080 and 3023 (default) for SSH proxy:
            $ tsh --proxy=host.example.com:8080 login

            Login and select cluster "two":
            $ tsh --proxy=host.example.com login two

            Select cluster "two" using existing credentials and proxy:
            $ tsh login two

            For passwordless authentication use:
            $ tsh login --auth=passwordless
      description: Log in to a cluster and retrieve the session certificate.
      flags:
        --browser=: Set to 'none' to suppress browser opening on login.
        --force: Force re-authentication even if the current session is still valid.
        --kube-cluster=: Name of the Kubernetes cluster to login to.
        --no-force&: Force re-authentication even if the current session is still valid.
        --no-overwrite&: Whether to overwrite the existing identity file.
        --no-request-nowait&: Finish without waiting for request resolution.
        --no-verbose&: Show extra status information.
        --overwrite: Whether to overwrite the existing identity file.
        --request-id=: Login with the roles requested in the given request.
        --request-nowait: Finish without waiting for request resolution.
        --request-reason=: Reason for requesting additional roles.
        --request-reviewers=: Suggested reviewers for role request.
        --request-roles=: Request one or more extra roles.
        --scope=: Scope pins credentials to a given scope. Use "" to explicitly remove scoping.
        -f, --format=:
            description: 'Identity format: file, openssh (for OpenSSH compatibility) or kubernetes (for kubeconfig).'
            default: file
        -o, --out=: Identity output.
        -v, --verbose: Show extra status information.
