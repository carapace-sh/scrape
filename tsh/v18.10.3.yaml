    - name: mcp
      description: View and control proxied MCP servers.
      commands:
        - name: db
          description: Database access for MCP servers.
          commands:
            - name: start
              description: Start a local MCP server for database access.
              hidden: true
            - name: config
              aliases:
                - |4
                  Examples:
                    Print sample configuration for exposing database as MCP server
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname my-db-resource

                    Add the database configuration to Claude Desktop
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname --client-config=claude my-db-resource

                    Add the database configuration to Cursor
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname --client-config=cursor my-db-resource

                    Generate database configuration for VSCode
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname --format=vscode my-db-resource

                    Add the database configuration to VSCode project
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname --client-config=<path-to-project>/.vscode/.mcp.json my-db-resource

                    Add database configuration to Claude Code project
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname --client-config=<path-to-project>/.mcp.json my-db-resource

                    Add the database configuration to the specified JSON file
                    $ tsh mcp db config --db-user=mydbuser --db-name=mydbname --client-config=my-config.json my-db-resource
              description: Print client configuration details.
              flags:
                --client-config=: If specified, update the specified client config, assuming its format. "claude" for default Claude Desktop config, "cursor" for global Cursor MCP servers config, or specify a JSON file path. Can also be set with environment variable TELEPORT_MCP_CLIENT_CONFIG.
                --format=: Format specifies the configuration format (claude, vscode, cursor). If not provided it will assume format from the configuration file, When no configuration file is provided it defaults to "claude".
                --json-format=:
                    description: Format the JSON file (pretty, compact, auto, none). auto saves in compact if the file is already compact, otherwise pretty. Can also be set with environment variable TELEPORT_MCP_CONFIG_JSON_FORMAT. Default is auto.
                    default: auto
                --no-overwrite&: Overwrites command and environment variable from the config file.
                --overwrite: Overwrites command and environment variable from the config file.
                -n, --db-name=: Database name to log in to.
                -u, --db-user=: Database user to log in as.
        - name: ls
          description: List available MCP server applications.
          flags:
            --no-verbose&: Show extra MCP server fields.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --search=: List of comma separated search keywords or phrases enclosed in quotations (e.g. --search=foo,bar,"some phrase").
            -f, --format=:
                description: Format output (text, json, yaml).
                default: text
            -v, --verbose: Show extra MCP server fields.
        - name: config
          aliases:
            - |4-
              Examples:
                Print sample configuration for a MCP server app
                $ tsh mcp config my-mcp-server-app

                Print sample configuration for a streamable HTTP MCP server with custom headers
                $ tsh mcp config my-mcp-server-app -H "Header1: value1" -H "Header2: value2"

                Add all MCP servers to Claude Desktop
                $ tsh mcp config --all --client-config=claude

                Add all MCP servers to Cursor
                $ tsh mcp config --all --client-config=cursor

                Generate config for all MCP servers for VSCode
                $ tsh mcp config --all --format=vscode

                Add all MCP servers to VSCode project
                $ tsh mcp config --all --client-config=<path-to-project>/.vscode/mcp.json

                Add all MCP servers to Claude Code project
                $ tsh mcp config --all --client-config=<path-to-project>/.mcp.json

                Search MCP servers with labels and add to the specified JSON file
                $ tsh mcp config --labels env=dev --client-config=my-config.json
          description: Print client configuration details.
          flags:
            --auto-reconnect: Automatically starts a new remote MCP session when the previous remote session is interrupted by network issues or tsh session expirations. Recommended for stateless MCP sessions. Defaults to true.
            --client-config=: If specified, update the specified client config, assuming its format. "claude" for default Claude Desktop config, "cursor" for global Cursor MCP servers config, or specify a JSON file path. Can also be set with environment variable TELEPORT_MCP_CLIENT_CONFIG.
            --format=: Format specifies the configuration format (claude, vscode, cursor). If not provided it will assume format from the configuration file, When no configuration file is provided it defaults to "claude".
            --json-format=:
                description: Format the JSON file (pretty, compact, auto, none). auto saves in compact if the file is already compact, otherwise pretty. Can also be set with environment variable TELEPORT_MCP_CONFIG_JSON_FORMAT. Default is auto.
                default: auto
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --no-all&: Select all MCP servers. Mutually exclusive with --labels or --query.
            --no-auto-reconnect&: Automatically starts a new remote MCP session when the previous remote session is interrupted by network issues or tsh session expirations. Recommended for stateless MCP sessions. Defaults to true.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            -H, --header=: Extra custom headers used for streamable HTTP MCP servers.
            -R, --all: Select all MCP servers. Mutually exclusive with --labels or --query.
        - name: connect
          description: Connect to an MCP server.
          hidden: true
          flags:
            --auto-reconnect:
                description: Automatically starts a new remote MCP session when the previous remote session is interrupted by network issues or tsh session expirations. Recommended for stateless MCP sessions. Defaults to true.
                default: "true"
            --no-auto-reconnect&: Automatically starts a new remote MCP session when the previous remote session is interrupted by network issues or tsh session expirations. Recommended for stateless MCP sessions. Defaults to true.
            -H, --header=: Extra custom headers used for streamable HTTP MCP servers.
