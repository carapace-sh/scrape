name: tsh
description: Teleport Command Line Client.
persistentflags:
    --auth=: Specify the name of authentication connector to use.
    --bind-addr=: Override host:port used when opening a browser for cluster logins.
    --browser-login=&: Set to 'none' to suppress browser opening on login.
    --callback=: Override the base URL (host:port) of the link shown when opening a browser for cluster logins. Must be used with --bind-addr.
    --cert-format=: SSH certificate format.
    --check-update&: Check for availability of managed update.
    --compat=&: OpenSSH compatibility flag.
    --completion-bash&: Output possible completions for the given args.
    --completion-script-bash&: Generate completion script for bash.
    --completion-script-fish&: Generate completion script for fish.
    --completion-script-zsh&: Generate completion script for ZSH.
    --cpu-profile=&: Write CPU profile to file.
    --enable-escape-sequences:
        description: Enable support for SSH escape sequences. Type '~?' during an SSH session to list supported sequences. Default is enabled.
        default: "true"
    --fork-kill-fd=&: File descriptor to check parent health on when forked. For internal use only.
    --fork-signal-fd=&: File descriptor to signal parent on when forked. Overrides --fork-after-authentication. For internal use only.
    --headless: Use headless login. Shorthand for --auth=headless.
    --help-long&: Generate long help.
    --help-man&: Generate a man page.
    --insecure:
        description: Do not verify server's certificate and host name. Use only in test environments.
        default: "false"
    --mem-profile=&: Write memory profile to file.
    --mfa-mode=:
        description: Preferred mode for MFA and Passwordless assertions (auto, cross-platform, platform, otp, sso, browser).
        default: auto
    --mlock=:
        description: Determines whether process memory will be locked and whether failure to do so will be accepted (off, auto, best_effort, strict).
        default: auto
    --no-check-update&: Check for availability of managed update.
    --no-completion-bash&: Output possible completions for the given args.
    --no-completion-script-bash&: Generate completion script for bash.
    --no-completion-script-fish&: Generate completion script for fish.
    --no-completion-script-zsh&: Generate completion script for ZSH.
    --no-debug&: Verbose logging to stdout.
    --no-enable-escape-sequences&: Enable support for SSH escape sequences. Type '~?' during an SSH session to list supported sequences. Default is enabled.
    --no-headless&: Use headless login. Shorthand for --auth=headless.
    --no-help&: Show context-sensitive help (also try --help-long and --help-man).
    --no-help-long&: Generate long help.
    --no-help-man&: Generate a man page.
    --no-insecure&: Do not verify server's certificate and host name. Use only in test environments.
    --no-nocache&: Do not cache cluster discovery locally.
    --no-os-log&: Verbose logging to the unified logging system. This flag implies --debug. Also available through the TELEPORT_OS_LOG env var. More details see https://goteleport.com/docs/connect-your-client/tsh/#debug-logs.
    --no-skip-version-check&: Skip version checking between server and client.
    --no-trace&: Capture and export distributed traces.
    --no-use-local-ssh-agent&: Deprecated in favor of the add-keys-to-agent flag.
    --nocache&: Do not cache cluster discovery locally.
    --os-log&: Verbose logging to the unified logging system. This flag implies --debug. Also available through the TELEPORT_OS_LOG env var. More details see https://goteleport.com/docs/connect-your-client/tsh/#debug-logs.
    --piv-slot=: 'Specify a PIV slot key to use for Hardware Key support instead of the default. Ex: "9d".'
    --proxy=: Teleport proxy address.
    --relay=: Teleport relay address, "none" to explicitly disable the use of a relay, or "default" to use the cluster-provided address even if a different address was specified at login time.
    --skip-version-check: Skip version checking between server and client.
    --trace&: Capture and export distributed traces.
    --trace-exporter=&: An OTLP exporter URL to send spans to. Note - only tsh spans will be included.
    --trace-profile=&: Write trace profile to file.
    --ttl=: Minutes to live for a session.
    --use-local-ssh-agent&:
        description: Deprecated in favor of the add-keys-to-agent flag.
        default: "true"
    --user=: Teleport user, defaults to current local user.
    -J, --jumphost=: SSH jumphost.
    -d, --debug: Verbose logging to stdout.
    -h, --help&: Show context-sensitive help (also try --help-long and --help-man).
    -i, --identity=: Identity file.
    -k, --add-keys-to-agent=:
        description: Controls how keys are handled. Valid values are [auto no yes only].
        default: auto
    -l, --login=: Remote host login.
    -o, --option=&: ""
commands:
    - name: help
      description: Show help.
    - name: version
      description: Print the tsh client and Proxy server versions for the current context.
      flags:
        --client: Show the client version only (no server required).
        --no-client&: Show the client version only (no server required).
        -f, --format=:
            description: Format output (text, json, yaml).
            default: text
    - name: ssh
      description: Run shell or execute a command on a remote SSH node.
      flags:
        --disable-access-request: 'Disable automatic resource access requests (DEPRECATED: use --request-mode=off).'
        --invite=: A comma separated list of people to mark as invited for the session.
        --local:
            description: Execute command on localhost after connecting to SSH node.
            default: "false"
        --log-dir=: Directory to log separated command output, when executing on multiple nodes. If set, output from each node will also be labeled in the terminal.
        --no-9b5b2147-502b-4086-bdb6-5000ea2a3f88&: ""
        --no-disable-access-request&: 'Disable automatic resource access requests (DEPRECATED: use --request-mode=off).'
        --no-fc6de7d0-ccbc-4ffc-af96-e73f8123ab84&: ""
        --no-fork-after-authentication&: Run in background after authentication is complete.
        --no-forward-agent&: Forward agent to target node.
        --no-local&: Execute command on localhost after connecting to SSH node.
        --no-no-remote-exec&: Don't execute remote command, useful for port forwarding.
        --no-no-resume&: Disable SSH connection resumption.
        --no-participant-req&: Displays a verbose list of required participants in a moderated session.
        --no-relogin&: Permit performing an authentication attempt on a failed command.
        --no-resume: Disable SSH connection resumption.
        --no-tty&: Allocate TTY.
        --no-x11-trusted&: Requests trusted (insecure) X11 forwarding for this session. This can make your local machine vulnerable to attacks, use with caution.
        --no-x11-untrusted&: Requests untrusted (secure) X11 forwarding for this session.
        --participant-req: Displays a verbose list of required participants in a moderated session.
        --reason=: The purpose of the session.
        --relogin:
            description: Permit performing an authentication attempt on a failed command.
            default: "true"
        --request-mode=:
            description: Type of automatic access request to make (off, resource, role).
            default: resource
        --request-reason=: Reason for requesting access.
        --x11-untrusted-timeout=:
            description: Sets a timeout for untrusted X11 forwarding, after which the client will reject any forwarding requests from the server.
            default: 10m
        -A, --forward-agent: Forward agent to target node.
        -D, --dynamic-forward=: Forward localhost connections to remote server using SOCKS5.
        -L, --forward=: Forward localhost connections to remote server.
        -N, --no-remote-exec: Don't execute remote command, useful for port forwarding.
        -R, --remote-forward=: Forward remote connections to localhost.
        -T, --fc6de7d0-ccbc-4ffc-af96-e73f8123ab84&: ""
        -V, --9b5b2147-502b-4086-bdb6-5000ea2a3f88&: ""
        -X, --x11-untrusted: Requests untrusted (secure) X11 forwarding for this session.
        -Y, --x11-trusted: Requests trusted (insecure) X11 forwarding for this session. This can make your local machine vulnerable to attacks, use with caution.
        -c, --cluster=: Specify the Teleport cluster to connect.
        -f, --fork-after-authentication: Run in background after authentication is complete.
        -o, --option=: OpenSSH options in the format used in the configuration file.
        -p, --port=: SSH port on a remote host.
        -t, --tty: Allocate TTY.
    - name: resolve
      description: Resolves an SSH host.
      flags:
        --no-quiet&: Quiet mode.
        -f, --format=:
            description: Format output (text, json, yaml).
            default: text
        -q, --quiet: Quiet mode.
    - name: daemon
      description: Daemon is the tsh daemon service.
      hidden: true
      commands:
        - name: start
          description: Starts tsh daemon service.
          hidden: true
          flags:
            --addr=: Addr is the daemon listening address.
            --agents-dir=: Directory containing agent config files and data directories for Connect My Computer.
            --certs-dir=: Directory containing certs used to create secure gRPC connection with daemon service.
            --hardware-key-agent: Serve the hardware key agent as part of the daemon process.
            --installation-id=: Unique ID identifying a specific Teleport Connect installation.
            --kubeconfigs-dir=: Directory containing kubeconfig for Kubernetes Access.
            --no-hardware-key-agent&: Serve the hardware key agent as part of the daemon process.
            --prehog-addr=: URL where prehog events should be submitted.
        - name: stop
          description: Gracefully stops a process on Windows by sending Ctrl-Break to it.
          hidden: true
          flags:
            --pid=: PID to be stopped.
    - name: aws
      description: Access AWS API.
      flags:
        --app=: Optional Name of the AWS application to use if logged into multiple.
        --aws-role=: (For AWS CLI access only) Amazon IAM role ARN or role name.
        --exec=: Execute different commands (e.g. terraform) under Teleport credentials.
        --no-endpoint-url&: Run local proxy to serve as an AWS endpoint URL. If not specified, local proxy serves as an HTTPS proxy.
        -e, --endpoint-url&: Run local proxy to serve as an AWS endpoint URL. If not specified, local proxy serves as an HTTPS proxy.
    - name: aws-profile
      description: Generate AWS config profiles by syncing with your integrated AWS IAM Identity Center account(s). Other profiles in the config file are left untouched.
      flags:
        --aws-sso-region=: AWS region for SSO. Auto-detected from cluster if not specified.
        --dry-run: Print the configuration that will be applied without modifying the AWS config file.
        --no-dry-run&: Print the configuration that will be applied without modifying the AWS config file.
    - name: az
      description: Access Azure API.
      flags:
        --app=: Optional name of the Azure application to use if logged into multiple.
        --azure-identity=: (For Azure CLI access only) Azure managed identity name.
    - name: gcloud
      aliases:
        - gcp
      description: Access GCP API with the gcloud command.
      flags:
        --app=: Optional name of the GCP application to use if logged into multiple.
        --gcp-service-account=: (For GCP CLI access only) GCP service account name.
    - name: gsutil
      description: Access Google Cloud Storage with the gsutil command.
      flags:
        --app=: Optional name of the GCP application to use if logged into multiple.
        --gcp-service-account=: (For GCP CLI access only) GCP service account name.
    - name: apps
      aliases:
        - app
      description: View and control proxied applications.
      flags:
        -c, --cluster=: Specify the Teleport cluster to connect.
      commands:
        - name: ls
          description: List available applications.
          flags:
            --no-all&: List apps from all clusters and proxies.
            --no-verbose&: Show extra application fields.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --search=: List of comma separated search keywords or phrases enclosed in quotations (e.g. --search=foo,bar,"some phrase").
            -R, --all: List apps from all clusters and proxies.
            -f, --format=:
                description: Format output (text, json, yaml).
                default: text
            -v, --verbose: Show extra application fields.
        - name: login
          description: Retrieve short-lived certificate for an app.
          flags:
            --aws-role=: (For AWS CLI access only) Amazon IAM role ARN or role name.
            --azure-identity=: (For Azure CLI access only) Azure managed identity name.
            --env&: (For AWS CLI access only) Obtain credentials as plain text in order to load into environments variables. Required when using per-session MFA.
            --gcp-service-account=: (For GCP CLI access only) GCP service account name.
            --no-env&: (For AWS CLI access only) Obtain credentials as plain text in order to load into environments variables. Required when using per-session MFA.
            --no-interactive&: Prompt for AWS Roles interactively (--aws-role takes precedence).
            --no-quiet&: Quiet mode.
            --target-port=: Port to which connections made using this cert should be routed to. Valid only for multi-port TCP apps.
            -T, --interactive: Prompt for AWS Roles interactively (--aws-role takes precedence).
            -q, --quiet: Quiet mode.
        - name: logout
          description: Remove app certificate.
        - name: config
          description: Print app connection information.
          flags:
            -f, --format=: 'Optional print format, one of: "uri" to print app address, "ca" to print CA cert path, "cert" to print cert path, "key" print key path, "curl" to print example curl command, "json" or "yaml" to print everything as JSON or YAML.'
        - name: logins
          description: List available logins for a Cloud console application.
          flags:
            -f, --format=:
                description: Format output (text, json, yaml).
                default: text
    - name: recordings
      aliases:
        - recording
      description: View and control session recordings.
      commands:
        - name: ls
          description: List recorded sessions.
          flags:
            --from-utc=: Start of time range in which recordings are listed. Format 2006-01-02. Defaults to 24 hours ago.
            --last=: Duration into the past from which session recordings should be listed. Format "5h30m40s".
            --limit=:
                description: Maximum number of recordings to show. Default 50.
                default: "50"
            --to-utc=: End of time range in which recordings are listed. Format 2006-01-02. Defaults to current time.
            -f, --format=:
                description: Format output (text, json, yaml). Defaults to 'text'.
                default: text
        - name: export
          description: Export recorded desktop sessions to video.
          flags:
            --encoder=:
                description: The video encoder to use.
                default: auto
            --no-quiet&: Quiet mode.
            --out=: Override output file name.
            -q, --quiet: Quiet mode.
    - name: proxy
      description: Run local TLS proxy allowing connecting to Teleport in single-port mode.
      flags:
        --proxy-log-output=:
            description: Select where proxy status messages are printed. Defaults to "stderr", but can be used to revert to legacy behavior of send proxy output to stdout. Valid values are "stdout", "stderr", and "none".
            default: stderr
      commands:
        - name: ssh
          description: Start local TLS proxy for ssh connections when using Teleport in single-port mode.
          flags:
            --no-no-resume&: Disable SSH connection resumption.
            --no-relogin&: Permit performing an authentication attempt on a failed command.
            --no-resume: Disable SSH connection resumption.
            --relogin:
                description: Permit performing an authentication attempt on a failed command.
                default: "true"
            -c, --cluster=: Specify the Teleport cluster to connect.
        - name: db
          description: Start local TLS proxy for database connections when using Teleport in single-port mode.
          flags:
            --disable-access-request: Disable automatic resource access requests.
            --insecure-listen-anywhere: 'Allows the local proxy to listen on any address without restrictions. WARNING: this will expose unsecured listener to anyone in the network. Only use when network access is otherwise restricted.'
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --listen=: Specifies the source address used by proxy db listener. Mutually exclusive with --port.
            --no-disable-access-request&: Disable automatic resource access requests.
            --no-insecure-listen-anywhere&: 'Allows the local proxy to listen on any address without restrictions. WARNING: this will expose unsecured listener to anyone in the network. Only use when network access is otherwise restricted.'
            --no-tunnel&: Open authenticated tunnel using database's client certificate so clients don't need to authenticate.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --request-reason=: Reason for requesting access.
            --tunnel: Open authenticated tunnel using database's client certificate so clients don't need to authenticate.
            -c, --cluster=: Specify the Teleport cluster to connect.
            -n, --db-name=: Database name to log in to.
            -p, --port=: Specifies the source port used by proxy db listener.
            -r, --db-roles=: List of comma separate database roles to use for auto-provisioned user.
            -u, --db-user=: Database user to log in as.
        - name: app
          description: Start local TLS proxy for app connection when using Teleport in single-port mode.
          flags:
            --https-tunnel&: Use the teleport-app-https ALPN protocol (HTTPS tunneled over mTLS) for HTTP apps.
            --no-https-tunnel&: Use the teleport-app-https ALPN protocol (HTTPS tunneled over mTLS) for HTTP apps.
            -c, --cluster=: Specify the Teleport cluster to connect.
            -p, --port=: Specifies the listening port used by the proxy app listener. Accepts an optional target port of a multi-port TCP app after a colon, e.g. "1234:5678".
        - name: mcp
          description: Start local proxy for MCP access.
          flags:
            -c, --cluster=: Specify the Teleport cluster to connect.
            -p, --port=: Specifies the listening port used by the proxy app listener.
        - name: aws
          description: Start local proxy for AWS access.
          flags:
            --app=: Optional Name of the AWS application to use if logged into multiple.
            --no-endpoint-url&: Run local proxy to serve as an AWS endpoint URL. If not specified, local proxy serves as an HTTPS proxy.
            -e, --endpoint-url&: Run local proxy to serve as an AWS endpoint URL. If not specified, local proxy serves as an HTTPS proxy.
            -f, --format=:
                description: 'Optional format to print the commands for setting environment variables, one of: unix, command-prompt, powershell, text. Default is unix. Or specify a service format, one of: athena-odbc, athena-jdbc.'
                default: unix
            -p, --port=: Specifies the source port used by the proxy listener.
        - name: azure
          aliases:
            - az
          description: Start local proxy for Azure access.
          flags:
            --app=: Optional Name of the Azure application to use if logged into multiple.
            -f, --format=:
                description: 'Optional format to print the commands for setting environment variables, one of: unix, command-prompt, powershell, text. Default is unix.'
                default: unix
            -p, --port=: Specifies the source port used by the proxy listener.
        - name: gcloud
          aliases:
            - gcp
          description: Start local proxy for GCP access.
          flags:
            --app=: Optional Name of the GCP application to use if logged into multiple.
            -f, --format=:
                description: 'Optional format to print the commands for setting environment variables, one of: unix, command-prompt, powershell, text. Default is unix.'
                default: unix
            -p, --port=: Specifies the source port used by the proxy listener.
        - name: kube
          description: Start local proxy for Kubernetes access.
          flags:
            --as-groups=: Configure custom Kubernetes group impersonation.
            --as=: Configure custom Kubernetes user impersonation.
            --exec: Run the proxy in the background and reexec into a new shell with $KUBECONFIG already pointed to our config file.
            --exec-arg=: Arguments to pass to the executed command (can be specified multiple times).
            --exec-cmd=: Command to execute when --exec is enabled. If not specified, defaults to $SHELL or /bin/bash. Implicitly enables exec mode.
            --kube-namespace=&: Configure the default Kubernetes namespace.
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --no-exec&: Run the proxy in the background and reexec into a new shell with $KUBECONFIG already pointed to our config file.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --set-context-name=:
                description: Define a custom context name or template.
                default: '{{.ClusterName}}-{{.KubeName}}'
            -c, --cluster=: Specify the Teleport cluster to connect.
            -f, --format=:
                description: 'Optional format to print the commands for setting environment variables, one of: unix, command-prompt, powershell, text. Default is unix.'
                default: unix
            -n, --namespace=: Configure the default Kubernetes namespace.
            -p, --port=: Specifies the source port used by the proxy listener.
    - name: db
      description: View and control proxied databases.
      flags:
        -c, --cluster=: Specify the Teleport cluster to connect.
      commands:
        - name: ls
          aliases:
            - |4-
              Examples:
                Search databases with keywords:
                $ tsh db ls --search foo,bar

                Filter databases with labels:
                $ tsh db ls key1=value1,key2=value2

                List databases from all clusters with extra fields:
                $ tsh db ls --all -v

                Get database names using "jq":
                $ tsh db ls --format json  | jq -r '.[].metadata.name'
          description: List all available databases.
          flags:
            --no-all&: List databases from all clusters and proxies.
            --no-verbose&: Show extra database fields.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --search=: List of comma separated search keywords or phrases enclosed in quotations (e.g. --search=foo,bar,"some phrase").
            -R, --all: List databases from all clusters and proxies.
            -f, --format=:
                description: Format output (text, json, yaml).
                default: text
            -v, --verbose: Show extra database fields.
        - name: login
          description: Retrieve credentials for a database.
          flags:
            --disable-access-request: Disable automatic resource access requests.
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --no-disable-access-request&: Disable automatic resource access requests.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --request-reason=: Reason for requesting access.
            -n, --db-name=: Database name to configure as default.
            -r, --db-roles=: List of comma separate database roles to use for auto-provisioned user.
            -u, --db-user=: Database user to configure as default.
        - name: logout
          description: Remove database credentials.
          flags:
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
        - name: env
          description: Print environment variables for the configured database.
          flags:
            --db=&: Print environment for the specified database.
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            -f, --format=:
                description: Format output (text, json, yaml).
                default: text
        - name: config
          description: Print database connection information. Useful when configuring GUI clients.
          flags:
            --db=&: Print information for the specified database.
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            -f, --format=: 'Print format: "text" to print in table format (default), "cmd" to print connect command, "json" or "yaml" to print in JSON or YAML.'
        - name: connect
          description: Connect to a database.
          flags:
            --disable-access-request: Disable automatic resource access requests.
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --no-disable-access-request&: Disable automatic resource access requests.
            --no-tunnel&: Open authenticated tunnel using database's client certificate so clients don't need to authenticate.
            --query=: Query by predicate language enclosed in single quotes. Supports ==, !=, &&, and || (e.g. --query='labels["key1"] == "value1" && labels["key2"] != "value2"').
            --request-reason=: Reason for requesting access.
            --tunnel&: Open authenticated tunnel using database's client certificate so clients don't need to authenticate.
            -n, --db-name=: Database name to log in to.
            -r, --db-roles=: List of comma separate database roles to use for auto-provisioned user.
            -u, --db-user=: Database user to log in as.
        - name: exec
          aliases:
            - |4-
              Examples:
                Search databases with labels:
                $ tsh db exec "source my_script.sql" --db-user mysql --labels key1=value1,key2=value2

                Search databases with keywords:
                $ tsh db exec "select 1" --db-user mysql --db-name mysql --search foo,bar

                Execute a command on specified target databases without confirmation:
                $ tsh db exec "select @@hostname" --db-user mysql --dbs mydb1,mydb2,mydb3 --no-confirm

                Run commands in parallel, and save outputs to files:
                $ tsh db exec "select 1" --db-user mysql --labels env=dev --parallel=5 --output-dir=exec-outputs
          description: Execute database commands on target database services.
          flags:
            --confirm:
                description: Confirm selected database services before executing command.
                default: "true"
            --dbs=: List of comma separated target database services. Mutually exclusive with --search or --labels.
            --labels=: List of comma separated labels to filter by labels (e.g. key1=value1,key2=value2).
            --no-confirm&: Confirm selected database services before executing command.
            --output-dir=: Directory to store command output per target database service. A summary is saved as "summary.json".
            --parallel=:
                description: Run commands on target databases in parallel. Defaults to 1, and maximum allowed is 10.
                default: "1"
            --search=: List of comma separated search keywords or phrases enclosed in quotations (e.g. --search=foo,bar,"some phrase").
            -n, --db-name=: Database name to log in to.
            -r, --db-roles=: List of comma separate database roles to use for auto-provisioned user.
            -u, --db-user=: Database user to log in as.
    - name: join
