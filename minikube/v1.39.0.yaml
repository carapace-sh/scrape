# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: minikube
description: minikube quickly sets up a local Kubernetes cluster
persistentflags:
  --add_dir_header: If true, adds the file directory to the header of the log messages
  --alsologtostderr: log to standard error as well as files (no effect when -logtostderr=true)
  --alsologtostderrthreshold=:
    description: logs at or above this threshold go to stderr when -alsologtostderr=true (no effect when -logtostderr=true)
    default: "0"
  --legacy_stderr_threshold_behavior:
    description: If true, stderrthreshold is ignored when logtostderr=true (legacy behavior). If false, stderrthreshold is honored even when logtostderr=true
    default: "true"
  --log_backtrace_at=:
    description: when logging hits line file:N, emit a stack trace
    default: :0
  --log_dir=: If non-empty, write log files in this directory (no effect when -logtostderr=true)
  --log_file=: If non-empty, use this log file (no effect when -logtostderr=true)
  --log_file_max_size=:
    description: Defines the maximum size a log file can grow to (no effect when -logtostderr=true). Unit is megabytes. If the value is 0, the maximum file size is unlimited.
    default: "1800"
  --logtostderr:
    description: log to standard error instead of files
    default: "true"
  --one_output: If true, only write logs to their native severity level (vs also writing to each lower severity level; no effect when -logtostderr=true)
  --rootless: Force to use rootless driver (docker and podman driver only)
  --skip-audit: Skip recording the current command in the audit logs.
  --skip_headers: If true, avoid header prefixes in the log messages
  --skip_log_headers: If true, avoid headers when opening log files (no effect when -logtostderr=true)
  --stderrthreshold=:
    description: logs at or above this threshold go to stderr when writing to files and stderr (no effect when -logtostderr=true or -alsologtostderr=true unless -legacy_stderr_threshold_behavior=false)
    default: "2"
  --user=: Specifies the user executing the operation. Useful for auditing operations executed by 3rd party tools. Defaults to the operating system username.
  --vmodule=: comma-separated list of pattern=N settings for file-filtered logging
  -b, --bootstrapper=:
    description: The name of the cluster bootstrapper that will set up the Kubernetes cluster.
    default: kubeadm
  -h, --help: ""
  -p, --profile=:
    description: The name of the minikube VM being used. This can be set to allow having multiple instances of minikube independently.
    default: minikube
  -v, --v=:
    description: number for the log level verbosity
    default: "0"
commands:
  - name: addons SUBCOMMAND [flags]
    description: Enable or disable a minikube addon
    commands:
      - name: configure ADDON_NAME
        description: 'Configures the addon w/ADDON_NAME within minikube (example: minikube addons configure registry-creds). For a list of available addons use: minikube addons list'
        flags:
          -f, --config-file=: An optional configuration file to read addon specific configs from instead of being prompted each time.
        documentation:
          command: 'Configures the addon w/ADDON_NAME within minikube (example: minikube addons configure registry-creds). For a list of available addons use: minikube addons list'
      - name: disable ADDON_NAME
        description: 'Disables the addon w/ADDON_NAME within minikube (example: minikube addons disable dashboard). For a list of available addons use: minikube addons list '
        documentation:
          command: 'Disables the addon w/ADDON_NAME within minikube (example: minikube addons disable dashboard). For a list of available addons use: minikube addons list '
      - name: enable ADDON_NAME
        description: 'Enables the addon w/ADDON_NAME within minikube. For a list of available addons use: minikube addons list '
        flags:
          --force: If true, will perform potentially dangerous operations. Use with discretion.
          --images=: Images used by this addon. Separated by commas.
          --refresh: If true, pods might get deleted and restarted on addon enable
          --registries=: Registries used by this addon. Separated by commas.
        documentation:
          command: 'Enables the addon w/ADDON_NAME within minikube. For a list of available addons use: minikube addons list '
      - name: images ADDON_NAME
        description: 'List image names the addon w/ADDON_NAME used. For a list of available addons use: minikube addons list'
        flags:
          -o, --output=:
            description: minikube addons images ADDON_NAME --output OUTPUT. table, json
            default: table
        documentation:
          command: 'List image names the addon w/ADDON_NAME used. For a list of available addons use: minikube addons list'
      - name: list
        description: Lists all available minikube addons as well as their current statuses (enabled/disabled)
        flags:
          -d, --docs: If true, print web links to addons' documentation if using --output=list (default).
          -o, --output=:
            description: minikube addons list --output OUTPUT. json, list
            default: list
        documentation:
          command: Lists all available minikube addons as well as their current statuses (enabled/disabled)
      - name: open ADDON_NAME
        description: 'Opens the addon w/ADDON_NAME within minikube (example: minikube addons open dashboard). For a list of available addons use: minikube addons list '
        flags:
          --https: Open the addons URL with https instead of http
          --interval=:
            description: The time interval for each check that wait performs in seconds
            default: "1"
          --url: Display the Kubernetes addons URL in the CLI instead of opening it in the default browser
          --wait=:
            description: Amount of time to wait for service in seconds
            default: "2"
        persistentflags:
          --format=:
            description: Format to output addons URL in.  This format will be applied to each url individually and they will be printed one at a time.
            default: http://{{.IP}}:{{.Port}}
        documentation:
          command: 'Opens the addon w/ADDON_NAME within minikube (example: minikube addons open dashboard). For a list of available addons use: minikube addons list '
    documentation:
      command: addons modifies minikube addons files using subcommands like "minikube addons enable dashboard"
  - name: cache
    description: Manage cache for images
    commands:
      - name: add
        description: Add an image to local cache.
        flags:
          --all: Add image to cache for all running minikube clusters
        documentation:
          command: Add an image to local cache.
      - name: delete
        description: Delete an image from the local cache.
        documentation:
          command: Delete an image from the local cache.
      - name: list
        description: List all available images from the local cache.
        flags:
          --format=:
            description: |-
              Go template format string for the cache list output.  The format for Go templates can be found here: https://pkg.go.dev/text/template
              For the list of accessible variables for the template, see the struct values here: https://pkg.go.dev/k8s.io/minikube/cmd/minikube/cmd#CacheListTemplate
            default: |
              {{.CacheImage}}
        documentation:
          command: List all available images from the local cache.
      - name: reload
        description: reload cached images.
        documentation:
          command: reloads images previously added using the 'cache add' subcommand
    documentation:
      command: Add an image into minikube as a local cache, or delete, reload the cached images
  - name: completion SHELL
    description: Generate command completion for a shell
    commands:
      - name: bash
        description: bash completion.
        documentation:
          command: Generate command completion for bash.
      - name: fish
        description: fish completion.
        documentation:
          command: Generate command completion for fish .
      - name: powershell
        description: powershell completion.
        documentation:
          command: Generate command completion for PowerShell.
      - name: zsh
        description: zsh completion.
        documentation:
          command: Generate command completion for zsh.
    documentation:
      command: |
        Outputs minikube shell completion for the given shell (bash, zsh, fish or powershell)

        	This depends on the bash-completion binary.  Example installation instructions:
        	OS X:
        		$ brew install bash-completion
        		$ source $(brew --prefix)/etc/bash_completion
        		$ minikube completion bash > ~/.minikube-completion  # for bash users
        		$ minikube completion zsh > ~/.minikube-completion  # for zsh users
        		$ source ~/.minikube-completion
        		$ minikube completion fish > ~/.config/fish/completions/minikube.fish # for fish users
        	Ubuntu:
        		$ apt-get install bash-completion
        		$ source /etc/bash_completion
        		$ source <(minikube completion bash) # for bash users
        		$ source <(minikube completion zsh) # for zsh users
        		$ minikube completion fish > ~/.config/fish/completions/minikube.fish # for fish users

        	Additionally, you may want to output the completion to a file and source in your .bashrc

        	Windows:
        		## Save completion code to a script and execute in the profile
        		PS> minikube completion powershell > $HOME\.minikube-completion.ps1
        		PS> Add-Content $PROFILE '. $HOME\.minikube-completion.ps1'

        		## Execute completion code in the profile
        		PS> Add-Content $PROFILE 'if (Get-Command minikube -ErrorAction SilentlyContinue) {
        		        minikube completion powershell | Out-String | Invoke-Expression
        		    }'

        	Note for zsh users: [1] zsh completions are only supported in versions of zsh >= 5.2
        	Note for fish users: [2] please refer to this docs for more details https://fishshell.com/docs/current/#tab-completion
  - name: config SUBCOMMAND [flags]
    description: Modify persistent configuration values
    commands:
      - name: defaults PROPERTY_NAME
        description: Lists all valid default values for PROPERTY_NAME
        flags:
          -o, --output=: 'Output format. Accepted values: [json, yaml]'
        documentation:
          command: "list displays all valid default settings for PROPERTY_NAME\nAcceptable fields: \n\n * driver\n * kubernetes-version"
      - name: get PROPERTY_NAME
        description: Gets the value of PROPERTY_NAME from the minikube config file
        documentation:
          command: Returns the value of PROPERTY_NAME from the minikube config file.  Can be overwritten at runtime by flags or environmental variables.
      - name: set PROPERTY_NAME PROPERTY_VALUE
        description: Sets an individual value in a minikube config file
        documentation:
          command: |-
            Sets the PROPERTY_NAME config value to PROPERTY_VALUE
            	These values can be overwritten by flags or environment variables at runtime.
      - name: unset PROPERTY_NAME
        description: unsets an individual value in a minikube config file
        documentation:
          command: unsets PROPERTY_NAME from the minikube config file.  Can be overwritten by flags or environmental variables
      - name: view
        description: Display values currently set in the minikube config file
        flags:
          --format=:
            description: |-
              Go template format string for the config view output.  The format for Go templates can be found here: https://pkg.go.dev/text/template
              For the list of accessible variables for the template, see the struct values here: https://pkg.go.dev/k8s.io/minikube/cmd/minikube/cmd/config#ConfigViewTemplate
            default: |
              - {{.ConfigKey}}: {{.ConfigValue}}
        documentation:
          command: "Display values currently set in the minikube config file.\n\tThe output format can be customized using the --format flag, which accepts a Go template. \n\tThe config file is typically located at \"~/.minikube/config/config.json\"."
    documentation:
      command: "config modifies minikube config files using subcommands like \"minikube config set driver kvm2\"\nConfigurable fields: \n\n * driver\n * vm-driver\n * container-runtime\n * feature-gates\n * v\n * cpus\n * disk-size\n * host-only-cidr\n * memory\n * log_dir\n * kubernetes-version\n * iso-url\n * WantUpdateNotification\n * WantBetaUpdateNotification\n * ReminderWaitPeriodInHours\n * WantNoneDriverWarning\n * WantVirtualBoxDriverWarning\n * profile\n * bootstrapper\n * insecure-registry\n * hyperv-virtual-switch\n * disable-driver-mounts\n * cache\n * EmbedCerts\n * native-ssh\n * rootless\n * MaxAuditEntries\n * dns-servers\n * mdns"
  - name: cp <source node name>:<source file path> <target node name>:<target file absolute path>
    description: Copy the specified file into minikube
    documentation:
      command: |-
        Copy the specified file into minikube, it will be saved at path <target file absolute path> in your minikube.
        Default target node controlplane and If <source node name> is omitted, It will trying to copy from host.

        Example Command : "minikube cp a.txt /home/docker/b.txt" +
                          "minikube cp a.txt minikube-m02:/home/docker/b.txt"
                          "minikube cp minikube-m01:a.txt minikube-m02:/home/docker/b.txt"
  - name: dashboard
    description: Access the Kubernetes dashboard running within the minikube cluster
    flags:
      --port=: Exposed port of the proxyfied dashboard. Set to 0 to pick a random port.
      --url: Display dashboard URL instead of opening a browser
    documentation:
      command: Access the Kubernetes dashboard running within the minikube cluster
  - name: delete
    description: Deletes a local Kubernetes cluster
    flags:
      --all: Set flag to delete all profiles
      --purge: Set this flag to delete the '.minikube' folder from your user directory.
      -o, --output=:
        description: 'Format to print stdout in. Options include: [text,json]'
        default: text
    documentation:
      command: |-
        Deletes a local Kubernetes cluster. This command deletes the VM, and removes all
        associated files.
  - name: docker-env
    description: Provides instructions to point your terminal's docker-cli to the Docker Engine inside minikube. (Useful for building docker images directly inside minikube)
    flags:
      --no-proxy: Add machine IP to NO_PROXY environment variable
      --shell=: 'Force environment to be configured for a specified shell: [fish, cmd, powershell, tcsh, bash, zsh], default is auto-detect'
      --ssh-add: Add SSH identity key to SSH authentication agent
      --ssh-host: Use SSH connection instead of HTTPS (port 2376)
      -o, --output=: One of 'text', 'yaml' or 'json'.
      -u, --unset: Unset variables instead of setting them
    documentation:
      command: |-
        Provides instructions to point your terminal's docker-cli to the Docker Engine inside minikube. (Useful for building docker images directly inside minikube)

        For example, you can do all docker operations such as docker build, docker run, and docker ps directly on the docker inside minikube.

        Note: You need the docker-cli to be installed on your machine.
        docker-cli install instructions: https://minikube.sigs.k8s.io/docs/tutorials/docker_desktop_replacement/#steps
  - name: generate-docs
    description: Populates the specified folder with documentation in markdown about minikube
    hidden: true
    flags:
      --code-path=: The path on the file system where the error code docs in markdown need to be saved
      --path=: The path on the file system where the docs in markdown need to be saved
      --test-path=: The path on the file system where the testing docs in markdown need to be saved
    documentation:
      command: Populates the specified folder with documentation in markdown about minikube
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type minikube help [path to command] for full details.
  - name: image COMMAND
    description: Manage images
    commands:
      - name: build PATH | URL | -
        description: Build a container image in minikube
        flags:
          --all: Build image on all nodes.
          --build-env=*: 'Environment variables to pass to the build. (format: key=value)'
          --build-opt=*: 'Specify arbitrary flags to pass to the build. (format: key=value)'
          --push: Push the new image (requires tag)
          -f, --file=: Path to the Dockerfile to use (optional)
          -n, --node=: The node to build on. Defaults to the primary control plane.
          -t, --tag=: Tag to apply to the new image (optional)
        documentation:
          command: Build a container image, using the container runtime.
      - name: load IMAGE | ARCHIVE | -
        description: Load an image into minikube
        flags:
          --daemon: Cache image from docker daemon
          --overwrite:
            description: Overwrite image even if same image:tag name exists
            default: "true"
          --pull: Pull the remote image (no caching)
          --remote: Cache image from remote registry
        documentation:
          command: Load an image into minikube
      - name: ls
        aliases:
          - list
        description: List images
        flags:
          --format=:
            description: 'Format output. One of: short|table|json|yaml'
            default: short
      - name: pull
        description: Pull images
      - name: push
        description: Push images
      - name: rm IMAGE [IMAGE...]
        aliases:
          - remove
          - unload
        description: Remove one or more images
      - name: save IMAGE [ARCHIVE | -]
        description: Save a image from minikube
        flags:
          --daemon: Cache image to docker daemon
          --remote: Cache image to remote registry
        documentation:
          command: Save a image from minikube
      - name: tag
        aliases:
          - list
        description: Tag images
  - name: ip
    description: Retrieves the IP address of the specified node
    flags:
      -n, --node=: The node to get IP. Defaults to the primary control plane.
    documentation:
      command: Retrieves the IP address of the specified node, and writes it to STDOUT.
  - name: kubectl
    description: Run a kubectl binary matching the cluster version
    flags:
      --ssh: Use SSH for running kubernetes client on the node
    documentation:
      command: |-
        Run the Kubernetes client, download it if necessary. Remember -- after kubectl!

        This will run the Kubernetes client (kubectl) with the same version as the cluster

        Normally it will download a binary matching the host operating system and architecture,
        but optionally you can also run it directly on the control plane over the ssh connection.
        This can be useful if you cannot run kubectl locally for some reason, like unsupported
        host. Please be aware that when using --ssh all paths will apply to the remote machine.
  - name: license
    description: Outputs the licenses of dependencies to a directory
    flags:
      -d, --dir=:
        description: Directory to output licenses to
        default: .
    documentation:
      command: Outputs the licenses of dependencies to a directory
  - name: logs
    description: Returns logs to debug a local Kubernetes cluster
    flags:
      --audit: Show only the audit logs
      --file=: If present, writes to the provided file instead of stdout.
      --last-start-only: Show only the last start logs.
      --node=: The node to get logs from. Defaults to the primary control plane.
      --problems: Show only log entries which point to known problems
      -f, --follow: Show only the most recent journal entries, and continuously print new entries as they are appended to the journal.
      -n, --length=:
        description: Number of lines back to go within the log
        default: "60"
    documentation:
      command: Gets the logs of the running instance, used for debugging minikube, not user code.
  - name: mount [flags] <source directory>:<target directory>
    description: Mounts the specified directory into minikube
    flags:
      --9p-version=:
        description: Specify the 9p version that the mount should use
        default: 9p2000.L
      --gid=:
        description: Default group id used for the mount
        default: docker
      --ip=: Specify the ip that the mount should be setup on
      --kill: Kill the mount process spawned by minikube start
      --msize=:
        description: The number of bytes to use for 9p packet payload
        default: "262144"
      --options=*: Additional mount options, such as cache=fscache
      --port=: Specify the port that the mount should be setup on, where 0 means any free port.
      --type=:
        description: 'Specify the mount filesystem type (supported types: 9p)'
        default: 9p
      --uid=:
        description: Default user id used for the mount
        default: docker
    documentation:
      command: Mounts the specified directory into minikube.
  - name: node
    description: Add, remove, or list additional nodes
    commands:
      - name: add
        description: Adds a node to the given cluster.
        flags:
          --control-plane: If set, added node will become a control-plane. Defaults to false. Currently only supported for existing HA (multi-control plane) clusters.
          --delete-on-failure: If set, delete the current cluster if start fails and try again. Defaults to false.
          --worker:
            description: If set, added node will be available as worker. Defaults to true.
            default: "true"
        documentation:
          command: Adds a node to the given cluster config, and starts it.
      - name: delete NODE_NAME
        description: Deletes a node from a cluster.
        documentation:
          command: Deletes a node from a cluster.
      - name: list
        description: List nodes.
        documentation:
          command: List existing minikube nodes.
      - name: start NODE_NAME
        description: Starts a node.
        flags:
          --delete-on-failure: If set, delete the current cluster if start fails and try again. Defaults to false.
        documentation:
          command: Starts an existing stopped node in a cluster.
      - name: stop NODE_NAME
        description: Stops a node in a cluster.
        documentation:
          command: Stops a node in a cluster.
    documentation:
      command: Operations on nodes
  - name: options
    description: Show a list of global command-line options (applies to all commands).
    documentation:
      command: Show a list of global command-line options (applies to all commands).
  - name: pause
    description: pause Kubernetes
    flags:
      -A, --all-namespaces: If set, pause all namespaces
      -n, --namespaces=*:
        description: namespaces to pause
        default: '[kube-system,kubernetes-dashboard,istio-operator]'
      -o, --output=:
        description: 'Format to print stdout in. Options include: [text,json]'
        default: text
  - name: podman-env
    description: Configure environment to use minikube's Podman service
    flags:
      --shell=: 'Force environment to be configured for a specified shell: [fish, cmd, powershell, tcsh, bash, zsh], default is auto-detect'
      -u, --unset: Unset variables instead of setting them
    documentation:
      command: Sets up podman env variables; similar to '$(podman-machine env)'.
  - name: profile [MINIKUBE_PROFILE_NAME].  You can return to the default minikube profile by running `minikube profile default`
    description: Get or list the current profiles (clusters)
    commands:
      - name: list
        description: Lists all minikube profiles.
        flags:
          -d, --detailed: If true, returns a detailed list of profiles.
          -l, --light: If true, returns list of profiles faster by skipping validating the status of the cluster.
          -o, --output=:
            description: The output format. One of 'json', 'table'
            default: table
        documentation:
          command: Lists all valid minikube profiles and detects all possible invalid profiles.
    documentation:
      command: profile sets the current minikube profile, or gets the current profile if no arguments are provided.  This is used to run and manage multiple minikube instance.  You can return to the default minikube profile by running `minikube profile default`
  - name: service [flags] SERVICE
    description: Returns a URL to connect to a service
    flags:
      --all: Forwards all services in a namespace (defaults to "false")
      --https: Open the service URL with https instead of http (defaults to "false")
      --interval=:
        description: The initial time interval for each check that wait performs in seconds
        default: "1"
      --url: Display the Kubernetes service URL in the CLI instead of opening it in the default browser
      --wait=:
        description: Amount of time to wait for a service in seconds
        default: "2"
      -n, --namespace=:
        description: The service namespace
        default: default
    persistentflags:
      --format=:
        description: Format to output service URL in. This format will be applied to each url individually and they will be printed one at a time.
        default: http://{{.IP}}:{{.Port}}
    commands:
      - name: list [flags]
        description: Lists the URLs for the services in your local cluster
        flags:
          -n, --namespace=: The services namespace
          -o, --output=:
            description: The output format. One of 'json', 'table'
            default: table
        documentation:
          command: Lists the URLs for the services in your local cluster
    documentation:
      command: Returns the Kubernetes URL(s) for service(s) in your local cluster. In the case of multiple URLs they will be printed one at a time.
  - name: ssh
    description: Log into the minikube environment (for debugging)
    flags:
      --native-ssh:
        description: Use native Golang SSH client (default true). Set to 'false' to use the command line 'ssh' command when accessing the docker machine. Useful for the machine drivers when they will not start with 'Waiting for SSH'.
        default: "true"
      -n, --node=: The node to ssh into. Defaults to the primary control plane.
    documentation:
      command: Log into or run a command on a machine with SSH; similar to 'docker-machine ssh'.
  - name: ssh-host
    description: Retrieve the ssh host key of the specified node
    flags:
      --append-known: Add host key to SSH known_hosts file
      -n, --node=: The node to ssh into. Defaults to the primary control plane.
    documentation:
      command: Retrieve the ssh host key of the specified node.
  - name: ssh-key
    description: Retrieve the ssh identity key path of the specified node
    flags:
      -n, --node=: The node to get ssh-key path. Defaults to the primary control plane.
    documentation:
      command: Retrieve the ssh identity key path of the specified node, and writes it to STDOUT.
  - name: start
    description: Starts a local Kubernetes cluster
    flags:
      --addons=*: Enable one or more addons, in a comma-separated format. See `minikube addons list` for a list of valid addon names.
      --apiserver-ips=*: A set of apiserver IP Addresses which are used in the generated certificate for kubernetes.  This can be used if you want to make the apiserver available from outside the machine
      --apiserver-name=:
        description: The authoritative apiserver hostname for apiserver certificates and connectivity. This can be used if you want to make the apiserver available from outside the machine
        default: minikubeCA
      --apiserver-names=*: A set of apiserver names which are used in the generated certificate for kubernetes.  This can be used if you want to make the apiserver available from outside the machine
      --apiserver-port=:
        description: The apiserver listening port
        default: "8443"
      --auto-pause-interval=:
        description: Duration of inactivity before the minikube VM is paused (default 1m0s)
        default: 1m0s
      --auto-update-drivers:
        description: If set, automatically updates drivers to the latest version. Defaults to true.
        default: "true"
      --base-image=:
        description: The base image to use for docker/podman drivers. Intended for local development.
        default: gcr.io/k8s-minikube/kicbase:v0.0.51@sha256:4a1c825b61479e6c898851ea66f13c620aaeab6002746e95067fc2c4b38a0b24
      --binary-mirror=: Location to fetch kubectl, kubelet, & kubeadm binaries from.
      --cache-images:
        description: If true, cache docker images for the current bootstrapper and load them into the machine. Always false with --driver=none.
        default: "true"
      --cert-expiration=:
        description: Duration until minikube certificate expiration, defaults to three years (26280h).
        default: 26280h0m0s
      --cni=: 'CNI plug-in to use. Valid options: auto, bridge, calico, cilium, flannel, kindnet, or path to a CNI manifest (default: auto)'
      --cpus=:
        description: Number of CPUs allocated to Kubernetes. Use "max" to use the maximum number of CPUs. Use "no-limit" to not specify a limit (Docker/Podman only)
        default: "2"
      --cri-socket=: The cri socket path to be used.
      --delete-on-failure: If set, delete the current cluster if start fails and try again. Defaults to false.
      --disable-coredns-log: If set, disable CoreDNS verbose logging. Defaults to false.
      --disable-driver-mounts: Disables the filesystem mounts provided by the hypervisors
      --disable-metrics: If set, disables metrics reporting (CPU and memory usage), this can improve CPU usage. Defaults to false.
      --disable-optimizations: If set, disables optimizations that are set for local Kubernetes. Including decreasing CoreDNS replicas from 2 to 1. Defaults to false.
      --disk-size=:
        description: 'Disk size allocated to the minikube VM (format: <number>[<unit>], where unit = b, k, m or g).'
        default: 20000mb
      --dns-domain=:
        description: The cluster dns domain name used in the Kubernetes cluster
        default: cluster.local
      --dns-proxy: Enable proxy for NAT DNS requests (virtualbox driver only)
      --dns-servers=*: Static DNS server IP addresses for the VM (VM drivers only)
      --docker-env=*: 'Environment variables to pass to the Docker daemon. (format: key=value)'
      --docker-opt=*: 'Specify arbitrary flags to pass to the Docker daemon. (format: key=value)'
      --download-only: If true, only download and cache files for later use - don't install or start anything.
      --dry-run: dry-run mode. Validates configuration, but does not mutate system state
      --embed-certs: if true, will embed the certs in kubeconfig.
      --enable-default-cni&: 'DEPRECATED: Replaced by --cni=bridge'
      --extra-config=: |-
        A set of key=value pairs that describe configuration that may be passed to different components.
        		The key should be '.' separated, and the first part before the dot is the component to apply the configuration to.
        		Valid components are: kubelet, kubeadm, apiserver, controller-manager, etcd, proxy, scheduler
        		Valid kubeadm parameters: ignore-preflight-errors, dry-run, kubeconfig, kubeconfig-dir, node-name, cri-socket, experimental-upload-certs, certificate-key, rootfs, skip-phases, pod-network-cidr
      --extra-disks=: Number of extra disks created and attached to the minikube VM (currently only implemented for hyperkit, kvm2, qemu2, vfkit, and krunkit drivers)
      --feature-gates=: A set of key=value pairs that describe feature gates for alpha/experimental features.
      --force: Force minikube to perform possibly dangerous operations
      --force-systemd: If set, force the container runtime to use systemd as cgroup manager. Defaults to false.
      --ha: Create Highly Available Multi-Control Plane Cluster with a minimum of three control-plane nodes that will also be marked for work.
      --host-dns-resolver:
        description: Enable host resolver for NAT DNS requests (virtualbox driver only)
        default: "true"
      --host-only-cidr=:
        description: The CIDR to be used for the minikube VM (virtualbox driver only)
        default: 192.168.59.1/24
      --host-only-nic-type=:
        description: NIC Type used for host only network. One of Am79C970A, Am79C973, 82540EM, 82543GC, 82545EM, or virtio (virtualbox driver only)
        default: virtio
      --hyperkit-vpnkit-sock=: Location of the VPNKit socket used for networking. If empty, disables Hyperkit VPNKitSock, if 'auto' uses Docker for Mac VPNKit connection, otherwise uses the specified VSock (hyperkit driver only)
      --hyperkit-vsock-ports=*: List of guest VSock ports that should be exposed as sockets on the host (hyperkit driver only)
      --hyperv-external-adapter=: External Adapter on which external switch will be created if no external switch is found. (hyperv driver only)
      --hyperv-use-external-switch: Whether to use external switch over Default Switch if virtual switch not explicitly specified. (hyperv driver only)
      --hyperv-virtual-switch=: The hyperv virtual switch name. Defaults to first found. (hyperv driver only)
      --image-mirror-country=: Country code of the image mirror to be used. Leave empty to use the global one. For Chinese mainland users, set it to cn.
      --image-repository=: Alternative image repository to pull docker images from. This can be used when you have limited access to gcr.io. Set it to "auto" to let minikube decide one for you. For Chinese mainland users, you may use local gcr.io mirrors such as registry.cn-hangzhou.aliyuncs.com/google_containers
      --insecure-registry=*: Insecure Docker registries to pass to the Docker daemon.  The default service CIDR range will automatically be added.
      --install-addons:
        description: If set, install addons. Defaults to true.
        default: "true"
      --interactive:
        description: Allow user prompts for more information
        default: "true"
      --iso-url=*:
        description: Locations to fetch the minikube ISO from.
        default: '[https://storage.googleapis.com/minikube/iso/minikube-v0.0.0-unset-amd64.iso,https://github.com/kubernetes/minikube/releases/download/v0.0.0-unset/minikube-v0.0.0-unset-amd64.iso,https://kubernetes.oss-cn-hangzhou.aliyuncs.com/minikube/iso/minikube-v0.0.0-unset-amd64.iso]'
      --keep-context: This will keep the existing kubectl context and will create a minikube context.
      --kubernetes-version=: 'The Kubernetes version that the minikube VM will use (ex: v1.2.3, ''stable'' for v1.37.0, ''latest'' for v1.37.0). Defaults to ''stable''.'
      --kvm-gpu: Enable experimental NVIDIA GPU support in minikube
      --kvm-hidden: Hide the hypervisor signature from the guest in minikube (kvm2 driver only)
      --kvm-network=:
        description: The KVM default network name. (kvm2 driver only)
        default: default
      --kvm-numa-count=:
        description: Simulate numa node count in minikube, supported numa node count range is 1-8 (kvm2 driver only)
        default: "1"
      --kvm-qemu-uri=:
        description: The KVM QEMU connection URI. (kvm2 driver only)
        default: qemu:///system
      --listen-address=: IP Address to use to expose ports (docker and podman driver only)
      --mdns: Enable mDNS (.local address resolution) by configuring systemd-resolved inside the node (VM drivers only)
      --mount: Kept for backward compatibility, value is ignored.
      --mount-9p-version=:
        description: Specify the 9p version that the mount should use
        default: 9p2000.L
      --mount-gid=:
        description: Default group id used for the mount
        default: docker
      --mount-ip=: Specify the ip that the mount should be setup on
      --mount-msize=:
        description: The number of bytes to use for 9p packet payload
        default: "262144"
      --mount-options=*: Additional mount options, such as cache=fscache
      --mount-port=: Specify the port that the mount should be setup on, where 0 means any free port.
      --mount-string=: Directory to mount in the guest using format '/host-path:/guest-path'.
      --mount-type=:
        description: 'Specify the mount filesystem type (supported types: 9p)'
        default: 9p
      --mount-uid=:
        description: Default user id used for the mount
        default: docker
      --namespace=:
        description: The named space to activate after start
        default: default
      --nat-nic-type=:
        description: NIC Type used for nat network. One of Am79C970A, Am79C973, 82540EM, 82543GC, 82545EM, or virtio (virtualbox driver only)
        default: virtio
      --native-ssh:
        description: Use native Golang SSH client (default true). Set to 'false' to use the command line 'ssh' command when accessing the docker machine. Useful for the machine drivers when they will not start with 'Waiting for SSH'.
        default: "true"
      --network-plugin=&: 'DEPRECATED: Replaced by --cni'
      --network=: network to run minikube with. Used by docker/podman, qemu, kvm, and vfkit drivers. If left empty, minikube will create a new network.
      --nfs-share=*: Local folders to share with Guest via NFS mounts (hyperkit driver only)
      --nfs-shares-root=:
        description: Where to root the NFS Shares, defaults to /nfsshares (hyperkit driver only)
        default: /nfsshares
      --no-kubernetes: If set, minikube VM/container will start without starting or configuring Kubernetes. (only works on new clusters)
      --no-vtx-check: Disable checking for the availability of hardware virtualization before the vm is started (virtualbox driver only)
      --ports=*: List of ports that should be exposed (docker and podman driver only)
      --preload:
        description: If set, download tarball of preloaded images if available to improve start time. Defaults to true.
        default: "true"
      --preload-source=:
        description: 'Which source to download the preload from (valid options: gcs, github, auto). Defaults to auto (try github first, then gcs as failover).'
        default: auto
      --qemu-firmware-path=: 'Path to the qemu firmware file. Defaults: For Linux, the default firmware location. For macOS, the brew installation location. For Windows, C:\Program Files\qemu\share'
      --registry-mirror=*: Registry mirrors to pass to the Docker daemon
      --rosetta: Enable Rosetta to support apps built for Intel processor on a Mac with Apple silicon (vfkit driver only)
      --service-cluster-ip-range=:
        description: The CIDR to be used for service cluster IPs.
        default: 10.96.0.0/12
      --socket-vmnet-client-path=: Path to the socket vmnet client binary (QEMU driver only)
      --socket-vmnet-path=: Path to socket vmnet binary (QEMU driver only)
      --ssh-ip-address=: IP address (ssh driver only)
      --ssh-key=: SSH key (ssh driver only)
      --ssh-port=:
        description: SSH port (ssh driver only)
        default: "22"
      --ssh-user=:
        description: SSH user (ssh driver only)
        default: root
      --static-ip=: 'Set a static IP for the minikube cluster, the IP must be: private, IPv4, and the last octet must be between 2 and 254, for example 192.168.200.200 (Docker and Podman drivers only)'
      --subnet=: Subnet to be used on kic cluster. If left empty, minikube will choose subnet address, beginning from 192.168.49.0. (docker and podman driver only)
      --trace=: 'Send trace events. Options include: [gcp]'
      --uuid=: Provide VM UUID to restore MAC address (hyperkit driver only)
      --vm: Filter to use only VM Drivers
      --vm-driver=&: DEPRECATED, use `driver` instead.
      --vmnet-offloading: Enable vmnet checksum and TSO offloading. See krunkit driver documentation for known limitations (krunkit driver only)
      --wait-timeout=:
        description: max time to wait per Kubernetes or host to be healthy.
        default: 6m0s
      --wait=*:
        description: 'comma separated list of Kubernetes components to verify and wait for after starting a cluster. defaults to "apiserver,system_pods", available options: "apiserver,system_pods,default_sa,apps_running,node_ready,kubelet,extra" . other acceptable values are ''all'' or ''none'', ''true'' and ''false'''
        default: '[apiserver,system_pods]'
      -c, --container-runtime=: 'The container runtime to be used. Valid options: docker, cri-o, containerd (default: auto)'
      -d, --driver=: 'Driver is one of: virtualbox, kvm2, qemu2, qemu, vmware, none, docker, podman, ssh (defaults to auto-detect)'
      -g, --gpus=: 'Allow pods to use your GPUs. Options include: [all,nvidia,amd] (Docker driver with Docker container-runtime only)'
      -m, --memory=: 'Amount of RAM to allocate to Kubernetes (format: <number>[<unit>], where unit = b, k, m or g). Use "max" to use the maximum amount of memory. Use "no-limit" to not specify a limit (Docker/Podman only)'
      -n, --nodes=:
        description: The total number of nodes to spin up. Defaults to 1.
        default: "1"
      -o, --output=:
        description: 'Format to print stdout in. Options include: [text,json]'
        default: text
    documentation:
      command: Starts a local Kubernetes cluster
  - name: status
    description: Gets the status of a local Kubernetes cluster
    flags:
      -f, --format=:
        description: |-
          Go template format string for the status output.  The format for Go templates can be found here: https://pkg.go.dev/text/template
          For the list accessible variables for the template, see the struct values here: https://pkg.go.dev/k8s.io/minikube/cmd/minikube/cmd#Status
        default: |+
          {{.Name}}
          type: Control Plane
          host: {{.Host}}
          kubelet: {{.Kubelet}}
          apiserver: {{.APIServer}}
          kubeconfig: {{.Kubeconfig}}
          {{- if .TimeToStop }}
          timeToStop: {{.TimeToStop}}
          {{- end }}
          {{- if .DockerEnv }}
          docker-env: {{.DockerEnv}}
          {{- end }}
          {{- if .PodManEnv }}
          podman-env: {{.PodManEnv}}
          {{- end }}

      -l, --layout=:
        description: 'output layout (EXPERIMENTAL, JSON only): ''nodes'' or ''cluster'''
        default: nodes
      -n, --node=: The node to check status for. Defaults to control plane. Leave blank with default format for status on all nodes.
      -o, --output=:
        description: minikube status --output OUTPUT. json, text
        default: text
      -w, --watch?:
        description: Continuously listing/getting the status with optional interval duration.
        default: 1s
    documentation:
      command: |-
        Gets the status of a local Kubernetes cluster.
        	Exit status contains the status of minikube's VM, cluster and Kubernetes encoded on it's bits in this order from right to left.
        	Eg: 7 meaning: 1 (for minikube NOK) + 2 (for cluster NOK) + 4 (for Kubernetes NOK)
  - name: stop
    description: Stops a running local Kubernetes cluster
    flags:
      --all: Set flag to stop all profiles (clusters)
      --cancel-scheduled: cancel any existing scheduled stop requests
      --keep-context-active: keep the kube-context active after cluster is stopped. Defaults to false.
      --schedule=: Set flag to stop cluster after a set amount of time (e.g. --schedule=5m)
      -o, --output=:
        description: 'Format to print stdout in. Options include: [text,json]'
        default: text
    documentation:
      command: Stops a local Kubernetes cluster. This command stops the underlying VM or container, but keeps user data intact. The cluster can be started again with the "start" command.
  - name: tunnel
    description: Connect to LoadBalancer services
    flags:
      --bind-address=: set tunnel bind address, empty or '*' indicates the tunnel should be available for all interfaces
      -c, --cleanup:
        description: call with cleanup=true to remove old tunnels
        default: "true"
    documentation:
      command: tunnel creates a route to services deployed with type LoadBalancer and sets their Ingress to their ClusterIP. For a detailed example see https://minikube.sigs.k8s.io/docs/handbook/accessing
  - name: unpause
    aliases:
      - resume
    description: unpause Kubernetes
    flags:
      -A, --all-namespaces: If set, unpause all namespaces
      -n, --namespaces=*:
        description: namespaces to unpause
        default: '[kube-system,kubernetes-dashboard,istio-operator]'
      -o, --output=:
        description: 'Format to print stdout in. Options include: [text,json]'
        default: text
  - name: update-check
    description: Print current and latest version number
    documentation:
      command: Print current and latest version number
  - name: update-context
    description: Update kubeconfig in case of an IP or port change
    documentation:
      command: |-
        Retrieves the IP address of the running cluster, checks it
        			with IP in kubeconfig, and corrects kubeconfig if incorrect.
  - name: version
    description: Print the version of minikube
    flags:
      --components: list versions of all components included with minikube. (the cluster must be running)
      --short: Print just the version number.
      -o, --output=: One of 'yaml' or 'json'.
    documentation:
      command: Print the version of minikube.
documentation:
  command: minikube provisions and manages local Kubernetes clusters optimized for development workflows.
