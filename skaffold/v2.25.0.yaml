# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: skaffold
persistentflags:
  --color=:
    description: Specify the default output color in ANSI escape codes
    default: "34"
  --force-colors&: Always print color codes (hidden)
  --interactive:
    description: Allow user prompts for more information
    default: "true"
  --timestamps: Print timestamps in logs
  --update-check:
    description: Check for a more recent version of Skaffold
    default: "true"
  -v, --verbosity=:
    description: 'Log level: one of [panic fatal error warning info debug trace]'
    default: warning
commands:
  - name: apply
    description: Apply hydrated manifests to a cluster
    flags:
      --assume-yes: If true, skaffold will skip yes/no confirmation from the user and default to yes
      --cloud-run-location=: The GCP Region to deploy Cloud Run services to
      --cloud-run-project=: The GCP Project ID or Project Number to deploy for Cloud Run
      --enable-rpc&: Enable gRPC or HTTP APIs for exposing Skaffold events
      --event-log-file=&: Save Skaffold events to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port
      --fast-fail-status-check&:
        description: Configures `status-check` to fail immediately if any error occurs.  Otherwise `status-check` will attempt to check all resources once and only then report errors and possibly exit.  Defaults to 'true'
        default: "true"
      --force: 'Recreate Kubernetes resources if necessary for deployment, warning: might cause downtime!'
      --inventory-id=&: The inventory name, default to `.kpt-pipeline`
      --inventory-name=&: Inventory identifier.
      --inventory-namespace=&: The namespace for the ResourceGroup resource that contains the inventory
      --iterative-status-check:
        description: Run `status-check` iteratively after each deploy step, instead of all-together at the end of all deploys (default).
        default: "true"
      --kube-context=: Deploy to this Kubernetes context
      --kubeconfig=: Path to the kubeconfig file to use for CLI requests.
      --last-log-file=&: Save Skaffold output to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port (defaults to $HOME/.skaffold/repos)
      --remote-cache-dir=: Specify the location of the remote cache (default $HOME/.skaffold/remote-cache)
      --rpc-http-port=: tcp port to expose the Skaffold API over HTTP REST
      --rpc-port=: tcp port to expose the Skaffold API over gRPC
      --status-check: Wait for deployed resources to stabilize
      --status-check-selectors=: |-
        File containing resource selectors for kubernetes resources status check. A sample file looks like the following:
        {
          "selectors":[
            {
              "group":"my.domain",
              "kind":"MyCRD"
            }
            ]
        }
        The values of "group" and "kind" are regular expressions.
      --sync-remote-cache=:
        description: Controls how Skaffold manages the remote config cache (see `remote-cache-dir`). One of `always` (default), `missing`, or `never`. `always` syncs remote repositories to latest on access. `missing` only clones remote repositories if they do not exist locally. `never` means the user takes responsibility for updating remote repositories.
        default: always
      --tail: Stream logs from deployed objects
      --tolerate-failures-until-deadline: Configures `status-check` to tolerate failures until Skaffold's statusCheckDeadline duration or the deployments progressDeadlineSeconds  Otherwise deployment failures skaffold encounters will immediately fail the deployment.  Defaults to 'false'
      --wait-for-connection: Blocks ending execution of skaffold until the /v2/events gRPC/HTTP endpoint is hit
      -c, --config=: File for global configurations (defaults to $HOME/.skaffold/config)
      -f, --filename=:
        description: Path or URL to the Skaffold config file
        default: skaffold.yaml
      -l, --label=*: Add custom labels to deployed objects. Set multiple times for multiple labels
      -m, --module=*: Filter Skaffold configs to only the provided named modules
      -n, --namespace=: Runs deployments in the specified namespace. When used with 'render' command, renders manifests contain the namespace
      -p, --profile=*: Activate profiles by name (prefixed with `-` to disable a profile)
      -u, --user=&: ""
  - name: build
    description: Build the artifacts
    flags:
      --assume-yes: If true, skaffold will skip yes/no confirmation from the user and default to yes
      --build-concurrency=:
        description: Number of concurrently running builds. Set to 0 to run all builds in parallel. Doesn't violate build order among dependencies.
        default: "-1"
      --cache-artifacts:
        description: Set to false to disable default caching of artifacts
        default: "true"
      --cache-file=: Specify the location of the cache file (default $HOME/.skaffold/cache)
      --check-cluster-node-platforms: When set to true, images are built for the target platforms matching the active kubernetes cluster node platforms. Enabled by default for `dev`, `debug` and `run`
      --detect-minikube:
        description: Use heuristics to detect a minikube cluster
        default: "true"
      --disable-multi-platform-build: When set to true, forces only single platform image builds even when multiple target platforms are specified. Enabled by default for `dev` and `debug` modes, to keep dev-loop fast
      --dry-run: Don't build images, just compute the tag for each artifact.
      --enable-rpc&: Enable gRPC or HTTP APIs for exposing Skaffold events
      --event-log-file=&: Save Skaffold events to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port
      --file-output=: Filename to write build images to
      --insecure-registry=*: Target registries for built images which are not secure
      --kube-context=: Deploy to this Kubernetes context
      --kubeconfig=: Path to the kubeconfig file to use for CLI requests.
      --last-log-file=&: Save Skaffold output to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port (defaults to $HOME/.skaffold/repos)
      --minikube-profile=&: forces skaffold use the given minikube-profile and forces building against the docker daemon inside that minikube profile
      --mute-logs=*: mute logs for specified stages in pipeline (build, deploy, status-check, none, all)
      --platform=*: The platform to target for the build artifacts
      --profile-auto-activation:
        description: Set to false to disable profile auto activation
        default: "true"
      --propagate-profiles:
        description: Setting '--propagate-profiles=false' disables propagating profiles set by the '--profile' flag across config dependencies. This mean that only profiles defined directly in the target 'skaffold.yaml' file are activated.
        default: "true"
      --push: Push the built images to the specified image repository.
      --remote-cache-dir=: Specify the location of the remote cache (default $HOME/.skaffold/remote-cache)
      --rpc-http-port=: tcp port to expose the Skaffold API over HTTP REST
      --rpc-port=: tcp port to expose the Skaffold API over gRPC
      --skip-tests: Whether to skip the tests after building
      --sync-remote-cache=:
        description: Controls how Skaffold manages the remote config cache (see `remote-cache-dir`). One of `always` (default), `missing`, or `never`. `always` syncs remote repositories to latest on access. `missing` only clones remote repositories if they do not exist locally. `never` means the user takes responsibility for updating remote repositories.
        default: always
      --toot: Emit a terminal beep after the deploy is complete
      --wait-for-connection: Blocks ending execution of skaffold until the /v2/events gRPC/HTTP endpoint is hit
      -b, --build-image=*: Only build artifacts with image names that contain the given substring. Default is to build sources for all artifacts
      -c, --config=: File for global configurations (defaults to $HOME/.skaffold/config)
      -d, --default-repo=: Default repository value (overrides global config)
      -f, --filename=:
        description: Path or URL to the Skaffold config file
        default: skaffold.yaml
      -m, --module=*: Filter Skaffold configs to only the provided named modules
      -n, --namespace=: Runs deployments in the specified namespace. When used with 'render' command, renders manifests contain the namespace
      -o, --output=:
        description: Used in conjunction with --quiet flag. Format output with go-template. For full struct documentation, see https://godoc.org/github.com/GoogleContainerTools/skaffold/v2/cmd/skaffold/app/flags#BuildOutput
        default: '{{json .}}'
      -p, --profile=*: Activate profiles by name (prefixed with `-` to disable a profile)
      -q, --quiet: Suppress the build output and print image built on success. See --output to format output.
      -t, --tag=: The optional custom tag to use for images which overrides the current Tagger configuration
      -u, --user=&: ""
    documentation:
      command: Build, test and tag the artifacts
  - name: completion SHELL
    description: Output shell completion for the given shell (bash, fish or zsh)
    documentation:
      command: |2

        	Outputs shell completion for the given shell (bash, fish or zsh)

        	This depends on the bash-completion binary.  Example installation instructions:
        	OS X:
        		$ brew install bash-completion
        		$ source $(brew --prefix)/etc/bash_completion
        		$ skaffold completion bash > ~/.skaffold-completion  # for bash users
        		$ skaffold completion fish > ~/.skaffold-completion  # for fish users
        		$ skaffold completion zsh > ~/.skaffold-completion   # for zsh users
        		$ source ~/.skaffold-completion
        	Ubuntu:
        		$ apt-get install bash-completion
        		$ source /etc/bash-completion
        		$ source <(skaffold completion bash) # for bash users
        		$ skaffold completion fish | source  # for fish users
        		$ source <(skaffold completion zsh)  # for zsh users

        	Additionally, you may want to output the completion to a file and source in your .bashrc
  - name: config
    description: Interact with the global Skaffold config file (defaults to `$HOME/.skaffold/config`)
    commands:
      - name: list
        description: List all values set in the global Skaffold config
        flags:
          -a, --all: Show values for all kubecontexts
          -c, --config=: Path to Skaffold config
          -k, --kube-context=: Kubectl context to set values against
      - name: set
        description: Set a value in the global Skaffold config
        flags:
          -c, --config=: Path to Skaffold config
          -g, --global: Set value for global config
          -i, --id=&: Set value for given survey config
          -k, --kube-context=: Kubectl context to set values against
          -s, --survey&: Set value for skaffold survey config
      - name: unset
        description: Unset a value in the global Skaffold config
        flags:
          -c, --config=: Path to Skaffold config
          -g, --global: Set value for global config
          -i, --id=&: Set value for given survey config
          -k, --kube-context=: Kubectl context to set values against
          -s, --survey&: Set value for skaffold survey config
  - name: credits
    description: Export third party notices to given path (./skaffold-credits by default)
    hidden: true
    flags:
      -d, --dir=:
        description: destination directory to place third party licenses
        default: ./skaffold-credits
  - name: debug
    description: Run a pipeline in debug mode
    flags:
      --assume-yes: If true, skaffold will skip yes/no confirmation from the user and default to yes
      --auto: Run with an auto-generated skaffold configuration. This will create a temporary `skaffold.yaml` file and kubernetes manifests necessary to run the application
      --auto-build: When set to false, builds wait for API request instead of running automatically
      --auto-create-config:
        description: If true, skaffold will try to create a config for the user's run if it doesn't find one
        default: "true"
      --auto-deploy: When set to false, deploys wait for API request instead of running automatically
      --auto-sync: When set to false, syncs wait for API request instead of running automatically
      --build-concurrency=:
        description: Number of concurrently running builds. Set to 0 to run all builds in parallel. Doesn't violate build order among dependencies.
        default: "-1"
      --cache-artifacts:
        description: Set to false to disable default caching of artifacts
        default: "true"
      --cache-file=: Specify the location of the cache file (default $HOME/.skaffold/cache)
      --check-cluster-node-platforms:
        description: When set to true, images are built for the target platforms matching the active kubernetes cluster node platforms. Enabled by default for `dev`, `debug` and `run`
        default: "true"
      --cleanup:
        description: Delete deployments after dev or debug mode is interrupted
        default: "true"
      --cloud-run-location=: The GCP Region to deploy Cloud Run services to
      --cloud-run-project=: The GCP Project ID or Project Number to deploy for Cloud Run
      --detect-minikube:
        description: Use heuristics to detect a minikube cluster
        default: "true"
      --disable-multi-platform-build:
        description: When set to true, forces only single platform image builds even when multiple target platforms are specified. Enabled by default for `dev` and `debug` modes, to keep dev-loop fast
        default: "true"
      --enable-gke-arm-node-toleration&:
        description: Setting this flag provides the appropriate toleration for Pods to be scheduled on GKE ARM nodes that are tainted to disallow workloads by default.
        default: "true"
      --enable-platform-node-affinity:
        description: If true, when deploying to a mixed node cluster, skaffold will add platform (os/arch) node affinity definition to rendered manifests based on the image platforms
        default: "true"
      --enable-rpc&: Enable gRPC or HTTP APIs for exposing Skaffold events
      --event-log-file=&: Save Skaffold events to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port
      --fast-fail-status-check&:
        description: Configures `status-check` to fail immediately if any error occurs.  Otherwise `status-check` will attempt to check all resources once and only then report errors and possibly exit.  Defaults to 'true'
        default: "true"
      --force: 'Recreate Kubernetes resources if necessary for deployment, warning: might cause downtime!'
      --hydration-dir=:
        description: The directory to where the (kpt) hydration takes place. Default to a hidden directory .kpt-pipeline.
        default: .kpt-pipeline
      --insecure-registry=*: Target registries for built images which are not secure
      --iterative-status-check:
        description: Run `status-check` iteratively after each deploy step, instead of all-together at the end of all deploys (default).
        default: "true"
      --keep-running-on-failure: 'If true, the session will be suspended instead of ending if any errors occur, the user can fix the errors during the session suspension, the session can be restored and continued by pressing any key. '
      --kube-context=: Deploy to this Kubernetes context
      --kubeconfig=: Path to the kubeconfig file to use for CLI requests.
      --last-log-file=&: Save Skaffold output to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port (defaults to $HOME/.skaffold/repos)
      --minikube-profile=&: forces skaffold use the given minikube-profile and forces building against the docker daemon inside that minikube profile
      --mute-logs=*: mute logs for specified stages in pipeline (build, deploy, status-check, none, all)
      --no-prune: Skip removing images and containers built by Skaffold during cleanup after dev or debug mode
      --no-prune-children: Skip removing layers reused by Skaffold
      --platform=*: The platform to target for the build artifacts
      --port-forward?*:
        description: Port-forward exposes service ports and container ports within pods and other resources (off, user, services, debug, pods)
        default: user,debug
      --profile-auto-activation:
        description: Set to false to disable profile auto activation
        default: "true"
      --propagate-profiles:
        description: Setting '--propagate-profiles=false' disables propagating profiles set by the '--profile' flag across config dependencies. This mean that only profiles defined directly in the target 'skaffold.yaml' file are activated.
        default: "true"
      --protocols=*: Priority sorted order of debugger protocols to support.
      --remote-cache-dir=: Specify the location of the remote cache (default $HOME/.skaffold/remote-cache)
      --resource-selector-rules-file=: 'Path to JSON file specifying the deny list of yaml objects for skaffold to NOT transform with ''image'' and ''label'' field replacements.  NOTE: this list is additive to skaffold''s default denylist and denylist has priority over allowlist'
      --rpc-http-port=: tcp port to expose the Skaffold API over HTTP REST
      --rpc-port=: tcp port to expose the Skaffold API over gRPC
      --skip-tests: Whether to skip the tests after building
      --status-check: Wait for deployed resources to stabilize
      --status-check-selectors=: |-
        File containing resource selectors for kubernetes resources status check. A sample file looks like the following:
        {
          "selectors":[
            {
              "group":"my.domain",
              "kind":"MyCRD"
            }
            ]
        }
        The values of "group" and "kind" are regular expressions.
      --sync-remote-cache=:
        description: Controls how Skaffold manages the remote config cache (see `remote-cache-dir`). One of `always` (default), `missing`, or `never`. `always` syncs remote repositories to latest on access. `missing` only clones remote repositories if they do not exist locally. `never` means the user takes responsibility for updating remote repositories.
        default: always
      --tail:
        description: Stream logs from deployed objects
        default: "true"
      --tolerate-failures-until-deadline: Configures `status-check` to tolerate failures until Skaffold's statusCheckDeadline duration or the deployments progressDeadlineSeconds  Otherwise deployment failures skaffold encounters will immediately fail the deployment.  Defaults to 'false'
      --toot: Emit a terminal beep after the deploy is complete
      --trigger=:
        description: How is change detection triggered? (polling, notify, or manual)
        default: notify
      --wait-for-connection: Blocks ending execution of skaffold until the /v2/events gRPC/HTTP endpoint is hit
      --wait-for-deletions:
        description: Wait for pending deletions to complete before a deployment
        default: "true"
      --wait-for-deletions-delay=:
        description: Delay between two checks for pending deletions
        default: 2s
      --wait-for-deletions-max=:
        description: Max duration to wait for pending deletions
        default: 1m0s
      -c, --config=: File for global configurations (defaults to $HOME/.skaffold/config)
      -d, --default-repo=: Default repository value (overrides global config)
      -f, --filename=:
        description: Path or URL to the Skaffold config file
        default: skaffold.yaml
      -i, --watch-poll-interval=:
        description: Interval (in ms) between two checks for file changes
        default: "1000"
      -l, --label=*: Add custom labels to deployed objects. Set multiple times for multiple labels
      -m, --module=*: Filter Skaffold configs to only the provided named modules
      -n, --namespace=: Runs deployments in the specified namespace. When used with 'render' command, renders manifests contain the namespace
      -p, --profile=*: Activate profiles by name (prefixed with `-` to disable a profile)
      -t, --tag=: The optional custom tag to use for images which overrides the current Tagger configuration
      -u, --user=&: ""
      -w, --watch-image=*: Choose which artifacts to watch. Artifacts with image names that contain the expression will be watched only. Default is to watch sources for all artifacts
    documentation:
      command: Similar to `dev`, but configures the pipeline for debugging. Auto-build and sync is disabled by default to prevent accidentally tearing down debug sessions.
  - name: delete
    description: Delete any resources deployed by Skaffold
    flags:
      --assume-yes: If true, skaffold will skip yes/no confirmation from the user and default to yes
      --cloud-run-location=: The GCP Region to deploy Cloud Run services to
      --cloud-run-project=: The GCP Project ID or Project Number to deploy for Cloud Run
      --detect-minikube:
        description: Use heuristics to detect a minikube cluster
        default: "true"
      --dry-run: Don't delete resources, just print them.
      --kube-context=: Deploy to this Kubernetes context
      --kubeconfig=: Path to the kubeconfig file to use for CLI requests.
      --profile-auto-activation:
        description: Set to false to disable profile auto activation
        default: "true"
      --propagate-profiles:
        description: Setting '--propagate-profiles=false' disables propagating profiles set by the '--profile' flag across config dependencies. This mean that only profiles defined directly in the target 'skaffold.yaml' file are activated.
        default: "true"
      --remote-cache-dir=: Specify the location of the remote cache (default $HOME/.skaffold/remote-cache)
      --set-value-file=: overrides templated manifest fields by a file containing key-value pairs in .env file format
      --set=*: overrides templated manifest fields by provided key-value pairs
      --sync-remote-cache=:
        description: Controls how Skaffold manages the remote config cache (see `remote-cache-dir`). One of `always` (default), `missing`, or `never`. `always` syncs remote repositories to latest on access. `missing` only clones remote repositories if they do not exist locally. `never` means the user takes responsibility for updating remote repositories.
        default: always
      -c, --config=: File for global configurations (defaults to $HOME/.skaffold/config)
      -d, --default-repo=: Default repository value (overrides global config)
      -f, --filename=:
        description: Path or URL to the Skaffold config file
        default: skaffold.yaml
      -m, --module=*: Filter Skaffold configs to only the provided named modules
      -n, --namespace=: Runs deployments in the specified namespace. When used with 'render' command, renders manifests contain the namespace
      -p, --profile=*: Activate profiles by name (prefixed with `-` to disable a profile)
      -u, --user=&: ""
  - name: deploy
    description: Deploy pre-built artifacts
    flags:
      --assume-yes: If true, skaffold will skip yes/no confirmation from the user and default to yes
      --build-concurrency=:
        description: Number of concurrently running builds. Set to 0 to run all builds in parallel. Doesn't violate build order among dependencies.
        default: "-1"
      --cloud-run-location=: The GCP Region to deploy Cloud Run services to
      --cloud-run-project=: The GCP Project ID or Project Number to deploy for Cloud Run
      --detect-minikube:
        description: Use heuristics to detect a minikube cluster
        default: "true"
      --enable-gke-arm-node-toleration&:
        description: Setting this flag provides the appropriate toleration for Pods to be scheduled on GKE ARM nodes that are tainted to disallow workloads by default.
        default: "true"
      --enable-platform-node-affinity: If true, when deploying to a mixed node cluster, skaffold will add platform (os/arch) node affinity definition to rendered manifests based on the image platforms
      --enable-rpc&: Enable gRPC or HTTP APIs for exposing Skaffold events
      --event-log-file=&: Save Skaffold events to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port
      --fast-fail-status-check&:
        description: Configures `status-check` to fail immediately if any error occurs.  Otherwise `status-check` will attempt to check all resources once and only then report errors and possibly exit.  Defaults to 'true'
        default: "true"
      --force: 'Recreate Kubernetes resources if necessary for deployment, warning: might cause downtime!'
      --hydration-dir=:
        description: The directory to where the (kpt) hydration takes place. Default to a hidden directory .kpt-pipeline.
        default: .kpt-pipeline
      --iterative-status-check:
        description: Run `status-check` iteratively after each deploy step, instead of all-together at the end of all deploys (default).
        default: "true"
      --kube-context=: Deploy to this Kubernetes context
      --kubeconfig=: Path to the kubeconfig file to use for CLI requests.
      --last-log-file=&: Save Skaffold output to the provided file after skaffold has finished executing, requires --rpc-port or --rpc-http-port (defaults to $HOME/.skaffold/repos)
      --load-images: If true, skaffold will force load the container images into the local cluster.
      --mute-logs=*: mute logs for specified stages in pipeline (build, deploy, status-check, none, all)
      --port-forward?*:
        description: Port-forward exposes service ports and container ports within pods and other resources (off, user, services, debug, pods)
        default: "off"
      --profile-auto-activation:
        description: Set to false to disable profile auto activation
        default: "true"
      --propagate-profiles:
        description: Setting '--propagate-profiles=false' disables propagating profiles set by the '--profile' flag across config dependencies. This mean that only profiles defined directly in the target 'skaffold.yaml' file are activated.
        default: "true"
      --remote-cache-dir=: Specify the location of the remote cache (default $HOME/.skaffold/remote-cache)
      --resource-selector-rules-file=: 'Path to JSON file specifying the deny list of yaml objects for skaffold to NOT transform with ''image'' and ''label'' field replacements.  NOTE: this list is additive to skaffold''s default denylist and denylist has priority over allowlist'
      --rpc-http-port=: tcp port to expose the Skaffold API over HTTP REST
      --rpc-port=: tcp port to expose the Skaffold API over gRPC
      --status-check: Wait for deployed resources to stabilize
      --status-check-selectors=: |-
        File containing resource selectors for kubernetes resources status check. A sample file looks like the following:
        {
          "selectors":[
            {
              "group":"my.domain",
              "kind":"MyCRD"
            }
            ]
        }
        The values of "group" and "kind" are regular expressions.
      --sync-remote-cache=:
        description: Controls how Skaffold manages the remote config cache (see `remote-cache-dir`). One of `always` (default), `missing`, or `never`. `always` syncs remote repositories to latest on access. `missing` only clones remote repositories if they do not exist locally. `never` means the user takes responsibility for updating remote repositories.
        default: always
      --tail: Stream logs from deployed objects
      --tolerate-failures-until-deadline: Configures `status-check` to tolerate failures until Skaffold's statusCheckDeadline duration or the deployments progressDeadlineSeconds  Otherwise deployment failures skaffold encounters will immediately fail the deployment.  Defaults to 'false'
      --toot: Emit a terminal beep after the deploy is complete
      --wait-for-connection: Blocks ending execution of skaffold until the /v2/events gRPC/HTTP endpoint is hit
      --wait-for-deletions:
        description: Wait for pending deletions to complete before a deployment
        default: "true"
      --wait-for-deletions-delay=:
        description: Delay between two checks for pending deletions
        default: 2s
      --wait-for-deletions-max=:
        description: Max duration to wait for pending deletions
        default: 1m0s
      -a, --build-artifacts=: |-
        File containing pre-built images to use instead of rebuilding artifacts. A sample file looks like the following:
        {
          "builds":[
            {
              "imageName":"registry/image1",
              "tag":"registry/image1:tag"
            },{
              "imageName":"registry/image2",
              "tag":"registry/image2:tag"
            }]
        }
        The build result from a previous 'skaffold build --file-output' run can be used here
      -c, --config=: File for global configurations (defaults to $HOME/.skaffold/config)
      -d, --default-repo=: Default repository value (overrides global config)
      -f, --filename=:
        description: Path or URL to the Skaffold config file
        default: skaffold.yaml
      -i, --images=: A list of pre-built images to deploy, either tagged images or NAME=TAG pairs
      -l, --label=*: Add custom labels to deployed objects. Set multiple times for multiple labels
      -m, --module=*: Filter Skaffold configs to only the provided named modules
      -n, --namespace=: Runs deployments in the specified namespace. When used with 'render' command, renders manifests contain the namespace
      -p, --profile=*: Activate profiles by name (prefixed with `-` to disable a profile)
      -t, --tag=: The optional custom tag to use for images which overrides the current Tagger configuration
      -u, --user=&: ""
  - name: dev
    description: Run a pipeline in development mode
    flags:
      --assume-yes: If true, skaffold will skip yes/no confirmation from the user and default to yes
      --auto: Run with an auto-generated skaffold configuration. This will create a temporary `skaffold.yaml` file and kubernetes manifests necessary to run the application
