# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: yt-dlp
flags:
    --S-force: 'Force user specified sort order to have precedence over all fields, see "Sorting Formats" for more details (Alias: --S-force)'
    --add-chapters: 'Add chapter markers to the video file (Alias: --add-chapters)'
    --add-headers=: Specify a custom HTTP header and its value, separated by a colon ":".
    --add-metadata: Embed metadata to the video file.
    --age-limit=: Download only videos suitable for the given age
    --alias=: Create aliases for an option string.
    --all-formats: SUPPRESSHELP
    --all-subs: SUPPRESSHELP
    --allow-unplayable-formats: SUPPRESSHELP
    --ap-list-mso: List all supported multiple-system operators
    --ap-mso=: Adobe Pass multiple-system operator (TV provider) identifier, use --ap-list-mso for a list of available MSOs
    --ap-password=: Multiple-system operator account password.
    --ap-username=: Multiple-system operator account login
    --audio-format=: Format to convert the audio to when -x is used.
    --audio-multistreams: Allow multiple audio streams to be merged into a single file
    --audio-quality=: Specify ffmpeg audio quality to use when converting the audio with -x.
    --autonumber-size=: SUPPRESSHELP
    --autonumber-start=: SUPPRESSHELP
    --bidi-workaround: Work around terminals that lack bidirectional text support.
    --break-match-filters=: Same as "--match-filters" but stops the download process when a video is rejected
    --break-on-existing: Stop the download process when encountering a file that is in the archive supplied with the --download-archive option
    --break-on-reject: SUPPRESSHELP
    --break-per-input: Alters --max-downloads, --break-on-existing, --break-match-filters, and autonumber to reset per input URL
    --buffer-size=: Size of download buffer, e.g. 1024 or 16K (default is %default)
    --cache-dir=: Location in the filesystem where yt-dlp can store some downloaded information (such as client ids and signatures) permanently.
    --call-home=: SUPPRESSHELP
    --check-all-formats: Check all formats for whether they are actually downloadable
    --check-formats: Make sure formats are selected only from those that are actually downloadable
    --clean-infojson: Remove some internal metadata such as filenames from the infojson (default)
    --client-certificate-key=: Path to private key file for client certificate
    --client-certificate-password=: Password for client certificate private key, if encrypted.
    --client-certificate=: Path to client certificate file in PEM format.
    --cn-verification-proxy=: SUPPRESSHELP
    --color=: Whether to emit color codes in output, optionally prefixed by the STREAM (stdout or stderr) to apply the setting to.
    --compat-options=: Options that can help keep compatibility with youtube-dl or youtube-dlc configurations by reverting some of the changes made in yt-dlp.
    --concat-playlist=: Concatenate videos in a playlist.
    --config-locations=: Location of the main configuration file; either the path to the config or its containing directory ("-" for stdin).
    --console-title: Display progress in console titlebar
    --convert-subtitles=: 'Convert the subtitles to another format (currently supported: ass, lrc, srt, vtt).'
    --convert-thumbnails=: 'Convert the thumbnails to another format (currently supported: jpg, png, webp).'
    --cookies-from-browser=: The name of the browser to load cookies from.
    --cookies=: Netscape formatted file to read cookies from and dump cookie jar in
    --date=: Download only videos uploaded on this date.
    --dateafter=: Download only videos uploaded on or after this date.
    --datebefore=: Download only videos uploaded on or before this date.
    --default-search=: Use this prefix for unqualified URLs.
    --download-archive=: Download only videos not listed in the archive file.
    --download-sections=: Download only chapters that match the regular expression.
    --dump-pages: Print downloaded pages encoded using base64 to debug problems (very verbose)
    --dump-user-agent=: SUPPRESSHELP
    --embed-info-json: Embed the infojson as an attachment to mkv/mka video files
    --embed-subs: Embed subtitles in the video (only for mp4, webm and mkv videos)
    --embed-thumbnail: Embed thumbnail in the video as cover art
    --enable-file-urls: Enable file:// URLs.
    --encoding=: Force the specified encoding (experimental)
    --exec-before-download=: SUPPRESSHELP
    --exec=: Execute a command, optionally prefixed with when to execute it, separated by a ":".
    --external-downloader-args=: Give these arguments to the external downloader.
    --external-downloader=: Name or path of the external downloader to use (optionally) prefixed by the protocols (http, ftp, m3u8, dash, rtmp) to use it for.
    --extractor-args=: Pass ARGS arguments to the IE_KEY extractor.
    --extractor-descriptions: Output descriptions of all supported extractors and exit
    --extractor-retries=: Number of retries for known extractor errors (default is %default), or "infinite"
    --ffmpeg-location=: Location of the ffmpeg binary; either the path to the binary or its containing directory
    --file-access-retries=: Number of times to retry on file access error (default is %default), or "infinite"
    --fixup=: Automatically correct known faults of the file.
    --flat-playlist: Do not extract a playlist's URL result entries; some entry metadata may be missing and downloading may be bypassed
    --force-download-archive: 'Force download archive entries to be written as far as no errors occur, even if -s or another simulation option is used (Alias: --force-download-archive)'
    --force-generic-extractor: SUPPRESSHELP
    --force-keyframes-at-cuts: Force keyframes at cuts when downloading/splitting/removing sections.
    --format-sort-reset: Disregard previous user specified sort order and reset to the default
    --fragment-retries=: Number of retries for a fragment (default is %default), or "infinite" (DASH, hlsnative and ISM)
    --geo-bypass: SUPPRESSHELP
    --geo-bypass-country=: SUPPRESSHELP
    --geo-bypass-ip-block=: SUPPRESSHELP
    --geo-verification-proxy=: Use this proxy to verify the IP address for some geo-restricted sites.
    --get-comments: Retrieve video comments to be placed in the infojson.
    --get-description: SUPPRESSHELP
    --get-duration: SUPPRESSHELP
    --get-filename: SUPPRESSHELP
    --get-format: SUPPRESSHELP
    --get-id: SUPPRESSHELP
    --get-thumbnail: SUPPRESSHELP
    --hls-prefer-ffmpeg: SUPPRESSHELP
    --hls-prefer-native: SUPPRESSHELP
    --hls-split-discontinuity: Split HLS playlists to different formats at discontinuities such as ad breaks
    --hls-use-mpegts: Use the mpegts container for HLS videos; allowing some players to play the video while downloading, and reducing the chance of file corruption if download is interrupted.
    --http-chunk-size=: Size of a chunk for chunk-based HTTP downloading, e.g. 10485760 or 10M (default is disabled).
    --id: SUPPRESSHELP
    --ies=: Extractor names to use separated by commas.
    --ignore-no-formats-error: Ignore "No video formats" error.
    --impersonate=: Client to impersonate for requests.
    --include-ads=: SUPPRESSHELP
    --js-runtimes=: Additional JavaScript runtime to enable, with an optional location for the runtime (either the path to the binary or its containing directory).
    --keep-fragments: Keep downloaded fragments on disk after downloading is finished
    --lazy-playlist: Process entries in the playlist as they are received.
    --legacy-server-connect: Explicitly allow HTTPS connection to servers that do not support RFC 5746 secure renegotiation
    --list-extractors: List all supported extractors and exit
    --list-formats-as-table: SUPPRESSHELP
    --list-impersonate-targets: List available clients to impersonate.
    --list-subs: List available subtitles of each video.
    --list-thumbnails: List available thumbnails of each video.
    --live-from-start: Download livestreams from the start.
    --load-info-json=: JSON file containing the video information (created with the "--write-info-json" option)
    --load-pages: SUPPRESSHELP
    --mark-watched: Mark videos watched (even with --simulate)
    --match-filters=: Generic video filter.
    --match-title=: SUPPRESSHELP
    --max-downloads=: Abort after downloading NUMBER files
    --max-filesize=: Abort download if filesize is larger than SIZE, e.g. 50k or 44.6M
    --max-sleep-interval=: Maximum number of seconds to sleep.
    --max-views=: SUPPRESSHELP
    --merge-output-format=: Containers that may be used when merging formats, separated by "/", e.g. "mp4/mkv".
    --metadata-from-title=: SUPPRESSHELP
    --min-filesize=: Abort download if filesize is smaller than SIZE, e.g. 50k or 44.6M
    --min-sleep-interval=: Number of seconds to sleep before each download.
    --min-views=: SUPPRESSHELP
    --mtime: Use the Last-modified header to set the file modification time
    --netrc-cmd=: Command to execute to get the credentials for an extractor.
    --netrc-location=: Location of .netrc authentication data; either the path or its containing directory.
    --newline: Output progress bar as new lines
    --no-abort-on-error: Continue with next video on download errors; e.g. to skip unavailable videos in a playlist (default)
    --no-abort-on-unavailable-fragments: 'Skip unavailable fragments for DASH, hlsnative and ISM downloads (default) (Alias: --no-abort-on-unavailable-fragments)'
    --no-add-chapters: 'Do not add chapter markers (default) (Alias: --no-add-chapters)'
    --no-add-metadata: 'Do not add metadata to file (default) (Alias: --no-add-metadata)'
    --no-allow-dynamic-mpd: 'Do not process dynamic DASH manifests (Alias: --no-allow-dynamic-mpd)'
    --no-allow-unplayable-formats: SUPPRESSHELP
    --no-audio-multistreams: Only one audio stream is downloaded for each output file (default)
    --no-batch-file: Do not read URLs from batch file (default)
    --no-break-match-filters: Do not use any --break-match-filters (default)
    --no-break-on-existing: Do not stop the download process when encountering a file that is in the archive (default)
    --no-break-per-input: --break-on-existing and similar options terminates the entire download queue
    --no-cache-dir: Disable filesystem caching
    --no-call-home=: SUPPRESSHELP
    --no-check-certificates: Suppress HTTPS certificate validation
    --no-check-formats: Do not check that the formats are actually downloadable
    --no-clean-infojson: Write all fields to the infojson
    --no-colours: SUPPRESSHELP
    --no-config: Don't load any more configuration files except those given to --config-locations.
    --no-config-locations: Do not load any custom configuration files (default).
    --no-continue: Do not resume partially downloaded fragments.
    --no-cookies: Do not read/dump cookies from/to file (default)
    --no-cookies-from-browser: Do not load cookies from browser (default)
    --no-download: 'Do not download the video but write all related files (Alias: --no-download)'
    --no-download-archive: Do not use archive file (default)
    --no-embed-info-json: Do not embed the infojson as an attachment to the video file
    --no-embed-subs: Do not embed subtitles (default)
    --no-embed-thumbnail: Do not embed thumbnail (default)
    --no-exec: Remove any previously defined --exec
    --no-exec-before-download: SUPPRESSHELP
    --no-flat-playlist: Fully extract the videos of a playlist (default)
    --no-force-keyframes-at-cuts: Do not force keyframes around the chapters when cutting/splitting (default)
    --no-force-overwrites: Do not overwrite the video, but overwrite related files (default)
    --no-format-sort-force: Some fields have precedence over the user specified sort order (default)
    --no-geo-bypass: SUPPRESSHELP
    --no-get-comments: 'Do not retrieve video comments unless the extraction is known to be quick (Alias: --no-get-comments)'
    --no-hls-split-discontinuity: Do not split HLS playlists into different formats at discontinuities such as ad breaks (default)
    --no-hls-use-mpegts: Do not use the mpegts container for HLS videos.
    --no-ignore-dynamic-mpd: 'Process dynamic DASH manifests (default) (Alias: --no-ignore-dynamic-mpd)'
    --no-ignore-errors: 'Abort downloading of further videos if an error occurs (Alias: --no-ignore-errors)'
    --no-ignore-no-formats-error: Throw error when no downloadable video formats are found (default)
    --no-include-ads=: SUPPRESSHELP
    --no-js-runtimes: Clear JavaScript runtimes to enable, including defaults and those provided by previous --js-runtimes
    --no-keep-fragments: Delete downloaded fragments after downloading is finished (default)
    --no-keep-video: Delete the intermediate video file after post-processing (default)
    --no-lazy-playlist: Process videos in the playlist only after the entire playlist is parsed (default)
    --no-list-formats-as-table: SUPPRESSHELP
    --no-live-from-start: Download livestreams from the current time (default)
    --no-mark-watched: Do not mark videos watched (default)
    --no-match-filters: Do not use any --match-filters (default)
    --no-mtime: Do not use the Last-modified header to set the file modification time (default)
    --no-part: Do not use .part files - write directly into output file
    --no-playlist: Download only the video, if the URL refers to a video and a playlist
    --no-playlist-reverse: SUPPRESSHELP
    --no-plugin-dirs: Clear plugin directories to search, including defaults and those provided by previous --plugin-dirs
    --no-post-overwrites: Do not overwrite post-processed files
    --no-prefer-avconv=: SUPPRESSHELP
    --no-prefer-ffmpeg=: SUPPRESSHELP
    --no-prefer-free-formats: Don't give any special preference to free containers (default)
    --no-progress: Do not print progress bar
    --no-quiet: Deactivate quiet mode.
    --no-remote-components: Disallow fetching of all remote components, including any previously allowed by --remote-components or defaults.
    --no-remove-chapters: Do not remove any chapters from the file (default)
    --no-resize-buffer: Do not automatically adjust the buffer size
    --no-restrict-filenames: Allow Unicode characters, "&" and spaces in filenames (default)
    --no-simulate: Download the video even if printing/listing options are used
    --no-skip-unavailable-fragments: 'Abort download if a fragment is unavailable (Alias: --no-skip-unavailable-fragments)'
    --no-split-tracks: Do not split video based on chapters (default)
    --no-sponskrub-cut=: SUPPRESSHELP
    --no-sponskrub-force=: SUPPRESSHELP
    --no-sponskrub=: SUPPRESSHELP
    --no-sponsorblock: Disable both --sponsorblock-mark and --sponsorblock-remove
    --no-update: Do not check for updates (default)
    --no-video-multistreams: Only one video stream is downloaded for each output file (default)
    --no-wait-for-video: Do not wait for scheduled streams (default)
    --no-warnings: Ignore warnings
    --no-windows-filenames: Sanitize filenames only minimally
    --no-write-annotations=: SUPPRESSHELP
    --no-write-automatic-subs: 'Do not write auto-generated subtitles (default) (Alias: --no-write-automatic-subs)'
    --no-write-description: Do not write video description (default)
    --no-write-info-json: Do not write video metadata (default)
    --no-write-playlist-metafiles: Do not write playlist metadata when using --write-info-json, --write-description etc.
    --no-write-srt: Do not write subtitle file (default)
    --no-write-thumbnail: Do not write thumbnail image to disk (default)
    --no-youtube-include-dash-manifest=: SUPPRESSHELP
    --no-youtube-include-hls-manifest=: SUPPRESSHELP
    --no-youtube-skip-dash-manifest=: SUPPRESSHELP
    --no-youtube-skip-hls-manifest=: SUPPRESSHELP
    --output-na-placeholder=: 'Placeholder for unavailable fields in --output (default: "%default")'
    --parse-metadata=: Parse additional metadata like title/artist from other fields; see "MODIFYING METADATA" for details.
    --part: Use .part files instead of writing directly into output file (default)
    --playlist-end=: SUPPRESSHELP
    --playlist-random: Download playlist videos in random order
    --playlist-reverse: SUPPRESSHELP
    --playlist-start=: SUPPRESSHELP
    --plugin-dirs=: Path to an additional directory to search for plugins.
    --post-overwrites: Overwrite post-processed files (default)
    --ppa=: Give these arguments to the postprocessors.
    --prefer-avconv=: SUPPRESSHELP
    --prefer-ffmpeg=: SUPPRESSHELP
    --prefer-free-formats: Prefer video formats with free containers over non-free ones of the same quality.
    --prefer-unsecure: Use an unencrypted connection to retrieve information about the video
    --print-json: SUPPRESSHELP
    --print-to-file=: Append given template to the file.
    --print-traffic: Display sent and read HTTP traffic
    --progress: Show progress bar, even if in quiet mode
    --progress-delta=: 'Time between progress output (default: 0)'
    --progress-template=: Template for progress outputs, optionally prefixed with one of "download:" (default), "download-title:" (the console title), "postprocess:",  or "postprocess-title:".
    --proxy=: Use the specified HTTP/HTTPS/SOCKS proxy.
    --recode-video=: Re-encode the video into another format if necessary.
    --referer=: SUPPRESSHELP
    --reject-title=: SUPPRESSHELP
    --remote-components=: Remote components to allow yt-dlp to fetch when required.
    --remove-chapters=: Remove chapters whose title matches the given regular expression.
    --remux-video=: 'Remux the video into another container if necessary (currently supported: avi, flv, gif, mkv, mov, mp4, webm, aac, aiff, alac, flac, m4a, mka, mp3, ogg, opus, vorbis, wav).'
    --replace-in-metadata=: Replace text in a metadata field using the given regex.
    --resize-buffer: The buffer size is automatically resized from an initial value of --buffer-size (default)
    --restrict-filenames: Restrict filenames to only ASCII characters, and avoid "&" and spaces in filenames
    --retry-sleep=: Time to sleep between retries in seconds (optionally) prefixed by the type of retry (http (default), fragment, file_access, extractor) to apply the sleep to.
    --rm-cache-dir: Delete all filesystem cache files
    --skip-playlist-after-errors=: Number of allowed failures until the rest of the playlist is skipped
    --sleep-requests=: Number of seconds to sleep between requests during data extraction
    --sleep-subtitles=: Number of seconds to sleep before each subtitle download
    --socket-timeout=: Time to wait before giving up, in seconds
    --source-address=: Client-side IP address to bind to
    --split-tracks: Split video into multiple files based on internal chapters.
    --sponskrub-args=: SUPPRESSHELP
    --sponskrub-cut=: SUPPRESSHELP
    --sponskrub-force=: SUPPRESSHELP
    --sponskrub-location=: SUPPRESSHELP
    --sponskrub=: SUPPRESSHELP
    --sponsorblock-api=: SponsorBlock API location, defaults to %default
    --sponsorblock-chapter-title=: An output template for the title of the SponsorBlock chapters created by --sponsorblock-mark.
    --sponsorblock-mark=: SponsorBlock categories to create chapters for, separated by commas.
    --sponsorblock-remove=: SponsorBlock categories to be removed from the video file, separated by commas.
    --srt-langs=: Languages of the subtitles to download (can be regex) or "all" separated by commas, e.g. --sub-langs "en.*,ja" (where "en.*" is a regex pattern that matches "en" followed by 0 or more of any character).
    --sub-format=: Subtitle format; accepts formats preference separated by "/", e.g. "srt" or "ass/srt/best"
    --test: SUPPRESSHELP
    --throttled-rate=: Minimum download rate in bytes per second below which throttling is assumed and the video data is re-extracted, e.g. 100K
    --trim-file-names=: Limit the filename length (excluding extension) to the specified number of characters
    --update-to=: Upgrade/downgrade to a specific version.
    --use-postprocessor=: The (case-sensitive) name of plugin postprocessors to be enabled, and (optionally) arguments to be passed to it, separated by a colon ":".
    --user-agent=: SUPPRESSHELP
    --video-multistreams: Allow multiple video streams to be merged into a single file
    --video-password=: Video-specific password
    --wait-for-video=: Wait for scheduled streams to become available.
    --windows-filenames: Force filenames to be Windows-compatible
    --write-all-thumbnails: Write all thumbnail image formats to disk
    --write-annotations=: SUPPRESSHELP
    --write-automatic-subs: 'Write automatically generated subtitle file (Alias: --write-automatic-subs)'
    --write-description: Write video description to a .description file
    --write-desktop-link: Write a .desktop Linux internet shortcut
    --write-info-json: Write video metadata to a .info.json file (this may contain personal information)
    --write-link: Write an internet shortcut file, depending on the current platform (.url, .webloc or .desktop).
    --write-pages: Write downloaded intermediary pages to files in the current directory to debug problems
    --write-playlist-metafiles: Write playlist metadata in addition to the video metadata when using --write-info-json, --write-description etc.
    --write-srt: Write subtitle file
    --write-thumbnail=: Write thumbnail image to disk
    --write-url-link: Write a .url Windows internet shortcut.
    --write-webloc-link: Write a .webloc macOS internet shortcut
    --xattr: Write metadata to the video file's xattrs (using Dublin Core and XDG standards)
    --xattr-set-filesize=: SUPPRESSHELP
    --xff=: How to fake X-Forwarded-For HTTP header to try bypassing geographic restriction.
    --yes-overwrites: Overwrite all video and metadata files.
    --yes-playlist: Download the playlist, if the URL refers to a video and a playlist
    --youtube-include-dash-manifest=: SUPPRESSHELP
    --youtube-include-hls-manifest=: SUPPRESSHELP
    --youtube-print-sig-code=: SUPPRESSHELP
    --youtube-skip-dash-manifest=: SUPPRESSHELP
    --youtube-skip-hls-manifest=: SUPPRESSHELP
    -2, --twofactor=: Two-factor authentication code
    -4, --force-ipv4: Make all connections via IPv4
    -6, --force-ipv6: Make all connections via IPv6
    -C=: SUPPRESSHELP
    -F, --list-formats: List available formats of each video.
    -I, --playlist-items=: Comma-separated playlist_index of the items to download.
    -J, --dump-single-json: Quiet, but print JSON information for each URL or infojson passed.
    -N, --concurrent-fragments=: Number of fragments of a dash/hlsnative video that should be downloaded concurrently (default is %default)
    -O, --print=: Field name or output template to print to screen, optionally prefixed with when to print it, separated by a ":".
    -P, --paths=: The paths where the files should be downloaded.
    -R, --retries=: Number of retries (default is %default), or "infinite"
    -S, --format-sort=: Sort the formats by the fields given, see "Sorting Formats" for more details
    -U, --update: Check if updates are available.
    -a, --batch-file=: File containing URLs to download ("-" for stdin), one URL per line.
    -c, --continue: Resume partially downloaded files/fragments (default)
    -e, --get-title: SUPPRESSHELP
    -f, --format=: Video format code, see "FORMAT SELECTION" for more details
    -g, --get-url: SUPPRESSHELP
    -h, --help: Print this help text and exit
    -i, --ignore-errors: Ignore download and postprocessing errors.
    -j, --dump-json: Quiet, but print JSON information for each video.
    -k, --keep-video: Keep the intermediate video file on disk after post-processing
    -n, --netrc: Use .netrc authentication data
    -o, --output=: Output filename template; see "OUTPUT TEMPLATE" for details
    -p, --password=: Account password.
    -q, --quiet: Activate quiet mode.
    -r, --rate-limit=: Maximum download rate in bytes per second, e.g. 50K or 4.2M
    -s, --simulate: Do not download the video and do not write anything to disk
    -t, --preset-alias=: Applies a predefined set of options.
    -u, --username=: Login with this account ID
    -v, --verbose: Print various debugging information
    -w, --no-overwrites: Do not overwrite any files
    -x, --extract-audio: Convert video files to audio-only files (requires ffmpeg and ffprobe)
completion:
    flag:
        concat-playlist:
            - never
            - always
            - multi_video
        fixup:
            - never
            - ignore
            - warn
            - detect_or_warn
            - force
commands:
    - name: ""
      description: A feature-rich command-line audio/video downloader
      flags:
        --S-force: 'Force user specified sort order to have precedence over all fields, see "Sorting Formats" for more details (Alias: --S-force)'
        --add-chapters: 'Add chapter markers to the video file (Alias: --add-chapters)'
        --add-headers=: Specify a custom HTTP header and its value, separated by a colon ":".
        --add-metadata: Embed metadata to the video file.
        --age-limit=: Download only videos suitable for the given age
        --alias=: Create aliases for an option string.
        --all-formats: SUPPRESSHELP
        --all-subs: SUPPRESSHELP
        --allow-unplayable-formats: SUPPRESSHELP
        --ap-list-mso: List all supported multiple-system operators
        --ap-mso=: Adobe Pass multiple-system operator (TV provider) identifier, use --ap-list-mso for a list of available MSOs
        --ap-password=: Multiple-system operator account password.
        --ap-username=: Multiple-system operator account login
        --audio-format=: Format to convert the audio to when -x is used.
        --audio-multistreams: Allow multiple audio streams to be merged into a single file
        --audio-quality=: Specify ffmpeg audio quality to use when converting the audio with -x.
        --autonumber-size=: SUPPRESSHELP
        --autonumber-start=: SUPPRESSHELP
        --bidi-workaround: Work around terminals that lack bidirectional text support.
        --break-match-filters=: Same as "--match-filters" but stops the download process when a video is rejected
        --break-on-existing: Stop the download process when encountering a file that is in the archive supplied with the --download-archive option
        --break-on-reject: SUPPRESSHELP
        --break-per-input: Alters --max-downloads, --break-on-existing, --break-match-filters, and autonumber to reset per input URL
        --buffer-size=: Size of download buffer, e.g. 1024 or 16K (default is %default)
        --cache-dir=: Location in the filesystem where yt-dlp can store some downloaded information (such as client ids and signatures) permanently.
        --call-home=: SUPPRESSHELP
        --check-all-formats: Check all formats for whether they are actually downloadable
        --check-formats: Make sure formats are selected only from those that are actually downloadable
        --clean-infojson: Remove some internal metadata such as filenames from the infojson (default)
        --client-certificate-key=: Path to private key file for client certificate
        --client-certificate-password=: Password for client certificate private key, if encrypted.
        --client-certificate=: Path to client certificate file in PEM format.
        --cn-verification-proxy=: SUPPRESSHELP
