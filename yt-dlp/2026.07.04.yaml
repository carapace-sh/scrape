            dump-pages: Print downloaded pages encoded using base64 to debug problems (very verbose)
            dump-single-json: Quiet, but print JSON information for each URL or infojson passed. Simulate unless --no-simulate is used. If the URL refers to a playlist, the whole playlist information is dumped in a single line
            dump-user-agent: SUPPRESSHELP
