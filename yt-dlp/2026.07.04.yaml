            no-abort-on-unavailable-fragments: 'Skip unavailable fragments for DASH, hlsnative and ISM downloads (default) (Alias: --no-abort-on-unavailable-fragments)'
            no-add-chapters: 'Do not add chapter markers (default) (Alias: --no-add-chapters)'
            no-add-metadata: 'Do not add metadata to file (default) (Alias: --no-add-metadata)'
            no-allow-dynamic-mpd: 'Do not process dynamic DASH manifests (Alias: --no-allow-dynamic-mpd)'
            no-allow-unplayable-formats: SUPPRESSHELP
