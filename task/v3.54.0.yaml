# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: task
persistentflags:
  --cacert=: Path to a custom CA certificate for HTTPS connections.
  --cert-key=: Path to a client certificate key for HTTPS connections.
  --cert=: Path to a client certificate for HTTPS connections.
  --clear-cache: Clear the remote cache.
  --completion=: Generates shell completion script.
  --disable-fuzzy: Disables fuzzy matching for task names.
  --download: Forces task to download remote Taskfiles and ignore any cached versions.
  --experiments: Lists all the available experiments and whether or not they are enabled.
  --expiry=: Expiry duration for cached remote Taskfiles.
  --insecure: Forces Task to download Taskfiles over insecure connections.
  --interactive: Prompt for missing required variables.
  --nested: Nest namespaces when listing tasks as JSON
  --no-status: Ignore status when listing tasks as JSON
  --offline: Forces Task to only use local or cached Taskfiles.
  --output-group-begin=: Message template to print before a task's grouped output.
  --output-group-end=: Message template to print after a task's grouped output.
  --output-group-error-only: Swallow output from successful tasks.
  --remote-cache-dir=: Directory to cache remote Taskfiles.
  --sort=: Changes the order of the tasks when listed. [default|alphanumeric|none].
  --status: Exits with non-zero exit code if any of the given tasks is not up-to-date.
  --summary: Show summary about a task.
  --temp-dir=: Sets the directory used to store Task temporary files, such as checksums. Relative paths are relative to the root Taskfile.
  --timeout=:
    description: Timeout for downloading remote Taskfiles.
    default: 10s
  --trusted-hosts=*: List of trusted hosts for remote Taskfiles (comma-separated).
  --version: Show Task version.
  -C, --concurrency=: Limit number of tasks to run concurrently.
  -F, --failfast: When running tasks in parallel, stop all tasks if one fails.
  -I, --interval=: Interval to watch for changes.
  -a, --list-all: Lists tasks with or without a description.
  -c, --color:
    description: Colored output. Enabled by default. Set flag to false or use NO_COLOR=1 to disable.
    default: "true"
  -d, --dir=: Sets the directory in which Task will execute and look for a Taskfile.
  -f, --force: Forces execution even when the task is up-to-date.
  -g, --global: Runs global Taskfile, from $HOME/{T,t}askfile.{yml,yaml}.
  -h, --help: Shows Task usage.
  -i, --init: Creates a new Taskfile.yml in the current folder.
  -j, --json: Formats task list as JSON.
  -l, --list: Lists tasks with description of current Taskfile.
  -n, --dry: Compiles and prints tasks in the order that they would be run, without executing them.
  -o, --output=: 'Sets output style: [interleaved|group|prefixed].'
  -p, --parallel: Executes tasks provided on command line in parallel.
  -s, --silent: Disables echoing.
  -t, --taskfile=: Choose which Taskfile to run. Defaults to "Taskfile.yml".
  -v, --verbose: Enables verbose mode.
  -w, --watch: Enables watch of the given task.
  -x, --exit-code: Pass-through the exit code of the task command.
  -y, --yes: Assume "yes" as answer to all prompts.
commands:
  - name: completion
    description: Generate the autocompletion script for the specified shell
    commands:
      - name: bash
        description: Generate the autocompletion script for bash
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the bash shell.

            This script depends on the 'bash-completion' package.
            If it is not installed already, you can install it via your OS's package manager.

            To load completions in your current shell session:

            	source <(task completion bash)

            To load completions for every new session, execute once:

            #### Linux:

            	task completion bash > /etc/bash_completion.d/task

            #### macOS:

            	task completion bash > $(brew --prefix)/etc/bash_completion.d/task

            You will need to start a new shell for this setup to take effect.
      - name: fish
        description: Generate the autocompletion script for fish
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the fish shell.

            To load completions in your current shell session:

            	task completion fish | source

            To load completions for every new session, execute once:

            	task completion fish > ~/.config/fish/completions/task.fish

            You will need to start a new shell for this setup to take effect.
      - name: powershell
        description: Generate the autocompletion script for powershell
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for powershell.

            To load completions in your current shell session:

            	task completion powershell | Out-String | Invoke-Expression

            To load completions for every new session, add the output of the above command
            to your powershell profile.
      - name: zsh
        description: Generate the autocompletion script for zsh
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the zsh shell.

            If shell completion is not already enabled in your environment you will need
            to enable it.  You can execute the following once:

            	echo "autoload -U compinit; compinit" >> ~/.zshrc

            To load completions in your current shell session:

            	source <(task completion zsh)

            To load completions for every new session, execute once:

            #### Linux:

            	task completion zsh > "${fpath[1]}/_task"

            #### macOS:

            	task completion zsh > $(brew --prefix)/share/zsh/site-functions/_task

            You will need to start a new shell for this setup to take effect.
    documentation:
      command: |
        Generate the autocompletion script for task for the specified shell.
        See each sub-command's help for details on how to use the generated script.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type task help [path to command] for full details.
