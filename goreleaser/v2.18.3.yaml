# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: goreleaser
description: Release engineering, simplified
persistentflags:
  --verbose: Enable verbose mode
commands:
  - name: build
    aliases:
      - b
    description: Builds the current project
    flags:
      --auto-snapshot: Automatically sets --snapshot if the repository is dirty
      --clean: Removes the 'dist' directory before building
      --deprecated&: Force print the deprecation message - tests only
      --id=*: Builds only the specified build ids
      --single-target: Builds only for current GOOS and GOARCH, regardless of what's set in the configuration file
      --skip=*: 'Skip the given options (valid options are: before, post-hooks, pre-hooks, validate)'
      --snapshot: Generate an unversioned snapshot build, skipping all validations
      --timeout=:
        description: Timeout to the entire build process
        default: 1h0m0s
      -f, --config=: Load configuration from file
      -o, --output=: Copy the binary to the path after the build. Only taken into account when using --single-target and a single id (either with --id or if configuration only has one build)
      -p, --parallelism=: 'Number of tasks to run concurrently (default: number of CPUs)'
    documentation:
      command: |
        The `goreleaser build` command is analogous to the `go build` command, in the sense it only builds binaries.

        Its intended usage is, for example, within Makefiles to avoid setting up ldflags and etc in several places. That way, the GoReleaser config becomes the source of truth for how the binaries should be built.

        It also allows you to generate a local build for your current machine only using the `--single-target` option, and specific build IDs using the `--id` option in case you have more than one.

        When using `--single-target`, you use the `TARGET`, or `GOOS`, `GOARCH`, `GOARM`, `GOAMD64`, `GOARM64`, `GORISCV64`, `GO386`, `GOPPC64`, `GOMIPS`, and `GOMIPS64` environment variables to determine the target, defaulting to the current machine target if not set.
  - name: check [configuration files]
    aliases:
      - c
    description: Checks if configuration is valid
    flags:
      --deprecated&: Force print the deprecation message - tests only
      -f, --config=&: Configuration file(s) to check
      -q, --quiet: 'Quiet mode: no output'
  - name: completion
    description: Generate the autocompletion script for the specified shell
    commands:
      - name: bash
        description: Generate the autocompletion script for bash
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the bash shell.

            This script depends on the 'bash-completion' package.
            If it is not installed already, you can install it via your OS's package manager.

            To load completions in your current shell session:

            	source <(goreleaser completion bash)

            To load completions for every new session, execute once:

            #### Linux:

            	goreleaser completion bash > /etc/bash_completion.d/goreleaser

            #### macOS:

            	goreleaser completion bash > $(brew --prefix)/etc/bash_completion.d/goreleaser

            You will need to start a new shell for this setup to take effect.
      - name: fish
        description: Generate the autocompletion script for fish
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the fish shell.

            To load completions in your current shell session:

            	goreleaser completion fish | source

            To load completions for every new session, execute once:

            	goreleaser completion fish > ~/.config/fish/completions/goreleaser.fish

            You will need to start a new shell for this setup to take effect.
      - name: powershell
        description: Generate the autocompletion script for powershell
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for powershell.

            To load completions in your current shell session:

            	goreleaser completion powershell | Out-String | Invoke-Expression

            To load completions for every new session, add the output of the above command
            to your powershell profile.
      - name: zsh
        description: Generate the autocompletion script for zsh
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the zsh shell.

            If shell completion is not already enabled in your environment you will need
            to enable it.  You can execute the following once:

            	echo "autoload -U compinit; compinit" >> ~/.zshrc

            To load completions in your current shell session:

            	source <(goreleaser completion zsh)

            To load completions for every new session, execute once:

            #### Linux:

            	goreleaser completion zsh > "${fpath[1]}/_goreleaser"

            #### macOS:

            	goreleaser completion zsh > $(brew --prefix)/share/zsh/site-functions/_goreleaser

            You will need to start a new shell for this setup to take effect.
    documentation:
      command: |
        Generate the autocompletion script for goreleaser for the specified shell.
        See each sub-command's help for details on how to use the generated script.
  - name: healthcheck
    aliases:
      - hc
    description: Checks if needed tools are installed
    flags:
      -f, --config=: Configuration file
      -q, --quiet: 'Quiet mode: no output'
    documentation:
      command: Check if the needed tools are available in your $PATH, exits 1 if any of them are missing.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type goreleaser help [path to command] for full details.
  - name: init
    aliases:
      - i
    description: Generates a .goreleaser.yaml file
    flags:
      -f, --config=:
        description: Load configuration from file
        default: .goreleaser.yaml
      -l, --language=:
        description: Which language will be used
        default: go
  - name: jsonschema
    aliases:
      - schema
    description: Outputs goreleaser's JSON schema
    flags:
      -o, --output=:
        description: Where to save the JSONSchema file
        default: '-'
  - name: man
    description: Generates GoReleaser's command line manpages
    hidden: true
  - name: man
    description: Generates manpages
    hidden: true
  - name: release
    aliases:
      - r
    description: Releases the current project
    flags:
      --auto-snapshot: Automatically sets --snapshot if the repository is dirty
      --clean: Removes the 'dist' directory
      --deprecated&: Force print the deprecation message - tests only
      --draft: Whether to set the release to draft. Overrides release.draft in the configuration file
      --fail-fast: Whether to abort the release publishing on the first error
      --release-footer-tmpl=: Load custom release notes footer from a templated markdown file (overrides --release-footer)
      --release-footer=: Load custom release notes footer from a markdown file
      --release-header-tmpl=: Load custom release notes header from a templated markdown file (overrides --release-header)
      --release-header=: Load custom release notes header from a markdown file
      --release-notes-tmpl=: Load custom release notes from a templated markdown file (overrides --release-notes)
      --release-notes=: Load custom release notes from a markdown file (will skip GoReleaser changelog generation)
      --skip=*: Skip the given options (valid options are announce, archive, aur, aur-source, before, chocolatey, docker, flatpak, homebrew, iru, ko, makeself, mcp, nfpm, nix, notarize, publish, sbom, scoop, sign, snapcraft, srpm, validate, winget)
      --snapshot: Generate an unversioned snapshot release, skipping all validations and without publishing any artifacts (implies --skip=announce,publish,validate)
      --timeout=:
        description: Timeout to the entire release process
        default: 1h0m0s
      -f, --config=: Load configuration from file
      -p, --parallelism=: 'Amount tasks to run concurrently (default: number of CPUs)'
documentation:
  command: |-
    Release engineering, simplified.

    GoReleaser is a release automation tool, built with love and care by @caarlos0 and many contributors.

    Complete documentation is available at https://goreleaser.com
