# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: but
description: A GitButler CLI tool
flags:
  -C, --current-dir=:
    description: Run as if but was started in PATH instead of the current working directory
    default: .
  -h, --help: Print help (see more with '--help')
  --log-file&=: Log to this file instead of stderr
  -t, --trace&*: Enable tracing for debug and performance information printed to stderr
  -V, --version: Print version
persistentflags:
  --json: Output detailed information as JSON for tool consumption
  --status-after: Append workspace status when supported by a mutation command
completion:
  flag:
    current-dir:
    - $files
    log-file:
    - $files
documentation:
  flag:
    help: Print help (see a summary with '-h')
    log-file: |-
      Log to this file instead of stderr.

      If the file does not exist it will be created. If it does exist it will be truncated.
    status-after: |-
      Append workspace status when supported by a mutation command.

      Use when the next step needs IDs or details from the resulting workspace.
    trace: |-
      Enable tracing for debug and performance information printed to stderr.

      Repeat up to 4 times for increasingly verbose output.
commands:
- name: init
  description: Create an empty Git repository in the current directory
  flags:
    --commit: Also create an initial empty commit
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Create an empty Git repository in the current directory.

      Use but -C <path> init to initialize another directory. Existing repositories are left unchanged.
- name: status
  description: Show an overview of the workspace state
  flags:
    -f: Also list the files changed by each commit
    --files&: Also list the files changed by each commit
    -h, --help: Print help (see more with '--help')
    --no-hint: Disable hints about available commands at the end of output
    -r, --refresh-prs: Forces a sync of pull requests from the forge before showing status
    --short&: ''
    -u, --upstream: Show detailed list of upstream commits that haven't been integrated yet
    -v, --verbose: Show verbose output with commit author and timestamp
  documentation:
    command: |
      Show an overview of the workspace state.

      This shows uncommitted files, all applied branches (stacked or parallel), commits on each of those branches, upstream commits that are unintegrated, commit status (pushed or local), and base branch information.

      Examples

      Normal usage:

        but status

      Shorthand with listing files modified

        but status -f
- name: diff
  description: Show the diff of changes in the repo
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Show the diff of changes in the repo.

      Without any arguments, it shows the diff of all uncommitted changes of the checkout but runs in: the main worktree's, or a linked worktree's when run from inside one. Optionally, provide one CLI ID to show the diff for an uncommitted file, branch, commit, committed file, or worktree.

      TARGET accepts at most one entity. To show several entities, run this command once per entity.
- name: show
  description: Show details of a commit or branch
  flags:
    -h, --help: Print help (see more with '--help')
    -v, --verbose: Show full commit messages and files changed for each commit
  documentation:
    command: |
      Show details of a commit or branch.

      When given a commit ID, displays the full commit message, author information, committer information (if different from author), and the list of files modified.

      When given a branch name, displays the branch name and a list of all commits on that branch. Use --verbose to show full commit messages and files changed.

      Examples

      Show commit details by short commit ID:

        but show a1b2c3d

      Show commit details by CLI ID:

        but show c5

      Show branch commits by branch name:

        but show my-feature-branch

      Show branch with full commit details:

        but show my-feature-branch --verbose
- name: commit
  description: Create a commit
  flags:
    -A, --above=: Place the commit above BRANCH_OR_COMMIT, which must be an applied branch or commit
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -B, --below=: Place the commit below BRANCH_OR_COMMIT, which must be an applied branch or commit
    -b, --branch=: Place the commit on the branch BRANCH
    --empty: Create an empty commit even when there are changes
    -F, --file=: Read the commit message from FILE, or from stdin when FILE is -
    -h, --help: Print help (see more with '--help')
    -i, --interactive: Open the TUI to interactively select what to commit
    -m, --message=*: The message to use for the commit
    --no-message: Create the commit without a message
    -s, --switch: Switch to the target branch instead of remaining in the GitButler workspace
  documentation:
    command: |-
      Create a commit.

      By default, all uncommitted changes of the checkout but runs in are included in the commit: the main worktree's, or a linked worktree's when run from inside one. This can be controlled with change flags such as --empty and --interactive, or by providing CHANGES as positional arguments.

      Run from a linked worktree, or given changes from one, the commit is placed at the tip of that worktree's branch. Otherwise, if there are no branches applied, a new branch is created for the commit. If there is only one stack of branches applied, the commit is placed at the tip of that stack. Otherwise, the targeting flags --above, --below and --branch control where the commit is placed. --above and --below are mutually exclusive; combine either with --branch to name a new branch when targeting a branch.

      The commit is expected to have a commit message unless --no-message is provided. If none of --no-message, --message or --file is provided, the user's preferred editor is opened to input a message.

      For more details about CLI IDs, see but help cli-ids.
    flag:
      above: |-
        Place the commit above BRANCH_OR_COMMIT, which must be an applied branch or commit.

        If BRANCH_OR_COMMIT is a commit, the new commit is placed on the same branch as the targeted commit.

        If BRANCH_OR_COMMIT is a branch, the new commit is placed on a new branch above the targeted branch. Use --branch <NAME> to name it; otherwise a name is generated.
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
      below: |-
        Place the commit below BRANCH_OR_COMMIT, which must be an applied branch or commit.

        If BRANCH_OR_COMMIT is a commit, the new commit is placed on the same branch as the targeted commit.

        If BRANCH_OR_COMMIT is a branch, the new commit is placed on a new branch below the targeted branch. Branches are treated as buckets, meaning that "below a branch" is treated as below the oldest ancestor on that branch. Use --branch <NAME> to name the new branch; otherwise a name is generated.

        If BRANCH_OR_COMMIT is a worktree, the new commit is placed on the tip of the branch that worktree has checked out.
      branch: |-
        Place the commit on the branch BRANCH.

        With --above or --below, name the new branch created relative to the target branch. The name must not already exist; omit it for a generated name. Cannot be combined with commit or worktree targets.

        Otherwise, if BRANCH does not exist, it is created as an unstacked branch. If BRANCH is omitted, an unstacked branch with a generated name is created.

        If BRANCH is a worktree or a branch checked out in one, the commit is placed on the tip of that worktree's branch.

        Attempting to place a commit on a branch that exists but is not applied is an error.
      message: |-
        The message to use for the commit.

        Can be supplied any amount of times, each value being appended to the preceding ones with a blank line in between. Without -m, -F or --no-message, a terminal opens the editor and a non-interactive run commits with an empty message.
- name: squash
  description: Squash commits, branches, or changes
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -F, --file=: Read the message for the new commit from FILE, or from stdin when FILE is -
    -h, --help: Print help (see more with '--help')
    -m, --message=*: The message to use for the new commit
    --no-message: Create the commit without a message
    -t, --target=: The target to squash into
    --use-source-message: Use the message of the source(s)
    -u, --use-target-message: Use the message of the target
  documentation:
    command: |-
      Squash commits, branches, or changes.

      Squash is flexible in the ways it can move changes around. It can

      - Squash commits into other commits
      - Squash branches into commits
      - Move changes between commits
      - Amend uncommitted changes into a commit
      - Uncommit commits
      - Uncommit changes in commits
      - Uncommit branches

      If no message-related flag is passed when squashing commits or branches, an editor may be opened where the new message can be composed; other squashes keep the target's message.

      For more details about CLI IDs, see but help cli-ids.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
      file: |-
        Read the message for the new commit from FILE, or from stdin when FILE is -.

        This cannot be used when TARGET is the uncommitted area (@).
      message: |-
        The message to use for the new commit.

        Can be supplied any number of times, each value being appended to the preceding ones with a blank line in between. Without a message flag, squashing commits or branches opens the editor in a terminal; a non-interactive run skips the editor.

        This cannot be used when TARGET is the uncommitted area (@).
      no-message: |-
        Create the commit without a message.

        This cannot be used when TARGET is the uncommitted area (@).
      target: |-
        The target to squash into.

        If TARGET is a commit the sources will be added to the commit.

        If TARGET is a branch the sources will be added to that branch's newest commit (its tip).

        If TARGET is the uncommitted area (@) the sources will be uncommitted. A commit owned by a worktree uncommits into that worktree's area instead, named by its ID (<id>:@).
      use-source-message: |-
        Use the message of the source(s).

        The message of the target will be discarded.

        Cannot be used if <SOURCES> are not committed, if TARGET is the uncommitted area (@), or if moving committed changes between commits.
      use-target-message: |-
        Use the message of the target.

        The message of the source(s) will be discarded.

        This cannot be used when TARGET is the uncommitted area (@).
- name: move
  description: Move commits and changes around
  flags:
    -A, --above=: Place <SOURCES> above BRANCH_OR_COMMIT
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -B, --below=: Place <SOURCES> below BRANCH_OR_COMMIT
    -b, --branch=: Place <SOURCES> on the branch BRANCH
    -F, --file=: Read the new commit's message from FILE, or from stdin when FILE is -
    -h, --help: Print help (see more with '--help')
    -m, --message=*: The message to use when moving changes into a new commit
    -s, --switch: Switch to the destination branch instead of remaining in the GitButler workspace
    --unstack: Unstack <SOURCES> from their current stacks
  documentation:
    command: |-
      Move commits and changes around.

      Move a set of <SOURCES> around relative to a TARGET.

      <SOURCES> is a set of commits, a set of committed changes or a single branch. Committed changes may be files, hunks or a mixture of both from the same commit. You are not allowed to mix other kinds of sources (e.g. commits and committed changes) in a single command.

      TARGET is one of --above, --below, --unstack or --branch and defines how <SOURCES> should be moved. Depending on how <SOURCES> and TARGET are combined, a commit and/or branch may be created as part of the move.

      A branch is created when:

      - You move a commit or committed change relative to a branch
      - You unstack a commit or committed change

      A commit is created when:

      - You move a committed change relative to a commit or branch
      - You unstack a committed change

      Note the overlap between the above conditions. For example, unstacking a committed change both creates a new commit for the change and a branch for the commit.

      For more details about CLI IDs, see but help cli-ids.
    flag:
      above: |-
        Place <SOURCES> above BRANCH_OR_COMMIT.

        If BRANCH_OR_COMMIT is a commit, <SOURCES> are placed on the same branch as the targeted commit.

        If BRANCH_OR_COMMIT is a branch, the sources are placed on a new branch above the targeted branch.

        If BRANCH_OR_COMMIT is a worktree, a branch source is stacked on the branch that worktree has checked out and becomes its checked-out branch.

        This target is applicable for all kinds of <SOURCES>.

        If moving commits or committed changes, use --branch NAME to name the new branch.
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
      below: |-
        Place <SOURCES> below BRANCH_OR_COMMIT.

        If BRANCH_OR_COMMIT is a commit, the <SOURCES> are placed on the same branch as the targeted commit.

        If BRANCH_OR_COMMIT is a branch, <SOURCES> are placed on a new branch below the targeted branch. Branches are treated as buckets, meaning that "below a branch" is treated as below the oldest ancestor on that branch.

        If BRANCH_OR_COMMIT is a worktree, <SOURCES> are placed on the tip of the branch that worktree has checked out.

        This target is only applicable for <SOURCES> that are commits or committed changes.

        If moving commits or committed changes, use --branch NAME to name the new branch.
      branch: |-
        Place <SOURCES> on the branch BRANCH.

        If BRANCH exists, commits or committed changes are moved onto its tip. A branch source is instead stacked on top of BRANCH, equivalent to --above BRANCH.

        If BRANCH does not exist, it is created as an unstacked branch for commit or committed-change sources. Using a branch source with a nonexistent BRANCH is an error.

        If BRANCH is a worktree or a branch checked out in one, commit or committed-change sources are moved onto the tip of that worktree's branch.

        If BRANCH is omitted, an unstacked branch with a generated name is created. This is exactly equivalent to --unstack and is allowed for any source kind.

        Attempting to place <SOURCES> on a branch that exists but is not applied is an error.
      message: |-
        The message to use when moving changes into a new commit.

        Can be supplied any amount of times, each value being appended to the preceding ones with a blank line in between. Without -m, the new commit will get an empty message.
      switch: |-
        Switch to the destination branch instead of remaining in the GitButler workspace.

        When moving a branch, switch to the moved branch.
      unstack: |-
        Unstack <SOURCES> from their current stacks.

        --unstack does not take an argument, so --unstack <SOURCES> and <SOURCES> --unstack are equivalent.

        If moving commits or committed changes, use --branch NAME to name the new branch.
- name: split
  description: Split a commit in two
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -F, --file=: Read the new commit's message from FILE, or from stdin when FILE is -
    -h, --help: Print help (see more with '--help')
    -m, --message=*: The message to use for the new commit
  documentation:
    command: |-
      Split a commit in two.

      Sources must all be committed changes from the same commit. Files and hunks may be mixed.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
      message: |-
        The message to use for the new commit.

        Can be supplied any amount of times, each value being appended to the preceding ones with a blank line in between. Without -m, the new commit will get an empty message.
- name: _reword2
  description: Edit a commit message or rename a branch
  hidden: true
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -f, --fix-formatting: Format the existing commit message to 72-character line wrapping without opening an editor
    -h, --help: Print help (see more with '--help')
    -m, --message=: The new commit message or branch name. If omitted, an editor opens
  documentation:
    command: |-
      Edit a commit message or rename a branch.

      If no message is provided, an editor opens. Rewording a commit recreates it and rebases its dependent commits.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
- name: branch
  description: Commands for managing branches
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Commands for managing branches.

      This includes creating, deleting, listing, and showing details about branches.

      By default without a subcommand, it will list the branches.

      To apply or unapply branches, use but apply and but unapply.

      To rename an applied branch, use but reword <branch> -m <new-name>.
  commands:
  - name: new
    description: Create a new branch
    flags:
      -A, --above=: Place the branch above BRANCH_OR_COMMIT, which must be an applied branch or commit
      --allow-merged: Allow targeting branches and commits that are already merged upstream
      -B, --below=: Place the branch below BRANCH_OR_COMMIT, which must be an applied branch or commit
      -h, --help: Print help (see more with '--help')
      -s, --switch: Switch to the newly created branch instead of applying it to the GitButler workspace
    documentation:
      command: |-
        Create a new branch.

        Use --above or --below to create stacked branches. Omitting these creates a new unstacked branch in the workspace, which is refused when run from a linked worktree.

        For more details about CLI IDs, see but help cli-ids.
      flag:
        above: |-
          Place the branch above BRANCH_OR_COMMIT, which must be an applied branch or commit.

          If BRANCH_OR_COMMIT is a commit, the new branch is created above the commit.

          If BRANCH_OR_COMMIT is a branch, the new branch is created above the targeted branch.
        allow-merged: |-
          Allow targeting branches and commits that are already merged upstream.

          By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
        below: |-
          Place the branch below BRANCH_OR_COMMIT, which must be an applied branch or commit.

          If BRANCH_OR_COMMIT is a commit, the new branch is created below the commit.

          If BRANCH_OR_COMMIT is a branch, the new branch is created below the targeted branch.
  - name: delete
    description: Delete branches and their commits from the workspace
    flags:
      -h, --help: Print help (see more with '--help')
  - name: list
    description: List the branches in the repository
    flags:
      -a, --all: Show all branches (not just active + 20 most recent); empty branches also need --empty
      --empty: Include branches with no commits on them (hidden by default)
      -h, --help: Print help (see more with '--help')
      -l, --local: Show only local branches
      --no-ahead: Don't calculate and show number of commits ahead of base (faster)
      --no-check: Don't check if each branch merges cleanly into upstream
      -r, --remote: Show only remote branches
      --review: Fetch and display review information (PRs, MRs, etc.)
    documentation:
      command: |-
        List the branches in the repository

        By default, shows the active branch and the 20 most recently updated branches.

        You can use the --all flag to show all branches, --local to show only local branches, or --remote to show only remote branches.

        You can also filter branch names by specifying a substring, such as but branch list feature to show only branches with "feature" in the name.

        If you want to check for review status, you can add --review to fetch and display pull request or merge request information for each branch. This will make the command slower as it needs to query the forge.

        By default, the command checks if each branch merges cleanly into the upstream base target branch (not your workspace). You can disable this check with --no-check to make the command faster.

        By default it also calculates the number of commits each branch is ahead of the base branch. You can disable this with --no-ahead to make the command faster.
  - name: show
    description: Show commits ahead of base for a specific branch
    flags:
      --ai: Generate AI summary of the branch changes
      --check: Check if the branch merges cleanly into upstream and identify conflicting commits
      -f, --files: Show files modified in each commit with line counts
      -h, --help: Print help (see more with '--help')
      -r, --review: Fetch and display review information
    documentation:
      command: |-
        Show commits ahead of base for a specific branch

        This shows the list of commits that are on the specified branch but not yet integrated into the base target branch.

        You can also choose to fetch and display review information, show files modified in each commit with line counts, generate an AI summary of the branch changes, and check if the branch merges cleanly into upstream.
  - name: move
    description: 'Deprecated: use but move instead'
    hidden: true
    flags:
      -h, --help: Print help (see more with '--help')
  - name: update
    description: Integrate a branch's remote counterpart into the local branch
    flags:
      --dry-run: Preview the resulting branch state without persisting changes
      -h, --help: Print help (see more with '--help')
      -i, --interactive: Open the generated integration script in an editor
      -s, --strategy=:
        description: Strategy to use for the integration
        default: pull-rebase
      -v, --verbose: Show additional dry-run details like the current divergence
    completion:
      flag:
        strategy:
        - "pull-rebase\tRebuilds the branch picking first the commits on the remote, and then the commits on the local branch"
        - "smart-squash\tTries to fold matching remote work into related local commits. This is done through matching Change IDs, and falling back to pull-rebase ordering otherwise"
        - "merge\tKeeps your local history and merges the remote tip into it"
        - "pick-remote\tRebuilds the branch picking only the commits on the remote"
    documentation:
      command: |-
        Integrate a branch's remote counterpart into the local branch.

        This allows you to resolve the divergence between your local branch and its tracked remote in different ways.
- name: worktree
  description: Manage worktrees
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Manage worktrees.

      Without a subcommand, lists the worktrees.
  commands:
  - name: list
    description: List worktrees, most recently updated first
    flags:
      --active: List all active worktrees
      --archived: List all archived worktrees
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        List worktrees, most recently updated first.

        By default this lists every active worktree and the three most recently updated archived ones. A worktree is shown by its name, followed by the branch it has checked out when that differs from the name, and its path.
  - name: new
    description: Create a worktree on a new branch at the workspace base or above a commit, or on an existing branch that isn't in the workspace
    flags:
      -A, --above=: Start the new branch at COMMIT instead of the workspace base
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        Create a worktree on a new branch at the workspace base or above a commit, or on an existing branch that isn't in the workspace.

        By default, a new branch starts at the child-most commit any applied stack rests on, and is checked out under ~/.gitbutler-worktrees/<repo-dir-basename>/ in a directory named by a slug of the branch name (or wt if the slug is empty). If that directory is taken, retries up to five times with a random ASCII suffix.

        Worktree creation supports simple .worktreeinclude files with paths to files or directories. Untracked files are copied if any prefix of their path is in the .worktreeinclude file and they are also gitignored.
      flag:
        above: |-
          Start the new branch at COMMIT instead of the workspace base.

          Accepts a commit SHA or CLI ID, not a branch. Conflicted commits are refused.
  - name: archive
    description: Hide a worktree from the workspace
    flags:
      -h, --help: Print help (see more with '--help')
  - name: unarchive
    description: Show an archived worktree in the workspace again
    flags:
      -h, --help: Print help (see more with '--help')
  - name: remove
    aliases:
    - rm
    description: Remove a worktree from disk, like git worktree remove
    flags:
      -f, --force: Remove the worktree even if it has uncommitted changes
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        Remove a worktree from disk, like git worktree remove.

        This works on archived and locked worktrees too, and keeps the branch the worktree had checked out.
- name: merge
  aliases:
  - land
  description: Merge a branch directly onto the target branch, bypassing review
  flags:
    --ff-only: Refuse to merge unless the target can be fast-forwarded to the branch tip
    -h, --help: Print help (see more with '--help')
    --no-ff: Always create a merge commit, even when the branch can be fast-forwarded
    --whole-stack: 'Merge the entire stack: BRANCH must be the top segment, and the segments below it are published to the target along with it'
    --yes: Skip the confirmation prompt
  documentation:
    command: |
      Merge a branch directly onto the target branch, bypassing review.

      Merges the branch onto the configured target (for example origin/master) without going through a pull request — the "just push to the target" workflow. By default the target is fast-forwarded to the branch tip when possible (no merge commit); otherwise a merge commit is created, or with --ff-only the merge is refused. When the target branch has no upstream (for example in a repository without a remote), or for a local (gb-local) target, the refs are moved locally; otherwise the result is pushed to the remote. After merging, the remaining applied branches are reconciled onto the moved target, just like but pull.

      Requires the GitButler workspace or, in single-branch mode, a checked-out branch. In single-branch mode, merging the checked-out branch checks out the target branch afterwards, like but pull does once a branch is merged upstream, or a generated branch when the target can't be reused; the output names the branch checked out. Updating a target that has an upstream is direct and not easily reversible, so a confirmation is required (use --yes to skip it in scripts). Merging into a target without an upstream publishes nothing, so it needs no confirmation and but undo reverts it.

      When NOT to use this: if your project merges changes through pull requests / code review, use but push and open a PR (but pr new) instead — but merge deliberately bypasses that process. On a real remote, a branch protected against direct pushes will reject the merge.

      Merging a segment with other segments below it is refused unless --whole-stack is passed with the stack's top segment, which merges the entire stack.

      Examples

      Merge a branch by its CLI ID:

        but merge bu

      Merge a branch by name, forcing a merge commit:

        but merge my-feature-branch --no-ff

      Merge a branch only if the target can be fast-forwarded to it:

        but merge my-feature-branch --ff-only

      Merge an entire stack by naming its top segment:

        but merge top-branch --whole-stack
- name: discard
  description: Discard branches, commits, or changes
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Discard branches, commits, or changes.

      Changes may be selected by branch, commit, committed file, uncommitted file, or uncommitted hunk CLI ID. Use @ to discard all of the main worktree's uncommitted changes, or omit <CHANGES> to discard those of the checkout but runs in.

      All provided changes must be the same kind. Committed files must come from the same commit.

      The entire operation is recorded as a single oplog entry, so it can be undone with but undo.

      For more details about CLI IDs, see but help cli-ids.
- name: _comment
  description: Work with ephemeral comments anchored to lines in diffs
  hidden: true
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Work with ephemeral comments anchored to lines in diffs.

      Comments are typically created in the GUI on a line of a diff — of an uncommitted file, or of a commit — and picked up here by agents, which act on them and archive them when done. Anchors follow the diff as it changes; comments whose anchored line disappears from the diff (for example because the change was committed or discarded) are archived automatically.
  commands:
  - name: list
    description: List all comments, with their anchors refreshed against the current diffs
    flags:
      -h, --help: Print help (see more with '--help')
      --timeout=:
        description: How many seconds --wait blocks before giving up for this invocation
        default: '60'
      --wait: Block until a comment exists instead of returning an empty listing
    documentation:
      command: |-
        List all comments, with their anchors refreshed against the current diffs.

        Every listed comment points at a line that exists in the current diff of its file and includes an excerpt of the surrounding diff for context. Comments whose anchor no longer exists are archived automatically and not listed.
      flag:
        wait: |-
          Block until a comment exists instead of returning an empty listing.

          Returns immediately when comments already exist; prints a notice when the timeout elapses without any. Run again to keep waiting.
  - name: archive
    description: Archive a comment, hiding it from all future listings
    flags:
      -h, --help: Print help (see more with '--help')
  - name: add
    description: Add a comment anchored to a line in a diff
    flags:
      --commit=: Anchor to the diff of this commit instead of the uncommitted changes
      -h, --help: Print help (see more with '--help')
      -m, --message!=: The comment text
      --old: Count the line in the old side of the diff (removed lines and context) instead of the new side
- name: resolve
  description: Resolve conflicts in a commit or in uncommitted files
  flags:
    --ai: Resolve the conflicts with the configured AI model and apply the result
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Resolve conflicts in a commit or in uncommitted files.

      When a commit is in a conflicted state (marked with conflicts during rebase), use this command to enter resolution mode, resolve the conflicts, and finalize. Uncommitted files marked {conflicted} by but status are resolved with but resolve <path>... once they hold the desired content (or were deleted).

      Workflow

      1. Enter resolution mode: but resolve <commit-id>
      2. Resolve conflicts in your editor (remove conflict markers)
      3. Check remaining conflicts: but resolve status
      4. Finalize resolution: but resolve finish Or cancel: but resolve cancel

      Alternatively, resolve with AI in one step: but resolve <commit-id> --ai, or but resolve --ai to resolve all conflicted commits, oldest first.

      When in resolution mode, but status will also show that you're resolving conflicts.
    flag:
      ai: |-
        Resolve the conflicts with the configured AI model and apply the result.

        With a commit ID this resolves only that commit; without one it resolves all conflicted commits in the workspace, oldest first. Undo the result with but undo.
  commands:
  - name: conflicts
    description: List the conflicts of a conflicted commit, without entering resolution mode
    flags:
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        List the conflicts of a conflicted commit, without entering resolution mode.

        Each conflict is shown with its ours side (the new base the commit was rebased onto), the common ancestor, and its theirs side (the commit's own version), numbered per file for use with but resolve apply.
  - name: apply
    description: Resolve conflicts of a conflicted commit, without entering resolution mode
    flags:
      --ai: Let the configured AI model merge the targeted conflicts
      --commit=: A conflicted commit, or a branch (meaning its oldest conflicted commit — branch names stay stable across applies, unlike commit ids). Defaults to the first conflicted branch's oldest conflicted commit
      -F, --file=: Read the replacement content from this file (otherwise from stdin)
      -h, --help: Print help (see more with '--help')
      --ours: 'Take the ours side: the new base the commit was rebased onto'
      --theirs: 'Take the theirs side: the commit''s own version'
    completion:
      flag:
        file:
        - $files
    documentation:
      command: |-
        Resolve conflicts of a conflicted commit, without entering resolution mode.

        Targets one conflict (<path>:<N>, numbers from but resolve conflicts) or every conflict in a file (<path> with --ours/--theirs). The replacement content for mixed resolutions is read from --file or stdin. Resolving only some conflicts keeps the commit conflicted with the rest, so conflicts can be worked off incrementally; the commit id changes with every apply. Undo with but undo.
  - name: status
    description: Show the status of conflict resolution, listing remaining conflicted files
    flags:
      -h, --help: Print help (see more with '--help')
  - name: finish
    description: Finalize conflict resolution and return to workspace mode
    flags:
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        Finalize conflict resolution and return to workspace mode.

        This commits the resolved changes, rebases any commits on top of the resolved commit, and returns to the normal workspace.
  - name: cancel
    description: Cancel conflict resolution and return to workspace mode
    flags:
      -f, --force: Discard any changes made during resolution
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        Cancel conflict resolution and return to workspace mode.

        This discards all changes made during resolution and restores the workspace to its pre-resolution state.
- name: unapply
  description: Remove a branch and the rest of its stack from the workspace, keeping them to apply again later
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Remove a branch and the rest of its stack from the workspace, keeping them to apply again later.

      If you want to unapply an applied branch from your workspace (effectively stashing it) so you can work on other branches, you can run but unapply <branch-name>.

      This will remove the changes in that branch from your working directory and you can re-apply it later when needed. You will then see the branch as unapplied in but branch list.

      Unapplying the last branch checks out the target's local tracking branch, if available. The unapplied branch is preserved and stays unapplied when switching back with but switch --workspace.

      The identifier can be:

      - A CLI ID pointing to a stack or branch (e.g., "bu" from but status)
      - A branch name

      If a branch name (or an identifier pointing to a branch) is provided, the entire stack containing that branch will be unapplied.

      For more details about CLI IDs, see but help cli-ids.
- name: apply
  description: Apply a branch
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Apply a branch.

      If you want to apply an unapplied branch to your workspace so you can work on it, you can run but apply <branch-name>.

      This will apply the changes in that branch into your working directory as a parallel applied branch.
- name: open
  description: Open the project in GitButler
  flags:
    -h, --help: Print help (see more with '--help')
    --print: Print the link instead of opening it
  documentation:
    command: |-
      Open the project in GitButler.

      With no argument this opens the workspace. Given a branch or a commit, the app opens with that selected, so a link can point at the thing you are talking about rather than at the app.

      Commits are addressed by their change ID where they have one, which survives amending and rebasing — the link keeps working after the commit is rewritten.
- name: push
  description: Push changes in a branch to remote
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -d, --dry-run: Show what would be pushed without actually pushing
    -a, --hashtag&=*: Add hashtag(s) to change (Gerrit). Can be used multiple times
    --tag&=*: Add hashtag(s) to change (Gerrit). Can be used multiple times
    -h, --help: Print help (see more with '--help')
    --no-hooks: Bypass pre-push hooks
    --no-verify: Bypass pre-push hooks
    -p, --private&: Mark change as private (Gerrit)
    -y, --ready&: Mark change as ready for review (Gerrit). This is the default state
    -s, --skip-force-push-protection: Skip force push protection checks
    --tb&: Use branch name as topic (Gerrit)
    --topic-from-branch&: Use branch name as topic (Gerrit)
    -t, --topic&=: Add custom topic to change (Gerrit). At most one topic can be set
    -w, --wip&: Mark change as work-in-progress (Gerrit). Mutually exclusive with --ready
    -f, --with-force&: Force push even if it's not fast-forward. Always on; the flag is kept for compatibility
  documentation:
    command: |-
      Push changes in a branch to remote.

      but push will update the remote with the latest commits from the applied branch(es).

      Without a branch ID:

      - Interactive mode: Lists all branches with unpushed commits and prompts for selection
      - Non-interactive mode: Automatically pushes all branches with unpushed commits

      With a branch ID:

      - but push bu - push the branch with CLI ID "bu"
      - but push feature-branch - push the branch named "feature-branch"
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
- name: pull
  description: Update applied branches and worktrees onto the latest target
  flags:
    -c, --check: Only check whether the update would apply cleanly, without updating
    -h, --help: Print help (see more with '--help')
    --update=*:
      description: What to rebase onto the target, comma-separated
      default: worktrees,workspace
  completion:
    flag:
      update:
      - "worktrees\tThe linked worktrees that are based on the target rather than on an applied branch"
      - "workspace\tThe applied branches, along with the linked worktrees based on them"
  documentation:
    command: |-
      Update applied branches and worktrees onto the latest target.

      This fetches the latest changes from the remote and rebases all applied branches and linked worktrees on top of the updated target branch.

      When the target branch has no upstream, for example in a repository without a remote, there is nothing to fetch: this updates the branches onto the local target branch instead, for example after merging branches into main with git merge.

      You should run this regularly to keep your branches up to date with the latest changes from the main development line.

      You can run but pull --check first to see if your branches can be cleanly merged into the target branch before running the update.

      Commits pushed to a branch's own remote counterpart are not integrated by pull; use but branch update <branch> for those.
- name: pr
  aliases:
  - mr
  description: Commands for creating and managing reviews on a forge, e.g. GitHub PRs or GitLab MRs
  flags:
    -d, --draft: Create the review as a draft
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Commands for creating and managing reviews on a forge, e.g. GitHub PRs or GitLab MRs.

      If you are authenticated with a forge using but config forge auth, you can use the but pr or but mr commands to create pull requests (or merge requests) on the remote repository for your branches.

      Running but pr without a subcommand defaults to but pr new, which will prompt you to select a branch to create a PR for.
  commands:
  - name: new
    description: Create a new review for a branch, force-pushing it first
    flags:
      -t, --default: Use the default content for the review title and description, skipping any prompts. If the branch contains only a single commit, the commit message will be used
      -d, --draft: Create the review as a draft
      -F, --file=: Read review title and description from FILE, or from stdin when FILE is -. The first line is the title, the rest is the description
      -h, --help: Print help (see more with '--help')
      -m, --message=: 'Review title and description: the first line is the title, the rest is the description. A non-interactive run needs -m, -F, or -t'
      --no-hooks: Bypass pre-push hooks
      --no-verify: Bypass pre-push hooks
      -s, --skip-force-push-protection: Skip force push protection checks
      -f, --with-force&: Force push even if it's not fast-forward. Always on; the flag is kept for compatibility
    documentation:
      command: |-
        Create a new review for a branch, force-pushing it first.

        If the branch is part of a stack, or of a linked worktree, GitButler pushes that branch and its ancestors, including the branches a worktree rests on, and creates missing reviews from the bottom upward. It also updates stack metadata using native GitHub stacks when enabled and supported, or review descriptions otherwise.
  - name: auto-merge
    description: Enable or disable the automatic merging of reviews
    flags:
      -h, --help: Print help (see more with '--help')
      -d, --off: Disable automatic merging instead of enabling it
  - name: set-draft
    description: Mark existing reviews as draft
    flags:
      -h, --help: Print help (see more with '--help')
  - name: set-ready
    description: Mark existing reviews as ready for review
    flags:
      -h, --help: Print help (see more with '--help')
  - name: template
    description: Configure the template to use for review descriptions
    flags:
      -h, --help: Print help (see more with '--help')
- name: absorb
  description: Amend uncommitted changes into the commits they belong to
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    --dry-run: Show the absorption plan without making any changes
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Amend uncommitted changes into the commits they belong to.

      The semantic for finding "the appropriate commit" is as follows:

      - If a change has a dependency to a particular commit, it will be amended into that particular commit
      - If a change is assigned to a branch in the GitButler app, it will be amended into a commit there
      - If there are no commits on that branch, a new commit is created there
      - Changes are amended into the topmost commit of the leftmost (first) branch

      Optionally an identifier to an Uncommitted File may be provided.

      - If an Uncommitted File id is provided, absorb will be performed for just that file
      - If no source is provided, absorb is performed for all uncommitted changes

      If --dry-run is specified, no changes will be made; instead, the absorption plan (what changes would be absorbed by which commits) will be shown.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
- name: reword
  description: Edit the commit message of the specified commit
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    --diff: Always show diff inside the editor
    -f, --fix-formatting: Format the existing commit message to 72-char line wrapping without opening an editor
    -h, --help: Print help (see more with '--help')
    -m, --message=: The new commit message or branch name. Without it, a terminal opens the editor and a non-interactive run fails
    --no-diff: Never show the diff inside the editor
  documentation:
    command: |-
      Edit the commit message of the specified commit.

      You can easily change the commit message of any of your commits by running but reword <commit-id> and providing a new message in the editor.

      This will recreate the commit with the new message and then rebase any dependent commits on top of it.

      You can also use but reword <branch-id> to rename the branch, or but reword <anonymous-branch-id> to give an anonymous branch a name.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
      diff: |-
        Always show diff inside the editor.

        By default the diff will be shown unless it's large. The diff will always be shown if --diff is passed, regardless of the size of the diff.
- name: uncommit
  description: Move commits, branches, or committed changes back into the uncommitted area
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Move commits, branches, or committed changes back into the uncommitted area.

      For more details about CLI IDs, see but help cli-ids.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
- name: amend
  description: Amend uncommitted changes into a commit or branch
  flags:
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -h, --help: Print help (see more with '--help')
    -t, --target!=: The commit to amend into; a branch means its newest commit
  documentation:
    command: |-
      Amend uncommitted changes into a commit or branch.

      Sources must be uncommitted files or hunks. To move changes that are already committed, or to combine commits, use but squash.

      If the target is a branch, the changes are amended into that branch's newest commit (its tip). Name the commit explicitly to amend into anything below the tip.

      For more details about CLI IDs, see but help cli-ids.
    flag:
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
- name: oplog
  description: Commands for viewing and managing operation history
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Commands for viewing and managing operation history.

      Displays a list of past operations performed in the repository, including their timestamps and descriptions.

      This allows you to restore to any previous point in the history of the project. All state is preserved in operations, including uncommitted changes.

      You can use but oplog restore <oplog-sha> to restore to a specific state.

      By default, shows the last 20 oplog entries (same as but oplog list).
  commands:
  - name: list
    description: List operation history
    flags:
      -h, --help: Print help (see more with '--help')
      --since=: Start from this oplog SHA instead of the head
      -s, --snapshot: Show only on-demand snapshot entries
    documentation:
      command: |-
        List operation history.

        Displays a list of past operations performed in the repository, including their timestamps and descriptions.

        This allows you to restore to any previous point in the history of the project. All state is preserved in operations, including uncommitted changes.

        You can use but oplog restore <oplog-sha> to restore to a specific state.
  - name: snapshot
    description: Create an on-demand snapshot with optional message
    flags:
      -h, --help: Print help (see more with '--help')
      -m, --message=: Message to include with the snapshot
    documentation:
      command: |-
        Create an on-demand snapshot with optional message.

        This allows you to create a named snapshot of the current state, which can be helpful to always be able to return to a known good state.

        You can provide an optional message to describe the snapshot.
  - name: restore
    description: Restore to a specific oplog snapshot
    flags:
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        Restore to a specific oplog snapshot.

        This command allows you to revert the repository to a previous state captured in an oplog snapshot.

        You need to provide the SHA of the oplog entry you want to restore to, which you can find by running but oplog or but oplog list.
- name: undo
  description: Undo the last operation
  flags:
    -h, --help: Print help (see more with '--help')
- name: redo
  description: Redo the last undo
  flags:
    -h, --help: Print help (see more with '--help')
- name: setup
  description: Explain that setup is no longer required
  hidden: true
  flags:
    -h, --help: Print help (see more with '--help')
    --init: Report an error with a hint to use but init instead
- name: teardown
  description: Exit GitButler mode and return to normal Git workflow
  flags:
    -c, --checkout-to=: Explicit override for which local branch to checkout to
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |
      Exit GitButler mode and return to normal Git workflow.

      This command:

      - Creates an oplog snapshot of the current state
      - Finds the first active branch and checks it out
        - Alternatively, use --checkout-to <branch> to override this default
      - Cherry-picks any dangling commits from gitbutler/workspace
      - Provides instructions on how to return to GitButler mode

      This is useful when you want to temporarily or permanently leave GitButler management and work with standard Git commands.

      Examples

      Exit GitButler mode:

        but teardown

        but teardown --checkout-to my-feature-branch
- name: gui
  aliases:
  - .
  description: Open the GitButler GUI for the current project
  flags:
    -h, --help: Print help (see more with '--help')
    -n, --new-window: Open the project in a new application window
  completion:
    positional:
    - - $files
  documentation:
    command: |-
      Open the GitButler GUI for the current project.

      Running but gui will launch the GitButler graphical user interface in the current directory's GitButler project.

      This provides a visual way to manage branches, commits, and uncommitted changes, complementing the command-line interface.

      You can also just run but . as a shorthand to open the GUI.
- name: tui
  description: Open a live terminal workspace for branches, commits, changes, and diffs
  flags:
    --diff: Automatically show the diff when opening the TUI
    -h, --help: Print help (see more with '--help')
    --remember-selection: When the TUI quits save the selection and restore it when re-opening
  documentation:
    command: |-
      Open a live terminal workspace for branches, commits, changes, and diffs.

      The GitButler TUI provides a visual experience similar to the GitButler GUI - right in your terminal. For the full workflow and key bindings, see https://docs.gitbutler.com/gitbutler-tui

      Environment variables:

      BUT_THEME  Sets the theme for but. Options: dark, light. [default: detected from the terminal, falling back to dark]
    flag:
      remember-selection: |-
        When the TUI quits save the selection and restore it when re-opening.

        If the saved selection cannot be restored, the TUI launches normally as if --remember-selection wasn't passed.
- name: clean
  description: Remove empty branches from the workspace
  flags:
    --dry-run: Preview which branches would be removed without actually deleting them
    -h, --help: Print help (see more with '--help')
    --include-upstream: Also remove branches that have upstream-only commits but no local commits or changes
    --pull: Pull latest changes from the remote before cleaning
  documentation:
    command: |
      Remove empty branches from the workspace.

      A branch is considered empty if it has no local commits and (by default) no upstream-only commits. Stacks with uncommitted changes assigned to them in the GitButler app are skipped entirely.

      The entire operation is recorded as a single oplog entry, so it can be undone with but undo.

      Examples

      Remove all empty branches:

        but clean

      Preview which branches would be removed:

        but clean --dry-run

      Pull latest changes first, then clean:

        but clean --pull

      Also remove branches that only have upstream commits:

        but clean --include-upstream
- name: update
  description: Manage GitButler CLI and app updates
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Manage GitButler CLI and app updates.

      Check for new versions, install updates, or suppress update notifications.
  commands:
  - name: check
    description: Check if a new version of the GitButler CLI is available
    flags:
      -h, --help: Print help (see more with '--help')
  - name: suppress
    description: Suppress update notifications temporarily
    flags:
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |-
        Suppress update notifications temporarily

        Hide update notifications for the specified number of days (1-30). Useful when you want to stay on a specific version temporarily.
  - name: install
    description: Install or update the GitButler desktop application
    flags:
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |
        Install or update the GitButler desktop application.

        By default, auto-detects your current channel (release/nightly) and installs the latest version for that channel.

        macOS: Installs the full GitButler desktop application. The CLI (but) is included with the app and will also be updated.

        Linux: Installs and updates only the CLI itself.

        Note: For other platforms and install forms, see https://gitbutler.com/downloads

        Examples

          but update install           # Auto-detect channel and install latest
          but update install nightly   # Install latest nightly build
          but update install release   # Install latest stable release
          but update install 0.18.7    # Install specific version
- name: alias
  description: Manage command aliases
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |
      Manage command aliases.

      Aliases allow you to create shortcuts for commonly used commands. They are stored in git config under the but.alias.* namespace.

      Examples

      List all configured aliases:

        but alias

      Create a new alias:

        but alias add st status
        but alias add stv "status --verbose"

      Remove an alias:

        but alias remove st
  commands:
  - name: list
    description: List all configured aliases (default)
    flags:
      -h, --help: Print help (see more with '--help')
  - name: add
    description: Add a new alias
    flags:
      -g, --global: Store the alias globally (in ~/.gitconfig) instead of locally
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |
        Add a new alias

        Creates a new alias that expands to the given command.

        Examples

          but alias add st status
          but alias add stv "status --verbose"
          but alias add branches "branch list --all"
  - name: remove
    aliases:
    - rm
    description: Remove an existing alias
    flags:
      -g, --global: Remove from global config (in ~/.gitconfig) instead of local
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |
        Remove an existing alias

        Examples

          but alias remove st
          but alias remove co --global
- name: config
  description: View and manage GitButler configuration
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |
      View and manage GitButler configuration.

      Without a subcommand, displays an overview of important settings including user information, target branch, forge configuration, and AI setup.

      Examples

      View configuration overview:

        but config

      View/set user configuration:

        but config user
        but config user set name "John Doe"
        but config user set email john@example.com

      View/set forge configuration:

        but config forge

      View/set target branch:

        but config target
        but config push-remote

      View/set metrics:

        but config metrics
  commands:
  - name: user
    description: View and configure user information (name, email, editor)
    flags:
      -h, --help: Print help (see more with '--help')
    documentation:
      command: |
        View and configure user information (name, email, editor).

        Without arguments, displays current user.name, user.email, and core.editor. Use subcommands to set or unset configuration values.

        Examples

        View user configuration:

          but config user

        Set user name (locally):

          but config user set name "John Doe"

        Set user email globally:

          but config user set --global email john@example.com

        Unset a local value:

          but config user unset name
    commands:
    - name: set
      description: Set a user configuration value
      flags:
        -g, --global: Set the configuration globally instead of locally
        -h, --help: Print help (see more with '--help')
      completion:
        positional:
        - - "name\tGit user name (user.name)"
          - "email\tGit user email (user.email)"
          - "editor\tGit editor (core.editor)"
      documentation:
        command: |
          Set a user configuration value.

          Examples

            but config user set name "John Doe"
            but config user set --global email john@example.com
    - name: unset
      description: Unset (remove) a user configuration value
      flags:
        -g, --global: Unset the global configuration instead of local
        -h, --help: Print help (see more with '--help')
      completion:
        positional:
        - - "name\tGit user name (user.name)"
          - "email\tGit user email (user.email)"
          - "editor\tGit editor (core.editor)"
      documentation:
        command: |
