- name: pick
  description: Cherry-pick commits into an applied branch
  flags:
    -A, --above=: Place the picked commits above BRANCH_OR_COMMIT
    --allow-merged: Allow targeting branches and commits that are already merged upstream
    -B, --below=: Place the picked commits below BRANCH_OR_COMMIT
    -b, --branch=: Place the picked commits on the branch BRANCH
    -h, --help: Print help (see more with '--help')
    -s, --switch: Switch to the target branch instead of remaining in the GitButler workspace
  documentation:
    command: |-
      Cherry-pick commits into an applied branch.

      Each source commit is copied to the target location as a new commit.

      Run from a linked worktree, the commits are placed at the tip of that worktree's branch. Otherwise, if there are no branches applied, a new branch is created for the picked commits. If there is only one stack of branches applied, the commits are placed at the tip of that stack. Otherwise, the targeting flags --above, --below, and --branch control where the commits are placed. --above and --below are mutually exclusive; combine either with --branch to name a new branch when targeting a branch.

      For more details about CLI IDs, see but help cli-ids.
    flag:
      above: |-
        Place the picked commits above BRANCH_OR_COMMIT.

        If BRANCH_OR_COMMIT is a commit, the picked commits are placed on the same branch as the targeted commit.

        If BRANCH_OR_COMMIT is a branch, the picked commits are placed on a new branch above the targeted branch. Use --branch <NAME> to name it; otherwise a name is generated.
      allow-merged: |-
        Allow targeting branches and commits that are already merged upstream.

        By default, mutations refuse to touch history that has landed in the target branch, since the results tend to conflict on the next but pull.
      below: |-
        Place the picked commits below BRANCH_OR_COMMIT.

        If BRANCH_OR_COMMIT is a commit, the picked commits are placed on the same branch as the targeted commit.

        If BRANCH_OR_COMMIT is a branch, the picked commits are placed on a new branch below the targeted branch. Branches are treated as buckets, meaning that "below a branch" is treated as below the oldest ancestor on that branch. Use --branch <NAME> to name the new branch; otherwise a name is generated.
      branch: |-
        Place the picked commits on the branch BRANCH.

        With --above or --below, name the new branch created relative to the target branch. The name must not already exist; omit it for a generated name. Cannot be combined with commit or worktree targets.

        Otherwise, if BRANCH does not exist, it is created as an unstacked branch. If BRANCH is omitted, an unstacked branch with a generated name is created.

        Attempting to pick onto a branch that exists but is not applied is an error.
- name: switch
  description: Switch to a local branch or the GitButler workspace
  hidden: true
  flags:
    -h, --help: Print help (see more with '--help')
    -w, --workspace: Switch back to the GitButler workspace
  documentation:
    command: |
      Switch to a local branch or the GitButler workspace.

      Runs Git's post-checkout hooks after a successful switch. Hook failure reports an error but leaves the checkout in place.

      Examples

      Switch to a branch:

        but switch my-feature

      Show a fuzzy branch picker:

        but switch

      Switch back to the GitButler workspace:

        but switch --workspace
- name: skill
  description: Manage AI agent skills for GitButler
  flags:
    --full: Also print every reference document after the core guide
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |
      Manage AI agent skills for GitButler.

      Skills provide enhanced AI capabilities for working with GitButler through Claude Code, Codex, and other AI assistants.

      Use but skill install to install the GitButler skill files. By default, it prompts for scope (repository or global home directory) and then format. When run outside a git repository, local scope is unavailable and the default install location is global (home directory). You can still install to a custom location with --path using an absolute or ~ path.

      Examples

      Install interactively (prompts for scope and format):

        but skill install

      Install the skill globally:

        but skill install --global
  commands:
  - name: reference
    description: 'Print the command reference: syntax and flags for every but command'
    flags:
      -h, --help: Print help (see more with '--help')
  - name: concepts
    description: 'Print the concepts guide: the workspace model behind but'
    flags:
      -h, --help: Print help (see more with '--help')
  - name: examples
    description: Print the workflow examples
    flags:
      -h, --help: Print help (see more with '--help')
  - name: install
    description: Install the GitButler CLI skill files for Coding agents
    flags:
      -d, --detect: Refresh existing installations in place, updating every GitButler skill found in the current scope (local before global)
      -g, --global: Install the skill globally instead of in the current repository
      -h, --help: Print help (see more with '--help')
      -p, --path=: Custom path where to install the skill (relative to repository root or absolute). Outside a repository, relative paths require --global
      --stub&: Install a discovery stub that points agents at but skill instead of the full skill files. Team-internal while the approach is evaluated
    documentation:
      command: |
        Install the GitButler CLI skill files for Coding agents

        By default, the command prompts you to choose installation scope first (current repository or global home directory), then prompts you to select a skill folder format (Agent Skills / .agents, Claude Code, OpenCode, Codex, GitHub Copilot, Cursor, Windsurf, Poolside) unless you specify a custom path with --path. When run outside a git repository, local scope is unavailable and the default install location is global (home directory). You can still install to a custom location with --path using an absolute or ~ path.

        Use --global to install the skill in a global location instead of the current repository.

        In non-interactive mode, a detected agent uses its global skill directory; otherwise specify --path or --detect.

        Examples

        Install interactively (prompts for scope and format):

          but skill install

        Install globally (prompts for format):

          but skill install --global

        Install to a custom path:

          but skill install --path .agents/skills/gitbutler

        Auto-detect installation location (update existing installations):

          but skill install --detect
  - name: check
    description: Check if installed GitButler skills are up to date with the CLI version
    flags:
      -g, --global: Only check global installations (in home directory)
      -h, --help: Print help (see more with '--help')
      -l, --local: Only check local installations (in current repository)
      -u, --update: Automatically update any outdated skills found
    documentation:
      command: |
        Check if installed GitButler skills are up to date with the CLI version

        Scans for installed skill files and compares their version with the current CLI version. By default, checks both local (repository) and global installations.

        Examples

        Check all installed skills:

          but skill check

        Check and automatically update outdated skills:

          but skill check --update

        Check only global installations:

          but skill check --global
