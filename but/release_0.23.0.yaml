          but config forge

        Authenticate with a forge:

          but config forge auth

        List authenticated accounts:

          but config forge list-users

        Forget an account:

          but config forge forget username

        View or configure native GitHub stacked pull requests:

          but config forge github-stacks
          but config forge github-stacks enable
    commands:
    - name: auth
      description: Authenticate with the forge (GitHub, GitLab, or Bitbucket)
      flags:
        -h, --help: Print help (see more with '--help')
      documentation:
        command: |-
          Authenticate with the forge (GitHub, GitLab, or Bitbucket).

          This will guide you through the authentication process using either: GitHub

          - Device flow (OAuth)
          - Personal Access Token (PAT)
          - GitHub Enterprise

          GitLab

          - Personal Access Token (PAT)
          - Self-Hosted

          Bitbucket

          - Atlassian API token with scopes (read:user:bitbucket, read:repository:bitbucket, read:pullrequest:bitbucket, write:pullrequest:bitbucket)
    - name: list-users
      description: List authenticated forge accounts known to GitButler
      flags:
        -h, --help: Print help (see more with '--help')
      documentation:
