# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: fury
description: Command line interface to Gemfury API
persistentflags:
  --api-token=: Authentication token; - reads it from stdin (or set FURY_TOKEN)
  --no-input: Never ask; fail where input is needed
  --no-progress: Do not show progress bars and spinners
  --timeout=: Give up on a request after this long (default 30s, or 10m for an upload or download)
  -a, --account=: Account to act on, if not your own (or set FURY_ACCOUNT)
  -q, --quiet: Show only results, warnings, and errors
  -y, --yes: Answer yes to every confirmation
commands:
  - name: accounts
    description: Listing of your collaborations
    flags:
      --json: Print the result as JSON
    documentation:
      command: |-
        List the accounts that you collaborate on, each of which
        can be given to --account.
  - name: beta
    description: Experimental features
    hidden: true
    commands:
      - name: backup DIR
        description: Save all files to a directory
        flags:
          --kind=: 'Filter to one kind of package: ruby, js, python, php, deb, rpm, bower, nuget, maven, go'
      - name: download PACKAGE@VERSION...
        description: Download a package to the current directory
  - name: git
    description: Git repository commands
    commands:
      - name: config REPO
        description: Configure Git build
        flags:
          --json: Print the result as JSON
        commands:
          - name: get REPO KEY...
            description: Get Git build environment key
            flags:
              --json: Print the result as JSON
          - name: set REPO KEY=VAL...
            description: Set Git build environment key
          - name: unset REPO KEY...
            description: Remove Git build environment key
        documentation:
          command: |-
            List the build environment of a Git repository,
            or get, set, and unset its keys.
      - name: credentials OPERATION
        description: Give the saved session to Git, as its credential helper
        hidden: true
        documentation:
          command: |-
            Give the saved session to Git, as its credential helper for git.fury.io.
            Git runs this by itself, once "fury login" has saved a session in the
            system keychain. The operation is "get": any other is ignored.
      - name: destroy REPO
        aliases:
          - reset
        description: Remove Git repository
        flags:
          --reset-only: Reset repo without destroying
          -f, --force: Skip confirmation
        documentation:
          command: |-
            Remove Git repository, once confirmed. As "reset", or with
            --reset-only, the repository is reset and not removed.
      - name: list
        description: List repos in this account
        flags:
          --json: Print the result as JSON
      - name: rebuild REPO
        description: Run the builder on the repo
        flags:
          -r, --revision=: 'Revision to build: a branch, a tag, or a commit'
      - name: rename REPO NEWNAME
        description: Rename a Git repository
      - name: stack REPO
        description: Configure Git stack
        flags:
          --json: Print the result as JSON
        commands:
          - name: set REPO STACK
            description: Set Git stack for repo
            documentation:
              command: Set Git stack for repo, to one that "fury git stack REPO" lists.
        documentation:
          command: |-
            List the stacks that a repository can be built on, marking
            the current one, or set another.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type fury help [path to command] for full details.
  - name: login
    description: Authenticate into Gemfury account
    flags:
      --interactive: Login by email and password, not by the browser
    documentation:
      command: |-
        Authenticate into Gemfury account, and save the session for the
        commands that follow. Login is by the browser, or with --interactive
        by email and password at the terminal.

        The session is saved in the system keychain, and Git is set to ask this
        CLI for it when it authenticates with git.fury.io. Without a keychain,
        it is saved in the .netrc file instead.

        With --api-token, that token is verified and saved as the session, in
        place of any saved before. With --api-token -, it is read from stdin, or
        asked for at the terminal. With FURY_TOKEN alone, it is verified and
        nothing is saved.
  - name: logout
    description: Clear CLI session credentials
  - name: packages
    aliases:
      - list
    description: List packages in this account
    flags:
      --json: Print the result as JSON
  - name: push FILE...
    description: Upload a new version of a package
    flags:
      --public: Create as public package
  - name: sharing
    description: Collaboration commands
    flags:
      --json: Print the result as JSON
    commands:
      - name: add EMAIL...
        description: Add a collaborator
        flags:
          --role=: 'Collaborator role: pull, push, or owner'
      - name: remove EMAIL...
        description: Remove a collaborator
    documentation:
      command: List the collaborators of this account, or add and remove them.
  - name: versions PACKAGE
    description: List versions for a package
    flags:
      --json: Print the result as JSON
  - name: whoami
    description: Show current account
    flags:
      --json: Print the result as JSON
  - name: yank PACKAGE@VERSION...
    description: Remove a package version
    flags:
      -f, --force: Skip confirmation
      -v, --version=: Version, for a PACKAGE given without one
    documentation:
      command: |-
        Remove a package version, once confirmed.

        If packages of different kinds share a name, prefix the kind, as
        KIND:PACKAGE@VERSION. The kinds are:
          ruby, js, python, php, deb, rpm, bower, nuget, maven, go
documentation:
  command: |-
    Manage the packages, collaborators, and Git repositories of a Gemfury
    account. See https://gemfury.com/help/gemfury-cli

    Commands act on your own account, or on the one given by --account.
    They authenticate by --api-token, or else by FURY_TOKEN, or else by
    the session that "fury login" has saved. With --api-token -, the token
    is read from stdin, or asked for at the terminal, so it is not in the
    command line.

    Environment variables:
      FURY_TOKEN     Authentication token, unless --api-token is given
      FURY_ACCOUNT   Account to act on, unless --account is given
      FURY_RETRIES   Times a request that reads is sent again (default 3)

    Without a terminal, or with --no-input, nothing is asked: pass --yes
    to confirm, and set FURY_TOKEN to authenticate.

    With --quiet, only results, warnings, and errors are shown: the exit
    status tells whether a change was made.

    A request that reads is sent again when it is rate limited, the server
    is unavailable, or the connection fails: FURY_RETRIES times, after a
    wait of a few seconds, or as long as the server asks. A request that
    takes longer than --timeout fails with exit status 6.

    With --json, on the commands whose help lists it, the result is printed
    as JSON on stdout, and nothing else is. Every field of a record is
    printed, empty when the API does not provide it. Errors are as without
    it, and nothing is asked.

    Exit status:
      0   Success
      1   Any other error
      2   Usage: check the arguments and flags, or confirm with --yes
      3   Not found
      4   Not authenticated
      5   Already exists
      6   Unavailable: try again later
      130 Interrupted, or 143 when terminated
