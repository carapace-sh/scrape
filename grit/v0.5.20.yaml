# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: grit
description: A simple Grit-powered CLI
flags:
  -h, --help: Print help (see more with '--help')
  -v, --version: Print version
  -V&: Print version
persistentflags:
  --filter=: jq-like expression applied to JSON output (requires `--json`)
  --json: Emit machine-readable JSON instead of human-readable text
  --markdown: Emit agent-friendly Markdown instead of human-readable text
  --threads=: Worker threads for parallel library work (`0` = auto, `1` = serial)
documentation:
  flag:
    filter: |-
      jq-like expression applied to JSON output (requires `--json`).

      Examples: `.branch`, `.commits[].oid`, `{branch, clean}`.
    help: Print help (see a summary with '-h')
commands:
- name: init
  description: Create a new, empty repository
  flags:
    --bare: Create a bare repository (no working tree)
    -h, --help: Print help (see more with '--help')
    -b, --initial-branch=: Initial branch name (overrides `init.defaultBranch` from config)
    --object-format=: Object hash algorithm for the new repository (default SHA-1; omitted on reinit preserves format)
    --ref-format=:
      description: Ref storage backend for the new repository
      default: files
    --separate-git-dir=: Place the git directory here and link from the work tree via a gitfile
  completion:
    flag:
      separate-git-dir:
      - $files
- name: clone
  description: Copy a remote repository into a new directory
  flags:
    --bare: Create a bare repository (`git clone --bare`)
    --blobs=: 'Partial clone: omit blobs (`none`) or blobs at/above a size (`1k`, `512`, …)'
    -b, --branch=: Branch or tag to check out instead of the remote default
    --depth=: Truncate fetched history to this many commits (`git clone --depth`)
    -h, --help: Print help (see more with '--help')
    --no-checkout: Do not check out the default branch (`git clone --no-checkout`)
    --no-single-branch: Fetch all branch tips even when `--shallow` is set (`git clone --no-single-branch`)
    --no-tags: Do not fetch any tags from the remote
    -o, --origin=: Name for the remote (default `origin`)
    --shallow&: Shallow clone of the fetched ref (`git clone --depth=1`; hidden alias)
    --single-branch: Fetch only the branch checked out (same as `git clone --single-branch`)
- name: remote
  description: Subcommands of `grit remote`
  flags:
    -h, --help: Print help (see more with '--help')
    -v, --verbose: Show fetch and push URLs (like `git remote -v`)
  commands:
  - name: add
    description: Add a new remote
    flags:
      --fetch: Fetch from the remote after adding it
      -h, --help: Print help (see more with '--help')
  - name: set-url
    description: Set the fetch or push URL for an existing remote
    flags:
      --dry-run: Show what would change without writing config
      -h, --help: Print help (see more with '--help')
      --push: Update `pushurl` instead of `url`
  - name: remove
    description: Remove a remote and its remote-tracking refs
    flags:
      --dry-run: Report changes without writing config or refs
      -h, --help: Print help (see more with '--help')
  - name: prune
    description: Delete stale remote-tracking refs without fetching
    flags:
      --dry-run: Report refs that would be pruned without deleting them
      -h, --help: Print help (see more with '--help')
  - name: set-head
    description: Set or delete `refs/remotes/<name>/HEAD`
    flags:
      --auto: Query the remote and set HEAD from its default branch
      --delete: Delete the local HEAD symref
      --dry-run: Show what would change without updating refs
      -h, --help: Print help (see more with '--help')
  - name: show
    description: Summarize a remote (URLs, branches, pull config)
    flags:
      -h, --help: Print help (see more with '--help')
      -n, --limit=: Return at most this many remote branches
      --no-query: Use local remote-tracking refs only; do not contact the remote
  - name: rename
    description: Rename an existing remote
    flags:
      --dry-run: Show what would change without writing the repository
      -h, --help: Print help (see more with '--help')
  - name: refs
    description: List references on a remote (like `git ls-remote`)
    flags:
      --heads: Only show refs under `refs/heads/`
      -h, --help: Print help (see more with '--help')
      -n, --limit=: Return at most this many refs after sorting
      --reverse: Reverse sort order (`git ls-remote --sort=-…`)
      --sort=:
        description: Sort refs by `name` or `version` (`git ls-remote --sort=version:refname`)
        default: name
      --tags: Only show refs under `refs/tags/`
    completion:
      flag:
        sort:
        - "name\tFull ref name order"
        - "version\tNumeric `version:refname` order"
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: add
      description: Add a new remote
    - name: set-url
      description: Set the fetch or push URL for an existing remote
    - name: remove
      description: Remove a remote and its remote-tracking refs
    - name: prune
      description: Delete stale remote-tracking refs without fetching
    - name: set-head
      description: Set or delete `refs/remotes/<name>/HEAD`
    - name: show
      description: Summarize a remote (URLs, branches, pull config)
    - name: rename
      description: Rename an existing remote
    - name: refs
      description: List references on a remote (like `git ls-remote`)
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: log
  description: 'Mutually exclusive diff output formats (default: patch for `grit diff`; none for `grit log`)'
  flags:
    -G=: Keep commits whose added/removed lines match this pattern (`git log -G`)
    -S=: Keep commits where occurrence count of this string changed (`git log -S`)
    --after=: Alias for `--since`
    --all: Include every ref tip
    --all-match: Require every `--grep` pattern to match
    --author=*: Limit to commits whose author matches this pattern (repeatable; OR together)
    --before=: Alias for `--until` (date cutoff)
    --branches=: Include branch tips, or those matching an optional glob
    --committer=*: Limit to commits whose committer matches this pattern (repeatable; OR together)
    --count: With `--group-by`, omit per-commit lists in `--json` output
    --cursor=: Continue a paged walk using the opaque `next` token from a previous page
    --decorate: Show branch and tag names that point at each commit
    --first-parent: Follow only the first parent at merges
    -F, --fixed-strings: Treat `--author`, `--committer`, and `--grep` patterns as fixed strings
    -W, --function-context: Expand hunks to enclosing function boundaries (Git `-W` / `--function-context`)
    --graph: Draw an ASCII commit graph in human output (implies topological order)
    --graph-unicode: Use Unicode box-drawing characters in `--graph` output (human only)
    --grep=*: Limit to commits whose message matches this pattern (repeatable; OR unless `--all-match`)
    --group-by=: Aggregate commits (`author` matches `git shortlog -sne` ordering)
    -h, --help: Print help (see more with '--help')
    --invert-grep: Invert `--grep` matching (commits that do not match the grep group)
    -n, --limit=: Maximum number of rows to list
    --max-count=: Maximum number of rows to list
    --merges: Include only merge commits
    --name-only: Paths only, one per line
    --name-status: Status letter and path(s) per line
    --no-mailmap: Do not apply `.mailmap` when matching `--author` or `--committer`
    --no-merges: Exclude merge commits
    --numstat: Machine-readable `insertions<TAB>deletions<TAB>path` lines
    --oneline: 'One line per commit: short oid and subject (refs when `--decorate`)'
    -p, --patch: Unified patch for each commit (`git log -p`)
    --patch-text: Git-apply-compatible unified patch (`git diff --binary` shape); not combinable with `--json`
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --pickaxe-regex: Treat `-S` as a BRE instead of a literal string (`--pickaxe-regex`)
    -i, --regexp-ignore-case: Case-insensitive pattern matching for `--author`, `--committer`, and `--grep`
    --remotes=: Include remote-tracking tips, or those matching an optional glob
    --reverse: Reverse commit order (oldest first)
    --shortstat: Only the summary line (`N files changed, …`)
    --since=: Exclude commits older than this date (Git `--since`)
    --skip=:
      description: Skip this many commits after ordering
      default: '0'
    --stat: Summary with change bars per file (like `git diff --stat`)
    --tags=: Include tag tips, or those matching an optional glob
    -U, --unified=: Lines of context around each change (Git `-U`)
    --until=: Exclude commits newer than this date (Git `--until`)
  completion:
    flag:
      group-by:
      - author
- name: revs
  description: Like [`PathspecArgs`], but paths are trailing (after other positionals)
  flags:
    -G=: Keep commits whose added/removed lines match this pattern (`git log -G`)
    -S=: Keep commits where occurrence count of this string changed (`git log -S`)
    --after=: Alias for `--since`
    --all: Include every ref tip
    --all-match: Require every `--grep` pattern to match
    --author=*: Limit to commits whose author matches this pattern (repeatable; OR together)
    --before=: Alias for `--until` (date cutoff)
    --branches=: Include branch tips, or those matching an optional glob
    --committer=*: Limit to commits whose committer matches this pattern (repeatable; OR together)
    --count: Print only the number of reachable commits
    --first-parent: Follow only the first parent at merges
    -F, --fixed-strings: Treat `--author`, `--committer`, and `--grep` patterns as fixed strings
    --grep=*: Limit to commits whose message matches this pattern (repeatable; OR unless `--all-match`)
    -h, --help: Print help (see more with '--help')
    --invert-grep: Invert `--grep` matching (commits that do not match the grep group)
    --left-right: With `--count`, print left/right counts for a symmetric range (`A...B`)
    -n, --limit=: Maximum number of rows to list
    --max-count=: Maximum number of rows to list
    --merges: Include only merge commits
    --no-mailmap: Do not apply `.mailmap` when matching `--author` or `--committer`
    --no-merges: Exclude merge commits
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --pickaxe-regex: Treat `-S` as a BRE instead of a literal string (`--pickaxe-regex`)
    -i, --regexp-ignore-case: Case-insensitive pattern matching for `--author`, `--committer`, and `--grep`
    --remotes=: Include remote-tracking tips, or those matching an optional glob
    --reverse: Reverse commit order (oldest first)
    --since=: Exclude commits older than this date (Git `--since`)
    --skip=:
      description: Skip this many commits after ordering
      default: '0'
    --tags=: Include tag tips, or those matching an optional glob
    --until=: Exclude commits newer than this date (Git `--until`)
- name: merge-base
  description: Find merge bases or test whether one commit is an ancestor of another
  flags:
    --all: List every minimal merge base (criss-cross histories)
    -h, --help: Print help (see more with '--help')
    --is-ancestor: Exit 0 when `a` is an ancestor of `b`, 1 otherwise; prints nothing in human mode
- name: reflog
  description: Subcommands of `grit reflog`
  flags:
    --after=: Alias for `--since`
    --before=: Alias for `--until`
    --grep=: Keep entries whose message contains this substring (case-sensitive)
    -h, --help: Print help (see more with '--help')
    -n, --max-count=: Show at most this many entries (newest first)
    --limit=&: Show at most this many entries (newest first)
    --since=: Exclude entries older than this date (Git `--since`)
    --until=: Exclude entries newer than this date (Git `--until`)
  commands:
  - name: delete
    description: Remove one or more reflog entries (`ref@{n}`)
    flags:
      -h, --help: Print help (see more with '--help')
  - name: expire
    description: Drop reflog entries older than configured or explicit cutoffs
    flags:
      --all: Process every ref under `refs/`, not only refs that already have log files
      --dry-run: Report what would be pruned without rewriting reflog files
      --expire=: Expire reachable entries older than this (Git `--expire` syntax)
      --expire-unreachable=: Expire unreachable entries older than this
      -h, --help: Print help (see more with '--help')
  - name: list
    description: List refs that currently have a reflog
    flags:
      -h, --help: Print help (see more with '--help')
      -n, --limit=: Return at most this many ref names (sorted)
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: delete
      description: Remove one or more reflog entries (`ref@{n}`)
    - name: expire
      description: Drop reflog entries older than configured or explicit cutoffs
    - name: list
      description: List refs that currently have a reflog
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: blame
  description: Show who last modified each line of a file
  flags:
    -C, --copy-detection*: Detect lines copied from other files (`git blame -C`; repeat up to three times)
    --first-parent: At merge commits, follow only the first parent (Git's `--first-parent`)
    --group: With `--json`, emit grouped `hunks[]` instead of per-line `lines[]`
    -h, --help: Print help (see more with '--help')
    -w, --ignore-all-space: Ignore whitespace when comparing lines (`git blame -w`)
    --ignore-rev=*: Ignore this revision when attributing lines (repeatable)
    --ignore-revs-file=*: Read revision oids to ignore from a file (repeatable; `""` clears prior entries)
    -L, --lines=: Limit output with a Git-style line range (`-L` / `--lines`)
    --rev=: Blame at this revision instead of `HEAD`
- name: diff
  description: Line-diff and tree-diff formatting flags (`-M`, `--diff-algorithm`, filters)
  flags:
    --against=: Compare the worktree to this ref's tree instead of HEAD (no commit arguments)
    --diff-algorithm=: Line diff algorithm (overrides `diff.algorithm`)
    --diff-filter=: 'Limit output to these change types (Git letter syntax: `ADMR…`)'
    --exit-code: Exit with 1 when there are changes (errors exit 2)
    -M, --find-renames?: Detect renames; optional similarity threshold (`50` default, or `50%`). Use `-M`, `-M30`, or `--find-renames` / `--find-renames=30` (long form requires `=` when a threshold is given)
    -W, --function-context: Expand hunks to enclosing function boundaries (Git `-W` / `--function-context`)
    -h, --help: Print help (see more with '--help')
    -w, --ignore-all-space: Ignore whitespace when comparing lines (`git diff -w`)
    --ignore-blank-lines: Ignore changes whose lines are all blank (`git diff --ignore-blank-lines`)
    -b, --ignore-space-change: Ignore changes in the amount of whitespace (`git diff -b`)
    --name-only: Paths only, one per line
    --name-status: Status letter and path(s) per line
    --no-index: Compare two filesystem paths outside any repository (like `git diff --no-index`)
    --no-renames: Do not detect renames
    --numstat: Machine-readable `insertions<TAB>deletions<TAB>path` lines
    -p, --patch: Unified patch for each commit (`git log -p`)
    --patch-text: Git-apply-compatible unified patch (`git diff --binary` shape); not combinable with `--json`
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --quiet: Print nothing; implies `--exit-code`
    --shortstat: Only the summary line (`N files changed, …`)
    -S, --staged: Staged changes only (index vs HEAD)
    --cached: Staged changes only (index vs HEAD)
    --stat: Summary with change bars per file (like `git diff --stat`)
    -U, --unified=: Lines of context around each change (Git `-U`)
    --unstaged: Unstaged changes only (worktree vs index)
- name: show
  description: 'Mutually exclusive diff output formats (default: patch for `grit diff`; none for `grit log`)'
  flags:
    --diff-merges=:
      description: 'Merge commit diffs: `combined` (default) or `first-parent`'
      default: combined
    -W, --function-context: Expand hunks to enclosing function boundaries (Git `-W` / `--function-context`)
    -h, --help: Print help (see more with '--help')
    --name-only: Paths only, one per line
    --name-status: Status letter and path(s) per line
    --numstat: Machine-readable `insertions<TAB>deletions<TAB>path` lines
    -p, --patch: Unified patch for each commit (`git log -p`)
    --patch-text: Git-apply-compatible unified patch (`git diff --binary` shape); not combinable with `--json`
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --shortstat: Only the summary line (`N files changed, …`)
    --stat: Summary with change bars per file (like `git diff --stat`)
    -U, --unified=: Lines of context around each change (Git `-U`)
- name: status
  aliases:
  - st
  description: CLI arguments for `grit status` (also the default when no subcommand is given)
  flags:
    -h, --help: Print help (see more with '--help')
    --ignored: List ignored paths (traditional mode; same set as `git status --ignored`)
    --no-ahead-behind: Skip ahead/behind rev-list walks (also when `status.aheadBehind=false`)
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --short: 'One line per path: two-letter index/worktree code plus path (`??` / `!!` for untracked / ignored)'
    --untracked=: 'How untracked paths are listed: `normal` (default) collapses wholly untracked directories; `all` lists every file; `no` omits untracked paths. When omitted, uses `status.showUntrackedFiles` from config'
- name: shortlog
  aliases:
  - sl
  - ahead
  description: CLI flags for [`run`]
  flags:
    --behind: Also list commits on the target that are not on this branch yet
    -h, --help: Print help (see more with '--help')
    -n, --max-count=:
      description: Maximum commits to list on each side (`ahead`, and with `--behind` the behind list too)
      default: '100'
    --name-only: Paths only, one per line
    --stat: Summary with change bars per file (like `git log --stat`)
    --target=: Compare against this ref or revision instead of the discovered target branch
- name: add
  description: Path arguments plus Git-compatible `--pathspec-from-file` / `--pathspec-file-nul`
  flags:
    --dry-run: Report paths that would be staged without writing the index or object database
    --executable: Mark staged regular files as executable (`100755`) in the index
    -f, --force: Stage paths that would otherwise be rejected as ignored
    -h, --help: Print help (see more with '--help')
    --hunks=*: Stage only the listed hunk ids from `grit diff --json` (comma-separated, repeatable)
    -N, --intent-to-add: Record intent to add (empty index entries) instead of staging file content
    --lines=*: Stage only new-side line ranges from `grit diff --json` (`path:start-end`, repeatable)
    --non-executable: Mark staged regular files as non-executable (`100644`) in the index
    --patch-file=: Apply a unified diff to the index (`git apply --cached`). Use `-` for stdin
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    -U, --unified=: Unified context lines when resolving `--hunks` / `--lines` (match `grit diff -U`; default 3)
    -u, --update: Stage tracked changes only (modified and deleted paths; no untracked files)
- name: rm
  description: Path arguments plus Git-compatible `--pathspec-from-file` / `--pathspec-file-nul`
  flags:
    --cached: Remove from the index only; keep files in the working tree
    --dry-run: List paths that would be removed without changing the index or work tree
    -f, --force: Remove even when paths have local modifications
    -h, --help: Print help (see more with '--help')
    --ignore-unmatch: Treat non-matching pathspecs as success with an empty result
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
- name: mv
  description: Rename or move tracked paths
  flags:
    --dry-run: List moves that would happen without changing the index or work tree
    -f, --force: Replace existing files at the destination
    -h, --help: Print help (see more with '--help')
- name: clean
  description: Path arguments plus Git-compatible `--pathspec-from-file` / `--pathspec-file-nul`
  flags:
    --dry-run: Explicit dry run (default when `-f` is not passed)
    -e, --exclude=*: Additional exclude patterns; matching paths are not removed
    --files-only: Remove only files, not untracked directories
    -f, --force: Actually delete files. Without this flag, only prints what would be removed
    -h, --help: Print help (see more with '--help')
    --ignored: Remove ignored files as well (like `git clean -x`)
    --only-ignored: Remove only ignored files (like `git clean -X`)
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
- name: repack
  description: Pack reachable objects and remove redundant packs
  flags:
    --dry-run: Show what would be packed without writing
    -h, --help: Print help (see more with '--help')
    -q, --quiet: Suppress progress summary on stderr
- name: gc
  description: Subcommands of `grit gc`
  flags:
    --dry-run: Show what would run without writing
    -h, --help: Print help (see more with '--help')
    -q, --quiet: Suppress progress summary on stderr
  commands:
  - name: repack
    description: Repack reachable objects into one pack
    flags:
      --bitmaps: Write a reachability `.bitmap` sidecar for the new pack
      --dry-run: Report what would be packed without writing
      -h, --help: Print help (see more with '--help')
  - name: commit-graph
    description: Write a reachable commit-graph with changed-path Bloom filters
    flags:
      --dry-run: Report commit count without writing the graph file
      -h, --help: Print help (see more with '--help')
  - name: midx
    description: Write or refresh the multi-pack-index
    flags:
      --dry-run: Report pack coverage without writing the index
      -h, --help: Print help (see more with '--help')
  - name: pack-refs
    description: Pack loose refs into `packed-refs` (or compact reftable)
    flags:
      --dry-run: Report refs that would be packed without writing
      -h, --help: Print help (see more with '--help')
  - name: prune
    description: Delete unreachable loose objects
    flags:
      --dry-run: Report objects that would be deleted without removing them
      -h, --help: Print help (see more with '--help')
      --older-than=: Only remove objects older than this date (Git approxidate syntax)
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: repack
      description: Repack reachable objects into one pack
    - name: commit-graph
      description: Write a reachable commit-graph with changed-path Bloom filters
    - name: midx
      description: Write or refresh the multi-pack-index
    - name: pack-refs
      description: Pack loose refs into `packed-refs` (or compact reftable)
    - name: prune
      description: Delete unreachable loose objects
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: fsck
  aliases:
  - verify
  description: Check refs, objects, and pack indexes for problems
  flags:
    --connectivity-only: Check connectivity from refs only (skip store-wide object validation)
    --dangling: Report unreachable objects (with `--connectivity-only`, off unless this flag is set)
    -h, --help: Print help (see more with '--help')
    --no-dangling: Do not list dangling objects (matches Git `--no-dangling`)
    --strict: Treat ref warnings as errors
    -v, --verbose: Include info-level object diagnostics in human output (matches Git `--verbose`)
- name: ignore
  description: Subcommands of `grit ignore`
  flags:
    -h, --help: Print help (see more with '--help')
  commands:
  - name: check
    description: Print whether paths match exclude rules
    flags:
      --all: Also list paths that are not ignored
      -h, --help: Print help (see more with '--help')
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: check
      description: Print whether paths match exclude rules
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: hooks
  description: Subcommands of `grit hooks`
  flags:
    -h, --help: Print help (see more with '--help')
    -n, --limit=: Maximum number of rows to list
    --max-count=: Maximum number of rows to list
  commands:
  - name: list
    description: List hook scripts in the resolved hooks directory
    flags:
      -h, --help: Print help (see more with '--help')
      -n, --limit=: Maximum number of rows to list
      --max-count=: Maximum number of rows to list
  - name: run
    description: Run a hook by name (passes `--` arguments through to the script)
    flags:
      -h, --help: Print help (see more with '--help')
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: list
      description: List hook scripts in the resolved hooks directory
    - name: run
      description: Run a hook by name (passes `--` arguments through to the script)
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: patch-id
  description: Print stable patch-IDs for one or more commits
  flags:
    -h, --help: Print help (see more with '--help')
    --unstable: Use legacy unstable patch-ID algorithm (Git 1.9 and older)
- name: resolve
  description: Resolve revision specs to object ids and types
  flags:
    --abbrev-ref: Print the shortest unambiguous ref name for each spec (like `git rev-parse --abbrev-ref`)
    -h, --help: Print help (see more with '--help')
    -q, --quiet: With `--verify`, answer yes/no via exit status only (no stdout/stderr)
    --short: Print abbreviated object ids
    --symbolic-full-name: Print the full symbolic ref name for each spec (like `git rev-parse --symbolic-full-name`)
    --verify=: Resolve exactly one spec strictly (`git rev-parse --verify`); pass the spec as the flag value
- name: cat
  description: Show blob, tree, commit, or tag contents for a revision spec
  flags:
    -h, --help: Print help (see more with '--help')
- name: commit
  description: Like [`PathspecArgs`], but paths are trailing (after other positionals)
  flags:
    -a, --all: Stage every change first, then commit. This is the default when `commit.autoStage` is true
    --allow-empty: Record a commit even when the tree matches the parent (same as `git commit --allow-empty`)
    --amend: Replace the tip commit instead of creating a new one
    --author=: Author ident (`Name <email>` or bare email)
    --date=: Override the author date (Git date formats, RFC 3339, `@epoch`, …)
    --dry-run: Compute the commit without writing objects, updating refs, or running hooks
    -S, --gpg-sign: Sign the commit with the configured signing key
    -h, --help: Print help (see more with '--help')
    --hunks=*: Commit only the listed hunk ids from `grit diff --json` (comma-separated, repeatable)
    --lines=*: Commit only line ranges from the unstaged diff (same format as `grit add --lines`)
    -m, --message=: Commit message text
    -F, --message-file=: Read the message from a file (`-` for stdin)
    --no-gpg-sign: Do not sign this commit, even when `commit.gpgsign` is enabled
    --no-verify: Skip the `pre-commit` and `commit-msg` hooks
    --patch-file=: Apply a unified diff to the index, then commit only that staged content (`git apply --cached` + commit)
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --reset-author: Set the author to the committer with a fresh author date
    -C, --reuse-message=: Reuse the log message and author from a commit (`-C` / `--reuse-message`)
    -s, --signoff: Append a `Signed-off-by` trailer for the committer
    --staged: Commit only what is already staged (same as `git commit` without `-a`)
    --trailer=*: 'Append a commit trailer (`key=value` or `key: value`); repeat for multiple trailers'
- name: branch
  description: Flags that apply when listing branches (no positional `NAME`)
  flags:
    -M=*: 'Force rename: `-M <new>` or `-M <old> <new>`'
    -a, --all: List local and remote-tracking branches
    --contains=: List branches whose tip contains `REV` (defaults to `HEAD` when omitted)
    -d, --delete: Delete the named branch instead of creating it
    --dry-run: Preview the operation without updating refs, config, or reflogs
    -f, --force: Overwrite an existing branch when creating or renaming
    -D, --force-delete: Delete even when the branch is not fully merged into the current branch
    -h, --help: Print help (see more with '--help')
    -n, --limit=: Maximum number of rows to list
    --max-count=: Maximum number of rows to list
    --list=*: Include only branches whose short name matches `GLOB` (repeatable)
    --merged=: List branches merged into `REV` (defaults to `HEAD` when omitted)
    -m, --move=*: 'Rename a branch: `-m <new>` or `-m <old> <new>`'
    --no-merged=: List branches not merged into `REV` (defaults to `HEAD` when omitted)
    --no-track: Do not configure upstream when creating
    -r, --remotes: List remote-tracking branches under `refs/remotes/`
    --reverse: Reverse sort order
    -u, --set-upstream-to=: Set upstream for the named branch (or the current branch when omitted)
    --show-current: Print the current branch name only (same as `git branch --show-current`)
    --sort=: 'Sort key: `name`, `version`, or `date`'
    -t, --track: Configure upstream from the start point when creating
    --unset-upstream: Remove upstream configuration for the named branch (or the current branch)
- name: switch
  aliases:
  - checkout
  - co
  description: Switch to another branch, remote branch, or detached commit
  flags:
    -c, --create: Create the branch first, then switch to it
    --detach: Check out a commit in detached HEAD mode
    --dry-run: Run overwrite checks without updating refs, the index, or the worktree
    -h, --help: Print help (see more with '--help')
- name: reset
  description: Move the branch tip and optionally reset the index or worktree
  flags:
    --dry-run: Preview the reset without updating refs, the index, or the worktree
    --hard: Reset the index and worktree to match the target commit
    -h, --help: Print help (see more with '--help')
    --keep: Reset the tip and update differing paths while keeping unrelated local edits
    -n, --limit=: Maximum orphaned commits to list in `--json` output
    --mixed: Reset the index to the target commit; keep the worktree (default)
    --soft: Keep the index and worktree; move the branch tip only
- name: merge
  description: Commit message from `-m` or `-F` / `--message-file` (`-` reads stdin)
  flags:
    -X=: Prefer ours or theirs on overlapping edits (`-X ours` / `-X theirs`)
    --abort: Cancel an in-progress merge and restore the pre-merge state
    --allow-unrelated-histories: Merge histories that share no commits (uses the empty tree as merge base)
    --check: Predict whether the merge would succeed without changing refs, index, or worktree
    --conflict=: Conflict marker style (`merge`, `diff3`, or `zdiff3`)
    --continue: Finish an in-progress merge after resolving conflicts (or after `--no-commit`)
    --dry-run: Report the planned merge outcome without changing refs, index, or worktree
    --ff-only: Refuse when a fast-forward is not possible (exit code 128)
    -h, --help: Print help (see more with '--help')
    -m, --message=: Commit message text
    -F, --message-file=: Read the message from a file (`-` for stdin)
    --no-commit: Apply the merge to the index and worktree but do not commit yet
    --no-ff: Record a merge commit even when a fast-forward is possible
    --squash: Squash merged commits into staged changes and write `SQUASH_MSG`
  completion:
    flag:
      X:
      - "ours\tPrefer the current branch when both sides changed the same region"
      - "theirs\tPrefer the branch being merged when both sides changed the same region"
      conflict:
      - "merge\tStandard two-section conflict markers"
      - "diff3\tThree-section markers including the base section"
      - "zdiff3\tZealous diff3 (`zdiff3`)"
- name: pick
  description: Auto-resolve replay conflicts and choose conflict marker style (pick / revert)
  flags:
    -X=: 'Auto-resolve replay conflicts: `ours` keeps the current branch side, `theirs` keeps the replayed change'
    --abort: Cancel an in-progress pick and restore the pre-pick state
    --check: Predict whether the pick would succeed without changing refs, the index, or the worktree
    --conflict=: Conflict marker style when a step would stop with conflicts
    --continue: Finish a pick stopped on conflicts or an empty commit
    --dry-run: List commits that would be picked without changing refs or the worktree
    --empty=:
      description: 'When a pick step would not change the tree: stop (default), keep an empty commit, or drop the step'
      default: stop
    -h, --help: Print help (see more with '--help')
    --mainline=: Parent number when picking a merge commit (1-based, long only)
    -m, --message=: Commit message text
    -F, --message-file=: Read the message from a file (`-` for stdin)
    --no-commit: Apply the pick to the index only; do not create a commit yet
    -x, --record-origin: Append `(cherry picked from commit …)` to each new commit message
    --skip: Skip the current pick step and continue with the next commit
  completion:
    flag:
      X:
      - "ours\tFavor the upstream / onto side during rebase replay (matches `git rebase -X ours`)"
      - "theirs\tFavor the commit being replayed (matches `git rebase -X theirs`)"
      conflict:
      - "merge\tStandard two-section conflict markers"
      - "diff3\tThree-section markers including the base section"
      - "zdiff3\tZealous diff3 (`zdiff3`)"
      empty:
      - stop
      - keep
      - drop
- name: revert
  description: Auto-resolve replay conflicts and choose conflict marker style (pick / revert)
  flags:
    -X=: 'Auto-resolve replay conflicts: `ours` keeps the current branch side, `theirs` keeps the replayed change'
    --abort: Cancel an in-progress revert and restore the pre-revert state
    --check: Predict whether the revert would succeed without changing refs, the index, or the worktree
    --conflict=: Conflict marker style when a step would stop with conflicts
    --continue: Finish a revert stopped on conflicts or an empty commit
    --dry-run: List commits that would be reverted without changing refs or the worktree
    --empty=:
      description: 'When a revert step would not change the tree: stop (default), keep an empty commit, or drop the step'
      default: stop
    -h, --help: Print help (see more with '--help')
    --mainline=: Parent number when reverting a merge commit (1-based, long only)
    -m, --message=: Commit message text
    -F, --message-file=: Read the message from a file (`-` for stdin)
    --no-commit: Apply the revert to the index only; do not create a commit yet
    --skip: Skip the current revert step and continue with the next commit
  completion:
    flag:
      X:
      - "ours\tFavor the upstream / onto side during rebase replay (matches `git rebase -X ours`)"
      - "theirs\tFavor the commit being replayed (matches `git rebase -X theirs`)"
      conflict:
      - "merge\tStandard two-section conflict markers"
      - "diff3\tThree-section markers including the base section"
      - "zdiff3\tZealous diff3 (`zdiff3`)"
      empty:
      - "stop\tStop and leave sequencer state for `--continue` / `--skip`"
      - "keep\tRecord an empty revert commit for the step"
      - "drop\tSkip the commit and continue with the next one"
- name: history
  description: Subcommands of `grit history`
  flags:
    -h, --help: Print help (see more with '--help')
  commands:
  - name: drop
    description: Remove a commit and replay descendants onto its parent
    flags:
      --dry-run: Print planned ref updates without moving refs (new commit objects are still written)
      --empty=:
        description: 'When a replayed commit would not change the tree: drop (default), keep an empty commit, or abort'
        default: drop
      -h, --help: Print help (see more with '--help')
      --keep-committer: Keep each replayed commit's original committer line instead of the configured committer
      --update-refs=:
        description: 'Which refs to rewrite: all descendant branches (default) or only `HEAD`'
        default: branches
    completion:
      flag:
        empty:
        - "drop\tOmit commits whose tree matches the new parent"
        - "keep\tKeep empty commits"
        - "abort\tRefuse when a commit would become empty"
        update-refs:
        - "branches\tEvery local branch descending from the edited commit, plus `HEAD` when applicable"
        - "head\tOnly the commit `HEAD` currently points at"
  - name: move
    description: Reorder a commit on the first-parent chain of `HEAD`
    flags:
      --after=: Place the commit immediately after this revision
      --before=: Place the commit immediately before this revision
      --dry-run: Print planned ref updates without moving refs (new commit objects are still written)
      --empty=:
        description: 'When a replayed commit would not change the tree: drop (default), keep an empty commit, or abort'
        default: drop
      -h, --help: Print help (see more with '--help')
      --keep-committer: Keep each replayed commit's original committer line instead of the configured committer
      --update-refs=:
        description: 'Which refs to rewrite: all descendant branches (default) or only `HEAD`'
        default: branches
    completion:
      flag:
        empty:
        - "drop\tOmit commits whose tree matches the new parent"
        - "keep\tKeep empty commits"
        - "abort\tRefuse when a commit would become empty"
        update-refs:
        - "branches\tEvery local branch descending from the edited commit, plus `HEAD` when applicable"
        - "head\tOnly the commit `HEAD` currently points at"
  - name: reword
    description: Replace a commit message and replay descendants onto the new history
    flags:
