- name: stash
  description: Subcommands of `grit stash`
  flags:
    -h, --help: Print help (see more with '--help')
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
  persistentflags:
    --dry-run: Preview stash without updating refs, index, or worktree
    --hunks=*: Stash only unstaged hunks from `grit diff --json` (comma-separated, repeatable)
    -u, --include-untracked: Include untracked files (bare `grit stash` / `grit stash push`)
    -k, --keep-index: After stashing, leave the index and worktree matching staged content
    -n, --limit=: Cap path lists in `--dry-run` preview output
    --lines=*: Stash only unstaged line ranges (`path:start-end`, same as `grit add --lines`)
    -m, --message=: Stash message (bare `grit stash` / `grit stash push`)
    -S, --staged: Stash only index changes vs `HEAD` (unstaged edits on other paths remain)
  commands:
  - name: push
    description: Save local changes to the stash and reset the working tree
    flags:
      --dry-run: Preview stash without updating refs, index, or worktree
      -h, --help: Print help (see more with '--help')
      --hunks=*: Stash only unstaged hunks from `grit diff --json`
      -u, --include-untracked: Include untracked files in the stash
      -k, --keep-index: Leave staged content in the index and worktree after stashing
      --lines=*: Stash only unstaged line ranges (`path:start-end`)
      -m, --message=: Stash message
      --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
      --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
      -S, --staged: Stash only index changes vs `HEAD`
  - name: list
    description: List stash entries
    flags:
      -h, --help: Print help (see more with '--help')
  - name: show
    description: Show the summary or patch for a stash entry
    flags:
      -h, --help: Print help (see more with '--help')
      -u, --include-untracked: Include untracked files from the stash U parent
      -p, --patch: Show the full patch instead of a diffstat
      --stat: Show a diffstat summary (default)
  - name: branch
    description: Create a branch at the stash base commit and apply the stash with `--index`
    flags:
      -h, --help: Print help (see more with '--help')
  - name: clear
    description: Remove every stash entry
    flags:
      --dry-run: Report how many entries would be cleared without deleting
      --force: Delete all stash entries (required)
      -h, --help: Print help (see more with '--help')
  - name: apply
    description: Apply a stash entry without removing it
    flags:
      -h, --help: Print help (see more with '--help')
      --index: Restore the stashed index as well as the worktree
  - name: pop
    description: Apply a stash entry and remove it when there are no conflicts
    flags:
      -h, --help: Print help (see more with '--help')
      --index: Restore the stashed index as well as the worktree
  - name: drop
    description: Remove a stash entry without applying it
    flags:
      -h, --help: Print help (see more with '--help')
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: push
      description: Save local changes to the stash and reset the working tree
    - name: list
      description: List stash entries
    - name: show
      description: Show the summary or patch for a stash entry
    - name: branch
      description: Create a branch at the stash base commit and apply the stash with `--index`
    - name: clear
      description: Remove every stash entry
    - name: apply
      description: Apply a stash entry without removing it
    - name: pop
      description: Apply a stash entry and remove it when there are no conflicts
    - name: drop
      description: Remove a stash entry without applying it
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: restore
  description: Path arguments plus Git-compatible `--pathspec-from-file` / `--pathspec-file-nul`
  flags:
    --conflict=: Conflict marker style (implies `--merge`)
    --dry-run: Report paths that would change without writing the worktree or index
    -h, --help: Print help (see more with '--help')
    --hunks=*: Discard only the listed unstaged hunk ids (`grit diff --unstaged --json`) or unstage staged ids (`--staged`)
    --lines=*: Discard or unstage only new-side line ranges (`path:start-end` from `grit diff --json`)
    --merge: Rebuild conflict markers in the worktree from index stages
    --ours: For unmerged paths, write our side (index stage 2) into the worktree
    --pathspec-file-nul: '`--pathspec-from-file` entries are NUL-separated'
    --pathspec-from-file=: Read pathspecs from a file (`-` for stdin) instead of or in addition to argv paths
    --source=: Tree or commit to restore from
    -S, --staged: Restore the index from HEAD (or `--source`)
    --theirs: For unmerged paths, write their side (index stage 3) into the worktree
    -W, --worktree: Restore the working tree (default when `--staged` is absent)
  completion:
    flag:
      conflict:
      - "merge\tStandard two-section conflict markers"
      - "diff3\tThree-section markers including the base section"
      - "zdiff3\tZealous diff3 (`zdiff3`)"
- name: fetch
  description: Options shared by fetch-like commands
  flags:
    --all: Fetch from every configured remote (respects `remote.<name>.skipFetchAll`)
    --deepen=: Deepen an existing shallow clone by this many commits (`git fetch --deepen`)
    --depth=: Fetch only the recent history of each branch (same as `git fetch --depth`)
    --dry-run: Report ref updates without writing refs or objects
    -h, --help: Print help (see more with '--help')
    --no-prune: Do not prune stale remote-tracking refs, even when config enables it
    --no-tags: Do not fetch tags automatically (`git fetch --no-tags`)
    --prune: Remove remote-tracking refs that no longer exist on the remote
    -q, --quiet: Suppress progress and human output
    --tags: Fetch all tags from the remote (`git fetch --tags`)
    --unshallow: Convert a shallow repository to a complete one (`git fetch --unshallow`)
- name: pull
  description: Options shared by fetch-like commands
  flags:
    --all: Fetch from every configured remote (respects `remote.<name>.skipFetchAll`)
    --autostash: Stash dirty worktree/index changes around the pull (`merge.autoStash` / `rebase.autoStash`)
    --check: Fetch and report whether a fast-forward is possible without changing the branch
    --deepen=: Deepen an existing shallow clone by this many commits (`git fetch --deepen`)
    --depth=: Fetch only the recent history of each branch (same as `git fetch --depth`)
    --dry-run: Report ref updates without writing refs or objects
    --ff-only: Refuse when a merge would be required (exit 1 when diverged)
    -h, --help: Print help (see more with '--help')
    --no-prune: Do not prune stale remote-tracking refs, even when config enables it
    --no-rebase: Merge instead of rebasing, overriding `pull.rebase`
    --no-tags: Do not fetch tags automatically (`git fetch --no-tags`)
    --prune: Remove remote-tracking refs that no longer exist on the remote
    -q, --quiet: Suppress progress and human output
    --rebase: Rebase local commits onto the fetched upstream, overriding `pull.rebase=false`
    --tags: Fetch all tags from the remote (`git fetch --tags`)
    --unshallow: Convert a shallow repository to a complete one (`git fetch --unshallow`)
- name: rebase
  description: Shared flags for history rewrite subcommands
  flags:
    -X=: 'Auto-resolve replay conflicts: `ours` keeps the onto side, `theirs` keeps replayed commits'
    --abort: Cancel an in-progress rebase and restore the branch to its pre-rebase tip
    --check: Predict whether the rebase would succeed without changing refs, index, or worktree
    --continue: Finish a rebase stopped on conflicts after resolving and staging paths
    --dry-run: Print planned ref updates without moving refs (new commit objects are still written)
    --empty=:
      description: 'When a replayed commit would not change the tree: drop (default), keep an empty commit, or abort'
      default: drop
    --exec=*: Run a shell command after each replayed commit is checked out (repeatable; incompatible with `--dry-run` and `--check`)
    -h, --help: Print help (see more with '--help')
    --keep-committer: Keep each replayed commit's original committer line instead of the configured committer
    --onto=: Replay onto this commit instead of `UPSTREAM`
    --skip: Skip the current commit and replay the rest
    --update-refs=:
      description: 'Which refs to rewrite: all descendant branches (default) or only `HEAD`'
      default: branches
  completion:
    flag:
      X:
      - "ours\tFavor the upstream / onto side during rebase replay (matches `git rebase -X ours`)"
      - "theirs\tFavor the commit being replayed (matches `git rebase -X theirs`)"
      empty:
      - "drop\tOmit commits whose tree matches the new parent"
      - "keep\tKeep empty commits"
      - "abort\tRefuse when a commit would become empty"
      update-refs:
      - "branches\tEvery local branch descending from the edited commit, plus `HEAD` when applicable"
      - "head\tOnly the commit `HEAD` currently points at"
- name: push
  description: Publish refs to a remote
  flags:
    --atomic: All ref updates succeed or none are applied
    --delete=*: Delete a remote branch or tag (may be repeated)
    --dry-run: Contact the remote but do not update refs or send objects
    --follow-tags: Push annotated tags reachable from the commits being pushed
    -f, --force: Overwrite remote refs even when the update is not a fast-forward
    --force-with-lease?: Push only when the remote ref matches the local remote-tracking ref, or `=<rev>` when pushing exactly one ref
    -h, --help: Print help (see more with '--help')
    -o, --push-option=*: Server-side push option (repeatable; `GIT_PUSH_OPTION_*` in hooks)
    --remote&=: Remote to push to (defaults to the current branch's remote or `origin`)
    -u, --set-upstream: Set `branch.<name>.remote` and `branch.<name>.merge` for each pushed branch
    -t, --tags: Push tags instead of the current branch. Pushes every local tag under `refs/tags/` to the remote
- name: bundle
  description: Subcommands of `grit bundle`
  flags:
    -h, --help: Print help (see more with '--help')
  commands:
  - name: create
    description: Write a bundle file from revision specs
    flags:
      --all: Include every ref tip in the bundle header (`HEAD`, all branches and tags)
      --dry-run: Report refs, prerequisites, and object count without writing a file
      -h, --help: Print help (see more with '--help')
  - name: verify
    description: Check that a bundle file is well-formed
    flags:
      -h, --help: Print help (see more with '--help')
  - name: list
    description: List refs recorded in a bundle header
    flags:
      -h, --help: Print help (see more with '--help')
      -n, --limit=: Maximum number of rows to list
      --max-count=: Maximum number of rows to list
  - name: unbundle
    description: Ingest a bundle pack into the current repository
    flags:
      --dry-run: Verify and list ref updates without ingesting objects or writing refs
      -h, --help: Print help (see more with '--help')
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: create
      description: Write a bundle file from revision specs
    - name: verify
      description: Check that a bundle file is well-formed
    - name: list
      description: List refs recorded in a bundle header
    - name: unbundle
      description: Ingest a bundle pack into the current repository
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: notes
  description: Subcommands of `grit notes`
  flags:
    -h, --help: Print help (see more with '--help')
    -n, --limit=: Maximum number of rows to list
    --max-count=: Maximum number of rows to list
  persistentflags:
    --dry-run: Preview `add` or `remove` without writing objects or refs
    --ref=: 'Notes ref (default: `core.notesRef` or `refs/notes/commits`)'
  commands:
  - name: list
    description: List notes attached to commits
    flags:
      -h, --help: Print help (see more with '--help')
      -n, --limit=: Maximum number of rows to list
      --max-count=: Maximum number of rows to list
  - name: show
    description: Show the note for a revision
    flags:
      -h, --help: Print help (see more with '--help')
  - name: add
    description: Add or replace a note on a revision
    flags:
      --force: Replace an existing note
      -h, --help: Print help (see more with '--help')
      -m, --message=: Commit message text
      -F, --message-file=: Read the message from a file (`-` for stdin)
  - name: remove
    description: Remove notes from one or more revisions
    flags:
      -h, --help: Print help (see more with '--help')
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: list
      description: List notes attached to commits
    - name: show
      description: Show the note for a revision
    - name: add
      description: Add or replace a note on a revision
    - name: remove
      description: Remove notes from one or more revisions
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: tag
  description: Commit message from `-m` or `-F` / `--message-file` (`-` reads stdin)
  flags:
    --contains=: Only tags whose peeled commit contains this revision (`HEAD` when omitted)
    -d, --delete: Delete the named tag instead of creating it
    --dry-run: Preview create or delete without changing refs
    --exclude-submodule=*: Submodule path globs excluded from the digest (repeatable)
    --file&=: Deprecated alias for `--message-file`
    -f, --force: Replace an existing tag with the same name
    -h, --help: Print help (see more with '--help')
    -n, --limit=: Maximum number of rows to list
    --max-count=: Maximum number of rows to list
    -l, --list=*: List tags matching `PATTERN` (repeatable). Omit `PATTERN` to list all tags
    -m, --message=: Commit message text
    -F, --message-file=: Read the message from a file (`-` for stdin)
    --no-sign: Do not sign even when `tag.gpgSign` is true
    --no-signature: Skip signature verification (still checks `tree-sha256` when present)
    --object&=: Object to tag (revision). Defaults to `HEAD`
    --points-at=*: Only tags pointing at this object (repeatable)
    --reverse: Reverse the sort order
    -s, --sign: Sign the tag object (implies annotated). Honors `tag.gpgSign` when omitted
    --signing-key=: Signing key id or path (overrides `user.signingkey` for this tag)
    --sort=:
      description: Sort listed tags by version, date, or name
      default: version
    --tree-sha256: Attach a tree-sha256 content digest to the tag (implies `--sign`)
    -v, --verify: Verify annotated tag signatures and optional `tree-sha256` claims
  completion:
    flag:
      sort:
      - "version\t`version:refname` (default)"
      - "date\tCreator date (tagger or committer)"
      - "name\tRef name"
- name: worktree
  description: Subcommands of `grit worktree`
  flags:
    -h, --help: Print help (see more with '--help')
  commands:
  - name: list
    description: List registered worktrees (main first, then linked)
    flags:
      -h, --help: Print help (see more with '--help')
  - name: add
    description: Create a linked worktree at `path`
    flags:
      -B=: Create or reset a branch to the start point (`-B`)
      -b, --branch=: Create and check out a new branch
      --detach: Check out in detached HEAD mode
      -f, --force: Reuse a stale registration when the working tree directory is missing
      -h, --help: Print help (see more with '--help')
      --lock: Mark the new worktree locked before checkout finishes
      --no-checkout: Register the worktree without populating files (HEAD only)
      --reason=: Reason stored in the lock file (requires `--lock`)
      --track: Set upstream when the start point is a remote-tracking branch
    completion:
      positional:
      - - $files
  - name: remove
    description: Remove a linked worktree
    flags:
      -f, --force: Remove even when the worktree has local changes or is locked
      -h, --help: Print help (see more with '--help')
    completion:
      positional:
      - - $files
  - name: prune
    description: Drop registrations for linked worktrees whose directories are gone
    flags:
      --dry-run: List prunable worktrees without removing registrations
      -h, --help: Print help (see more with '--help')
  - name: lock
    description: Mark a linked worktree as locked (prevents accidental removal)
    flags:
      -h, --help: Print help (see more with '--help')
      --reason=: Optional reason stored in the lock file
    completion:
      positional:
      - - $files
  - name: unlock
    description: Clear the lock on a linked worktree
    flags:
      -h, --help: Print help (see more with '--help')
    completion:
      positional:
      - - $files
  - name: move
    description: Move a linked worktree to a new directory
    flags:
      --dry-run: Preview the move without changing disk state
      -f, --force: Allow move when the worktree is locked
      -h, --help: Print help (see more with '--help')
    completion:
      positional:
      - - $files
      - - $files
  - name: repair
    description: Fix `.git` / `gitdir` links after a manual directory move
    flags:
      --dry-run: Report repairs without writing files
      -h, --help: Print help (see more with '--help')
    completion:
      positionalany:
      - $files
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: list
      description: List registered worktrees (main first, then linked)
    - name: add
      description: Create a linked worktree at `path`
    - name: remove
      description: Remove a linked worktree
    - name: prune
      description: Drop registrations for linked worktrees whose directories are gone
    - name: lock
      description: Mark a linked worktree as locked (prevents accidental removal)
    - name: unlock
      description: Clear the lock on a linked worktree
    - name: move
      description: Move a linked worktree to a new directory
    - name: repair
      description: Fix `.git` / `gitdir` links after a manual directory move
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: auth
  description: Subcommands of `grit auth`
  flags:
    -h, --help: Print help (see more with '--help')
  commands:
  - name: logout
    description: Forget the stored GitHub token (sign out)
    flags:
      --dry-run: Report which stored credential would be removed without erasing it
      -h, --help: Print help (see more with '--help')
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: logout
      description: Forget the stored GitHub token (sign out)
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: update
  description: Update grit to the latest release (re-runs the install script)
  flags:
    -h, --help: Print help (see more with '--help')
- name: skill
  description: Print an agent skill (SKILL.md) that explains how to use grit
  flags:
    -h, --help: Print help (see more with '--help')
- name: completions
  description: Generate shell completion scripts for bash, zsh, or fish
  flags:
    -h, --help: Print help (see more with '--help')
  completion:
    positional:
    - - bash
      - elvish
      - fish
      - powershell
      - zsh
- name: config
  description: Read, set, or list configuration values
  flags:
    --add: Append a value without replacing existing entries
    --all: Return every value for a multi-valued key
    --default=: When reading, use this value if the key is unset
    --dry-run: Show what would change without writing the config file
    -f, --file=: Read or write only the given config file (no repository required)
    --global: Use the global (per-user) config file instead of this repository's
    -h, --help: Print help (see more with '--help')
    -l, --list: List configuration values (optional `<prefix>` filters keys)
    --local: Read or write only this repository's config file (`.git/config`)
    --remove-section=: Remove an entire section
    --rename-section=: Current section name for `--rename-section`
    --rename-section-new=: New section name for `--rename-section`
    --system: Read or write the system config file (`/etc/gitconfig` or `GIT_CONFIG_SYSTEM`)
    --type=: Coerce values as bool, int, or path (canonical on write)
    --unset: Remove the key instead of reading or setting it
    --unset-all: Remove every occurrence of a multi-valued key
    --worktree: Read or write this worktree's `config.worktree` (requires `extensions.worktreeConfig`)
  completion:
    flag:
      file:
      - $files
      type:
      - bool
      - int
      - path
- name: manager
  description: Git credential helper backed by the Windows Credential Manager
  flags:
    -h, --help: Print help (see more with '--help')
  documentation:
    command: |-
      Git credential helper backed by the Windows Credential Manager.

      You don't normally run this yourself — `grit auth` wires it into `credential.helper` on Windows. It speaks Git's credential protocol.
