        - "branches\tEvery local branch descending from the edited commit, plus `HEAD` when applicable"
        - "head\tOnly the commit `HEAD` currently points at"
  - name: undo
    description: Undo the last applied history rewrite using the recorded ref plan
    flags:
      --dry-run: Print planned ref updates without moving refs (new commit objects are still written)
      --empty=:
        description: 'When a replayed commit would not change the tree: drop (default), keep an empty commit, or abort'
