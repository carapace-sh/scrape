    documentation:
      command: "Work with CircleCI from the command line.\n\n## Global Flags\n\n| Flag                  | Description                                                  |\n| --------------------- | ------------------------------------------------------------ |\n| `-c, --config string` | Path to config file (default: ~/.config/circleci/config.yml) |\n| `--debug`             | Enable debug logging                                         |\n| `--no-color`          | Disable ANSI color output (same as setting NO_COLOR)         |\n| `-q, --quiet`         | Suppress informational output. Data on stdout is unaffected  |\n\n\n## CI Commands\n\n### `circleci artifact <job-id> [flags]`\n\nList and download a job's artifact files\n\nList or download artifacts produced by a CircleCI job.\n\nPass the job UUID to list its artifacts. Use --output to save\nthem to a local directory.\n\nJSON fields: path, url, execution\n\n| Flag                  | Description                                                                       |\n| --------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`         | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`              | Output as JSON                                                                    |\n| `-o, --output string` | Download artifacts into this directory                                            |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose artifacts you want to\nlist or download,\nfor example. `5034460f-c7c4-4c43-9457-de07e2029e7b`.\n\n**Examples:**\n\n- List artifacts for a job: \n  `circleci artifact 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Download all artifacts into ./artifacts: \n  `circleci artifact 5034460f-c7c4-4c43-9457-de07e2029e7b --output ./artifacts`\n- Output as JSON for scripting: \n  `circleci artifact 5034460f-c7c4-4c43-9457-de07e2029e7b --json`\n\n### `circleci config <command>`\n\nGenerate, validate, process and pack config YAML\n\nWork with the pipeline configuration file at .circleci/config.yml.\n\nThis group manages the pipeline YAML that CircleCI executes. For CLI\ntool settings (API token, host, defaults), use 'circleci setting'.\n\n#### `circleci config generate [path]`\n\nGenerate .circleci/config.yml from a repository scan\n\nDetect the language stack, container image, and setup commands for a\nrepository, then write a starter pipeline to `<path>/.circleci/config.yml`.\n\nIf no supported stack is detected, a minimal cimg/base:stable template\nwith a placeholder build step is written instead so you have something\nto iterate on.\n\nIf a config file already exists at that path, generate does not overwrite\nit; it prints a confirmation and exits successfully. The .circleci/\ndirectory is created if needed, and the file is written atomically.\n\n**Arguments:**\n\n`<path>` is optional and is the directory to scan. Defaults to\nthe current directory.\n\n**Examples:**\n\n- Generate a config for the current directory: \n  `circleci config generate`\n- Generate a config for a specific project path: \n  `circleci config generate ./my-app`\n- Re-run is a no-op when a config already exists: \n  `circleci config generate`\n- ✓ Using existing config at .circleci/config.yml\n\n#### `circleci config pack <path>`\n\nBundle split config files into a single YAML document\n\nMerge a split CircleCI config directory into the single YAML document CircleCI\naccepts, printed to stdout.\n\nThe directory structure maps to YAML keys: .circleci/config.yml merges at the\ntop level, and .circleci/jobs/build.yml becomes jobs.build. Files whose names\nbegin with \"@\" merge at the current level instead of nesting under a key.\n\n**Arguments:**\n\n`<path>` is the path to a split config directory to pack,\nfor example, `.circleci` or `src/ci`. The directory structure is\nmapped to YAML keys in the merged document.\n\n**Examples:**\n\n- Pack the default config directory: \n  `circleci config pack .circleci`\n- Pack and pipe to validate: \n  `circleci config pack .circleci | circleci config validate --config -`\n- Pack a custom directory: \n  `circleci config pack src/ci`\n\n#### `circleci config process <path> [flags]`\n\nCompile and expand a pipeline config file\n\nCompile a CircleCI pipeline config and print the fully expanded YAML —\norbs inlined, matrices expanded, parameters resolved.\n\nNo API token is required; without one, only public orbs resolve.\nPrivate and namespaced orbs need a token and resolve against your org, taken\nfrom --org, a 'circleci project link' binding, or the git remote, in that order.\n\n| Flag                           | Description                                                                                  |\n| ------------------------------ | -------------------------------------------------------------------------------------------- |\n| `-n, --next`                   | Enable config next which previews upcoming potentially breaking config changes               |\n| `--org string`                 | Organization slug (e.g. gh/myorg) or UUID for private orb resolution; defaults to git remote |\n| `--pipeline-parameters string` | Pipeline parameters as a YAML map or path to a YAML file                                     |\n\n\n**Arguments:**\n\n`<path>` is the path to a pipeline config file to compile,\nfor example, `.circleci/config.yml`. Pass `-` to read the config\nfrom stdin.\n\n**Examples:**\n\n- Process the default config: \n  `circleci config process .circleci/config.yml`\n- Process with pipeline parameters: \n  `circleci config process .circleci/config.yml --pipeline-parameters 'env: staging'`\n- Process against a specific org (otherwise inferred from the git remote): \n  `circleci config process .circleci/config.yml --org gh/myorg`\n- Read from stdin: \n  `cat .circleci/config.yml | circleci config process -`\n\n#### `circleci config validate [<path>] [flags]`\n\nValidate a pipeline config file\n\nNo API token is required; without one, only public orbs resolve.\nPrivate and namespaced orbs need a token and resolve against your org, taken\nfrom --org, a 'circleci project link' binding, or the git remote, in that order.\n\nJSON fields (--json): valid (bool), compiled_yaml (string, when valid), errors (array of compilation messages, when invalid)\n\n| Flag                  | Description                                                                                  |\n| --------------------- | -------------------------------------------------------------------------------------------- |\n| `-c, --config string` | Path to config file (use \"-\" for stdin) (default \".circleci/config.yml\")                     |\n| `--json`              | Output as JSON                                                                               |\n| `-n, --next`          | Enable config next which previews upcoming potentially breaking config changes               |\n| `--org string`        | Organization slug (e.g. gh/myorg) or UUID for private orb resolution; defaults to git remote |\n\n\n**Arguments:**\n\n`<path>` is the pipeline config file to validate, by default\n`.circleci/config.yml`. Pass `-` to read the config from stdin.\n\n**Examples:**\n\n- Validate the default config file: \n  `circleci config validate`\n- Validate a specific file: \n  `circleci config validate path/to/config.yml`\n- Validate against a specific org (otherwise inferred from the git remote): \n  `circleci config validate --org gh/myorg`\n- Validate and output as JSON: \n  `circleci config validate --json`\n\n### `circleci job <command>`\n\nInspect a job's details, output and artifacts\n\nWork with CircleCI jobs.\n\nJobs are the individual units of work within a workflow.\n\n#### `circleci job artifact <job-id> [flags]`\n\nList or download artifacts for a job\n\nList or download artifacts produced by a specific job.\n\nPass the job UUID to list its artifacts. Use --output to save\nthem to a local directory.\n\nJSON fields: path, url, execution\n\n| Flag                  | Description                                                                       |\n| --------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`         | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`              | Output as JSON                                                                    |\n| `-o, --output string` | Download artifacts into this directory                                            |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose artifacts to list or download.\nJob UUIDs are shown in the output of `circleci workflow get` and\n`circleci run get --json`.\n\n**Examples:**\n\n- List artifacts for a job: \n  `circleci job artifact 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Download artifacts into ./artifacts: \n  `circleci job artifact 5034460f-c7c4-4c43-9457-de07e2029e7b --output ./artifacts`\n- Output as JSON: \n  `circleci job artifact 5034460f-c7c4-4c43-9457-de07e2029e7b --json`\n\n#### `circleci job get <job-id> [flags]`\n\nGet job details\n\nDisplay the status and steps of a CircleCI job.\n\nJob IDs are shown in the output of 'circleci workflow get' and\n'circleci run get --json'.\n\nJSON fields: id, name, type, status, started_at, stopped_at, project_id, pipeline_id, workflow_id, executions[].index/steps[].name/type/status/duration/exit_code\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job to look up. Job UUIDs are shown in\nthe output of `circleci workflow get` and `circleci run get --json`.\n\n**Examples:**\n\n- Get job details by UUID: \n  `circleci job get 8e50c384-0083-43d0-bc8f-93f0db589d6b`\n- Output as JSON: \n  `circleci job get 8e50c384-0083-43d0-bc8f-93f0db589d6b --json`\n- Get a specific field with jq: \n  `circleci job get 8e50c384-0083-43d0-bc8f-93f0db589d6b --json | jq '.status'`\n\n#### `circleci job open <job-id>`\n\nOpen job in browser\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job to look up. Job UUIDs are shown in\nthe output of `circleci workflow get` and `circleci run get --json`.\n\n**Examples:**\n\n- Open job by UUID: \n  `circleci job open 8e50c384-0083-43d0-bc8f-93f0db589d6b`\n\n#### `circleci job output <command>`\n\nWork with job step output\n\nFetch the raw stdout and stderr produced by a job's steps.\n\nSteps are identified by their step number within a job; for parallel\njobs, an execution index selects which executor's output to fetch.\n\n##### `circleci job output get <job-id> [flags]`\n\nGet the output of a job step\n\nFetch the raw stdout and stderr of a single step within a job. Both streams\nare fetched in parallel and printed together, stdout first.\n\nOutput passes through unchanged on a terminal and is rendered to plain text\nwhen redirected (ANSI stripped, progress redraws collapsed). --strip-ansi\nforces either behaviour.\n\n| Flag              | Description                                                                                    |\n| ----------------- | ---------------------------------------------------------------------------------------------- |\n| `--condensed`     | Fetch error-relevant lines only, filtered server-side (experimental)                           |\n| `--execution int` | Parallel execution index to read output from                                                   |\n| `--step-num int`  | Step number whose output to fetch (required)                                                   |\n| `--strip-ansi`    | Force (or with =false, disable) ANSI stripping; defaults to stripping only when not a terminal |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose step output to fetch. Job UUIDs\nare shown in the output of `circleci workflow get` and `circleci job get`.\nUse `--step-num` to select which step's output to read.\n\n**Examples:**\n\n- Get the output of step 3 in a job: \n  `circleci job output get 8e50c384-0083-43d0-bc8f-93f0db589d6b --step-num 3`\n- Get the output of step 3 from the second parallel execution: \n  `circleci job output get 8e50c384-0083-43d0-bc8f-93f0db589d6b --step-num 3 --execution 1`\n- Pipe the output to a file: \n  `circleci job output get 8e50c384-0083-43d0-bc8f-93f0db589d6b --step-num 3 > step.log`\n- Pipe condensed output to an AI CLI tool: \n  `circleci job output get 8e50c384-0083-43d0-bc8f-93f0db589d6b --step-num 3 --condensed | llm \"Why did this fail?\"`\n\n##### `circleci job output list <job-id> [flags]`\n\nList a job's steps with their output\n\nList every step in a job alongside its terminal-processed output.\n\nEach step's output is replayed through a virtual terminal, so progress\nredraws collapse to the final state a human would have seen. --tail limits\nthe rendered view only; --json always carries each step's full output.\n\nJSON fields: id, name, execution, steps[].num/name/type/phase/outcome/started_at/stopped_at/exit_code/command/output\n\n| Flag              | Description                                                                                     |\n| ----------------- | ----------------------------------------------------------------------------------------------- |\n| `--execution int` | Parallel execution index to list output from                                                    |\n| `--jq string`     | Process values from the response using jq syntax (see `circleci help formatting`)               |\n| `--json`          | Output as JSON                                                                                  |\n| `--tail int`      | Show only the last N lines of each step's output in the rendered view (0 for all) (default 200) |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose steps and output to list. Job\nUUIDs are shown in the output of `circleci workflow get` and\n`circleci job get`.\n\n**Examples:**\n\n- List the steps and output of a job: \n  `circleci job output list 8e50c384-0083-43d0-bc8f-93f0db589d6b`\n- List output for the second parallel execution: \n  `circleci job output list 8e50c384-0083-43d0-bc8f-93f0db589d6b --execution 1`\n- As JSON, with the output of the failing step: \n  `circleci job output list 8e50c384-0083-43d0-bc8f-93f0db589d6b --json | jq '.steps[] | select(.exit_code != 0) | .output'`\n- Show every line of every step in the rendered view: \n  `circleci job output list 8e50c384-0083-43d0-bc8f-93f0db589d6b --tail 0`\n\n#### `circleci job resource-usage <command>`\n\nWork with a job's CPU and memory usage\n\nInspect how much of its executor a job actually used.\n\nCPU and memory are sampled at a fixed interval for the length of each\nparallel execution, and reported against the limits of the resource class\nthe job ran on — so a job that needs a smaller (or larger) executor shows\nit.\n\n##### `circleci job resource-usage get <job-id> [flags]`\n\nChart a job's CPU and memory usage\n\nChart how much CPU and memory a job used against its resource class limits.\nPeak of limit sizes the executor: under 50% on both means a smaller class fits.\nParallel executions are overlaid in color, or charted apart past 5 (--chart).\n\nJSON fields: id, resource_class.name/cpu_count/memory_limit_bytes, executions[].execution/interval_ms/samples/duration_seconds/cpu_cores/memory_bytes/network_rx_bytes/network_tx_bytes/cpu.min/mean/max/peak_percent_of_limit (and memory.*)\n\n| Flag              | Description                                                                           |\n| ----------------- | ------------------------------------------------------------------------------------- |\n| `--chart string`  | Plot parallel executions together or apart: auto\\|combined\\|separate (default \"auto\") |\n| `--execution int` | Parallel execution index to report on (default all) (default -1)                      |\n| `--jq string`     | Process values from the response using jq syntax (see `circleci help formatting`)     |\n| `--json`          | Output as JSON                                                                        |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose usage to fetch. Job UUIDs are\nshown in the output of `circleci workflow get` and `circleci job get`.\n\n**Examples:**\n\n- Chart a job's CPU and memory usage: \n  `circleci job resource-usage get 0dc4d8df-8f7e-41b0-a3ef-88066a5465c1`\n- One chart per execution, however few there are: \n  `circleci job resource-usage get 0dc4d8df-8f7e-41b0-a3ef-88066a5465c1 --chart separate`\n- Only the third parallel execution: \n  `circleci job resource-usage get 0dc4d8df-8f7e-41b0-a3ef-88066a5465c1 --execution 2`\n- How close each execution came to its memory limit: \n  `circleci job resource-usage get 0dc4d8df-8f7e-41b0-a3ef-88066a5465c1 --json | jq '.executions[].memory.peak_percent_of_limit'`\n\n### `circleci pipeline <command>`\n\nDefine what will happen in a run\n\nCreate and list pipeline definitions for a CircleCI project.\n\nA pipeline definition decides what happens when a run is triggered:\nwhich repository to check out and where to find the config YAML that\nCircleCI compiles into workflows. Attach triggers to a definition with\n'circleci project trigger create'.\n\n#### `circleci pipeline create [flags]`\n\nCreate a pipeline definition\n\nCreate a new pipeline definition for a CircleCI project: where CircleCI finds\nthe config YAML, and which repository to check out. Attach triggers to it\nafterwards with `circleci project trigger create`.\n\nRequired flags must be given in non-interactive mode; a terminal prompts.\n\nJSON fields: id, name, description, created_at, config_source.provider, config_source.file_path, config_source.repo.external_id, config_source.repo.full_name, checkout_source.provider, checkout_source.repo.external_id, checkout_source.repo.full_name\n\n| Flag                         | Description                                                                       |\n| ---------------------------- | --------------------------------------------------------------------------------- |\n| `--checkout-provider string` | Checkout source provider (one of: github_app, github_server)                      |\n| `--checkout-repo-id string`  | Checkout source repo external ID                                                  |\n| `--config-file string`       | Config file path (e.g. .circleci/config.yml)                                      |\n| `--config-provider string`   | Config source provider (one of: github_app, github_server, circleci)              |\n| `--config-repo-id string`    | Config source repo external ID (required for github_app, github_server)           |\n| `--description string`       | Pipeline definition description                                                   |\n| `--jq string`                | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                     | Output as JSON                                                                    |\n| `--name string`              | Pipeline definition name (required)                                               |\n| `--project string`           | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n| `--project-id string`        | Project UUID (overrides --project)                                                |\n\n\n**Examples:**\n\n- Create a pipeline definition using GitHub App: \n  `circleci pipeline create --project gh/myorg/myrepo --name \"my-pipeline\" --config-provider github_app --config-repo-id 123456789 --config-file .circleci/config.yml --checkout-provider github_app --checkout-repo-id 123456789`\n- Create with a description and output as JSON: \n  `circleci pipeline create --name \"release-pipeline\" --description \"Runs on tagged releases\" --config-provider github_app --config-repo-id 123456789 --config-file .circleci/release.yml --checkout-provider github_app --checkout-repo-id 123456789 --json`\n- Create using a direct project UUID (skips project info lookup): \n  `circleci pipeline create --project-id a1b2c3d4-... --name \"nightly\" --config-provider github_app --config-repo-id 123456789 --config-file .circleci/nightly.yml --checkout-provider github_app --checkout-repo-id 123456789`\n\n#### `circleci pipeline list [flags]`\n\nList pipeline definitions for a project\n\nList all pipeline definitions for a CircleCI project.\n\nJSON fields: id, name, description, created_at, config_source.provider, config_source.file_path, config_source.repo.external_id, config_source.repo.full_name, checkout_source.provider, checkout_source.repo.external_id, checkout_source.repo.full_name\n\n| Flag                  | Description                                                                       |\n| --------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`         | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`              | Output as JSON                                                                    |\n| `--project string`    | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n| `--project-id string` | Project UUID (overrides --project)                                                |\n\n\n**Aliases:**\n\n\n`circleci pipeline ls`\n\n**Examples:**\n\n- List pipeline definitions for the current repository's project: \n  `circleci pipeline list`\n- List pipeline definitions for a specific project: \n  `circleci pipeline list --project gh/myorg/myrepo`\n- Output as JSON for scripting: \n  `circleci pipeline list --json`\n- Filter by config provider: \n  `circleci pipeline list --json --jq '.[] | select(.config_source.provider == \"github_app\")'`\n\n#### `circleci pipeline run [flags]`\n\nTrigger a new pipeline run\n\nTrigger a new pipeline run using the recommended CircleCI v2 API.\n\nIn a terminal, a missing --definition-id or --branch/--tag is prompted for; in\nnon-interactive mode both are optional. --branch and --tag are mutually\nexclusive and each sets both the config-fetch and checkout revision.\n\nA skipped pipeline (e.g. a [ci skip] commit message) exits 0 and prints why.\n\nJSON fields: id, state, number, created_at, triggered — or triggered, message when skipped.\n\n| Flag                     | Description                                                                       |\n| ------------------------ | --------------------------------------------------------------------------------- |\n| `-b, --branch string`    | Branch for config fetch and checkout (mutually exclusive with --tag)              |\n| `--definition-id string` | Pipeline definition UUID to run (prompted interactively if omitted)               |\n| `--jq string`            | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                 | Output as JSON                                                                    |\n| `--param stringArray`    | Pipeline parameter as key=value (repeatable)                                      |\n| `--project string`       | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n| `-t, --tag string`       | Tag for config fetch and checkout (mutually exclusive with --branch)              |\n\n\n**Examples:**\n\n- Trigger a pipeline interactively — pick definition and branch from menus: \n  `circleci pipeline run --project gh/myorg/myrepo`\n- Trigger a specific definition on a branch non-interactively: \n  `circleci pipeline run --project gh/myorg/myrepo --definition-id 2338d0ae-5541-4bbf-88a2-55e9f7281f80 --branch main`\n- Trigger on a tag with parameters: \n  `circleci pipeline run --project gh/myorg/myrepo --definition-id 2338d0ae-5541-4bbf-88a2-55e9f7281f80 --tag v1.2.3 --param deploy_env=staging`\n- Output as JSON for scripting: \n  `circleci pipeline run --project gh/myorg/myrepo --definition-id 2338d0ae-5541-4bbf-88a2-55e9f7281f80 --branch main --json`\n\n### `circleci run <command>`\n\nTrigger, watch and cancel CI runs\n\nWork with CircleCI runs.\n\nA run is created each time a trigger fires for a pipeline. It carries\nthe VCS context for that firing and groups the workflows it produced;\neach workflow in turn contains jobs.\n\n#### `circleci run cancel <run-number-or-id> [flags]`\n\nCancel a run\n\nCancel a running CircleCI run by number or UUID.\n\nCancelling a run stops all in-progress workflows and jobs within it.\nWorkflows that have already completed are unaffected.\n\n| Flag               | Description                                                     |\n| ------------------ | --------------------------------------------------------------- |\n| `-f, --force`      | skip confirmation prompt                                        |\n| `--project string` | Project slug (e.g. gh/org/repo); used when cancelling by number |\n\n\n**Arguments:**\n\n`<run-number-or-id>` identifies the run to cancel. A run can be specified by its UUID or number:\n- A run UUID, as shown in `circleci run list --json`\n- A run number, as shown in `circleci run list`.\n\nThe project is inferred from the git remote unless overridden with `--project`.\n\n**Examples:**\n\n- Cancel a run by number (with confirmation): \n  `circleci run cancel 75`\n- Cancel a run by UUID without confirmation: \n  `circleci run cancel 5034460f-c7c4-4c43-9457-de07e2029e7b --force`\n- Cancel the latest run on a branch: \n  `circleci run list --branch main --json --jq '.[0].id' | xargs circleci run cancel --force`\n\n#### `circleci run get [<run-id>] [flags]`\n\nGet a run's status\n\nDisplay the status of a CircleCI run and its workflows.\n\nWith no run UUID in an interactive terminal, a picker walks you through the\nrecent runs; --no-interactive, --json, or a non-interactive session skips it\nand resolves the latest run directly.\n\nJSON fields: id, phase, outcome, current_outcome, branch, tag, revision,\nrepository_url, commit.subject/url/author_name/author_login, created_at,\nerrors[].type/message, workflows[].id/name/phase/outcome/current_outcome/duration/\njobs[].id/name/phase/outcome/current_outcome/type\n\n| Flag                  | Description                                                                       |\n| --------------------- | --------------------------------------------------------------------------------- |\n| `-b, --branch string` | Branch name (defaults to the current branch, or main when --project is set)       |\n| `--failure-report`    | Print condensed output for every failed step; intended for agent consumption      |\n| `--jq string`         | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`              | Output as JSON                                                                    |\n| `-m, --mine`          | Filter to runs owned by you.                                                      |\n| `--no-interactive`    | Skip the interactive picker and resolve the latest run directly                   |\n| `--project string`    | Project slug (e.g. gh/org/repo); used for latest-run lookup                       |\n\n\n**Arguments:**\n\n`<run-id>` is optional and is the UUID of the run to look up. When\nomitted, the latest run is resolved from the project and branch\ninferred from the current git repository's remote and checked-out\nbranch (override with `--project` and `--branch`). With\n`--project` set, the branch defaults to main unless `--branch` is given.\n\n**Examples:**\n\n- Get the latest run for the current branch: \n  `circleci run get`\n- Get a run by UUID: \n  `circleci run get 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Output as JSON for scripting: \n  `circleci run get --json`\n- Get only your runs: \n  `circleci run get --mine`\n- Skip the picker and resolve the latest run directly: \n  `circleci run get --no-interactive`\n\n#### `circleci run list [flags]`\n\nList recent runs for a project\n\nList recent runs for a CircleCI project.\n\nThe project is inferred from the current git repository's remote\nunless overridden with --project. Use --branch to filter results\nto a single branch, or --current-branch (-B) to automatically use\nthe branch you have checked out.\n\nThe markdown table includes the commit subject; the JSON adds the full\ncommit and repository detail.\n\nJSON fields: id, phase, outcome, current_outcome, branch, tag, revision, repository_url, commit.subject/url/author_name/author_login, created_at\n\n| Flag                   | Description                                                                       |\n| ---------------------- | --------------------------------------------------------------------------------- |\n| `-b, --branch string`  | Filter by branch                                                                  |\n| `-B, --current-branch` | Filter by the currently checked-out branch                                        |\n| `--jq string`          | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`               | Output as JSON                                                                    |\n| `--limit int`          | Maximum number of runs to show [default: 10] (default 10)                         |\n| `--project string`     | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Aliases:**\n\n\n`circleci run ls`\n\n**Examples:**\n\n- List recent runs for the current project: \n  `circleci run list`\n- Filter to the branch you have checked out: \n  `circleci run list --current-branch`\n- Filter to a specific branch: \n  `circleci run list --branch main`\n- List runs for an explicit project: \n  `circleci run list --project gh/org/repo`\n- Show more results: \n  `circleci run list --limit 25`\n- Output as JSON for scripting: \n  `circleci run list --json`\n\n#### `circleci run open [flags]`\n\nOpen the current project's runs page in the browser\n\nOpen the CircleCI runs page for the current project in your\ndefault web browser.\n\nThe project is inferred from the current git repository's remote.\nSupports GitHub, Bitbucket, and GitLab remotes.\n\nUse --current-branch or --branch/-b to filter runs to a specific branch.\n\n| Flag                  | Description                                                 |\n| --------------------- | ----------------------------------------------------------- |\n| `-b, --branch string` | Branch name (defaults to current branch)                    |\n| `--project string`    | Project slug (e.g. gh/org/repo); used for latest-run lookup |\n\n\n**Examples:**\n\n- Open runs for the current repo: \n  `circleci run open`\n- Open runs filtered to the current git branch: \n  `circleci run open --current-branch`\n- Open runs filtered to a specific branch: \n  `circleci run open --branch my-feature`\n- Open runs filtered to a specific branch (short flag): \n  `circleci run open -b main`\n- Open when your remote is on CircleCI server: \n  `circleci run open --host https://circleci.example.com`\n\n#### `circleci run trigger [flags]`\n\nTrigger a new run\n\nTrigger a new run for a CircleCI project.\n\nThe project and branch are inferred from the current git repository\nunless overridden with --project or --branch.\n\nPass run parameters with --parameter. Values are parsed as\nbooleans (true/false), integers, or strings.\n\nJSON fields: id, number, state, created_at\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `-b, --branch string`     | Branch to trigger (defaults to current branch)                                    |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--parameter stringArray` | Run parameter as key=value (repeatable)                                           |\n| `--project string`        | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Examples:**\n\n- Trigger a run on the current branch: \n  `circleci run trigger`\n- Trigger on a specific branch: \n  `circleci run trigger --branch main`\n- Trigger with run parameters: \n  `circleci run trigger --parameter deploy_env=staging --parameter run_e2e=true`\n- Output the triggered run as JSON: \n  `circleci run trigger --json`\n\n#### `circleci run watch [<run-id>] [flags]`\n\nWatch a run until it completes\n\nMonitor a CircleCI run and block until it reaches a terminal state. Without\narguments, watches the latest run for the current branch. A terminal gets a\nlive table of workflows and jobs; piped or in CI, each change prints a line.\n\nExit code reflects the result: 0 succeeded, 1 failed, 6 cancelled, 7 the run's\nconfig was rejected (a dynamic-config continuation included), 8 timed out.\nWith --sha, polls up to 2 minutes for the run to appear — useful after a push.\n\n| Flag                  | Description                                                            |\n| --------------------- | ---------------------------------------------------------------------- |\n| `-b, --branch string` | Branch to watch (defaults to current branch)                           |\n| `--failfast`          | Exit as soon as any job fails, without waiting for the rest of the run |\n| `--project string`    | Project slug (e.g. gh/org/repo); defaults to git remote                |\n| `--sha string`        | Watch run for this commit SHA; polls up to 2m if not yet created       |\n| `--timeout duration`  | Maximum time to wait for run completion (default 30m0s)                |\n\n\n**Arguments:**\n\n`<run-id>` is optional: a run UUID (as shown by `circleci run list --json`)\nor a run number (as shown by `circleci run list`).\n\nWhen omitted, the latest run for the current branch is watched.\n\n**Examples:**\n\n- Watch the latest run on the current branch: \n  `circleci run watch`\n- Push and watch in one step: \n  `git push && circleci run watch --sha $(git rev-parse HEAD)`\n- Watch by UUID (e.g. from 'run list --json'): \n  `circleci run watch 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Watch with a longer timeout: \n  `circleci run watch --timeout 30m`\n- Exit as soon as any job fails: \n  `circleci run watch --failfast`\n\n### `circleci testresult <command>`\n\nInspect test results for a job\n\nWork with the test metadata CircleCI collects for a job.\n\nWhen a job stores test results (via the 'store_test_results' step),\nCircleCI parses them into per-test records. Use these commands to\nreview which tests failed, passed or were skipped without opening the\nweb UI.\n\n#### `circleci testresult get <job-id> <name> [flags]`\n\nGet a single test result by name\n\nGet a single test result from a job by its exact name.\n\nWhen several tests share a name the lookup is ambiguous and fails; narrow it\nwith `--filter classname=<value>`, or browse with `circleci testresult list`.\n\nJSON fields: classname, name, result, run_time, message\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--filter <value>` | Disambiguate by classname=<value> when a name is shared; repeatable               |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--plain`          | Print only the raw test message, verbatim and unformatted                         |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose test results to search. Job\nUUIDs are shown in `circleci job get` and `circleci run get --json`.\n\n`<name>` is the exact test name to look up. If more than one test\nshares that name, use `--filter classname=<value>` to disambiguate.\n\n**Examples:**\n\n- Get a test by name: \n  `circleci testresult get 8e50c384-0083-43d0-bc8f-93f0db589d6b TestLogin`\n- Disambiguate when the name appears in multiple suites: \n  `circleci testresult get <job-id> TestLogin --filter classname=api`\n- Print only the raw test message: \n  `circleci testresult get <job-id> TestLogin --plain`\n- Output as JSON: \n  `circleci testresult get <job-id> TestLogin --json`\n\n#### `circleci testresult list <job-id> [flags]`\n\nList test results for a job\n\nShow the test results recorded for a CircleCI job. Only failed tests are\nshown unless --all or a result= filter selects otherwise.\n\nJSON fields: classname, name, result, run_time, message — emitted as one\nobject per line (JSONL), so --jq runs once per record. See\n`circleci help formatting` for aggregating across the stream.\n\n| Flag                   | Description                                                                                                                                                                                                       |\n| ---------------------- | ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `--all`                | Show all results (passing, failed and skipped), not just failures                                                                                                                                                 |\n| `--filter stringArray` | Filter by key=value; repeatable. Keys: result (success\\|failure\\|skipped, exact), name and classname (case-insensitive substring). Same key repeated is OR, different keys AND. Cannot combine result= with --all |\n| `--jq string`          | Process values from the response using jq syntax (see `circleci help formatting`)                                                                                                                                 |\n| `--json`               | Output as JSON                                                                                                                                                                                                    |\n| `--limit int`          | Maximum number of results to show (0 = no limit)                                                                                                                                                                  |\n| `--sort string`        | Sort by name, classname, result or run_time                                                                                                                                                                       |\n\n\n**Arguments:**\n\n`<job-id>` is the UUID of the job whose test results to list. Job\nUUIDs are shown in `circleci job get` and `circleci run get --json`.\n\n**Aliases:**\n\n\n`circleci testresult ls`\n\n**Examples:**\n\n- List failed tests for a job (the default): \n  `circleci testresult list 8e50c384-0083-43d0-bc8f-93f0db589d6b`\n- Show every result: passing, failed and skipped: \n  `circleci testresult list <job-id> --all`\n- Show skipped tests instead: \n  `circleci testresult list <job-id> --filter result=skipped`\n- Failed tests in one suite, slowest last: \n  `circleci testresult list <job-id> --filter classname=api --sort run_time`\n- Count failed tests by aggregating the JSONL stream with jq: \n  `circleci testresult list <job-id> --json --jq '[.,inputs] | length'`\n\n### `circleci workflow <command>`\n\nInspect, rerun and cancel workflows (job graphs)\n\nWork with CircleCI workflows.\n\nWorkflows orchestrate jobs within a run. Use these commands to\ninspect workflow status, rerun failed jobs, or cancel a running workflow.\n\nWorkflow IDs are shown in the output of 'circleci run get'.\n\n#### `circleci workflow cancel <workflow-id> [flags]`\n\nCancel a running workflow\n\nCancel a running CircleCI workflow.\n\nAny in-progress jobs will be stopped. Jobs that have already\ncompleted are not affected.\n\nWorkflow IDs are shown in the output of 'circleci run get'.\n\n| Flag          | Description              |\n| ------------- | ------------------------ |\n| `-f, --force` | skip confirmation prompt |\n\n\n**Arguments:**\n\n`<workflow-id>` is the UUID of the workflow to cancel. Workflow IDs are\nshown in the output of `circleci run get`.\n\n**Examples:**\n\n- Cancel a running workflow (with confirmation): \n  `circleci workflow cancel 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Cancel without confirmation: \n  `circleci workflow cancel 5034460f-c7c4-4c43-9457-de07e2029e7b --force`\n- Find a running workflow ID from the latest run and cancel it: \n  `circleci run get --json --jq '.workflows[] | select(.status==\"running\") | .id' | xargs circleci workflow cancel --force`\n\n#### `circleci workflow get <workflow-id> [flags]`\n\nGet workflow details\n\nDisplay the status and jobs of a CircleCI workflow.\n\nWorkflow IDs are shown in the output of 'circleci run get'.\n\nJSON fields: id, name, phase, outcome, current_outcome, run_id, created_at, ended_at, jobs[].id/name/phase/outcome/current_outcome/type\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\n`<workflow-id>` is the UUID of the workflow to look up. Workflow IDs are\nshown in the output of `circleci run get`.\n\n**Examples:**\n\n- Get workflow details: \n  `circleci workflow get 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Output as JSON: \n  `circleci workflow get 5034460f-c7c4-4c43-9457-de07e2029e7b --json`\n- Get workflow ID from a run: \n  `circleci run get | grep -A1 \"Workflows\"`\n\n#### `circleci workflow list [<run-id>] [flags]`\n\nList workflows for a run or recent runs\n\nList workflows for a CircleCI run, or for recent runs in the project when\nno run is given.\n\nJSON fields (single run): id, name, phase, outcome, current_outcome.\nRecent-runs mode adds run_id.\n\n| Flag                  | Description                                                                       |\n| --------------------- | --------------------------------------------------------------------------------- |\n| `-b, --branch string` | Filter by branch (recent-runs mode)                                               |\n| `--jq string`         | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`              | Output as JSON                                                                    |\n| `--limit int`         | Number of recent runs to show (recent-runs mode) (default 10)                     |\n| `--project string`    | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Arguments:**\n\n`<run-id>` is optional: a run UUID (as shown by `circleci run list --json`)\nor a run number (as shown by `circleci run list`).\n\nWhen omitted, workflows for recent runs in the current project are listed,\ngrouped by run.\n\n**Aliases:**\n\n\n`circleci workflow ls`\n\n**Examples:**\n\n- List workflows for recent runs in the current project: \n  `circleci workflow list`\n- Filter to a specific branch: \n  `circleci workflow list --branch main`\n- List workflows by run number: \n  `circleci workflow list 75`\n- List workflows by run UUID: \n  `circleci workflow list 9e0c9d52-3b7e-4cd6-b5f7-bfc5e4a07e81`\n- Output as JSON: \n  `circleci workflow list --json`\n\n#### `circleci workflow open <workflow-id>`\n\nOpen workflow in browser\n\n**Arguments:**\n\n`<workflow-id>` is the UUID of the workflow to look up. Workflow IDs are\nshown in the output of `circleci run get`.\n\n**Examples:**\n\n- Open workflow details: \n  `circleci workflow open 5034460f-c7c4-4c43-9457-de07e2029e7b`\n\n#### `circleci workflow rerun <workflow-id> [flags]`\n\nRerun a workflow\n\nAll jobs rerun from scratch unless --from-failed is given, which reruns\nonly the jobs that failed. Either way a new workflow is created, and its\nID is reported so you can follow the run.\n\nJSON fields: workflow_id, rerun_from, from_failed\n\n| Flag            | Description            |\n| --------------- | ---------------------- |\n| `--from-failed` | Rerun only failed jobs |\n| `--json`        | Output as JSON         |\n\n\n**Arguments:**\n\n`<workflow-id>` is the UUID of the workflow to rerun. Workflow IDs are\nshown in the output of `circleci run get`.\n\n**Examples:**\n\n- Rerun all jobs in a workflow from scratch: \n  `circleci workflow rerun 5034460f-c7c4-4c43-9457-de07e2029e7b`\n- Rerun only the failed jobs: \n  `circleci workflow rerun 5034460f-c7c4-4c43-9457-de07e2029e7b --from-failed`\n- Find a workflow ID from the latest run: \n  `circleci run get --json --jq '.workflows[].id'`\n- Rerun and capture the new workflow's ID: \n  `circleci workflow rerun <workflow-id> --from-failed --json --jq .workflow_id`\n\n## Management Commands\n\n### `circleci certificate <command>`\n\nManage iOS code signing certificates\n\nUpload, list, and delete Apple .p12 code signing certificates stored in\nyour CircleCI organization's secure storage.\n\nCertificates are referenced by ID from a signing config. Deleting a\ncertificate that is referenced by a signing config will invalidate that\nsigning config.\n\n#### `circleci certificate delete <cert-id> [flags]`\n\nDelete an iOS certificate\n\nRemove an Apple certificate from your organization's secure storage.\n\nThis action is irreversible. The server rejects the delete with an\nerror if the certificate is referenced by any signing config; delete\nthose signing configs first.\n\n| Flag          | Description              |\n| ------------- | ------------------------ |\n| `-f, --force` | skip confirmation prompt |\n\n\n**Arguments:**\n\n`<cert-id>` is the ID of the certificate to delete.\nFind the certificate ID with `circleci certificate list`.\n\n**Aliases:**\n\n\n`circleci certificate rm`\n\n**Examples:**\n\n- Delete a certificate (with confirmation): \n  `circleci certificate delete <cert-id>`\n- Delete without confirmation: \n  `circleci certificate delete <cert-id> --force`\n\n#### `circleci certificate list [flags]`\n\nList uploaded iOS certificates\n\nList Apple .p12 certificates currently stored in your organization's\nsecure storage.\n\nJSON fields: id, file_name, org_id, created_at\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n\n\n**Aliases:**\n\n\n`circleci certificate ls`\n\n**Examples:**\n\n- List certificates (org inferred from git remote): \n  `circleci certificate list`\n- List for a specific org: \n  `circleci certificate list --org gh/acme`\n- Output as JSON: \n  `circleci certificate list --json`\n- Get cert IDs only: \n  `circleci certificate list --json --jq '.[].id'`\n\n#### `circleci certificate upload [flags]`\n\nUpload a .p12 certificate\n\nUpload an Apple .p12 code signing certificate to your CircleCI\norganization's secure storage.\n\nThe certificate file is read from disk and base64-encoded locally\nbefore being sent. In a terminal, --password may be omitted and you\nwill be prompted with input masking.\n\nPass --password - to read the password from stdin, keeping it out of\nshell history and process listings.\n\nJSON fields: id, file_name\n\n| Flag                 | Description                                                                               |\n| -------------------- | ----------------------------------------------------------------------------------------- |\n| `--cert-file string` | Path to the .p12 certificate file                                                         |\n| `--jq string`        | Process values from the response using jq syntax (see `circleci help formatting`)         |\n| `--json`             | Output as JSON                                                                            |\n| `--org string`       | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                         |\n| `--password string`  | Password for the .p12 file. Pass - to read from stdin. Prompted if omitted in a terminal. |\n\n\n**Examples:**\n\n- Upload a certificate (org inferred from git remote, password prompted): \n  `circleci certificate upload --cert-file ./Certificates.p12`\n- Read the password from stdin (no shell history exposure): \n  `echo \"$P12_PASSWORD\" | circleci certificate upload --cert-file ./Certificates.p12 --password -`\n- Explicit org and capture the new cert id for scripting: \n  `echo \"$P12_PASSWORD\" | circleci certificate upload --org gh/acme --cert-file ./Certificates.p12 --password - --json --jq -r '.id'`\n\n### `circleci component-version <command>`\n\nManage deploy component versions\n\nList and inspect CircleCI deploy component versions.\n\nDeploy component versions represent specific released versions\nof a component across environments.\n\nAlso available as: circleci deploy version <command>\n\n#### `circleci component-version list <component-id> [flags]`\n\nList versions of a deploy component\n\nList versions of a CircleCI deploy component.\n\nOptionally filter by deploy environment with --environment.\n\nJSON fields: name, component_id, created_at\n\n| Flag                   | Description                                                                       |\n| ---------------------- | --------------------------------------------------------------------------------- |\n| `--environment string` | Filter by deploy environment ID                                                   |\n| `--jq string`          | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`               | Output as JSON                                                                    |\n\n\n**Arguments:**\n\n`<component-id>` is the UUID of the deploy component whose\nversions you want to list. Component IDs are shown in the output of\n`circleci deploy component list`.\n\n**Aliases:**\n\n\n`circleci component-version ls`\n\n**Examples:**\n\n- List versions of a component: \n  `circleci component-version list a0000000-0000-4000-8000-000000c00001`\n- Filter by environment: \n  `circleci component-version list a0000000-0000-4000-8000-000000c00001 --environment a0000000-0000-4000-8000-000000e00001`\n- Output as JSON: \n  `circleci component-version list a0000000-0000-4000-8000-000000c00001 --json`\n\n### `circleci context <command>`\n\nManage secret env vars shared across pipelines\n\nWork with CircleCI contexts.\n\nContexts are named collections of secret environment variables that\ncan be shared across runs within an organization. Jobs can\nreference a context to inject its variables into the build environment.\n\n#### `circleci context create <name> [flags]`\n\nCreate a new context\n\nCreate a new CircleCI context for an organization.\n\nJSON fields: id, name, created_at\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg); defaults to git remote                         |\n\n\n**Arguments:**\n\n`<name>` is the name for the new context, for example, `build-secrets`.\n\n**Examples:**\n\n- Create a context for the org inferred from git remote: \n  `circleci context create my-context`\n- Create a context for a specific organization: \n  `circleci context create my-context --org gh/myorg`\n- Create and capture the ID: \n  `circleci context create my-context --org gh/myorg --json --jq '.id'`\n\n#### `circleci context delete <context-id|context-name> [flags]`\n\nDelete a context\n\nDelete a CircleCI context by UUID or name.\n\nDeleting a context removes all environment variables stored in it.\nJobs that reference this context will fail until they are updated.\n\n| Flag           | Description                                                       |\n| -------------- | ----------------------------------------------------------------- |\n| `-f, --force`  | skip confirmation prompt                                          |\n| `--org string` | Organization slug (e.g. gh/myorg); used when resolving name to ID |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Aliases:**\n\n\n`circleci context rm`\n\n**Examples:**\n\n- Delete a context by UUID (with confirmation): \n  `circleci context delete ctx-uuid-here`\n- Delete a context by name (org inferred from git remote): \n  `circleci context delete my-context`\n- Delete a context by name in a specific org, without confirmation: \n  `circleci context delete my-context --org gh/myorg --force`\n\n#### `circleci context get <context-id|context-name> [flags]`\n\nGet details of a context\n\nDisplay details of a CircleCI context, including its environment\nvariable names and metadata.\n\nVariable values are never returned by the API once set.\n\nJSON fields: id, name, org_id, created_at, environment_variables, restrictions\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg); used when resolving name to ID                 |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Examples:**\n\n- Get a context by UUID: \n  `circleci context get ctx-uuid-here`\n- Get a context by name (org inferred from git remote): \n  `circleci context get my-context`\n- Get a context by name in a specific org: \n  `circleci context get my-context --org gh/myorg`\n- Output as JSON: \n  `circleci context get my-context --json`\n- Get just the org ID: \n  `circleci context get ctx-uuid-here --json --jq '.org_id'`\n\n#### `circleci context list [flags]`\n\nList contexts for an organization\n\nList all contexts for a CircleCI organization.\n\nJSON fields: id, name, created_at\n\n| Flag            | Description                                                                       |\n| --------------- | --------------------------------------------------------------------------------- |\n| `--jq string`   | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`        | Output as JSON                                                                    |\n| `--name string` | Find contexts by name (partial match)                                             |\n| `--org string`  | Organization slug (e.g. gh/myorg); defaults to git remote                         |\n\n\n**Aliases:**\n\n\n`circleci context ls`\n\n**Examples:**\n\n- List contexts for the org inferred from git remote: \n  `circleci context list`\n- List contexts containing the given name: \n  `circleci context list --name substring`\n- List contexts for a specific organization: \n  `circleci context list --org gh/myorg`\n- Output as JSON for scripting: \n  `circleci context list --json`\n- Get just context names: \n  `circleci context list --json --jq '.[].name'`\n\n#### `circleci context open [flags]`\n\nOpen the contexts settings page in the browser\n\nOpen the CircleCI contexts settings page for an organization in your\ndefault web browser.\n\nThe organization is inferred from the current git repository's remote\nunless overridden with --org. Supports GitHub, Bitbucket, and GitLab\nremotes.\n\n| Flag           | Description                                               |\n| -------------- | --------------------------------------------------------- |\n| `--org string` | Organization slug (e.g. gh/myorg); defaults to git remote |\n\n\n**Examples:**\n\n- Open contexts for the org inferred from git remote: \n  `circleci context open`\n- Open contexts for a specific organization: \n  `circleci context open --org gh/myorg`\n- Open when your remote is on CircleCI server: \n  `circleci context open --host https://circleci.example.com`\n\n#### `circleci context restriction <command>`\n\nManage context restrictions\n\nAdd and remove restrictions that control which projects and groups\ncan use a CircleCI context.\n\nRestrictions scope context access to specific projects, pipeline\nexpressions, or VCS groups. A context with no restrictions is\naccessible to all members of the organization.\n\n##### `circleci context restriction create <context-id|context-name> [flags]`\n\nAdd a restriction to a context\n\nAdd a restriction to a CircleCI context.\n\nJSON fields: id, name, restriction_type, restriction_value\n\n| Flag             | Description                                                                       |\n| ---------------- | --------------------------------------------------------------------------------- |\n| `--jq string`    | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`         | Output as JSON                                                                    |\n| `--org string`   | Organization slug (e.g. gh/myorg); used when resolving name to ID                 |\n| `--type string`  | Restriction type: project, expression, or group                                   |\n| `--value string` | Value of the restriction                                                          |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Examples:**\n\n- Restrict context to a specific project: \n  `circleci context restriction create ctx-uuid --type project --value proj-uuid`\n- Restrict context to a specific group: \n  `circleci context restriction create ctx-uuid --type group --value group-uuid`\n- Restrict context using a pipeline expression: \n  `circleci context restriction create ctx-uuid --type expression --value 'pipeline.git.branch == \"main\"'`\n- Capture the restriction ID: \n  `circleci context restriction create ctx-uuid --type project --value proj-uuid --json --jq '.id'`\n\n##### `circleci context restriction delete <context-id|context-name> [flags]`\n\nDelete a restriction from a context\n\nRemove a restriction from a CircleCI context.\n\nThis action is irreversible. Once removed, the context will be\naccessible to any project or group that was previously blocked.\n\n| Flag                      | Description                                                       |\n| ------------------------- | ----------------------------------------------------------------- |\n| `-f, --force`             | Skip confirmation prompt                                          |\n| `--org string`            | Organization slug (e.g. gh/myorg); used when resolving name to ID |\n| `--restriction-id string` | UUID of the restriction to delete                                 |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Aliases:**\n\n\n`circleci context restriction rm`\n\n**Examples:**\n\n- Delete a restriction (with confirmation): \n  `circleci context restriction delete ctx-uuid --restriction-id r-uuid`\n- Delete without confirmation: \n  `circleci context restriction delete ctx-uuid --restriction-id r-uuid --force`\n\n#### `circleci context secret <command>`\n\nManage context environment variables\n\nList, set, and delete environment variables stored in a CircleCI context.\n\nContext environment variables are injected into jobs that reference the\ncontext. Variable values are never returned by the API after being set.\n\n##### `circleci context secret delete <context-id|context-name> [flags]`\n\nDelete an environment variable from a context\n\nRemove an environment variable from a CircleCI context.\n\nThis action is irreversible. Jobs that depend on this variable will\nfail until a new value is set.\n\n| Flag            | Description                                                       |\n| --------------- | ----------------------------------------------------------------- |\n| `-f, --force`   | skip confirmation prompt                                          |\n| `--name string` | Name of the environment variable to delete                        |\n| `--org string`  | Organization slug (e.g. gh/myorg); used when resolving name to ID |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Aliases:**\n\n\n`circleci context secret rm`\n\n**Examples:**\n\n- Delete a variable (with confirmation): \n  `circleci context secret delete ctx-uuid-here --name MY_SECRET`\n- Delete without confirmation: \n  `circleci context secret delete ctx-uuid-here --name MY_SECRET --force`\n\n##### `circleci context secret list <context-id|context-name> [flags]`\n\nList environment variables in a context\n\nList the environment variable names stored in a CircleCI context.\n\nVariable values are never returned by the API once set.\n\nJSON fields: variable, truncated_value, context_id, created_at, updated_at\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg); used when resolving name to ID                 |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Aliases:**\n\n\n`circleci context secret ls`\n\n**Examples:**\n\n- List env vars in a context by UUID: \n  `circleci context secret list ctx-uuid-here`\n- List env vars by context name (org inferred from git remote): \n  `circleci context secret list my-context`\n- List env vars by context name in a specific org: \n  `circleci context secret list my-context --org gh/myorg`\n- Get variable names only: \n  `circleci context secret list ctx-uuid-here --json --jq '.[].variable'`\n\n##### `circleci context secret set <context-id|context-name> [flags]`\n\nSet an environment variable in a context\n\nAdd or update an environment variable in a CircleCI context.\n\nAn existing variable is overwritten. The value is never retrievable once\nset, and in a terminal --value may be omitted to be prompted with masking.\n\n| Flag             | Description                                                           |\n| ---------------- | --------------------------------------------------------------------- |\n| `--name string`  | Name of the environment variable                                      |\n| `--org string`   | Organization slug (e.g. gh/myorg); used when resolving name to ID     |\n| `--value string` | Value of the environment variable (prompted if omitted in a terminal) |\n\n\n**Arguments:**\n\nA context can be specified by name or ID:\n- By name, for example, `context-name`\n- By ID, for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Examples:**\n\n- Set an environment variable by context UUID (value prompted): \n  `circleci context secret set ctx-uuid-here --name MY_SECRET`\n- Set an environment variable by context name: \n  `circleci context secret set my-context --org gh/myorg --name MY_SECRET --value s3cr3t`\n- Read a value from a file: \n  `circleci context secret set ctx-uuid-here --name MY_SECRET --value \"$(cat secret.txt)\"`\n- Read a value from stdin: \n  `circleci context secret set ctx-uuid-here --name MY_SECRET --value \"$(cat)\"`\n\n### `circleci deploy <command>`\n\nTrack released components and versions\n\nWork with CircleCI Deploys.\n\nView deployed components and their versions across environments.\n\n#### `circleci deploy component <command>`\n\nManage deploy components\n\nList and inspect CircleCI deploy components.\n\nDeploy components represent the deployable units of a project,\nsuch as a service, application, or library.\n\n##### `circleci deploy component get <component-id> [flags]`\n\nGet a deploy component\n\nGet details about a CircleCI deploy component by ID.\n\nJSON fields: id, name, project_id\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Examples:**\n\n- Get a deploy component by ID: \n  `circleci deploy component get a0000000-0000-4000-8000-000000c00001`\n- Output as JSON: \n  `circleci deploy component get a0000000-0000-4000-8000-000000c00001 --json`\n- Filter JSON output with jq: \n  `circleci deploy component get a0000000-0000-4000-8000-000000c00001 --json --jq '.name'`\n\n##### `circleci deploy component list [flags]`\n\nList deploy components\n\nList deploy components for a CircleCI project.\n\nThe project is inferred from the current git repository's remote\nunless overridden with --project.\n\nJSON fields: id, name, project_id\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Aliases:**\n\n\n`circleci deploy component ls`\n\n**Examples:**\n\n- List components for the current git remote's project: \n  `circleci deploy component list`\n- List components for a specific project: \n  `circleci deploy component list --project gh/myorg/myrepo`\n- Output as JSON: \n  `circleci deploy component list --json`\n\n#### `circleci deploy environment <command>`\n\nManage deploy environments\n\nList and inspect CircleCI deploy environments.\n\nDeploy environments represent targets such as production or staging\nwhere components are deployed.\n\n##### `circleci deploy environment get <environment-id> [flags]`\n\nGet a deploy environment\n\nGet details about a CircleCI deploy environment by ID.\n\nJSON fields: id, name, org_id\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Examples:**\n\n- Get a deploy environment by ID: \n  `circleci deploy environment get a0000000-0000-4000-8000-000000e00001`\n- Output as JSON: \n  `circleci deploy environment get a0000000-0000-4000-8000-000000e00001 --json`\n- Filter JSON output with jq: \n  `circleci deploy environment get a0000000-0000-4000-8000-000000e00001 --json --jq '.name'`\n\n##### `circleci deploy environment list [flags]`\n\nList deploy environments\n\nList deploy environments for a CircleCI organization.\n\nThe organization is inferred from the current git repository's remote\nunless overridden with --org.\n\nJSON fields: id, name, org_id\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg); defaults to git remote                         |\n\n\n**Aliases:**\n\n\n`circleci deploy environment ls`\n\n**Examples:**\n\n- List environments for the current git remote's org: \n  `circleci deploy environment list`\n- List environments for a specific org: \n  `circleci deploy environment list --org gh/myorg`\n- Output as JSON: \n  `circleci deploy environment list --json`\n\n#### `circleci deploy init [flags]`\n\nInstrument your config for deploy tracking\n\nSet up deploy markers in .circleci/config.yml.\n\nScans the config for deploy-like jobs (names containing deploy,\nrelease, publish, or ship), prompts for your service name and\ntarget environment, then adds a log step to each deploy job.\n\nThe command is idempotent: running it twice on the same config\nmakes no duplicate changes.\n\nWorks offline — no API calls required.\n\n| Flag                       | Description                                                                |\n| -------------------------- | -------------------------------------------------------------------------- |\n| `--component string`       | Service/component name (skips prompt)                                      |\n| `--environment string`     | Default environment for jobs whose target can't be inferred (skips prompt) |\n| `--pipeline-config string` | Path to CircleCI pipeline config file (default \".circleci/config.yml\")     |\n\n\n**Examples:**\n\n- Interactive setup in the current repo: \n  `circleci deploy init`\n- Skip the service-name prompt: \n  `circleci deploy init --component api`\n- Fully non-interactive (supply both answers as flags): \n  `circleci deploy init --component api --environment production`\n- Use a non-default config location: \n  `circleci deploy init --pipeline-config path/to/config.yml`\n\n#### `circleci deploy list [flags]`\n\nList recent deploys\n\nList deploys for a CircleCI project.\n\nThe project is inferred from the current git repository's remote\nunless overridden with --project. Each deploy shows the component,\nversion, status, type, and when it was created.\n\nJSON fields: id, component_name, version, type, status, is_rollback, pipeline_id, workflow_id, created_at, ended_at\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Aliases:**\n\n\n`circleci deploy ls`\n\n**Examples:**\n\n- List the 10 most recent deploys (auto-detect project from git remote): \n  `circleci deploy list`\n- List for a specific project: \n  `circleci deploy list --project gh/myorg/myrepo`\n- Output as JSON for scripting: \n  `circleci deploy list --json`\n\n#### `circleci deploy open [flags]`\n\nOpen the deploys page in the browser\n\nOpen the CircleCI deploys page for the current project in your\ndefault web browser.\n\nThe project is inferred from the current git repository's remote\nunless overridden with --project. Supports GitHub, Bitbucket, and\nGitLab remotes.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Examples:**\n\n- Open the deploys page for the current project: \n  `circleci deploy open`\n- Open the deploys page for a specific project: \n  `circleci deploy open --project gh/myorg/myrepo`\n\n#### `circleci deploy rollback <target-version> [flags]`\n\nRoll back a deployed component to an earlier version\n\nRoll back a deployed component to an earlier version. --from must name\nthe version currently deployed; omit it to use the latest deployed one.\n\nJSON fields: id, rollback_type, project_id, component_id, environment_id\n\n| Flag                    | Description                                                                       |\n| ----------------------- | --------------------------------------------------------------------------------- |\n| `--checkout-ref string` | Git ref the rollback pipeline checks out                                          |\n| `--component string`    | Deploy component name or ID (required)                                            |\n| `--config-ref string`   | Git ref the rollback pipeline's config is read from                               |\n| `--environment string`  | Deploy environment name or ID (required)                                          |\n| `-f, --force`           | skip confirmation prompt                                                          |\n| `--from string`         | Version being replaced; defaults to the latest deployed                           |\n| `--jq string`           | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                | Output as JSON                                                                    |\n| `--namespace string`    | Namespace scoping the component (default \"default\")                               |\n| `--param stringArray`   | Rollback pipeline parameter as key=value (repeatable)                             |\n| `--project string`      | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n| `--reason string`       | Why the rollback was requested; recorded in the audit log                         |\n\n\n**Examples:**\n\n- Roll production back to 1.2.0 (with confirmation): \n  `circleci deploy rollback 1.2.0 --component web-frontend --environment production`\n- Assert the version being replaced, and skip the prompt: \n  `circleci deploy rollback 1.2.0 --component web-frontend --environment production --from 1.3.0 --force`\n- Roll back with a reason and a rollback-pipeline parameter: \n  `circleci deploy rollback 1.2.0 --component web-frontend --environment production --reason \"bad release\" --param notify=true`\n\n#### `circleci deploy settings [flags]`\n\nGet deploy settings for a project\n\nGet deploy settings for a CircleCI project.\n\nThe project is inferred from the current git repository's remote\nunless overridden with --project.\n\nJSON fields: id, project_id\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Examples:**\n\n- Get deploy settings for the current git remote's project: \n  `circleci deploy settings`\n- Get settings for a specific project: \n  `circleci deploy settings --project gh/myorg/myrepo`\n- Output as JSON: \n  `circleci deploy settings --json`\n\n#### `circleci deploy version <command>`\n\nManage deploy component versions\n\nList and inspect CircleCI deploy component versions.\n\nDeploy component versions represent specific released versions\nof a component across environments.\n\n##### `circleci deploy version list <component-id> [flags]`\n\nList versions of a deploy component\n\nList versions of a CircleCI deploy component.\n\nOptionally filter by deploy environment with --environment.\n\nJSON fields: name, component_id, created_at\n\nPrimary alias: circleci component-version list <component-id>\n\n| Flag                   | Description                                                                       |\n| ---------------------- | --------------------------------------------------------------------------------- |\n| `--environment string` | Filter by deploy environment ID                                                   |\n| `--jq string`          | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`               | Output as JSON                                                                    |\n\n\n**Aliases:**\n\n\n`circleci deploy version ls`\n\n**Examples:**\n\n- List versions of a component: \n  `circleci deploy version list a0000000-0000-4000-8000-000000c00001`\n- Filter by environment: \n  `circleci deploy version list a0000000-0000-4000-8000-000000c00001 --environment a0000000-0000-4000-8000-000000e00001`\n- Output as JSON: \n  `circleci deploy version list a0000000-0000-4000-8000-000000c00001 --json`\n\n### `circleci dlc <command>`\n\nPurge a project's Docker layer cache (DLC)\n\nManage docker layer caching (DLC) for projects.\n\nDocker layer caching allows CircleCI to cache individual Docker image\nlayers between pipeline runs. Use 'circleci dlc purge' to invalidate\nthe cache for a project and force a fresh image build on the next run.\n\nThese commands are also available under 'circleci project dlc'.\n\n**Examples:**\n\n- Purge DLC for the current git repository's project: \n  `circleci dlc purge`\n- Purge DLC for a specific project: \n  `circleci dlc purge --project gh/myorg/myrepo`\n- Purge DLC and output result as JSON: \n  `circleci dlc purge --project gh/myorg/myrepo --json`\n\n#### `circleci dlc purge [flags]`\n\nPurge the Docker Layer Cache for a project\n\nPurge the docker layer cache (DLC) for a project.\n\nDocker layer caching stores individual Docker image layers between\npipeline runs to speed up builds. Purging the cache forces CircleCI\nto rebuild all layers from scratch on the next run, which is useful\nwhen a cached layer contains stale or corrupt data.\n\nJSON fields (--json): project_id, project_slug\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `-f, --force`      | Skip confirmation prompt                                |\n| `--json`           | Output as JSON                                          |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Examples:**\n\n- Purge DLC for the current git repository's project: \n  `circleci dlc purge`\n- Purge DLC for a specific project: \n  `circleci dlc purge --project gh/myorg/myrepo`\n- Skip the confirmation prompt (for scripting): \n  `circleci dlc purge --project gh/myorg/myrepo --force`\n- Purge DLC and output result as JSON: \n  `circleci dlc purge --project gh/myorg/myrepo --force --json`\n- Purge DLC for a Bitbucket project: \n  `circleci dlc purge --project bb/myorg/myrepo`\n\n### `circleci envvar <command>`\n\nList, set and delete a project's environment variables\n\nList, set, and delete environment variables for a CircleCI project.\n\nEnvironment variable values are masked in list output (shown as \"xxxx\").\nThe full value is never retrievable after it has been set.\n\nAlso available as: circleci project envvar `<command>`\n\n**Examples:**\n\n- List all environment variables for the current project: \n  `circleci envvar list`\n- Set an environment variable: \n  `circleci envvar set MY_SECRET s3cr3t --project gh/myorg/myrepo`\n- Delete an environment variable: \n  `circleci envvar delete MY_SECRET`\n\n#### `circleci envvar delete <name> [flags]`\n\nDelete a project environment variable\n\nDelete an environment variable from a CircleCI project.\n\nThis action is irreversible. The variable will be removed and any\njobs that reference it will fail until a new value is set.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `-f, --force`      | skip confirmation prompt                                |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Arguments:**\n\n`<name>` is the name of the environment variable to delete from\nthe project. This action is irreversible.\n\n**Aliases:**\n\n\n`circleci envvar rm`\n\n**Examples:**\n\n- Delete an env var from the current project (with confirmation): \n  `circleci envvar delete MY_SECRET`\n- Delete without confirmation: \n  `circleci envvar delete MY_SECRET --force`\n- Delete an env var from a specific project: \n  `circleci envvar delete MY_SECRET --project gh/myorg/myrepo --force`\n\n#### `circleci envvar list [flags]`\n\nList project environment variables\n\nList the environment variables defined for a CircleCI project.\n\nValues are always masked in the response (shown as \"xxxx\") — CircleCI\ndoes not expose secret values after they are set.\n\nJSON fields: name, value\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Aliases:**\n\n\n`circleci envvar ls`\n\n**Examples:**\n\n- List env vars for the current project: \n  `circleci envvar list`\n- List env vars for a specific project: \n  `circleci envvar list --project gh/myorg/myrepo`\n- Output as JSON: \n  `circleci envvar list --json`\n\n#### `circleci envvar set <name> <value> [flags]`\n\nSet a project environment variable\n\nCreate or update an environment variable for a CircleCI project.\n\nIf the variable already exists it will be overwritten. The value\nis never retrievable after being set — CircleCI masks it in all\nsubsequent list responses.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Arguments:**\n\n`<name>` is the name of the environment variable to create or\nupdate. `<value>` is the value to store; it is never retrievable\nafter being set and is masked in all subsequent list output.\n\n**Examples:**\n\n- Set an env var for the current project: \n  `circleci envvar set MY_SECRET s3cr3t`\n- Set an env var for a specific project: \n  `circleci envvar set MY_SECRET s3cr3t --project gh/myorg/myrepo`\n- Read a value from a file: \n  `circleci envvar set MY_SECRET \"$(cat secret.txt)\"`\n\n### `circleci namespace <command>`\n\nManage the org namespace orbs publish under\n\nWork with CircleCI orb namespaces.\n\nNamespaces are unique identifiers used to publish orbs.\nEach organization may claim one namespace. Orbs are published\nand referenced as `<namespace>/<orb>`. All published orbs are world-readable.\n\n#### `circleci namespace create <name> --org <org> [flags]`\n\nCreate a namespace\n\nCreate a CircleCI orb namespace for an organization.\n\nEach organization may claim one namespace. Namespace names must\nbe globally unique across CircleCI. All orbs published in a\nnamespace are world-readable.\n\nJSON fields: id, name\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID to claim the namespace for (required)   |\n\n\n**Arguments:**\n\n`<name>` is the namespace name to create. It must be globally unique\nacross CircleCI, for example, `myorg`.\n\n**Examples:**\n\n- Create a namespace for an organization: \n  `circleci namespace create myorg --org gh/acme`\n- Create a namespace and output JSON: \n  `circleci namespace create myorg --org gh/acme --json`\n- Capture just the namespace ID: \n  `circleci namespace create myorg --org gh/acme --json --jq '.id'`\n\n#### `circleci namespace delete <name> [flags]`\n\nDelete a namespace and all its orbs\n\nDelete a CircleCI orb namespace and all orbs published under it.\n\nThis operation is irreversible. Any pipelines referencing orbs in\nthis namespace will fail after deletion.\n\n| Flag            | Description                                  |\n| --------------- | -------------------------------------------- |\n| `-n, --dry-run` | print what would be deleted without deleting |\n| `-f, --force`   | skip confirmation prompt                     |\n\n\n**Arguments:**\n\n`<name>` is the name of the namespace to delete, for example, \"myorg\".\n\n**Aliases:**\n\n\n`circleci namespace rm`\n\n**Examples:**\n\n- Delete a namespace (with confirmation prompt): \n  `circleci namespace delete myorg`\n- Preview what would be deleted without deleting: \n  `circleci namespace delete myorg --dry-run`\n- Delete without a confirmation prompt: \n  `circleci namespace delete myorg --force`\n- Delete in a CI environment (non-interactive; --force required): \n  `circleci namespace delete myorg -f`\n\n#### `circleci namespace get <name> [flags]`\n\nGet details of a namespace\n\nDisplay details of a CircleCI orb namespace.\n\nJSON fields: id, name\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\n`<name>` is the name of the namespace to look up, for example, `myorg`.\n\n**Examples:**\n\n- Get a namespace by name: \n  `circleci namespace get myorg`\n- Output as JSON: \n  `circleci namespace get myorg --json`\n- Extract just the namespace ID: \n  `circleci namespace get myorg --json --jq '.id'`\n\n#### `circleci namespace rename <name> <new-name> [flags]`\n\nRename a namespace\n\nRename a CircleCI orb namespace.\n\nAny orbs already published under the old name will continue to be\naccessible — renaming creates an alias. Ensure that any configs\nand orbs still referencing the old name are updated.\n\nJSON fields: id, name\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\n- `<name>` is the current name of the namespace, for example, `oldname`.\n- `<new-name>` is the new name to assign, for example, `newname`.\n\n**Examples:**\n\n- Rename a namespace: \n  `circleci namespace rename oldname newname`\n- Rename and output the result as JSON: \n  `circleci namespace rename oldname newname --json`\n- Confirm the new ID after rename: \n  `circleci namespace rename oldname newname --json --jq '.id'`\n\n### `circleci orb <command>`\n\nCreate, publish and inspect orbs (reusable config)\n\nManage orbs in the orb registry.\n\nOrbs are reusable packages of CircleCI configuration, published to a\nnamespace and either shared publicly or kept private. Manage the namespace\nitself with 'circleci namespace'.\n\n#### `circleci orb add-to-category <namespace>/<orb> <category>`\n\nAdd an orb to a registry category\n\nAdd an orb to an orb registry category.\n\nCategories help users discover orbs. Use 'circleci orb list-categories'\nto see available categories.\n\n**Arguments:**\n\n- `<namespace>/<orb>` is the orb to add, for example, `namespace/orb-name`.\n- `<category>` is the registry category name, for example, `Testing`.\n\n**Examples:**\n\n- Add an orb to the Testing category: \n  `circleci orb add-to-category myorg/my-orb \"Testing\"`\n- Add an orb to the Deployment category: \n  `circleci orb add-to-category myorg/my-orb \"Deployment\"`\n- List available categories first: \n  `circleci orb list-categories`\n\n#### `circleci orb create <namespace>/<orb> [flags]`\n\nReserve an orb name in a namespace\n\nReserve an orb name in the given namespace.\n\nThis registers the name without publishing any versions; publish them with\n'circleci orb publish'. The namespace must already exist.\n\nJSON fields: id, name, namespace, is_private\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n| `--private`   | create as a private orb                                                           |\n\n\n**Arguments:**\n\n- `<namespace>/<orb>` is the orb name to reserve, for example, `namespace/orb-name`.\n  The namespace must already exist.\n\n**Examples:**\n\n- Create a public orb: \n  `circleci orb create myorg/my-orb`\n- Create a private orb: \n  `circleci orb create myorg/my-orb --private`\n- Create and output as JSON: \n  `circleci orb create myorg/my-orb --json`\n\n#### `circleci orb diff <namespace>/<orb> --from <v1> --to <v2> [flags]`\n\nShow a unified diff between two orb versions\n\nShow a unified diff between two versions of an orb.\n\nThe --from and --to versions can be semver (e.g. 1.0.0) or dev labels\n(e.g. dev:my-branch).\n\nExit code is 0 regardless of whether the versions differ.\n\n| Flag            | Description                                                              |\n| --------------- | ------------------------------------------------------------------------ |\n| `--from string` | the first version (semver e.g. 1.0.0, or a dev label e.g. dev:my-branch) |\n| `--to string`   | the second version, in the same form as --from                           |\n\n\n**Arguments:**\n\n- `<namespace>/<orb>` is the orb to diff, for example, `namespace/orb-name`.\n\n**Examples:**\n\n- Diff two semver versions: \n  `circleci orb diff myorg/my-orb --from 1.0.0 --to 1.1.0`\n- Diff a semver and a dev version: \n  `circleci orb diff myorg/my-orb --from 1.0.0 --to dev:my-branch`\n- Diff two dev versions: \n  `circleci orb diff myorg/my-orb --from dev:branch-a --to dev:branch-b`\n\n#### `circleci orb get <namespace>/<orb>[@<version>]/<orb-id> [flags]`\n\nGet orb metadata and statistics\n\nGet metadata and statistics for an orb.\n\nDisplays the orb name, namespace, privacy status, latest version,\nusage statistics for the past 30 days, associated categories, and\nall published versions.\n\nJSON fields: id, name, namespace, is_private, is_listed, created_at, latest_version, categories, versions, stats\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\nAn orb can be specified by name or ID:\n- By name, for example, `namespace/orb-name`, optionally with a version, for example, `namespace/orb-name@1.2.3`\n- By ID, the orb ID (UUID), for example, `849e7902-802f-4082-8a70-da77dcd084e3`\n\n**Examples:**\n\n- Get info for an orb: \n  `circleci orb get myorg/my-orb`\n- Get info for a specific version: \n  `circleci orb get myorg/my-orb@1.2.3`\n- Output as JSON: \n  `circleci orb get myorg/my-orb --json`\n\n#### `circleci orb init <path> [flags]`\n\nInitialize a new orb project\n\nScaffold a new orb project from CircleCI-Public/Orb-Template into <path>.\n\nIt then walks you through setup: reserving the namespace and orb, assigning\ncategories, creating an 'orb-publishing' context, initializing git, enabling\ndynamic config, and publishing a dev:alpha version.\n\nNote: once published, orbs cannot be deleted.\n\n| Flag              | Description                                                                               |\n| ----------------- | ----------------------------------------------------------------------------------------- |\n| `--branch string` | primary git branch to track (default \"main\")                                              |\n| `--org string`    | Organization slug (e.g. gh/myorg) or UUID to own the orb namespace and publishing context |\n| `--private`       | initialize a private orb                                                                  |\n| `--remote string` | remote git repository URL (required for git setup when non-interactive)                   |\n| `--skip-git`      | skip local git repository setup                                                           |\n| `--template-only` | download the template only; skip all setup                                                |\n\n\n**Arguments:**\n\n- `<path>` is the directory to scaffold the orb project into. It is\n  created if it does not exist.\n\n**Examples:**\n\n- Interactive setup: \n  `circleci orb init ./my-orb`\n- Just download the template, no setup: \n  `circleci orb init ./my-orb --template-only`\n- Non-interactive: create a private orb under an org, skip git: \n  `circleci orb init ./my-orb --private --org gh/acme --skip-git`\n\n#### `circleci orb list [<namespace>] [flags]`\n\nList orbs in the registry\n\nList orbs in the CircleCI orb registry.\n\nWithout a namespace argument, lists certified orbs globally.\nPass a namespace to list all orbs in that namespace.\n\nUse --uncertified to include orbs that are not certified by CircleCI.\nUse --private to list only private orbs (requires namespace).\n\nJSON fields: id, name, is_private, is_listed, latest_version\n\n| Flag            | Description                                                                       |\n| --------------- | --------------------------------------------------------------------------------- |\n| `--jq string`   | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`        | Output as JSON                                                                    |\n| `--private`     | only list private orbs (requires namespace)                                       |\n| `--uncertified` | include uncertified orbs                                                          |\n\n\n**Arguments:**\n\n- `<namespace>` is optional. When given, lists all orbs in that namespace.\n  When omitted, lists certified orbs globally.\n\n**Aliases:**\n\n\n`circleci orb ls`\n\n**Examples:**\n\n- List certified orbs globally: \n  `circleci orb list`\n- List all orbs in a namespace: \n  `circleci orb list myorg`\n- Include uncertified orbs: \n  `circleci orb list --uncertified`\n- List orbs as JSON: \n  `circleci orb list --json`\n- List private orbs in a namespace: \n  `circleci orb list myorg --private`\n\n#### `circleci orb list-categories [flags]`\n\nList orb registry categories\n\nList all categories available in the CircleCI orb registry.\n\nCategories are used to organize and discover orbs. Use\n'circleci orb add-to-category' to categorize your orbs.\n\nJSON fields: id, name\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Examples:**\n\n- List all orb categories: \n  `circleci orb list-categories`\n- Output as JSON: \n  `circleci orb list-categories --json`\n- Capture category names only: \n  `circleci orb list-categories --json --jq '.[].name'`\n\n#### `circleci orb pack <path>`\n\nPack a multi-file orb directory into a single YAML\n\nPack an orb source directory into a single YAML file.\n\nIf the path is a directory, the '@orb.yml' (or 'orb.yml') file at the\nroot is merged with any 'commands/', 'jobs/', 'executors/', and 'examples/'\nsubdirectories. Each .yml file in those directories is added as a named\nentry under the corresponding top-level key.\n\nIf the path is a single file it is parsed and written to stdout.\n\nAny '<< include(path) >>' directive, alone or embedded in a larger\nvalue, is replaced with that file's contents, relative to the orb root.\n\nThe merged YAML is written to stdout.\n\n**Arguments:**\n\n- `<path>` is the path to an orb source directory or a single orb YAML file.\n\n**Examples:**\n\n- Pack a single orb file: \n  `circleci orb pack orb.yml`\n- Pack a multi-file orb directory: \n  `circleci orb pack ./src`\n- Pack and save to a file: \n  `circleci orb pack ./src > orb.yml`\n- Pack and immediately validate: \n  `circleci orb pack ./src | circleci orb validate -`\n\n#### `circleci orb process <path> [flags]`\n\nValidate and print expanded orb YAML\n\nValidate an orb YAML file and print the expanded (processed) YAML.\n\nThe processed output resolves all orb references and expands inline\nconfigurations. Useful to verify what CircleCI will see when the orb\nis published.\n\nPass '-' as the path to read from stdin.\n\n| Flag           | Description                                                            |\n| -------------- | ---------------------------------------------------------------------- |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID for private orb dependencies |\n\n\n**Arguments:**\n\n- `<path>` is the path to an orb YAML file. Pass `-` to read from stdin.\n\n**Examples:**\n\n- Process an orb file and print expanded YAML: \n  `circleci orb process orb.yml`\n- Process from stdin: \n  `cat orb.yml | circleci orb process -`\n- Process with a specific org for private deps: \n  `circleci orb process orb.yml --org gh/acme`\n\n#### `circleci orb publish <command>`\n\nPublish orb versions\n\nPublish orb versions to the CircleCI orb registry.\n\nTo publish a specific version:\n  circleci orb publish `<path> <namespace>/<orb>@<version>`\n\nTo promote a dev version to a stable semver:\n  circleci orb publish promote `<namespace>/<orb>@dev:<label>` --bump major|minor|patch\n\nTo increment the latest stable version and publish:\n  circleci orb publish increment `<path> <namespace>/<orb>` --bump major|minor|patch\n\n**Examples:**\n\n- Publish a specific version: \n  `circleci orb publish orb.yml myorg/my-orb@1.0.0`\n- Publish a dev version: \n  `circleci orb publish orb.yml myorg/my-orb@dev:my-branch`\n- Promote a dev version to a patch release: \n  `circleci orb publish promote myorg/my-orb@dev:my-branch --bump patch`\n- Increment major version and publish: \n  `circleci orb publish increment orb.yml myorg/my-orb --bump major`\n\n##### `circleci orb publish increment <path> <namespace>/<orb> --bump major|minor|patch [flags]`\n\nIncrement and publish a new orb version\n\nRead orb YAML from path, compute the next version by incrementing\nthe current latest stable version, and publish it.\n\nThe --bump flag selects which segment to increment. If no stable\nversion exists yet, publishes as 0.0.1 (patch), 0.1.0 (minor),\nor 1.0.0 (major) depending on --bump.\n\nPass '-' as the path to read from stdin.\n\n| Flag            | Description                                                |\n| --------------- | ---------------------------------------------------------- |\n| `--bump string` | which version segment to increment: major, minor, or patch |\n\n\n**Arguments:**\n\n- `<path>` is the path to the orb YAML to publish. Pass `-` to read from stdin.\n- `<namespace>/<orb>` is the orb to publish, for example, `namespace/orb-name`.\n\n**Examples:**\n\n- Increment patch version and publish: \n  `circleci orb publish increment orb.yml myorg/my-orb --bump patch`\n- Increment minor version: \n  `circleci orb publish increment orb.yml myorg/my-orb --bump minor`\n- Read orb from stdin, increment major: \n  `cat orb.yml | circleci orb publish increment - myorg/my-orb --bump major`\n\n##### `circleci orb publish promote <namespace>/<orb>@dev:<label> --bump major|minor|patch [flags]`\n\nPromote a dev orb version to a stable semver\n\nPromote a dev orb version to a stable semver version.\n\nThe dev version ref must be in the form `<namespace>/<orb>@dev:<label>`.\nThe --bump flag determines how the version is incremented\nfrom the latest stable release.\n\n| Flag            | Description                                                |\n| --------------- | ---------------------------------------------------------- |\n| `--bump string` | which version segment to increment: major, minor, or patch |\n\n\n**Arguments:**\n\n- `<namespace>/<orb>@dev:<label>` is the dev version to promote, for example, `namespace/orb-name@dev:my-branch`\n\n**Examples:**\n\n- Promote dev:my-branch to a patch release: \n  `circleci orb publish promote myorg/my-orb@dev:my-branch --bump patch`\n- Promote to a minor release: \n  `circleci orb publish promote myorg/my-orb@dev:my-branch --bump minor`\n- Promote to a major release: \n  `circleci orb publish promote myorg/my-orb@dev:my-branch --bump major`\n\n#### `circleci orb remove-from-category <namespace>/<orb> <category>`\n\nRemove an orb from a registry category\n\nRemove an orb from an orb registry category.\n\nUse 'circleci orb get `<namespace>/<orb>`' to see the current categories\nfor an orb, and 'circleci orb list-categories' for all available\ncategories.\n\n**Arguments:**\n\n- `<namespace>/<orb>` is the orb to remove, for example, `namespace/orb-name`\n- `<category>` is the registry category name, for example, `Testing`\n\n**Examples:**\n\n- Remove an orb from the Testing category: \n  `circleci orb remove-from-category myorg/my-orb \"Testing\"`\n- Remove an orb from the Deployment category: \n  `circleci orb remove-from-category myorg/my-orb \"Deployment\"`\n- See current categories: \n  `circleci orb get myorg/my-orb`\n\n#### `circleci orb source <namespace>/<orb>[@<version>]`\n\nPrint the YAML source of an orb version\n\nPrint the raw YAML source of an orb version.\n\nIf no version is specified, the latest published version is shown.\nSpecify a version with `@<version>` (e.g. @1.2.3 or @volatile for latest).\n\n**Arguments:**\n\n- `<namespace>/<orb>[@<version>]` is the orb to print, for example, `namespace/orb-name`.\n  Optionally append `@<version>` (for example, `@1.2.3`, `@volatile`, or `@dev:my-branch`).\n  When omitted, the latest published version is shown.\n\n**Examples:**\n\n- Print source of the latest version: \n  `circleci orb source myorg/my-orb`\n- Print source of a specific version: \n  `circleci orb source myorg/my-orb@1.2.3`\n- Print source of a dev version: \n  `circleci orb source myorg/my-orb@dev:my-branch`\n- Save the source to a file: \n  `circleci orb source myorg/my-orb@1.0.0 > orb.yml`\n\n#### `circleci orb unlist <namespace>/<orb> [flags]`\n\nHide or restore an orb in the registry\n\nControl whether an orb is visible in the CircleCI orb registry.\n\nBy default, hides the orb (unlists it from search results).\nPass --restore to make the orb visible again.\n\nUnlisted orbs can still be used if you know the exact orb reference.\n\n| Flag        | Description                                       |\n| ----------- | ------------------------------------------------- |\n| `--restore` | restore the orb's visibility instead of hiding it |\n\n\n**Arguments:**\n\n- `<namespace>/<orb>` is the orb to update, for example, `namespace/orb-name`\n\n**Examples:**\n\n- Hide an orb from the registry: \n  `circleci orb unlist myorg/my-orb`\n- Restore an orb's visibility: \n  `circleci orb unlist myorg/my-orb --restore`\n\n#### `circleci orb validate <path> [flags]`\n\nValidate an orb YAML file\n\nValidate an orb YAML file against the CircleCI API.\n\nPass `-` as the path to read from stdin.\n\nUse --org (a slug or UUID) to validate against a specific\norganization's private orb dependencies.\n\nExit code 7 if the orb is invalid.\n\n| Flag           | Description                                                            |\n| -------------- | ---------------------------------------------------------------------- |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID for private orb dependencies |\n\n\n**Arguments:**\n\n- `<path>` is the path to an orb YAML file. Pass `-` to read from stdin.\n\n**Examples:**\n\n- Validate an orb file: \n  `circleci orb validate orb.yml`\n- Validate from stdin: \n  `cat orb.yml | circleci orb validate -`\n- Validate with a specific org for private deps: \n  `circleci orb validate orb.yml --org gh/acme`\n\n### `circleci org <command>`\n\nManage CircleCI organizations\n\nList and manage CircleCI organizations.\n\nUse 'circleci org list' to see all organizations you belong to.\nUse 'circleci org setting list' to view advanced settings for an org,\nor a specific settings subcommand to view or change an individual setting.\n\n#### `circleci org list [flags]`\n\nList organizations you belong to\n\nList all CircleCI organizations the authenticated user is a member of.\n\nJSON fields: id, slug, name, vcs_type\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Aliases:**\n\n\n`circleci org ls`\n\n**Examples:**\n\n- List all your organizations: \n  `circleci org list`\n- Output as JSON for scripting: \n  `circleci org list --json`\n- Extract just the slugs: \n  `circleci org list --json --jq '.[].slug'`\n\n#### `circleci org setting <command>`\n\nView and update org advanced settings\n\nView and update advanced settings for a CircleCI organization.\n\nUse 'get' to read a setting's current value and 'set' to change it.\nUse 'list' to see all settings at once.\n\n##### `circleci org setting get <setting> [flags]`\n\nGet the current value of an org setting\n\nGet the current value of an advanced org setting.\n\nJSON fields: name, value\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n\n\n**Arguments:**\n\n`<setting>` is one of: ai-error-summarization, ai-agents, unversioned-config, certified-public-orbs, chunk-ip-ranges, minor-ai-features, private-orbs, uncertified-public-orbs, bitbucket-workspace-member-is-org-member, disable-user-checkout-keys, disable-running, image-brownouts, context-group-restriction, resource-class-brownouts, runner-tos-accepted.\n\nRun `circleci org setting list` for each setting's description and current value.\n\n**Examples:**\n\n- Get a setting for the current org: \n  `circleci org setting get private-orbs`\n- Get a setting for a specific org: \n  `circleci org setting get private-orbs --org gh/myorg`\n- Output as JSON: \n  `circleci org setting get private-orbs --json`\n\n##### `circleci org setting list [flags]`\n\nList all advanced settings for an org\n\nList all advanced settings for a CircleCI organization.\n\nJSON fields: enable_ai_error_summarization, enable_ai_agents, enable_unversioned_config, enable_certified_public_orbs, enable_chunk_ip_ranges, enable_minor_ai_features, enable_private_orbs, enable_uncertified_public_orbs, is_bitbucket_workspace_member_org_member, is_user_checkout_keys_disabled, is_running_disabled, enable_image_brownouts, is_context_group_restriction_required, enable_resource_class_brownouts, is_runner_terms_of_service_accepted\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n\n\n**Aliases:**\n\n\n`circleci org setting ls`\n\n**Examples:**\n\n- List settings for the current org: \n  `circleci org setting list`\n- List settings for a specific org: \n  `circleci org setting list --org gh/myorg`\n- Output as JSON: \n  `circleci org setting list --json`\n\n##### `circleci org setting set <setting> <true|false> [flags]`\n\nSet an org setting\n\nSet an advanced org setting to true or false.\n\nJSON fields: name, value\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n\n\n**Arguments:**\n\n`<setting>` is one of: ai-error-summarization, ai-agents, unversioned-config, certified-public-orbs, chunk-ip-ranges, minor-ai-features, private-orbs, uncertified-public-orbs, bitbucket-workspace-member-is-org-member, disable-user-checkout-keys, disable-running, image-brownouts, context-group-restriction, resource-class-brownouts, runner-tos-accepted.\n\n`<true|false>` is the new value. Run `circleci org setting list` for each\nsetting's description and current value.\n\n**Examples:**\n\n- Enable a setting for the current org: \n  `circleci org setting set private-orbs true`\n- Disable a setting for a specific org: \n  `circleci org setting set private-orbs false --org gh/myorg`\n- Output the updated value as JSON: \n  `circleci org setting set ai-error-summarization true --json`\n\n### `circleci policy <command>`\n\nGovern config with Rego security policies\n\nManage security policies.\n\nPolicies are written in Rego and evaluated against pipeline configs to\nenforce organizational security rules.\n\nMost commands require --org, your organization's slug (e.g. gh/acme) or UUID,\nfound at <https://app.circleci.com/settings/organization>.\n\n#### `circleci policy decide [flags]`\n\nEvaluate a config against remote policies\n\nEvaluate a CircleCI pipeline config against the remote policy bundle\nand return a policy decision.\n\nThe decision status is one of PASS, SOFT_FAIL, HARD_FAIL or ERROR.\n\nJSON fields: status, enabled_rules, hard_failures, soft_failures, violations, metadata\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--input string`          | Path to input file (e.g. .circleci/config.yml) (required)                         |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--meta string`           | Decision metadata as a JSON string                                                |\n| `--metafile string`       | Path to decision metadata file (YAML or JSON)                                     |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n| `--strict`                | Exit non-zero for HARD_FAIL or ERROR decisions                                    |\n\n\n**Examples:**\n\n- Evaluate a config against remote policies: \n  `circleci policy decide --org gh/acme --input .circleci/config.yml`\n- Exit non-zero on hard failures: \n  `circleci policy decide --org gh/acme --input .circleci/config.yml --strict`\n- Pass metadata alongside the decision: \n  `circleci policy decide --org gh/acme --input .circleci/config.yml --meta '{\"project_id\":\"abc\"}'`\n- Output decision as JSON: \n  `circleci policy decide --org gh/acme --input .circleci/config.yml --json`\n\n#### `circleci policy diff <path> [flags]`\n\nShow diff between local and remote policy bundles\n\nCompare a local directory of .rego files against the remote policy\nbundle without making any changes.\n\nJSON fields: created, deleted, updated (policy names)\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n\n\n**Arguments:**\n\n`<path>` is the path to a local directory of .rego policy files,\nfor example, \"./policies\". Its contents are compared against the remote\npolicy bundle.\n\n**Examples:**\n\n- Diff policies in ./policies against the remote bundle: \n  `circleci policy diff ./policies --org gh/acme`\n- Diff against a custom policy context: \n  `circleci policy diff ./policies --org gh/acme --policy-context config`\n- Output diff as JSON for scripting: \n  `circleci policy diff ./policies --org gh/acme --json`\n\n#### `circleci policy eval <policy-path> [flags]`\n\nEvaluate a raw OPA query against policies locally\n\nRun a raw OPA query against a policy bundle entirely locally and print the\nresult as JSON. Unlike 'policy decide', which returns a CircleCI policy\ndecision from the remote service, this evaluates on your machine — the\nescape hatch for inspecting arbitrary Rego values while authoring policies.\n\nThe config is compiled before evaluation, with the source config exposed to\npolicies and its compiled form nested under \"_compiled_\".\n\nOutput is whatever the query evaluates to, so it has no fixed schema.\n\n| Flag                           | Description                                                                                  |\n| ------------------------------ | -------------------------------------------------------------------------------------------- |\n| `--context string`             | Policy context (config compilation only runs when this is \"config\") (default \"config\")       |\n| `--input string`               | Path to input file (e.g. .circleci/config.yml) (required)                                    |\n| `--jq string`                  | Process values from the response using jq syntax (see `circleci help formatting`)            |\n| `--json`                       | Output as JSON                                                                               |\n| `--meta string`                | Decision metadata as a JSON string                                                           |\n| `--metafile string`            | Path to decision metadata file (YAML or JSON)                                                |\n| `--no-compile`                 | Evaluate the raw config without compiling it first                                           |\n| `--org string`                 | Organization slug (e.g. gh/myorg) or UUID for private orb resolution; defaults to git remote |\n| `--pipeline-parameters string` | Pipeline parameters as a YAML map or path to a YAML file                                     |\n| `--query string`               | The OPA query to evaluate (default \"data\")                                                   |\n\n\n**Arguments:**\n\n`<policy-path>` is the path to a .rego policy file or a directory\nof policy files to evaluate.\n\n**Examples:**\n\n- Evaluate a policy directory against a compiled config: \n  `circleci policy eval ./policies --input .circleci/config.yml`\n- Evaluate a specific query: \n  `circleci policy eval ./policies --input .circleci/config.yml --query 'data.org.enable_rule'`\n- Evaluate the raw (uncompiled) config: \n  `circleci policy eval ./policies --input .circleci/config.yml --no-compile`\n- Pass decision metadata: \n  `circleci policy eval ./policies --input .circleci/config.yml --meta '{\"project_id\":\"abc\"}'`\n\n#### `circleci policy fetch [policy-name] [flags]`\n\nDownload the remote policy bundle\n\nDownload the remote policy bundle for the given owner and context.\nPass a policy name to fetch a single policy.\n\nOutput is always JSON (the bundle is structured data).\n\nJSON fields: policies (map of name → Rego source)\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n\n\n**Arguments:**\n\n`<policy-name>` is optional and fetches a single policy.\nWhen omitted, the full policy bundle is fetched.\n\n**Examples:**\n\n- Fetch the full policy bundle: \n  `circleci policy fetch --org gh/acme`\n- Fetch a single policy by name: \n  `circleci policy fetch my-policy --org gh/acme`\n- Output as JSON with jq filtering: \n  `circleci policy fetch --org gh/acme --json --jq 'keys'`\n\n#### `circleci policy logs [decision-id] [flags]`\n\nGet policy decision logs\n\nRetrieve policy decision logs for an owner.\n\nWithout a decision ID, returns all logs (paginated automatically).\nPass a decision ID to retrieve a single log entry. Use --policy-bundle\nto retrieve only the policy bundle snapshot for a given decision.\n\nLogs can be filtered by status, branch, project, and time range.\nUse --out to write results to a file.\n\nJSON fields: id, status, created_at, org_id, project_id, branch, build_number, policies, decision, metadata\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--after string`          | Return logs created after this time (RFC3339 or YYYY-MM-DD)                       |\n| `--before string`         | Return logs created before this time (RFC3339 or YYYY-MM-DD)                      |\n| `--branch string`         | Filter by branch name                                                             |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--out string`            | Write output to this file instead of stdout                                       |\n| `--policy-bundle`         | Retrieve the policy bundle snapshot for the given decision ID                     |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n| `--project-id string`     | Filter by project ID                                                              |\n| `--status string`         | Filter by decision status (PASS, SOFT_FAIL, HARD_FAIL, ERROR)                     |\n\n\n**Arguments:**\n\n`<decision-id>` is optional and retrieves a single log entry.\nWhen omitted, all logs are returned (paginated automatically).\n\n**Examples:**\n\n- Get all decision logs: \n  `circleci policy logs --org gh/acme`\n- Get a specific decision log: \n  `circleci policy logs abc123 --org gh/acme`\n- Filter by status and branch: \n  `circleci policy logs --org gh/acme --status HARD_FAIL --branch main`\n- Write output to a file: \n  `circleci policy logs --org gh/acme --out logs.json`\n\n#### `circleci policy push <path> [flags]`\n\nPush a policy bundle to CircleCI\n\nUpload a directory of .rego files as a policy bundle, replacing the existing\nbundle for the given owner and policy context.\n\nA diff is shown and confirmed before anything is applied.\n\nJSON fields: created, deleted, updated (policy names)\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--no-prompt`             | Skip confirmation prompt                                                          |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n\n\n**Arguments:**\n\n`<path>` is the path to a local directory of .rego policy files,\nfor example, \"./policies\". Its contents are uploaded as the policy\nbundle, replacing the existing bundle.\n\n**Examples:**\n\n- Push policies in the ./policies directory: \n  `circleci policy push ./policies --org gh/acme`\n- Push without confirmation prompt: \n  `circleci policy push ./policies --org gh/acme --no-prompt`\n- Push to a custom policy context: \n  `circleci policy push ./policies --org gh/acme --policy-context config`\n- Output the diff as JSON: \n  `circleci policy push ./policies --org gh/acme --no-prompt --json`\n\n#### `circleci policy settings <command>`\n\nManage policy enforcement settings\n\nGet or update policy enforcement settings for an organization.\n\nPolicy enforcement controls whether pipeline configs are evaluated\nagainst the policy bundle before running.\n\n##### `circleci policy settings get [flags]`\n\nGet policy enforcement settings\n\nRetrieve the current policy enforcement settings for an organization.\n\nJSON fields: enabled\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n\n\n**Examples:**\n\n- Get policy enforcement settings: \n  `circleci policy settings get --org gh/acme`\n- Output as JSON: \n  `circleci policy settings get --org gh/acme --json`\n- Use with jq to extract the enabled field: \n  `circleci policy settings get --org gh/acme --json --jq '.enabled'`\n\n##### `circleci policy settings set [flags]`\n\nUpdate policy enforcement settings\n\nEnable or disable policy enforcement for an organization.\n\nWhen enabled, pipeline configs are evaluated against the policy bundle\nbefore each run. Configs that produce a HARD_FAIL decision are blocked.\n\nJSON fields: enabled\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--enabled`               | Enable policy enforcement                                                         |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID (required)                              |\n| `--policy-context string` | Policy context (default \"config\")                                                 |\n\n\n**Examples:**\n\n- Enable policy enforcement: \n  `circleci policy settings set --org gh/acme --enabled`\n- Disable policy enforcement: \n  `circleci policy settings set --org gh/acme --enabled=false`\n- Output result as JSON: \n  `circleci policy settings set --org gh/acme --enabled --json`\n\n#### `circleci policy test <path> [flags]`\n\nRun policy tests\n\nDiscover and run policy tests locally, exiting non-zero if any fails.\n\nTests live in *_test.yaml files alongside your .rego policies; each test key\nmust start with \"test_\" and compares its expected \"decision\" against the\nengine's decision for its \"input\". Native OPA unit tests run too.\n\nAn input is compiled first only when it sets \"compile: true\" or provides\n\"pipeline_parameters\", so --org and a token are needed only in that case.\n\nJSON fields: Passed, Group, Name, Elapsed, ElapsedMS, Err, Ctx\n\n| Flag           | Description                                                                                                       |\n| -------------- | ----------------------------------------------------------------------------------------------------------------- |\n| `--all`        | Show all tests, not just failures                                                                                 |\n| `--explain`    | Print each test's full evaluation context (implies --all)                                                         |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`)                                 |\n| `--json`       | Output as JSON                                                                                                    |\n| `--junit`      | Output results as JUnit XML                                                                                       |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID for private orb resolution when a test compiles; defaults to git remote |\n| `--run string` | Only run tests whose name matches this regexp                                                                     |\n\n\n**Arguments:**\n\n`<path>` is a directory of policies and tests. Append `/...`\nto discover tests recursively in every subdirectory.\n\n**Examples:**\n\n- Run every test under ./policies and its subdirectories: \n  `circleci policy test ./policies/...`\n- Run tests in a single directory, showing passing tests too: \n  `circleci policy test ./policies --all`\n- Run only tests whose name matches a regexp: \n  `circleci policy test ./policies/... --run 'test_enforce_.*'`\n- Emit JUnit XML for CI: \n  `circleci policy test ./policies/... --junit`\n\n### `circleci project <command>`\n\nList, follow and configure CircleCI projects\n\nList, follow, and manage settings for CircleCI projects.\n\nA project corresponds to a version-control repository connected to CircleCI.\nEnvironment variables are also reachable as the top-level alias\n'circleci envvar'.\n\n#### `circleci project create [project-name] --org <vcs/org-slug> [flags]`\n\nCreate a new project\n\nCreate a new CircleCI project in the given organization.\n\nThe name and --org are prompted for in a terminal; otherwise the name defaults\nto the current repository and --org is required.\n\nJSON fields: id, slug, name, organization_name, organization_slug, organization_id, vcs_provider, vcs_default_branch, vcs_url\n\n| Flag           | Description                       |\n| -------------- | --------------------------------- |\n| `--json`       | Output as JSON                    |\n| `--org string` | organization slug (e.g. gh/myorg) |\n\n\n**Arguments:**\n\n[project-name] is the name for the new project and is optional.\nWhen omitted, the current git repository's name is used: In a\nterminal you are prompted with the name of the current git repository as the default, and in\nnon-interactive mode it is used automatically.\n\n**Examples:**\n\n- Create a project (prompted for name if run interactively): \n  `circleci project create --org gh/myorg`\n- Create a GitHub-hosted project: \n  `circleci project create my-new-repo --org gh/myorg`\n- Create a CircleCI-native project (standalone pipelines): \n  `circleci project create new-service --org circleci/9YytKzouJxzu4TjCRFqAoD`\n- Create a project and output as JSON for scripting: \n  `circleci project create my-new-repo --org gh/myorg --json`\n\n#### `circleci project dlc <command>`\n\nPurge a project's Docker layer cache (DLC)\n\nManage docker layer caching (DLC) for projects.\n\nDocker layer caching allows CircleCI to cache individual Docker image\nlayers between pipeline runs. Use 'circleci dlc purge' to invalidate\nthe cache for a project and force a fresh image build on the next run.\n\nThese commands are also available under 'circleci project dlc'.\n\n**Examples:**\n\n- Purge DLC for the current git repository's project: \n  `circleci dlc purge`\n- Purge DLC for a specific project: \n  `circleci dlc purge --project gh/myorg/myrepo`\n- Purge DLC and output result as JSON: \n  `circleci dlc purge --project gh/myorg/myrepo --json`\n\n##### `circleci project dlc purge [flags]`\n\nPurge the Docker Layer Cache for a project\n\nPurge the docker layer cache (DLC) for a project.\n\nDocker layer caching stores individual Docker image layers between\npipeline runs to speed up builds. Purging the cache forces CircleCI\nto rebuild all layers from scratch on the next run, which is useful\nwhen a cached layer contains stale or corrupt data.\n\nJSON fields (--json): project_id, project_slug\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `-f, --force`      | Skip confirmation prompt                                |\n| `--json`           | Output as JSON                                          |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Examples:**\n\n- Purge DLC for the current git repository's project: \n  `circleci dlc purge`\n- Purge DLC for a specific project: \n  `circleci dlc purge --project gh/myorg/myrepo`\n- Skip the confirmation prompt (for scripting): \n  `circleci dlc purge --project gh/myorg/myrepo --force`\n- Purge DLC and output result as JSON: \n  `circleci dlc purge --project gh/myorg/myrepo --force --json`\n- Purge DLC for a Bitbucket project: \n  `circleci dlc purge --project bb/myorg/myrepo`\n\n#### `circleci project envvar <command>`\n\nList, set and delete a project's environment variables\n\nList, set, and delete environment variables for a CircleCI project.\n\nEnvironment variable values are masked in list output (shown as \"xxxx\").\nThe full value is never retrievable after it has been set.\n\nFor quick access, use the top-level alias:\n  circleci envvar list --project gh/org/repo\n\n##### `circleci project envvar delete <name> [flags]`\n\nDelete a project environment variable\n\nDelete an environment variable from a CircleCI project.\n\nThis action is irreversible. The variable will be removed and any\njobs that reference it will fail until a new value is set.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `-f, --force`      | skip confirmation prompt                                |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Arguments:**\n\n`<name>` is the name of the environment variable to delete from\nthe project. This action is irreversible.\n\n**Aliases:**\n\n\n`circleci project envvar rm`\n\n**Examples:**\n\n- Delete an env var from the current project (with confirmation): \n  `circleci envvar delete MY_SECRET`\n- Delete without confirmation: \n  `circleci envvar delete MY_SECRET --force`\n- Delete an env var from a specific project: \n  `circleci envvar delete MY_SECRET --project gh/myorg/myrepo --force`\n\n##### `circleci project envvar list [flags]`\n\nList project environment variables\n\nList the environment variables defined for a CircleCI project.\n\nValues are always masked in the response (shown as \"xxxx\") — CircleCI\ndoes not expose secret values after they are set.\n\nJSON fields: name, value\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Aliases:**\n\n\n`circleci project envvar ls`\n\n**Examples:**\n\n- List env vars for the current project: \n  `circleci envvar list`\n- List env vars for a specific project: \n  `circleci envvar list --project gh/myorg/myrepo`\n- Output as JSON: \n  `circleci envvar list --json`\n\n##### `circleci project envvar set <name> <value> [flags]`\n\nSet a project environment variable\n\nCreate or update an environment variable for a CircleCI project.\n\nIf the variable already exists it will be overwritten. The value\nis never retrievable after being set — CircleCI masks it in all\nsubsequent list responses.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Arguments:**\n\n`<name>` is the name of the environment variable to create or\nupdate. `<value>` is the value to store; it is never retrievable\nafter being set and is masked in all subsequent list output.\n\n**Examples:**\n\n- Set an env var for the current project: \n  `circleci envvar set MY_SECRET s3cr3t`\n- Set an env var for a specific project: \n  `circleci envvar set MY_SECRET s3cr3t --project gh/myorg/myrepo`\n- Read a value from a file: \n  `circleci envvar set MY_SECRET \"$(cat secret.txt)\"`\n\n#### `circleci project follow [flags]`\n\nFollow a project\n\nFollow a CircleCI project to enable builds and receive status updates.\n\nFollowing a project that is already followed is a no-op.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Examples:**\n\n- Follow the project for the current git repository: \n  `circleci project follow`\n- Follow a specific project: \n  `circleci project follow --project gh/myorg/myrepo`\n- Follow a Bitbucket project: \n  `circleci project follow --project bb/myorg/myrepo`\n\n#### `circleci project get [flags]`\n\nShow project details\n\nDisplay detailed information about a CircleCI project, including\nits UUID, organization ID, and VCS configuration.\n\nJSON fields: id, slug, name, organization_name, organization_slug, organization_id, vcs_provider, vcs_default_branch, vcs_url\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `--json`           | Output as JSON                                          |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Examples:**\n\n- Show details for the current git repository's project: \n  `circleci project get`\n- Show details for a specific project: \n  `circleci project get --project gh/myorg/myrepo`\n- Output as JSON for scripting: \n  `circleci project get --json`\n\n#### `circleci project link [flags]`\n\nBind this checkout to a CircleCI project\n\nRecord the CircleCI project for the current checkout in .circleci/info.yml, so\nother commands resolve it without re-detecting from the git remote each time.\n\nThe project comes from `--project`, else the git remote (origin), else an\ninteractive prompt. Because the slug is verified against the CircleCI API,\nthis exits with an authentication error when you are not logged in rather\nthan prompting blindly.\n\n| Flag                                     | Description                                                     |\n| ---------------------------------------- | --------------------------------------------------------------- |\n| `-f, --force`                            | Overwrite an existing .circleci/info.yml                        |\n| `--project circleci/<orgID>/<projectID>` | Project slug (e.g. gh/org/repo or circleci/<orgID>/<projectID>) |\n\n\n**Examples:**\n\n- Auto-detect from the current git repository: \n  `circleci project link`\n- Bind to a specific project (skips lookup if it exists): \n  `circleci project link --project gh/myorg/myrepo`\n- Bind to a standalone project by its CircleCI slug: \n  `circleci project link --project circleci/<orgID>/<projectID>`\n- Overwrite an existing .circleci/info.yml: \n  `circleci project link --force`\n\n#### `circleci project list [flags]`\n\nList followed projects\n\nList all CircleCI projects followed by the authenticated user.\n\nProjects are identified by a slug in the form vcs/org/repo\n(e.g. gh/myorg/myrepo). Use 'circleci project follow' to start\nfollowing a new project.\n\nJSON fields: slug, name, vcs_type, username, reponame\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Aliases:**\n\n\n`circleci project ls`\n\n**Examples:**\n\n- List all followed projects: \n  `circleci project list`\n- Output as JSON for scripting: \n  `circleci project list --json`\n- Filter by org: \n  `circleci project list --json --jq '.[] | select(.username == \"myorg\")'`\n\n#### `circleci project open [flags]`\n\nOpen the project page in the browser\n\nOpen the CircleCI project page for the current project in your\ndefault web browser.\n\nThe project is inferred from the current git repository's remote\nunless overridden with --project. Supports GitHub, Bitbucket, and\nGitLab remotes.\n\n| Flag               | Description                                             |\n| ------------------ | ------------------------------------------------------- |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote |\n\n\n**Examples:**\n\n- Open the project page for the current repo: \n  `circleci project open`\n- Open the project page for a specific project: \n  `circleci project open --project gh/myorg/myrepo`\n- Open when your remote is on CircleCI server: \n  `circleci project open --host https://circleci.example.com`\n\n#### `circleci project setting <command>`\n\nView and update project advanced settings\n\nView and update advanced settings for a CircleCI project.\n\nUse 'get' to read a setting's current value and 'set' to change it.\nUse 'list' to see all settings at once.\n\n##### `circleci project setting get <setting> [flags]`\n\nGet the current value of a project setting\n\nGet the current value of an advanced project setting.\n\nJSON fields: name, value\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Arguments:**\n\n`<setting>` is one of: build-forked-pull-requests, forks-receive-secret-env-vars, oss, auto-cancel-builds, set-github-status, build-prs-only, disable-ssh, write-settings-requires-admin, ai-error-summarization, dynamic-config, unversioned-config, disable-running.\n\nRun `circleci project setting list` for each setting's description and current value.\n\n**Examples:**\n\n- Get a setting for the current project: \n  `circleci project setting get build-forked-pull-requests`\n- Get a setting for a specific project: \n  `circleci project setting get build-forked-pull-requests --project gh/myorg/myrepo`\n- Output as JSON: \n  `circleci project setting get build-forked-pull-requests --json`\n\n##### `circleci project setting list [flags]`\n\nList all advanced settings for a project\n\nList all advanced settings for a CircleCI project.\n\nJSON fields: enable_ai_error_summarization, enable_auto_cancel_redundant_workflows, enable_building_fork_prs, is_build_prs_only, can_pass_secrets_to_fork_pr_jobs, can_set_github_status, is_running_disabled, is_ssh_disabled, enable_dynamic_config, is_admin_required_for_writing_settings, is_oss, pr_only_branch_overrides, enable_unversioned_config\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Aliases:**\n\n\n`circleci project setting ls`\n\n**Examples:**\n\n- List settings for the current project: \n  `circleci project setting list`\n- List settings for a specific project: \n  `circleci project setting list --project gh/myorg/myrepo`\n- Output as JSON: \n  `circleci project setting list --json`\n\n##### `circleci project setting set <setting> <true|false> [flags]`\n\nSet a project setting\n\nSet an advanced project setting to true or false.\n\nJSON fields: name, value\n\n| Flag               | Description                                                                       |\n| ------------------ | --------------------------------------------------------------------------------- |\n| `--jq string`      | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`           | Output as JSON                                                                    |\n| `--project string` | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n\n\n**Arguments:**\n\n`<setting>` is one of: build-forked-pull-requests, forks-receive-secret-env-vars, oss, auto-cancel-builds, set-github-status, build-prs-only, disable-ssh, write-settings-requires-admin, ai-error-summarization, dynamic-config, unversioned-config, disable-running.\n\n`<true|false>` is the new value. Run `circleci project setting list` for each\nsetting's description and current value.\n\n**Examples:**\n\n- Enable a setting for the current project: \n  `circleci project setting set build-forked-pull-requests true`\n- Disable a setting for a specific project: \n  `circleci project setting set build-forked-pull-requests false --project gh/myorg/myrepo`\n- Output the updated value as JSON: \n  `circleci project setting set auto-cancel-builds true --json`\n\n#### `circleci project trigger <command>`\n\nManage project triggers\n\nList and create triggers for a CircleCI project.\n\nTriggers watch a GitHub repository for events and automatically run\na pipeline definition when matching events occur. Only projects\nconnected via the CircleCI GitHub App are supported.\n\n##### `circleci project trigger create [flags]`\n\nCreate a new project trigger\n\nCreate a new trigger for a CircleCI project, connecting an event source to a\npipeline definition so that matching events start a pipeline run.\n\nRequired values are prompted for in a terminal, and must be flags otherwise.\nRun `circleci help triggers` for what each provider and event preset means.\n\nJSON fields: id, created_at, event_name, event_preset, config_ref, checkout_ref, disabled\n\n| Flag                              | Description                                                                                                                                                                                                                                                                                                                                             |\n| --------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| `--checkout-ref string`           | Git ref for checking out code (only needed when checkout repo differs from event source repo)                                                                                                                                                                                                                                                           |\n| `--config-ref string`             | Git ref for fetching config (only needed when config repo differs from event source repo)                                                                                                                                                                                                                                                               |\n| `--event-preset string`           | Event preset for filtering trigger events (one of: all-pushes, only-tags, default-branch-pushes, only-build-prs, only-open-prs, only-labeled-prs, only-merged-prs, only-ready-for-review-prs, only-branch-delete, only-build-pushes-to-non-draft-prs, only-merged-or-closed-prs, pr-comment-equals-run-ci, non-draft-pr-opened, pushes-to-merge-queues) |\n| `--jq string`                     | Process values from the response using jq syntax (see `circleci help formatting`)                                                                                                                                                                                                                                                                       |\n| `--json`                          | Output as JSON                                                                                                                                                                                                                                                                                                                                          |\n| `--pipeline-definition-id string` | Pipeline definition ID (required)                                                                                                                                                                                                                                                                                                                       |\n| `--project string`                | Project slug (e.g. gh/org/repo); defaults to git remote                                                                                                                                                                                                                                                                                                 |\n| `--project-id string`             | Project UUID (overrides --project)                                                                                                                                                                                                                                                                                                                      |\n| `--provider string`               | Event source provider (one of: github_app, github_server, github_oauth, webhook, schedule) (default \"github_app\")                                                                                                                                                                                                                                       |\n| `--repo-id string`                | Repository external ID (required for github_app, github_server, github_oauth)                                                                                                                                                                                                                                                                           |\n\n\n**Examples:**\n\n- Create a GitHub App trigger (provider defaults to github_app): \n  `circleci project trigger create --pipeline-definition-id a1b2c3d4-... --repo-id 123456789`\n- Create a trigger for a GitHub Server installation: \n  `circleci project trigger create --provider github_server --pipeline-definition-id a1b2c3d4-... --repo-id 123456789`\n- Create a trigger with event filtering and output as JSON: \n  `circleci project trigger create --pipeline-definition-id a1b2c3d4-... --repo-id 123456789 --event-preset all-pushes --json`\n\n##### `circleci project trigger list [flags]`\n\nList triggers for a pipeline definition\n\nList all triggers attached to a pipeline definition.\n\n--pipeline-definition-id is required. In a terminal it will be prompted\ninteractively if omitted; in non-interactive mode (CI, agents) it must\nbe passed as a flag.\n\nJSON fields: id, created_at, event_name, event_preset, config_ref, checkout_ref, disabled, event_source.provider, event_source.repo.external_id, event_source.repo.full_name\n\n| Flag                              | Description                                                                       |\n| --------------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`                     | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                          | Output as JSON                                                                    |\n| `--pipeline-definition-id string` | Pipeline definition ID (required)                                                 |\n| `--project string`                | Project slug (e.g. gh/org/repo); defaults to git remote                           |\n| `--project-id string`             | Project UUID (overrides --project)                                                |\n\n\n**Aliases:**\n\n\n`circleci project trigger ls`\n\n**Examples:**\n\n- List triggers for the current repository's project: \n  `circleci project trigger list --pipeline-definition-id a1b2c3d4-...`\n- List triggers for a specific project: \n  `circleci project trigger list --project gh/myorg/myrepo --pipeline-definition-id a1b2c3d4-...`\n- Output as JSON for scripting: \n  `circleci project trigger list --pipeline-definition-id a1b2c3d4-... --json`\n\n### `circleci runner <command>`\n\nManage self-hosted runners\n\nManage self-hosted runner resources.\n\nSelf-hosted runners let you run CircleCI jobs on your own infrastructure.\nResource class names use the format namespace/name (e.g. my-org/my-runner).\n\n#### `circleci runner config <resource-class> [flags]`\n\nGenerate a runner agent configuration file\n\nGenerate a runner agent configuration YAML for a resource class, suitable for\nuse as the agent's circleci-runner-config.yaml.\n\nA new authentication token is created unless you pass an existing one with\n--token, which generates the YAML without an API call.\n\n| Flag                  | Description                                               |\n| --------------------- | --------------------------------------------------------- |\n| `--nickname string`   | Nickname for the new token                                |\n| `-o, --output string` | Write config to this file instead of stdout               |\n| `--token string`      | Use an existing token value instead of creating a new one |\n\n\n**Arguments:**\n\n`<resource-class>` is the runner resource class to generate config for,\nin the form `namespace/name` (for example, `my-org/my-runner`).\n\n**Examples:**\n\n- Create a new token and print config to stdout: \n  `circleci runner config my-org/my-runner`\n- Write config directly to a file: \n  `circleci runner config my-org/my-runner --output circleci-runner-config.yaml`\n- Create a nicely-labeled token and write to a file: \n  `circleci runner config my-org/my-runner --nickname \"prod-server-1\" --output /etc/circleci-runner/circleci-runner-config.yaml`\n- Generate config from an existing token value (no API token creation): \n  `circleci runner config my-org/my-runner --token \"$EXISTING_TOKEN_VALUE\"`\n\n#### `circleci runner instance <command>`\n\nManage runner instances\n\nView CircleCI runner instances connected to your organization.\n\nInstances are live runner agents currently connected to CircleCI.\n\n##### `circleci runner instance list [flags]`\n\nList connected runner instances\n\nList CircleCI runner instances currently connected to your organization.\n\nSTATUS is derived from last_connected: online within the last 2 minutes,\nidle 2–30 minutes ago, offline beyond that.\n\nJSON fields: resource_class, hostname, name, version, ip, status, first_connected, last_connected, last_used\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--namespace string`      | Filter by namespace (organization)                                                |\n| `--org string`            | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n| `--resource-class string` | Filter by resource class (namespace/name)                                         |\n\n\n**Aliases:**\n\n\n`circleci runner instance ls`\n\n**Examples:**\n\n- List connected instances for the org inferred from the git remote: \n  `circleci runner instance list`\n- List instances for a specific organization (slug or UUID): \n  `circleci runner instance list --org gh/my-org`\n- List instances for a specific resource class: \n  `circleci runner instance list --resource-class my-org/my-runner`\n- Output as JSON: \n  `circleci runner instance list --org gh/my-org --json`\n\n#### `circleci runner open [flags]`\n\nOpen the runners inventory page in the browser\n\nOpen the CircleCI runners inventory page for an organization in your\ndefault web browser.\n\nThe organization is inferred from the current git repository's remote\nunless overridden with --org. Supports GitHub, Bitbucket, and GitLab\nremotes.\n\n| Flag           | Description                                               |\n| -------------- | --------------------------------------------------------- |\n| `--org string` | Organization slug (e.g. gh/myorg); defaults to git remote |\n\n\n**Examples:**\n\n- Open runners for the org inferred from git remote: \n  `circleci runner open`\n- Open runners for a specific organization: \n  `circleci runner open --org gh/myorg`\n- Open when your remote is on CircleCI server: \n  `circleci runner open --host https://circleci.example.com`\n\n#### `circleci runner resource-class <command>`\n\nManage runner resource classes\n\nManage runner resource classes.\n\nResource classes define the type of runner available to your jobs.\nEach resource class belongs to a namespace (usually your organization).\n\n##### `circleci runner resource-class create <namespace>/<name> [flags]`\n\nCreate a runner resource class\n\nCreate a new CircleCI runner resource class.\n\nJSON fields: id, resource_class, description (token_id, token with --generate-token)\n\n| Flag                   | Description                                                                       |\n| ---------------------- | --------------------------------------------------------------------------------- |\n| `--description string` | Human-readable description of the resource class                                  |\n| `--generate-token`     | also create a token for the resource class, nicknamed \"default\"                   |\n| `--jq string`          | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`               | Output as JSON                                                                    |\n\n\n**Arguments:**\n\nThe resource class name must be given in the form `namespace/name`,\nwhere namespace is your organization name (for example, `my-org/my-runner`).\n\n**Examples:**\n\n- Create a resource class: \n  `circleci runner resource-class create my-org/my-runner`\n- Create with a description: \n  `circleci runner resource-class create my-org/my-runner --description \"Linux amd64 runner\"`\n- Create a resource class and generate a token nicknamed \"default\": \n  `circleci runner resource-class create my-org/my-runner --generate-token`\n- Output as JSON: \n  `circleci runner resource-class create my-org/my-runner --json`\n\n##### `circleci runner resource-class delete <namespace>/<name> [flags]`\n\nDelete a runner resource class\n\nDelete a CircleCI runner resource class.\n\nAll tokens associated with the resource class will also be deleted.\nConnected runner instances will no longer be able to claim jobs.\n\nJSON fields: id, resource_class\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `-f, --force` | skip confirmation prompt                                                          |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\nThe resource class to delete, given in the form `namespace/name`,\nwhere namespace is your organization name (for example, `my-org/my-runner`).\n\n**Aliases:**\n\n\n`circleci runner resource-class rm`\n\n**Examples:**\n\n- Delete a resource class (with confirmation prompt): \n  `circleci runner resource-class delete my-org/my-runner`\n- Delete without confirmation: \n  `circleci runner resource-class delete my-org/my-runner --force`\n- Delete in a script, and report what was deleted: \n  `circleci runner resource-class delete my-org/my-runner --force --json`\n\n##### `circleci runner resource-class list [flags]`\n\nList runner resource classes\n\nList CircleCI runner resource classes.\n\nJSON fields: id, resource_class, description\n\n| Flag                 | Description                                                                       |\n| -------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`        | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`             | Output as JSON                                                                    |\n| `--namespace string` | Filter by namespace (organization)                                                |\n| `--org string`       | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n\n\n**Aliases:**\n\n\n`circleci runner resource-class ls`\n\n**Examples:**\n\n- List resource classes for the org inferred from the git remote: \n  `circleci runner resource-class list`\n- List resource classes for a specific organization (slug): \n  `circleci runner resource-class list --org gh/my-org`\n- List resource classes for a specific organization (UUID): \n  `circleci runner resource-class list --org f22b6566-597d-46d5-ba74-99ef5bb3d85c`\n- Output as JSON: \n  `circleci runner resource-class list --org gh/my-org --json`\n\n#### `circleci runner token <command>`\n\nManage runner tokens\n\nManage runner authentication tokens.\n\nTokens are used by runner agents to authenticate with CircleCI.\nEach token is associated with a specific resource class.\n\nToken values are only shown once at creation time and cannot be retrieved afterwards.\n\n##### `circleci runner token create <resource-class> [flags]`\n\nCreate a token for a resource class\n\nCreate a new authentication token for a runner resource class.\n\nThe token value is shown only once at creation time. Store it securely —\nit cannot be retrieved afterwards. If lost, delete this token and create\na new one.\n\nJSON fields: id, resource_class, nickname, created_at, token\n\n| Flag                | Description                                                                       |\n| ------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`       | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`            | Output as JSON                                                                    |\n| `--nickname string` | Human-readable nickname for the token                                             |\n\n\n**Arguments:**\n\n`<resource-class>` is the runner resource class to create a token for,\nin the form `namespace/name` (for example, `my-org/my-runner`).\n\n**Examples:**\n\n- Create a token for a resource class: \n  `circleci runner token create my-org/my-runner`\n- Create a token with a nickname: \n  `circleci runner token create my-org/my-runner --nickname \"prod-server-1\"`\n- Output as JSON (includes the token value): \n  `circleci runner token create my-org/my-runner --json`\n\n##### `circleci runner token delete <token-id> [flags]`\n\nDelete a runner token\n\nDelete a CircleCI runner authentication token by its ID.\n\nAgents using this token can no longer claim jobs; running jobs continue.\n\nJSON fields: id\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `-f, --force` | skip confirmation prompt                                                          |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Arguments:**\n\n`<token-id>` is the ID of the token to delete (a UUID). Find token IDs\nwith: `circleci runner token list --resource-class <namespace/name>`\n\n**Aliases:**\n\n\n`circleci runner token rm`\n\n**Examples:**\n\n- Delete a token by ID (with confirmation prompt): \n  `circleci runner token delete abc12345-0000-0000-0000-000000000000`\n- Delete without confirmation: \n  `circleci runner token delete abc12345-0000-0000-0000-000000000000 --force`\n- Delete in a script using JSON output: \n  `ID=$(circleci runner token list --resource-class my-org/my-runner --json --jq '.[0].id')`\n- `circleci runner token delete \"$ID\" --force --json`\n\n##### `circleci runner token list [flags]`\n\nList tokens for a resource class\n\nList authentication tokens for runner resource classes.\n\nWithout --resource-class, lists tokens for all resource classes\nyou have access to.\n\nToken values are never shown after creation. This command lists\ntoken metadata (ID, nickname, creation date) only.\n\nJSON fields: id, resource_class, nickname, created_at\n\n| Flag                      | Description                                                                       |\n| ------------------------- | --------------------------------------------------------------------------------- |\n| `--jq string`             | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                  | Output as JSON                                                                    |\n| `--resource-class string` | Filter by resource class (namespace/name)                                         |\n\n\n**Aliases:**\n\n\n`circleci runner token ls`\n\n**Examples:**\n\n- List tokens across all resource classes: \n  `circleci runner token list`\n- List tokens for a specific resource class: \n  `circleci runner token list --resource-class my-org/my-runner`\n- Output as JSON: \n  `circleci runner token list --json`\n- Extract IDs with --jq: \n  `circleci runner token list --resource-class my-org/my-runner --json --jq '.[].id'`\n\n### `circleci signing-config <command>`\n\nManage iOS signing configs\n\nCreate, list, and delete iOS signing configs.\n\nA signing config pairs an uploaded .p12 certificate with one or more\nprovisioning profiles under a stable name. Reference the signing config\nby name from your pipeline config under the 'code_signing' block to\ninstall it onto the macOS runner during a job.\n\n#### `circleci signing-config create [flags]`\n\nCreate an iOS signing config\n\nCreate a signing config that pairs a previously-uploaded certificate\nwith one or more provisioning profiles. The signing config name is what\nyou reference in your pipeline config under 'code_signing'.\n\nEach --profile flag points to a single provisioning profile file on\ndisk. The file is read and base64-encoded locally. Repeat the flag to\nadd additional profiles.\n\nJSON fields: id, name, cert_id\n\n| Flag                    | Description                                                                       |\n| ----------------------- | --------------------------------------------------------------------------------- |\n| `--cert-id string`      | ID of an uploaded certificate (see: circleci certificate list)                    |\n| `--jq string`           | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`                | Output as JSON                                                                    |\n| `--name string`         | Name for the signing config (referenced in pipeline config)                       |\n| `--org string`          | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n| `--profile stringArray` | Path to a provisioning profile file (repeatable)                                  |\n\n\n**Examples:**\n\n- Create a signing config (org inferred from git remote): \n  `circleci signing-config create --name production-signing --cert-id `<cert-id>` --profile ./MyApp.mobileprovision`\n- Multiple profiles: \n  `circleci signing-config create --name multi-target-signing --cert-id `<cert-id>` --profile ./MyApp.mobileprovision --profile ./MyAppExtension.mobileprovision`\n- Explicit org and capture the id for scripting: \n  `circleci signing-config create --org gh/acme --name prod --cert-id <cert-id> --profile ./p.mobileprovision --json --jq -r '.id'`\n\n#### `circleci signing-config delete <signing-config-id> [flags]`\n\nDelete an iOS signing config\n\nPermanently remove an iOS signing config from your organization.\n\nThis action is irreversible. Pipelines that reference the signing config\nby name will fail until they are updated.\n\n| Flag          | Description              |\n| ------------- | ------------------------ |\n| `-f, --force` | skip confirmation prompt |\n\n\n**Arguments:**\n\n`<signing-config-id>` is the ID of the signing config to delete\nUse `circleci signing-config list` to find the ID.\n\n**Aliases:**\n\n\n`circleci signing-config rm`\n\n**Examples:**\n\n- Delete a signing config (with confirmation): \n  `circleci signing-config delete <signing-config-id>`\n- Delete without confirmation: \n  `circleci signing-config delete <signing-config-id> --force`\n\n#### `circleci signing-config list [flags]`\n\nList iOS signing configs\n\nList the iOS signing configs defined for your organization.\n\nJSON fields: id, name, certificate, provisioning_profiles\n\n| Flag           | Description                                                                       |\n| -------------- | --------------------------------------------------------------------------------- |\n| `--jq string`  | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`       | Output as JSON                                                                    |\n| `--org string` | Organization slug (e.g. gh/myorg) or UUID; defaults to git remote                 |\n\n\n**Aliases:**\n\n\n`circleci signing-config ls`\n\n**Examples:**\n\n- List signing configs (org inferred from git remote): \n  `circleci signing-config list`\n- List for a specific org: \n  `circleci signing-config list --org gh/acme`\n- Output as JSON: \n  `circleci signing-config list --json`\n- Get signing config names only: \n  `circleci signing-config list --json --jq '.[].name'`\n\n#### `circleci signing-config profile <command>`\n\nAdd or remove provisioning profiles on a signing config\n\nAdd, replace, or remove a provisioning profile on an existing signing\nconfig, without recreating the whole config.\n\nA profile is matched to an existing one by the bundle identifier and\nprofile type embedded in the provisioning profile file itself, not by\nfile name: the same bundle ID and type replaces it in place, and\nanything else is added alongside it.\n\nRecreating a signing config (delete then create) leaves a gap where\npipelines referencing it by name fail; these commands update it in\nplace instead.\n\n##### `circleci signing-config profile add <signing-config-id> [flags]`\n\nAdd or replace a provisioning profile on a signing config\n\nAdd a provisioning profile to a signing config, or replace one that\nalready has the same bundle identifier and profile type.\n\nThe file at --profile is read and base64-encoded locally, then sent\nto CircleCI. The config's other profiles and certificate are left\nuntouched.\n\n| Flag               | Description                         |\n| ------------------ | ----------------------------------- |\n| `--profile string` | Path to a provisioning profile file |\n\n\n**Arguments:**\n\n`<signing-config-id>` is the ID of the signing config to update.\nUse `circleci signing-config list` to find the ID.\n\n**Examples:**\n\n- Add a new profile: \n  `circleci signing-config profile add <signing-config-id> --profile ./MyAppExtension.mobileprovision`\n- Replace an existing profile (same bundle ID and profile type, regardless of file name): \n  `circleci signing-config profile add <signing-config-id> --profile ./MyApp.mobileprovision`\n- Find the signing config ID first: \n  `circleci signing-config list --json --jq '.[].id'`\n\n##### `circleci signing-config profile remove <signing-config-id> <profile-id>`\n\nRemove a provisioning profile from a signing config\n\nRemove a single provisioning profile from a signing config, without\nrecreating the whole config.\n\nRemoving a profile that no longer exists is not an error.\n\n**Arguments:**\n\n`<signing-config-id>` is the ID of the signing config to update.\n`<profile-id>` is the ID of the provisioning profile to remove.\nUse `circleci signing-config list --json` to find both IDs.\n\n**Aliases:**\n\n\n`circleci signing-config profile rm`\n\n**Examples:**\n\n- Remove a profile by ID: \n  `circleci signing-config profile remove <signing-config-id> <profile-id>`\n- Find the profile ID first: \n  `circleci signing-config list --json --jq '.[] | select(.id==\"<signing-config-id>\") | .provisioning_profiles'`\n\n## User Commands\n\n### `circleci auth <command>`\n\nLog in, sign up and check your CircleCI identity\n\nManage authentication for the CLI.\n\nUse 'circleci auth signup' to create a new CircleCI account via the browser.\nUse 'circleci auth login' to authenticate via the browser-based OAuth flow.\nUse 'circleci auth me' to get current user info.\nUse 'circleci auth logout' to clear your stored credentials.\n\n#### `circleci auth id [flags]`\n\nShow the device ID for this CLI installation\n\nPrint the device ID for this CLI installation as \"`<os>:<uuid>`\".\n\nThe UUID is generated on first use and stored in the config file.\nThe OS prefix (e.g. darwin, linux) is added at print time so you\ncan identify the machine and platform at a glance. The same UUID\nis sent with every OAuth authorization request, so you can match\na token in the CircleCI UI back to this installation.\n\nJSON fields: device_id (string) — stable identifier in the form `<os>:<uuid>`\n\n| Flag     | Description    |\n| -------- | -------------- |\n| `--json` | Output as JSON |\n\n\n**Examples:**\n\n- Print the device ID: \n  `circleci auth id`\n- Output as JSON: \n  `circleci auth id --json`\n- Use in a script: \n  `DEVICE=$(circleci auth id)`\n\n#### `circleci auth login [flags]`\n\nLog in to a CircleCI account\n\nLog in to CircleCI by opening the OAuth authorization page in your\nbrowser. After you approve the request, an authorization code is\ndelivered back to a temporary loopback server on 127.0.0.1, then\nexchanged for an access token via POST /oauth/token.\n\nThe token is saved to the system keyring (or to the YAML config\nwhen --insecure-storage is set) and used automatically by all\nsubsequent CLI commands.\n\n| Flag           | Description                                          |\n| -------------- | ---------------------------------------------------- |\n| `--no-browser` | Print the authorize URL instead of opening a browser |\n\n\n**Examples:**\n\n- Open the browser and authorize the CLI: \n  `circleci auth login`\n- Print the authorize URL instead of opening a browser: \n  `circleci auth login --no-browser`\n- Authenticate against a non-default host: \n  `CIRCLE_HOST=https://example.circleci.com circleci auth login`\n\n#### `circleci auth logout [flags]`\n\nLog out of a CircleCI account\n\nRemove the stored API token, from the system keyring or from the YAML\nconfig file depending on where it was saved.\n\nCIRCLE_TOKEN is not affected: while it is set in the environment it\ntakes precedence over stored credentials, so the CLI stays\nauthenticated after logging out.\n\nJSON fields: storage (\"keyring\" or \"file\"), path (the config file, present only when storage is \"file\")\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Examples:**\n\n- Log out of the current account: \n  `circleci auth logout`\n- Log out, then sign in as a different account: \n  `circleci auth logout && circleci auth login`\n- Log out without printing the confirmation line: \n  `circleci auth logout --quiet`\n- Report where the token was removed from, for scripting: \n  `circleci auth logout --json --jq '.storage'`\n\n#### `circleci auth me [flags]`\n\nDisplay active account information\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n#### `circleci auth signup [flags]`\n\nSign-up for a new CircleCI account\n\nCreate a CircleCI account by opening the signup page in your browser.\nThis uses the same browser-based OAuth flow as 'circleci auth login'\nbut routes you to the signup page instead of the login page.\n\nIf a token is already configured, run 'circleci auth logout' first\n(signup will not silently overwrite an existing token). If you\nalready have a CircleCI account, use 'circleci auth login' instead.\n\n| Flag           | Description                                          |\n| -------------- | ---------------------------------------------------- |\n| `--no-browser` | Print the authorize URL instead of opening a browser |\n\n\n**Examples:**\n\n- Open the signup page in your browser: \n  `circleci auth signup`\n- Print the authorize URL instead of opening a browser: \n  `circleci auth signup --no-browser`\n- Authenticate against a non-default host: \n  `CIRCLE_HOST=https://example.circleci.com circleci auth signup`\n\n### `circleci completion <command>`\n\nInstall, remove or print shell completions\n\nManage shell tab-completion for circleci.\n\nRun 'circleci completion install' to add completion to your shell\nprofile automatically. Supported shells: bash, zsh.\n\nTo install manually, add one of the following to your shell profile:\n\n  bash:        source <(circleci completion bash)\n  zsh:         source <(circleci completion zsh)\n  fish:        circleci completion fish | source\n  powershell:  circleci completion powershell | Out-String | Invoke-Expression\n\nPowerShell has no auto-loaded completion directory, so completions must be\nregistered from your profile. Append the powershell line above to your\n$PROFILE to enable them in every session.\n\n#### `circleci completion install`\n\nInstall shell completion into your shell profile\n\nAppend a completion source line to your shell profile (~/.zshrc or ~/.bashrc).\n\nThe line is tagged so it can be cleanly removed with:\n  circleci completion uninstall\n\n**Examples:**\n\n- Install completion (detects shell from $SHELL): \n  `circleci completion install`\n- Then reload your shell: \n  `source ~/.zshrc`\n- To install manually instead, source the output directly: \n  `source <(circleci completion bash)`\n\n#### `circleci completion uninstall`\n\nRemove shell completion from your shell profile\n\nRemove the completion block previously added by 'circleci completion install'.\nOther content in your shell profile is left untouched.\n\n**Examples:**\n\n- Remove completion: \n  `circleci completion uninstall`\n- Then reload your shell: \n  `source ~/.zshrc`\n- Check whether completion is currently installed: \n  `grep -l \"circleci shell completion\" ~/.zshrc ~/.bashrc 2>/dev/null`\n\n### `circleci mcp`\n\nRun the CLI as an MCP server for AI tools\n\nManage MCP servers for AI assistants and code editors\n\n#### `circleci mcp claude`\n\nManage Claude Desktop MCP servers\n\nManage MCP server configuration for Claude Desktop\n\n##### `circleci mcp claude disable [flags]`\n\nRemove server from Claude config\n\nRemove this application from Claude Desktop MCP servers\n\n| Flag                   | Description                                               |\n| ---------------------- | --------------------------------------------------------- |\n| `--config-path string` | Path to Claude config file                                |\n| `--server-name string` | Name of the MCP server to remove (default \"circleci-cli\") |\n\n\n##### `circleci mcp claude enable [flags]`\n\nAdd server to Claude config\n\nAdd this application as an MCP server in Claude Desktop\n\n| Flag                       | Description                                                                    |\n| -------------------------- | ------------------------------------------------------------------------------ |\n| `--config-path string`     | Path to Claude config file                                                     |\n| `-e, --env stringToString` | Environment variables (e.g., --env KEY1=value1 --env KEY2=value2) (default []) |\n| `--log-level string`       | Log level (debug, info, warn, error)                                           |\n| `--server-name string`     | Name for the MCP server (default \"circleci-cli\")                               |\n\n\n##### `circleci mcp claude list [flags]`\n\nShow Claude MCP servers\n\nShow all MCP servers configured in Claude Desktop\n\n| Flag                   | Description                |\n| ---------------------- | -------------------------- |\n| `--config-path string` | Path to Claude config file |\n\n\n#### `circleci mcp cursor`\n\nManage Cursor MCP servers\n\nManage MCP server configuration for Cursor\n\n##### `circleci mcp cursor disable [flags]`\n\nRemove server from Cursor config\n\nRemove this application from Cursor MCP servers\n\n| Flag                   | Description                                                                |\n| ---------------------- | -------------------------------------------------------------------------- |\n| `--config-path string` | Path to Cursor config file                                                 |\n| `--server-name string` | Name of the MCP server to remove (default \"circleci-cli\")                  |\n| `--workspace`          | Remove from workspace settings (.cursor/mcp.json) instead of user settings |\n\n\n##### `circleci mcp cursor enable [flags]`\n\nAdd server to Cursor config\n\nAdd this application as an MCP server in Cursor\n\n| Flag                       | Description                                                                    |\n| -------------------------- | ------------------------------------------------------------------------------ |\n| `--config-path string`     | Path to Cursor config file                                                     |\n| `-e, --env stringToString` | Environment variables (e.g., --env KEY1=value1 --env KEY2=value2) (default []) |\n| `--log-level string`       | Log level (debug, info, warn, error)                                           |\n| `--server-name string`     | Name for the MCP server (default \"circleci-cli\")                               |\n| `--workspace`              | Add to workspace settings (.cursor/mcp.json) instead of user settings          |\n\n\n##### `circleci mcp cursor list [flags]`\n\nShow Cursor MCP servers\n\nShow all MCP servers configured in Cursor\n\n| Flag                   | Description                                                              |\n| ---------------------- | ------------------------------------------------------------------------ |\n| `--config-path string` | Path to Cursor config file                                               |\n| `--workspace`          | List from workspace settings (.cursor/mcp.json) instead of user settings |\n\n\n#### `circleci mcp start [flags]`\n\nStart the MCP server\n\nStart stdio server to expose CLI commands to AI assistants\n\n| Flag                 | Description                          |\n| -------------------- | ------------------------------------ |\n| `--log-level string` | Log level (debug, info, warn, error) |\n\n\n#### `circleci mcp stream [flags]`\n\nStream the MCP server over HTTP\n\nStart HTTP server to expose CLI commands to AI assistants\n\n| Flag                 | Description                             |\n| -------------------- | --------------------------------------- |\n| `--host string`      | host to listen on                       |\n| `--log-level string` | Log level (debug, info, warn, error)    |\n| `--port int`         | port number to listen on (default 8080) |\n\n\n#### `circleci mcp tools [flags]`\n\nExport tools as JSON\n\nExport available MCP tools to mcp-tools.json for inspection\n\n| Flag                 | Description                          |\n| -------------------- | ------------------------------------ |\n| `--log-level string` | Log level (debug, info, warn, error) |\n\n\n#### `circleci mcp vscode`\n\nManage VSCode MCP servers\n\nManage MCP server configuration for Visual Studio Code\n\n##### `circleci mcp vscode disable [flags]`\n\nRemove server from VSCode config\n\nRemove this application from VSCode MCP servers\n\n| Flag                   | Description                                                                |\n| ---------------------- | -------------------------------------------------------------------------- |\n| `--config-path string` | Path to VSCode config file                                                 |\n| `--server-name string` | Name of the MCP server to remove (default \"circleci-cli\")                  |\n| `--workspace`          | Remove from workspace settings (.vscode/mcp.json) instead of user settings |\n\n\n##### `circleci mcp vscode enable [flags]`\n\nAdd server to VSCode config\n\nAdd this application as an MCP server in VSCode\n\n| Flag                       | Description                                                                    |\n| -------------------------- | ------------------------------------------------------------------------------ |\n| `--config-path string`     | Path to VSCode config file                                                     |\n| `-e, --env stringToString` | Environment variables (e.g., --env KEY1=value1 --env KEY2=value2) (default []) |\n| `--log-level string`       | Log level (debug, info, warn, error)                                           |\n| `--server-name string`     | Name for the MCP server (default \"circleci-cli\")                               |\n| `--workspace`              | Add to workspace settings (.vscode/mcp.json) instead of user settings          |\n\n\n##### `circleci mcp vscode list [flags]`\n\nShow VSCode MCP servers\n\nShow all MCP servers configured in VSCode\n\n| Flag                   | Description                                                              |\n| ---------------------- | ------------------------------------------------------------------------ |\n| `--config-path string` | Path to VSCode config file                                               |\n| `--workspace`          | List from workspace settings (.vscode/mcp.json) instead of user settings |\n\n\n### `circleci my <command>`\n\nShow resources for the authenticated user\n\nShow CircleCI resources scoped to you, the authenticated user.\n\nThese commands answer \"what's mine?\" across every project you have\naccess to, rather than a single project inferred from the current\ngit repository.\n\n#### `circleci my runs [flags]`\n\nList your recent runs grouped by project\n\nList recent runs you triggered, across every project you have access to.\n\nThis is the personal counterpart to \"circleci run list\": rather than a\nsingle project, it shows your runs everywhere, in the order the API\nreturns them, with the project of each run in its own column.\n\nJSON: an array of runs, each { project, project_id, id, phase, outcome,\ncurrent_outcome, branch, tag, revision, created_at }, where project is\nthe run's \"org/repo\" repository (when known) and project_id its UUID.\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n| `--limit int` | Maximum number of runs to fetch [default: 20] (default 20)                        |\n\n\n**Aliases:**\n\n\n`circleci my run`\n\n**Examples:**\n\n- List your recent runs across all projects: \n  `circleci my runs`\n- Show more results: \n  `circleci my runs --limit 50`\n- Output as JSON for scripting: \n  `circleci my runs --json`\n- Pull out just the run IDs with jq: \n  `circleci my runs --json --jq '.[].id'`\n\n### `circleci onboard [path] [flags]`\n\nGuided onboarding: generate config, sign up, connect project\n\nPrompts for repo setup or signup unless --scan or --signup is given. Writes a\nstarter config if none exists, creates and follows the project, adds a trigger.\n\n| Flag               | Description                                                 |\n| ------------------ | ----------------------------------------------------------- |\n| `--no-browser`     | Print the signup URL instead of opening a browser           |\n| `--repo-id string` | Repository ID, if it cannot be resolved from the git remote |\n| `--scan`           | Skip prompt: set up this repo on CircleCI                   |\n| `--signup`         | Skip prompt: sign up for CircleCI                           |\n\n\n**Arguments:**\n\n`<path>` is the directory to onboard. Defaults to the current directory.\n\n**Examples:**\n\n- Interactive mode: choose repo setup or signup: \n  `circleci onboard`\n- Set up the current directory (skip the choice prompt): \n  `circleci onboard --scan`\n- Set up and wire up the first pipeline without prompts: \n  `circleci onboard --scan --repo-id 123456789`\n- Sign up for CircleCI (no repo needed): \n  `circleci onboard --signup`\n- Onboard a specific project path: \n  `circleci onboard --scan ./my-app`\n- Print the signup URL instead of opening a browser: \n  `circleci onboard --signup --no-browser`\n\n### `circleci setting <command>`\n\nConfigure the CLI itself (token, host, defaults)\n\nView and modify settings for the circleci CLI tool.\n\nUse 'circleci setting set token' to configure your personal API token.\nUse 'circleci setting unset token' to remove your stored API token.\nUse 'circleci setting set telemetry on/off' to manage telemetry preferences.\nUse 'circleci setting list' to view current settings.\n\nFor pipeline YAML operations, see 'circleci config'.\n\n#### `circleci setting list [flags]`\n\nList current CLI settings\n\nDisplay the current CLI settings.\n\nThe token value is masked for security. Settings are read from\n$XDG_CONFIG_HOME/circleci/config.yml (default: ~/.config/circleci/config.yml).\n\nJSON fields: token_set, host, telemetry, theme, update_check\n\n| Flag          | Description                                                                       |\n| ------------- | --------------------------------------------------------------------------------- |\n| `--jq string` | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `--json`      | Output as JSON                                                                    |\n\n\n**Aliases:**\n\n\n`circleci setting ls`\n\n**Examples:**\n\n- Show current settings: \n  `circleci setting list`\n- Output as JSON: \n  `circleci setting list --json`\n\n#### `circleci setting set <key> <value>`\n\nSet a CLI setting\n\nSet a CLI setting by key.\n\n**Arguments:**\n\n- `<key>` is the setting to change. Options are: `token`, `host`, `telemetry`, `theme`, or `update-check`.\n- `<value>` is the value to store. Pass `-` to read it from stdin.\n  May be omitted for `theme` to pick interactively.\n\n**Examples:**\n\n- Store your personal API token: \n  `circleci setting set token mytoken123`\n- Read the token from stdin to avoid shell history exposure: \n  `echo \"mytoken123\" | circleci setting set token -`\n- Point to a self-hosted CircleCI server: \n  `circleci setting set host https://circleci.mycompany.com`\n- Enable telemetry: \n  `circleci setting set telemetry on`\n- Disable telemetry: \n  `circleci setting set telemetry off`\n- Set the color theme used for rendered output: \n  `circleci setting set theme dracula`\n- Pick the color theme interactively: \n  `circleci setting set theme`\n- Disable update notifications: \n  `circleci setting set update-check off`\n\n#### `circleci setting unset <key>`\n\nRemove a stored CLI setting\n\nRemove a stored CLI setting by key.\n\nSupported keys:\n  token         Remove your stored CircleCI personal API token\n  update-check  Revert update notifications to the default (enabled)\n\n**Arguments:**\n\n`<key>` is the setting to remove. Supported keys are `token` and `update-check`.\n\n**Examples:**\n\n- Remove your stored API token: \n  `circleci setting unset token`\n- Revert update notifications to the default: \n  `circleci setting unset update-check`\n\n## Extension Commands\n\n### `circleci extension <command>`\n\nManage CLI extensions\n\nManage CircleCI CLI extensions.\n\nExtensions are binaries named circleci-<name> that add new\ncommands to the CLI. Once installed, an extension is invoked transparently\nas 'circleci <name>'.\n\nUse 'circleci extension install <name>' to fetch an extension from the CircleCI\nextension registry and verify its checksum before installing it.\n\n#### `circleci extension install <extension>`\n\nInstall an extension\n\nInstall a CircleCI CLI extension from the extension registry.\n\nThe extension binary is downloaded, its SHA-256 checksum is verified\nagainst the release manifest, and the binary is written to the\nextension directory.\n\nA manifest file is written alongside the binary recording the version,\nchecksum, and source URL so the extension can be upgraded or removed later.\n\n**Examples:**\n\n- Install the testsuite extension: \n  `circleci extension install testsuite`\n\n#### `circleci extension remove <extension> [flags]`\n\nRemove an installed extension\n\nRemove an installed CircleCI CLI extension.\n\nThe extension binary and its manifest are deleted from the extension\ndirectory. After removal, the extension is no longer available as a\nCLI command.\n\n| Flag          | Description              |\n| ------------- | ------------------------ |\n| `-f, --force` | Skip confirmation prompt |\n\n\n**Examples:**\n\n- Remove using the name of the extension: \n  `circleci extension remove <name>`\n- Remove using the full binary name: \n  `circleci extension remove circleci-<name>`\n- Remove without confirmation prompt: \n  `circleci extension remove <name> --force`\n\n### `circleci testsuite`\n\nExtension (circleci-testsuite)\n\nThe CircleCI \"testsuite\" extension is not installed by default.\n\nInstall it with 'circleci extension install testsuite'.\n\n## Additional Commands\n\n### `circleci api <path> [flags]`\n\nCall the CircleCI REST API directly\n\nMake an authenticated HTTP request to the REST API and print the raw\nresponse body. The Authorization header is added from your stored token.\n\nExit code reflects the HTTP response: 0 for 2xx, 4 for 4xx/5xx.\n\n| Flag                       | Description                                                                       |\n| -------------------------- | --------------------------------------------------------------------------------- |\n| `-d, --data string`        | Raw request body sent verbatim; @file reads from a file, @- from stdin            |\n| `-f, --field stringArray`  | Add a field: key=value (query param for GET/DELETE, JSON body for POST/PUT/PATCH) |\n| `-H, --header stringArray` | Add a request header: \"Key: Value\"                                                |\n| `--jq string`              | Process values from the response using jq syntax (see `circleci help formatting`) |\n| `-X, --method string`      | HTTP method (default: GET, or POST when -f or -d is used)                         |\n\n\n**Arguments:**\n\n`<path>` is the request path. It is relative to /api/v3 by default\n(for example, \"projects/{project-id}\"). To target\na different version prefix, include it explicitly, for example, \"api/v2/me\".\n\n**Examples:**\n\n- Get your user profile: \n  `circleci api me`\n- List runs for a project: \n  `circleci api projects/{project-id}/runs`\n- Trigger a pipeline on a branch: \n  `circleci api projects/{project-id}/run -f definition_id=<id> -f \"config[branch]=main\"`\n- Send a body read from a file (@- reads from stdin): \n  `circleci api projects/{project-id}/run -d @payload.json`\n- Access the v1.1 API with a custom header: \n  `circleci api api/v1.1/me -H \"X-Custom: value\"`\n\n### `circleci env <command>`\n\nWork with environment variables\n\nWork with environment variables in CircleCI workflows.\n\n#### `circleci env subst [string]`\n\nSubstitute environment variables in a string\n\nSubstitute environment variables in a string, similar to the POSIX envsubst utility.\n\nPass the string as an argument, or pipe it through stdin. The command writes\nthe substituted result to stdout with no trailing newline added.\n\nSupports $VAR and ${VAR} syntax. References to unset variables are replaced\nwith an empty string.\n\n**Examples:**\n\n- Substitute a single variable: \n  `export API_URL=https://circleci.com`\n- `circleci env subst \"Base URL: $API_URL\"`\n- Substitute variables in a JSON payload via stdin: \n  `export TOKEN=abc123`\n- `echo '{\"token\": \"$TOKEN\"}' | circleci env subst`\n- Substitute into a config file before uploading: \n  `circleci env subst < .circleci/config.template.yml > .circleci/config.yml`\n\n### `circleci version [flags]`\n\nPrint version information\n\nPrint the version and commit hash this binary was built from.\n\nJSON fields: version (release tag, or \"dev\" for unreleased builds), commit\n(full git hash), modified (true when built from a dirty working tree)\n\n| Flag     | Description                                        |\n| -------- | -------------------------------------------------- |\n| `--json` | output as JSON (fields: version, commit, modified) |\n\n\n**Examples:**\n\n- Print version and commit hash: \n  `circleci version`\n- Print as JSON: \n  `circleci version --json`\n- Extract just the commit hash: \n  `circleci version --json | jq -r .commit`\n\n"
  - name: run <command>
    description: Trigger, watch and cancel CI runs
    group: ci
    commands:
      - name: cancel <run-number-or-id>
        description: Cancel a run
        group: Targeted commands
        flags:
          --project=: Project slug (e.g. gh/org/repo); used when cancelling by number
          -f, --force: skip confirmation prompt
        documentation:
          command: |
            Cancel a running CircleCI run by number or UUID.

            Cancelling a run stops all in-progress workflows and jobs within it.
            Workflows that have already completed are unaffected.
      - name: get [<run-id>]
        description: Get a run's status
        group: Targeted commands
        flags:
          --failure-report: Print condensed output for every failed step; intended for agent consumption
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --no-interactive: Skip the interactive picker and resolve the latest run directly
          --project=: Project slug (e.g. gh/org/repo); used for latest-run lookup
          -b, --branch=: Branch name (defaults to the current branch, or main when --project is set)
          -m, --mine: Filter to runs owned by you.
        documentation:
          command: |
            Display the status of a CircleCI run and its workflows.

            With no run UUID in an interactive terminal, a picker walks you through the
            recent runs; --no-interactive, --json, or a non-interactive session skips it
            and resolves the latest run directly.

            JSON fields: id, phase, outcome, current_outcome, branch, tag, revision,
            repository_url, commit.subject/url/author_name/author_login, created_at,
            errors[].type/message, workflows[].id/name/phase/outcome/current_outcome/duration/
            jobs[].id/name/phase/outcome/current_outcome/type
      - name: list
        aliases:
          - ls
        description: List recent runs for a project
        group: General commands
        flags:
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --limit=:
            description: 'Maximum number of runs to show [default: 10]'
            default: "10"
          --project=: Project slug (e.g. gh/org/repo); defaults to git remote
          -B, --current-branch: Filter by the currently checked-out branch
          -b, --branch=: Filter by branch
        documentation:
          command: |
            List recent runs for a CircleCI project.

            The project is inferred from the current git repository's remote
            unless overridden with --project. Use --branch to filter results
            to a single branch, or --current-branch (-B) to automatically use
            the branch you have checked out.

            The markdown table includes the commit subject; the JSON adds the full
            commit and repository detail.

            JSON fields: id, phase, outcome, current_outcome, branch, tag, revision, repository_url, commit.subject/url/author_name/author_login, created_at
      - name: open
        description: Open the current project's runs page in the browser
        group: Targeted commands
        flags:
          --project=: Project slug (e.g. gh/org/repo); used for latest-run lookup
          -b, --branch=: Branch name (defaults to current branch)
        documentation:
          command: |
            Open the CircleCI runs page for the current project in your
            default web browser.

            The project is inferred from the current git repository's remote.
            Supports GitHub, Bitbucket, and GitLab remotes.

            Use --current-branch or --branch/-b to filter runs to a specific branch.
      - name: trigger
        description: Trigger a new run
        group: Targeted commands
        flags:
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --parameter=*: Run parameter as key=value (repeatable)
          --project=: Project slug (e.g. gh/org/repo); defaults to git remote
          -b, --branch=: Branch to trigger (defaults to current branch)
        documentation:
          command: |
            Trigger a new run for a CircleCI project.

            The project and branch are inferred from the current git repository
            unless overridden with --project or --branch.

            Pass run parameters with --parameter. Values are parsed as
            booleans (true/false), integers, or strings.

            JSON fields: id, number, state, created_at
      - name: watch [<run-id>]
        description: Watch a run until it completes
        group: Targeted commands
        flags:
          --failfast: Exit as soon as any job fails, without waiting for the rest of the run
          --project=: Project slug (e.g. gh/org/repo); defaults to git remote
          --sha=: Watch run for this commit SHA; polls up to 2m if not yet created
          --timeout=:
            description: Maximum time to wait for run completion
            default: 30m0s
          -b, --branch=: Branch to watch (defaults to current branch)
        documentation:
          command: |
            Monitor a CircleCI run and block until it reaches a terminal state. Without
            arguments, watches the latest run for the current branch. A terminal gets a
            live table of workflows and jobs; piped or in CI, each change prints a line.

            Exit code reflects the result: 0 succeeded, 1 failed, 6 cancelled, 7 the run's
            config was rejected (a dynamic-config continuation included), 8 timed out.
            With --sha, polls up to 2 minutes for the run to appear — useful after a push.
    documentation:
      command: |
        Work with CircleCI runs.

        A run is created each time a trigger fires for a pipeline. It carries
        the VCS context for that firing and groups the workflows it produced;
        each workflow in turn contains jobs.
  - name: runner <command>
    description: Manage self-hosted runners
    group: management
    commands:
      - name: config <resource-class>
        description: Generate a runner agent configuration file
        group: Targeted commands
        flags:
          --nickname=: Nickname for the new token
          --token=: Use an existing token value instead of creating a new one
          -o, --output=: Write config to this file instead of stdout
        documentation:
          command: |
            Generate a runner agent configuration YAML for a resource class, suitable for
            use as the agent's circleci-runner-config.yaml.

            A new authentication token is created unless you pass an existing one with
            --token, which generates the YAML without an API call.
      - name: instance <command>
        description: Manage runner instances
        group: Subcommands
        commands:
          - name: list
            aliases:
              - ls
            description: List connected runner instances
            group: General commands
            flags:
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
              --namespace=: Filter by namespace (organization)
              --org=: Organization slug (e.g. gh/myorg) or UUID; defaults to git remote
              --resource-class=: Filter by resource class (namespace/name)
            documentation:
              command: |
                List CircleCI runner instances currently connected to your organization.

                STATUS is derived from last_connected: online within the last 2 minutes,
                idle 2–30 minutes ago, offline beyond that.

                JSON fields: resource_class, hostname, name, version, ip, status, first_connected, last_connected, last_used
        documentation:
          command: |
            View CircleCI runner instances connected to your organization.

            Instances are live runner agents currently connected to CircleCI.
      - name: open
        description: Open the runners inventory page in the browser
        group: General commands
        flags:
          --org=: Organization slug (e.g. gh/myorg); defaults to git remote
        documentation:
          command: |
            Open the CircleCI runners inventory page for an organization in your
            default web browser.

            The organization is inferred from the current git repository's remote
            unless overridden with --org. Supports GitHub, Bitbucket, and GitLab
            remotes.
      - name: resource-class <command>
        description: Manage runner resource classes
        group: Subcommands
        commands:
          - name: create <namespace>/<name>
            description: Create a runner resource class
            group: General commands
            flags:
              --description=: Human-readable description of the resource class
              --generate-token: also create a token for the resource class, nicknamed "default"
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
            documentation:
              command: |
                Create a new CircleCI runner resource class.

                JSON fields: id, resource_class, description (token_id, token with --generate-token)
          - name: delete <namespace>/<name>
            aliases:
              - rm
            description: Delete a runner resource class
            group: Targeted commands
            flags:
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
              -f, --force: skip confirmation prompt
            documentation:
              command: |
                Delete a CircleCI runner resource class.

                All tokens associated with the resource class will also be deleted.
                Connected runner instances will no longer be able to claim jobs.

                JSON fields: id, resource_class
          - name: list
            aliases:
              - ls
            description: List runner resource classes
            group: General commands
            flags:
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
              --namespace=: Filter by namespace (organization)
              --org=: Organization slug (e.g. gh/myorg) or UUID; defaults to git remote
            documentation:
              command: |
                List CircleCI runner resource classes.

                JSON fields: id, resource_class, description
        documentation:
          command: |
            Manage runner resource classes.

            Resource classes define the type of runner available to your jobs.
            Each resource class belongs to a namespace (usually your organization).
      - name: token <command>
        description: Manage runner tokens
        group: Subcommands
        commands:
          - name: create <resource-class>
            description: Create a token for a resource class
            group: General commands
            flags:
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
              --nickname=: Human-readable nickname for the token
            documentation:
              command: |
                Create a new authentication token for a runner resource class.

                The token value is shown only once at creation time. Store it securely —
                it cannot be retrieved afterwards. If lost, delete this token and create
                a new one.

                JSON fields: id, resource_class, nickname, created_at, token
          - name: delete <token-id>
            aliases:
              - rm
            description: Delete a runner token
            group: Targeted commands
            flags:
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
              -f, --force: skip confirmation prompt
            documentation:
              command: |
                Delete a CircleCI runner authentication token by its ID.

                Agents using this token can no longer claim jobs; running jobs continue.

                JSON fields: id
          - name: list
            aliases:
              - ls
            description: List tokens for a resource class
            group: General commands
            flags:
              --jq=: Process values from the response using jq syntax
              --json: Output as JSON
              --resource-class=: Filter by resource class (namespace/name)
            documentation:
              command: |
                List authentication tokens for runner resource classes.

                Without --resource-class, lists tokens for all resource classes
                you have access to.

                Token values are never shown after creation. This command lists
                token metadata (ID, nickname, creation date) only.

                JSON fields: id, resource_class, nickname, created_at
        documentation:
          command: |
            Manage runner authentication tokens.

            Tokens are used by runner agents to authenticate with CircleCI.
            Each token is associated with a specific resource class.

            Token values are only shown once at creation time and cannot be retrieved afterwards.
    documentation:
      command: |
        Manage self-hosted runner resources.

        Self-hosted runners let you run CircleCI jobs on your own infrastructure.
        Resource class names use the format namespace/name (e.g. my-org/my-runner).
  - name: setting <command>
    description: Configure the CLI itself (token, host, defaults)
    group: user
    commands:
      - name: list
        aliases:
          - ls
        description: List current CLI settings
        group: General commands
        flags:
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
        documentation:
          command: |
            Display the current CLI settings.

            The token value is masked for security. Settings are read from
            $XDG_CONFIG_HOME/circleci/config.yml (default: ~/.config/circleci/config.yml).

            JSON fields: token_set, host, telemetry, theme, update_check
      - name: set <key> <value>
        description: Set a CLI setting
        group: Targeted commands
        documentation:
          command: |
            Set a CLI setting by key.
      - name: unset <key>
        description: Remove a stored CLI setting
        group: Targeted commands
        documentation:
          command: |
            Remove a stored CLI setting by key.

            Supported keys:
              token         Remove your stored CircleCI personal API token
              update-check  Revert update notifications to the default (enabled)
    documentation:
      command: |
        View and modify settings for the circleci CLI tool.

        Use 'circleci setting set token' to configure your personal API token.
        Use 'circleci setting unset token' to remove your stored API token.
        Use 'circleci setting set telemetry on/off' to manage telemetry preferences.
        Use 'circleci setting list' to view current settings.

        For pipeline YAML operations, see 'circleci config'.
  - name: setup
    description: Configure the CLI with a host and token (legacy compatibility)
    hidden: true
    flags:
      --host=!: CircleCI host, e.g. https://circleci.com (required)
      --no-prompt!: Run without interactive prompts (required)
      --token=!: CircleCI API token (required)
    documentation:
      command: |
        Persist a CircleCI host and API token to the CLI config file.

        This command exists only for backwards compatibility with the
        CircleCI CLI orb. Only the non-interactive path is supported: you
        must pass --no-prompt, --host, and --token. The interactive setup
        flow from the legacy CLI is not reimplemented.

        For new usage, prefer:
          circleci auth login                 interactive, browser-based
          circleci setting set host `<host>`    store the host
          circleci setting set token `<token>`  store the token
  - name: signing-config <command>
    description: Manage iOS signing configs
    group: management
    commands:
      - name: create
        description: Create an iOS signing config
        group: General commands
        flags:
          --cert-id=: 'ID of an uploaded certificate (see: circleci certificate list)'
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --name=: Name for the signing config (referenced in pipeline config)
          --org=: Organization slug (e.g. gh/myorg) or UUID; defaults to git remote
          --profile=*: Path to a provisioning profile file (repeatable)
        documentation:
          command: |
            Create a signing config that pairs a previously-uploaded certificate
            with one or more provisioning profiles. The signing config name is what
            you reference in your pipeline config under 'code_signing'.

            Each --profile flag points to a single provisioning profile file on
            disk. The file is read and base64-encoded locally. Repeat the flag to
            add additional profiles.

            JSON fields: id, name, cert_id
      - name: delete <signing-config-id>
        aliases:
          - rm
        description: Delete an iOS signing config
        group: Targeted commands
        flags:
          -f, --force: skip confirmation prompt
        documentation:
          command: |
            Permanently remove an iOS signing config from your organization.

            This action is irreversible. Pipelines that reference the signing config
            by name will fail until they are updated.
      - name: list
        aliases:
          - ls
        description: List iOS signing configs
        group: General commands
        flags:
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --org=: Organization slug (e.g. gh/myorg) or UUID; defaults to git remote
        documentation:
          command: |
            List the iOS signing configs defined for your organization.

            JSON fields: id, name, certificate, provisioning_profiles
      - name: profile <command>
        description: Add or remove provisioning profiles on a signing config
        group: Subcommands
        commands:
          - name: add <signing-config-id>
            description: Add or replace a provisioning profile on a signing config
            flags:
              --profile=: Path to a provisioning profile file
            documentation:
              command: |
                Add a provisioning profile to a signing config, or replace one that
                already has the same bundle identifier and profile type.

                The file at --profile is read and base64-encoded locally, then sent
                to CircleCI. The config's other profiles and certificate are left
                untouched.
          - name: remove <signing-config-id> <profile-id>
            aliases:
              - rm
            description: Remove a provisioning profile from a signing config
            documentation:
              command: |
                Remove a single provisioning profile from a signing config, without
                recreating the whole config.

                Removing a profile that no longer exists is not an error.
        documentation:
          command: |
            Add, replace, or remove a provisioning profile on an existing signing
            config, without recreating the whole config.

            A profile is matched to an existing one by the bundle identifier and
            profile type embedded in the provisioning profile file itself, not by
            file name: the same bundle ID and type replaces it in place, and
            anything else is added alongside it.

            Recreating a signing config (delete then create) leaves a gap where
            pipelines referencing it by name fail; these commands update it in
            place instead.
    documentation:
      command: |
        Create, list, and delete iOS signing configs.

        A signing config pairs an uploaded .p12 certificate with one or more
        provisioning profiles under a stable name. Reference the signing config
        by name from your pipeline config under the 'code_signing' block to
        install it onto the macOS runner during a job.
  - name: step <command>
    description: Control job step execution
    hidden: true
    commands:
      - name: halt
        description: Halt the current job and mark it as successful
        documentation:
          command: |
            Halt the running CircleCI job immediately and mark it as successful.

            Any steps that follow in the job configuration will not execute.

            This command delegates to circleci-agent and must be called from
            within a running CircleCI job.
  - name: telemetry
    description: Information about telemetry in circleci
    hidden: true
    documentation:
      command: |
        circleci collects telemetry to help us understand how the CLI is being used and to improve it.

        To learn more about what data is collected, how it is used, and how to opt out, see:
        <https://circleci.com/docs/guides/toolkit/circleci-cli/#telemetry>
  - name: testresult <command>
    description: Inspect test results for a job
    group: ci
    commands:
      - name: get <job-id> <name>
        description: Get a single test result by name
        group: Targeted commands
        flags:
          --filter=*: Disambiguate by classname=`<value>` when a name is shared; repeatable
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --plain: Print only the raw test message, verbatim and unformatted
        documentation:
          command: |
            Get a single test result from a job by its exact name.

            When several tests share a name the lookup is ambiguous and fails; narrow it
            with `--filter classname=<value>`, or browse with `circleci testresult list`.

            JSON fields: classname, name, result, run_time, message
      - name: list <job-id>
        aliases:
          - ls
        description: List test results for a job
        group: General commands
        flags:
          --all: Show all results (passing, failed and skipped), not just failures
          --filter=*: 'Filter by key=value; repeatable. Keys: result (success|failure|skipped, exact), name and classname (case-insensitive substring). Same key repeated is OR, different keys AND. Cannot combine result= with --all'
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --limit=: Maximum number of results to show (0 = no limit)
          --sort=: Sort by name, classname, result or run_time
        documentation:
          command: |
            Show the test results recorded for a CircleCI job. Only failed tests are
            shown unless --all or a result= filter selects otherwise.

            JSON fields: classname, name, result, run_time, message — emitted as one
            object per line (JSONL), so --jq runs once per record. See
            `circleci help formatting` for aggregating across the stream.
    documentation:
      command: |
        Work with the test metadata CircleCI collects for a job.

        When a job stores test results (via the 'store_test_results' step),
        CircleCI parses them into per-test records. Use these commands to
        review which tests failed, passed or were skipped without opening the
        web UI.
  - name: testsuite
    description: Extension (circleci-testsuite)
    group: extension
    documentation:
      command: |
        The CircleCI "testsuite" extension is not installed by default.

        Install it with 'circleci extension install testsuite'.
  - name: triggers
    description: Event source providers and event presets for project triggers
    hidden: true
    documentation:
      command: |
        A trigger connects an event source to a pipeline definition, so that matching events
        automatically start a pipeline run. Create one with `circleci project trigger create`.

        ## Providers

        The `--provider` flag names the event source. `github_app` is the default.

        | Provider | Event source |
        |---|---|
        | `github_app` | A repository in a GitHub org with the CircleCI GitHub App installed |
        | `github_server` | A repository on a self-hosted GitHub Enterprise Server |
        | `github_oauth` | A repository connected through the legacy GitHub OAuth integration |
        | `webhook` | An inbound HTTP webhook, for sources CircleCI does not integrate with directly |
        | `schedule` | A time-based schedule rather than a repository event |

        The three repository-backed providers need `--repo-id`, the repository's external ID
        as the provider knows it. `webhook` and `schedule` do not.

        ## Event presets

        The `--event-preset` flag filters which events actually start a run. Omit it to run on
        every event the provider sends.

        | Preset | Runs on |
        |---|---|
        | `all-pushes` | Every push to any branch |
        | `default-branch-pushes` | Pushes to the default branch only |
        | `only-tags` | Tag pushes only |
        | `only-branch-delete` | Branch deletions |
        | `only-build-prs` | Pushes to branches that have an open pull request |
        | `only-open-prs` | Pull requests being opened |
        | `non-draft-pr-opened` | Pull requests opened in a non-draft state |
        | `only-build-pushes-to-non-draft-prs` | Pushes to non-draft pull requests |
        | `only-ready-for-review-prs` | Pull requests marked ready for review |
        | `only-labeled-prs` | Pull requests being labeled |
        | `only-merged-prs` | Pull requests being merged |
        | `only-merged-or-closed-prs` | Pull requests being merged or closed |
        | `pr-comment-equals-run-ci` | A pull request comment of exactly "run ci" |
        | `pushes-to-merge-queues` | Pushes to a GitHub merge queue |
  - name: version
    description: Print version information
    flags:
      --json: 'output as JSON (fields: version, commit, modified)'
    documentation:
      command: |
        Print the version and commit hash this binary was built from.

        JSON fields: version (release tag, or "dev" for unreleased builds), commit
        (full git hash), modified (true when built from a dirty working tree)
  - name: workflow <command>
    description: Inspect, rerun and cancel workflows (job graphs)
    group: ci
    commands:
      - name: cancel <workflow-id>
        description: Cancel a running workflow
        group: Targeted commands
        flags:
          -f, --force: skip confirmation prompt
        documentation:
          command: |
            Cancel a running CircleCI workflow.

            Any in-progress jobs will be stopped. Jobs that have already
            completed are not affected.

            Workflow IDs are shown in the output of 'circleci run get'.
      - name: get <workflow-id>
        description: Get workflow details
        group: Targeted commands
        flags:
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
        documentation:
          command: |
            Display the status and jobs of a CircleCI workflow.

            Workflow IDs are shown in the output of 'circleci run get'.

            JSON fields: id, name, phase, outcome, current_outcome, run_id, created_at, ended_at, jobs[].id/name/phase/outcome/current_outcome/type
      - name: list [<run-id>]
        aliases:
          - ls
        description: List workflows for a run or recent runs
        group: General commands
        flags:
          --jq=: Process values from the response using jq syntax
          --json: Output as JSON
          --limit=:
            description: Number of recent runs to show (recent-runs mode)
            default: "10"
          --project=: Project slug (e.g. gh/org/repo); defaults to git remote
          -b, --branch=: Filter by branch (recent-runs mode)
        documentation:
          command: |
            List workflows for a CircleCI run, or for recent runs in the project when
            no run is given.

            JSON fields (single run): id, name, phase, outcome, current_outcome.
            Recent-runs mode adds run_id.
      - name: open <workflow-id>
        description: Open workflow in browser
        group: Targeted commands
      - name: rerun <workflow-id>
        description: Rerun a workflow
        group: Targeted commands
        flags:
          --from-failed: Rerun only failed jobs
          --json: Output as JSON
        documentation:
          command: |
            All jobs rerun from scratch unless --from-failed is given, which reruns
            only the jobs that failed. Either way a new workflow is created, and its
            ID is reported so you can follow the run.

            JSON fields: workflow_id, rerun_from, from_failed
    documentation:
      command: |
        Work with CircleCI workflows.

        Workflows orchestrate jobs within a run. Use these commands to
        inspect workflow status, rerun failed jobs, or cancel a running workflow.

        Workflow IDs are shown in the output of 'circleci run get'.
documentation:
  command: Work with CircleCI from the command line.
