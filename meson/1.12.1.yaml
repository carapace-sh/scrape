        --python.build-config=: 'Config file containing the build details for the target Python installation (default: ).'
        --python.bytecompile=: 'Whether to compile bytecode (default: 0).'
        --python.install-env=: 'Which python environment to install to (default: prefix).'
        --python.platlibdir=: 'Directory for site-specific, platform-specific files (default: ).'
