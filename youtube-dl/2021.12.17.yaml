      documentation:
        flag:
            abort-on-error: Abort downloading of further videos (in the playlist or the command line) if an error occurs
            abort-on-unavailable-fragment: Abort downloading when some fragment is not available
            add-header: Specify a custom HTTP header and its value, separated by a colon ':'. You can use this option multiple times
            add-metadata: Write metadata to the video file
            age-limit: Download only videos suitable for the given age
            all-formats: Download all available video formats
            all-subs: Download all the available subtitles of the video
            ap-list-mso: List all supported multiple-system operators
            ap-mso: Adobe Pass multiple-system operator (TV provider) identifier, use --ap-list-mso for a list of available MSOs
            ap-password: Multiple-system operator account password. If this option is left out, youtube-dl will ask interactively.
            ap-username: Multiple-system operator account login
            audio-format: 'Specify audio format: "best", "aac", "flac", "mp3", "m4a", "opus", "vorbis", or "wav"; "%default" by default; No effect without -x'
            audio-quality: Specify ffmpeg/avconv audio quality, insert a value between 0 (better) and 9 (worse) for VBR or a specific bitrate like 128K (default %default)
            auto-number: SUPPRESSHELP
            autonumber-size: SUPPRESSHELP
            autonumber-start: Specify the start value for %(autonumber)s (default is %default)
            avconv-location: Location of the ffmpeg/avconv binary; either the path to the binary or its containing directory.
            batch-file: File containing URLs to download ('-' for stdin), one URL per line. Lines starting with '#', ';' or ']' are considered as comments and ignored.
            bidi-workaround: Work around terminals that lack bidirectional text support. Requires bidiv or fribidi executable in PATH
            buffer-size: Size of download buffer (e.g. 1024 or 16K) (default is %default)
            cache-dir: Location in the filesystem where youtube-dl can store some downloaded information permanently. By default $XDG_CACHE_HOME/youtube-dl or ~/.cache/youtube-dl . At the moment, only YouTube player files (for videos with obfuscated signatures) are cached, but that may change.
            call-home: Contact the youtube-dl server for debugging
            cn-verification-proxy: SUPPRESSHELP
            config-location: Location of the configuration file; either the path to the config or its containing directory.
            console-title: Display progress in console titlebar
            continue: Force resume of partially downloaded files. By default, youtube-dl will resume downloads if possible.
            convert-subtitles: 'Convert the subtitles to other format (currently supported: srt|ass|vtt|lrc)'
            cookies: File to read cookies from and dump cookie jar in
            date: Download only videos uploaded in this date
            dateafter: Download only videos uploaded on or after this date (i.e. inclusive)
            datebefore: Download only videos uploaded on or before this date (i.e. inclusive)
            default-search: Use this prefix for unqualified URLs. For example "gvsearch2:" downloads two videos from google videos for youtube-dl "large apple". Use the value "auto" to let youtube-dl guess ("auto_warning" to emit a warning when guessing). "error" just throws an error. The default value "fixup_error" repairs broken URLs, but emits an error if this is not possible instead of searching.
            download-archive: Download only videos not listed in the archive file. Record the IDs of all downloaded videos in it.
            dump-headers: Display sent and read HTTP traffic
            dump-intermediate-pages: Print downloaded pages encoded using base64 to debug problems (very verbose)
            dump-json: Simulate, quiet but print JSON information. See the "OUTPUT TEMPLATE" for a description of available keys.
