# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: youtube-dl
flags:
    --abort-on-error: Abort downloading of further videos (in the playlist or the command line) if an error occurs
    --abort-on-unavailable-fragment: Abort downloading when some fragment is not available
    --add-header=: Specify a custom HTTP header and its value, separated by a colon ':'.
    --add-metadata: Write metadata to the video file
    --age-limit=: Download only videos suitable for the given age
    --all-formats: Download all available video formats
    --all-subs: Download all the available subtitles of the video
    --ap-list-mso: List all supported multiple-system operators
    --ap-mso=: Adobe Pass multiple-system operator (TV provider) identifier, use --ap-list-mso for a list of available MSOs
    --ap-password=: Multiple-system operator account password.
    --ap-username=: Multiple-system operator account login
    --audio-format=: 'Specify audio format: "best", "aac", "flac", "mp3", "m4a", "opus", "vorbis", or "wav"; "%default" by default; No effect without -x'
    --audio-quality=: Specify ffmpeg/avconv audio quality, insert a value between 0 (better) and 9 (worse) for VBR or a specific bitrate like 128K (default %default)
    --autonumber-size=: SUPPRESSHELP
    --autonumber-start=: Specify the start value for %(autonumber)s (default is %default)
    --avconv-location=: Location of the ffmpeg/avconv binary; either the path to the binary or its containing directory.
    --bidi-workaround: Work around terminals that lack bidirectional text support.
    --buffer-size=: Size of download buffer (e.g. 1024 or 16K) (default is %default)
    --cache-dir=: Location in the filesystem where youtube-dl can store some downloaded information permanently.
    --cn-verification-proxy=: SUPPRESSHELP
    --config-location=: Location of the configuration file; either the path to the config or its containing directory.
    --console-title: Display progress in console titlebar
    --convert-subtitles=: 'Convert the subtitles to other format (currently supported: srt|ass|vtt|lrc)'
    --cookies=: File to read cookies from and dump cookie jar in
    --date=: Download only videos uploaded in this date
    --dateafter=: Download only videos uploaded on or after this date (i.e. inclusive)
    --datebefore=: Download only videos uploaded on or before this date (i.e. inclusive)
    --default-search=: Use this prefix for unqualified URLs.
    --download-archive=: Download only videos not listed in the archive file.
    --dump-headers: Display sent and read HTTP traffic
    --dump-intermediate-pages: Print downloaded pages encoded using base64 to debug problems (very verbose)
    --dump-user-agent: Display the current browser identification
    --embed-subs: Embed subtitles in the video (only for mp4, webm and mkv videos)
    --embed-thumbnail: Embed thumbnail in the audio as cover art
    --encoding=: Force the specified encoding (experimental)
    --exec=: Execute a command on the file after downloading and post-processing, similar to find's -exec syntax.
    --external-downloader-args=: Give these arguments to the external downloader
    --external-downloader=: Use the specified external downloader.
    --extractor-descriptions: Output descriptions of all supported extractors
    --fixup=: Automatically correct known faults of the file.
    --flat-playlist: Do not extract the videos of a playlist, only list them.
    --force-generic-extractor: Force extraction to use the generic extractor
    --fragment-retries=: Number of retries for a fragment (default is %default), or "infinite" (DASH, hlsnative and ISM)
    --geo-bypass: Bypass geographic restriction via faking X-Forwarded-For HTTP header
    --geo-bypass-country=: Force bypass geographic restriction with explicitly provided two-letter ISO 3166-2 country code
    --geo-bypass-ip-block=: Force bypass geographic restriction with explicitly provided IP block in CIDR notation
    --geo-verification-proxy=: Use this proxy to verify the IP address for some geo-restricted sites.
    --get-description: Simulate, quiet but print video description
    --get-duration: Simulate, quiet but print video length
    --get-filename: Simulate, quiet but print output filename
    --get-format: Simulate, quiet but print output format
    --get-id: Simulate, quiet but print id
    --get-thumbnail: Simulate, quiet but print thumbnail URL
    --hls-prefer-ffmpeg: Use ffmpeg instead of the native HLS downloader
    --hls-prefer-native: Use the native HLS downloader instead of ffmpeg
    --hls-use-mpegts: Use the mpegts container for HLS videos, allowing to play the video while downloading (some players may not be able to play it)
    --http-chunk-size=: Size of a chunk for chunk-based HTTP downloading (e.g. 10485760 or 10M) (default is disabled).
    --id: Use only video ID in file name
    --ignore-config: Do not read configuration files.
    --include-ads: Download advertisements as well (experimental)
    --keep-fragments: Keep downloaded fragments on disk after downloading is finished; fragments are erased by default
    --list-extractors: List all supported extractors
    --list-subs: List all available subtitles for the video
    --list-thumbnails: Simulate and list all available thumbnail formats
    --load-info=: JSON file containing the video information (created with the "--write-info-json" option)
    --mark-watched: Mark videos watched (YouTube only)
    --match-filter=: Generic video filter.
    --match-title=: Download only matching titles (regex or caseless sub-string)
    --max-downloads=: Abort after downloading NUMBER files
    --max-filesize=: Do not download any videos larger than SIZE (e.g. 50k or 44.6m)
    --max-sleep-interval=: Upper bound of a range for randomized sleep before each download (maximum possible number of seconds to sleep).
    --max-views=: Do not download any videos with more than COUNT views
    --merge-output-format=: If a merge is required (e.g. bestvideo+bestaudio), output to given container format.
    --metadata-from-title=: Parse additional metadata like song title / artist from the video title.
    --min-filesize=: Do not download any videos smaller than SIZE (e.g. 50k or 44.6m)
    --min-sleep-interval=: Number of seconds to sleep before each download when used alone or a lower bound of a range for randomized sleep before each download (minimum possible number of seconds to sleep) when used along with --max-sleep-interval.
    --min-views=: Do not download any videos with less than COUNT views
    --newline: Output progress bar as new lines
    --no-cache-dir: Disable filesystem caching
    --no-call-home: Do NOT contact the youtube-dl server for debugging
    --no-check-certificate: Suppress HTTPS certificate validation
    --no-colors: Do not emit color codes in output
    --no-continue: Do not resume partially downloaded files (restart from beginning)
    --no-geo-bypass: Do not bypass geographic restriction via faking X-Forwarded-For HTTP header
    --no-mark-watched: Do not mark videos watched (YouTube only)
    --no-mtime: Do not use the Last-modified header to set the file modification time
    --no-part: Do not use .part files - write directly into output file
    --no-playlist: Download only the video, if the URL refers to a video and a playlist.
    --no-post-overwrites: Do not overwrite post-processed files; the post-processed files are overwritten by default
    --no-progress: Do not print progress bar
    --no-resize-buffer: Do not automatically adjust the buffer size.
    --no-warnings: Ignore warnings
    --output-na-placeholder=: Placeholder value for unavailable meta fields in output filename template (default is "%default")
    --playlist-end=: Playlist video to end at (default is last)
    --playlist-items=: Playlist video items to download.
    --playlist-random: Download playlist videos in random order
    --playlist-reverse: Download playlist videos in reverse order
    --playlist-start=: Playlist video to start at (default is %default)
    --postprocessor-args=: Give these arguments to the postprocessor
    --prefer-avconv: Prefer avconv over ffmpeg for running the postprocessors
    --prefer-ffmpeg: Prefer ffmpeg over avconv for running the postprocessors (default)
    --prefer-free-formats: Prefer free video formats unless a specific one is requested
    --prefer-unsecure: Use an unencrypted connection to retrieve information about the video.
    --print-json: Be quiet and print the video information as JSON (video is still being downloaded).
    --proxy=: Use the specified HTTP/HTTPS/SOCKS proxy.
    --recode-video=: 'Encode the video to another format if necessary (currently supported: mp4|flv|ogg|webm|mkv|avi)'
    --referer=: Specify a custom referer, use if the video access is restricted to one domain
    --reject-title=: Skip download for matching titles (regex or caseless sub-string)
    --restrict-filenames: Restrict filenames to only ASCII characters, and avoid "&" and spaces in filenames
    --rm-cache-dir: Delete all filesystem cache files
    --skip-download: Do not download the video
    --skip-unavailable-fragments: Skip unavailable fragments (DASH, hlsnative and ISM)
    --socket-timeout=: Time to wait before giving up, in seconds
    --source-address=: Client-side IP address to bind to
    --srt-lang=: Languages of the subtitles to download (optional) separated by commas, use --list-subs for available language tags
    --sub-format=: 'Subtitle format, accepts formats preference, for example: "srt" or "ass/srt/best"'
    --test: SUPPRESSHELP
    --user-agent=: Specify a custom user agent
    --video-password=: Video password (vimeo, youku)
    --write-all-thumbnails: Write all thumbnail image formats to disk
    --write-annotations: Write video annotations to a .annotations.xml file
    --write-automatic-sub: Write automatically generated subtitle file (YouTube only)
    --write-description: Write video description to a .description file
    --write-info-json: Write video metadata to a .info.json file
    --write-pages: Write downloaded intermediary pages to files in the current directory to debug problems
    --write-srt: Write subtitle file
    --write-thumbnail: Write thumbnail image to disk
    --xattr-set-filesize: Set file xattribute ytdl.filesize with expected file size
    --xattrs: Write metadata to the video file's xattrs (using dublin core and xdg standards)
    --yes-playlist: Download the playlist, if the URL refers to a video and a playlist.
    --youtube-include-dash-manifest: SUPPRESSHELP
    --youtube-print-sig-code: SUPPRESSHELP
    --youtube-skip-dash-manifest: Do not download the DASH manifests and related data on YouTube videos
    -2, --twofactor=: Two-factor authentication code
    -4, --force-ipv4: Make all connections via IPv4
    -6, --force-ipv6: Make all connections via IPv6
    -A, --auto-number: SUPPRESSHELP
    -C, --call-home: Contact the youtube-dl server for debugging
    -F, --list-formats: List all available formats of requested videos
    -J, --dump-single-json: Simulate, quiet but print JSON information for each command-line argument.
    -R, --retries=: Number of retries (default is %default), or "infinite".
    -U, --update: Update this program to latest version.
    -a, --batch-file=: File containing URLs to download ('-' for stdin), one URL per line.
    -c, --continue: Force resume of partially downloaded files.
    -e, --get-title: Simulate, quiet but print title
    -f, --format=: Video format code, see the "FORMAT SELECTION" for all the info
    -g, --get-url: Simulate, quiet but print URL
    -i, --ignore-errors: Continue on download errors, for example to skip unavailable videos in a playlist
    -j, --dump-json: Simulate, quiet but print JSON information.
    -k, --keep-video: Keep the video file on disk after the post-processing; the video is erased by default
    -l, --literal: SUPPRESSHELP
    -n, --netrc: Use .netrc authentication data
    -o, --output=: Output filename template, see the "OUTPUT TEMPLATE" for all the info
    -p, --password=: Account password.
    -q, --quiet: Activate quiet mode
    -r, --rate-limit=: Maximum download rate in bytes per second (e.g. 50K or 4.2M)
    -s, --simulate: Do not download the video and do not write anything to disk
    -t, --title: SUPPRESSHELP
    -u, --username=: Login with this account ID
    -v, --verbose: Print various debugging information
    -w, --no-overwrites: Do not overwrite files
    -x, --extract-audio: Convert video files to audio-only files (requires ffmpeg/avconv and ffprobe/avprobe)
