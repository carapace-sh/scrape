      --cert-file=: identify HTTPS client using this SSL certificate file
      --create-namespace: create the release namespace if not present
      --dependency-update: update dependencies if they are missing before installing the chart
      --description=: add a custom description
      --devel: use development versions, too. Equivalent to version '>0.0.0-0'. If --version is set, this is ignored
      --disable-openapi-validation: if set, the installation process will not validate rendered templates against the Kubernetes OpenAPI Schema
      --dry-run?:
        description: 'simulates the operation either client-side or server-side. Must be either: "client", or "server". ''--dry-run=client simulates the operation client-side only and avoids cluster connections. ''--dry-run=server'' simulates/validates the operation on the server, requiring cluster connectivity.'
        default: client
      --enable-dns: enable DNS lookups when rendering templates
      --force&: deprecated
      --force-conflicts: if set server-side apply will force changes against conflicts
      --force-replace: force resource updates by replacement
      --hide-notes&: if set, do not show notes in install output. Does not affect presence in chart metadata
      --include-crds: include CRDs in the templated output
      --insecure-skip-tls-verify: skip tls certificate checks for the chart download
      --is-upgrade: set .Release.IsUpgrade instead of .Release.IsInstall
      --key-file=: identify HTTPS client using this SSL key file
      --keyring=:
        description: location of public keys used for verification
        default: /root/.gnupg/pubring.gpg
      --kube-version=: Kubernetes version used for Capabilities.KubeVersion
      --name-template=: specify template used to name the release
      --no-hooks: prevent hooks from running during install
      --output-dir=: writes the executed templates to files in output-dir instead of stdout
      --pass-credentials: pass credentials to all domains
      --password=: chart repository password where to locate the requested chart
      --plain-http: use insecure HTTP connections for the chart download
      --post-renderer-args=*:
        description: an argument to the post-renderer (can specify multiple)
        default: '[]'
      --post-renderer=: the name of a postrenderer type plugin to be used for post rendering. If it exists, the plugin will be used
      --release-name: use release name in the output-dir path.
      --render-subchart-notes&: if set, render subchart notes along with the parent
      --replace: reuse the given name, only if that name is a deleted release which remains in the history. This is unsafe in production
      --repo=: chart repository url where to locate the requested chart
      --rollback-on-failure: if set, Helm will rollback (uninstall) the installation upon failure. The --wait flag will be default to "watcher" if --rollback-on-failure is set
      --server-side:
        description: object updates run in the server instead of the client
        default: "true"
      --set-file=*: 'set values from respective files specified via the command line (can specify multiple or separate values with commas: key1=path1,key2=path2)'
      --set-json=*: 'set JSON values on the command line (can specify multiple or separate values with commas: key1=jsonval1,key2=jsonval2 or using json format: {"key1": jsonval1, "key2": "jsonval2"})'
      --set-literal=*: set a literal STRING value on the command line
      --set-string=*: 'set STRING values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --set=*: 'set values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --skip-crds: if set, no CRDs will be installed. By default, CRDs are installed if not already present
      --skip-schema-validation: if set, disables JSON schema validation
      --skip-tests: skip tests from templated output
      --take-ownership: if set, install will ignore the check for helm annotations and take ownership of the existing resources
      --timeout=:
        description: time to wait for any individual Kubernetes operation (like Jobs for hooks)
        default: 5m0s
      --username=: chart repository username where to locate the requested chart
      --validate&: deprecated
      --verify: verify the package before using it
      --version=: specify a version constraint for the chart version to use. This constraint can be a specific tag (e.g. 1.1.1) or it may reference a valid range (e.g. ^2.0.0). If this is not specified, the latest version is used
      --wait-for-jobs: if set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful. It will wait for as long as --timeout
      --wait?:
        description: 'wait until resources are ready (up to --timeout). Use ''--wait'' alone for ''watcher'' strategy, or specify one of: ''watcher'', ''hookOnly'', ''legacy''. Default when flag is omitted: ''hookOnly''.'
        default: hookOnly
      -a, --api-versions=*: Kubernetes api versions used for Capabilities.APIVersions (multiple can be specified)
      -f, --values=*: specify values in a YAML file or a URL (can specify multiple)
      -g, --generate-name: generate the name (and omit the NAME parameter)
      -l, --labels=: Labels that would be added to release metadata. Should be divided by comma.
      -s, --show-only=*: only show manifests rendered from the given templates
    exclusiveflags:
      - - dry-run
        - validate
      - - force
        - force-conflicts
      - - force-conflicts
        - force-replace
    documentation:
      command: |2
        Render chart templates locally and display the output.

        Any values that would normally be looked up or retrieved in-cluster will be
        faked locally. Additionally, none of the server-side testing of chart validity
        (e.g. whether an API is supported) is done.

        To specify the Kubernetes API versions used for Capabilities.APIVersions, use
        the '--api-versions' flag. This flag can be specified multiple times or as a
        comma-separated list:

            $ helm template --api-versions networking.k8s.io/v1 --api-versions cert-manager.io/v1 mychart ./mychart

        or

            $ helm template --api-versions networking.k8s.io/v1,cert-manager.io/v1 mychart ./mychart
  - name: test [RELEASE]
    description: run tests for a release
    flags:
      --filter=*: 'specify tests by attribute (currently "name") using attribute=value syntax or ''!attribute=value'' to exclude a test (can specify multiple or separate values with commas: name=test1,name=test2)'
      --logs: dump the logs from test pods (this runs after all tests are complete, but before any cleanup)
      --timeout=:
        description: time to wait for any individual Kubernetes operation (like Jobs for hooks)
        default: 5m0s
    documentation:
      command: |2
        The test command runs the tests for a release.

        The argument this command takes is the name of a deployed release.
        The tests to be run are defined in the chart that was installed.
  - name: uninstall RELEASE_NAME [...]
    aliases:
      - del
      - delete
      - un
    description: uninstall a release
    flags:
      --cascade=:
        description: Must be "background", "orphan", or "foreground". Selects the deletion cascading strategy for the dependents. Defaults to background. Use "foreground" with --wait to ensure resources with finalizers are fully deleted before returning.
        default: background
      --description=: add a custom description
      --dry-run: simulate a uninstall
      --ignore-not-found: Treat "release not found" as a successful uninstall
      --keep-history: remove all associated resources and mark the release as deleted, but retain the release history
      --no-hooks: prevent hooks from running during uninstallation
      --timeout=:
        description: time to wait for any individual Kubernetes operation (like Jobs for hooks)
        default: 5m0s
      --wait?:
        description: 'wait until resources are ready (up to --timeout). Use ''--wait'' alone for ''watcher'' strategy, or specify one of: ''watcher'', ''hookOnly'', ''legacy''. Default when flag is omitted: ''hookOnly''.'
        default: hookOnly
    documentation:
      command: |2
        This command takes a release name and uninstalls the release.

        It removes all of the resources associated with the last release of the chart
        as well as the release history, freeing it up for future use.

        Use the '--dry-run' flag to see which releases will be uninstalled without actually
        uninstalling them.

        Use '--cascade foreground' with '--wait' to ensure resources with finalizers
        are fully deleted before the command returns.
  - name: upgrade [RELEASE] [CHART]
    description: upgrade a release
    flags:
      --atomic&: deprecated
      --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
      --cert-file=: identify HTTPS client using this SSL certificate file
      --cleanup-on-fail: allow deletion of new resources created in this upgrade when upgrade fails
      --create-namespace: if --install is set, create the release namespace if not present
      --dependency-update: update dependencies if they are missing before installing the chart
      --description=: add a custom description
      --devel: use development versions, too. Equivalent to version '>0.0.0-0'. If --version is set, this is ignored
      --disable-openapi-validation: if set, the upgrade process will not validate rendered templates against the Kubernetes OpenAPI Schema
      --dry-run?:
        description: 'simulates the operation without persisting changes. Must be one of: "none" (default), "client", or "server". ''--dry-run=none'' executes the operation normally and persists changes (no simulation). ''--dry-run=client'' simulates the operation client-side only and avoids cluster connections. ''--dry-run=server'' simulates the operation on the server, requiring cluster connectivity.'
        default: none
      --enable-dns: enable DNS lookups when rendering templates
      --force&: deprecated
      --force-conflicts: if set server-side apply will force changes against conflicts
      --force-replace: force resource updates by replacement
      --hide-notes: if set, do not show notes in upgrade output. Does not affect presence in chart metadata
      --hide-secret: hide Kubernetes Secrets when also using the --dry-run flag
      --history-max=:
        description: limit the maximum number of revisions saved per release. Use 0 for no limit
        default: "10"
      --insecure-skip-tls-verify: skip tls certificate checks for the chart download
      --key-file=: identify HTTPS client using this SSL key file
      --keyring=:
        description: location of public keys used for verification
        default: /root/.gnupg/pubring.gpg
      --no-hooks: disable pre/post upgrade hooks
      --pass-credentials: pass credentials to all domains
      --password=: chart repository password where to locate the requested chart
      --plain-http: use insecure HTTP connections for the chart download
      --post-renderer-args=*:
        description: an argument to the post-renderer (can specify multiple)
        default: '[]'
      --post-renderer=: the name of a postrenderer type plugin to be used for post rendering. If it exists, the plugin will be used
      --render-subchart-notes: if set, render subchart notes along with the parent
      --repo=: chart repository url where to locate the requested chart
      --reset-then-reuse-values: when upgrading, reset the values to the ones built into the chart, apply the last release's values and merge in any overrides from the command line via --set and -f. If '--reset-values' or '--reuse-values' is specified, this is ignored
      --reset-values: when upgrading, reset the values to the ones built into the chart
      --reuse-values: when upgrading, reuse the last release's values and merge in any overrides from the command line via --set and -f. If '--reset-values' is specified, this is ignored
      --rollback-on-failure: if set, Helm will rollback the upgrade to previous success release upon failure. The --wait flag will be defaulted to "watcher" if --rollback-on-failure is set
      --server-side=:
        description: must be "true", "false" or "auto". Object updates run in the server instead of the client ("auto" defaults the value from the previous chart release's method)
        default: auto
      --set-file=*: 'set values from respective files specified via the command line (can specify multiple or separate values with commas: key1=path1,key2=path2)'
      --set-json=*: 'set JSON values on the command line (can specify multiple or separate values with commas: key1=jsonval1,key2=jsonval2 or using json format: {"key1": jsonval1, "key2": "jsonval2"})'
      --set-literal=*: set a literal STRING value on the command line
      --set-string=*: 'set STRING values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --set=*: 'set values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --skip-crds: if set, no CRDs will be installed when an upgrade is performed with install flag enabled. By default, CRDs are installed if not already present, when an upgrade is performed with install flag enabled
      --skip-schema-validation: if set, disables JSON schema validation
      --take-ownership: if set, upgrade will ignore the check for helm annotations and take ownership of the existing resources
      --timeout=:
        description: time to wait for any individual Kubernetes operation (like Jobs for hooks)
        default: 5m0s
      --username=: chart repository username where to locate the requested chart
      --verify: verify the package before using it
      --version=: specify a version constraint for the chart version to use. This constraint can be a specific tag (e.g. 1.1.1) or it may reference a valid range (e.g. ^2.0.0). If this is not specified, the latest version is used
      --wait-for-jobs: if set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful. It will wait for as long as --timeout
      --wait?:
        description: 'wait until resources are ready (up to --timeout). Use ''--wait'' alone for ''watcher'' strategy, or specify one of: ''watcher'', ''hookOnly'', ''legacy''. Default when flag is omitted: ''hookOnly''.'
        default: hookOnly
      -f, --values=*: specify values in a YAML file or a URL (can specify multiple)
      -i, --install: if a release by this name doesn't already exist, run an install
      -l, --labels=: Labels that would be added to release metadata. Should be separated by comma. Original release labels will be merged with upgrade labels. You can unset label using null.
      -o, --output=:
        description: 'prints the output in the specified format. Allowed values: table, json, yaml'
        default: table
    exclusiveflags:
      - - force
        - force-conflicts
      - - force-conflicts
        - force-replace
    documentation:
      command: |2
        This command upgrades a release to a new version of a chart.

        The upgrade arguments must be a release and chart. The chart
        argument can be either: a chart reference('example/mariadb'), a path to a chart directory,
        a packaged chart, or a fully qualified URL. For chart references, the latest
        version will be specified unless the '--version' flag is set.

        To override values in a chart, use either the '--values' flag and pass in a file
        or use the '--set' flag and pass configuration from the command line, to force string
        values, use '--set-string'. You can use '--set-file' to set individual
        values from a file when the value itself is too long for the command line
        or is dynamically generated. You can also use '--set-json' to set json values
        (scalars/objects/arrays) from the command line. Additionally, you can use '--set-json' and passing json object as a string.

        You can specify the '--values'/'-f' flag multiple times. The priority will be given to the
        last (right-most) file specified. For example, if both myvalues.yaml and override.yaml
        contained a key called 'Test', the value set in override.yaml would take precedence:

            $ helm upgrade -f myvalues.yaml -f override.yaml redis ./redis

        You can specify the '--set' flag multiple times. The priority will be given to the
        last (right-most) set specified. For example, if both 'bar' and 'newbar' values are
        set for a key called 'foo', the 'newbar' value would take precedence:

            $ helm upgrade --set foo=bar --set foo=newbar redis ./redis

        You can update the values for an existing release with this command as well via the
        '--reuse-values' flag. The 'RELEASE' and 'CHART' arguments should be set to the original
        parameters, and existing values will be merged with any values set via '--values'/'-f'
        or '--set' flags. Priority is given to new values.

            $ helm upgrade --reuse-values --set foo=bar --set foo=newbar redis ./redis

        The --dry-run flag will output all generated chart manifests, including Secrets
        which can contain sensitive values. To hide Kubernetes Secrets use the
        --hide-secret flag. Please carefully consider how and when these flags are used.
  - name: verify PATH
    description: verify that a chart at the given path has been signed and is valid
    flags:
      --keyring=:
        description: keyring containing public keys
        default: /root/.gnupg/pubring.gpg
    documentation:
      command: |2
        Verify that the given chart has a valid provenance file.

        Provenance files provide cryptographic verification that a chart has not been
        tampered with, and was packaged by a trusted provider.

        This command can be used to verify a local chart. Several other commands provide
        '--verify' flags that run the same validation. To generate a signed package, use
        the 'helm package --sign' command.
  - name: version
    description: print the helm version information
    flags:
      --short: print the version number
      --template=: template for version string format
    documentation:
      command: |2
        Show the version for Helm.

        This will print a representation of the version of Helm.
        The output will look something like this:

        version.BuildInfo{Version:"v3.2.1", GitCommit:"fe51cd1e31e6a202cba7dead9552a6d418ded79a", GitTreeState:"clean", GoVersion:"go1.13.10"}

        - Version is the semantic version of the release.
        - GitCommit is the SHA for the commit that this version was built from.
        - GitTreeState is "clean" if there are no local code changes when this binary was
          built, and "dirty" if the binary was built from locally modified code.
        - GoVersion is the version of Go that was used to compile Helm.

        When using the --template flag the following properties are available to use in
        the template:

        - .Version contains the semantic version of Helm
        - .GitCommit is the git commit
        - .GitTreeState is the state of the git tree when Helm was built
        - .GoVersion contains the version of Go that Helm was compiled with

        For example, --template='Version: {{.Version}}' outputs 'Version: v3.2.1'.
documentation:
  command: |
    The Kubernetes package manager

    Common actions for Helm:

    - helm search:    search for charts
    - helm pull:      download a chart to your local directory to view
    - helm install:   upload the chart to Kubernetes
    - helm list:      list releases of charts

    Environment variables:

    | Name                               | Description                                                                                                |
    |------------------------------------|------------------------------------------------------------------------------------------------------------|
    | $HELM_CACHE_HOME                   | set an alternative location for storing cached files.                                                      |
    | $HELM_CONFIG_HOME                  | set an alternative location for storing Helm configuration.                                                |
    | $HELM_DATA_HOME                    | set an alternative location for storing Helm data.                                                         |
    | $HELM_DEBUG                        | indicate whether or not Helm is running in Debug mode                                                      |
    | $HELM_DRIVER                       | set the backend storage driver. Values are: configmap, secret, memory, sql.                                |
    | $HELM_DRIVER_SQL_CONNECTION_STRING | set the connection string the SQL storage driver should use.                                               |
    | $HELM_MAX_HISTORY                  | set the maximum number of helm release history.                                                            |
    | $HELM_NAMESPACE                    | set the namespace used for the helm operations.                                                            |
    | $HELM_NO_PLUGINS                   | disable plugins. Set HELM_NO_PLUGINS=1 to disable plugins.                                                 |
    | $HELM_PLUGINS                      | set the path to the plugins directory                                                                      |
    | $HELM_REGISTRY_CONFIG              | set the path to the registry config file.                                                                  |
    | $HELM_REPOSITORY_CACHE             | set the path to the repository cache directory                                                             |
    | $HELM_REPOSITORY_CONFIG            | set the path to the repositories file.                                                                     |
    | $KUBECONFIG                        | set an alternative Kubernetes configuration file (default "~/.kube/config")                                |
    | $HELM_KUBEAPISERVER                | set the Kubernetes API Server Endpoint for authentication                                                  |
    | $HELM_KUBECAFILE                   | set the Kubernetes certificate authority file.                                                             |
    | $HELM_KUBEASGROUPS                 | set the Groups to use for impersonation using a comma-separated list.                                      |
    | $HELM_KUBEASUSER                   | set the Username to impersonate for the operation.                                                         |
    | $HELM_KUBECONTEXT                  | set the name of the kubeconfig context.                                                                    |
    | $HELM_KUBETOKEN                    | set the Bearer KubeToken used for authentication.                                                          |
    | $HELM_KUBEINSECURE_SKIP_TLS_VERIFY | indicate if the Kubernetes API server's certificate validation should be skipped (insecure)                |
    | $HELM_KUBETLS_SERVER_NAME          | set the server name used to validate the Kubernetes API server certificate                                 |
    | $HELM_BURST_LIMIT                  | set the default burst limit in the case the server contains many CRDs (default 100, -1 to disable)         |
    | $HELM_QPS                          | set the Queries Per Second in cases where a high number of calls exceed the option for higher burst values |
    | $HELM_COLOR                        | set color output mode. Allowed values: never, always, auto (default: never)                                |
    | $NO_COLOR                          | set to any non-empty value to disable all colored output (overrides $HELM_COLOR)                           |
    | $SOURCE_DATE_EPOCH                 | set a Unix timestamp for reproducible chart archives                                                       |

    Helm stores cache, configuration, and data based on the following configuration order:

    - If a HELM_*_HOME environment variable is set, it will be used
    - Otherwise, on systems supporting the XDG base directory specification, the XDG variables will be used
    - When no other location is set a default location will be used based on the operating system

    By default, the default directories depend on the Operating System. The defaults are listed below:

    | Operating System | Cache Path                | Configuration Path             | Data Path               |
    |------------------|---------------------------|--------------------------------|-------------------------|
    | Linux            | $HOME/.cache/helm         | $HOME/.config/helm             | $HOME/.local/share/helm |
    | macOS            | $HOME/Library/Caches/helm | $HOME/Library/Preferences/helm | $HOME/Library/helm      |
    | Windows          | %TEMP%\helm               | %APPDATA%\helm                 | %APPDATA%\helm          |
