  - name: status RELEASE_NAME
    description: display the status of the named release
    flags:
      --revision=: if set, display the status of the named release with revision
      -o, --output=:
        description: 'prints the output in the specified format. Allowed values: table, json, yaml'
        default: table
    documentation:
      command: |2
        This command shows the status of a named release.
        The status consists of:
        - last deployment time
        - k8s namespace in which the release lives
        - state of the release (can be: unknown, deployed, uninstalled, superseded, failed, uninstalling, pending-install, pending-upgrade or pending-rollback)
        - revision of the release
        - description of the release (can be completion message or error message)
        - list of resources that this release consists of
        - details on last test suite run, if applicable
        - additional notes provided by the chart
