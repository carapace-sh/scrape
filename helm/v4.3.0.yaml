# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: helm
description: The Helm package manager for Kubernetes.
persistentflags:
  --add-dir-header&: If true, adds the file directory to the header of the log messages
  --alsologtostderr&: log to standard error as well as files (no effect when -logtostderr=true)
  --alsologtostderrthreshold=&:
    description: logs at or above this threshold go to stderr when -alsologtostderr=true (no effect when -logtostderr=true)
    default: "0"
  --burst-limit=:
    description: client-side default throttling limit
    default: "100"
  --color=:
    description: use colored output (never, auto, always)
    default: auto
  --colour=:
    description: use colored output (never, auto, always)
    default: auto
  --content-cache=:
    description: path to the directory containing cached content (e.g. charts)
    default: /root/.cache/helm/content
  --debug: enable verbose output
  --kube-apiserver=: the address and the port for the Kubernetes API server
  --kube-as-group=*: group to impersonate for the operation, this flag can be repeated to specify multiple groups.
  --kube-as-user=: username to impersonate for the operation
  --kube-ca-file=: the certificate authority file for the Kubernetes API server connection
  --kube-context=: name of the kubeconfig context to use
  --kube-insecure-skip-tls-verify: if true, the Kubernetes API server's certificate will not be checked for validity. This will make your HTTPS connections insecure
  --kube-tls-server-name=: server name to use for Kubernetes API server certificate validation. If it is not provided, the hostname used to contact the server is used
  --kube-token=: bearer token used for authentication
  --kubeconfig=: path to the kubeconfig file
  --legacy-stderr-threshold-behavior&:
    description: If true, stderrthreshold is ignored when logtostderr=true (legacy behavior). If false, stderrthreshold is honored even when logtostderr=true
    default: "true"
  --log-backtrace-at=&:
    description: when logging hits line file:N, emit a stack trace
    default: :0
  --log-dir=&: If non-empty, write log files in this directory (no effect when -logtostderr=true)
  --log-file-max-size=&:
    description: Defines the maximum size a log file can grow to (no effect when -logtostderr=true). Unit is megabytes. If the value is 0, the maximum file size is unlimited.
    default: "1800"
  --log-file=&: If non-empty, use this log file (no effect when -logtostderr=true)
  --logtostderr&:
    description: log to standard error instead of files
    default: "true"
  --one-output&: If true, only write logs to their native severity level (vs also writing to each lower severity level; no effect when -logtostderr=true)
  --qps=: queries per second used when communicating with the Kubernetes API, not including bursting
  --registry-config=:
    description: path to the registry config file
    default: /root/.config/helm/registry/config.json
  --repository-cache=:
    description: path to the directory containing cached repository indexes
    default: /root/.cache/helm/repository
  --repository-config=:
    description: path to the file containing repository names and URLs
    default: /root/.config/helm/repositories.yaml
  --skip-headers&: If true, avoid header prefixes in the log messages
  --skip-log-headers&: If true, avoid headers when opening log files (no effect when -logtostderr=true)
  --stderrthreshold=&:
    description: logs at or above this threshold go to stderr when writing to files and stderr (no effect when -logtostderr=true or -alsologtostderr=true unless -legacy_stderr_threshold_behavior=false)
    default: "2"
  --vmodule=&: comma-separated list of pattern=N settings for file-filtered logging
  -n, --namespace=: namespace scope for this request
  -v, --v=&:
    description: number for the log level verbosity
    default: "0"
commands:
  - name: completion
    description: generate autocompletion scripts for the specified shell
    commands:
      - name: bash
        description: generate autocompletion script for bash
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |2
            Generate the autocompletion script for Helm for the bash shell.

            To load completions in your current shell session:

                source <(helm completion bash)

            To load completions for every new session, execute once:
            - Linux:

                  helm completion bash > /etc/bash_completion.d/helm

            - MacOS:

                  helm completion bash > /usr/local/etc/bash_completion.d/helm
      - name: fish
        description: generate autocompletion script for fish
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |2
            Generate the autocompletion script for Helm for the fish shell.

            To load completions in your current shell session:

                helm completion fish | source

            To load completions for every new session, execute once:

                helm completion fish > ~/.config/fish/completions/helm.fish

            You will need to start a new shell for this setup to take effect.
      - name: powershell
        description: generate autocompletion script for powershell
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |2
            Generate the autocompletion script for powershell.

            To load completions in your current shell session:
            PS C:\> helm completion powershell | Out-String | Invoke-Expression

            To load completions for every new session, add the output of the above command
            to your powershell profile.
      - name: zsh
        description: generate autocompletion script for zsh
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |2
            Generate the autocompletion script for Helm for the zsh shell.

            To load completions in your current shell session:

                source <(helm completion zsh)

            To load completions for every new session, execute once:

                helm completion zsh > "${fpath[1]}/_helm"
    documentation:
      command: |2
        Generate autocompletion scripts for Helm for the specified shell.
  - name: create NAME
    description: create a new chart with the given name
    flags:
      --chart-api-version=&:
        description: chart API version to use (v2 or v3)
        default: v2
      -p, --starter=: the name or absolute path to Helm starter scaffold
    documentation:
      command: |2
        This command creates a chart directory along with the common files and
        directories used in a chart.

        For example, 'helm create foo' will create a directory structure that looks
        something like this:

            foo/
            ├── .helmignore   # Contains patterns to ignore when packaging Helm charts.
            ├── Chart.yaml    # Information about your chart
            ├── values.yaml   # The default values for your templates
            ├── charts/       # Charts that this chart depends on
            └── templates/    # The template files
                └── tests/    # The test files

        'helm create' takes a path for an argument. If directories in the given path
        do not exist, Helm will attempt to create them as it goes. If the given
        destination exists and there are files in that directory, conflicting files
        will be overwritten, but other files will be left alone.
  - name: dependency update|build|list
    aliases:
      - dep
      - dependencies
    description: manage a chart's dependencies
    commands:
      - name: build CHART
        description: rebuild the charts/ directory based on the Chart.lock file
        flags:
          --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
          --cert-file=: identify HTTPS client using this SSL certificate file
          --insecure-skip-tls-verify: skip tls certificate checks for the chart download
          --key-file=: identify HTTPS client using this SSL key file
          --keyring=:
            description: keyring containing public keys
            default: /root/.gnupg/pubring.gpg
          --password=: chart repository password where to locate the requested chart
          --plain-http: use insecure HTTP connections for the chart download
          --skip-refresh: do not refresh the local repository cache
          --username=: chart repository username where to locate the requested chart
          --verify: verify the packages against signatures
        documentation:
          command: |2
            Build out the charts/ directory from the Chart.lock file.

            Build is used to reconstruct a chart's dependencies to the state specified in
            the lock file. This will not re-negotiate dependencies, as 'helm dependency update'
            does.

            If no lock file is found, 'helm dependency build' will mirror the behavior
            of 'helm dependency update'.
      - name: list CHART
        aliases:
          - ls
        description: list the dependencies for the given chart
        flags:
          --max-col-width=:
            description: maximum column width for output table
            default: "80"
        documentation:
          command: |2
            List all of the dependencies declared in a chart.

            This can take chart archives and chart directories as input. It will not alter
            the contents of a chart.

            This will produce an error if the chart cannot be loaded.
      - name: update CHART
        aliases:
          - up
        description: update charts/ based on the contents of Chart.yaml
        flags:
          --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
          --cert-file=: identify HTTPS client using this SSL certificate file
          --insecure-skip-tls-verify: skip tls certificate checks for the chart download
          --key-file=: identify HTTPS client using this SSL key file
          --keyring=:
            description: keyring containing public keys
            default: /root/.gnupg/pubring.gpg
          --password=: chart repository password where to locate the requested chart
          --plain-http: use insecure HTTP connections for the chart download
          --skip-refresh: do not refresh the local repository cache
          --username=: chart repository username where to locate the requested chart
          --verify: verify the packages against signatures
        documentation:
          command: |2
            Update the on-disk dependencies to mirror Chart.yaml.

            This command verifies that the required charts, as expressed in 'Chart.yaml',
            are present in 'charts/' and are at an acceptable version. It will pull down
            the latest charts that satisfy the dependencies, and clean up old dependencies.

            On successful update, this will generate a lock file that can be used to
            rebuild the dependencies to an exact version.

            Dependencies are not required to be represented in 'Chart.yaml'. For that
            reason, an update command will not remove charts unless they are (a) present
            in the Chart.yaml file, but (b) at the wrong version.
    documentation:
      command: |2
        Manage the dependencies of a chart.

        Helm charts store their dependencies in 'charts/'. For chart developers, it is
        often easier to manage dependencies in 'Chart.yaml' which declares all
        dependencies.

        The dependency commands operate on that file, making it easy to synchronize
        between the desired dependencies and the actual dependencies stored in the
        'charts/' directory.

        For example, this Chart.yaml declares two dependencies:

            # Chart.yaml
            dependencies:
            - name: nginx
              version: "1.2.3"
              repository: "https://example.com/charts"
            - name: memcached
              version: "3.2.1"
              repository: "https://another.example.com/charts"


        The 'name' should be the name of a chart, where that name must match the name
        in that chart's 'Chart.yaml' file.

        The 'version' field should contain a semantic version or version range.

        The 'repository' URL should point to a Chart Repository. Helm expects that by
        appending '/index.yaml' to the URL, it should be able to retrieve the chart
        repository's index. Note: 'repository' can be an alias. The alias must start
        with 'alias:' or '@'.

        Starting from 2.2.0, repository can be defined as the path to the directory of
        the dependency charts stored locally. The path should start with a prefix of
        "file://". For example,

            # Chart.yaml
            dependencies:
            - name: nginx
              version: "1.2.3"
              repository: "file://../dependency_chart/nginx"

        If the dependency chart is retrieved locally, it is not required to have the
        repository added to helm by "helm add repo". Version matching is also supported
        for this case.
  - name: docs
    description: generate documentation as markdown or man pages
    hidden: true
    flags:
      --dir=:
        description: directory to which documentation is written
        default: ./
      --generate-headers: generate standard headers for markdown files
      --type=:
        description: the type of documentation to generate (markdown, man, bash)
        default: markdown
    documentation:
      command: |2
        Generate documentation files for Helm.

        This command can generate documentation for Helm in the following formats:

        - Markdown
        - Man pages

        It can also generate bash autocompletions.
  - name: env
    description: helm client environment information
    documentation:
      command: |2
        Env prints out all the environment information in use by Helm.
  - name: get
    description: download extended information of a named release
    commands:
      - name: all RELEASE_NAME
        description: download all information for a named release
        flags:
          --revision=: get the named release with revision
          --template=: 'go template for formatting the output, eg: {{.Release.Name}}'
        documentation:
          command: |2
            This command prints a human readable collection of information about the
            notes, hooks, supplied values, and generated manifest file of the given release.
      - name: hooks RELEASE_NAME
        description: download all hooks for a named release
        flags:
          --revision=: get the named release with revision
        documentation:
          command: |2
            This command downloads hooks for a given release.

            Hooks are formatted in YAML and separated by the YAML '---\n' separator.
      - name: manifest RELEASE_NAME
        description: download the manifest for a named release
        flags:
          --revision=: get the named release with revision
        documentation:
          command: |2
            This command fetches the generated manifest for a given release.

            A manifest is a YAML-encoded representation of the Kubernetes resources that
            were generated from this release's chart(s). If a chart is dependent on other
            charts, those resources will also be included in the manifest.
      - name: metadata RELEASE_NAME
        description: This command fetches metadata for a given release
        flags:
          --revision=: specify release revision
          -o, --output=:
            description: 'prints the output in the specified format. Allowed values: table, json, yaml'
            default: table
      - name: notes RELEASE_NAME
        description: download the notes for a named release
        flags:
          --revision=: get the named release with revision
        documentation:
          command: |2
            This command shows notes provided by the chart of a named release.
      - name: values RELEASE_NAME
        description: download the values file for a named release
        flags:
          --revision=: get the named release with revision
          -a, --all: dump all (computed) values
          -o, --output=:
            description: 'prints the output in the specified format. Allowed values: table, json, yaml'
            default: table
        documentation:
          command: |2
            This command downloads a values file for a given release.
    documentation:
      command: |2
        This command consists of multiple subcommands which can be used to
        get extended information about the release, including:

        - The values used to generate the release
        - The generated manifest file
        - The notes provided by the chart of the release
        - The hooks associated with the release
        - The metadata of the release
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type helm help [path to command] for full details.
  - name: history RELEASE_NAME
    aliases:
      - hist
    description: fetch release history
    flags:
      --max=:
        description: maximum number of revision to include in history
        default: "256"
      --show-rollback-revision: show the rollback revision column in table output
      -o, --output=:
        description: 'prints the output in the specified format. Allowed values: table, json, yaml'
        default: table
    documentation:
      command: |2
        History prints historical revisions for a given release.

        A default maximum of 256 revisions will be returned. Setting '--max'
        configures the maximum length of the revision list returned.

        The historical release set is printed as a formatted table, e.g:

            $ helm history angry-bird
            REVISION    UPDATED                     STATUS          CHART             APP VERSION     DESCRIPTION
            1           Mon Oct 3 10:15:13 2016     superseded      alpine-0.1.0      1.0             Initial install
            2           Mon Oct 3 10:15:13 2016     superseded      alpine-0.1.0      1.0             Upgraded successfully
            3           Mon Oct 3 10:15:13 2016     superseded      alpine-0.1.0      1.0             Rolled back to 2
            4           Mon Oct 3 10:15:13 2016     deployed        alpine-0.1.0      1.0             Upgraded successfully

        Use '--show-rollback-revision' to include a column showing the revision that was rolled back to:

            $ helm history angry-bird --show-rollback-revision
            REVISION    UPDATED                     STATUS          CHART             APP VERSION     ROLLBACK     DESCRIPTION
            1           Mon Oct 3 10:15:13 2016     superseded      alpine-0.1.0      1.0                          Initial install
            2           Mon Oct 3 10:15:13 2016     superseded      alpine-0.1.0      1.0                          Upgraded successfully
            3           Mon Oct 3 10:15:13 2016     superseded      alpine-0.1.0      1.0             2            Rolled back to 2
            4           Mon Oct 3 10:15:13 2016     deployed        alpine-0.1.0      1.0                          Upgraded successfully
  - name: install [NAME] [CHART]
    description: install a chart
    flags:
      --atomic&: deprecated
      --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
      --cert-file=: identify HTTPS client using this SSL certificate file
      --create-namespace: create the release namespace if not present
      --dependency-update: update dependencies if they are missing before installing the chart
      --description=: add a custom description
      --devel: use development versions, too. Equivalent to version '>0.0.0-0'. If --version is set, this is ignored
      --disable-openapi-validation: if set, the installation process will not validate rendered templates against the Kubernetes OpenAPI Schema
      --dry-run?:
        description: 'simulates the operation without persisting changes. Must be one of: "none" (default), "client", or "server". ''--dry-run=none'' executes the operation normally and persists changes (no simulation). ''--dry-run=client'' simulates the operation client-side only and avoids cluster connections. ''--dry-run=server'' simulates the operation on the server, requiring cluster connectivity.'
        default: none
      --enable-dns: enable DNS lookups when rendering templates
      --force&: deprecated
      --force-conflicts: if set server-side apply will force changes against conflicts
      --force-replace: force resource updates by replacement
      --hide-notes: if set, do not show notes in install output. Does not affect presence in chart metadata
      --hide-secret: hide Kubernetes Secrets when also using the --dry-run flag
      --insecure-skip-tls-verify: skip tls certificate checks for the chart download
      --key-file=: identify HTTPS client using this SSL key file
      --keyring=:
        description: location of public keys used for verification
        default: /root/.gnupg/pubring.gpg
      --name-template=: specify template used to name the release
      --no-hooks: prevent hooks from running during install
      --pass-credentials: pass credentials to all domains
      --password=: chart repository password where to locate the requested chart
      --plain-http: use insecure HTTP connections for the chart download
      --post-renderer-args=*:
        description: an argument to the post-renderer (can specify multiple)
        default: '[]'
      --post-renderer=: the name of a postrenderer type plugin to be used for post rendering. If it exists, the plugin will be used
      --render-subchart-notes: if set, render subchart notes along with the parent
      --replace: reuse the given name, only if that name is a deleted release which remains in the history. This is unsafe in production
      --repo=: chart repository url where to locate the requested chart
      --rollback-on-failure: if set, Helm will rollback (uninstall) the installation upon failure. The --wait flag will be default to "watcher" if --rollback-on-failure is set
      --server-side:
        description: object updates run in the server instead of the client
        default: "true"
      --set-file=*: 'set values from respective files specified via the command line (can specify multiple or separate values with commas: key1=path1,key2=path2)'
      --set-json=*: 'set JSON values on the command line (can specify multiple or separate values with commas: key1=jsonval1,key2=jsonval2 or using json format: {"key1": jsonval1, "key2": "jsonval2"})'
      --set-literal=*: set a literal STRING value on the command line
      --set-string=*: 'set STRING values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --set=*: 'set values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --skip-crds: if set, no CRDs will be installed. By default, CRDs are installed if not already present
      --skip-schema-validation: if set, disables JSON schema validation
      --take-ownership: if set, install will ignore the check for helm annotations and take ownership of the existing resources
      --timeout=:
        description: time to wait for any individual Kubernetes operation (like Jobs for hooks)
        default: 5m0s
      --username=: chart repository username where to locate the requested chart
      --verify: verify the package before using it
      --version=: specify a version constraint for the chart version to use. This constraint can be a specific tag (e.g. 1.1.1) or it may reference a valid range (e.g. ^2.0.0). If this is not specified, the latest version is used
      --wait-for-jobs: if set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful. It will wait for as long as --timeout
      --wait?:
        description: 'wait until resources are ready (up to --timeout). Use ''--wait'' alone for ''watcher'' strategy, or specify one of: ''watcher'', ''hookOnly'', ''legacy''. Default when flag is omitted: ''hookOnly''.'
        default: hookOnly
      -f, --values=*: specify values in a YAML file or a URL (can specify multiple)
      -g, --generate-name: generate the name (and omit the NAME parameter)
      -l, --labels=: Labels that would be added to release metadata. Should be divided by comma.
      -o, --output=:
        description: 'prints the output in the specified format. Allowed values: table, json, yaml'
        default: table
    exclusiveflags:
      - - force
        - force-conflicts
      - - force-conflicts
        - force-replace
    documentation:
      command: |2
        This command installs a chart archive.

        The install argument must be a chart reference, a path to a packaged chart,
        a path to an unpacked chart directory or a URL.

        To override values in a chart, use either the '--values' flag and pass in a file
        or use the '--set' flag and pass configuration from the command line, to force
        a string value use '--set-string'. You can use '--set-file' to set individual
        values from a file when the value itself is too long for the command line
        or is dynamically generated. You can also use '--set-json' to set json values
        (scalars/objects/arrays) from the command line. Additionally, you can use '--set-json' and passing json object as a string.

            $ helm install -f myvalues.yaml myredis ./redis

        or

            $ helm install --set name=prod myredis ./redis

        or

            $ helm install --set-string long_int=1234567890 myredis ./redis

        or

            $ helm install --set-file my_script=dothings.sh myredis ./redis

        or

            $ helm install --set-json 'master.sidecars=[{"name":"sidecar","image":"myImage","imagePullPolicy":"Always","ports":[{"name":"portname","containerPort":1234}]}]' myredis ./redis

        or

            $ helm install --set-json '{"master":{"sidecars":[{"name":"sidecar","image":"myImage","imagePullPolicy":"Always","ports":[{"name":"portname","containerPort":1234}]}]}}' myredis ./redis

        You can specify the '--values'/'-f' flag multiple times. The priority will be given to the
        last (right-most) file specified. For example, if both myvalues.yaml and override.yaml
        contained a key called 'Test', the value set in override.yaml would take precedence:

            $ helm install -f myvalues.yaml -f override.yaml  myredis ./redis

        You can specify the '--set' flag multiple times. The priority will be given to the
        last (right-most) set specified. For example, if both 'bar' and 'newbar' values are
        set for a key called 'foo', the 'newbar' value would take precedence:

            $ helm install --set foo=bar --set foo=newbar  myredis ./redis

        Similarly, in the following example 'foo' is set to '["four"]':

            $ helm install --set-json='foo=["one", "two", "three"]' --set-json='foo=["four"]' myredis ./redis

        And in the following example, 'foo' is set to '{"key1":"value1","key2":"bar"}':

            $ helm install --set-json='foo={"key1":"value1","key2":"value2"}' --set-json='foo.key2="bar"' myredis ./redis

        To check the generated manifests of a release without installing the chart,
        the --debug and --dry-run flags can be combined.

        The --dry-run flag will output all generated chart manifests, including Secrets
        which can contain sensitive values. To hide Kubernetes Secrets use the
        --hide-secret flag. Please carefully consider how and when these flags are used.

        If --verify is set, the chart MUST have a provenance file, and the provenance
        file MUST pass all verification steps.

        There are six different ways you can express the chart you want to install:

        1. By chart reference: helm install mymaria example/mariadb
        2. By path to a packaged chart: helm install mynginx ./nginx-1.2.3.tgz
        3. By path to an unpacked chart directory: helm install mynginx ./nginx
        4. By absolute URL: helm install mynginx https://example.com/charts/nginx-1.2.3.tgz
        5. By chart reference and repo url: helm install --repo https://example.com/charts/ mynginx nginx
        6. By OCI registries: helm install mynginx --version 1.2.3 oci://example.com/charts/nginx

        CHART REFERENCES

        A chart reference is a convenient way of referencing a chart in a chart repository.

        When you use a chart reference with a repo prefix ('example/mariadb'), Helm will look in the local
        configuration for a chart repository named 'example', and will then look for a
        chart in that repository whose name is 'mariadb'. It will install the latest stable version of that chart
        until you specify '--devel' flag to also include development version (alpha, beta, and release candidate releases), or
        supply a version number with the '--version' flag.

        To see the list of chart repositories, use 'helm repo list'. To search for
        charts in a repository, use 'helm search'.
  - name: lint PATH
    description: examine a chart for possible issues
    flags:
      --kube-version=: Kubernetes version used for capabilities and deprecation checks
      --quiet: print only warnings and errors
      --set-file=*: 'set values from respective files specified via the command line (can specify multiple or separate values with commas: key1=path1,key2=path2)'
      --set-json=*: 'set JSON values on the command line (can specify multiple or separate values with commas: key1=jsonval1,key2=jsonval2 or using json format: {"key1": jsonval1, "key2": "jsonval2"})'
      --set-literal=*: set a literal STRING value on the command line
      --set-string=*: 'set STRING values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --set=*: 'set values on the command line (can specify multiple or separate values with commas: key1=val1,key2=val2)'
      --skip-schema-validation: if set, disables JSON schema validation
      --strict: fail on lint warnings
      --with-subcharts: lint dependent charts
      -f, --values=*: specify values in a YAML file or a URL (can specify multiple)
    documentation:
      command: |2
        This command takes a path to a chart and runs a series of tests to verify that
        the chart is well-formed.

        If the linter encounters things that will cause the chart to fail installation,
        it will emit [ERROR] messages. If it encounters issues that break with convention
        or recommendation, it will emit [WARNING] messages.
  - name: list
    aliases:
      - ls
    description: list releases
    flags:
      --deployed: show deployed releases
      --failed: show failed releases
      --no-headers: don't print headers when using the default output format
      --offset=: next release index in the list, used to offset from start value
      --pending: show pending releases
      --superseded: show superseded releases
      --time-format=: 'format time using golang time formatter. Example: --time-format "2006-01-02 15:04:05Z0700"'
      --uninstalled: show uninstalled releases (if 'helm uninstall --keep-history' was used)
      --uninstalling: show releases that are currently being uninstalled
      -A, --all-namespaces: list releases across all namespaces
      -d, --date: sort by release date
      -f, --filter=: a regular expression (Perl compatible). Any releases that match the expression will be included in the results
      -l, --selector=: Selector (label query) to filter on, supports '=', '==', and '!='.(e.g. -l key1=value1,key2=value2). Works only for secret(default) and configmap storage backends.
      -m, --max=:
        description: maximum number of releases to fetch
        default: "256"
      -o, --output=:
        description: 'prints the output in the specified format. Allowed values: table, json, yaml'
        default: table
      -q, --short: output short (quiet) listing format
      -r, --reverse: reverse the sort order
    documentation:
      command: |2
        This command lists all of the releases for a specified namespace (uses current namespace context if namespace not specified).

        By default, it lists all releases in any status. Individual status filters like '--deployed', '--failed',
        '--pending', '--uninstalled', '--superseded', and '--uninstalling' can be used
        to show only releases in specific states. Such flags can be combined:
        '--deployed --failed'.

        By default, items are sorted alphabetically. Use the '-d' flag to sort by
        release date.

        If the --filter flag is provided, it will be treated as a filter. Filters are
        regular expressions (Perl compatible) that are applied to the list of releases.
        Only items that match the filter will be returned.

            $ helm list --filter 'ara[a-z]+'
            NAME                UPDATED                                  CHART
            maudlin-arachnid    2020-06-18 14:17:46.125134977 +0000 UTC  alpine-0.1.0

        If no results are found, 'helm list' will exit 0, but with no output (or in
        the case of no '-q' flag, only headers).

        By default, up to 256 items may be returned. To limit this, use the '--max' flag.
        Setting '--max' to 0 will not return all results. Rather, it will return the
        server's default, which may be much higher than 256. Pairing the '--max'
        flag with the '--offset' flag allows you to page through results.
  - name: package [CHART_PATH] [...]
    description: package a chart directory into a chart archive
    flags:
      --app-version=: set the appVersion on the chart to this version
      --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
      --cert-file=: identify HTTPS client using this SSL certificate file
      --insecure-skip-tls-verify: skip tls certificate checks for the chart download
      --key-file=: identify HTTPS client using this SSL key file
      --key=: name of the key to use when signing. Used if --sign is true
      --keyring=:
        description: location of a public keyring
        default: /root/.gnupg/pubring.gpg
      --passphrase-file=: location of a file which contains the passphrase for the signing key. Use "-" in order to read from stdin.
      --password=: chart repository password where to locate the requested chart
      --plain-http: use insecure HTTP connections for the chart download
      --sign: use a PGP private key to sign this package
      --username=: chart repository username where to locate the requested chart
      --version=: set the version on the chart to this semver version
      -d, --destination=:
        description: location to write the chart.
        default: .
      -u, --dependency-update: update dependencies from "Chart.yaml" to dir "charts/" before packaging
    documentation:
      command: |2
        This command packages a chart into a versioned chart archive file. If a path
        is given, this will look at that path for a chart (which must contain a
        Chart.yaml file) and then package that directory.

        Versioned chart archives are used by Helm package repositories.

        To sign a chart, use the '--sign' flag. In most cases, you should also
        provide '--keyring path/to/secret/keys' and '--key keyname'.

          $ helm package --sign ./mychart --key mykey --keyring ~/.gnupg/secring.gpg

        If '--keyring' is not specified, Helm usually defaults to the public keyring
        unless your environment is otherwise configured.
  - name: plugin
    description: install, list, or uninstall Helm plugins
    commands:
      - name: install [options] <path|url>
        aliases:
          - add
        description: install a Helm plugin
        flags:
          --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
          --cert-file=: identify registry client using this SSL certificate file
          --insecure-skip-tls-verify: skip tls certificate checks for the plugin download
          --key-file=: identify registry client using this SSL key file
          --keyring=:
            description: location of public keys used for verification
            default: /root/.gnupg/pubring.gpg
          --password=: registry password
          --plain-http: use insecure HTTP connections for the plugin download
          --username=: registry username
          --verify:
            description: verify the plugin signature before installing
            default: "true"
          --version=: specify a version constraint. If this is not specified, the latest version is installed
        documentation:
          command: |2
            This command allows you to install a plugin from a url to a VCS repo or a local path.

            By default, plugin signatures are verified before installation when installing from
            tarballs (.tgz or .tar.gz). A corresponding .prov file must be available alongside
            the tarball; installation will fail if it is missing or invalid.
            For local development, plugins installed from local directories are automatically
            treated as "local dev" and do not require signatures.
            Use --verify=false to explicitly skip signature verification (NOT recommended).
      - name: list
        aliases:
          - ls
        description: list installed Helm plugins
        flags:
          --type=: Plugin type
      - name: package [PATH]
        description: package a plugin directory into a plugin archive
        flags:
          --key=: name of the key to use when signing. Used if --sign is true
          --keyring=:
            description: location of a public keyring
            default: /root/.gnupg/pubring.gpg
          --passphrase-file=: location of a file which contains the passphrase for the signing key. Use "-" to read from stdin.
          --sign:
            description: use a PGP private key to sign this plugin
            default: "true"
          -d, --destination=:
            description: location to write the plugin tarball.
            default: .
        documentation:
          command: |2
            This command packages a Helm plugin directory into a tarball.

            By default, the command will generate a provenance file signed with a PGP key.
            This ensures the plugin can be verified after installation.

            Use --sign=false to skip signing (not recommended for distribution).
      - name: uninstall <plugin>...
        aliases:
          - rm
          - remove
        description: uninstall one or more Helm plugins
      - name: update <plugin>...
        aliases:
          - up
        description: update one or more Helm plugins
      - name: verify [PATH]
        description: verify that a plugin at the given path has been signed and is valid
        flags:
          --keyring=:
            description: keyring containing public keys
            default: /root/.gnupg/pubring.gpg
        documentation:
          command: |2
            This command verifies that a Helm plugin has a valid provenance file,
            and that the provenance file is signed by a trusted PGP key.

            It supports both:
            - Plugin tarballs (.tgz or .tar.gz files)
            - Installed plugin directories

            For installed plugins, use the path shown by 'helm env HELM_PLUGINS' followed
            by the plugin name. For example:
              helm plugin verify ~/.local/share/helm/plugins/example-cli

            To generate a signed plugin, use the 'helm plugin package --sign' command.
    documentation:
      command: |2
        Manage client-side Helm plugins.
  - name: pull [chart URL | repo/chartname] [...]
    aliases:
      - fetch
    description: download a chart from a repository and (optionally) unpack it in local directory
    flags:
      --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
      --cert-file=: identify HTTPS client using this SSL certificate file
      --devel: use development versions, too. Equivalent to version '>0.0.0-0'. If --version is set, this is ignored.
      --insecure-skip-tls-verify: skip tls certificate checks for the chart download
      --key-file=: identify HTTPS client using this SSL key file
      --keyring=:
        description: location of public keys used for verification
        default: /root/.gnupg/pubring.gpg
      --pass-credentials: pass credentials to all domains
      --password=: chart repository password where to locate the requested chart
      --plain-http: use insecure HTTP connections for the chart download
      --prov: fetch the provenance file, but don't perform verification
      --repo=: chart repository url where to locate the requested chart
      --untar: if set to true, will untar the chart after downloading it
      --untardir=:
        description: if untar is specified, this flag specifies the name of the directory into which the chart is expanded
        default: .
      --username=: chart repository username where to locate the requested chart
      --verify: verify the package before using it
      --version=: specify a version constraint for the chart version to use. This constraint can be a specific tag (e.g. 1.1.1) or it may reference a valid range (e.g. ^2.0.0). If this is not specified, the latest version is used
      -d, --destination=:
        description: location to write the chart. If this and untardir are specified, untardir is appended to this
        default: .
    documentation:
      command: |2
        Retrieve a package from a package repository, and download it locally.

        This is useful for fetching packages to inspect, modify, or repackage. It can
        also be used to perform cryptographic verification of a chart without installing
        the chart.

        There are options for unpacking the chart after download. This will create a
        directory for the chart and uncompress into that directory.

        If the --verify flag is specified, the requested chart MUST have a provenance
        file, and MUST pass the verification process. Failure in any part of this will
        result in an error, and the chart will not be saved locally.
  - name: push [chart] [remote]
    description: push a chart to remote
    flags:
      --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
      --cert-file=: identify registry client using this SSL certificate file
      --insecure-skip-tls-verify: skip tls certificate checks for the chart upload
      --key-file=: identify registry client using this SSL key file
      --password=: chart repository password where to locate the requested chart
      --plain-http: use insecure HTTP connections for the chart upload
      --username=: chart repository username where to locate the requested chart
    documentation:
      command: |2
        Upload a chart to a registry.

        If the chart has an associated provenance file,
        it will also be uploaded.
  - name: registry
    description: login to or logout from a registry
    commands:
      - name: login [host]
        description: login to a registry
        flags:
          --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
          --cert-file=: identify registry client using this SSL certificate file
          --insecure: allow connections to TLS registry without certs
          --key-file=: identify registry client using this SSL key file
          --password-stdin: read password or identity token from stdin
          --plain-http: use insecure HTTP connections for the chart upload
          -p, --password=: registry password or identity token
          -u, --username=: registry username
        documentation:
          command: |2
            Authenticate to a remote registry.

            For example for Github Container Registry:

                echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u $GITHUB_USER --password-stdin
      - name: logout [host]
        description: logout from a registry
        documentation:
          command: |2
            Remove credentials stored for a remote registry.
    documentation:
      command: |2
        This command consists of multiple subcommands to interact with registries.
  - name: repo add|remove|list|index|update [ARGS]
    description: add, list, remove, update, and index chart repositories
    commands:
      - name: add [NAME] [URL]
        description: add a chart repository
        flags:
          --allow-deprecated-repos: by default, this command will not allow adding official repos that have been permanently deleted. This disables that behavior
          --ca-file=: verify certificates of HTTPS-enabled servers using this CA bundle
          --cert-file=: identify HTTPS client using this SSL certificate file
          --force-update: replace (overwrite) the repo if it already exists
          --insecure-skip-tls-verify: skip tls certificate checks for the repository
          --key-file=: identify HTTPS client using this SSL key file
          --pass-credentials: pass credentials to all domains
          --password-stdin: read chart repository password from stdin
          --password=: chart repository password
          --timeout=:
            description: time to wait for the index file download to complete
            default: 2m0s
          --username=: chart repository username
      - name: index [DIR]
        description: generate an index file given a directory containing packaged charts
        flags:
          --json: output in JSON format
          --merge=: merge the generated index into the given index
          --url=: url of chart repository
        documentation:
          command: |2
            Read the current directory, generate an index file based on the charts found
            and write the result to 'index.yaml' in the current directory.

            This tool is used for creating an 'index.yaml' file for a chart repository. To
            set an absolute URL to the charts, use '--url' flag.

            To merge the generated index with an existing index file, use the '--merge'
            flag. In this case, the charts found in the current directory will be merged
            into the index passed in with --merge, with local charts taking priority over
            existing charts.
      - name: list
        aliases:
          - ls
        description: list chart repositories
        flags:
          --no-headers: suppress headers in the output
          -o, --output=:
            description: 'prints the output in the specified format. Allowed values: table, json, yaml'
            default: table
      - name: remove [REPO1 [REPO2 ...]]
        aliases:
          - rm
        description: remove one or more chart repositories
      - name: update [REPO1 [REPO2 ...]]
        aliases:
          - up
        description: update information of available charts locally from chart repositories
        flags:
          --timeout=:
            description: time to wait for the index file download to complete
            default: 2m0s
        documentation:
          command: |2
            Update gets the latest information about charts from the respective chart repositories.
            Information is cached locally, where it is used by commands like 'helm search'.

            You can optionally specify a list of repositories you want to update.
            	$ helm repo update <repo_name> ...
            To update all the repositories, use 'helm repo update'.
    documentation:
      command: |2
        This command consists of multiple subcommands to interact with chart repositories.

        It can be used to add, remove, list, and index chart repositories.
  - name: rollback <RELEASE> [REVISION]
    description: roll back a release to a previous revision
    flags:
      --cleanup-on-fail: allow deletion of new resources created in this rollback when rollback fails
      --description=: add a custom description for the rollback (max 256 characters)
      --dry-run?:
        description: 'simulates the operation without persisting changes. Must be one of: "none" (default), "client", or "server". ''--dry-run=none'' executes the operation normally and persists changes (no simulation). ''--dry-run=client'' simulates the operation client-side only and avoids cluster connections. ''--dry-run=server'' simulates the operation on the server, requiring cluster connectivity.'
        default: none
      --force&: deprecated
      --force-conflicts: if set server-side apply will force changes against conflicts
      --force-replace: force resource updates by replacement
      --history-max=:
        description: limit the maximum number of revisions saved per release. Use 0 for no limit
        default: "10"
      --no-hooks: prevent hooks from running during rollback
      --server-side=:
        description: must be "true", "false" or "auto". Object updates run in the server instead of the client ("auto" defaults the value from the previous chart release's method)
        default: auto
      --timeout=:
        description: time to wait for any individual Kubernetes operation (like Jobs for hooks)
        default: 5m0s
      --wait-for-jobs: if set and --wait enabled, will wait until all Jobs have been completed before marking the release as successful. It will wait for as long as --timeout
      --wait?:
        description: 'wait until resources are ready (up to --timeout). Use ''--wait'' alone for ''watcher'' strategy, or specify one of: ''watcher'', ''hookOnly'', ''legacy''. Default when flag is omitted: ''hookOnly''.'
        default: hookOnly
    exclusiveflags:
      - - force
        - force-conflicts
      - - force-conflicts
        - force-replace
    documentation:
      command: |2
        This command rolls back a release to a previous revision.

        The first argument of the rollback command is the name of a release, and the
        second is a revision (version) number. If this argument is omitted or set to
        0, it will roll back to the previous release.

        To see revision numbers, run 'helm history RELEASE'.
  - name: search [keyword]
    description: search for a keyword in charts
    commands:
      - name: hub [KEYWORD]
        description: search for charts in the Artifact Hub or your own hub instance
        flags:
          --endpoint=:
            description: Hub instance to query for charts
            default: https://hub.helm.sh
          --fail-on-no-result: search fails if no results are found
          --list-repo-url: print charts repository URL
          --max-col-width=:
            description: maximum column width for output table
            default: "50"
          -o, --output=:
            description: 'prints the output in the specified format. Allowed values: table, json, yaml'
            default: table
        documentation:
          command: |2
            Search for Helm charts in the Artifact Hub or your own hub instance.

            Artifact Hub is a web-based application that enables finding, installing, and
            publishing packages and configurations for CNCF projects, including publicly
            available distributed charts Helm charts. It is a Cloud Native Computing
            Foundation sandbox project. You can browse the hub at https://artifacthub.io/

            The [KEYWORD] argument accepts either a keyword string, or quoted string of rich
            query options. For rich query options documentation, see
            https://artifacthub.github.io/hub/api/?urls.primaryName=Monocular%20compatible%20search%20API#/Monocular/get_api_chartsvc_v1_charts_search

            Previous versions of Helm used an instance of Monocular as the default
            'endpoint', so for backwards compatibility Artifact Hub is compatible with the
            Monocular search API. Similarly, when setting the 'endpoint' flag, the specified
            endpoint must also be implement a Monocular compatible search API endpoint.
            Note that when specifying a Monocular instance as the 'endpoint', rich queries
            are not supported. For API details, see https://github.com/helm/monocular
      - name: repo [keyword]
        description: search repositories for a keyword in charts
        flags:
          --devel: use development versions (alpha, beta, and release candidate releases), too. Equivalent to version '>0.0.0-0'. If --version is set, this is ignored
          --fail-on-no-result: search fails if no results are found
          --max-col-width=:
            description: maximum column width for output table
            default: "50"
          --version=: search using semantic versioning constraints on repositories you have added
          -l, --versions: show the long listing, with each version of each chart on its own line, for repositories you have added
          -o, --output=:
            description: 'prints the output in the specified format. Allowed values: table, json, yaml'
            default: table
          -r, --regexp: use regular expressions for searching repositories you have added
        documentation:
          command: |2
            Search reads through all of the repositories configured on the system, and
            looks for matches. Search of these repositories uses the metadata stored on
            the system.

            It will display the latest stable versions of the charts found. If you
            specify the --devel flag, the output will include pre-release versions.
            If you want to search using a version constraint, use --version.

            Examples:

                # Search for stable release versions matching the keyword "nginx"
                $ helm search repo nginx

                # Search for release versions matching the keyword "nginx", including pre-release versions
                $ helm search repo nginx --devel

                # Search for the latest stable release for nginx-ingress with a major version of 1
                $ helm search repo nginx-ingress --version ^1.0.0

            Repositories are managed with 'helm repo' commands.
    documentation:
      command: |2
        Search provides the ability to search for Helm charts in the various places
        they can be stored including the Artifact Hub and repositories you have added.
        Use search subcommands to search different locations for charts.
  - name: show
