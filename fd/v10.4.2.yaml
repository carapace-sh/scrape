# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: fd
description: A program to find entries in your filesystem
flags:
  '-1': Limit search to a single result
  -a, --absolute-path: Show absolute instead of relative paths
  --and=*: Additional search patterns that need to be matched
  -C, --base-directory=: Change current working directory
  --batch-size=:
    description: Max number of arguments to run as a batch size with -X
    default: '0'
  -s, --case-sensitive: 'Case-sensitive search (default: smart case)'
  --changed-before=: Filter by file modification time (older than)
  --change-older-than=&: Filter by file modification time (older than)
  --older=&: Filter by file modification time (older than)
  --changed-within=: Filter by file modification time (newer than)
  --change-newer-than=&: Filter by file modification time (newer than)
  --newer=&: Filter by file modification time (newer than)
  --changed-after=&: Filter by file modification time (newer than)
  -c, --color=:
    description: When to use colors
    default: auto
  --exact-depth=: Only show search results at the exact given depth
  -E, --exclude=*: Exclude entries that match the given glob pattern
  -x, --exec=*:
    description: Execute a command for each search result
    nargs: -1
  -X, --exec-batch=*:
    description: Execute a command with all search results at once
    nargs: -1
  -e, --extension=*: Filter by file extension
  -F, --fixed-strings: Treat pattern as literal string stead of regex
  --literal&: Treat pattern as literal string stead of regex
  -L, --follow: Follow symbolic links
  --dereference&: Follow symbolic links
  --format=: Print results according to template
  -p, --full-path: 'Search full abs. path (default: filename only)'
  --gen-completions&=: ''
  -g, --glob: 'Glob-based search (default: regular expression)'
  -h, --help: Print help (see more with '--help')
  -H, --hidden: Search hidden files and directories
  --hyperlink?:
    description: Add hyperlinks to output paths
    default: never
  --hyper?&:
    description: Add hyperlinks to output paths
    default: never
  --ignore&: Overrides --no-ignore
  -i, --ignore-case: 'Case-insensitive search (default: smart case)'
  --ignore-contain=*: Ignore directories containing the named entry
  --ignore-file=*: Add a custom ignore-file in '.gitignore' format
  --ignore-vcs&: Overrides --no-ignore-vcs
  -l, --list-details: Use a long listing format with file metadata
  --max-buffer-time&=: Milliseconds to buffer before streaming search results to console
  -d, --max-depth=: 'Set maximum search depth (default: none)'
  --maxdepth=&: 'Set maximum search depth (default: none)'
  --max-results=: Limit the number of search results
  --min-depth=: Only show search results starting at the given depth.
  --mindepth=&: Only show search results starting at the given depth.
  --no-follow&: Overrides --follow
  --no-global-ignore-file&: Do not respect the global ignore file
  --no-hidden&: Overrides --hidden
  -I, --no-ignore: Do not respect .(git|fd)ignore files
  --no-ignore-parent: Do not respect .(git|fd)ignore files in parent directories
  --no-ignore-vcs: Do not respect .gitignore files
  --no-require-git: Do not require a git repository to respect gitignores. By default, fd will only respect global gitignore rules, .gitignore rules, and local exclude rules if fd detects that you are searching inside a git repository. This flag allows you to relax this restriction such that fd will respect all git related ignore rules regardless of whether you're searching in a git repository or not
  --one-file-system: By default, fd will traverse the file system tree as far as other options dictate. With this flag, fd ensures that it does not descend into a different file system than the one it started in. Comparable to the -mount or -xdev filters of find(1)
  --mount&: By default, fd will traverse the file system tree as far as other options dictate. With this flag, fd ensures that it does not descend into a different file system than the one it started in. Comparable to the -mount or -xdev filters of find(1)
  --xdev&: By default, fd will traverse the file system tree as far as other options dictate. With this flag, fd ensures that it does not descend into a different file system than the one it started in. Comparable to the -mount or -xdev filters of find(1)
  -o, --owner=: Filter by owning user and/or group
  --path-separator=: Set path separator when printing file paths
  -0, --print0: Separate search results by the null character
  --prune: Do not traverse into directories that match the search criteria. If you want to exclude specific directories, use the '--exclude=…' option
  -q, --quiet: Print nothing, exit code 0 if match found, 1 otherwise
  --has-results&: Print nothing, exit code 0 if match found, 1 otherwise
  --regex: Regular-expression based search (default)
  --relative-path&: Overrides --absolute-path
  --require-git&: Overrides --no-require-git
  --search-path=*: Provides paths to search as an alternative to the positional <path> argument
  --show-errors: Show filesystem errors
  -S, --size=*: Limit results based on the size of files
  --strip-cwd-prefix?: By default, relative paths are prefixed with './' when -x/--exec, -X/--exec-batch, or -0/--print0 are given, to reduce the risk of a path starting with '-' being treated as a command line option. Use this flag to change this behavior. If this flag is used without a value, it is equivalent to passing "always"
  -j, --threads=: 'Set number of threads to use for searching & executing (default: number of available CPU cores)'
  -t, --type=*: 'Filter by type: file (f), directory (d/dir), symlink (l), executable (x), empty (e), socket (s), pipe (p), char-device (c), block-device (b)'
  -u, --unrestricted*: Unrestricted search, alias for '--no-ignore --hidden'
  -V, --version: Print version
completion:
  flag:
    base-directory:
    - $files
    color:
    - "auto\tshow colors if the output goes to an interactive console (default)"
    - "always\talways use colorized output"
    - "never\tdo not use colorized output"
    gen-completions:
    - bash
    - elvish
    - fish
    - powershell
    - zsh
    hyperlink:
    - "auto\tUse hyperlinks only if color is enabled"
    - "always\tAlways use hyperlinks when printing file paths"
    - "never\tNever use hyperlinks"
    hyper:
    - "auto\tUse hyperlinks only if color is enabled"
    - "always\tAlways use hyperlinks when printing file paths"
    - "never\tNever use hyperlinks"
    ignore-file:
    - $files
    search-path:
    - $files
    strip-cwd-prefix:
    - "auto\tUse the default behavior"
    - "always\tAlways strip the ./ at the beginning of paths"
    - "never\tNever strip the ./"
    type:
    - file
    - directory
    - symlink
    - block-device
    - char-device
    - "executable\tA file which is executable by the current effective user"
    - empty
    - socket
    - pipe
  positionalany:
  - $files
documentation:
  flag:
    '1': Limit the search to a single result and quit immediately. This is an alias for '--max-results=1'.
    absolute-path: Shows the full path starting from the root as opposed to relative paths. The flag can be overridden with --relative-path.
    and: Add additional required search patterns, all of which must be matched. Multiple additional patterns can be specified. The patterns are regular expressions, unless '--glob' or '--fixed-strings' is used.
    base-directory: Change the current working directory of fd to the provided path. This means that search results will be shown with respect to the given base path. Note that relative paths which are passed to fd via the positional <path> argument or the '--search-path' option will also be resolved relative to this directory.
    batch-size: Maximum number of arguments to pass to the command given with -X. If the number of results is greater than the given size, the command given with -X is run again with remaining arguments. A batch size of zero means there is no limit (default), but note that batching might still happen due to OS restrictions on the maximum length of command lines.
    case-sensitive: Perform a case-sensitive search. By default, fd uses case-insensitive searches, unless the pattern contains an uppercase character (smart case).
    changed-before: |-
      Filter results based on the file modification time. Files with modification times less than the argument are returned. The argument can be provided as a specific point in time (YYYY-MM-DD HH:MM:SS or @timestamp) or as a duration (10h, 1d, 35min). '--change-older-than' or '--older' can be used as aliases.

      Examples: {n}    --changed-before '2018-10-27 10:00:00' {n}    --change-older-than 2weeks {n}    --older 2018-10-27
    changed-within: |-
      Filter results based on the file modification time. Files with modification times greater than the argument are returned. The argument can be provided as a specific point in time (YYYY-MM-DD HH:MM:SS or @timestamp) or as a duration (10h, 1d, 35min). If the time is not specified, it defaults to 00:00:00. '--change-newer-than', '--newer', or '--changed-after' can be used as aliases.

      Examples: {n}    --changed-within 2weeks {n}    --change-newer-than '2018-10-27 10:00:00' {n}    --newer 2018-10-27 {n}    --changed-after 1day
    color: Declare when to use color for the pattern match output
    exact-depth: Only show search results at the exact given depth. This is an alias for '--min-depth <depth> --max-depth <depth>'.
    exclude: |-
      Exclude files/directories that match the given glob pattern. This overrides any other ignore logic. Multiple exclude patterns can be specified.

      Examples: {n}  --exclude '*.pyc' {n}  --exclude node_modules
    exec: |-
      Execute a command for each search result in parallel (use --threads=1 for sequential command execution). There is no guarantee of the order commands are executed in, and the order should not be depended upon. All positional arguments following --exec are considered to be arguments to the command - not to fd. It is therefore recommended to place the '-x'/'--exec' option last.
      The following placeholders are substituted before the command is executed:
        '{}':   path (of the current search result)
        '{/}':  basename
        '{//}': parent directory
        '{.}':  path without file extension
        '{/.}': basename without file extension
        '{{':   literal '{' (for escaping)
        '}}':   literal '}' (for escaping)

      If no placeholder is present, an implicit "{}" at the end is assumed.

      Examples:

        - find all *.zip files and unzip them:

            fd -e zip -x unzip

        - find *.h and *.cpp files and run "clang-format -i .." for each of them:

            fd -e h -e cpp -x clang-format -i

        - Convert all *.jpg files to *.png files:

            fd -e jpg -x convert {} {.}.png
    exec-batch: |-
      Execute the given command once, with all search results as arguments.
      The order of the arguments is non-deterministic, and should not be relied upon.
      One of the following placeholders is substituted before the command is executed:
        '{}':   path (of all search results)
        '{/}':  basename
        '{//}': parent directory
        '{.}':  path without file extension
        '{/.}': basename without file extension
        '{{':   literal '{' (for escaping)
        '}}':   literal '}' (for escaping)

      If no placeholder is present, an implicit "{}" at the end is assumed.

      Examples:

        - Find all test_*.py files and open them in your favorite editor:

            fd -g 'test_*.py' -X vim

        - Find all *.rs files and count the lines with "wc -l ...":

            fd -e rs -X wc -l
    extension: |-
      (Additionally) filter search results by their file extension. Multiple allowable file extensions can be specified.

      If you want to search for files without extension, you can use the regex '^[^.]+$' as a normal search pattern.
    fixed-strings: Treat the pattern as a literal string instead of a regular expression. Note that this also performs substring comparison. If you want to match on an exact filename, consider using '--glob'.
    follow: By default, fd does not descend into symlinked directories. Using this flag, symbolic links are also traversed. Flag can be overridden with --no-follow.
    full-path: |-
      By default, the search pattern is only matched against the filename (or directory name). Using this flag, the pattern is matched against the full (absolute) path. Example:
        fd --glob -p '**/.git/config'
    glob: Perform a glob-based search instead of a regular expression search.
    help: Print help (see a summary with '-h')
    hidden: 'Include hidden directories and files in the search results (default: hidden files and directories are skipped). Files and directories are considered to be hidden if their name starts with a `.` sign (dot). Any files or directories that are ignored due to the rules described by --no-ignore are still ignored unless otherwise specified. The flag can be overridden with --no-hidden.'
    hyperlink: |-
      Add a terminal hyperlink to a file:// url for each path in the output.

      Auto mode  is used if no argument is given to this option.

      This doesn't do anything for --exec and --exec-batch.
    ignore-case: Perform a case-insensitive search. By default, fd uses case-insensitive searches, unless the pattern contains an uppercase character (smart case).
    ignore-file: Add a custom ignore-file in '.gitignore' format. These files have a low precedence.
    list-details: Use a detailed listing format like 'ls -l'. This is basically an alias for '--exec-batch ls -l' with some additional 'ls' options. This can be used to see more metadata, to show symlink targets and to achieve a deterministic sort order.
    max-buffer-time: |-
      Milliseconds to buffer before streaming search results to console

      Amount of time in milliseconds to buffer, before streaming the search results to the console.
    max-depth: Limit the directory traversal to a given depth. By default, there is no limit on the search depth.
    max-results: Limit the number of search results to 'count' and quit immediately.
    min-depth: 'Only show search results starting at the given depth. See also: ''--max-depth'' and ''--exact-depth'''
    no-ignore: Show search results from files and directories that would otherwise be ignored by '.gitignore', '.ignore', '.fdignore', or the global ignore file, The flag can be overridden with --ignore.
    no-ignore-parent: Show search results from files and directories that would otherwise be ignored by '.gitignore', '.ignore', or '.fdignore' files in parent directories.
    no-ignore-vcs: Show search results from files and directories that would otherwise be ignored by '.gitignore' files. The flag can be overridden with --ignore-vcs.
    no-require-git: |-
      Do not require a git repository to respect gitignores. By default, fd will only respect global gitignore rules, .gitignore rules, and local exclude rules if fd detects that you are searching inside a git repository. This flag allows you to relax this restriction such that fd will respect all git related ignore rules regardless of whether you're searching in a git repository or not.

      This flag can be disabled with --require-git.
    one-file-system: By default, fd will traverse the file system tree as far as other options dictate. With this flag, fd ensures that it does not descend into a different file system than the one it started in. Comparable to the -mount or -xdev filters of find(1).
    owner: |-
      Filter files by their user and/or group. Format: [(user|uid)][:(group|gid)]. Either side is optional. Precede either side with a '!' to exclude files instead.

      Examples: {n}    --owner john {n}    --owner :students {n}    --owner '!john:students'
    path-separator: Set the path separator to use when printing file paths. The default is the OS-specific separator ('/' on Unix, '\' on Windows).
    print0: Separate search results by the null character (instead of newlines). Useful for piping results to 'xargs'.
    prune: Do not traverse into directories that match the search criteria. If you want to exclude specific directories, use the '--exclude=…' option.
    quiet: When the flag is present, the program does not print anything and will return with an exit code of 0 if there is at least one match. Otherwise, the exit code will be 1. '--has-results' can be used as an alias.
    regex: Perform a regular-expression based search (default). This can be used to override --glob.
    search-path: Provide paths to search as an alternative to the positional <path> argument. Changes the usage to `fd [OPTIONS] --search-path <path> --search-path <path2> [<pattern>]`
    show-errors: Enable the display of filesystem errors for situations such as insufficient permissions or dead symlinks.
    size: |-
      Limit results based on the size of files using the format <+-><NUM><UNIT>.
         '+': file size must be greater than or equal to this
         '-': file size must be less than or equal to this

      If neither '+' nor '-' is specified, file size must be exactly equal to this.
         'NUM':  The numeric size (e.g. 500)
         'UNIT': The units for NUM. They are not case-sensitive.
      Allowed unit values:
          'b':  bytes
          'k':  kilobytes (base ten, 10^3 = 1000 bytes)
          'm':  megabytes
          'g':  gigabytes
          't':  terabytes
          'ki': kibibytes (base two, 2^10 = 1024 bytes)
          'mi': mebibytes
          'gi': gibibytes
          'ti': tebibytes
    strip-cwd-prefix: By default, relative paths are prefixed with './' when -x/--exec, -X/--exec-batch, or -0/--print0 are given, to reduce the risk of a path starting with '-' being treated as a command line option. Use this flag to change this behavior. If this flag is used without a value, it is equivalent to passing "always".
    type: |-
      Filter the search by type: {n}  'f' or 'file':         regular files {n}  'd' or 'dir' or 'directory':    directories {n}  'l' or 'symlink':      symbolic links {n}  's' or 'socket':       socket {n}  'p' or 'pipe':         named pipe (FIFO) {n}  'b' or 'block-device': block device {n}  'c' or 'char-device':  character device {n}{n}  'x' or 'executable':   executables {n}  'e' or 'empty':        empty files or directories

      This option can be specified more than once to include multiple file types. Searching for '--type file --type symlink' will show both regular files as well as symlinks. Note that the 'executable' and 'empty' filters work differently: '--type executable' implies '--type file' by default. And '--type empty' searches for empty files and directories, unless either '--type file' or '--type directory' is specified in addition.

      Examples: {n}  - Only search for files: {n}      fd --type file … {n}      fd -tf … {n}  - Find both files and symlinks {n}      fd --type file --type symlink … {n}      fd -tf -tl … {n}  - Find executable files: {n}      fd --type executable {n}      fd -tx {n}  - Find empty files: {n}      fd --type empty --type file {n}      fd -te -tf {n}  - Find empty directories: {n}      fd --type empty --type directory {n}      fd -te -td
    unrestricted: Perform an unrestricted search, including ignored and hidden files. This is an alias for '--no-ignore --hidden'.
