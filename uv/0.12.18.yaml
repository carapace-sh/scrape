- name: python
  description: Manage Python versions and installations
  completion:
    flag:
      cache-dir:
      - $directories
      color:
      - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
      - "always\tEnables colored output regardless of the detected environment"
      - "never\tDisables colored output"
      config-file:
      - $files
      directory:
      - $directories
      project:
      - $directories
      python-fetch:
      - "automatic\tAutomatically download managed Python installations when needed"
      - "manual\tDo not automatically download managed Python installations; require explicit installation"
      - "never\tDo not ever allow Python downloads"
      python-preference:
      - "only-managed\tOnly use managed Python installations; never use system Python installations"
      - "managed\tPrefer managed Python installations over system Python installations"
      - "system\tPrefer system Python installations over managed Python installations"
      - "only-system\tOnly use system Python installations; never use managed Python installations"
  documentation:
    command: |-
      Manage Python versions and installations

      Generally, uv first searches for Python in a virtual environment, either active or in a
      `.venv` directory in the current working directory or any parent directory. If a virtual
      environment is not required, uv will then search for a Python interpreter. Python
      interpreters are found by searching for Python executables in the `PATH` environment
      variable.

      On Windows, the registry is also searched for Python executables.

      By default, uv will download Python if a version cannot be found. This behavior can be
      disabled with the `--no-python-downloads` flag or the `python-downloads` setting.

      The `--python` option allows requesting a different interpreter.

      The following Python version request formats are supported:

      - `<version>` e.g. `3`, `3.12`, `3.12.3`
      - `<version-specifier>` e.g. `>=3.12,<3.13`
      - `<version><short-variant>` (e.g., `3.13t`, `3.12.0d`)
      - `<version>+<variant>` (e.g., `3.13+freethreaded`, `3.12.0+debug`)
      - `<implementation>` e.g. `cpython` or `cp`
      - `<implementation>@<version>` e.g. `cpython@3.12`
      - `<implementation><version>` e.g. `cpython3.12` or `cp312`
      - `<implementation><version-specifier>` e.g. `cpython>=3.12,<3.13`
      - `<implementation>-<version>-<os>-<arch>-<libc>` e.g. `cpython-3.12.3-macos-aarch64-none`

      Additionally, a specific system Python interpreter can often be requested with:

      - `<executable-path>` e.g. `/opt/homebrew/bin/python3`
      - `<executable-name>` e.g. `mypython3`
      - `<install-dir>` e.g. `/some/environment/`

      When the `--python` option is used, normal discovery rules apply but discovered interpreters
      are checked for compatibility with the request, e.g., if `pypy` is requested, uv will first
      check if the virtual environment contains a PyPy interpreter then check if each executable
      in the path is a PyPy interpreter.

      uv supports discovering CPython, PyPy, and GraalPy interpreters. Unsupported interpreters
      will be skipped during discovery. If an unsupported interpreter implementation is requested,
      uv will exit with an error.
  commands:
  - name: list
    aliases:
    - ls
    description: List the available Python installations
    flags:
      --all-arches: List Python downloads for all architectures
      --all_architectures&: List Python downloads for all architectures
      --all-platforms: List Python downloads for all platforms
      --all-versions: List all Python versions, including old patch versions
      --only-downloads: Only show available Python downloads
      --only-installed: Only show installed Python versions
      --output-format=:
        description: Select the output format
        default: text
      --python-downloads-json-url=: URL pointing to JSON of custom Python installations
      --show-urls: Show the URLs of available Python downloads
    completion:
      flag:
        cache-dir:
        - $directories
        color:
        - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        output-format:
        - "text\tPlain text (for humans)"
        - "json\tJSON (for computers)"
        project:
        - $directories
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
    documentation:
      command: |-
        List the available Python installations.

        By default, installed Python versions and the downloads for latest available patch version of each supported Python major version are shown.

        Use `--managed-python` to view only managed Python versions.

        Use `--no-managed-python` to omit managed Python versions.

        Use `--all-versions` to view all available patch versions.

        Use `--only-installed` to omit available downloads.
      flag:
        all-arches: |-
          List Python downloads for all architectures.

          By default, only downloads for the current architecture are shown.
        all-platforms: |-
          List Python downloads for all platforms.

          By default, only downloads for the current platform are shown.
        all-versions: |-
          List all Python versions, including old patch versions.

          By default, only the latest patch version is shown for each minor version.
        only-downloads: |-
          Only show available Python downloads.

          By default, installed distributions and available downloads for the current platform are shown.
        only-installed: |-
          Only show installed Python versions.

          By default, installed distributions and available downloads for the current platform are shown.
        show-urls: |-
          Show the URLs of available Python downloads.

          By default, these display as `<download available>`.
  - name: install
    description: Download and install Python versions
    flags:
      --bin&: Install a Python executable into the `bin` directory
      --compile-bytecode: Compile Python's standard library to bytecode after installation
      --compile&: Compile Python's standard library to bytecode after installation
      --default: Use as the default Python version
      -f, --force: Replace existing Python executables during installation
      -i, --install-dir=: The directory to store the Python installation in
      --mirror=: Set the URL to use as the source for downloading Python installations
      --no-bin: Do not install a Python executable into the `bin` directory
      --no-compile-bytecode&: ''
      --no-compile&: ''
      --no-registry: Do not register the Python installation in the Windows registry
      --pypy-mirror=: Set the URL to use as the source for downloading PyPy installations
      --python-downloads-json-url=: URL pointing to JSON of custom Python installations
      --registry&: Register the Python installation in the Windows registry
      -r, --reinstall: Reinstall the requested Python version, if it's already installed
      -U, --upgrade: Upgrade existing Python installations to the latest patch version
    completion:
      flag:
        cache-dir:
        - $directories
        color:
        - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        install-dir:
        - $directories
        project:
        - $directories
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
    documentation:
      command: |-
        Download and install Python versions.

        Supports CPython and PyPy. CPython distributions are downloaded from the Astral `python-build-standalone` project. PyPy distributions are downloaded from `python.org`. The available Python versions are bundled with each uv release. To install new Python versions, you may need upgrade uv.

        Python versions are installed into the uv Python directory, which can be retrieved with `uv python dir`.

        By default, Python executables are added to a directory on the path with a minor version suffix, e.g., `python3.13`. To install `python3` and `python`, use the `--default` flag. Use `uv python dir --bin` to see the target directory.

        Multiple Python versions may be requested.

        See `uv help python` to view supported request formats.
      flag:
        bin: |-
          Install a Python executable into the `bin` directory.

          This is the default behavior. If this flag is provided explicitly, uv will error if the executable cannot be installed.

          This can also be set with `UV_PYTHON_INSTALL_BIN=1`.

          See `UV_PYTHON_BIN_DIR` to customize the target directory.
        compile-bytecode: |-
          Compile Python's standard library to bytecode after installation.

          By default, uv does not compile Python (`.py`) files to bytecode (`__pycache__/*.pyc`); instead, compilation is performed lazily the first time a module is imported. For use-cases in which start time is important, such as CLI applications and Docker containers, this option can be enabled to trade longer installation times and some additional disk space for faster start times.

          When enabled, uv will process the Python version's `stdlib` directory. It will ignore any compilation errors.
        default: |-
          Use as the default Python version.

          By default, only a `python{major}.{minor}` executable is installed, e.g., `python3.10`. When the `--default` flag is used, `python{major}`, e.g., `python3`, and `python` executables are also installed.

          Alternative Python variants will still include their tag. For example, installing 3.13+freethreaded with `--default` will include `python3t` and `pythont` instead of `python3` and `python`.

          If multiple Python versions are requested, uv will exit with an error.
        force: |-
          Replace existing Python executables during installation.

          By default, uv will refuse to replace executables that it does not manage.

          Implies `--reinstall`.
        install-dir: |-
          The directory to store the Python installation in.

          If provided, `UV_PYTHON_INSTALL_DIR` will need to be set for subsequent operations for uv to discover the Python installation.

          See `uv python dir` to view the current Python installation directory. Defaults to `~/.local/share/uv/python`.
        mirror: |-
          Set the URL to use as the source for downloading Python installations.

          The provided URL will replace `https://github.com/astral-sh/python-build-standalone/releases/download` in, e.g., `https://github.com/astral-sh/python-build-standalone/releases/download/20240713/cpython-3.12.4%2B20240713-aarch64-apple-darwin-install_only.tar.gz`.

          Distributions can be read from a local directory by using the `file://` URL scheme.
        no-bin: |-
          Do not install a Python executable into the `bin` directory.

          This can also be set with `UV_PYTHON_INSTALL_BIN=0`.
        no-registry: |-
          Do not register the Python installation in the Windows registry.

          This can also be set with `UV_PYTHON_INSTALL_REGISTRY=0`.
        pypy-mirror: |-
          Set the URL to use as the source for downloading PyPy installations.

          The provided URL will replace `https://downloads.python.org/pypy` in, e.g., `https://downloads.python.org/pypy/pypy3.8-v7.3.7-osx64.tar.bz2`.

          Distributions can be read from a local directory by using the `file://` URL scheme.
        registry: |-
          Register the Python installation in the Windows registry.

          This is the default behavior on Windows. If this flag is provided explicitly, uv will error if the registry entry cannot be created.

          This can also be set with `UV_PYTHON_INSTALL_REGISTRY=1`.
        reinstall: |-
          Reinstall the requested Python version, if it's already installed.

          If a minor version is requested, all matching installed patch versions are reinstalled.

          By default, uv will exit successfully if the version is already installed.
        upgrade: |-
          Upgrade existing Python installations to the latest patch version.

          By default, uv will not upgrade already-installed Python versions to newer patch releases. With `--upgrade`, uv will upgrade to the latest available patch version for the specified minor version(s).

          If the requested versions are not yet installed, uv will install them.

          This option is only supported for minor version requests, e.g., `3.12`; uv will exit with an error if a patch version, e.g., `3.12.2`, is requested.
  - name: upgrade
