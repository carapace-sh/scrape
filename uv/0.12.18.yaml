      fork-strategy:
      - "fewest\tOptimize for selecting the fewest number of versions for each package. Older versions may be preferred if they are compatible with a wider range of supported Python versions or platforms"
      - "requires-python\tOptimize for selecting latest supported version of each package, for each supported Python version"
      index-strategy:
