        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        keyring-provider:
        - "disabled\tDo not use keyring for credential lookup"
        - "subprocess\tUse the `keyring` command for credential lookup"
        project:
        - $directories
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
    documentation:
      flag:
        keyring-provider: |-
          The keyring provider to use for storage of credentials.

          Only `--keyring-provider native` is supported for `login`, which uses the system keyring via an integration built into uv.
        password: |-
          The password to use for the service.

          Use `-` to read the password from stdin.
        token: |-
          The token to use for the service.

          The username will be set to `__token__`.

          Use `-` to read the token from stdin.
  - name: logout
    description: Logout of a service
    flags:
      --keyring-provider=: The keyring provider to use for storage of credentials
      -u, --username=: The username to logout
    completion:
      flag:
        cache-dir:
        - $directories
        color:
        - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        keyring-provider:
        - "disabled\tDo not use keyring for credential lookup"
        - "subprocess\tUse the `keyring` command for credential lookup"
        project:
        - $directories
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
    documentation:
      flag:
        keyring-provider: |-
          The keyring provider to use for storage of credentials.

          Only `--keyring-provider native` is supported for `logout`, which uses the system keyring via an integration built into uv.
  - name: token
    description: Show the authentication token for a service
    flags:
      --keyring-provider=: The keyring provider to use for reading credentials
      -u, --username=: The username to lookup
    completion:
      flag:
        cache-dir:
        - $directories
        color:
        - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        keyring-provider:
        - "disabled\tDo not use keyring for credential lookup"
        - "subprocess\tUse the `keyring` command for credential lookup"
        project:
        - $directories
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
  - name: dir
    description: Show the path to the uv credentials directory
    completion:
      flag:
        cache-dir:
        - $directories
        color:
        - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        project:
        - $directories
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
    documentation:
      command: |-
        Show the path to the uv credentials directory.

        By default, credentials are stored in the uv data directory at `$XDG_DATA_HOME/uv/credentials` or `$HOME/.local/share/uv/credentials` on Unix and `%APPDATA%\uv\data\credentials` on Windows.

        The credentials directory may be overridden with `$UV_CREDENTIALS_DIR`.

        Credentials are only stored in this directory when the plaintext backend is used, as opposed to the native backend, which uses the system keyring.
  - name: helper
    description: Act as a credential helper for external tools
    hidden: true
    flags:
      --protocol!=: The credential helper protocol to use
    completion:
      flag:
        cache-dir:
        - $directories
        color:
        - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
        - "always\tEnables colored output regardless of the detected environment"
        - "never\tDisables colored output"
        config-file:
        - $files
        directory:
        - $directories
        project:
        - $directories
        protocol:
        - "bazel\tBazel credential helper protocol as described in [the spec](https://github.com/bazelbuild/proposals/blob/main/designs/2022-06-07-bazel-credential-helpers.md)"
        python-fetch:
        - "automatic\tAutomatically download managed Python installations when needed"
        - "manual\tDo not automatically download managed Python installations; require explicit installation"
        - "never\tDo not ever allow Python downloads"
        python-preference:
        - "only-managed\tOnly use managed Python installations; never use system Python installations"
        - "managed\tPrefer managed Python installations over system Python installations"
        - "system\tPrefer system Python installations over managed Python installations"
        - "only-system\tOnly use system Python installations; never use managed Python installations"
    documentation:
      command: |-
        Act as a credential helper for external tools.

        Implements the Bazel credential helper protocol to provide credentials to external tools via JSON over stdin/stdout.

        This command is typically invoked by external tools.
    commands:
    - name: get
      description: Retrieve credentials for a URI
      completion:
        flag:
          cache-dir:
          - $directories
          color:
          - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
          - "always\tEnables colored output regardless of the detected environment"
          - "never\tDisables colored output"
          config-file:
          - $files
          directory:
          - $directories
          project:
          - $directories
          python-fetch:
          - "automatic\tAutomatically download managed Python installations when needed"
          - "manual\tDo not automatically download managed Python installations; require explicit installation"
          - "never\tDo not ever allow Python downloads"
          python-preference:
          - "only-managed\tOnly use managed Python installations; never use system Python installations"
          - "managed\tPrefer managed Python installations over system Python installations"
          - "system\tPrefer system Python installations over managed Python installations"
          - "only-system\tOnly use system Python installations; never use managed Python installations"
- name: run
  description: Run a command or script
  flags:
    --active: Prefer the active virtual environment over the project's virtual environment
    --all-extras: Include all optional dependencies
    --all-groups: Include dependencies from all dependency groups
    --all-packages: Run the command with all workspace members installed
    --binary&: ''
    --build&: ''
    --build-isolation&: ''
    --compile-bytecode: Compile Python files to bytecode after installation
    --compile&: Compile Python files to bytecode after installation
    -C, --config-setting=*: Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs
    --config-settings=*&: Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs
    --config-settings-package=*: Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs
    --config-settings-package=*&: Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs
    --default-index=: 'The default package index (by default: <https://pypi.org/simple>)'
    --dev&: 'Include the development dependency group [env: UV_DEV=]'
    --editable&: Install any non-editable dependencies, including the project and any workspace members, as editable
    --env-file=*: Load environment variables from a `.env` file
    --exact: Perform an exact sync, removing extraneous packages
    --exclude-newer=: Limit candidate packages to those that were uploaded prior to the given date
    --exclude-newer-package=*: Limit candidate packages for specific packages to those that were uploaded prior to the given date
    --extra=*: Include optional dependencies from the specified extra name
    --extra-index-url=*: '(Deprecated: use `--index` instead) Extra URLs of package indexes to use, in addition to `--index-url`'
    -f, --find-links=*: Locations to search for candidate distributions, in addition to those found in the registry indexes
    --fork-strategy=: The strategy to use when selecting multiple versions of a given package across Python versions and platforms
    --frozen: 'Run without updating the `uv.lock` file [env: UV_FROZEN=]'
    --group=*: Include dependencies from the specified dependency group
    --gui-script: Run the given path as a Python GUI script
    --index=*: The indexes to use when resolving dependencies, in addition to the default index
    --index-strategy=: The strategy to use when resolving against multiple index URLs
    -i, --index-url=: '(Deprecated: use `--default-index` instead) The URL of the Python package index (by default: <https://pypi.org/simple>)'
    --inexact&: Do not remove extraneous packages present in the environment
    --no-exact&: Do not remove extraneous packages present in the environment
    --isolated: 'Run the command in an isolated virtual environment [env: UV_ISOLATED=]'
    --keyring-provider=: Attempt to use `keyring` for authentication for index URLs
    --link-mode=: The method to use when installing packages from the global cache
    --locked: 'Assert that the `uv.lock` will remain unchanged [env: UV_LOCKED=]'
    --max-recursion-depth&=: Number of times that `uv run` will allow recursive invocations
    -m, --module: Run a Python module
    --no-active&: Prefer project's virtual environment over an active environment
    --no-all-extras&: ''
    --no-binary: Don't install pre-built wheels
    --no-binary-package=*: 'Don''t install pre-built wheels for a specific package [env: `UV_NO_BINARY_PACKAGE`=]'
    --no-build: Don't build source distributions
    --no-build-isolation: Disable isolation when building source distributions
    --no-build-isolation-package=*: Disable isolation when building source distributions for a specific package
    --no-build-package=*: 'Don''t build source distributions for a specific package [env: `UV_NO_BUILD_PACKAGE`=]'
    --no-compile-bytecode&: ''
    --no-compile&: ''
    --no-default-groups: Ignore the default dependency groups
    --no-dev: 'Disable the development dependency group [env: UV_NO_DEV=]'
    --no-editable: 'Install any editable dependencies, including the project and any workspace members, as non-editable [env: UV_NO_EDITABLE=]'
    --no-editable-package=*: Install the specified editable packages as non-editable
    --no-env-file: 'Avoid reading environment variables from a `.env` file [env: UV_NO_ENV_FILE=]'
    --no-extra=*: Exclude the specified optional dependencies, if `--all-extras` is supplied
    --no-frozen&: Disable frozen mode, overriding `UV_FROZEN`
    --no-group=*: 'Disable the specified dependency group [env: `UV_NO_GROUP`=]'
    --no-index: Ignore the registry index (e.g., PyPI), instead relying on direct URL dependencies and those provided via `--find-links`
    --no-locked&: Disable locked mode, overriding `UV_LOCKED`
    --no-project: Avoid discovering the project or workspace
    --no_workspace&: Avoid discovering the project or workspace
    --no-refresh&: ''
    --no-reinstall&: ''
    --no-sources: Ignore the `tool.uv.sources` table when resolving dependencies. Used to lock against the standards-compliant, publishable package metadata, as opposed to using any workspace, Git, URL, or local path sources
    --no-sources-package=*: 'Don''t use sources from the `tool.uv.sources` table for the specified packages [env: `UV_NO_SOURCES_PACKAGE`=]'
    --no-sync: 'Avoid syncing the virtual environment [env: UV_NO_SYNC=]'
    --no-upgrade&: ''
    --only-dev: Only include the development dependency group
    --only-group=*: Only include dependencies from the specified dependency group
    --package=: Run the command in a specific package in the workspace
    --pre&: ''
    --prerelease=: The strategy to use when considering pre-release versions
    --prerelease-package=*: The strategy to use when considering pre-release versions for a specific package
    -p, --python=: The Python interpreter to use for the run environment.
    --python-platform=: The platform for which requirements should be installed
    --refresh: Refresh all cached data
    --refresh-package=*: Refresh cached data for a specific package
    --reinstall: Reinstall all packages, regardless of whether they're already installed. Implies `--refresh`
    --force-reinstall&: Reinstall all packages, regardless of whether they're already installed. Implies `--refresh`
    --reinstall-package=*: Reinstall a specific package, regardless of whether it's already installed. Implies `--refresh-package`
    --resolution=: The strategy to use when selecting between the different compatible versions for a given package requirement
    -s, --script: Run the given path as a Python script
    --show-resolution&: 'Whether to show resolver and installer output from any environment modifications [env: UV_SHOW_RESOLUTION=]'
    -U, --upgrade: Allow package upgrades, ignoring pinned versions in any existing output file. Implies `--refresh`
    --upgrade-group=*: Allow upgrades for all packages in a dependency group, ignoring pinned versions in any existing output file
    -P, --upgrade-package=*: Allow upgrades for a specific package, ignoring pinned versions in any existing output file. Implies `--refresh-package`
    -w, --with=*: Run with the given packages installed
    --with-editable=*: Run with the given packages installed in editable mode
    --with-requirements=*: Run with the packages listed in the given files
  completion:
    flag:
      cache-dir:
      - $directories
      color:
      - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
      - "always\tEnables colored output regardless of the detected environment"
      - "never\tDisables colored output"
      config-file:
      - $files
      directory:
      - $directories
      env-file:
      - $files
      fork-strategy:
      - "fewest\tOptimize for selecting the fewest number of versions for each package. Older versions may be preferred if they are compatible with a wider range of supported Python versions or platforms"
      - "requires-python\tOptimize for selecting latest supported version of each package, for each supported Python version"
      index-strategy:
      - "first-index\tOnly use results from the first index that returns a match for a given package name"
      - "unsafe-first-match\tSearch for every package name across all indexes, exhausting the versions from the first index before moving on to the next"
      - "unsafe-best-match\tSearch for every package name across all indexes, preferring the \"best\" version found. If a package version is in multiple indexes, only look at the entry for the first index"
      keyring-provider:
      - "disabled\tDo not use keyring for credential lookup"
      - "subprocess\tUse the `keyring` command for credential lookup"
      link-mode:
      - "clone\tClone (i.e., copy-on-write) packages from the source into the destination"
      - "copy\tCopy packages from the source into the destination"
      - "hardlink\tHard link packages from the source into the destination"
      - "symlink\tSymbolically link packages from the source into the destination"
      prerelease:
      - "disallow\tDisallow all pre-release versions"
      - "allow\tAllow all pre-release versions"
      - "if-necessary\tPrefer stable versions, falling back to pre-release versions when necessary"
      - "explicit\tPrefer stable versions for first-party packages with explicit pre-release specifiers, falling back to pre-release versions when necessary. Disallow pre-release versions for all other packages"
      - "if-necessary-or-explicit\tDeprecated alias for `if-necessary`"
      project:
      - $directories
      python-fetch:
      - "automatic\tAutomatically download managed Python installations when needed"
      - "manual\tDo not automatically download managed Python installations; require explicit installation"
      - "never\tDo not ever allow Python downloads"
      python-platform:
      - "windows\tAn alias for `x86_64-pc-windows-msvc`, the default target for Windows"
      - "linux\tAn alias for `x86_64-unknown-linux-gnu`, the default target for Linux"
      - "macos\tAn alias for `aarch64-apple-darwin`, the default target for macOS"
      - "x86_64-pc-windows-msvc\tA 64-bit x86 Windows target"
      - "aarch64-pc-windows-msvc\tAn ARM64 Windows target"
      - "i686-pc-windows-msvc\tA 32-bit x86 Windows target"
