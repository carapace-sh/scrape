    --extra-index-url=*: '(Deprecated: use `--index` instead) Extra URLs of package indexes to use, in addition to `--index-url`'
    -f, --find-links=*: Locations to search for candidate distributions, in addition to those found in the registry indexes
    --fork-strategy=: The strategy to use when selecting multiple versions of a given package across Python versions and platforms
    --frozen: 'Audit the requirements without locking the project [env: UV_FROZEN=]'
    --ignore=*: Ignore a vulnerability by ID
    --ignore-until-fixed=*: Ignore a vulnerability by ID, but only while no fix is available
    --index=*: The indexes to use when resolving dependencies, in addition to the default index
    --index-strategy=: The strategy to use when resolving against multiple index URLs
    -i, --index-url=: '(Deprecated: use `--default-index` instead) The URL of the Python package index (by default: <https://pypi.org/simple>)'
    --keyring-provider=: Attempt to use `keyring` for authentication for index URLs
    --link-mode=: The method to use when installing packages from the global cache
    --locked: 'Assert that the `uv.lock` will remain unchanged [env: UV_LOCKED=]'
    --no-binary: Don't install pre-built wheels
    --no-binary-package=*: 'Don''t install pre-built wheels for a specific package [env: `UV_NO_BINARY_PACKAGE`=]'
    --no-build: Don't build source distributions
    --no-build-isolation: Disable isolation when building source distributions
    --no-build-isolation-package=*: Disable isolation when building source distributions for a specific package
    --no-build-package=*: 'Don''t build source distributions for a specific package [env: `UV_NO_BUILD_PACKAGE`=]'
    --no-default-groups: Don't audit the default dependency groups
    --no-dev: 'Don''t audit the development dependency group [env: UV_NO_DEV=]'
    --no-extra=*: Don't audit the specified optional dependencies
    --no-frozen&: Disable frozen mode, overriding `UV_FROZEN`
    --no-group=*: 'Don''t audit the specified dependency group [env: `UV_NO_GROUP`=]'
    --no-index: Ignore the registry index (e.g., PyPI), instead relying on direct URL dependencies and those provided via `--find-links`
    --no-locked&: Disable locked mode, overriding `UV_LOCKED`
    --no-sources: Ignore the `tool.uv.sources` table when resolving dependencies. Used to lock against the standards-compliant, publishable package metadata, as opposed to using any workspace, Git, URL, or local path sources
    --no-sources-package=*: 'Don''t use sources from the `tool.uv.sources` table for the specified packages [env: `UV_NO_SOURCES_PACKAGE`=]'
    --no-upgrade&: ''
    --only-dev: Only audit the development dependency group
    --only-group=*: Only audit dependencies from the specified dependency group
    --output-format=:
      description: Select the output format
      default: text
    --pre&: ''
    --prerelease=: The strategy to use when considering pre-release versions
    --prerelease-package=*: The strategy to use when considering pre-release versions for a specific package
    --python-platform=: The platform to use when auditing
    --python-version=: The Python version to use when auditing
    --resolution=: The strategy to use when selecting between the different compatible versions for a given package requirement
    --script=: Audit the specified PEP 723 Python script, rather than the current project
    --service-format=:
      description: The service format to use for vulnerability lookups
      default: osv
    --service-url=: The URL to vulnerability service API endpoint
    -U, --upgrade: Allow package upgrades, ignoring pinned versions in any existing output file. Implies `--refresh`
    --upgrade-group=*: Allow upgrades for all packages in a dependency group, ignoring pinned versions in any existing output file
    -P, --upgrade-package=*: Allow upgrades for a specific package, ignoring pinned versions in any existing output file. Implies `--refresh-package`
