      - $files
      directory:
      - $directories
      project:
      - $directories
      python-fetch:
      - "automatic\tAutomatically download managed Python installations when needed"
      - "manual\tDo not automatically download managed Python installations; require explicit installation"
      - "never\tDo not ever allow Python downloads"
      python-preference:
      - "only-managed\tOnly use managed Python installations; never use system Python installations"
      - "managed\tPrefer managed Python installations over system Python installations"
      - "system\tPrefer system Python installations over managed Python installations"
      - "only-system\tOnly use system Python installations; never use managed Python installations"
