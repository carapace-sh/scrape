# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: uv
description: An extremely fast Python package manager.
flags:
  -V, --version: Display the uv version
persistentflags:
  --allow-insecure-host=*: Allow insecure connections to a host
  --trusted-host=*&: Allow insecure connections to a host
  --allow-python-downloads&: 'Allow automatically downloading Python when required. [env: "UV_PYTHON_DOWNLOADS=auto"]'
  --cache-dir=: Path to the cache directory
  --color=: Control the use of color in output
  --config-file=: The path to a `uv.toml` file to use for configuration
  --directory=: Change to the given directory prior to running the command
  -h, --help: Display the concise help for this command
  --isolated&: 'Avoid discovering a `pyproject.toml` or `uv.toml` file [env: UV_ISOLATED=]'
  --managed-python: 'Require use of uv-managed Python versions [env: UV_MANAGED_PYTHON=]'
  --native-tls&: '(Deprecated: use `--system-certs` instead.) Whether to load TLS certificates from the platform''s native certificate store [env: UV_NATIVE_TLS=]'
  -n, --no-cache: Avoid reading from or writing to the cache, instead using a temporary directory for the duration of the operation
  --no-cache-dir&: Avoid reading from or writing to the cache, instead using a temporary directory for the duration of the operation
  --no-color&: Disable colors
  --no-config: Avoid discovering configuration files (`pyproject.toml`, `uv.toml`)
  --no-installer-metadata&: 'Skip writing `uv` installer metadata files (e.g., `INSTALLER`, `REQUESTED`, and `direct_url.json`) to site-packages `.dist-info` directories [env: UV_NO_INSTALLER_METADATA=]'
  --no-managed-python: 'Disable use of uv-managed Python versions [env: UV_NO_MANAGED_PYTHON=]'
  --no-native-tls&: ''
  --no-offline&: ''
  --no-preview&: ''
  --no-progress: 'Hide all progress outputs [env: UV_NO_PROGRESS=]'
  --no-python-downloads: 'Disable automatic downloads of Python. [env: "UV_PYTHON_DOWNLOADS=never"]'
  --no-system-certs&: ''
  --offline: 'Disable network access [env: UV_OFFLINE=]'
  --preview&: 'Whether to enable all experimental preview features [env: UV_PREVIEW=]'
  --preview-features&=*: Enable experimental preview features
  --preview-feature&=*: Enable experimental preview features
  --project=: Discover a project in the given directory
  --python-fetch&=: Deprecated version of [`Self::python_downloads`]
  --python-preference&=: ''
  -q, --quiet*: Use quiet output
  --show-settings&: Show the resolved settings for the current command
  --system-certs: 'Whether to load TLS certificates from the platform''s native certificate store [env: UV_SYSTEM_CERTS=]'
  -v, --verbose*: Use verbose output
completion:
  flag:
    cache-dir:
    - $directories
    color:
    - "auto\tEnables colored output only when the output is going to a terminal or TTY with support"
    - "always\tEnables colored output regardless of the detected environment"
    - "never\tDisables colored output"
    config-file:
    - $files
    directory:
    - $directories
    project:
    - $directories
    python-fetch:
    - "automatic\tAutomatically download managed Python installations when needed"
    - "manual\tDo not automatically download managed Python installations; require explicit installation"
    - "never\tDo not ever allow Python downloads"
    python-preference:
    - "only-managed\tOnly use managed Python installations; never use system Python installations"
    - "managed\tPrefer managed Python installations over system Python installations"
    - "system\tPrefer system Python installations over managed Python installations"
    - "only-system\tOnly use system Python installations; never use managed Python installations"
documentation:
  flag:
    allow-insecure-host: |-
      Allow insecure connections to a host.

      Can be provided multiple times.

      Expects to receive either a hostname (e.g., `localhost`), a host-port pair (e.g., `localhost:8080`), or a URL (e.g., `https://localhost`).

      WARNING: Hosts included in this list will not be verified against the system's certificate store. Only use `--allow-insecure-host` in a secure network with verified sources, as it bypasses SSL verification and could expose you to MITM attacks.
    cache-dir: |-
      Path to the cache directory.

      Defaults to `$XDG_CACHE_HOME/uv` or `$HOME/.cache/uv` on macOS and Linux, and `%LOCALAPPDATA%\uv\cache` on Windows.

      To view the location of the cache directory, run `uv cache dir`.
    color: |-
      Control the use of color in output.

      By default, uv will automatically detect support for colors when writing to a terminal.
    config-file: |-
      The path to a `uv.toml` file to use for configuration.

      While uv configuration can be included in a `pyproject.toml` file, it is not allowed in this context.
    directory: |-
      Change to the given directory prior to running the command.

      Relative paths are resolved with the given directory as the base.

      See `--project` to only change the project root directory.
    isolated: |-
      Avoid discovering a `pyproject.toml` or `uv.toml` file [env: UV_ISOLATED=]

      Normally, configuration files are discovered in the current directory, parent directories, or user configuration directories.

      This option is deprecated in favor of `--no-config`.
    managed-python: |-
      Require use of uv-managed Python versions [env: UV_MANAGED_PYTHON=]

      By default, uv prefers using Python versions it manages. However, it will use system Python versions if a uv-managed Python is not installed. This option disables use of system Python versions.
    native-tls: |-
      (Deprecated: use `--system-certs` instead.) Whether to load TLS certificates from the platform's native certificate store [env: UV_NATIVE_TLS=]

      By default, uv uses bundled Mozilla root certificates. When enabled, this flag loads certificates from the platform's native certificate store instead.

      This is equivalent to `--system-certs`.
    no-color: |-
      Disable colors.

      Provided for compatibility with `pip`, use `--color` instead.
    no-config: |-
      Avoid discovering configuration files (`pyproject.toml`, `uv.toml`).

      Normally, configuration files are discovered in the current directory, parent directories, or user configuration directories.
    no-managed-python: |-
      Disable use of uv-managed Python versions [env: UV_NO_MANAGED_PYTHON=]

      Instead, uv will search for a suitable Python version on the system.
    no-progress: |-
      Hide all progress outputs [env: UV_NO_PROGRESS=]

      For example, spinners or progress bars.
    offline: |-
      Disable network access [env: UV_OFFLINE=]

      When disabled, uv will only use locally cached data and locally available files.
    preview: |-
      Whether to enable all experimental preview features [env: UV_PREVIEW=]

      Preview features may change without warning.
    preview-features: |-
      Enable experimental preview features.

      Preview features may change without warning.

      Use comma-separated values or pass multiple times to enable multiple features.
    project: |-
      Discover a project in the given directory.

      All `pyproject.toml`, `uv.toml`, and `.python-version` files will be discovered by walking up the directory tree from the project root, as will the project's virtual environment (`.venv`).

      Other command-line arguments (such as relative paths) will be resolved relative to the current working directory.

      See `--directory` to change the working directory entirely.

      This setting has no effect when used in the `uv pip` interface.
    quiet: |-
      Use quiet output.

      Repeating this option, e.g., `-qq`, will enable a silent mode in which uv will write no output to stdout.
    show-settings: |-
      Show the resolved settings for the current command.

      This option is used for debugging and development purposes.
    system-certs: |-
      Whether to load TLS certificates from the platform's native certificate store [env: UV_SYSTEM_CERTS=]

      By default, uv uses bundled Mozilla root certificates, which improves portability and performance (especially on macOS).

      However, in some cases, you may want to use the platform's native certificate store, especially if you're relying on a corporate trust root (e.g., for a mandatory proxy) that's included in your system's certificate store.
    verbose: |-
      Use verbose output.

      You can configure fine-grained logging using the `RUST_LOG` environment variable. (<https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives>)
