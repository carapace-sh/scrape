# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: scc [flags] [files or directories]
description: scc [files or directories]
persistentflags:
  --avg-wage=:
    description: average wage value used for basic COCOMO calculation
    default: "56286"
  --binary: disable binary file detection
  --buckets=:
    description: time-bucket resolution for the git timeline reports
    default: "60"
  --by-author: render the author rollup report (bus factor and last-toucher attribution over recent git history)
  --by-file: display output for every file
  --ci: enable CI output settings where stdout is ASCII
  --cocomo-project-type=:
    description: change COCOMO model type [organic, semi-detached, embedded, "custom,1,1,1,1"]
    default: organic
  --cognitive: calculate cognitive (nesting-weighted) complexity
  --config=: load this file as the global config source; overrides SCC_CONFIG_PATH, honored even with --no-config
  --cost-comparison: show both COCOMO and LOCOMO estimates side by side
  --count-as-pattern=*: 'count files matching a path pattern as a new named category backed by a base language [repeatable; pattern is glob by default, prefix with re: for regex; e.g. *_spec.rb:"Ruby Spec":Ruby or re:\.test\.js$:"JavaScript Tests":JavaScript]'
  --count-as=: count extension as language [e.g. jsp:htm,chead:"C Header" maps extension jsp to html and chead to C Header]
  --count-ignore: set to allow .gitignore and .ignore files to be counted
  --count-unsupported: count files with an unrecognised language under an "Unknown" category as plain text
  --coupling: render the change-coupling report (file pairs that change together over recent git history)
  --coupling-for=: 'blast-radius view: given a file path, show what tends to change with it over recent git history'
  --coupling-weighted: weight coupling by file complexity so pairs of complex files rank above generated/data-file churn (implies --coupling)
  --currency-symbol=:
    description: set currency symbol
    default: $
  --debug: enable debug output
  --depth=:
    description: commit window size for git history reports; 0 means entire history (large repos may be slow)
    default: "1000"
  --directory-walker-job-workers=:
    description: controls the maximum number of workers which will walk the directory tree
    default: "8"
  --eaf=:
    description: the effort adjustment factor derived from the cost drivers (1.0 if rated nominal)
    default: "1"
  --exclude-dir=*:
    description: directories to exclude
    default: '[.git,.hg,.svn]'
  --exp-per-language-counters: 'experimental, may change or be removed: count with the scanner written for the file''s language where there is one, currently C, C Header and Java'
  --file-gc-count=:
    description: number of files to parse before turning the GC on
    default: "10000"
  --file-list-job-workers=:
    description: number of goroutine workers that turn a walked path into a job to be counted
    default: "4"
  --file-list-queue-size=:
    description: the size of the queue of files found and ready to be read into memory
    default: "4"
  --file-process-job-workers=:
    description: number of goroutine workers that process files collecting stats
    default: "4"
  --file-summary-job-queue-size=:
    description: the size of the queue used to hold processed file statistics before formatting
    default: "4"
  --find-root-config: discover the project .sccconfig by walking up to the repository root instead of using ./.sccconfig
  --format-multi=: have multiple format output overriding --format [e.g. tabular:stdout,csv:file.csv,json:file.json]
  --gen?: identify generated files
  --generated-markers=*:
    description: string markers in head of generated files
    default: '[do not edit,<auto-generated />]'
  --hotspots: render the hotspots report (files ranked by complexity × change frequency over recent git history)
  --ignore-file=*: path to an additional gitignore-format ignore file, applied from the scan root; repeat to add more, later files and any in-tree ignore files take precedence
  --include-symlinks: if set will count symlink files
  --large-byte-count=:
    description: number of bytes a file can contain before being removed from output
    default: "1000000"
  --large-line-count=:
    description: number of lines a file can contain before being removed from output
    default: "40000"
  --locomo: enable LOCOMO (LLM Output COst MOdel) cost estimation
  --locomo-config=: LOCOMO power-user config "tokensPerLine,inputPerLine,complexityWeight,iterations,iterationWeight"
  --locomo-cycles=: 'override estimated LLM iteration cycles (default: calculated from complexity)'
  --locomo-input-price=: LOCOMO cost per 1M input tokens in dollars (overrides preset)
  --locomo-output-price=: LOCOMO cost per 1M output tokens in dollars (overrides preset)
  --locomo-preset=:
    description: LOCOMO model preset [large, medium, small, local]
    default: medium
  --locomo-review=:
    description: human review minutes per line of code for LOCOMO estimate
    default: "0.01"
  --locomo-tps=: LOCOMO output tokens per second (overrides preset)
  --mcp: start as an MCP (Model Context Protocol) server over stdio
  --min-gen-line-length=:
    description: number of bytes per average line for file to be considered minified or generated
    default: "255"
  --min?: identify minified files
  --no-cocomo: remove COCOMO calculation output
  --no-config: disable auto-discovery of the SCC_CONFIG_PATH global and the project ./.sccconfig config
  --no-fold-authors: disable the name+email-domain identity folding fallback for git author reports (mailmap still applied)
  --no-gen?: ignore generated files in output (implies --gen)
  --no-gitignore: disables .gitignore file logic
  --no-gitmodule: disables .gitmodules file logic
  --no-hborder: remove horizontal borders between sections
  --no-ignore: disables .ignore file logic
  --no-large: ignore files over certain byte and line size set by large-line-count and large-byte-count
  --no-min-gen?: ignore minified or generated files in output (implies --min-gen)
  --no-min?: ignore minified files in output (implies --min)
  --no-scc-ignore: disables .sccignore file logic
  --no-size: remove size calculation output
  --overhead=:
    description: set the overhead multiplier for corporate overhead (facilities, equipment, accounting, etc.)
    default: "2.4"
  --remap-all=: inspect every file and remap by checking for a string and remapping the language [e.g. "-*- C++ -*-":"C Header"]
  --remap-unknown=: inspect files of unknown type and remap by checking for a string and remapping the language [e.g. "-*- C++ -*-":"C Header"]
  --report-skip=: comma-separated sections to omit (cocomo,locomo,hotspots,coupling,authors,timeline,files,uloc,linelength,card)
  --report-title=: override the repo name shown in the report banner
  --report?: write a self-contained HTML report; bare flag writes scc-report.html and prompts before overwriting, --report=path/out.html overwrites silently
  --size-unit=:
    description: set size unit [si, binary, mixed, xkcd-kb, xkcd-kelly, xkcd-imaginary, xkcd-intel, xkcd-drive, xkcd-bakers]
    default: si
  --sloccount-format: print a more SLOCCount like COCOMO calculation
  --sql-project=: use supplied name as the project identifier for the current run. Only valid with the --format sql or sql-insert option
  --timeline: render an over-time view of recent git history; with --by-author runs the author timeline, alone runs the languages timeline
  -M, --not-match=*: ignore files and directories matching regular expression
  -a, --dryness: calculate the DRYness of the project (implies --uloc)
  -c, --no-complexity: skip calculation of code complexity
  -d, --no-duplicates: remove duplicate files from stats and output
  -f, --format=:
    description: set output format [tabular, wide, json, json2, csv, csv-stream, cloc-yaml, html, html-table, sql, sql-insert, openmetrics]
    default: tabular
  -i, --include-ext=*: 'limit to file extensions [comma separated list: e.g. go,java,js]'
  -l, --languages: print supported languages and extensions
  -m, --character: calculate max and mean characters per line
  -n, --exclude-file=*:
    description: ignore files with matching names
    default: '[package-lock.json,Cargo.lock,yarn.lock,pubspec.lock,Podfile.lock,pnpm-lock.yaml]'
  -o, --output=: output filename (default stdout)
  -p, --percent: include percentage values in output
  -s, --sort=:
    description: column to sort by [files, name, lines, blanks, code, comments, complexity]
    default: files
  -t, --trace: enable trace output (not recommended when processing multiple files)
  -u, --uloc: calculate the number of unique lines of code (ULOC) for the project
  -v, --verbose: verbose output
  -w, --wide: wider output with additional statistics (implies --complexity)
  -x, --exclude-ext=*: 'ignore file extensions (overrides include-ext) [comma separated list: e.g. go,java,js]'
  -z, --min-gen?: identify minified or generated files
commands:
  - name: completion
    description: Generate the autocompletion script for the specified shell
    commands:
      - name: bash
        description: Generate the autocompletion script for bash
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the bash shell.

            This script depends on the 'bash-completion' package.
            If it is not installed already, you can install it via your OS's package manager.

            To load completions in your current shell session:

            	source <(scc completion bash)

            To load completions for every new session, execute once:

            #### Linux:

            	scc completion bash > /etc/bash_completion.d/scc

            #### macOS:

            	scc completion bash > $(brew --prefix)/etc/bash_completion.d/scc

            You will need to start a new shell for this setup to take effect.
      - name: fish
        description: Generate the autocompletion script for fish
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the fish shell.

            To load completions in your current shell session:

            	scc completion fish | source

            To load completions for every new session, execute once:

            	scc completion fish > ~/.config/fish/completions/scc.fish

            You will need to start a new shell for this setup to take effect.
      - name: powershell
        description: Generate the autocompletion script for powershell
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for powershell.

            To load completions in your current shell session:

            	scc completion powershell | Out-String | Invoke-Expression

            To load completions for every new session, add the output of the above command
            to your powershell profile.
      - name: zsh
        description: Generate the autocompletion script for zsh
        flags:
          --no-descriptions: disable completion descriptions
        documentation:
          command: |
            Generate the autocompletion script for the zsh shell.

            If shell completion is not already enabled in your environment you will need
            to enable it.  You can execute the following once:

            	echo "autoload -U compinit; compinit" >> ~/.zshrc

            To load completions in your current shell session:

            	source <(scc completion zsh)

            To load completions for every new session, execute once:

            #### Linux:

            	scc completion zsh > "${fpath[1]}/_scc"

            #### macOS:

            	scc completion zsh > $(brew --prefix)/share/zsh/site-functions/_scc

            You will need to start a new shell for this setup to take effect.
    documentation:
      command: |
        Generate the autocompletion script for scc for the specified shell.
        See each sub-command's help for details on how to use the generated script.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type scc help [path to command] for full details.
documentation:
  command: |-
    Sloc, Cloc and Code. Count lines of code in a directory with complexity estimation.
    Version 4.1.0
    Ben Boyter <ben@boyter.org> + Contributors
    https://github.com/boyter/scc
