# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: vhs <file>
description: Run a given tape file and generates its outputs.
flags:
    -o, --output*=: file name(s) of video output
    -p, --publish: publish your GIF to vhs.charm.sh and get a shareable URL
persistentflags:
    -q, --quiet: quiet do not log messages. If publish flag is provided, it will log shareable URL
commands:
    - name: completion
      description: Generate the autocompletion script for the specified shell
      hidden: true
      commands:
        - name: bash
          description: Generate the autocompletion script for bash
          flags:
            --no-descriptions: disable completion descriptions
        - name: fish
          description: Generate the autocompletion script for fish
          flags:
            --no-descriptions: disable completion descriptions
        - name: powershell
          description: Generate the autocompletion script for powershell
          flags:
            --no-descriptions: disable completion descriptions
        - name: zsh
          description: Generate the autocompletion script for zsh
          flags:
            --no-descriptions: disable completion descriptions
    - name: help [command]
      description: Help about any command
    - name: manual
      aliases:
        - man
      description: Generate man pages
      hidden: true
    - name: new <name>
      description: Create a new tape file with example tape file contents and documentation
    - name: publish <gif>
      description: Publish your GIF to vhs.charm.sh and get a shareable URL
    - name: record
      description: Create a new tape file by recording your actions
      flags:
        -s, --shell=: shell for recording
    - name: serve
      description: Start the VHS SSH server
    - name: themes
      description: List all the available themes, one per line
      flags:
        --markdown&: output as markdown
    - name: validate <file>...
      description: Validate a glob file path and parses all the files to ensure they are valid without running them.
