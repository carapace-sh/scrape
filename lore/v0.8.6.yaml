# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: lore
description: ''
flags:
  -h, --help: Print help
  --markdown-help&: ''
  -V, --version: Print version
persistentflags:
  --cache: Cache fragment payloads fetched from remote in the local store
  --compress-limit=: Set maximum number of parallel compress operations
  -d, --debug: Enable debug output
  --dry-run: Dry run mode, only report what would have been changed and perform no changes to local file system
  --file-count-limit=: Set maximum number of parallel files opened
  --file-size-limit=: Set maximum total size in bytes of parallel files opened
  -f, --force: Force the operation if possible
  --identity=: Use given identity
  -j, --json&: Enable machine-readable json output
  --local: Use local data
  --log-level=: Set the logging level
  --max-connections=: Set maximum number of parallel connections
  --max-threads&=: Set maximum total number of threads Lore sizes its pools for
  --no-gc: Prevent automatic incremental garbage collection for this command; it otherwise runs in the background on writes. `lore repository gc` always runs a full pass regardless
  -P, --no-pager: Disable pagination
  --nocompress&: Avoid using compression
  --non-interactive: Disable interactive prompts (e.g., per-link commit messages)
  --offline: Force offline mode
  --remote: Use remote data
  --repository=: Use given path as repository path
  --search-limit=: Set maximum number of revisions to search when matching or finding revisions
  --search-nearest: Set to search for nearest match when matching revisions
  -s, --silent&: Suppress all output
  --sync-data: Force sync data to storage media during flush
  -t, --time&: Time execution of command
commands:
- name: repository
  description: Repository commands
  flags:
    -h, --help: Print help
  commands:
  - name: status
    description: Show current repository status
    flags:
      --check-dirty: Verify already-dirty files against the filesystem without a full scan
      --count: Count directories and files (staged state if present, else current revision; view-filtered)
      -h, --help: Print help (see more with '--help')
      --reset: Drop the existing staged anchor before computing status. Combine with --scan to scan from a clean slate
      --revision-only: Only show revision info, skip all diffs
      --scan: Walk the filesystem under the given paths and reconcile every file against the current revision
      --targets=: Path to a targets file
      --unstaged&: Alias for --scan (backward compatibility)
    documentation:
      command: |-
        Show current repository status.

        Reports the staged revision (if any) and the files currently marked dirty. No filesystem walk runs by default — pass `--scan` to walk the filesystem and refresh dirty flags. See `lore status --help` (top-level alias) for the full workflow.
      flag:
        check-dirty: |-
          Verify already-dirty files against the filesystem without a full scan.

          Each file currently marked dirty is re-checked: one whose on-disk content still matches the tracked revision (same size, and same content when the modification time differs) has its dirty flag cleared and is dropped from the report, unless it is also staged. Adds, moves, copies, and deletes are always reported. The refreshed flags are persisted, so this requires write access.
        help: Print help (see a summary with '-h')
        scan: |-
          Walk the filesystem under the given paths and reconcile every file against the current revision.

          Detected modifications, adds, and deletes are marked dirty; stale dirty flags are cleared. The refreshed flags are persisted in the staged state so subsequent `lore stage` and `lore status` calls see an accurate picture without rescanning.

          Without `--scan`, status reports only what is currently tracked: the staged revision (if any) plus files already marked dirty. Mark files individually with `lore dirty` for targeted updates, or pass `--scan` here for bulk reconciliation.
  - name: info
    description: Get info about a repository
    flags:
      -h, --help: Print help
  - name: list
    description: List repositories
    flags:
      -h, --help: Print help
  - name: create
    description: Create a repository in the given directory
    flags:
      --description=: Optional description of repository
      -h, --help: Print help
      --id=: Optional ID of repository
      --shared-store-path=: Use this path rather than the system default as the shared store location
      --use-shared-store: Use the shared store rather than create a local immutable store
  - name: clone
    description: Clone a remote repository into the given path
    flags:
      --bare: Clone without files, only fetch latest revision tree
      --branch=: Optional branch to sync (shorthand for a full revision specifier)
      --dependency-depth-limit=:
        description: Maximum dependency traversal depth (0 means unlimited)
        default: '0'
      --dependency-recursive: Follow transitive dependencies recursively during dependency-based clone
      --dependency-tag=*: Tags to filter dependencies by during dependency-based clone
      --direct-file-io: Use direct file I/O instead of memory mapping files
      --direct-file-write: Write directly to the destination file instead of write to a temporary file and move into place
      -h, --help: Print help
      --layer=: Layer to add
      --layer-metadata=: Metadata key to link layer revisions with
      --no-tracking: Clone without local repository tracking (memory-only stores)
      --prefetch=: File containing list of files to prefetch
      --revision=: Optional revision to sync
      --root-file=*: Root files for dependency-based selective clone (only clone these files and their dependencies)
      --shared-store-path=: Use this path rather than the system default as the shared store location
      --use-shared-store: Use the shared store rather than create a local immutable store
      --view=: Optional client side view filter file
      --virtual: Clone virtually using split-write filesystem
  - name: delete
    description: Delete a repository
    flags:
      -h, --help: Print help
  - name: verify
    description: Verify repository state consistency
    flags:
      --heal: Attempt to heal discrepancies found in a new staged state
      -h, --help: Print help
      --path=: Optional path in the repository to start verification from (for state verification)
    commands:
    - name: state
      description: Verify repository state consistency (default)
      flags:
        --heal: Attempt to heal discrepancies found in a new staged state
        -h, --help: Print help
        --path=: Optional path in the repository to start verification from
    - name: fragment
      description: Verify a specific fragment in the local store
      flags:
        --context=: Context part of the address to verify
        --heal: Attempt to heal if verification fails (remote only)
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: state
        description: Verify repository state consistency (default)
      - name: fragment
        description: Verify a specific fragment in the local store
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: dump
    description: Dump repository state information
    flags:
      -h, --help: Print help
      --max-depth=: Optional max depth of tree dump
      --path=: Optional path in the repository to start dumping from
      --revision=: Optional revision to dump
  - name: gc
    description: Run a full garbage collection pass on the local repository store
    flags:
      -h, --help: Print help
  - name: store
    description: Access the repository data store
    flags:
      -h, --help: Print help
    commands:
    - name: immutable
      description: Operations on the immutable store
      flags:
        -h, --help: Print help
      commands:
      - name: query
        description: Query the store
        flags:
          -h, --help: Print help
          --recurse: Recurse into subfragments
      - name: help
        description: Print this message or the help of the given subcommand(s)
        commands:
        - name: query
          description: Query the store
        - name: help
          description: Print this message or the help of the given subcommand(s)
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: immutable
        description: Operations on the immutable store
        commands:
        - name: query
          description: Query the store
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: metadata
    description: Repository metadata operations
    flags:
      -h, --help: Print help
    commands:
    - name: get
      description: Get metadata from the repository (omit key to list all)
      flags:
        -h, --help: Print help
    - name: set
      description: Set metadata on the repository
      flags:
        --binary: Indicator that values are paths to binary files
        -h, --help: Print help
        --numeric: Indicator that values are numeric (u64)
    - name: clear
      description: Clear metadata from the repository
      flags:
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: get
        description: Get metadata from the repository (omit key to list all)
      - name: set
        description: Set metadata on the repository
      - name: clear
        description: Clear metadata from the repository
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: instance
    description: Instance management
    flags:
      -h, --help: Print help
    commands:
    - name: list
      description: List all registered instances for this repository
      flags:
        -h, --help: Print help
    - name: prune
      description: Remove stale instance entries
      flags:
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: list
        description: List all registered instances for this repository
      - name: prune
        description: Remove stale instance entries
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: config
    description: Read a configuration value
    flags:
      -h, --help: Print help
    commands:
    - name: get
      description: Get a configuration value
      flags:
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: get
        description: Get a configuration value
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: update-path
    description: Update the stored path for this instance
    flags:
      -h, --help: Print help
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: status
      description: Show current repository status
    - name: info
      description: Get info about a repository
    - name: list
      description: List repositories
    - name: create
      description: Create a repository in the given directory
    - name: clone
      description: Clone a remote repository into the given path
    - name: delete
      description: Delete a repository
    - name: verify
      description: Verify repository state consistency
      commands:
      - name: state
        description: Verify repository state consistency (default)
      - name: fragment
        description: Verify a specific fragment in the local store
    - name: dump
      description: Dump repository state information
    - name: gc
      description: Run a full garbage collection pass on the local repository store
    - name: store
      description: Access the repository data store
      commands:
      - name: immutable
        description: Operations on the immutable store
        commands:
        - name: query
          description: Query the store
    - name: metadata
      description: Repository metadata operations
      commands:
      - name: get
        description: Get metadata from the repository (omit key to list all)
      - name: set
        description: Set metadata on the repository
      - name: clear
        description: Clear metadata from the repository
    - name: instance
      description: Instance management
      commands:
      - name: list
        description: List all registered instances for this repository
      - name: prune
        description: Remove stale instance entries
    - name: config
      description: Read a configuration value
      commands:
      - name: get
        description: Get a configuration value
    - name: update-path
      description: Update the stored path for this instance
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: branch
  description: Branch commands
  flags:
    -h, --help: Print help
  commands:
  - name: list
    description: List available branches
    flags:
      --archived: Include archived local branches
      -h, --help: Print help
  - name: info
    description: Get info about the given branch
    flags:
      -h, --help: Print help
  - name: create
    description: Create a new branch
    flags:
      -h, --help: Print help
      --id=: Optional explicit branch ID (hex-encoded 16-byte identifier)
  - name: switch
    description: Switch to a different branch
    flags:
      --bare: Only update anchor tracking without modifying or verifying files, useful for bare repositories
      --dry-run: Do a dry run sync and only report what changes would be done, do not change anything in the file system
      -h, --help: Print help
      --local: Keep last local latest revision, do not sync latest revision from remote (implied by offline mode)
      --reset: Reset any local modified files to match the incoming revision
  - name: push
    description: Push commits to remote
    flags:
      --fast-forward-merge: Allow the server to fast-forward merge if the target branch head has moved
      -h, --help: Print help
  - name: merge
    description: Merge two branches
    flags:
      -h, --help: Print help
      --id=: ID of the source branch to merge into the current branch
      --message=: Change the message for committing when no conflicts arise from the merge
    commands:
    - name: unresolve
      description: Marks the merge unresolved
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
    - name: into
      description: Merge into branch
      flags:
        -h, --help: Print help
        --id=: ID of the target branch to merge the current branch into
        --ignore-links: Merge only the main repository, skipping all linked repositories
        --link=: Merge only a specific linked repository at the given mount path
    - name: start
      description: Start a merge process
      flags:
        --dry-run: Do a dry run merge start and only report what changes would be done, do not change anything in the file system
        -h, --help: Print help
        --id=: ID of the source branch to merge into the current branch
        --ignore-links: Merge only the main repository, skipping all linked repositories
        --link=: Merge only a specific linked repository at the given mount path
        --message=: Change the message for committing when no conflicts arise from the merge
        --no-commit: Disable auto commits even if no conflicts arise from the merge
    - name: restart
      description: Restart the merge, resetting the current merge state
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
    - name: resolve
      description: Resolves the merge
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
      commands:
      - name: mine
        description: Resolve using my changes
        flags:
          -h, --help: Print help
          --targets=: Path to a targets file
      - name: theirs
        description: Resolve using their changes
        flags:
          -h, --help: Print help
          --targets=: Path to a targets file
      - name: help
        description: Print this message or the help of the given subcommand(s)
        commands:
        - name: mine
          description: Resolve using my changes
        - name: theirs
          description: Resolve using their changes
        - name: help
          description: Print this message or the help of the given subcommand(s)
    - name: abort
      description: Abort a merge process
      flags:
        -h, --help: Print help
        --ignore-links: Abort only the main repository merge, keeping link pin updates
        --link=: Abort only a specific linked repository merge at the given mount path
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: unresolve
        description: Marks the merge unresolved
      - name: into
        description: Merge into branch
      - name: start
        description: Start a merge process
      - name: restart
        description: Restart the merge, resetting the current merge state
      - name: resolve
        description: Resolves the merge
        commands:
        - name: mine
          description: Resolve using my changes
        - name: theirs
          description: Resolve using their changes
      - name: abort
        description: Abort a merge process
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: diff
    description: Diff two branches using the common ancestor base revision Will calculate the set of changes between source branch latest revision and the base revision that is not in the set of changes between the target branch latest revision and the base revision
    flags:
      --auto-resolve: Attempt to auto resolve conflicts if true
      -h, --help: Print help
      --source=: Name of the source branch
  - name: archive
    description: Archive an existing branch
    flags:
      -h, --help: Print help
  - name: reset
    description: Reset local latest pointer for a branch
    flags:
      --branch=: Branch to reset, or the current branch if not set
      -h, --help: Print help
  - name: protect
    description: Protect a branch from direct pushes
    flags:
      -h, --help: Print help
  - name: unprotect
    description: Remove push protection from a branch
    flags:
      -h, --help: Print help
  - name: latest
    description: Branch latest related commands
    flags:
      -h, --help: Print help
    commands:
    - name: list
      description: ''
      flags:
        --branch=: Branch to query
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: list
        description: ''
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: metadata
    description: Branch metadata operations
    flags:
      -h, --help: Print help
    commands:
    - name: get
      description: Get metadata from the branch (omit key to list all)
      flags:
        --branch=: Branch name (uses current branch if not specified)
        -h, --help: Print help
    - name: set
      description: Set metadata on the branch
      flags:
        --binary: Indicator that values are paths to binary files
        --branch=: Branch name (uses current branch if not specified)
        -h, --help: Print help
        --numeric: Indicator that values are numeric (u64)
    - name: clear
      description: Clear metadata from the branch
      flags:
        --branch=: Branch name (uses current branch if not specified)
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: get
        description: Get metadata from the branch (omit key to list all)
      - name: set
        description: Set metadata on the branch
      - name: clear
        description: Clear metadata from the branch
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: list
      description: List available branches
    - name: info
      description: Get info about the given branch
    - name: create
      description: Create a new branch
    - name: switch
      description: Switch to a different branch
    - name: push
      description: Push commits to remote
    - name: merge
      description: Merge two branches
      commands:
      - name: unresolve
        description: Marks the merge unresolved
      - name: into
        description: Merge into branch
      - name: start
        description: Start a merge process
      - name: restart
        description: Restart the merge, resetting the current merge state
      - name: resolve
        description: Resolves the merge
        commands:
        - name: mine
          description: Resolve using my changes
        - name: theirs
          description: Resolve using their changes
      - name: abort
        description: Abort a merge process
    - name: diff
      description: Diff two branches using the common ancestor base revision Will calculate the set of changes between source branch latest revision and the base revision that is not in the set of changes between the target branch latest revision and the base revision
    - name: archive
      description: Archive an existing branch
    - name: reset
      description: Reset local latest pointer for a branch
    - name: protect
      description: Protect a branch from direct pushes
    - name: unprotect
      description: Remove push protection from a branch
    - name: latest
      description: Branch latest related commands
      commands:
      - name: list
        description: ''
    - name: metadata
      description: Branch metadata operations
      commands:
      - name: get
        description: Get metadata from the branch (omit key to list all)
      - name: set
        description: Set metadata on the branch
      - name: clear
        description: Clear metadata from the branch
    - name: help
      description: Print this message or the help of the given subcommand(s)
- name: revision
  description: Revision commands
  flags:
    -h, --help: Print help
  commands:
  - name: history
    description: List revisions of a repository
    flags:
      --branch=: Show branch revisions
      --date&=: Stop when reaching a revision created before this date (Unix timestamp)
      -h, --help: Print help
      --oneline: Output each revision on one line only
      --only-branch: Stop when reaching a revision on a different branch (includes the branch point revision)
      --revision=: Start listing from the specified revision. If not specified, start listing from the current branch latest revision
  - name: info
    description: Get info about a revision
    flags:
      --delta: Show delta information
      -h, --help: Print help
      --metadata: Show file metadata information
  - name: commit
    description: Commit the staged state
    flags:
      -h, --help: Print help
      --layer=: Commit only changes in this layer (mount path relative to repo root)
      --layer-message=*:
        description: 'Per-layer commit message. Takes two values: <path> <message>. Can be specified multiple times'
        nargs: 2
      --link=: Commit only changes in this linked repository (mount path relative to repo root)
      --link-message=*:
        description: 'Per-link commit message. Takes two values: <path> <message>. Can be specified multiple times'
        nargs: 2
      --stats: Print stats
  - name: amend
    description: Amend the latest commit's message
    flags:
      -h, --help: Print help
      --stats: Print stats
  - name: sync
    aliases:
    - synchronize
    description: Synchronize to a given state of a repository
    flags:
      --dependency-depth-limit=:
        description: Maximum dependency traversal depth (0 means unlimited)
        default: '0'
      --dependency-recursive: Follow transitive dependencies recursively during dependency-based sync
      --dependency-tag=*: Tags to filter dependencies by during dependency-based sync
      --forward-changes: Fast forward any local changes if syncing to a local revision
      -h, --help: Print help
      --reset: Reset any local modified files to match the incoming revision
      --root-file=*: Root files for dependency-based selective sync (only sync changes for these files and their dependencies)
  - name: bisect
    description: Binary search for a change introduced between start (exclusive) and end (inclusive.)
    flags:
      --end!=: The earliest revision known to have the change
      -h, --help: Print help
      --start!=: The latest revision known to not have the change
  - name: diff
    description: Diff two revisions
    flags:
      -h, --help: Print help
      --path=*: Optional path in repository
      --target=: Target revision to compare, by default the current revision
      --targets=: Path to a targets file
  - name: find
    description: Find revision
    flags:
      -h, --help: Print help
    commands:
    - name: metadata
      description: Find revision by metadata
      flags:
        -h, --help: Print help
    - name: number
      description: Find revision by number
      flags:
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: metadata
        description: Find revision by metadata
      - name: number
        description: Find revision by number
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: restore
    description: Restore current revision as latest revision
    flags:
      -h, --help: Print help
  - name: cherry-pick
    description: Cherry-pick a revision onto the currently synced revision
    flags:
      -h, --help: Print help
      --message=: Change the message for committing when no conflicts arise from the cherry-pick
      --no-commit: Disable auto commits even if no conflicts arise from the cherry-pick
    commands:
    - name: unresolve
      description: Marks the cherry-pick unresolved
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
    - name: restart
      description: Restart the cherry-pick, resetting the current cherry-pick state
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
    - name: resolve
      description: Resolve conflicts
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
      commands:
      - name: mine
        description: Resolve using my changes
        flags:
          -h, --help: Print help
          --targets=: Path to a targets file
      - name: theirs
        description: Resolve using the incoming changes
        flags:
          -h, --help: Print help
          --targets=: Path to a targets file
      - name: help
        description: Print this message or the help of the given subcommand(s)
        commands:
        - name: mine
          description: Resolve using my changes
        - name: theirs
          description: Resolve using the incoming changes
        - name: help
          description: Print this message or the help of the given subcommand(s)
    - name: abort
      description: Abort a cherry-pick
      flags:
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: unresolve
        description: Marks the cherry-pick unresolved
      - name: restart
        description: Restart the cherry-pick, resetting the current cherry-pick state
      - name: resolve
        description: Resolve conflicts
        commands:
        - name: mine
          description: Resolve using my changes
        - name: theirs
          description: Resolve using the incoming changes
      - name: abort
        description: Abort a cherry-pick
      - name: help
        description: Print this message or the help of the given subcommand(s)
  - name: revert
    description: Revert a revision from the currently synced revision
    flags:
      -h, --help: Print help
      --message=: Change the message for committing when no conflicts arise from the revert
      --no-commit: Disable auto commits even if no conflicts arise from the revert
    commands:
    - name: unresolve
      description: Marks the revert unresolved
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
    - name: restart
      description: Restart the revert, resetting the current revert state
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
    - name: resolve
      description: Resolve conflicts
      flags:
        -h, --help: Print help
        --targets=: Path to a targets file
      commands:
      - name: mine
        description: Resolve using my changes
        flags:
          -h, --help: Print help
          --targets=: Path to a targets file
      - name: theirs
        description: Resolve using the incoming changes
        flags:
          -h, --help: Print help
          --targets=: Path to a targets file
      - name: help
        description: Print this message or the help of the given subcommand(s)
        commands:
        - name: mine
          description: Resolve using my changes
        - name: theirs
          description: Resolve using the incoming changes
        - name: help
          description: Print this message or the help of the given subcommand(s)
    - name: abort
      description: Abort a revert
      flags:
        -h, --help: Print help
    - name: help
      description: Print this message or the help of the given subcommand(s)
      commands:
      - name: unresolve
        description: Marks the revert unresolved
      - name: restart
