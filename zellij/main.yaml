- name: list-sessions
  aliases:
  - ls
  description: List active sessions
  flags:
    -h, --help: Print help
    -n, --no-formatting: Do not add colors and formatting to the list (useful for parsing)
    -r, --reverse: List the sessions in reverse order (default is ascending order)
    -s, --short: Print just the session name
- name: list-aliases
  aliases:
  - la
  description: List existing plugin aliases
  flags:
    -h, --help: Print help
- name: attach
  aliases:
  - a
  description: Attach to a session
  flags:
    --ca-cert=: Path to a custom CA certificate (PEM format) for verifying the remote server
    -c, --create: Create a session if one does not exist
    -b, --create-background: Create a detached session in the background if one does not exist
    -f, --force-run-commands: If resurrecting a dead session, immediately run all its commands on startup
    --forget: Delete saved session before connecting
    -h, --help: Print help
    --index=: Number of the session index in the active sessions ordered creation date
    --insecure: Skip TLS certificate validation (DANGEROUS — development only)
    -r, --remember: Save session for automatic re-authentication (4 weeks)
    -t, --token=: Authentication token for remote sessions
  completion:
    flag:
      ca-cert:
      - $files
  commands:
  - name: options
    description: Change the behaviour of zellij
    flags:
      --advanced-mouse-actions=: Whether to enable mouse hover effects and pane grouping functionality default is true
      --attach-to-session=: Whether to attach to a session specified in "session-name" if it exists
      --auto-layout=: Whether to lay out panes in a predefined set of layouts whenever possible
      --client-async-worker-tasks=: Number of async worker tasks to spawn per active client
      --copy-clipboard=: OSC52 destination clipboard
      --copy-command=: Switch to using a user supplied command for clipboard instead of OSC52
      --copy-on-select=: Automatically copy when selecting text (true or false)
      --dangerously-enable-paste-buffer-read=: ''
      --default-cwd=: Set the default cwd
      --default-layout=: Set the default layout
      --default-mode=: Set the default mode
      --default-shell=: Set the default shell
      --disable-session-metadata=: If true, will disable writing session metadata to disk
      --focus-follows-mouse=: Whether to focus panes on mouse hover (true or false) default is false
      -h, --help: Print help (see more with '--help')
      --layout-dir=: Set the layout_dir, defaults to subdirectory of config dir
      --mirror-session=: Mirror session when multiple users are connected (true or false)
      --mouse-click-through=: Whether clicking a pane to focus it also sends the click into the pane (true or false) default is false
      --mouse-hover-effects=: Whether to enable mouse hover visual effects (frame highlight and help text) default is true
      --mouse-mode=: Set the handling of mouse events (true or false) Can be temporarily bypassed by the [SHIFT] key
      --mouse-scroll-resize=: Whether Ctrl+ScrollWheel resizes panes default is true
      --nested-session-handling=: How to handle a nested Zellij session detected inside a pane (ask, fullscreen, descend, never)
      --on-force-close=: Set behaviour on force close (quit or detach)
      --osc133-command-selection=: Whether triple-clicking inside shell-marked (OSC 133) command output selects the command and its output rather than the logical line default is true
      --osc8-hyperlinks=: Enable OSC8 hyperlink output (true or false)
      --pane-frame-style=: ''
      --pane-frames=: Set display of the pane frames (true or false)
      --post-command-discovery-hook=: A command to run after the discovery of running commands when serializing, for the purpose of manipulating the command (eg. with a regex) before it gets serialized
      --scroll-buffer-size=: ''
      --scrollback-editor=: Explicit full path to open the scrollback editor (default is $EDITOR or $VISUAL)
      --scrollback-lines-to-serialize=: Scrollback lines to serialize along with the pane viewport when serializing sessions, 0 defaults to the scrollback size. If this number is higher than the scrollback size, it will also default to the scrollback size
      --serialization-interval=: The interval at which to serialize sessions for resurrection (in seconds)
      --serialize-pane-viewport=: Whether pane viewports are serialized along with the session, default is false
      --session-name=: The name of the session to create when starting Zellij
      --session-serialization=: Whether sessions should be serialized to the HD so that they can be later resurrected, default is true
      --show-release-notes=: Whether to show release notes on first run of a new version default is true
      --show-startup-tips=: Whether to show startup tips when starting a new session default is true
      --simplified-ui=: Allow plugins to use a more simplified layout that is compatible with more fonts (true or false)
      --stacked-pane-list=: ''
      --stacked-resize=: Whether to stack panes when resizing beyond a certain size default is true
      --styled-underlines=: Whether to use ANSI styled underlines
      --support-kitty-graphics-protocol=: Whether to enable support for the Kitty graphics (image) protocol (must also be supported by the host terminal), defaults to true if the terminal supports it
      --support-kitty-keyboard-protocol=: Whether to enable support for the Kitty keyboard protocol (must also be supported by the host terminal), defaults to true if the terminal supports it
      --theme=: Set the default theme
      --theme-dark=: Theme name to apply when the host terminal reports a dark color palette (CSI 2031 / DSR 997). Requires `theme_light` to also be set; if either is missing the static `theme` remains authoritative
      --theme-dir=: Set the theme_dir, defaults to subdirectory of config dir
      --theme-light=: Theme name to apply when the host terminal reports a light color palette (CSI 2031 / DSR 997). Requires `theme_dark` to also be set; if either is missing the static `theme` remains authoritative
      --visual-bell=: Whether to show visual bell indicators (pane/tab frame flash and [!] suffix) default is true
      --web-server=: Whether to make sure a local web server is running when a new Zellij session starts. This web server will allow creating new sessions and attaching to existing ones that have opted in to being shared in the browser
      --web-sharing=: Whether to allow new sessions to be shared through a local web server, assuming one is running (see the `web_server` option for more details)
      --word-separators=: Characters that terminate a word when double-clicking to select it, in addition to whitespace (which is always a separator) default is "[]{}<>()"
