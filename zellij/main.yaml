    --width=: The width if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
    -x, --x=: The x coordinates if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
    -y, --y=: The y coordinates if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
