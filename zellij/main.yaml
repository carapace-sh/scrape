# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: zellij
description: A terminal workspace with batteries included
flags:
  -c, --config=: Change where zellij looks for the configuration file
  --config-dir=: Change where zellij looks for the configuration directory
  --data-dir=: Change where zellij looks for plugins
  -d, --debug: Specify emitting additional debug information
  -h, --help: Print help
  -l, --layout=: Name of a predefined layout inside the layout directory or the path to a layout file if inside a session (or using the --session flag) will be added to the session as a new tab or tabs, otherwise will start a new session
  --layout-string=: Raw KDL layout string to use directly (instead of a file path) if inside a session (or using the --session flag) will be added to the session as a new tab or tabs, otherwise will start a new session
  --max-panes=: 'Maximum panes on screen, caution: opening more panes will close old ones'
  -n, --new-session-with-layout=: Name of a predefined layout inside the layout directory or the path to a layout file Will always start a new session, even if inside an existing session
  --server&=: Run server listening at the specified socket path
  -s, --session=: Specify name of a new session
  -V, --version: Print version
completion:
  flag:
    config:
    - $files
    config-dir:
    - $files
    data-dir:
    - $files
    layout:
    - $files
    new-session-with-layout:
    - $files
    server:
    - $files
commands:
- name: options
  description: Change the behaviour of zellij
  flags:
    --advanced-mouse-actions=: Whether to enable mouse hover effects and pane grouping functionality default is true
    --attach-to-session=: Whether to attach to a session specified in "session-name" if it exists
    --auto-layout=: Whether to lay out panes in a predefined set of layouts whenever possible
    --client-async-worker-tasks=: Number of async worker tasks to spawn per active client
    --copy-clipboard=: OSC52 destination clipboard
    --copy-command=: Switch to using a user supplied command for clipboard instead of OSC52
    --copy-on-select=: Automatically copy when selecting text (true or false)
    --dangerously-enable-paste-buffer-read=: ''
    --default-cwd=: Set the default cwd
    --default-layout=: Set the default layout
    --default-mode=: Set the default mode
    --default-shell=: Set the default shell
    --disable-session-metadata=: If true, will disable writing session metadata to disk
    --focus-follows-mouse=: Whether to focus panes on mouse hover (true or false) default is false
    -h, --help: Print help (see more with '--help')
    --layout-dir=: Set the layout_dir, defaults to subdirectory of config dir
    --mirror-session=: Mirror session when multiple users are connected (true or false)
    --mouse-click-through=: Whether clicking a pane to focus it also sends the click into the pane (true or false) default is false
    --mouse-hover-effects=: Whether to enable mouse hover visual effects (frame highlight and help text) default is true
    --mouse-mode=: Set the handling of mouse events (true or false) Can be temporarily bypassed by the [SHIFT] key
    --mouse-scroll-resize=: Whether Ctrl+ScrollWheel resizes panes default is true
    --nested-session-handling=: How to handle a nested Zellij session detected inside a pane (ask, fullscreen, descend, never)
    --on-force-close=: Set behaviour on force close (quit or detach)
    --osc133-command-selection=: Whether triple-clicking inside shell-marked (OSC 133) command output selects the command and its output rather than the logical line default is true
    --osc8-hyperlinks=: Enable OSC8 hyperlink output (true or false)
    --pane-frame-style=: ''
    --pane-frames=: Set display of the pane frames (true or false)
    --post-command-discovery-hook=: A command to run after the discovery of running commands when serializing, for the purpose of manipulating the command (eg. with a regex) before it gets serialized
    --scroll-buffer-size=: ''
    --scrollback-editor=: Explicit full path to open the scrollback editor (default is $EDITOR or $VISUAL)
    --scrollback-lines-to-serialize=: Scrollback lines to serialize along with the pane viewport when serializing sessions, 0 defaults to the scrollback size. If this number is higher than the scrollback size, it will also default to the scrollback size
    --serialization-interval=: The interval at which to serialize sessions for resurrection (in seconds)
    --serialize-pane-viewport=: Whether pane viewports are serialized along with the session, default is false
    --session-name=: The name of the session to create when starting Zellij
    --session-serialization=: Whether sessions should be serialized to the HD so that they can be later resurrected, default is true
    --show-release-notes=: Whether to show release notes on first run of a new version default is true
    --show-startup-tips=: Whether to show startup tips when starting a new session default is true
    --simplified-ui=: Allow plugins to use a more simplified layout that is compatible with more fonts (true or false)
    --stacked-pane-list=: ''
    --stacked-resize=: Whether to stack panes when resizing beyond a certain size default is true
    --styled-underlines=: Whether to use ANSI styled underlines
    --support-kitty-graphics-protocol=: Whether to enable support for the Kitty graphics (image) protocol (must also be supported by the host terminal), defaults to true if the terminal supports it
    --support-kitty-keyboard-protocol=: Whether to enable support for the Kitty keyboard protocol (must also be supported by the host terminal), defaults to true if the terminal supports it
    --theme=: Set the default theme
    --theme-dark=: Theme name to apply when the host terminal reports a dark color palette (CSI 2031 / DSR 997). Requires `theme_light` to also be set; if either is missing the static `theme` remains authoritative
    --theme-dir=: Set the theme_dir, defaults to subdirectory of config dir
    --theme-light=: Theme name to apply when the host terminal reports a light color palette (CSI 2031 / DSR 997). Requires `theme_dark` to also be set; if either is missing the static `theme` remains authoritative
    --visual-bell=: Whether to show visual bell indicators (pane/tab frame flash and [!] suffix) default is true
    --web-server=: Whether to make sure a local web server is running when a new Zellij session starts. This web server will allow creating new sessions and attaching to existing ones that have opted in to being shared in the browser
    --web-sharing=: Whether to allow new sessions to be shared through a local web server, assuming one is running (see the `web_server` option for more details)
    --word-separators=: Characters that terminate a word when double-clicking to select it, in addition to whitespace (which is always a separator) default is "[]{}<>()"
  completion:
    flag:
      advanced-mouse-actions:
      - 'true'
      - 'false'
      attach-to-session:
      - 'true'
      - 'false'
      auto-layout:
      - 'true'
      - 'false'
      copy-clipboard:
      - system
      - primary
      copy-on-select:
      - 'true'
      - 'false'
      dangerously-enable-paste-buffer-read:
      - 'true'
      - 'false'
      default-cwd:
      - $files
      default-layout:
      - $files
      default-mode:
      - "normal\tIn `Normal` mode, input is always written to the terminal, except for the shortcuts leading to other modes"
      - "locked\tIn `Locked` mode, input is always written to the terminal and all shortcuts are disabled except the one leading back to normal mode"
      - "resize\t`Resize` mode allows resizing the different existing panes"
      - "pane\t`Pane` mode allows creating and closing panes, as well as moving between them"
      - "tab\t`Tab` mode allows creating and closing tabs, as well as moving between them"
      - "scroll\t`Scroll` mode allows scrolling up and down within a pane"
      - "enter-search\t`EnterSearch` mode allows for typing in the needle for a search in the scroll buffer of a pane"
      - "search\t`Search` mode allows for searching a term in a pane (superset of `Scroll`)"
      - "rename-tab\t`RenameTab` mode allows assigning a new name to a tab"
      - "rename-pane\t`RenamePane` mode allows assigning a new name to a pane"
      - "session\t`Session` mode allows detaching sessions"
      - "move\t`Move` mode allows moving the different existing panes within a tab"
      - "prompt\t`Prompt` mode allows interacting with active prompts"
      - "tmux\t`Tmux` mode allows for basic tmux keybindings functionality"
      default-shell:
      - $files
      disable-session-metadata:
      - 'true'
      - 'false'
      focus-follows-mouse:
      - 'true'
      - 'false'
      layout-dir:
      - $files
      mirror-session:
      - 'true'
      - 'false'
      mouse-click-through:
      - 'true'
      - 'false'
      mouse-hover-effects:
      - 'true'
      - 'false'
      mouse-mode:
      - 'true'
      - 'false'
      mouse-scroll-resize:
      - 'true'
      - 'false'
      nested-session-handling:
      - ask
      - fullscreen
      - descend
      - never
      on-force-close:
      - quit
      - detach
      osc133-command-selection:
      - 'true'
      - 'false'
      osc8-hyperlinks:
      - 'true'
      - 'false'
      pane-frame-style:
      - full
      - titles
      - none
      pane-frames:
      - 'true'
      - 'false'
      scrollback-editor:
      - $files
      serialize-pane-viewport:
      - 'true'
      - 'false'
      session-serialization:
      - 'true'
      - 'false'
      show-release-notes:
      - 'true'
      - 'false'
      show-startup-tips:
      - 'true'
      - 'false'
      simplified-ui:
      - 'true'
      - 'false'
      stacked-pane-list:
      - 'true'
      - 'false'
      stacked-resize:
      - 'true'
      - 'false'
      styled-underlines:
      - 'true'
      - 'false'
      support-kitty-graphics-protocol:
      - 'true'
      - 'false'
      support-kitty-keyboard-protocol:
      - 'true'
      - 'false'
      theme-dir:
      - $files
      visual-bell:
      - 'true'
      - 'false'
      web-server:
      - 'true'
      - 'false'
      web-sharing:
      - on
      - off
      - disabled
    positional:
    - - $files
    - - $files
    - - 'true'
      - 'false'
  documentation:
    flag:
      client-async-worker-tasks: |-
        Number of async worker tasks to spawn per active client.

        Allocating few tasks may result in resource contention and lags. Small values (around 4) should typically work best. Set to 0 to use the number of (physical) CPU cores. NOTE: This only applies to web clients at the moment.
      help: Print help (see a summary with '-h')
      web-server: |-
        Whether to make sure a local web server is running when a new Zellij session starts. This web server will allow creating new sessions and attaching to existing ones that have opted in to being shared in the browser.

        Note: a local web server can still be manually started from within a Zellij session or from the CLI. If this is not desired, one can use a version of Zellij compiled without web_server_capability

        Possible values: - true - false Default: false
      web-sharing: |-
        Whether to allow new sessions to be shared through a local web server, assuming one is running (see the `web_server` option for more details).

        Note: if Zellij was compiled without web_server_capability, this option will be locked to "disabled"

        Possible values: - "on" (new sessions will allow web sharing through the local web server if it is online) - "off" (new sessions will not allow web sharing unless they explicitly opt-in to it) - "disabled" (new sessions will not allow web sharing and will not be able to opt-in to it) Default: "off"
- name: setup
  description: Setup zellij and check its configuration
  flags:
    --check: Checks the configuration of zellij and displays currently used directories
    --clean: Disables loading of configuration file at default location, loads the defaults that zellij ships with
    --dump-config: Dump the default configuration file to stdout
    --dump-layout=: Dump specified layout to stdout
    --dump-plugins=: Dump the builtin plugins to DIR or "DATA DIR" if unspecified
    --dump-swap-layout=: Dump the specified swap layout file to stdout
    --generate-auto-start=: Generates auto-start script for the specified shell
    --generate-completion=: Generates completion for the specified shell
    -h, --help: Print help
  completion:
    flag:
      dump-plugins:
      - $files
- name: web
  description: Run a web server to serve terminal sessions
  flags:
    --cert=: The path to the SSL certificate (required if not listening on 127.0.0.1)
    --create-read-only-token: Create a read-only login token (can only attach to existing sessions as watcher)
    --create-token: Create a login token for the web interface, will only be displayed once and cannot later be retrieved. Returns the token name and the token
    -d, --daemonize: Run the server in the background
    -h, --help: Print help
    --ip=: The ip address to listen on locally for connections (defaults to 127.0.0.1)
    --key=: The path to the SSL key (required if not listening on 127.0.0.1)
    --list-tokens: List token names and their creation dates (cannot show actual tokens)
    --port=: The port to listen on locally for connections (defaults to 8082)
    --revoke-all-tokens: Revoke all login tokens
    --revoke-token=: Revoke a login token by its name
    --server-startup-timeout=: 'Timeout in seconds waiting for the server to start (default: 10). Only used on Windows where the daemonized server is polled via TCP. On Unix, startup signaling uses pipes and this option is ignored'
    --start: Start the server (default unless other arguments are specified)
    --status: Get the server status
    --stop: Stop the server
    --timeout=: 'Timeout in seconds for the status check (default: 30)'
    --token-name=: Optional name for the token
  completion:
    flag:
      cert:
      - $files
      key:
      - $files
- name: action
  aliases:
  - ac
  description: Send actions to a specific session
  flags:
    -h, --help: Print help
  commands:
  - name: write
    description: Write bytes to the terminal
    flags:
      -h, --help: Print help
      -p, --pane-id=: The pane_id of the pane, eg. terminal_1, plugin_2 or 3 (equivalent to terminal_3)
  - name: write-chars
    description: Write characters to the terminal
    flags:
      -h, --help: Print help
      -p, --pane-id=: The pane_id of the pane, eg. terminal_1, plugin_2 or 3 (equivalent to terminal_3)
  - name: paste
    description: Paste text to the terminal (using bracketed paste mode)
    flags:
      -h, --help: Print help
      -p, --pane-id=: The pane_id of the pane, eg. terminal_1, plugin_2 or 3 (equivalent to terminal_3)
  - name: send-keys
    description: Send one or more keys to the terminal (e.g., "Ctrl a", "F1", "Alt Shift b")
    flags:
      -h, --help: Print help
      -p, --pane-id=: The pane_id of the pane, eg. terminal_1, plugin_2 or 3 (equivalent to terminal_3)
  - name: resize
    description: '[increase|decrease] the focused panes area at the [left|down|up|right] border'
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: focus-next-pane
    description: Change focus to the next pane
    flags:
      -h, --help: Print help
  - name: focus-previous-pane
    description: Change focus to the previous pane
    flags:
      -h, --help: Print help
  - name: focus-pane-id
    description: Focus a specific pane by its ID
    flags:
      -h, --help: Print help
  - name: focus-last-pane
    description: Change focus to the last focused frame
    flags:
      -h, --help: Print help
  - name: move-focus
    description: Move the focused pane in the specified direction. [right|left|up|down]
    flags:
      -h, --help: Print help
  - name: move-focus-or-tab
    description: Move focus to the pane or tab (if on screen edge) in the specified direction [right|left|up|down]
    flags:
      -h, --help: Print help
  - name: move-pane
    description: Change the location of the focused pane in the specified direction or rotate forwrads [right|left|up|down]
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: move-pane-backwards
    description: Rotate the location of the previous pane backwards
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: clear
    description: Clear all buffers for a focused pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: dump-screen
    description: Dumps the viewport and optionally scrollback of a pane to a file or STDOUT
    flags:
      -a, --ansi: Preserve ANSI styling in the dump output
      -f, --full: Dump the pane with full scrollback
      -h, --help: Print help
      -p, --pane-id=: The pane_id of the pane, eg. terminal_1, plugin_2 or 3 (equivalent to terminal_3). If not specified, dumps the focused pane
      --path=: File path to dump the pane content to. If omitted, prints to STDOUT
    completion:
      flag:
        path:
        - $files
  - name: dump-layout
    description: Dump current layout to stdout
    flags:
      -h, --help: Print help
  - name: save-session
    description: Save the current session state to disk immediately
    flags:
      -h, --help: Print help
  - name: edit-scrollback
    description: Open the pane scrollback in your default editor
    flags:
      -a, --ansi: Preserve ANSI styling in the scrollback dump
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: scroll-up
    description: Scroll up in the focused pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: scroll-down
    description: Scroll down in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: scroll-to-bottom
    description: Scroll down to bottom in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: scroll-to-top
    description: Scroll up to top in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: page-scroll-up
    description: Scroll up one page in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: page-scroll-down
    description: Scroll down one page in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: half-page-scroll-up
    description: Scroll up half page in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: half-page-scroll-down
    description: Scroll down half page in focus pane
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: toggle-fullscreen
    description: Toggle between fullscreen focus pane and normal layout
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: toggle-no-ui-fullscreen
    description: Toggle between fullscreen over the entire display (including the UI bars) and normal layout
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: toggle-pane-frames
    description: Toggle frames around panes in the UI
    flags:
      -h, --help: Print help
  - name: set-pane-frame-style
    description: ''
    flags:
      -h, --help: Print help
    completion:
      positional:
      - - full
        - titles
        - none
  - name: toggle-active-sync-tab
    description: Toggle between sending text commands to all panes on the current tab and normal mode
    flags:
      -h, --help: Print help
      -t, --tab-id=: Target a specific tab by ID
  - name: new-pane
    description: 'Open a new pane in the specified direction [right|down] If no direction is specified, will try to use the biggest available space. Returns: Created pane ID (format: terminal_<id> or plugin_<id>)'
    flags:
      --block-until-exit: Block until the command exits (regardless of exit status) OR its pane has been closed
      --block-until-exit-failure: Block until the command exits with failure (non-zero exit status) OR its pane has been closed
      --block-until-exit-success: Block until the command exits successfully (exit status 0) OR its pane has been closed
      -b, --blocking: Block until the command has finished and its pane has been closed
      --borderless=: 'start this pane without a border (warning: will make it impossible to move with the mouse)'
      -c, --close-on-exit: Close the pane immediately when its command exits
      --close-replaced-pane: Close the replaced pane instead of suspending it (only effective with --in-place)
      --configuration=: ''
      --cwd=: Change the working directory of the new pane
      -d, --direction=: Direction to open the new pane in
      -f, --floating: Open the new pane in floating mode
      --height=: The height if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
      -h, --help: Print help
      -i, --in-place: Open the new pane in place of the current pane, temporarily suspending it
      -n, --name=: Name of the new pane
      --near-current-pane: if set, will open the pane near the current one rather than following the user's focus
      --no-focus: if set, will open the pane without changing the focus of any client, placing it relative to the pane the command was issued from
      --pane-id=: The pane to replace when opening in place, eg. terminal_1, plugin_2 or 3 (only effective with --in-place; defaults to the focused pane)
      --pinned=: Whether to pin a floating pane so that it is always on top
      -p, --plugin=: ''
      --skip-plugin-cache: ''
      --stacked: ''
      -s, --start-suspended: Start the command suspended, only running it after the you first press ENTER
      --tab-id=: Target a specific tab by ID
      --width=: The width if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
      -x, --x=: The x coordinates if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
      -y, --y=: The y coordinates if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
    completion:
      flag:
        borderless:
        - 'true'
        - 'false'
        cwd:
        - $files
        pinned:
        - 'true'
        - 'false'
  - name: edit
    description: 'Open the specified file in a new zellij pane with your default EDITOR Returns: Created pane ID (format: terminal_<id>)'
    flags:
      -b, --borderless=: 'start this pane without a border (warning: will make it impossible to move with the mouse)'
      --close-replaced-pane: Close the replaced pane instead of suspending it (only effective with --in-place)
      --cwd=: Change the working directory of the editor
      -d, --direction=: Direction to open the new pane in
      -f, --floating: Open the new pane in floating mode
      --height=: The height if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
      -h, --help: Print help
      -i, --in-place: Open the new pane in place of the current pane, temporarily suspending it
      -l, --line-number=: Open the file in the specified line number
      --near-current-pane: if set, will open the pane near the current one rather than following the user's focus
      --no-focus: if set, will open the pane without changing the focus of any client, placing it relative to the pane the command was issued from
      --pinned=: Whether to pin a floating pane so that it is always on top
      --tab-id=: Target a specific tab by ID
      --width=: The width if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
      -x, --x=: The x coordinates if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
      -y, --y=: The y coordinates if the pane is floating as a bare integer (eg. 1) or percent (eg. 10%)
    completion:
      flag:
        borderless:
        - 'true'
        - 'false'
        cwd:
        - $files
        pinned:
        - 'true'
        - 'false'
      positional:
      - - $files
  - name: switch-mode
    description: Switch input mode of all connected clients [locked|pane|tab|resize|move|search|session]
    flags:
      -h, --help: Print help (see more with '--help')
    completion:
      positional:
      - - "normal\tIn `Normal` mode, input is always written to the terminal, except for the shortcuts leading to other modes"
        - "locked\tIn `Locked` mode, input is always written to the terminal and all shortcuts are disabled except the one leading back to normal mode"
        - "resize\t`Resize` mode allows resizing the different existing panes"
        - "pane\t`Pane` mode allows creating and closing panes, as well as moving between them"
        - "tab\t`Tab` mode allows creating and closing tabs, as well as moving between them"
        - "scroll\t`Scroll` mode allows scrolling up and down within a pane"
        - "enter-search\t`EnterSearch` mode allows for typing in the needle for a search in the scroll buffer of a pane"
        - "search\t`Search` mode allows for searching a term in a pane (superset of `Scroll`)"
        - "rename-tab\t`RenameTab` mode allows assigning a new name to a tab"
        - "rename-pane\t`RenamePane` mode allows assigning a new name to a pane"
        - "session\t`Session` mode allows detaching sessions"
        - "move\t`Move` mode allows moving the different existing panes within a tab"
        - "prompt\t`Prompt` mode allows interacting with active prompts"
        - "tmux\t`Tmux` mode allows for basic tmux keybindings functionality"
    documentation:
      flag:
        help: Print help (see a summary with '-h')
  - name: toggle-pane-embed-or-floating
    description: Embed focused pane if floating or float focused pane if embedded
    flags:
      -h, --help: Print help
      -p, --pane-id=: Target a specific pane by ID (eg. terminal_1, plugin_2, or 3)
  - name: toggle-floating-panes
    description: Toggle the visibility of all floating panes in the current Tab, open one if none exist
