- name: pipe
  description: Send data to one or more plugins, launch them if they are not running
  flags:
    -a, --args=: The args of the pipe
    -h, --help: Print help
    -n, --name=: The name of the pipe
    -p, --plugin=: The plugin url (eg. file:/tmp/my-plugin.wasm) to direct this pipe to, if not specified, will be sent to all plugins, if specified and is not running, the plugin will be launched
    -c, --plugin-configuration=: 'The plugin configuration (note: the same plugin with different configuration is considered a different plugin for the purposes of determining the pipe destination)'
- name: subscribe
  description: Subscribe to pane render updates (viewport and scrollback)
  flags:
    --ansi: Preserve ANSI styling in the output
    -f, --format=:
      description: Output format
      default: raw
    -h, --help: Print help
    -p, --pane-id!=*:
      description: Pane ID(s) to subscribe to (e.g. terminal_1, plugin_2, or bare number like 1)
      nargs: -1
    -s, --scrollback=: Include scrollback lines in initial delivery. Bare --scrollback = all scrollback, --scrollback N = last N lines
  completion:
    flag:
      format:
      - raw
      - json
