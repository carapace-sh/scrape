# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: kubeadm
description: 'kubeadm: easily bootstrap a secure Kubernetes cluster'
persistentflags:
  --rootfs=: The path to the 'real' host root filesystem. This will cause kubeadm to chroot into the provided path.
  --vmodule=: comma-separated list of pattern=N settings for file-filtered logging
  -v, --v=:
    description: number for the log level verbosity
    default: "0"
commands:
  - name: alpha
    description: Kubeadm experimental sub-commands
  - name: certs
    aliases:
      - certificates
    description: Commands related to handling Kubernetes certificates
    commands:
      - name: certificate-key
        description: Generate certificate keys
        documentation:
          command: |2
            This command will print out a secure randomly-generated certificate key that can be used with
            the "init" command.

            You can also use "kubeadm init --upload-certs" without specifying a certificate key and it will
            generate and print one for you.
      - name: check-expiration
        description: Check certificates expiration for a Kubernetes cluster
        flags:
          --allow-missing-template-keys:
            description: If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats.
            default: "true"
          --cert-dir=:
            description: The path where to save the certificates
            default: /etc/kubernetes/pki
          --config=: Path to a kubeadm configuration file.
          --kubeconfig=:
            description: The kubeconfig file to use when talking to the cluster. If the flag is not set, a set of standard locations can be searched for an existing kubeconfig file.
            default: /etc/kubernetes/admin.conf
          --show-managed-fields: If true, keep the managedFields when printing objects in JSON or YAML format.
          -o, --output=:
            description: 'Output format. One of: text|json|yaml|kyaml|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-as-json|jsonpath-file.'
            default: text
        documentation:
          command: Checks expiration for the certificates in the local PKI managed by kubeadm.
      - name: generate-csr
        description: Generate keys and certificate signing requests
        flags:
          --cert-dir=: The path where to save the certificates
          --config=: Path to a kubeadm configuration file.
          --kubeconfig-dir=:
            description: The path where to save the kubeconfig file.
            default: /etc/kubernetes
        documentation:
          command: |-
            Generates keys and certificate signing requests (CSRs) for all the certificates required to run the control plane. This command also generates partial kubeconfig files with private key data in the  "users > user > client-key-data" field, and for each kubeconfig file an accompanying ".csr" file is created.

            This command is designed for use in [Kubeadm External CA Mode](https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/#external-ca-mode). It generates CSRs which you can then submit to your external certificate authority for signing.

            The PEM encoded signed certificates should then be saved alongside the key files, using ".crt" as the file extension, or in the case of kubeconfig files, the PEM encoded signed certificate should be base64 encoded and added to the kubeconfig file in the "users > user > client-certificate-data" field.
      - name: renew
        description: Renew certificates for a Kubernetes cluster
        commands:
          - name: admin.conf
            description: Renew the certificate embedded in the kubeconfig file for the admin to use and for kubeadm itself
            flags:
              --cert-dir=:
                description: The path where to save the certificates
                default: /etc/kubernetes/pki
              --config=: Path to a kubeadm configuration file.
              --kubeconfig=:
                description: The kubeconfig file to use when talking to the cluster. If the flag is not set, a set of standard locations can be searched for an existing kubeconfig file.
                default: /etc/kubernetes/admin.conf
            documentation:
              command: |-
                Renew the certificate embedded in the kubeconfig file for the admin to use and for kubeadm itself.

                Renewals run unconditionally, regardless of certificate expiration date; extra attributes such as SANs will be based on the existing file/certificates, there is no need to resupply them.

                Renewal by default tries to use the certificate authority in the local PKI managed by kubeadm; as alternative it is possible to use K8s certificate API for certificate renewal, or as a last option, to generate a CSR request.

                After renewal, in order to make changes effective, is required to restart control-plane components and eventually re-distribute the renewed certificate in case the file is used elsewhere.
          - name: all
            description: Renew all available certificates
            flags:
              --cert-dir=:
                description: The path where to save the certificates
                default: /etc/kubernetes/pki
              --config=: Path to a kubeadm configuration file.
              --kubeconfig=:
                description: The kubeconfig file to use when talking to the cluster. If the flag is not set, a set of standard locations can be searched for an existing kubeconfig file.
                default: /etc/kubernetes/admin.conf
            documentation:
              command: Renew all known certificates necessary to run the control plane. Renewals are run unconditionally, regardless of expiration date. Renewals can also be run individually for more control.
          - name: apiserver
            description: Renew the certificate for serving the Kubernetes API
            flags:
              --cert-dir=:
                description: The path where to save the certificates
                default: /etc/kubernetes/pki
              --config=: Path to a kubeadm configuration file.
              --kubeconfig=:
                description: The kubeconfig file to use when talking to the cluster. If the flag is not set, a set of standard locations can be searched for an existing kubeconfig file.
                default: /etc/kubernetes/admin.conf
            documentation:
              command: |-
                Renew the certificate for serving the Kubernetes API.

                Renewals run unconditionally, regardless of certificate expiration date; extra attributes such as SANs will be based on the existing file/certificates, there is no need to resupply them.

                Renewal by default tries to use the certificate authority in the local PKI managed by kubeadm; as alternative it is possible to use K8s certificate API for certificate renewal, or as a last option, to generate a CSR request.

                After renewal, in order to make changes effective, is required to restart control-plane components and eventually re-distribute the renewed certificate in case the file is used elsewhere.
          - name: apiserver-etcd-client
            description: Renew the certificate the apiserver uses to access etcd
            flags:
              --cert-dir=:
                description: The path where to save the certificates
                default: /etc/kubernetes/pki
