  - name: completion SHELL
    description: Output shell completion code for the specified shell (bash or zsh)
    documentation:
      command: |2-
        Output shell completion code for the specified shell (bash or zsh).
        The shell code must be evaluated to provide interactive
        completion of kubeadm commands. This can be done by sourcing it from
        the .bash_profile.

        Note: this requires the bash-completion framework.

        To install it on Mac use homebrew:
            $ brew install bash-completion
        Once installed, bash_completion must be evaluated. This can be done by adding the
        following line to the .bash_profile
            $ source $(brew --prefix)/etc/bash_completion

        If bash-completion is not installed on Linux, please install the 'bash-completion' package
        via your distribution's package manager.

        Note for zsh users: [1] zsh completions are only supported in versions of zsh >= 5.2
  - name: config
    description: Manage configuration for a kubeadm cluster persisted in a ConfigMap in the cluster
    persistentflags:
      --kubeconfig=:
        description: The kubeconfig file to use when talking to the cluster. If the flag is not set, a set of standard locations can be searched for an existing kubeconfig file.
        default: /etc/kubernetes/admin.conf
    commands:
      - name: images
        description: Interact with container images used by kubeadm
        commands:
          - name: list
            description: Print a list of images kubeadm will use. The configuration file is used in case any images or image repositories are customized
            flags:
              --allow-missing-template-keys:
                description: If true, ignore any errors in templates when a field or map key is missing in the template. Only applies to golang and jsonpath output formats.
                default: "true"
              --show-managed-fields: If true, keep the managedFields when printing objects in JSON or YAML format.
              -o, --output=:
                description: 'Output format. One of: text|json|yaml|kyaml|go-template|go-template-file|template|templatefile|jsonpath|jsonpath-as-json|jsonpath-file.'
                default: text
            persistentflags:
              --config=: Path to a kubeadm configuration file.
              --feature-gates=: |-
                A set of key=value pairs that describe feature gates for various features. Options are:
                RootlessControlPlane=true|false (ALPHA - default=false)
              --image-repository=:
                description: Choose a container registry to pull control plane images from
                default: registry.k8s.io
              --kubernetes-version=:
                description: Choose a specific Kubernetes version for the control plane.
                default: stable-1
          - name: pull
            description: Pull images used by kubeadm
            persistentflags:
              --config=: Path to a kubeadm configuration file.
              --cri-socket=: Path to the CRI socket to connect. If empty kubeadm will try to auto-detect this value; use this option only if you have more than one CRI installed or if you have non-standard CRI socket.
              --feature-gates=: |-
                A set of key=value pairs that describe feature gates for various features. Options are:
                RootlessControlPlane=true|false (ALPHA - default=false)
              --image-repository=:
                description: Choose a container registry to pull control plane images from
                default: registry.k8s.io
              --kubernetes-version=:
                description: Choose a specific Kubernetes version for the control plane.
                default: stable-1
      - name: migrate
        description: Read an older version of the kubeadm configuration API types from a file, and output the similar config object for the newer version
        flags:
          --allow-experimental-api: Allow migration to experimental, unreleased APIs.
          --new-config=: Path to the resulting equivalent kubeadm config file using the new API version. Optional, if not specified output will be sent to STDOUT.
          --old-config=: Path to the kubeadm config file that is using an old API version and should be converted. This flag is mandatory.
        documentation:
          command: |2
            This command lets you convert configuration objects of older versions to the latest supported version,
            locally in the CLI tool without ever touching anything in the cluster.
            In this version of kubeadm, the following API versions are supported:
            - kubeadm.k8s.io/v1beta4

            Further, kubeadm can only write out config of version "kubeadm.k8s.io/v1beta4", but read both types.
            So regardless of what version you pass to the --old-config parameter here, the API object will be
            read, deserialized, defaulted, converted, validated, and re-serialized when written to stdout or
            --new-config if specified.

            In other words, the output of this command is what kubeadm actually would read internally if you
            submitted this file to "kubeadm init"
      - name: print
        description: Print configuration
        commands:
          - name: init-defaults
            description: Print default init configuration, that can be used for 'kubeadm init'
            flags:
              --component-configs=*: 'A comma-separated list for component config API objects to print the default values for. Available values: [KubeProxyConfiguration KubeletConfiguration]. If this flag is not set, no component configs will be printed.'
            documentation:
              command: |2
                This command prints objects such as the default init configuration that is used for 'kubeadm init'.

                Note that sensitive values like the Bootstrap Token fields are replaced with placeholder values like "abcdef.0123456789abcdef" in order to pass validation but
                not perform the real computation for creating a token.
          - name: join-defaults
            description: Print default join configuration, that can be used for 'kubeadm join'
            documentation:
              command: |2
                This command prints objects such as the default join configuration that is used for 'kubeadm join'.

                Note that sensitive values like the Bootstrap Token fields are replaced with placeholder values like "abcdef.0123456789abcdef" in order to pass validation but
                not perform the real computation for creating a token.
          - name: reset-defaults
            description: Print default reset configuration, that can be used for 'kubeadm reset'
            documentation:
              command: |2
                This command prints objects such as the default reset configuration that is used for 'kubeadm reset'.

                Note that sensitive values like the Bootstrap Token fields are replaced with placeholder values like "abcdef.0123456789abcdef" in order to pass validation but
                not perform the real computation for creating a token.
          - name: upgrade-defaults
            description: Print default upgrade configuration, that can be used for 'kubeadm upgrade'
            documentation:
              command: |2
                This command prints objects such as the default upgrade configuration that is used for 'kubeadm upgrade'.

                Note that sensitive values like the Bootstrap Token fields are replaced with placeholder values like "abcdef.0123456789abcdef" in order to pass validation but
                not perform the real computation for creating a token.
        documentation:
          command: |2-
            This command prints configurations for subcommands provided.
            For details, see: https://pkg.go.dev/k8s.io/kubernetes/cmd/kubeadm/app/apis/kubeadm#section-directories
      - name: validate
        description: Read a file containing the kubeadm configuration API and report any validation problems
        flags:
          --allow-deprecated-api: Allow validation of deprecated APIs.
          --allow-experimental-api: Allow validation of experimental, unreleased APIs.
          --config=: Path to a kubeadm configuration file.
        documentation:
          command: |2
            This command lets you validate a kubeadm configuration API file and report any warnings and errors.
            If there are no errors the exit status will be zero, otherwise it will be non-zero.
            Any unmarshaling problems such as unknown API fields will trigger errors. Unknown API versions and
            fields with invalid values will also trigger errors. Any other errors or warnings may be reported
            depending on contents of the input file.

            In this version of kubeadm, the following API versions are supported:
            - kubeadm.k8s.io/v1beta4
    documentation:
      command: |2
        There is a ConfigMap in the kube-system namespace called "kubeadm-config" that kubeadm uses to store internal configuration about the
        cluster. kubeadm CLI v1.8.0+ automatically creates this ConfigMap with the config used with 'kubeadm init', but if you
        initialized your cluster using kubeadm v1.7.x or lower, you must use the 'kubeadm init phase upload-config' command to
        create this ConfigMap. This is required so that 'kubeadm upgrade' can configure your upgraded cluster correctly.
  - name: help [command]
    description: Help about any command
    documentation:
      command: |-
        Help provides help for any command in the application.
        Simply type kubeadm help [path to command] for full details.
  - name: init
    description: Run this command in order to set up the Kubernetes control plane
    flags:
      --apiserver-advertise-address=: The IP address the API Server will advertise it's listening on. If not set the default network interface will be used.
      --apiserver-bind-port=:
        description: Port for the API Server to bind to.
        default: "6443"
      --apiserver-cert-extra-sans=*: Optional extra Subject Alternative Names (SANs) to use for the API Server serving certificate. Can be both IP addresses and DNS names.
      --cert-dir=:
        description: The path where to save and store the certificates.
        default: /etc/kubernetes/pki
      --certificate-key=: Key used to encrypt the control-plane certificates in the kubeadm-certs Secret. The certificate key is a hex encoded string that is an AES key of size 32 bytes.
      --config=: Path to a kubeadm configuration file.
      --control-plane-endpoint=: Specify a stable IP address or DNS name for the control plane.
      --cri-socket=: Path to the CRI socket to connect. If empty kubeadm will try to auto-detect this value; use this option only if you have more than one CRI installed or if you have non-standard CRI socket.
      --dry-run: Don't apply any changes; just output what would be done.
      --feature-gates=: |-
        A set of key=value pairs that describe feature gates for various features. Options are:
        RootlessControlPlane=true|false (ALPHA - default=false)
      --ignore-preflight-errors=*: 'A list of checks whose errors will be shown as warnings. Example: ''IsPrivilegedUser,Swap''. Value ''all'' ignores errors from all checks.'
      --image-repository=:
        description: Choose a container registry to pull control plane images from
        default: registry.k8s.io
      --kubernetes-version=:
        description: Choose a specific Kubernetes version for the control plane.
        default: stable-1
      --node-name=: Specify the node name.
      --patches=: Path to a directory that contains files named "target[suffix][+patchtype].extension". For example, "kube-apiserver0+merge.yaml" or just "etcd.json". "target" can be one of "kube-apiserver", "kube-controller-manager", "kube-scheduler", "etcd", "kubeletconfiguration", "corednsdeployment", "kubeproxydaemonset". "patchtype" can be one of "strategic", "merge" or "json" and they match the patch formats supported by kubectl. The default "patchtype" is "strategic". "extension" must be either "json" or "yaml". "suffix" is an optional string that can be used to determine which patches are applied first alpha-numerically.
      --pod-network-cidr=: Specify range of IP addresses for the pod network. If set, the control plane will automatically allocate CIDRs for every node.
      --service-cidr=:
        description: Use alternative range of IP address for service VIPs.
        default: 10.96.0.0/12
      --service-dns-domain=:
        description: Use alternative domain for services, e.g. "myorg.internal".
        default: cluster.local
      --skip-certificate-key-print: Don't print the key used to encrypt the control-plane certificates.
      --skip-phases=*: List of phases to be skipped
      --skip-token-print: Skip printing of the default bootstrap token generated by 'kubeadm init'.
      --token-ttl=:
        description: The duration before the token is automatically deleted (e.g. 1s, 2m, 3h). If set to '0', the token will never expire
        default: 24h0m0s
      --token=: The token to use for establishing bidirectional trust between nodes and control-plane nodes. The format is [a-z0-9]{6}\.[a-z0-9]{16} - e.g. abcdef.0123456789abcdef
      --upload-certs: Upload control-plane certificates to the kubeadm-certs Secret.
    commands:
      - name: phase
        description: Use this command to invoke single phase of the "init" workflow
        commands:
          - name: addon
            description: Install required addons for passing conformance tests
            commands:
              - name: all
                description: Install all the addons
                flags:
                  --apiserver-advertise-address=: The IP address the API Server will advertise it's listening on. If not set the default network interface will be used.
                  --apiserver-bind-port=:
                    description: Port for the API Server to bind to.
                    default: "6443"
                  --config=: Path to a kubeadm configuration file.
