- name: format
  description: Run the Ruff formatter on the given files or directories
  flags:
    --cache-dir=: Path to the cache directory
    --check: Avoid writing any formatted files back; instead, exit with a non-zero status code if any files would have been modified, and zero otherwise
    --diff: Avoid writing any formatted files back; instead, exit with a non-zero status code and the difference between the current file and how the formatted file would look like
    --exclude=*: List of paths, used to omit files and/or directories from analysis
    --exit-non-zero-on-format: Exit with a non-zero status code if any files were modified via format, even if all files were formatted successfully
    --exit-non-zero-on-fix&: Exit with a non-zero status code if any files were modified via format, even if all files were formatted successfully
    --extend-exclude=*: Like --exclude, but adds additional files and directories on top of those already excluded
    --extension=*: List of mappings from file extension to language (one of `python`, `ipynb`, `pyi`). For example, to treat `.ipy` files as IPython notebooks, use `--extension ipy:ipynb`
    --force-exclude: Enforce exclusions, even for paths passed to Ruff directly on the command-line. Use `--no-force-exclude` to disable
    -h, --help: Print help (see more with '--help')
    --line-length=: Set the line-length
    -n, --no-cache: Disable cache reads
    --no-force-exclude&: ''
    --no-preview&: ''
    --no-respect-gitignore&: ''
    --output-format=: Output serialization format for violations, when used with `--check`. The default serialization format is "full"
    --preview: Enable preview mode; enables unstable formatting. Use `--no-preview` to disable
    --range=: |-
      When specified, Ruff will try to only format the code in the given range.
      It might be necessary to extend the start backwards or the end forwards, to fully enclose a logical line.
      The `<RANGE>` uses the format `<start_line>:<start_column>-<end_line>:<end_column>`.
    --respect-gitignore: Respect file exclusions via `.gitignore` and other standard ignore files. Use `--no-respect-gitignore` to disable
    --stdin-filename=: The name of the file when passing it through stdin
    --target-version=: The minimum Python version that should be supported
  completion:
    flag:
      cache-dir:
      - $files
      color:
      - "auto\tDisplay colors if the output goes to an interactive terminal"
      - "always\tAlways display colors"
      - "never\tNever display colors"
      output-format:
      - concise
      - full
      - json
      - json-lines
      - junit
      - grouped
      - github
      - gitlab
      - pylint
      - rdjson
      - azure
      - sarif
      stdin-filename:
      - $files
      target-version:
      - py37
      - py38
      - py39
      - py310
      - py311
      - py312
      - py313
      - py314
      - py315
    positionalany:
    - $files
  documentation:
    flag:
      range: |-
        When specified, Ruff will try to only format the code in the given range.
        It might be necessary to extend the start backwards or the end forwards, to fully enclose a logical line.
        The `<RANGE>` uses the format `<start_line>:<start_column>-<end_line>:<end_column>`.

        - The line and column numbers are 1 based.
        - The column specifies the nth-unicode codepoint on that line.
        - The end offset is exclusive.
        - The column numbers are optional. You can write `--range=1-2` instead of `--range=1:1-2:1`.
        - The end position is optional. You can write `--range=2` to format the entire document starting from the second line.
        - The start position is optional. You can write `--range=-3` to format the first three lines of the document.

        The option can only be used when formatting a single file. Range formatting of notebooks is unsupported.
