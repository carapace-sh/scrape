- name: config
  description: List or describe the available configuration options
  flags:
    -h, --help: Print help (see more with '--help')
    --output-format=:
      description: Output format
      default: text
  completion:
    flag:
      color:
      - "auto\tDisplay colors if the output goes to an interactive terminal"
      - "always\tAlways display colors"
      - "never\tNever display colors"
      output-format:
      - text
      - json
    positional:
    - - "cache-dir\tA path to the cache directory."
      - "extend\tA path to a local `pyproject.toml` or `ruff.toml` file to merge into this configuration. User home directory and environment variables will be expanded."
      - "output-format\tThe style in which violation messages should be formatted: `'full'` (default) (shows source), `'concise'`, `'grouped'` (group messages by file), `'json'` (machine-readable), `'junit'` (machine-readable XML), `'github'` (GitHub Actions annotations), `'gitlab'` (GitLab CI code quality report), `'pylint'` (Pylint text format) or `'azure'` (Azure Pipeline logging commands)."
      - "output-prefer-rule-codes\tWhether to prefer rule codes over human-readable rule names in diagnostic output, even when preview mode is enabled."
      - "fix\tEnable fix behavior by-default when running `ruff` (overridden by the `--fix` and `--no-fix` command-line flags). Only includes automatic fixes unless `--unsafe-fixes` is provided."
      - "unsafe-fixes\tEnable application of unsafe fixes. If excluded, a hint will be displayed when unsafe fixes are available. If set to false, the hint will be hidden."
      - "fix-only\tLike [`fix`](#fix), but disables reporting on leftover violation. Implies [`fix`](#fix)."
      - "show-fixes\tWhether to show an enumeration of all fixed lint violations (overridden by the `--show-fixes` command-line flag)."
      - "required-version\tEnforce a requirement on the version of Ruff, to enforce at runtime. If the version of Ruff does not meet the requirement, Ruff will exit with an error."
      - "preview\tWhether to enable preview mode. When preview mode is enabled, Ruff will use unstable rules, fixes, and formatting."
      - "exclude\tA list of file patterns to exclude from formatting and linting."
      - "extend-exclude\tA list of file patterns to omit from formatting and linting, in addition to those specified by [`exclude`](#exclude)."
      - "extend-include\tA list of file patterns to include when linting, in addition to those specified by [`include`](#include)."
      - "force-exclude\tWhether to enforce [`exclude`](#exclude) and [`extend-exclude`](#extend-exclude) patterns, even for paths that are passed to Ruff explicitly. Typically, Ruff will lint any paths passed in directly, even if they would typically be excluded. Setting `force-exclude = true` will cause Ruff to respect these exclusions unequivocally."
      - "include\tA list of file patterns to include when linting."
      - "respect-gitignore\tWhether to automatically exclude files that are ignored by `.ignore`, `.gitignore`, `.git/info/exclude`, and global `gitignore` files. Enabled by default."
      - "extension\tA mapping of custom file extensions to known file types (overridden by the `--extension` command-line flag)."
      - "builtins\tA list of builtins to treat as defined references, in addition to the system builtins."
      - "namespace-packages\tMark the specified directories as namespace packages. For the purpose of module resolution, Ruff will treat those directories and all their subdirectories as if they contained an `__init__.py` file."
      - "target-version\tThe minimum Python version to target, e.g., when considering automatic code upgrades, like rewriting type annotations. Ruff will not propose changes using features that are not available in the given version."
      - "per-file-target-version\tA list of mappings from glob-style file pattern to Python version to use when checking the corresponding file(s)."
      - "src\tThe directories to consider when resolving first- vs. third-party imports."
      - "line-length\tThe line length to use when enforcing long-lines violations (like `E501`) and at which `isort` and the formatter prefers to wrap lines."
      - "indent-width\tThe number of spaces per indentation level (tab)."
      - "lint\tConfigures how Ruff checks your code."
      - "lint.allowed-confusables\tA list of allowed 'confusable' Unicode characters to ignore when enforcing `RUF001`, `RUF002`, and `RUF003`."
      - "lint.dummy-variable-rgx\tA regular expression used to identify 'dummy' variables, or those which should be ignored when enforcing (e.g.) unused-variable rules. The default expression matches `_`, `__`, `_var`, and `_次`, but not `_var_` or `_次_`."
      - "lint.extend-ignore\tA list of rule codes or prefixes to ignore, in addition to those specified by `ignore`."
      - "lint.extend-select\tA list of rule codes or prefixes to enable, in addition to those specified by [`select`](#lint_select)."
      - "lint.extend-fixable\tA list of rule codes or prefixes to consider fixable, in addition to those specified by [`fixable`](#lint_fixable)."
