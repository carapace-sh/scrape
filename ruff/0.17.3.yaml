      - "never\tNever display colors"
  documentation:
    flag:
      preview: |-
        Enable preview mode. Use `--no-preview` to disable.

        This enables unstable server features and turns on the preview mode for the linter and the formatter.
- name: analyze
  description: Run analysis over Python source code
  flags:
    -h, --help: Print help (see more with '--help')
  completion:
    flag:
      color:
      - "auto\tDisplay colors if the output goes to an interactive terminal"
      - "always\tAlways display colors"
      - "never\tNever display colors"
  commands:
  - name: graph
    description: Generate a map of Python file dependencies or dependents
    flags:
      --detect-string-imports: Attempt to detect imports from string literals
      --direction=:
        description: The direction of the import map. By default, generates a dependency map, i.e., a map from file to files that it depends on. Use `--direction dependents` to generate a map from file to files that depend on it
        default: dependencies
      -h, --help: Print help (see more with '--help')
      --min-dots=: The minimum number of dots in a string import to consider it a valid import
      --no-preview&: ''
      --no-type-checking-imports&: ''
      --preview: Enable preview mode. Use `--no-preview` to disable
      --python=: Path to a virtual environment to use for resolving additional dependencies
      --target-version=: The minimum Python version that should be supported
      --type-checking-imports: Include imports that are only used for type checking (i.e., imports within `if TYPE_CHECKING:` blocks). Use `--no-type-checking-imports` to exclude imports that are only used for type checking
    completion:
      flag:
        color:
        - "auto\tDisplay colors if the output goes to an interactive terminal"
        - "always\tAlways display colors"
        - "never\tNever display colors"
        direction:
        - "dependencies\tConstruct a map from module to its dependencies (i.e., the modules that it imports)"
        - "dependents\tConstruct a map from module to its dependents (i.e., the modules that import it)"
        python:
        - $files
        target-version:
        - py37
        - py38
        - py39
        - py310
        - py311
        - py312
        - py313
        - py314
        - py315
      positionalany:
      - $files
  - name: help
    description: Print this message or the help of the given subcommand(s)
    commands:
    - name: graph
      description: Generate a map of Python file dependencies or dependents
    - name: help
      description: Print this message or the help of the given subcommand(s)
