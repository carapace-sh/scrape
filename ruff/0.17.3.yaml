# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: ruff
description: 'Ruff: An extremely fast Python linter and code formatter.'
flags:
  -h, --help: Print help (see more with '--help')
  -V, --version: Print version
persistentflags:
  --color=: Control when colored output is used
  --config=*: Either a path to a TOML configuration file (`pyproject.toml` or `ruff.toml`), or a TOML `<KEY> = <VALUE>` pair (such as you might find in a `ruff.toml` configuration file) overriding a specific configuration option (e.g., `--config "line-length = 100"` or `--config "format.quote-style = 'single'"`). Overrides of individual settings using this option always take precedence over all configuration files, including configuration files that were also specified using `--config`
  --isolated: Ignore all configuration files
  -q, --quiet: Print diagnostics, but nothing else
  -s, --silent: Disable all logging (but still exit with status code "1" upon detecting diagnostics)
  -v, --verbose: Enable verbose logging
completion:
  flag:
    color:
    - "auto\tDisplay colors if the output goes to an interactive terminal"
    - "always\tAlways display colors"
    - "never\tNever display colors"
documentation:
  flag:
    help: Print help (see a summary with '-h')
commands:
- name: check
  description: Run Ruff on the given files or directories
  flags:
    --add-ignore?: 'Enable automatic additions of `ruff: ignore` comments to failing lines. Optionally provide a reason to append after the codes. In preview, add suppression comments with rule names instead'
    --add-noqa?: Enable automatic additions of `noqa` directives to failing lines. Optionally provide a reason to append after the codes
    --cache-dir=: Path to the cache directory
    --diff: Avoid writing any fixed files back; instead, output a diff for each changed file to stdout, and exit 0 if there are no diffs. Implies `--fix-only`
    --dummy-variable-rgx&=: Regular expression matching the name of dummy variables
    --exclude=*: List of paths, used to omit files and/or directories from analysis
    --exit-non-zero-on-fix: Exit with a non-zero status code if any files were modified via fix, even if no lint violations remain
    -e, --exit-zero: Exit with status code "0", even upon detecting lint violations
    --extend-exclude=*: Like --exclude, but adds additional files and directories on top of those already excluded
    --extend-fixable=*: Like --fixable, but adds additional rule codes on top of those already specified
    --extend-ignore&=*: 'Like --ignore. (Deprecated: You can just use --ignore instead.)'
    --extend-per-file-ignores=*: Like `--per-file-ignores`, but adds additional ignores on top of those already specified
    --extend-select=*: Like --select, but adds additional rule codes on top of those already specified
    --extend-unfixable&=*: 'Like --unfixable. (Deprecated: You can just use --unfixable instead.)'
    --extension=*: List of mappings from file extension to language (one of `python`, `ipynb`, `pyi`). For example, to treat `.ipy` files as IPython notebooks, use `--extension ipy:ipynb`
    --fix: Apply fixes to resolve lint violations. Use `--no-fix` to disable or `--unsafe-fixes` to include unsafe fixes
    --fix-only: Apply fixes to resolve lint violations, but don't report on, or exit non-zero for, leftover violations. Implies `--fix`. Use `--no-fix-only` to disable or `--unsafe-fixes` to include unsafe fixes
    --fixable=*: List of rule codes to treat as eligible for fix. Only applicable when fix itself is enabled (e.g., via `--fix`)
    --force-exclude: Enforce exclusions, even for paths passed to Ruff directly on the command-line. Use `--no-force-exclude` to disable
    -h, --help: Print help (see more with '--help')
    --ignore=*: Comma-separated list of rule codes to disable
    --ignore-noqa: Ignore any `# noqa` comments
    --line-length&=: Set the line-length for length-associated rules and automatic formatting
    -n, --no-cache: Disable cache reads
    --no-fix&: ''
    --no-fix-only&: ''
    --no-force-exclude&: ''
    --no-preview&: ''
    --no-respect-gitignore&: ''
    --no-show-fixes&: ''
    --no-unsafe-fixes&: ''
    -o, --output-file=: 'Specify file to write the linter output to (default: stdout)'
    --output-format=: Output serialization format for violations. The default serialization format is "full"
    --per-file-ignores=*: List of mappings from file pattern to code to exclude
    --preview: Enable preview mode; checks will include unstable rules and fixes. Use `--no-preview` to disable
    --respect-gitignore: Respect file exclusions via `.gitignore` and other standard ignore files. Use `--no-respect-gitignore` to disable
    --select=*: Comma-separated list of rule codes to enable (or ALL, to enable all rules)
    --show-files: See the files Ruff will be run against with the current settings
    --show-fixes: Show an enumeration of all fixed lint violations. Use `--no-show-fixes` to disable
    --show-settings: See the settings Ruff will use to lint a given Python file
    --statistics: Show counts for every rule with at least one violation
    --stdin-filename=: The name of the file when passing it through stdin
    --target-version=: The minimum Python version that should be supported
    --unfixable=*: List of rule codes to treat as ineligible for fix. Only applicable when fix itself is enabled (e.g., via `--fix`)
    --unsafe-fixes: Include fixes that may not retain the original intent of the code. Use `--no-unsafe-fixes` to disable
    -w, --watch: Run in watch mode by re-running whenever files change
  completion:
    flag:
      cache-dir:
      - $files
