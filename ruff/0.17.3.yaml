      - "format.docstring-code-line-length\tSet the line length used when formatting code snippets in docstrings."
      - "analyze\tConfigures Ruff's `analyze` command."
      - "analyze.exclude\tA list of file patterns to exclude from analysis in addition to the files excluded globally (see [`exclude`](#exclude), and [`extend-exclude`](#extend-exclude))."
      - "analyze.preview\tWhether to enable preview mode. When preview mode is enabled, Ruff will expose unstable commands."
      - "analyze.direction\tWhether to generate a map from file to files that it depends on (dependencies) or files that depend on it (dependents)."
      - "analyze.detect-string-imports\tWhether to detect imports from string literals. When enabled, Ruff will search for string literals that 'look like' import paths, and include them in the import map, if they resolve to valid Python modules."
      - "analyze.string-imports-min-dots\tThe minimum number of dots in a string to consider it a valid import."
      - "analyze.include-dependencies\tA map from file path to the list of Python or non-Python file paths or globs that should be considered dependencies of that file, regardless of whether relevant imports are detected."
      - "analyze.type-checking-imports\tWhether to include imports that are only used for type checking (i.e., imports within `if TYPE_CHECKING:` blocks). When enabled (default), type-checking-only imports are included in the import graph. When disabled, they are excluded."
